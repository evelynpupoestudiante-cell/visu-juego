function nrm(s){
  return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
}

function chkB(){
  const id=SESS.queue[SESS.cur];
  const e=ALL.find(x=>x[D_ID]===id);
  const inp=document.getElementById('sci-inp');
  if(!inp||!inp.value.trim())return;
  inp.disabled=true;
  document.querySelector('.chk-btn').disabled=true;
  const ans=nrm(inp.value);
  const cor=nrm(e[D_SCI]);
  const parts=cor.split(' ');
  let grade='ko';
  if(ans===cor)grade='ok';
  else if(ans===parts[0]||ans===parts.slice(1).join(' '))grade='part';
  inp.classList.add(grade);
  const ok=grade==='ok';
  const part=grade==='part';
  answer(id,ok,part);
  showFb(id,ok,part);
  vib(ok);
}

// ── IMG ZONE ──────────────────────────────────────────────────────────────────
function imgCard(e,cc){
  return`<div class="q-card"><div class="img-zone" id="img-zone">
    <span class="img-spin">⌛</span></div></div>`;
}

async function loadImgZone(e){
  const id=e[D_ID];
  const idx=IIDX[id]||0;
  const du=await getImg(e,idx);
  await probeImgs(e);
  const total=IMG[id]?.variants?.length||0;
  const z=document.getElementById('img-zone');
  if(!z)return;
  if(du){
    z.innerHTML=`<img src="${du}" alt="${e[D_SCI]}">`+
      (total>1?`<button class="img-nav prev" onclick="imgNav(-1)" ${idx===0?'disabled':''}>‹</button>
        <button class="img-nav next" onclick="imgNav(1)" ${idx>=total-1?'disabled':''}>›</button>
        <span class="img-ctr">${idx+1}/${total}</span>`:'');
  } else {
    z.innerHTML=`<div class="img-ph">📷<br><small>${e[D_BASE]}1.jpg</small></div>`;
  }
}

async function imgNav(dir){
  const id=SESS.queue[SESS.cur];
  const e=ALL.find(x=>x[D_ID]===id);if(!e)return;
  await probeImgs(e);
  const total=IMG[id]?.variants?.length||1;
  IIDX[id]=Math.max(0,Math.min(total-1,(IIDX[id]||0)+dir));
  loadImgZone(e);
}

function tagLine(e,cc,hint){
  return`<div class="q-card">
    <div class="q-tag ${cc.cls}">
      <span class="q-dot" style="background:${cc.hex}"></span>
      <span>${e[D_CAT]} · ${e[D_SUB]}</span>
    </div>
    <div class="q-body"><div class="q-hint">${hint}</div></div>
  </div>`;
}

function fbDiv(){return`<div class="fb" id="fb"></div>`;}

// ── ANSWER & FEEDBACK ─────────────────────────────────────────────────────────
function answer(id,ok,part){
  SESS.total++;if(ok)SESS.correct++;
  const c=P.cards[id]||{};
  c.seen=true;
  c.fails=(c.fails||0)+(ok?0:1);
  P.cards[id]=c;
  P.stats.totalAnswers++;
  if(ok)P.stats.correct++;
}

function showFb(id,ok,part){
  const e=ALL.find(x=>x[D_ID]===id);
  const fb=document.getElementById('fb');
  if(!fb||!e)return;
  const cls=ok?'ok':part?'part':'ko';
  const icon=ok?'✓':part?'≈':'✗';
  const msg=ok?`<b>${icon} Correcto</b> · <i>${e[D_SCI]}</i>`
    :part?`<b>${icon} Parcial</b> · Nombre completo: <i>${e[D_SCI]}</i>`
    :`<b>${icon} Incorrecto</b> · <i>${e[D_SCI]}</i>`;
  fb.className='fb show '+cls;
  fb.innerHTML=msg+(e[D_MNEM]?`<div class="fb-mnem">💡 ${e[D_MNEM]}</div>`:'');

  clearSimTimer();
  const nb=document.createElement('button');
  nb.className='next-btn';
  nb.textContent=SESS.cur+1<SESS.queue.length?'Siguiente →':'Ver resultados';
  nb.onclick=()=>{
    // SM-2 auto-rating: ok→2(bien), part→1(difícil), wrong→0(blackout)
    const r=ok?2:part?1:0;
    const c=P.cards[id]||{};
    P.cards[id]={...c,...sm2(c,r),seen:true};
    SESS.cur++;
    renderCard();
  };
  fb.appendChild(nb);
}

function vib(ok){if(navigator.vibrate)navigator.vibrate(ok?[50]:[100,50,100]);}

// ── SIM TIMER ─────────────────────────────────────────────────────────────────
function startSimTimer(e){
  SESS.simLeft=30;
  SESS.simTimer=setInterval(()=>{
    SESS.simLeft--;
    const h=document.getElementById('sess-ttl');
    if(h)h.textContent='⏱ '+SESS.simLeft+'s';
    if(SESS.simLeft<=0){clearSimTimer();answer(e[D_ID],false,false);showFb(e[D_ID],false,false);}
  },1000);
}

function clearSimTimer(){
  if(SESS.simTimer){clearInterval(SESS.simTimer);SESS.simTimer=null;}
  const h=document.getElementById('sess-ttl');if(h)h.textContent=SESS.title;
}

// ── END SESSION ───────────────────────────────────────────────────────────────
async function endSess(){
  clearSimTimer();
  const t=today();
  const s=P.stats;
  if(s.lastSession!==t){
    const yd=new Date();yd.setDate(yd.getDate()-1);
    s.streak=s.lastSession===yd.toISOString().slice(0,10)?(s.streak||0)+1:1;
    s.lastSession=t;
  }
  s.totalSessions++;

  // Save to Drive
  setSaveStatus('Guardando en Drive…','');
  await saveP();
  updateHome();

  const pct=SESS.total?Math.round(SESS.correct/SESS.total*100):0;
  const em=pct>=80?'🏆':pct>=60?'⭐':'💪';
  document.getElementById('sum-body').innerHTML=`
    <div class="sum-em">${em}</div>
    <div class="sum-ttl">${SESS.total?pct+'% de aciertos':'Sesión terminada'}</div>
    <div class="sum-sub">${SESS.title} · ${SESS.total} preguntas</div>
    <div class="sum-grid">
      <div class="sum-card"><div class="sum-n" style="color:#4db87a">${SESS.correct}</div><div class="sum-l">Correctas</div></div>
      <div class="sum-card"><div class="sum-n" style="color:#e05060">${SESS.total-SESS.correct}</div><div class="sum-l">Falladas</div></div>
      <div class="sum-card"><div class="sum-n">${s.streak}🔥</div><div class="sum-l">Racha</div></div>
    </div>
    <div class="sum-bar-wrap">
      <div class="sum-bar-lbl">Precisión</div>
      <div class="sum-bar-trk"><div class="sum-bar-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="sum-btns">
      <button class="sum-btn sum-btn-pri" onclick="repeatSess()">Repetir sesión</button>
      <button class="sum-btn sum-btn-sec" onclick="show('s-home')">Ir al inicio</button>
    </div>`;
  show('s-sum');
}

function repeatSess(){SESS.cur=0;SESS.correct=0;SESS.total=0;show('s-sess');renderCard();}

function exitSess(){
  clearSimTimer();
  if(SESS.total===0){show('s-home');return;}
  if(confirm('¿Salir? El progreso se guardará.')){saveP();updateHome();show('s-home');}
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function showStats(){
  let h='';
  h+='<div class="st-sec"><div class="st-sec-ttl">Progreso por categoría</div>';
  for(const[cat,cc]of Object.entries(CAT_C)){
    const pool=ALL.filter(e=>e[D_CAT]===cat);
    const seen=pool.filter(e=>P.cards[e[D_ID]]?.seen).length;
    const pct=Math.round(seen/pool.length*100);
    h+=`<div class="cat-pg-row">
      <span class="cat-pg-nm" style="color:${cc.hex}">${cat}</span>
      <div class="cat-pg-trk"><div class="cat-pg-fill" style="width:${pct}%;background:${cc.hex}"></div></div>
      <span class="cat-pg-pct">${pct}%</span>
    </div>`;
  }
  h+='</div>';
  const fails=Object.entries(P.cards)
    .filter(([,c])=>(c.fails||0)>0)
    .sort((a,b)=>(b[1].fails||0)-(a[1].fails||0)).slice(0,10);
  if(fails.length){
    h+='<div class="st-sec"><div class="st-sec-ttl">Más falladas</div><div class="fails-list">';
    fails.forEach(([id,c])=>{
      const e=ALL.find(x=>x[D_ID]===id);if(!e)return;
      h+=`<div class="fail-item">
        <span style="font-size:11px;color:var(--txt2)">${e[D_CAT]}</span>
        <span class="fail-sci">${e[D_SCI]}</span>
        <span class="fail-n">${c.fails} fallos</span>
      </div>`;
    });
    h+='</div></div>';
  }
  const ta=P.stats.totalAnswers||0;
  const tc=P.stats.correct||0;
  h+=`<div class="st-sec"><div class="st-sec-ttl">Global</div><div class="st-glb">
    <div class="scard"><div class="scard-n">${P.stats.totalSessions||0}</div><div class="scard-l">Sesiones</div></div>
    <div class="scard"><div class="scard-n">${ta}</div><div class="scard-l">Respuestas</div></div>
    <div class="scard"><div class="scard-n">${ta?Math.round(tc/ta*100):0}%</div><div class="scard-l">Precisión</div></div>
  </div></div>`;
  document.getElementById('stats-body').innerHTML=h;
  show('s-stats');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadP();
</script>
