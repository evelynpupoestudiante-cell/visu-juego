nativo)","alta","Color amarillo dorado inalterable (nunca se oxida ni pierde el brillo) — diagnóstico absoluto","La 'prueba de la uña y el peso': si es amarillo brillante, se raya con la uña y pesa muchísimo para su tamaño, es oro. La pirita se raya con el acero y tiene caras estriadas","geología","mineral","Oro"],["MIN-032","Geología","Mineral","Cobre nativo","Cu (Cobre nativo)","media","Color rojo-cobre brillante característico cuando fresco; se oxida a verde (malaquita) o azul (azurita)","El 'mineral de los alambres': el único metal rojo que se puede doblar con la mano — la misma materia de los cables eléctricos, pero en roca","geología","mineral","Cobre"],["MIN-033","Geología","Mineral","Grafito","C (Grafito — alótropo de carbono)","alta","Color gris-negro metálico con brillo submetálico o graso; muy suave al tacto (jabonoso)","El 'carbono que se usa en los lápices': negro, jabonoso al tacto y tan blando que mancha los dedos. El diamante y el grafito son el mismo elemento con diferente estructura","geología","mineral","Grafito"],["MIN-034","Geología","Mineral","Corindón (rubí / zafiro)","Al₂O₃ (Corindón)","alta","Dureza 9 — el segundo mineral más duro tras el diamante (rayado solo por diamante)","El 'guardaespaldas del diamante': dureza 9 — solo el diamante (10) puede rayarlo. Si raya todo pero no al diamante, es corindón. El rubí es el corindón rojo; el zafiro es el azul","geología","mineral","Corindon"],["MIN-035","Geología","Mineral","Rutilo","TiO₂ (Rutilo)","media","Cristales prismáticos alargados de color rojo-pardo a negro con brillo adamantino","El 'cristal aguja rojo en el cuarzo': los cristales alargados rojo-pardos que aparecen como agujas dentro del cuarzo o en maclas de rejilla son inconfundibles","geología","mineral","Rutilo"],["MIN-036","Geología","Mineral","Casiterita","SnO₂ (Casiterita)","media","Color pardo-negro brillante con brillo adamantino intenso — como cristales de chocolate brillante","El 'cristal de chocolate que pesa como plomo': brillo adamantino pardo-negro y peso altísimo. Cuando un cristal oscuro pesa el doble de lo esperado, piensa en casiterita","geología","mineral","Casiterita"],["MIN-037","Geología","Mineral","Calcopirita","CuFeS₂ (Calcopirita)","alta","Color amarillo dorado con tinte verdoso — más amarillo que la pirita, más verdoso que el oro","La 'pirita verde-iridiscente': más verdosa y blanda que la pirita, con arcoíris de colores en la superficie oxidada — si brilla como pirita pero tiene visos verdes y azulados al girarla, es calcopirita","geología","mineral","Calcopirita"],["MIN-038","Geología","Mineral","Arsenopirita","FeAsS (Arsenopirita)","alta","Color gris-plateado metálico brillante con manchas pardas de oxidación","La 'piedra que huele a ajo al golpearla': el único mineral que al golpear con el martillo despide olor a ajo inconfundible. Si huele a ajo, es arsenopirita","geología","mineral","Arsenopirita"],["MIN-039","Geología","Mineral","Estibina (antimonita)","Sb₂S₃ (Estibina)","media","Cristales alargados y estriados longitudinalmente de color gris-plomo brillante","El 'lápiz de plomo metálico': cristales largos y estriados de color plomo brillante que parecen barras de grafito de lápiz pero metálicas. Esos cristales en haz son únicos","geología","mineral","Estibina"],["MIN-040","Geología","Mineral","Anhidrita","CaSO₄ (Anhidrita)","alta","Blanca a gris-azulada, sin brillo vidrioso fuerte (a diferencia del yeso que es más perláceo)","El 'yeso sin agua y más duro': blanco o gris, más duro que el yeso (no lo raya la uña) y con caras perfectamente rectangulares — el yeso deshidratado","geología","mineral","Anhidrita"],["MIN-041","Geología","Mineral","Celestina","SrSO₄ (Celestina)","media","Color azul cielo muy suave a incoloro — el azul más delicado entre los minerales comunes","El 'mineral del cielo azul pálido': el azul más suave y delicado que se puede imaginar en un mineral. Y si tienes duda, ponlo en una llama: el estroncio la vuelve roja carmesí","geología","mineral","Celestina"],["MIN-042","Geología","Mineral","Siderita","FeCO₃ (Siderita)","media","Color pardo-amarillento a gris-verdoso; brillo vítreo a perláceo","La 'calcita parda que no burbujea en frío': misma forma que la calcita pero marrón-amarillenta y notablemente más pesada. El ácido frío no produce burbujas (solo en polvo)","geología","mineral","Siderita"],["MIN-043","Geología","Mineral","Smithsonita","ZnCO₃ (Smithsonita)","media","Color muy variable: verde-menta, azul, amarillo, rosa, blanco o incoloro","El 'carbonato de racimos de uvas': la superficie botroidal con pequeñas bolas redondeadas + los colores pastel (verde-menta o azul) hacen que parezca hecha de caramelos","geología","mineral","Smithsonita"],["MIN-044","Geología","Mineral","Circón","ZrSiO₄ (Circón)","media","Cristales tetragonales bipiramidales cortos; brillo adamantino muy intenso","El 'cristal cuadrado más brillante de los sedimentos': los pequeños cristales tetragonales con brillo diamantino que aparecen en las arenas como minúsculos rubíes o diamantes","geología","mineral","Circon"],["MIN-045","Geología","Mineral","Topacio","Al₂SiO₄(F,OH)₂","media","Dureza 8 — el tercero más duro en la escala de Mohs (después de corindón y diamante)","El 'cuarzo que se parte en la base': cristales estriados como el cuarzo, pero con una cara de exfoliación perfecta en la base que el cuarzo no tiene — y mucho más duro","geología","mineral","Topacio"],["MIN-046","Geología","Mineral","Andalucita","Al₂SiO₅ (Andalucita)","alta","Cristales prismáticos con sección cuadrada; color rosado, pardo o verdoso","La 'piedra de la cruz española': la variedad quiastolita tiene una cruz negra perfecta en sección — la cruz es carbono atrapado durante el crecimiento del cristal","geología","mineral","Andalucita"],["MIN-047","Geología","Mineral","Tremolita-Actinolita","Ca₂(Mg,Fe)₅Si₈O₂₂(OH)₂","media","Cristales aciculares o prismáticos alargados; color blanco (tremolita) a verde oscuro (actinolita)","El 'anfíbol del mármol verde': largos cristales verdes o blancos con el ángulo de 120° diagnóstico de anfíbol. Si las fibras son sedosas y largas, es la variedad amianto","geología","mineral","Tremolita"],["MIN-048","Geología","Mineral","Clorita","(Mg,Fe,Al)₆(Si,Al)₄O₁₀(OH)₈","alta","Color verde intenso a verde oscuro — el más verde de los filosilicatos","La 'mica verde que no es elástica': láminas verdes parecidas a la biotita pero que no vuelven a su forma al doblarlas — si la lámina verde no rebota, es clorita","geología","mineral","Clorita"],["MIN-049","Geología","Mineral","Nefelina","NaAlSiO₄ (Nefelina)","media","Aspecto graso o resinoso gris-blancuzco; sin caras brillantes visibles (macizo)","El 'feldespato sin silicio que no puede estar con el cuarzo': si la roca ígnea tiene aspecto graso y no tiene cuarzo, puede ser nefelina — los feldespatoides huyen del cuarzo","geología","mineral","Nefelina"],["MIN-050","Geología","Mineral","Zeolita (estilbita / heulandita)","Grupo Zeolita (CaAl₂Si₇O₁₈·7H₂O)","media","Cristales tabulares o estelares blancos a incoloros con brillo perláceo o vítreo","La 'piedra que hierve y tiene poros': cristales blancos perláceos que llenan las burbujas del basalto y que al calentarlos liberan vapor de agua visible","geología","mineral","Zeolita"],["MIN-051","Geología","Mineral","Wollastonita","CaSiO₃ (Wollastonita)","media","Color blanco a gris-blancuzco; cristales aciculares o fibrosos sedosos","La 'cal que se convirtió en silicato': cuando una caliza es atravesada por un magma caliente, el CaCO₃ se transforma en wollastonita — el mineral blanco fibroso que marca el contacto","geología","mineral","Wollastonita"],["MIN-052","Geología","Mineral","Silvita","KCl (Silvita)","media","Aspecto idéntico a la halita (sal gema) pero sabor amargo o picante — diagnóstico sensorial clave","La 'sal que amarga': idéntica a la sal gema pero al probarla (si te dejan) tiene sabor amargo/picante en vez de salado — el único par de minerales que se diferencia por el sabor","geología","mineral","Silvita"],["MIN-053","Geología","Mineral","Vivianita","Fe₃(PO₄)₂·8H₂O (Vivianita)","baja","Color azul intenso a verde-azulado cuando expuesto al aire (se oxida rápidamente del blanco al azul)","El 'mineral que se tiñe de azul al respirar': incoloro recién extraído, se vuelve azul intenso en minutos al oxidarse al contacto con el aire — el fenómeno más espectacular de la mineralogía","geología","mineral","Vivianita"],["MIN-054","Geología","Mineral","Azurita","Cu₃(CO₃)₂(OH)₂ (Azurita)","alta","Azul intenso-cielo brillante — el azul más intenso de todos los minerales comunes","La 'compañera verde-azul del cobre': si ves azul intenso brillante junto a verde brillante en la misma muestra, es azurita+malaquita. Juntas siempre delatan un yacimiento de cobre","geología","mineral","Azurita"],["MIN-055","Geología","Mineral","Crisocola","Cu₂H₂Si₂O₅(OH)₄ (Crisocola)","media","Color azul-verde brillante a turquesa; aspecto masivo, resinoso o botroidal","El 'turquesa de la zona de oxidación del cobre': aspecto de plástico turquesa sin caras cristalinas — como esmalte azul-verde pintado en la roca","geología","mineral","Crisocola"],["ROC-001","Geología","Roca","Granito","Granito","muy_alta","Textura granular gruesa visible a simple vista: cuarzo gris + feldespato rosado + micas negras/plateadas","El 'pastel de tres colores': cuarzo gris + feldespato rosado + micas negras. Si ves los tres, granito","geología","roca","Granito"],["ROC-002","Geología","Roca","Basalto","Basalto","alta","Negro o gris muy oscuro; textura afanítica (grano tan fino que no se ven los minerales)","La 'piedra negra de los volcanes': oscura, densa, grano fino. Si tiene huecos redondos, es basalto vesicular","geología","roca","Basalto"],["ROC-003","Geología","Roca","Gabro","Gabro","media","Negro a verde muy oscuro con textura granular gruesa (grano visible)","El 'granito negro': misma textura granular que el granito pero completamente oscuro y sin cuarzo","geología","roca","Gabro"],["ROC-004","Geología","Roca","Obsidiana","Obsidiana (vidrio volcánico)","media","Negro brillante con fractura concoidea perfecta (como el vidrio roto)","El 'cristal negro de los aztecas': vidrio volcánico negro con bordes tan cortantes como una cuchilla","geología","roca","Obsidiana"],["ROC-005","Geología","Roca","Pumita (piedra pómez)","Pumita","media","Extraordinariamente ligera: flota en el agua","La 'roca que nada': la única roca que flota en el agua gracias a sus miles de burbujitas de gas","geología","roca","Pumita"],["ROC-006","Geología","Roca","Riolita","Riolita","media","Color claro: rosado, grisáceo o blanquecino","El 'granito volcánico': misma composición que el granito pero con grano fino y colores claros","geología","roca","Riolita"],["ROC-007","Geología","Roca","Caliza","Caliza (CaCO₃)","muy_alta","Reacciona vivamente con HCl (efervescencia): prueba diagnóstica definitiva","La 'roca del ácido': una gota de HCl y burbujea sin parar. La piedra de las catedrales y los karst","geología","roca","Caliza"],["ROC-008","Geología","Roca","Arenisca triásica (rodeno)","Arenisca (rodeno)","muy_alta","Textura arenosa visible: granos de cuarzo cementados entre sí","La 'lija roja del Triásico': aspereza característica y color rojo-ladrillo inconfundible en la serranía de Madrid","geología","roca","Arenisca"],["ROC-009","Geología","Roca","Conglomerado","Conglomerado","media","Cantos rodados (>2 mm) de diferentes rocas cementados en una matriz arenosa o arcillosa","La 'roca mosaico': mezcla de cantos rodados pegados. Como el fondo de un río cementado","geología","roca","Conglomerado"],["ROC-010","Geología","Roca","Arcilla (lutita)","Lutita / Arcilla compactada","media","Grano muy fino (< 0.004 mm): no se distinguen granos a simple vista","La 'roca de alfarero': se humedece, huele a tierra y se vuelve blanda. El barro hecho piedra","geología","roca","Arcilla"],["ROC-011","Geología","Roca","Yeso (roca evaporítica)","Roca de yeso","alta","Blanco mate a grisáceo; se raya con la uña (dureza 2)","La 'roca del escayolista': blanca, blanda (uña la raya) y sin efervescencia (diferencia de la caliza)","geología","roca","Yeso"],["ROC-012","Geología","Roca","Carbón (hulla)","Hulla (carbón bituminoso)","baja","Negro brillante con raya negra; muy ligero","La 'roca que arde': negro brillante, ligero y deja raya negra. El carbón de piedra","geología","roca","Carbon"],["ROC-013","Geología","Roca","Pizarra","Pizarra","alta","Exfoliación perfecta en láminas finas (clivaje pizarroso)","La 'roca de la pizarra escolar': se parte en láminas perfectas, gris oscura y grano finísimo","geología","roca","Pizarra"],["ROC-014","Geología","Roca","Esquisto","Esquisto","alta","Foliación bien desarrollada con minerales visibles alineados","La 'roca espejo': superficies brillantes de mica con minerales porfidoblásticos — más grueso y brillante que la pizarra","geología","roca","Esquisto"],["ROC-015","Geología","Roca","Gneis","Gneis","alta","Bandas alternadas claras (cuarzo + feldespato) y oscuras (micas + anfíboles)","El 'granito rayado': bandas claras y oscuras alternadas, como un código de barras en roca","geología","roca","Gneis"],["ROC-016","Geología","Roca","Mármol","Mármol","media","Blanco a gris con textura sacaroide (azucarada): cristales de calcita entrelazados","La 'caliza brillante': misma reacción al ácido pero textura azucarada cristalina y sin fósiles","geología","roca","Marmol"],["ROC-017","Geología","Roca","Cuarcita","Cuarcita","muy_alta","Muy dura y compacta; fractura concoidea (no se parte por los granos sino a través de ellos)","La 'arenisca de acero': parece una arenisca blanquecina pero es durísima y la fractura no respeta los granos","geología","roca","Cuarcita"],["ROC-018","Geología","Roca","Filita","Filita","baja","Brillo sedoso satinado en las superficies de foliación (más que la pizarra)","La 'pizarra satinada': más brillante que la pizarra por sus micas incipientes, más fina que el esquisto","geología","roca","Filita"],["ROC-019","Geología","Roca","Peridotita","Peridotita","baja","Dominantemente verde oscuro a negro por olivino y piroxeno","La 'roca del manto': verde oscura, muy pesada y sin cuarzo — viene de las profundidades","geología","roca","Peridotita"],["ROC-020","Geología","Roca","Diorita","Diorita","baja","Textura sal-pimienta: plagioclasa blanca + hornblenda negra en proporciones similares","El 'granito sal y pimienta': igual de granular que el granito pero sin cuarzo rosado, solo blanco y negro","geología","roca","Diorita"],["ROC-021","Geología","Roca","Andesita","Andesita","baja","Gris oscura a verdosa; textura afanítica o porfirítica","La 'roca de los Andes': gris con manchas blancas de plagioclasa, más clara que el basalto","geología","roca","Andesita"],["ROC-022","Geología","Roca","BrechaSedimentaria","Brecha","baja","Cantos angulosos (no redondeados) cementados en matriz fina","El 'conglomerado roto': misma idea pero fragmentos con aristas, no redondeados","geología","roca","BrechaSedimentaria"],["ROC-023","Geología","Roca","Sílex (pedernal)","Sílex (SiO₂ microcristalino)","media","Gris, negro o pardo; fractura concoidea perfecta con bordes muy cortantes","La 'roca de los cavernícolas': gris, durísima, fractura concoidea con filos cortantes y produce chispas","geología","roca","Silex"],["ROC-024","Geología","Roca","Dolomía","Dolomía","media","Aspecto similar a la caliza: gris a crema","La 'caliza reacia al ácido': si el HCl en frío no hace casi nada, es dolomía, no caliza","geología","roca","Dolomia"],["ROC-025","Geología","Roca","Travertino","Travertino","baja","Estructura porosa con huecos redondeados (moldes de vegetales o burbujas)","La 'caliza esponjosa de los baños termales': porosa con huecos de plantas y bandas de colores claros","geología","roca","Travertino"],["ROC-026","Geología","Roca","Granodiorita","Granodiorita","alta","Similar al granito pero más oscura: más plagioclasa que ortosa, más biotita+hornblenda","El 'granito un poco más oscuro': más minerales oscuros que el granito pero aún con cuarzo visible","geología","roca","Granodiorita"],["ROC-027","Geología","Roca","Migmatita","Migmatita","baja","Mezcla de material oscuro metamórfico y bandas claras de material fundido (leucosoma)","El 'gneis con marmoreo': bandas oscuras de esquisto más venas blancas de cuarzo-feldespato inyectadas","geología","roca","Migmatita"],["ROC-028","Geología","Roca","Corneana (hornfels)","Corneana","baja","Muy dura y compacta; aspecto córneo o vítreo","La 'roca 'hornada' por el magma': dura, compacta, oscura y sin bandas. El mármol del mundo sedimentario","geología","roca","Corneana"],["ROC-029","Geología","Roca","Pegmatita","Pegmatita","muy_alta","Cristales de tamaño gigantesco (centímetros a metros): la roca de mayor tamaño de cristal","El 'granito de los gigantes': mismos minerales que el granito pero con cristales tan grandes que se pueden coger con la mano. Si un 'granito' tiene cristales de 10 cm, es pegmatita","geología","roca","Pegmatita"],["ROC-030","Geología","Roca","Sienita","Sienita","alta","Como el granito pero SIN cuarzo visible — el feldespato domina sin acompañante de cuarzo","El 'granito sin cuarzo': rosado y de grano visible como el granito pero sin el cuarzo grisáceo entre los feldespatos. La ausencia de cuarzo es la clave","geología","roca","Sienita"],["ROC-031","Geología","Roca","Tonalita","Tonalita","media","Color gris claro; dominan las plagioclasas blancas sobre los feldespatos oscuros","El 'granito gris sin rosado': blanco-grisáceo uniforme sin los granos rosados de ortosa del granito. La ausencia del rosado del feldespato potásico lo distingue del granito","geología","roca","Tonalita"],["ROC-032","Geología","Roca","Aplita","Aplita","media","Color blanco a rosado claro; textura azucarada (cristales muy finos iguales entre sí)","El 'granito de azúcar blanco': dique blanco-rosado de grano finísimo que corta al granito — como si alguien hubiera rellenado las grietas del granito con azúcar muy fino","geología","roca","Aplita"],["ROC-033","Geología","Roca","Toba volcánica / Ignimbrita","Toba volcánica / Ignimbrita","alta","Roca de cenizas volcánicas cementadas; textura porosa-esponjosa o compacta","La 'ceniza petrificada': los fragmentos de pómez y ceniza atrapados y cementados forman esta roca ligera y porosa — la huella de una erupción violenta conservada en piedra","geología","roca","Toba"],["ROC-034","Geología","Roca","Traquita","Traquita","media","Color gris claro a blanquecino; superficie áspera al tacto (el nombre significa 'rugoso')","La 'basalto sin color y áspera al tacto': gris clara o blanquecina (a diferencia del basalto negro) y con esa textura rugosa que se nota con la yema del dedo — la volcánica de las islas alcalinas","geología","roca","Traquita"],["ROC-035","Geología","Roca","Dacita","Dacita","media","Color gris claro a blanquecino; más clara que el basalto, más oscura que la riolita","La 'andesita con cuarzo': si la roca volcánica grisácea tiene fenocristales de cuarzo redondeados en la matriz oscura, es dacita — el cuarzo en una roca volcánica andesítica es diagnóstico","geología","roca","Dacita"],["ROC-036","Geología","Roca","Calcarenita","Calcarenita","alta","Caliza de grano visible (tamaño arena): oolitos, bioclastos o peloides visibles sin lupa","La 'caliza de grano que se ve sin lupa': al contrario que la caliza microcristalina (afanítica), la calcarenita tiene granos visibles — oolitos como pequeñas perlas o trocitos de conchas","geología","roca","Calcarenita"],["ROC-037","Geología","Roca","Lumaquela","Lumaquela","alta","Roca formada casi exclusivamente por fragmentos de conchas acumulados — visible a simple vista","La 'roca que parece un cubo de conchas pegadas': las conchas completas o rotas visibles son el 100% de la roca — como si hubiera vaciado un cubo de mejillones y lo hubiera fosilizado","geología","roca","Lumaquela"],["ROC-038","Geología","Roca","Turbidita","Turbidita","alta","Alternancia regular de capas arenosas más gruesas (base) y pelíticas más finas (techo)","La 'roca de la avalancha submarina': cada capa empieza con arena gruesa (la avalancha) y acaba con fango fino (cuando la corriente se calma) — las rayas alternas muestran cada avalancha","geología","roca","Turbidita"],["ROC-039","Geología","Roca","Radiolarita","Radiolarita","media","Roca de sílice (SiO₂) biogénica: acumulación de caparazones de radiolarios","El 'sílex rojo de los fondos profundos': dura y brillante como el pedernal pero con tonos rojizos, verdes o negros — el sílex del fondo del océano hecho de esqueletos microscópicos","geología","roca","Radiolarita"],["ROC-040","Geología","Roca","Diatomita","Diatomita","media","Roca muy ligera (flota en agua), blanca y suave: literalmente polvo de caparazones de diatomeas","La 'tiza que pega a la lengua y no hace burbujas': blanca y suave como la caliza pero no reacciona con el ácido (sílice, no calcita). Y si la tocas con la lengua, la succiona","geología","roca","Diatomita"],["ROC-041","Geología","Roca","Sal gema / Halitita","Roca de sal (Halitita)","alta","Sabor salado inconfundible — el diagnóstico más directo de todo el visu","La 'roca que sabe a sal': el único caso donde el sabor da el diagnóstico al instante. Si te dejan probarla (siempre con precaución), la sal gema tiene sabor salado puro y limpio","geología","roca","Sal"],["ROC-042","Geología","Roca","Anfibolita","Anfibolita","alta","Color negro a verde oscuro; aspecto brillante por los anfíboles (hornblenda)","El 'esquisto negro y verde sin brillo de micas': negro y brillante por la hornblenda pero sin las láminas plateadas de las micas del esquisto — compacto y oscuro","geología","roca","Anfibolita"],["ROC-043","Geología","Roca","Granulita","Granulita","media","Textura granoblástica: granos equidimensionales sin foliación (aspecto de granito pero metamórfica)","El 'metamórfico que ha olvidado que es metamórfico': no tiene foliación ni micas — los granos son todos iguales como en una roca ígnea. El metamorfismo fue tan intenso que borró toda la estructura","geología","roca","Granulita"],["ROC-044","Geología","Roca","Eclogita","Eclogita","alta","Color verde y rojo: piroxeno verde (onfacita) + granate rojo o rosado — absolutamente diagnóstico","La 'roca verde y roja de las profundidades': solo hay una roca con ese patrón de verde intenso + rojo intenso en los mismos granos. El verde es piroxeno sódico, el rojo es granate — los 'semáforos de las profundidades'","geología","roca","Eclogita"],["ROC-045","Geología","Roca","Serpentinita","Serpentinita","alta","Color verde oscuro a negro-verdoso con aspecto aceitoso y brillante","La 'peridotita que se convirtió en serpiente': verde oscura con venas sinuosas en red — el manto oceánico que ha absorbido agua y se ha transformado. El 'mosaico verde' de la litosfera oceánica","geología","roca","Serpentinita"],["ROC-046","Geología","Roca","Skarn","Skarn (roca calcosilicatada)","alta","Colores muy vivos: verde, amarillo, marrón, rojo — el metamorfismo de contacto más llamativo","La 'joyería del contacto entre el granito y la caliza': colores vivísimos (verde, amarillo, rojo) en la zona de mezcla. Si la roca parece un arcoíris metálico en el contacto de dos rocas muy diferentes, es skarn","geología","roca","Skarn"],["ROC-047","Geología","Roca","Milonita","Milonita","media","Bandeado muy fino, casi como papel: láminas alternadas extremadamente delgadas","La 'roca estirada como chicle': las bandas son tan finas y los minerales tan alargados que parece que alguien estiró la roca como si fuera chicle. El resultado de millones de años de cizallamiento","geología","roca","Milonita"],["ROC-048","Geología","Roca","BrechaFalla","Brecha de falla / Cataclasita","media","Fragmentos angulosos de la roca encajante cementados por una matriz muy fina","La 'roca triturada de la falla': fragmentos angulosos de la propia roca cementados en matriz. Como la brecha sedimentaria pero todos los fragmentos son de la misma roca y están in situ","geología","roca","BrechaFalla"],["ROC-050","Geología","Roca","Flysch","Flysch","alta","Alternancia monótona de areniscas y margas/arcillas en capas de pocos centímetros a metros","La 'baraja de naipes de roca': alternancia monótona de arenisca (la cara) y marga (el dorso) repetida miles de veces. Si parece un apilado de barajas, es flysch","geología","roca","Flysch"],["ALG-001","Botánica","Alga","Lechuga de mar","Ulva lactuca","alta","Talo laminar, brillante, verde intenso, muy delgado (2 células de espesor)","La 'lechuga del mar': verde brillante, finísima y ondulada — la alga verde por excelencia","botánica","alga","Ulvalactuca"],["ALG-002","Botánica","Alga","Fucus (sargazo vesiculoso)","Fucus vesiculosus","alta","Talo dicotómico con nervio central evidente; color pardo-oliváceo","El 'alga de los globos': las bolsitas de aire a lo largo del talo hacen 'pop' al apretar — inconfundible","botánica","alga","Fucusvesiculosus"],["ALG-003","Botánica","Alga","Coral de mar (alga coralina)","Corallina officinalis","alta","Talo articulado, erecto y calcificado (duro al tacto como hueso o coral)","El 'alga roja que parece coral': articulada, calcificada y rígida — la única alga que suena al golpearla porque tiene cal dentro","botánica","alga","Corallinaofficinalis"],["ALG-004","Botánica","Alga","Laminaria (kelp)","Laminaria hyperborea","media","Talo diferenciado en estipe (tallo), rizoide (raíz) y lámina (hoja) — máxima organización en algas","El 'árbol del mar': diferenciada en 'raíz', 'tronco' y 'hoja' pero sin ser planta. La más grande y organizada","botánica","alga","Laminariahyperborea"],["ALG-005","Botánica","Alga","Posidonia","Posidonia oceanica","media","Hojas acintadas largas (hasta 1 m), verde brillante con nervación paralela — es una planta con flores","La 'hierba del Mediterráneo': hojas verdes acintadas en el fondo del mar — parece un alga pero es una planta con flores de verdad","botánica","alga","Posidoniaoceanica"],["AMP-001","Botánica","Árbol","Pino resinero / Pino marítimo","Pinus pinaster","alta","Acículas muy largas (10-25 cm), en parejas, rígidas y torcidas — las más largas de los pinos ibéricos","El 'pino de las agujas largas': las acículas son las más largas y rígidas de los pinos ibéricos — si las acículas son más largas que tu mano, es pinaster","botánica","árbol","Pinuspinaster"],["AMP-002","Botánica","Árbol","Ciprés común","Cupressus sempervirens","alta","Porte columnar o piramidal muy estrecho y erecto — silueta inconfundible en el paisaje","El 'lápiz verde del Mediterráneo': la silueta columnar perfectamente vertical es inconfundible en el horizonte — ningún otro árbol español tiene esa forma de cohete","botánica","árbol","Cupressussempervirens"],["AMP-003","Botánica","Árbol","Roble pedunculado / Carballo","Quercus robur","alta","Hojas con base auriculada (con orejillas) y peciolo muy corto (casi sésiles)","El 'roble de las bellotas en palito largo': las bellotas cuelgan en un pedúnculo larguísimo — si las bellotas cuelgan en una vara larga, es Quercus robur","botánica","árbol","Quercusrobur"],["AMP-004","Botánica","Arbusto","Acebo","Ilex aquifolium","muy_alta","Hojas coriáceas perennes con margen muy espinoso ondulado — inconfundible","El 'árbol de Navidad con pinchos y bolitas rojas': hojas con espinas + bayas rojas brillantes en invierno — el símbolo navideño hecho árbol real","botánica","arbusto","Ilexaquifolium"],["AMP-005","Botánica","Arbusto","Endrino / Espino negro","Prunus spinosa","alta","Ramillas muy espinosas (las espinas son ramas modificadas, no aguijones)","El 'espino que florece en invierno antes de tener hojas': flores blancas en enero sobre ramas desnudas con espinas — el primero en florecer del matorral","botánica","arbusto","Prunusspinosa"],["AMP-006","Botánica","Arbusto","Rosal silvestre / Rosal canino","Rosa canina","alta","Aguijones curvados en forma de gancho (diferencia de otras Rosa: aguijones rectos)","El 'rosal con bolitas rojas en invierno': el escaramujo rojo brillante colgando de las ramas desnudas en invierno es inconfundible — fuente de vitamina C","botánica","arbusto","Rosacanina"],["AMP-007","Botánica","Árbol","Majuelo / Espino albar","Crataegus monogyna","alta","Hojas con 3-7 lóbulos profundos (más recortadas que otras Crataegus)","El 'espino blanco de las majuelas': flores blancas en primavera → bolitas rojo oscuro en otoño, parecidas a moras pequeñas. La crema de la Rosaceae del seto","botánica","árbol","Crataegusmonogyna"],["AMP-008","Botánica","Árbol","Mostajo","Sorbus aria","media","Hojas ovales con borde doblemente dentado; haz verde oscuro, envés BLANCO algodonoso y denso","El 'árbol con el envés de las hojas como papel blanco': el contraste entre el haz verde oscuro y el envés algodonoso blanco lo hace inconfundible al viento — parece que las hojas parpadean en blanco","botánica","árbol","Sorbusaria"],["AMP-009","Botánica","Árbol","Aliso","Alnus glutinosa","alta","Hojas orbiculares con ápice truncado o emarginado (redondeado o con escotadura en el extremo)","El 'árbol del agua con piñas de madera': junto a los ríos, con esas pequeñas 'piñas' leñosas que cuelgan en invierno — el único árbol ripario con frutos leñosos en racimo","botánica","árbol","Alnusglutinosa"],["AMP-010","Botánica","Arbusto","Saúco","Sambucus nigra","alta","Hojas compuestas pinnadas con 5-7 folíolos lanceolados serrados; olor desagradable al frotar","El 'árbol con médula de corcho y moras negras': corta una rama joven y la médula blanca blanda es el sello inconfundible. Las bayas negras en paraguas son el otro rasgo","botánica","arbusto","Sambucusnigra"],["AMP-011","Botánica","Árbol","Avellano","Corylus avellana","media","Hojas redondeadas con base cordada y ápice acuminado; doble dentado; pelosas","El 'árbol de los amentos amarillos en enero': los amentos colgantes del avellano en pleno invierno son la primera señal de vida del bosque caducifolio — antes incluso que el almendro","botánica","árbol","Corylusavellana"],["AMP-012","Botánica","Árbol","Boj","Buxus sempervirens","alta","Hojas pequeñas, ovales, coriáceas y opuestas; haz verde brillante, envés más pálido","El 'arbusto del olor de botica': el olor característico al frotar las hojas es absolutamente inconfundible — intenso y ligeramente desagradable. Las hojitas pequeñas opuestas son su firma visual","botánica","árbol","Buxussempervirens"],["AMP-013","Botánica","Árbol","Higuera","Ficus carica","media","Hojas muy grandes (10-20 cm), palmadas con 3-7 lóbulos; ásperas al tacto; látex lechoso al cortar","El 'árbol del látex blanco y hoja de mano': el látex que sale al cortar una ramita joven + las hojas lobuladas enormes + el higo son únicos","botánica","árbol","Ficuscarica"],["AMP-014","Botánica","Arbusto","Aulaga / Tojo","Ulex europaeus","media","Arbusto completamente cubierto de espinas rígidas que son hojas modificadas","El 'arbusto erizo amarillo': todo espinas con flores amarillas fragantes a coco — si pinchas + huele a coco + está en el norte o la sierra, es tojo","botánica","arbusto","Ulexeuropaeus"],["AMP-015","Botánica","Arbusto","Escoba / Retama negra","Cytisus scoparius","alta","Tallos verdes, pentagonales (en sección: 5 ángulos) y muy ramificados — diagnóstico táctil","El 'arbusto escoba con flores amarillas perfectas': los tallos pentagonales verdes + las flores amarillas llamativas lo distinguen de la retama (tallos cilíndricos, flores más pequeñas)","botánica","arbusto","Cytisusscoparius"],["AMP-016","Botánica","Arbusto","Gayomba / Retama de flor","Spartium junceum","media","Tallos cilíndricos (no pentagonales como Cytisus) verdes y junquiformes (como juncos)","La 'retama de las flores grandes perfumadas': las flores amarillas son el doble de grandes que las de la retama común, y el olor es intensísimo — la más fragante de las retamas","botánica","arbusto","Spartiumjunceum"],["AMP-017","Botánica","Arbusto","Aladierno / Aladierna","Rhamnus alaternus","media","Hojas perennes, alternas, ovales-lanceoladas, coriáceas, con nervios secundarios arqueados","El 'arbusto con bayas en semáforo': los frutos pasan de verde → rojo → negro, así que en el mismo arbusto ves los tres colores a la vez — el semáforo del matorral mediterráneo","botánica","arbusto","Rhamnusalaternus"],["AMP-018","Botánica","Arbusto","Viburno / Morrionera","Viburnum lantana","media","Hojas grandes, ovales, finamente dentadas; haz arrugado y con pelillos estrellados (estrellado-tomentoso)","El 'arbusto lana': hoja arrugada cubierta de pelillos que dan un tacto suave como lana — y el racimo de bayas en semáforo (verde → rojo → negro) igual que el aladierno","botánica","arbusto","Viburnumlantana"],["AMP-019","Botánica","Herbácea","Zanahoria silvestre","Daucus carota","alta","Umbela blanca con brácteola central oscura (rojiza o purpúrea) en el centro — diagnóstico de especie","La 'sombrilla blanca con mancha oscura en el centro': la única umbela que tiene una flor central oscura como un ojo — el truco para ver los polinizadores que ya la visitaron","botánica","herbácea","Daucuscarota"],["AMP-020","Botánica","Herbácea","Hinojo","Foeniculum vulgare","alta","Hojas muy divididas en segmentos filiformes (como hebras finísimas) — inconfundible","El 'apiáceo con olor a anís y hojas de pluma': las hojas finísimas como filamentos + el aroma intenso a anís = solo el hinojo. Imposible confundirlo al olfato","botánica","herbácea","Foeniculumvulgare"],["AMP-021","Botánica","Herbácea","Cañaheja","Ferula communis","media","La umbela de Apiaceae más grande de Europa (hasta 2.5 m de altura)","El 'girasol de los Apiaceae': la umbela más grande de la familia, sobre el tallo más alto — si ves una umbelifera que te supera en altura, es una Ferula","botánica","herbácea","Ferulacommunis"],["AMP-022","Botánica","Herbácea","Orquídea pirámide","Anacamptis pyramidalis","alta","Espiga floral densa con forma piramidal (aguda en el ápice) de flores rosado-púrpura","La 'orquídea rosa en pirámide': la inflorescencia piramidal rosada es absolutamente inconfundible. La única orquídea ibérica con esa forma de cono terminado en punta","botánica","herbácea","Anacamptispyramidalis"],["AMP-023","Botánica","Herbácea","Ophrys abeja","Ophrys apifera","alta","Labelo que imita el abdomen de una abeja (forma, color, textura y olor) — mimetismo sexual","La 'orquídea que engaña a las abejas': el labelo imita tan perfectamente a una abeja hembra que los machos intentan copular con la flor — el mayor engaño del reino vegetal","botánica","herbácea","Ophrysapifera"],["AMP-024","Botánica","Herbácea","Gamón / Asfódelo","Asphodelus ramosus","alta","Escapo muy alto (hasta 1.5 m) con flores blancas rayadas de pardo; sin hojas en el tallo","El 'candelabro blanco del monte': escapo alto con muchas ramas y flores blancas con franja marrón — la planta de los muertos del Hades griego, que crecía en los prados del inframundo","botánica","herbácea","Asphodelusramosus"],["AMP-025","Botánica","Herbácea","Nazarenos / Jacinto de penacho","Muscari neglectum","media","Flores en racimo de bolitas azul-violáceas brillantes con borde blanco","Las 'bolitas azules en racimo de primavera': el racimo de pequeñas bolas azul-violáceas compactas es una de las flores más reconocibles de la primavera ibérica","botánica","herbácea","Muscarineglectum"],["AMP-026","Botánica","Herbácea","Espárrago triguero / Esparraguera","Asparagus acutifolius","media","Cladodios (hojas modificadas): aciculares, muy agudos y rígidos (pinchan) en grupos de 4-12","El 'espárrago que pincha': los cladodios rígidos y agudos que pinchan al cogerlo son la diferencia del espárrago silvestre vs. la esparraguera cultivada (blanda). Los turiones primaverales son el espárrago que se come","botánica","herbácea","Asparagusacutifolius"],["AMP-027","Botánica","Herbácea","Lechetrezna / Euforbio","Euphorbia characias","alta","Látex lechoso blanco muy abundante al cortar cualquier parte — diagnóstico absoluto de Euphorbia","La 'planta que sangra blanca': si la rompes y sale abundante látex blanco, es Euphorbia — el látex es la firma de toda la familia, tóxico pero inconfundible","botánica","herbácea","Euphorbiacharacias"],["AMP-028","Botánica","Herbácea","Clavel silvestre / Clavel de roca","Dianthus sylvestris","media","5 pétalos rosas con el margen finamente dentado (fleco de peine) — diagnóstico de Dianthus","El 'clavel de los roquedos': pétalos rosas con el borde en puntilla (denticulado) + olor a clavel. La flor de Zeus hecha silvestre en las grietas de las rocas","botánica","herbácea","Dianthussylvestris"],["AMP-029","Botánica","Herbácea","Colleja","Silene vulgaris","alta","Cáliz muy hinchado y globoso, como un globo o vesícula — absolutamente único (cáliz vejigoso)","La 'globo blanco del campo': el cáliz hinchado como un globo o pompa de jabón con el pétalo blanco asomando es absolutamente único en la flora ibérica","botánica","herbácea","Silenevulgaris"],["AMP-030","Botánica","Herbácea","Ortiga mayor","Urtica dioica","alta","Pelos urticantes en tallos y hojas (secretan histamina y acetilcolina al contacto)","La 'planta que quema sin fuego': el escozor al tocarla es su firma — la única planta herbácea europea que duele al tocarla simplemente con rozar","botánica","herbácea","Urticadioica"],["AMP-031","Botánica","Herbácea","Viborera / Borraja del campo","Echium vulgare","alta","Flores tubulares azul-violáceas con estambres rojos que sobresalen — diagnóstico del género","La 'borraja azul-rojo de los taludes': flores azules con estambres rojos que sobresalen + la inflorescencia que se desenrolla como una cola de escorpión — el más llamativo de los boragináceos","botánica","herbácea","Echiumvulgare"],["AMP-032","Botánica","Herbácea","Llantén lanceolado","Plantago lanceolata","alta","Hojas lanceoladas en roseta basal con 3-5 nervios paralelos muy marcados","La 'espiga con corona de antenas blancas': la cabezuela cilíndrica con las antenas blancas sobresaliendo como una corona es absolutamente diagnóstica. La más frecuente de los llantenes","botánica","herbácea","Plantagolanceolata"],["AMP-033","Botánica","Herbácea","Diente de león","Taraxacum officinale","alta","Capítulo solitario por escapo; lígulas amarillas en todos los flósculos (solo lígulas, sin flósculos tubulares)","La 'bola de hacer deseos': el vilano blanco esférico que se dispersa con el soplo es uno de los símbolos más universales de la naturaleza. Amarillo → blanco esférico","botánica","herbácea","Taraxacumofficinale"],["AMP-034","Botánica","Herbácea","Cardo borriquero","Cirsium vulgare","alta","Capítulo grande (2-4 cm) de flores tubulares púrpura-violáceas; sin lígulas","El 'cardo con alas de espinas en el tallo': si el tallo tiene alas espinosas que continúan la hoja hacia abajo, es Cirsium vulgare — el más común de los cardos de Madrid","botánica","herbácea","Cirsiumvulgare"],["AMP-035","Botánica","Herbácea","Aciano / Azulejo","Centaurea cyanus","media","Flores periféricas azul-violáceas intensas muy llamativas, radiantes (más grandes que las centrales)","El 'azul eléctrico del campo de trigo': las flores periféricas azul-intenso entre el amarillo del trigo son el color más llamativo del campo castellano en junio","botánica","herbácea","Centaureacyanus"],["AMP-036","Botánica","Herbácea","Nenúfar blanco","Nymphaea alba","alta","Hojas flotantes grandes (10-30 cm), redondas o reniformes, con hendidura en V hasta el peciolo","La 'flor de loto europea': hojas redondas flotantes + flor blanca enorme abierta sobre el agua — el nenúfar de los cuadros de Monet","botánica","herbácea","Nymphaeaalba"],["AMP-037","Botánica","Herbácea","Lirio amarillo de agua","Iris pseudacorus","alta","Flores grandes amarillas con 3 sépalos caídos moteados de marrón y 3 pétalos erectos","El 'lirio amarillo del pantano con hojas en espada': las flores amarillas con moteado marrón + las hojas en abanico (todas en el mismo plano) son los rasgos diagnósticos del lirio más acuático","botánica","herbácea","Irispseudacorus"],["AMP-038","Botánica","Herbácea","Aguileña / Pajarilla","Aquilegia vulgaris","media","5 pétalos con espolón hueco curvado hacia atrás — absolutamente diagnóstico del género","La 'flor de las 5 garras curvas': los 5 espolones curvados hacia atrás como garras de águila son absolutamente únicos — ninguna otra planta tiene esa forma","botánica","herbácea","Aquilegiavulgaris"],["AMP-039","Botánica","Herbácea","Hipérico / Corazoncillo","Hypericum perforatum","alta","Hojas con puntos translúcidos (glándulas oleosas) visibles al trasluz — diagnóstico de especie","La 'flor amarilla con agujeros de luz': pon la hoja al trasluz y verás los puntitos translúcidos — la única herbácea perenne con ese patrón de 'perforación' de la hoja","botánica","herbácea","Hypericumperforatum"],["AMP-040","Botánica","Herbácea","Malva común","Malva sylvestris","media","Flores rosas a púrpuras con 5 pétalos y venas más oscuras muy llamativas","La 'flor con venas oscuras en rayos + quesito de fruto': las venas más oscuras en las flores rosa + el fruto en rueda de gajos son inconfundibles. El tubo de estambres fusionados es la firma de Malvaceae","botánica","herbácea","Malvasylvestris"],["AMP-041","Botánica","Arbusto","Salvia común","Salvia officinalis","media","Hojas oblongas, rugosas-bulladas, gris-verdosas con abundante pelillo glandular","La 'flor azul con hojas de terciopelo gris aromático': las hojas arrugadas y grisáceas con aroma medicinal intenso son inconfundibles — el olor a salvia es conocido por cualquiera","botánica","arbusto","Salviaofficinalis"],["AMP-042","Botánica","Herbácea","Té de montaña / Sideritis","Sideritis hyssopifolia","alta","Brácteas de la inflorescencia amarillas y muy llamativas (más visibles que las flores)","El 'té de montaña con brácteas amarillas': las brácteas amarillas que rodean los verticilos florales son más llamativas que las flores mismas — la planta del té de montaña ibérico","botánica","herbácea","Sideritishyssopifolia"],["AMP-043","Botánica","Herbácea","Festuca / Cañuela","Festuca ovina","media","Matas densas de hojas muy finas y rígidas (filiformes setáceas), casi como alfileres","La 'gramínea de las agujas verdes': las hojas finísimas y rígidas forman una mata como un erizo verde — si el pasto de montaña parece hecho de agujas, es festuca","botánica","herbácea","Festucaovina"],["AMP-044","Botánica","Herbácea","Ray-grass inglés","Lolium perenne","media","Espiga solitaria (un solo eje principal sin ramificaciones) con espiguillas alternas en el raquis","La 'gramínea del campo de fútbol': la espiga simple con espiguillas alternadas perfectamente en un eje + el brillo de las hojas son los rasgos del césped de jardín y estadio","botánica","herbácea","Loliumperenne"],["AMP-045","Botánica","Herbácea","Aegilops / Egilope","Aegilops geniculata","media","Espiga compacta con espiguillas anchas y abultadas; aristas muy largas saliendo en todas direcciones","La 'mini-espiga erizo con aristas en todas direcciones': la espiga pequeña y abultada con aristas largas saliendo en abanico es inconfundible entre las gramíneas mediterráneas","botánica","herbácea","Aegilopsgeniculata"],["AMP-046","Botánica","Pteridófito","Helecho macho","Dryopteris filix-mas","alta","Fronde 1-2 veces pinnada con pínnulas con diente apical; en corona desde el rizoma","El 'helecho rey de los bosques umbríos': el más grande y elegante de los helechos de sotobosque, con frondas en corona y los soros con tapaderas en forma de riñón","botánica","pteridófito","Dryopterisfilix-mas"],["AMP-047","Botánica","Pteridófito","Polipodio / Regaliz de palo","Polypodium vulgare","alta","Fronde 1 vez pinnada con segmentos oblongos enteros (no subdividida más) — aspecto 'peine'","El 'helecho peine sobre las rocas': fronde en peine (1-pinnado) sobre rocas o troncos, con soros redondos sin tapa visible — el helecho 'desnudo' más común de las rocas del bosque","botánica","pteridófito","Polypodiumvulgare"],["AMP-048","Botánica","Pteridófito","Helecho real / Osmunda","Osmunda regalis","media","El mayor helecho ibérico (hasta 2 m); fronde 2 veces pinnada con pínnulas grandes","El 'helecho con corona de esporas marrones': la parte superior de la fronde se convierte en un penacho pardo de esporangios — como si el helecho llevara una corona de polvo marrón","botánica","pteridófito","Osmundaregalis"],["AMP-049","Botánica","Pteridófito","Selaginela","Selaginella selaginoides","media","Aspecto de musgo pero con dos tipos de microfilos (hojas) en rangos: grandes laterales + pequeñas dorsales","El 'musgo con dos tipos de hojas': parece un musgo pero sus hojas tienen dos tamaños en la misma planta (grandes + pequeñas) y tiene estructura vascular — más complejo que el musgo","botánica","pteridófito","Selaginellaselaginoides"],["AMP-050","Botánica","Alga","Ericaria / Cystoseira (alga parda mediterránea)","Ericaria amentacea (sin.: Cystoseira stricta, C. amentacea var. stricta)","media","Talo pardo ramificado densamente con ramitas muy finas y vesículas esféricas diminutas","El 'arbusto marino mediterráneo': forma pequeños bosques pardos en el mediterráneo limpio — si hay Ericaria, el agua es de gran calidad","botánica","alga","Ericariaamentacea"],["AMP-051","Botánica","Alga","Codium / Esponja verde","Codium tomentosum","media","Talo verde oscuro cilíndrico dicotómico (se divide en dos en cada bifurcación) muy regular","El 'dedo verde oscuro del mar': cilíndrico, dicotómico y con textura de terciopelo verde oscuro — como un dedo esponjoso verde que se divide en dos en cada nudo","botánica","alga","Codiumtomentosum"],["AMP-052","Botánica","Alga","Zostera / Hierba marina","Zostera marina","media","Hojas muy largas y estrechas (acintadas, hasta 1 m) de color verde brillante, en cintas","La 'hierba marina del Atlántico': como Posidonia pero en el Atlántico, con hojas mucho más estrechas y largas — la 'anguila vegetal' del Atlántico","botánica","alga","Zosteramarina"],["AMP-085","Botánica","Alga","Codium bursa (bola de alga)","Codium bursa","alta","Forma perfectamente esférica o globosa (2-20 cm), verde oscura y de tacto esponjoso-aterciopelado — absolutamente unica entre algas ibericas","La 'bola de billar marina verde oscura': ninguna otra alga ibérica tiene forma globular perfecta. Verde oscuro + esférica + esponjosa al tacto = Codium bursa sin ninguna duda","botánica","alga","Codiumbursa"],["AMP-086","Botánica","Alga","Fucus espiral","Fucus spiralis","alta","Talo plano y dicotomico SIN vesiculas aerifereas (aerocistes) — diferencia clave de F. vesiculosus que SI tiene vesiculas; margenes ligeramente enrollados; receptaculos apicales ovoides","El 'fucus sin globitos': idéntico al Fucus vesiculosus pero sin las vesículas llenas de gas. Si la lámina parda es plana sin 'bollitos' ni burbujas, es F. spiralis — el de zona más alta","botánica","alga","Fucusspiralis"],["AMP-087","Botánica","Alga","Dictyota dichotoma","Dictyota dichotoma","alta","Ramificacion dicotomica perfectamente regular (bifurcacion en Y constante cada 1-2 cm); talo aplanado de 1-2 mm de anchura; color verde-parduzco o azulado iridiscente bajo el agua","El 'alga de las bifurcaciones perfectas en Y': cada vez que crece se divide en exactamente dos ramas iguales. El patrón de Y repetido a intervalos regulares es inconfundible — una obra de geometría fractal marina","botánica","alga","Dictyotadichotoma"],["AMP-088","Botánica","Alga","Padina pavonica (cola de pavo real)","Padina pavonica","muy_alta","Forma de abanico o embudo con bandas concentricas visibles (lineas curvas paralelas al margen) — absolutamente diagnostico; color beige-blanquecino por calcificacion parcial de la superficie","La 'alga-abanico con rayas de campo de tiro': la forma de abanico con bandas concéntricas es única en el mundo algal ibérico — como un abanico japonés con líneas dibujadas. El blanquecino se debe a calcificación","botánica","alga","Padinapavonica"],["AMP-089","Botánica","Alga","Lithophyllum incrustans (alga calcarea costrosa)","Lithophyllum incrustans","alta","Forma de costra dura e incrustante sobre la roca — no tiene estructura tridimensional libre; color rosa-violaceo a gris-blanquecino; superficie lisa; durisima al tacto (calcificada)","La 'capa de pintura rosa-violácea sobre la roca': las costras rosas o malvas que cubren las rocas intermareales como una pintura sólida son Lithophyllum. Durísimo al tacto — es calcita biológica pegada a la roca","botánica","alga","Lithophyllumincrustans"],["AMP-090","Botánica","Alga","Gelidium sesquipedale (agar-agar)","Gelidium sesquipedale","muy_alta","Talo erectamente ramificado con ramificacion pinnada regular (ramas laterales simetricas a ambos lados del eje); color rojo-vinoso oscuro; cilindrico a algo comprimido","El 'alga del agar-agar rojo-vinosa con plumas simétricas': el eje principal con ramitas laterales simétricas como plumas + el color rojo oscuro son diagnósticos. La fuente del gel de los laboratorios de microbiología","botánica","alga","Gelidiumsesquipedale"],["AMP-091","Botánica","Alga","Ceramium rubrum (alga filamentosa roja)","Ceramium rubrum","alta","Aspecto filamentoso muy ramificado; color rojizo o rojo-pardo vivo; apices de las ramas con forcipula caracteristica (puntas curvadas hacia adentro como pinzas) — diagnostico de genero","El 'alga de los filamentos rojos con pinzas en las puntas': los filamentos rojizos muy ramificados terminan en ápices curvados hacia adentro como pinzas. Eso es diagnóstico de Ceramium entre todos los filamentos rojos ibéricos","botánica","alga","Ceramiumrubrum"],["AMP-053","Botánica","Briófito","Fontinalis / Musgo acuático","Fontinalis antipyretica","media","Tallos muy largos (hasta 1 m) flotantes o adheridos a piedras bajo el agua","La 'melena verde bajo el río': largos tallos que ondean en la corriente adheridos a las piedras — el único musgo que vive completamente sumergido en el agua más limpia","botánica","briófito","Fontinalisantipyretica"],["AMP-054","Botánica","Arbusto","Cantueso","Lavandula stoechas","muy_alta","Brácteas apicales grandes, erectas y de color púrpura vivo en el ápice de la espiga — absolutamente diagnósticas (parecen 'orejas' encima de la espiga compacta)","La 'lavanda con orejas moradas': las brácteas púrpura que coronan la espiga como orejas de conejo son absolutamente únicas — ninguna otra lavanda las tiene tan grandes y llamativas","botánica","arbusto","Lavandulastoechas"],["AMP-055","Botánica","Arbusto","Espliego / Lavanda","Lavandula angustifolia","alta","Espiga floral alargada e interrumpida (con espacio entre flores inferiores y superiores); sin brácteas apicales llamativas","La 'lavanda sin orejas con espiga interrumpida': la espiga tiene un 'cuello' visible que interrumpe las flores, y sin las brácteas vistosas del cantueso — más elegante y menos llamativa","botánica","arbusto","Lavandulaangustifolia"],["AMP-056","Botánica","Arbusto","Orégano","Origanum vulgare","alta","Brácteas purpúreas o rojizas que envuelven los glomérulos florales — color llamativo incluso sin flores; aroma inequívoco a orégano al frotar","El 'arbusto que huele a pizza': el aroma al frotar es absolutamente inconfundible — el mismo de la pizza y los platos mediterráneos. Las brácteas rojas-purpúreas dan color incluso sin flores abiertas","botánica","arbusto","Origanumvulgare"],["AMP-057","Botánica","Arbusto","Ajedrea de montaña","Satureja montana","media","Hojas lineares a lanceoladas, puntiagudas y coriáceas; flores blancas o rosado-liláceas en verticilos; más rígidas y punzantes que el tomillo","La 'prima picante del tomillo': hojas más duras y puntiagudas que el tomillo, aroma más picante e intenso — si la aromática de matorral pinchan un poco las hojas y huele a pimienta, es ajedrea","botánica","arbusto","Saturejamontana"],["AMP-058","Botánica","Arbusto","Jara estepa","Cistus albidus","alta","Hojas cubiertas de tomento blanquecino denso por ambas caras (las más blancas del género); flores rosadas o purpúreas con 5 pétalos arrugados","La 'jara blanca con flores rosas': las hojas tan blancas y afieltradas como si estuvieran cubiertas de lana + las flores rosas son el diagnóstico. La única jara con hojas blancas y flores de color","botánica","arbusto","Cistusalbidus"],["AMP-059","Botánica","Arbusto","Lentisco","Pistacia lentiscus","muy_alta","Hoja compuesta paripinnada con raquis ALADO entre los folíolos — diagnóstico único; olor resinoso intenso (almáciga) al frotar","El 'arbusto con raquis alado': la hoja compuesta con las alitas entre los folíolos — como si los folíolos estuvieran pegados a un tallo con alas. Ningún otro arbusto ibérico tiene eso","botánica","arbusto","Pistacialentiscus"],["AMP-060","Botánica","Arbusto","Aliaga / Aulaga espinosa","Genista scorpius","alta","Arbusto muy espinoso con espinas ramificadas (las ramas acaban en espina que se bifurca); flores amarillas papilionáceas pequeñas","La 'maraña de espinas ramificadas amarillas': el arbusto más inhóspito del matorral mediterráneo seco — las espinas se ramifican formando una armadura impenetrable que solo el conejo atraviesa","botánica","arbusto","Genistascorpius"],["AMP-061","Botánica","Arbusto","Coscoja","Quercus coccifera","muy_alta","Hojas coriáceas con dientes espinosos en TODO el margen; verde reluciente por ambas caras — diferencia clave de la encina (envés grisáceo)","La 'encina que pincha por todas partes': mientras la encina solo pincha en el ápice de las hojas jóvenes, la coscoja pincha en todo el contorno siempre. Y brilla verde por las dos caras","botánica","arbusto","Quercuscoccifera"],["AMP-062","Botánica","Arbusto","Arto / Espino negro","Rhamnus lycioides","media","Arbusto muy intrincado con ramas terminadas en espina rígida; hojas muy pequeñas y estrechas (lineares); drupas negras pequeñas","El 'espino con ramas de aguja': las ramas terminan en espina y las hojas son tan estrechas como agujas — el arbusto más espinoso e impenetrable de los suelos calizos áridos del sureste de Madrid","botánica","arbusto","Rhamnuslycioides"],["AMP-063","Botánica","Arbusto","Efedra / Uva de mar","Ephedra nebrodensis","alta","Tallos articulados, verdes y estriados — aspecto de cola de caballo (Equisetum) pero leñosa; hojas reducidas a escamas en los nudos; frutos carnosos rojizos","La 'cola de caballo leñosa': tallos articulados y estriados como los de Equisetum pero rígidos, leñosos y con frutillos rojos carnosos. La gimnosperma que parece un helecho articulado","botánica","arbusto","Ephedranebrodensis"],["AMP-064","Botánica","Arbusto","Brezo blanco / Brezo arborescente","Erica arborea","alta","Hojas lineares muy pequeñas (3-5 mm) en verticilos de 3-4; flores acampanadas blancas diminutas; puede alcanzar 5-6 m (el mayor brezo ibérico)","El 'brezo blanco gigante': el único brezo que puede llegar a ser árbol pequeño, con flores blancas acampanadas diminutas en racimos. Si el brezo te supera en altura, es Erica arborea","botánica","arbusto","Ericaarborea"],["AMP-065","Botánica","Arbusto","Piorno serrano","Cytisus oromediterraneus","muy_alta","Arbusto muy denso y redondeado; flores amarillas muy abundantes que inundan de amarillo la sierra en mayo-junio; mata almohadillada adaptada al viento","El 'arbusto dorado de la sierra': en mayo la sierra de Guadarrama se tiñe de amarillo intenso por el piorno — el arbusto que coloniza los pinares de altura y el piso oromediterráneo como nadie","botánica","arbusto","Cytisusoromediterraneus"],["AMP-066","Botánica","Arbusto","Cambroño","Adenocarpus hispanicus","alta","Legumbre con glándulas negras densas en la superficie — absolutamente diagnóstico; flores amarillas papilionáceas en racimo con cáliz glanduloso","El 'arbusto con vainas negras punteadas': las legumbres cubiertas de puntitos negros glandulosos son absolutamente únicas — si la vaina parece manchada de brea o salpicada de hollín, es cambroño","botánica","arbusto","Adenocarpushispanicus"],["AMP-067","Botánica","Árbol","Enebro de la miera","Juniperus oxycedrus","muy_alta","Agujas con DOS bandas blancas de estomas en el haz — diagnóstico vs. J. communis (solo 1 banda); bayas rojo-anaranjadas más grandes (8-12 mm)","El 'enebro de las dos rayas blancas': cada aguja tiene DOS líneas blancas en el haz — cuenta las líneas: dos = oxycedrus; una = communis. Las bayas son más grandes y rojas que las del común","botánica","árbol","Juniperusoxycedrus"],["AMP-068","Botánica","Árbol","Taray / Tamariz","Tamarix gallica","alta","Hojas escuamiformes (pequeñas escamas aplicadas al tallo) — aspecto de pluma o cipresillo; flores rosadas muy pequeñas en espigas densas cilíndricas","El 'árbol pluma de las orillas salinas': las hojas escamosas y las ramas plumosas le dan un aspecto único — como si estuviera cubierto de plumas verdes grisáceas. Las flores rosas en espiga son su firma","botánica","árbol","Tamarixgallica"],["AMP-069","Botánica","Arbusto","Adelfa","Nerium oleander","muy_alta","Hojas en verticilos de 3, lanceoladas muy alargadas, coriáceas y perennes; flores grandes rosas/blancas con corona de apéndices laciniados; látex muy tóxico","La 'planta del río que mata': las hojas en verticilos de 3 como dedos apuntando + flores grandes rosas = adelfa. Todo en ella es veneno — ni quemarla (el humo es tóxico), ni usarla de palillo","botánica","arbusto","Neriumoleander"],["AMP-070","Botánica","Árbol","Sauce ceniciento","Salix atrocinerea","alta","Hojas elípticas a obovadas, grisáceas y pubescentes en el envés (tomentoso-ceniciento); estípulas grandes y persistentes; el sauce más frecuente en ríos de Madrid","El 'sauce gris de las orillas': el envés grisáceo-pubescente de las hojas + las estípulas grandes son la firma. Si el sauce de la orilla tiene las hojas con el reverso gris y peludo, es S. atrocinerea","botánica","árbol","Salixatrocinerea"],["AMP-071","Botánica","Árbol","Sauce salvio / Mimbrera","Salix salviifolia","alta","Hojas lanceoladas a oblanceoladas, ondulado-dentadas, con tomento blanquecino por ambas caras (como las de la salvia); endemismo ibérico","El 'sauce con hojas de salvia': hojas blanquecinas, onduladas y con tacto suave y tomentoso como las de la salvia — el sauce endémico ibérico de los ríos del Sistema Central","botánica","árbol","Salixsalviifolia"],["AMP-072","Botánica","Herbácea","Cardo / Alcachofa silvestre","Cynara cardunculus","alta","Capítulo enorme (5-15 cm) con brácteas en escudo terminadas en espina rígida; hojas muy grandes pinnadas con espinas; flores tubulares violeta-azuladas","El 'cardo gigante morado': el capítulo más grande de todos los cardos ibéricos con brácteas en escudo espinosas y flores azul-violeta. Es literalmente la alcachofa silvestre sin seleccionar","botánica","herbácea","Cynaracardunculus"],["AMP-073","Botánica","Herbácea","Trébol rojo / Trébol pratense","Trifolium pratense","alta","Hojas trifoliadas con marca en V blanquecina en los folíolos (en los individuos típicos); capítulo floral ovoide rosado-purpúreo sin pedúnculo visible; estípulas con nervio prominente","El 'trébol de los pompones rosas': el capítulo purpúreo-rosado sentado directamente entre dos hojas trifoliadas con V blanca es inconfundible — el trébol más fácil de identificar por su flor","botánica","herbácea","Trifoliumpratense"],["AMP-074","Botánica","Árbol","Almendro","Prunus dulcis","muy_alta","Flores blancas o rosadas de 5 pétalos que aparecen en enero-febrero ANTES que las hojas (la primera floración del año en Madrid); fruto: drupa con mesocarpo coriáceo fibroso y endocarpo duro (el hueso) con semilla comestible","El 'árbol de la primera nevada blanca en enero': florece completamente desnudo de hojas en pleno invierno — los almendros en flor son la primera señal de primavera. Flor antes que hoja = siempre almendro","botánica","árbol","Prunusdulcis"],["AMP-075","Botánica","Arbusto","Zarzamora","Rubus ulmifolius","muy_alta","Tallos arqueados con aguijones curvados (no espinas); hojas compuestas pinnadas con 5 folíolos; fruto: polidrupa negra brillante (la mora); envés de los folíolos blanquecino-tomentoso","La 'zarza de las moras negras con envés blanco': los aguijones curvados como garfios + el envés blanco de los folíolos + las moras negras brillantes en otoño son el trío diagnóstico. Los aguijones curvados enganchan — no los ignores","botánica","arbusto","Rubusulmifolius"],["AMP-076","Botánica","Herbácea","Mostaza silvestre","Sinapis arvensis","alta","4 pétalos amarillos en cruz (diagnóstico de familia Brassicaceae); silicua (fruto) cilíndrica y terminada en un pico largo rígido; hojas basales lirado-pinnadas con lóbulo terminal grande","La 'flor de la cruz amarilla picante de los campos': 4 pétalos amarillos en cruz = Brassicaceae siempre. El pico largo y rígido de la silicua distingue a Sinapis del rábano silvestre (Raphanus, silicua esponjosa) y de la jaramago (Diplotaxis)","botánica","herbácea","Sinapisarvensis"],["AMP-077","Botánica","Herbácea","Zurrón de pastor","Capsella bursa-pastoris","alta","Fruto: silícula triangular-cordada (en forma de corazón o bolsita) — absolutamente diagnóstico; flores blancas muy pequeñas de 4 pétalos en cruz; roseta basal de hojas pinnadas","La 'plantita con bolsitas de corazón': los frutitos triangulares en forma de corazón colgando del tallo como una colección de bolsitas son absolutamente únicos. Inconfundible en fructificación","botánica","herbácea","Capsellabursa-pastoris"],["AMP-078","Botánica","Herbácea","Cicuta mayor","Conium maculatum","alta","Tallo hueco con manchas purpúreas irregulares — diagnóstico de especie dentro de Apiaceae; olor desagradable (a ratón) al frotar; umbela compuesta blanca; hojas 2-3 pinnadas muy divididas","La 'apiácea de las manchas de sangre y olor a ratón': tallo con manchas púrpuras + olor desagradable = cicuta con seguridad. Sin manchas y con olor agradable = probablemente no es cicuta. Mató a Sócrates (399 a.C.)","botánica","herbácea","Coniummaculatum"],["AMP-079","Botánica","Árbol","Quejigo","Quercus faginea","muy_alta","Hojas marcescentes (mueren pero no caen en otoño-invierno, quedan secas en el árbol); lobuladas con lóbulos redondeados; envés con pelillos estrellados; intermedio entre encina y roble","El 'roble que guarda sus hojas muertas en invierno': las hojas secas color herrumbre que permanecen en el árbol todo el invierno son únicos entre los Quercus ibéricos. Árbol con hojas de muerto que no suelta","botánica","árbol","Quercusfaginea"],["AMP-080","Botánica","Árbol","Haya","Fagus sylvatica","muy_alta","Corteza lisa y gris uniforme (como piel de elefante) — diagnóstica en campo; hojas ovadas con margen ondulado-dentado y nervios marcados; yemas alargadas y puntiagudas de color canela","El 'árbol de la piel de elefante y el bosque dorado de otoño': la corteza lisa gris uniforme es única entre árboles ibéricos de gran porte. En otoño el hayedo es el espectáculo cromático más bello de la Península","botánica","árbol","Fagussylvatica"],["AMP-081","Botánica","Árbol","Pino carrasco","Pinus halepensis","muy_alta","Acículas cortas (6-10 cm) en parejas, finas y flexibles (se doblan sin romperse); piñas asimétricas que persisten varios años en el árbol abiertas; corteza gris-rojiza en ramas altas","El 'pino de las piñas torcidas que no caen': las piñas asimétricas con el pedúnculo curvado que se quedan abiertas años en el árbol son diagnósticas. El pino gris del Mediterráneo seco que aguanta la sequía más severa","botánica","árbol","Pinushalepensis"],["AMP-082","Botánica","Árbol","Sabina albar","Juniperus thurifera","muy_alta","Hojas en dos tipos: juveniles aciculares y adultas escuamiformes en el mismo árbol (dimorfia foliar); porte arbóreo con copa irregular; bayas pruinosas azul-grisáceas; olor a incienso al quemar","La 'sabina con dos tipos de hojas y olor a incienso': en el mismo árbol hay agujas (hojas jóvenes) y escamas (hojas adultas) — ninguna otra cupresácea ibérica tiene esa mezcla. La más longeva de España","botánica","árbol","Juniperusthurifera"],["AMP-083","Botánica","Árbol","Cornicabra / Terebinto","Pistacia terebinthus","muy_alta","Hoja compuesta imparipinnada (con foliolo terminal) con 5-9 folíolos; olor a trementina al frotar (diagnóstico); caducifolio; produce agallas (cuernos de cabra) por Pemphigus — su nombre","El 'árbol que huele a trementina con cuernos de cabra': el olor intenso a trementina al frotar la hoja es inconfundible. Las agallas rojas en forma de cuerno (que le dan el nombre 'cornicabra') son un espectáculo en primavera","botánica","árbol","Pistaciaterebinthus"],["AMP-084","Botánica","Herbácea","Cebada de ratón / Cola de rata","Hordeum murinum","alta","Espiga densa con aristas largas (2-5 cm) que se dispersan en abanico; espiguillas laterales con largas aristas; muy frecuente en suelos pisoteados, bordes de camino y suelos nitrogenados","La 'gramínea con bigotes de gato que se pega a la ropa': las aristas largas se enganchan en la ropa y el pelo de los perros con gran facilidad — la gramínea más pegajosa y abundante de los suelos pisoteados de Madrid","botánica","herbácea","Hordeummurinum"],["BRY-001","Botánica","Briófito","Esfagno común (musgo de turbera)","Sphagnum palustre","media","Ramas en fascículos: 2-3 erectas + 2-3 colgantes por nudo; color verde-amarillento pálido; células hialinas absorbentes sin rizoides","La 'esponja vegetal verde-amarillenta': la más común de los esfagnos ibéricos — si lo estrujas suelta agua a chorros. El color verde-amarillento pálido + las turberas bajas son su hábitat típico","botánica","briófito","Sphagnumpalustre"],["BRY-006","Botánica","Briófito","Esfagno rojo (musgo de turbera ácida)","Sphagnum capillifolium","media","Color rojo-rosado a pardo-rojizo intenso — el único esfagno claramente rojo; hojas de rama muy pequeñas; capitulum compacto","El 'esfagno rojo de montaña': el único musgo de turbera claramente rojo o rosado — imposible confundirlo con S. palustre (verde-amarillento). Rojo = capillifolium, turbera ácida de montaña","botánica","briófito","Sphagnumcapillifolium"],["AMP-092","Botánica","Briófito","Porella (hepática foliosa)","Porella platyphylla","media","Hojas dispuestas en DOS filas laterales perfectamente visibles + una fila ventral de anfigastrios (hojas pequeñas en la cara inferior del tallo) — diagnóstico del grupo; aspecto de musgo pero con hojas en filas, no en espiral","La 'hepática con tres filas de hojitas': DOS filas de hojas grandes a los lados + una fila de hojitas pequeñas en el vientre. Parece un musgo pero sus hojas están perfectamente alineadas en filas — no en espiral","botánica","briófito","Porellaplatyphylla"],["BRY-003","Botánica","Briófito","Polytrichum (musgo erizo / musgo de los bosques)","Polytrichum commune","alta","Tallos erectos rígidos de 5-30 cm (los más altos entre los musgos) que crecen en penachos verticales densos; hojas lanceoladas con lámelas fotosintéticas longitudinales en el haz (visibles con lupa); esporofito apical con urna cuadrangular y caliptra pelosa","El 'musgo erizo de los bosques': los tallos erectos rígidos formando un penacho verde oscuro + la caliptra pelosa dorada del esporofito son diagnósticos. El musgo acrocárpico más grande e inconfundible de los bosques ácidos","botánica","briófito","Polytrichumcommune"],["BRY-004","Botánica","Briófito","Funaria hygrometrica (musgo de las hogueras)","Funaria hygrometrica","alta","Tallos cortos (1-3 cm) en cojines densos de color verde brillante a amarillo-verdoso; esporofito MUY llamativo: seta larga curvada rematada en una urna piriforme (en forma de pera) asimétrica y abombada — diagnóstico absoluto; aparece masivamente en suelos quemados y perturbados","El 'musgo de las cenizas con sombrillitas de pera torcida': los esporofitos con su seta curvada y la urna en forma de pera asimétrica son absolutamente inconfundibles — como pequeñas farolas colgantes. El musgo que aparece el primero después de un incendio","botánica","briófito","Funariahygrometrica"],["BRY-005","Botánica","Briófito","Hypnum cupressiforme (musgo de tapiz)","Hypnum cupressiforme","alta","Tallos rastreros que forman tapices horizontales densos; hojas fuertemente curvadas hacia un lado (falcadas o curvado-secundas) — diagnóstico del género; color verde-amarillento brillante; esporofitos en posición LATERAL (no apical)","El 'musgo-alfombra de hojas curvadas a un lado': el tapiz rastrero verde-amarillento con las hojitas curvadas todas hacia el mismo lado como un peinado es diagnóstico. El musgo pleurocárpico más frecuente de Europa — está en casi todos los bosques de la sierra de Madrid","botánica","briófito","Hypnumcupressiforme"],["BRY-002","Botánica","Briófito","Marchantia (hepática talosa)","Marchantia polymorpha","media","Talo laminar plano verde brillante sin diferenciación en tallo-hoja","La 'hoja de hígado verde con paragüitas': talo plano, con paragüitas en la superficie","botánica","briófito","Marchantiapolymorpha"],["FRO-001","Botánica","Árbol","Plátano de sombra","Platanus × hispanica","muy_alta","Corteza que se pela en placas irregulares dejando manchas verde-amarillas, grises y beige (camuflaje de soldado)","El 'árbol camuflaje': corteza que se cae en parches como piel de serpiente, dejando un jaspeado de colores. Inconfundible","botánica","árbol","Platanus×"],["FRO-002","Botánica","Árbol","Roble melojo (rebollo)","Quercus pyrenaica","muy_alta","Hojas grandes (10-20 cm) con lóbulos profundos y base auriculada; peciolo corto","El 'roble de pelusilla': si pasas el dedo por el envés de la hoja y notas una felpa grisácea, es melojo","botánica","árbol","Quercuspyrenaica"],["FRO-003","Botánica","Árbol","Encina","Quercus ilex","muy_alta","Hojas coriáceas perennes, ovales a lanceoladas; haz verde oscuro brillante; envés blanquecino-tomentoso","La 'reina verde oscura': la copa más oscura del paisaje mediterráneo, con hojitas duras de doble cara (verde/gris)","botánica","árbol","Quercusilex"],["FRO-004","Botánica","Árbol","Alcornoque","Quercus suber","alta","Corteza suberosa (corcho) muy gruesa, corchosa y profundamente fisurada: ÚNICA entre árboles ibéricos","El 'árbol de los tapones': corteza de corcho tan gruesa que parece una esponja. Imposible confundirlo","botánica","árbol","Quercussuber"],["FRO-005","Botánica","Árbol","Fresno de hoja estrecha","Fraxinus angustifolia","alta","Hojas compuestas pinnadas con 7-13 folíolos lanceolados y dentados","El 'árbol de las llaves colgantes': las sámaras parecen llavecitas que quedan colgando en invierno","botánica","árbol","Fraxinusangustifolia"],["FRO-006","Botánica","Árbol","Olivo","Olea europaea","alta","Hojas lanceoladas perennes: haz verde grisáceo, envés blanquecino-plateado","El 'árbol de Atenea': hojas bicolores (verde/plata) + aceitunas globosas. Inconfundible","botánica","árbol","Oleaeuropaea"],["FRO-007","Botánica","Árbol","Abedul","Betula pendula","media","Corteza blanca-plateada que se exfolia en láminas horizontales finas — absolutamente única","El 'árbol de papel blanco': corteza blanca que se despega en tiras. Si la corteza parece papel de impresora, abedul","botánica","árbol","Betulapendula"],["FRO-008","Botánica","Arbusto","Madroño","Arbutus unedo","muy_alta","Hojas coriáceas perennes, ovales, de margen dentado; verde oscuro brillante","El 'árbol del oso de Madrid': símbolo del escudo de Madrid. Las bolitas rojas granulosas son inconfundibles","botánica","arbusto","Arbutusunedo"],["FRO-009","Botánica","Arbusto","Jara pringosa","Cistus ladanifer","alta","Hojas pegajosas con resina brillante (ladan) — inconfundible al tacto y olfato","La 'jara del pegamento': tócala y te quedan los dedos brillantes de resina. Las flores con 'ojo' marrón son únicas","botánica","arbusto","Cistusladanifer"],["FRO-010","Botánica","Arbusto","Romero","Salvia rosmarinus","alta","Hojas muy estrechas (aciculares), enrolladas en el margen, verdes por arriba y blancas por abajo","La 'aguja aromática azul': hojas tan estrechas como agujas de pino pero blandas, y aroma inconfundible","botánica","arbusto","Salviarosmarinus"],["FRO-011","Botánica","Arbusto","Tomillo","Thymus vulgaris","alta","Subarbusto enano (<30 cm) con hojas diminutas ovales a lanceoladas, bordes enrollados","El 'enano aromático': el arbusto más pequeño del matorral, casi una alfombra, con ese olor a pizzería","botánica","arbusto","Thymusvulgaris"],["FRO-012","Botánica","Arbusto","Retama","Retama sphaeroca // ── SM-2 ─────────────────────────────────────────────────────────────────────
function sm2(card,r){
  let {interval=0,ef=2.5,reps=0,lapses=0}=card;
  if(r<=1){lapses++;interval=1;if(r===0)ef=Math.max(1.3,ef-.2);}
  else{
    reps++;
    if(reps===1)interval=1;
    else if(reps===2)interval=3;
    else{
      if(r===2)interval=Math.round(interval*Math.max(1.2,ef-.15));
      else{interval=Math.round(interval*ef);ef=Math.min(3.5,ef+.1);}
    }
  }
  interval=Math.max(1,interval);
  const d=new Date();d.setDate(d.getDate()+interval);
  return{interval,ef,reps,lapses,due:d.toISOString().slice(0,10)};
}
function today(){return new Date().toISOString().slice(0,10);}

// ── PROGRESS — DRIVE ─────────────────────────────────────────────────────────
async function loadP(){
  setSaveStatus('Cargando progreso…','');
  try{
    const r=await fetch(SCRIPT+'?action=load_progress');
    const d=await r.json();
    if(d.exists&&d.data){
      P={...P,...d.data};
      setSaveStatus('Progreso cargado ✓','ok');
    } else {
      setSaveStatus('Primera sesión — el progreso se guardará en Drive','ok');
    }
  }catch(e){
    setSaveStatus('Sin conexión — el progreso se guardará cuando haya red','err');
  }
  updateHome();
}

async function saveP(){
  try{
    P.updated=new Date().toISOString();
    const encoded=encodeURIComponent(JSON.stringify(P));
    // GET request — evita el CORS preflight que bloquea las peticiones POST
    const url=SCRIPT+'?action=save_progress&data='+encoded;
    const r=await fetch(url);
    const d=await r.json();
    if(d.ok){
      setSaveStatus('Guardado en Drive ✓ ('+Object.keys(P.cards).length+' especies)','ok');
    } else {
      setSaveStatus('Error al guardar: '+(d.error||'?'),'err');
    }
  }catch(e){
    setSaveStatus('Error de red — progreso no guardado','err');
  }
}

function setSaveStatus(msg,cls){
  const el=document.getElementById('save-status');
  if(!el)return;
  el.textContent=msg;
  el.className='save-status'+(cls?' '+cls:'');
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')saveP();
});

// ── IMAGES ───────────────────────────────────────────────────────────────────
async function probeImgs(e){
  const id=e[D_ID];
  if(IMG[id])return;
  IMG[id]={variants:null,loaded:{}};
  const url=SCRIPT+'?probe=1&cat='+encodeURIComponent(e[D_CATF])
    +'&sub='+encodeURIComponent(e[D_SUBF])
    +'&base='+encodeURIComponent(e[D_BASE]||sciBase(e[D_SCI]));
  try{
    const r=await fetch(url);const d=await r.json();
    IMG[id].variants=d.variants||[];
  }catch(err){IMG[id].variants=[];}
}

async function loadImg(e,fn){
  const id=e[D_ID];
  if(!IMG[id])IMG[id]={variants:[],loaded:{}};
  if(IMG[id].loaded[fn]!==undefined)return IMG[id].loaded[fn];
  IMG[id].loaded[fn]=null;
  const url=SCRIPT+'?img=1&cat='+encodeURIComponent(e[D_CATF])
    +'&sub='+encodeURIComponent(e[D_SUBF])+'&file='+encodeURIComponent(fn);
  try{
    const r=await fetch(url);const d=await r.json();
    IMG[id].loaded[fn]=d.dataUrl||null;
    return IMG[id].loaded[fn];
  }catch(err){IMG[id].loaded[fn]=null;return null;}
}

async function getImg(e,idx){
  await probeImgs(e);
  const id=e[D_ID];
  const vars=IMG[id]?.variants||[];
  if(!vars.length)return null;
  const fn=vars[Math.min(idx,vars.length-1)];
  return await loadImg(e,fn);
}

function sciBase(s){return s.replace(/\(.*?\)/g,'').trim().split(/\s+/).slice(0,2).join('');}

// ── DISTRACTORS ───────────────────────────────────────────────────────────────
function distractors(e,n=2){
  const sub=e[D_SUB],cat=e[D_CAT],id=e[D_ID];
  let pool=ALL.filter(x=>x[D_SUB]===sub&&x[D_ID]!==id);
  if(pool.length<n)pool=[...pool,...ALL.filter(x=>x[D_CAT]===cat&&x[D_SUB]!==sub&&x[D_ID]!==id)];
  for(let i=pool.length-1;i>0;i--){const j=~~(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool.slice(0,n);
}

function updateHome(){
  const t=today();
  const cs=P.cards;
  const seen   =Object.values(cs).filter(c=>c.seen).length;
  const due    =Object.entries(cs).filter(([,c])=>c.seen&&c.due<=t).length;
  const mastered=Object.values(cs).filter(c=>(c.interval||0)>=21).length;
  const pct    =Math.round(seen/TOTAL*100);
  document.getElementById('h-seen').textContent=seen;
  document.getElementById('h-due').textContent=due;
  document.getElementById('h-dom').textContent=mastered;
  document.getElementById('h-streak').textContent='🔥'+(P.stats.streak||0);
  document.getElementById('h-pct').textContent=pct+'%';
  document.getElementById('h-due-n').textContent=due;
  document.getElementById('ring').style.strokeDashoffset=289-(289*pct/100);
  document.getElementById('btn-rev').disabled=due===0;
}

// ── SESSION START ─────────────────────────────────────────────────────────────
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=~~(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function startLearn(cat,sub){
  let pool=ALL.filter(e=>(!cat||e[D_CAT]===cat)&&(!sub||e[D_SUB]===sub));
  // Unseen first (shuffled), then seen (shuffled)
  const unseen=shuffle(pool.filter(e=>!P.cards[e[D_ID]]?.seen));
  const seen  =shuffle(pool.filter(e=> P.cards[e[D_ID]]?.seen));
  SESS={queue:[...unseen,...seen].map(e=>e[D_ID]),cur:0,correct:0,total:0,
    mode:MODE,sim:false,title:sub||cat||'Todo',simTimer:null};
  beginSess();
}

function startReview(){
  const t=today();
  const due=shuffle(ALL.filter(e=>{const c=P.cards[e[D_ID]];return c?.seen&&c.due<=t;}));
  SESS={queue:due.map(e=>e[D_ID]),cur:0,correct:0,total:0,
    mode:MODE,sim:false,title:'Repaso',simTimer:null};
  beginSess();
}

function startSim(){
  const prop={'Geología':60,'Botánica':48,'Invertebrados':18,'Vertebrados':24,'Hongos':12,'Histología':12};
  let q=[];
  for(const[cat,n]of Object.entries(prop)){
    q.push(...shuffle(ALL.filter(e=>e[D_CAT]===cat)).slice(0,n).map(e=>e[D_ID]));
  }
  SESS={queue:shuffle(q),cur:0,correct:0,total:0,
    mode:MODE,sim:true,title:'Simulacro',simTimer:null};
  beginSess();
}

function beginSess(){
  document.getElementById('sess-ttl').textContent=SESS.title;
  document.getElementById('mode-bar').style.display=SESS.sim?'none':'flex';
  updateModeBar();
  show('s-sess');
  renderCard();
}

function updateModeBar(){
  ['A','B','C'].forEach(m=>document.getElementById('mb-'+m.toLowerCase())
    .classList.toggle('active',SESS.mode===m));
}

function switchMode(m){SESS.mode=m;MODE=m;updateModeBar();renderCard();}

// ── RENDER CARD ───────────────────────────────────────────────────────────────
async function renderCard(){
  if(SESS.cur>=SESS.queue.length){endSess();return;}
  const id=SESS.queue[SESS.cur];
  const e=ALL.find(x=>x[D_ID]===id);
  if(!e){SESS.cur++;renderCard();return;}

  const pct=Math.round(SESS.cur/SESS.queue.length*100);
  document.getElementById('sess-pg').style.width=pct+'%';
  document.getElementById('sess-ctr').textContent=(SESS.cur+1)+'/'+SESS.queue.length;

  // Mark seen immediately
  if(!P.cards[id])P.cards[id]={};
  P.cards[id].seen=true;

  // Preload next
  if(SESS.cur+1<SESS.queue.length){
    const ne=ALL.find(x=>x[D_ID]===SESS.queue[SESS.cur+1]);
    if(ne)probeImgs(ne);
  }

  if(SESS.mode==='A')await modeA(e);
  else if(SESS.mode==='B')await modeB(e);
  else await modeC(e);

  if(SESS.sim)startSimTimer(e);
}

async function modeA(e){

    imgCard(e,cc)+tagLine(e,cc,'¿Cuál es el nombre científico?')+
    `<div class="opt-list">`+
    opts.map((o,i)=>`<button class="opt" id="oa${i}" onclick="ansA(${i},${ci})">${o[D_SCI]}</button>`).join('')+
    `</div>`+fbDiv();

function ansA(chosen,correct){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const ok=chosen===correct;
  document.getElementById('oa'+chosen).classList.add(ok?'ok':'ko');
  if(!ok)document.getElementById('oa'+correct).classList.add('show-ok');
  answer(SESS.queue[SESS.cur],ok,false);
  showFb(SESS.queue[SESS.cur],ok,false);
  vib(ok);

    </div>`+fbDiv();
