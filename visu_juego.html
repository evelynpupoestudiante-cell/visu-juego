<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VISU">
<title>VISU · Identificación de especies</title>
<link rel="manifest" href="visu_manifest.json">
<style>
:root{
  --bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#252540;
  --brd:#333355;--txt:#e8e8f0;--txt2:#9090b0;
  --gold:#c8922a;--gold-l:#f0c060;
  --grn:#2d8a5a;--grn-l:#4db87a;
  --red:#c03040;--red-l:#e05060;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
.c-geo{--cc:#c8922a;--cl:#1a1000}
.c-bot{--cc:#3daa6a;--cl:#001a0a}
.c-hon{--cc:#a06030;--cl:#1a0800}
.c-inv{--cc:#3a80b0;--cl:#001020}
.c-ver{--cc:#8050c0;--cl:#100820}
.c-his{--cc:#c04060;--cl:#1a0008}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px}
body{display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}
/* HEADER */
.hdr{padding:calc(var(--sat) + 10px) 16px 10px;background:var(--bg2);
  border-bottom:1px solid var(--brd);display:flex;align-items:center;
  gap:10px;flex-shrink:0}
.hdr-title{font-size:17px;font-weight:700;color:var(--gold);flex:1}
.hdr-back{background:none;border:none;color:var(--txt2);font-size:22px;
  cursor:pointer;padding:4px 8px;border-radius:8px;line-height:1}
.hdr-back:active{background:var(--bg3)}
.badge{background:var(--bg3);border:1px solid var(--brd);border-radius:20px;
  padding:4px 10px;font-size:13px;color:var(--gold-l);font-weight:600}
/* HOME */
.home-body{flex:1;overflow-y:auto;padding:20px 16px calc(var(--sab) + 16px)}
.logo{text-align:center;padding:20px 0 12px}
.logo h1{font-size:38px;font-weight:800;color:var(--gold);letter-spacing:3px}
.logo p{font-size:13px;color:var(--txt2);margin-top:4px}
.ring-wrap{display:flex;justify-content:center;margin:8px 0 18px}
.ring-rel{position:relative;width:110px;height:110px}
.ring-rel svg{width:110px;height:110px;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--bg3);stroke-width:8}
.ring-fill{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;
  transition:stroke-dashoffset .6s}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring-pct{font-size:22px;font-weight:700;color:var(--gold-l)}
.ring-lbl{font-size:10px;color:var(--txt2);margin-top:1px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.scard{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;
  padding:12px 8px;text-align:center}
.scard-n{font-size:22px;font-weight:700}
.scard-l{font-size:10px;color:var(--txt2);margin-top:2px}
.sec-title{font-size:12px;font-weight:600;color:var(--txt2);
  text-transform:uppercase;letter-spacing:.08em;margin:4px 0 10px}
.big-btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:15px;
  font-weight:600;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;
  gap:12px;text-align:left;font-family:inherit;transition:transform .1s}
.big-btn:active{transform:scale(.97)}
.btn-icon{font-size:26px;flex-shrink:0}
.btn-text{flex:1}
.btn-sub{font-size:11px;opacity:.75;font-weight:400;display:block;margin-top:2px}
.btn-n{background:rgba(0,0,0,.2);border-radius:8px;padding:2px 8px;font-size:12px}
.b-rev{background:linear-gradient(135deg,#1a5a3a,#2d8a5a);color:#e0ffe0}
.b-lrn{background:linear-gradient(135deg,#1a2a5a,#2a4ab0);color:#e0e8ff}
.b-sim{background:linear-gradient(135deg,#5a1a2a,#c03040);color:#ffe0e0}
.b-rev:disabled,.b-lrn:disabled{opacity:.35;cursor:default}
.mode-chips{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--brd);
  background:var(--bg2);color:var(--txt2);font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1000;font-weight:600}
.save-status{font-size:11px;color:var(--txt2);text-align:center;
  padding:6px;margin-bottom:6px;min-height:20px}
.save-status.ok{color:var(--grn-l)}
.save-status.err{color:var(--red-l)}
/* SELECTOR */
.sel-body{flex:1;overflow-y:auto;padding:12px 16px calc(var(--sab)+16px)}
.sel-all{width:100%;padding:13px;background:var(--bg2);border:1px solid var(--brd);
  border-radius:12px;color:var(--txt);font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;margin-bottom:12px}
.sel-all:active{opacity:.7}
.cat-card{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;
  overflow:hidden;margin-bottom:10px}
.cat-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.cat-hdr:active{opacity:.7}
.cat-dot{width:9px;height:9px;border-radius:50%;background:var(--cc,var(--gold));flex-shrink:0}
.cat-nm{font-size:15px;font-weight:600;flex:1;color:var(--cc,var(--txt))}
.cat-cnt{font-size:12px;color:var(--txt2)}
.cat-arr{font-size:16px;color:var(--txt2);transition:transform .2s}
.cat-card.open .cat-arr{transform:rotate(90deg)}
.sub-list{display:none;border-top:1px solid var(--brd)}
.cat-card.open .sub-list{display:block}
.sub-item{padding:11px 14px 11px 32px;display:flex;align-items:center;
  border-bottom:1px solid var(--brd);cursor:pointer}
.sub-item:last-child{border-bottom:none}
.sub-item:active{background:var(--bg3)}
.sub-nm{flex:1;font-size:14px}
.sub-cnt{font-size:12px;color:var(--txt2);margin-right:8px}
.sub-pct{font-size:11px;color:var(--grn-l)}
/* SESSION */
.sess-pg{height:4px;background:var(--bg3);flex-shrink:0}
.sess-pg-fill{height:100%;background:var(--gold);transition:width .4s}
.mode-bar{display:flex;gap:6px;padding:8px 12px;background:var(--bg2);
  border-bottom:1px solid var(--brd);flex-shrink:0}
.mb{flex:1;padding:6px 4px;border:1px solid var(--brd);border-radius:8px;
  background:transparent;color:var(--txt2);font-size:12px;cursor:pointer;
  font-family:inherit;font-weight:500}
.mb.active{background:var(--gold);border-color:var(--gold);color:#1a1000;font-weight:700}
.card-wrap{flex:1;overflow-y:auto;padding:14px 14px 90px}
/* CARDS */
.q-card{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;
  overflow:hidden;margin-bottom:12px}
.q-tag{padding:8px 14px;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;display:flex;align-items:center;gap:6px}
.q-dot{width:7px;height:7px;border-radius:50%}
.img-zone{width:100%;min-height:220px;background:var(--bg3);display:flex;
  align-items:center;justify-content:center;position:relative;overflow:hidden}
.img-zone img{width:100%;max-height:300px;object-fit:contain;display:block}
.img-ph{color:var(--txt2);font-size:13px;text-align:center;padding:20px}
.img-spin{font-size:32px;animation:spin .8s linear infinite}
.img-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);
  border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;
  font-size:20px;display:flex;align-items:center;justify-content:center}
.img-nav.prev{left:8px}
.img-nav.next{right:8px}
.img-nav:disabled{opacity:.15}
.img-ctr{position:absolute;bottom:7px;right:10px;background:rgba(0,0,0,.5);
  color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
.q-body{padding:12px 14px}
.q-hint{font-size:12px;color:var(--txt2);margin-bottom:6px}
.q-name{font-size:18px;font-weight:700;margin-bottom:3px}
.q-sci{font-size:14px;font-style:italic;color:var(--txt2)}
/* OPTIONS A */
.opt-list{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px}
.opt{padding:14px 16px;background:var(--bg3);border:2px solid var(--brd);
  border-radius:12px;font-size:14px;font-style:italic;cursor:pointer;
  text-align:left;font-family:inherit;color:var(--txt);line-height:1.4}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--grn-l);background:#0a2a18;color:var(--grn-l)}
.opt.ko{border-color:var(--red-l);background:#2a0810;color:var(--red-l)}
.opt.show-ok{border-color:var(--grn-l);background:#0a2a18;color:var(--grn-l)}
.opt:disabled{cursor:default}
/* INPUT B */
.inp-zone{padding:0 14px 14px}
.sci-inp{width:100%;padding:14px;background:var(--bg3);border:2px solid var(--brd);
  border-radius:12px;color:var(--txt);font-size:15px;font-style:italic;
  font-family:inherit;outline:none;transition:border-color .15s}
.sci-inp:focus{border-color:var(--gold)}
.sci-inp.ok{border-color:var(--grn-l);background:#0a2a18}
.sci-inp.ko{border-color:var(--red-l)}
.sci-inp.part{border-color:var(--gold);background:#1a1208}
.chk-btn{width:100%;padding:14px;margin-top:10px;background:var(--gold);
  border:none;border-radius:12px;color:#1a1000;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit}
.chk-btn:active{opacity:.8}
.chk-btn:disabled{opacity:.35;cursor:default}
/* IMAGES C */
.img-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 14px}
.img-opt{border:3px solid transparent;border-radius:12px;overflow:hidden;
  cursor:pointer;background:var(--bg3);aspect-ratio:1;display:flex;
  align-items:center;justify-content:center;font-size:28px}
.img-opt img{width:100%;height:100%;object-fit:cover}
.img-opt.ok{border-color:var(--grn-l)}
.img-opt.ko{border-color:var(--red-l)}
.img-opt.show-ok{border-color:var(--grn-l)}
.img-opt.done{cursor:default}
/* FEEDBACK */
.fb{padding:12px 14px;border-radius:12px;font-size:14px;display:none;
  margin:0 14px 12px;line-height:1.55}
.fb.show{display:block}
.fb.ok{background:#0a2a18;border:1px solid var(--grn);color:var(--grn-l)}
.fb.ko{background:#2a0810;border:1px solid var(--red);color:var(--red-l)}
.fb.part{background:#1a1208;border:1px solid var(--gold);color:var(--gold-l)}
.fb-mnem{margin-top:8px;font-size:13px;font-style:italic;color:var(--txt2)}
.next-btn{width:100%;padding:14px;margin-top:8px;background:var(--bg3);
  border:1px solid var(--brd);border-radius:12px;color:var(--txt);font-size:15px;
  font-weight:600;cursor:pointer;font-family:inherit}
.next-btn:active{opacity:.7}
/* SIM TIMER */
.sim-hdr{font-size:14px;color:var(--gold-l)}
/* SUMMARY */
.sum-body{flex:1;overflow-y:auto;padding:20px 16px calc(var(--sab)+16px);text-align:center}
.sum-em{font-size:56px;margin:16px 0 8px}
.sum-ttl{font-size:22px;font-weight:700;margin-bottom:6px}
.sum-sub{font-size:14px;color:var(--txt2);margin-bottom:24px}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.sum-card{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:14px 8px}
.sum-n{font-size:26px;font-weight:700;margin-bottom:2px}
.sum-l{font-size:11px;color:var(--txt2)}
.sum-bar-wrap{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;
  padding:14px;margin-bottom:14px;text-align:left}
.sum-bar-lbl{font-size:12px;color:var(--txt2);margin-bottom:6px}
.sum-bar-trk{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.sum-bar-fill{height:100%;background:var(--gold);border-radius:4px;transition:width .8s}
.sum-btns{display:flex;flex-direction:column;gap:10px}
.sum-btn{padding:15px;border-radius:14px;border:none;font-size:15px;
  font-weight:600;cursor:pointer;font-family:inherit}
.sum-btn-pri{background:var(--gold);color:#1a1000}
.sum-btn-sec{background:var(--bg2);border:1px solid var(--brd);color:var(--txt)}
.sum-btn:active{opacity:.8}
/* STATS */
.stats-body{flex:1;overflow-y:auto;padding:14px 14px calc(var(--sab)+14px)}
.st-sec{margin-bottom:20px}
.st-sec-ttl{font-size:12px;font-weight:600;color:var(--txt2);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.cat-pg-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cat-pg-nm{font-size:13px;width:100px;flex-shrink:0}
.cat-pg-trk{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden}
.cat-pg-fill{height:100%;border-radius:4px;transition:width .6s}
.cat-pg-pct{font-size:12px;color:var(--txt2);width:36px;text-align:right}
.fails-list{display:flex;flex-direction:column;gap:6px}
.fail-item{background:var(--bg2);border:1px solid var(--brd);border-radius:10px;
  padding:10px 12px;display:flex;align-items:center;gap:10px}
.fail-sci{font-size:13px;font-style:italic;flex:1}
.fail-n{font-size:12px;color:var(--red-l);font-weight:600}
.st-glb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="s-home">
  <div class="hdr">
    <span class="hdr-title">⬡ VISU</span>
    <span class="badge" id="h-streak">🔥 0</span>
    <button class="hdr-back" onclick="showStats()">📊</button>
  </div>
  <div class="home-body">
    <div class="logo"><h1>VISU</h1><p>Identificación de especies · Oposiciones Madrid</p></div>
    <div class="ring-wrap">
      <div class="ring-rel">
        <svg viewBox="0 0 110 110">
          <circle class="ring-track" cx="55" cy="55" r="46"/>
          <circle class="ring-fill" id="ring" cx="55" cy="55" r="46"
            stroke-dasharray="289" stroke-dashoffset="289"/>
        </svg>
        <div class="ring-txt">
          <span class="ring-pct" id="h-pct">0%</span>
          <span class="ring-lbl">vistas</span>
        </div>
      </div>
    </div>
    <div class="stats-row">
      <div class="scard"><div class="scard-n" id="h-seen">0</div><div class="scard-l">Vistas</div></div>
      <div class="scard"><div class="scard-n" id="h-due">0</div><div class="scard-l">Para hoy</div></div>
      <div class="scard"><div class="scard-n" id="h-dom">0</div><div class="scard-l">Dominadas</div></div>
    </div>
    <div class="save-status" id="save-status"></div>
    <div class="sec-title">Modo de juego</div>
    <div class="mode-chips">
      <button class="chip on" id="chip-a" onclick="setMode('A')">🖼 → Nombre</button>
      <button class="chip"    id="chip-b" onclick="setMode('B')">🖼 → Escribir</button>
      <button class="chip"    id="chip-c" onclick="setMode('C')">Nombre → 🖼</button>
    </div>
    <div class="sec-title">Sesión</div>
    <button class="big-btn b-rev" id="btn-rev" onclick="startReview()">
      <span class="btn-icon">🔁</span>
      <span class="btn-text">Repasar hoy<span class="btn-sub">Lo que el algoritmo programa para hoy</span></span>
      <span class="btn-n" id="h-due-n">0</span>
    </button>
    <button class="big-btn b-lrn" onclick="showSel()">
      <span class="btn-icon">📖</span>
      <span class="btn-text">Aprender bloque nuevo<span class="btn-sub">Elige categoría y subcategoría</span></span>
    </button>
    <button class="big-btn b-sim" onclick="startSim()">
      <span class="btn-icon">🏆</span>
      <span class="btn-text">Simulacro de examen<span class="btn-sub">30 s por pregunta · proporciones reales</span></span>
    </button>
  </div>
</div>

<!-- SELECTOR -->
<div class="screen" id="s-sel">
  <div class="hdr">
    <button class="hdr-back" onclick="show('s-home')">←</button>
    <span class="hdr-title">Aprender bloque</span>
  </div>
  <div class="sel-body">
    <button class="sel-all" onclick="startLearn(null,null)">Todo (506 especies)</button>
    <div id="cat-list"></div>
  </div>
</div>

<!-- SESSION -->
<div class="screen" id="s-sess">
  <div class="hdr">
    <button class="hdr-back" onclick="exitSess()">←</button>
    <span class="hdr-title" id="sess-ttl">Sesión</span>
    <span class="badge" id="sess-ctr">1/0</span>
  </div>
  <div class="sess-pg"><div class="sess-pg-fill" id="sess-pg"></div></div>
  <div class="mode-bar" id="mode-bar">
    <button class="mb active" id="mb-a" onclick="switchMode('A')">🖼→Nombre</button>
    <button class="mb"        id="mb-b" onclick="switchMode('B')">🖼→Escribir</button>
    <button class="mb"        id="mb-c" onclick="switchMode('C')">Nombre→🖼</button>
  </div>
  <div class="card-wrap" id="card-wrap"></div>
</div>

<!-- SUMMARY -->
<div class="screen" id="s-sum">
  <div class="hdr"><span class="hdr-title">Resultado</span></div>
  <div class="sum-body" id="sum-body"></div>
</div>

<!-- STATS -->
<div class="screen" id="s-stats">
  <div class="hdr">
    <button class="hdr-back" onclick="show('s-home')">←</button>
    <span class="hdr-title">Estadísticas</span>
  </div>
  <div class="stats-body" id="stats-body"></div>
</div>

<script>
const SCRIPT='https://script.google.com/macros/s/AKfycbxe6iZALYLb94DiZAk4KoxvXYvDeza_vJuUgOsAQxX4WhGFb4fO0l_Ob5nKyFRZ4s0L8g/exec';
const D_ID=0,D_CAT=1,D_SUB=2,D_NAME=3,D_SCI=4,D_FREQ=5,

const ALL=[["FOS-002","Geología","Fósil","Belemnites","Belemnitida (orden)","alta","Forma cilíndrica o de bala con punta aguda — único entre cefalópodos fósiles","La 'bala de cañón de la prehistoria': cilindro apuntado, pesado y sólido — el ammonites que no se enrolló","geología","fósil","Belemnitida"],["FOS-003","Geología","Fósil","Nummulites","Nummulites (género)","media","Forma de moneda o lenteja: circular y plana con espiral interna visible en corte","La 'moneda de piedra del Eoceno': circular, plana y con espiral. Las pirámides de Egipto están hechas de ellos","geología","fósil","Nummulites"],["FOS-005","Geología","Fósil","Graptolites","Graptolithina (subclase)","media","Aspecto de 'sierra' o 'peinilla': serie de tazas (tecas) a lo largo de un eje (estipe)","Los 'jeroglíficos negros en pizarra': rayas negras finas con dientes de sierra. El número de filas de dientes = el período","geología","fósil","Graptolithina"],["FOS-006","Geología","Fósil","Trilobites","Trilobita (clase)","muy_alta","Cuerpo en 3 lóbulos longitudinales: axial (central) + 2 pleurales (laterales)","La 'armadura de tres carriles': cabeza + cuerpo segmentado + cola, con la glabela (bulto central) siempre destacada","geología","fósil","Trilobita"],["FOS-007","Geología","Fósil","Equínidos fósiles","Echinoidea (clase)","alta","Caparazón calcáreo con 5 ambulacros en estrella en la cara superior","El 'corazón de piedra del Cretácico': Micraster tiene forma inconfundible de corazón con ambulacros en estrella de 5 puntas","geología","fósil","Echinoidea"],["FOS-008","Geología","Fósil","Crinoides","Crinoidea (clase)","alta","Discos apilados con orificio central (columnares): lo más frecuente como fósil","Los 'botones de estrella de mar': apila discos de 5 puntas perforados — son vértebras de lirio de mar","geología","fósil","Crinoidea"],["FOS-009","Geología","Fósil","Rudistas","Hippuritida (orden)","media","Valvas muy asimétricas: una cónica grande (fijada al sustrato) + una opercular plana","El 'bival
