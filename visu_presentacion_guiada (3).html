ebrados","sub":"Cnidario","name":"Coral rojo","sci":"Corallium rubrum","fam":"Coralliidae","freq":"media","key":"Esqueleto axial calcáreo rojo brillante ramificado (el 'coral' de joyería)","mnem":"El 'árbol rojo del Mediterráneo': ramas rojas calcáreas con bolitas blancas (pólipos) — el coral de los collares italianos","etym":"Corallium (gr.) = 'coral' · rubrum (lat.) = 'rojo'","notes":"El esqueleto rojo es el producto de joyería. La colonia = muchos pólipos sobre esqueleto calcáreo. Especie protegida (CITES Apéndice III).","hab":"Fondos rocosos mediterráneos; 10-300 m; zonas oscuras","catf":"invertebrados","subf":"cnidario","base":"Coralliumrubrum"},{"id":"COL-001","cat":"Invertebrados","sub":"Insecto","name":"Escarabajo pelotero","sci":"Scarabaeus sacer","fam":"Scarabaeidae","freq":"alta","key":"Negro brillante; cabeza con dientes/quillas radiales en el borde frontal (6 dientes)","mnem":"El 'dios egipcio escarabajo': negro con los dientes en la cabeza y patas largas para empujar la bola de estiércol — el símbolo del sol para los egipcios","etym":"Scarabaeus (lat.) = 'escarabajo' · sacer (lat.) = 'sagrado': el escarabajo sagrado del Antiguo Egipto","notes":"CONFIRMADO: Scarabaeidae en etiquetas de exámenes reales. La cabeza dentada + patas anteriores planas son diagnósticos. Relacionar con el comportamiento de rodado de bolas (coprofagia).","hab":"Zonas áridas y semiáridas con ganado; caminos y pastizales","catf":"invertebrados","subf":"insecto","base":"Scarabaeussacer"},{"id":"COL-002","cat":"Invertebrados","sub":"Insecto","name":"Escarabajo rinoceronte","sci":"Oryctes nasicornis","fam":"Dynastidae (Scarabaeidae)","freq":"alta","key":"Macho: cuerno frontal curvo prominente en la cabeza — absolutamente diagnóstico","mnem":"El 'rinoceronte insecto': el cuerno del macho es inconfundible — el único escarabajo europeo con un cuerno tan llamativo","etym":"Oryctes (gr.) = 'excavador' · nasicornis (lat.) = nasus (nariz) + cornis (cuerno): 'cuerno en la nariz'","notes":"CONFIRMADO: Dynastidae en etiquetas de exámenes reales. El cuerno del macho es absolutamente diagnóstico. Dimorfismo sexual muy marcado.","hab":"Bosques caducifolios; las larvas en madera podrida y compost","catf":"invertebrados","subf":"insecto","base":"Oryctesnasicornis"},{"id":"COL-003","cat":"Invertebrados","sub":"Insecto","name":"Mariquita de 7 puntos","sci":"Coccinella septempunctata","fam":"Coccinellidae","freq":"media","key":"Élitros rojo brillante con exactamente 7 puntos negros (3+3 + 1 compartido)","mnem":"La 'mariquita clásica de cuento': roja con 7 puntos negros — contar los puntos es la forma más rápida de identificar la especie","etym":"Coccinella (lat.) = 'pequeño escarlata' (de coccum = grana roja) · septempunctata = 'de siete puntos'","notes":"La coloración aposemática (rojo+negro = 'soy tóxico') es didácticamente importante. Saber que las larvas también son depredadoras de pulgones.","hab":"Vegetación variada; jardines, campos, bordes de bosque","catf":"invertebrados","subf":"insecto","base":"Coccinellaseptempunctata"},{"id":"COL-004","cat":"Invertebrados","sub":"Insecto","name":"Crisomélido / Chrysomela","sci":"Chrysomela populi","fam":"Chrysomelidae","freq":"alta","key":"Élitros rojo-naranja brillante; cabeza y pronoto azul-metálico iridiscente","mnem":"El 'escarabajo bicolor del chopo': rojo brillante arriba + azul metálico abajo — los colores del equipo de fútbol más iridiscente de los insectos","etym":"Chrysomela (gr.) = chrysos (oro) + melos (extremidad): 'patas doradas' · populi = 'del álamo (Populus)'","notes":"CONFIRMADO: Chrysomelidae en etiquetas de exámenes reales. El contraste rojo/azul metálico es absolutamente diagnóstico. Asociación con chopos — relevante en Madrid (choperas del Jarama).","hab":"Bosques de ribera con chopos y álamos; orillas de ríos","catf":"invertebrados","subf":"insecto","base":"Chrysomelapopuli"},{"id":"COL-005","cat":"Invertebrados","sub":"Insecto","name":"Escarabajo de la patata","sci":"Leptinotarsa decemlineata","fam":"Chrysomelidae","freq":"media","key":"Élitros amarillos con 10 rayas negras longitudinales — absolutamente diagnóstico","mnem":"El 'rayas del Tour de Francia': amarillo con 10 rayas negras exactas — si ves eso en una planta de patata, es él","etym":"Leptinotarsa (gr.) = leptinos (delgado) + tarsus (tarso) · decemlineata = 'de diez rayas'","notes":"Chrysomelidae confirmada. Las 10 rayas negras son absolutamente diagnósticas. Especie invasora procedente de América del Norte — importante como ejemplo de plaga invasora.","hab":"Campos de cultivo de Solanaceae (patata, tomate, berenjena)","catf":"invertebrados","subf":"insecto","base":"Leptinotarsadecemlineata"},{"id":"COL-006","cat":"Invertebrados","sub":"Insecto","name":"Ciervo volante","sci":"Lucanus cervus","fam":"Lucanidae","freq":"alta","key":"Macho: mandíbulas enormes ramificadas como cuernos de ciervo — absolutamente diagnóstico","mnem":"El 'ciervo volador': mandíbulas del macho como cuernos de ciervo — el insecto con las 'astas' más espectaculares de Europa","etym":"Lucanus (lat.) = 'de Lucania' (región italiana) · cervus (lat.) = 'ciervo': por las mandíbulas en cuerna","notes":"Las mandíbulas del macho son absolutamente diagnósticas. Dimorfismo sexual extremo. Especie protegida en muchos países (Directiva Hábitats).","hab":"Bosques de roble y otros caducifolios; las larvas en madera muerta","catf":"invertebrados","subf":"insecto","base":"Lucanuscervus"},{"id":"COL-007","cat":"Invertebrados","sub":"Insecto","name":"Carábido / Escarabajo predador","sci":"Carabus violaceus","fam":"Carabidae","freq":"media","key":"Cuerpo alargado y aplanado con iridiscencia violácea en los márgenes de los élitros","mnem":"El 'escarabajo negro con borde morado': corredor nocturno con destellos violetas en el borde — el depredador nocturno de babosas","etym":"Carabus (gr.) = 'cangrejo de río o escarabajo' · violaceus = 'violáceo'","notes":"Carabidae = familia de escarabajos depredadores corredores. Los élitros soldados (no vuela) son diagnósticos del grupo.","hab":"Bordes de bosque, jardines, zonas húmedas; nocturno","catf":"invertebrados","subf":"insecto","base":"Carabusviolaceus"},{"id":"COL-008","cat":"Invertebrados","sub":"Insecto","name":"Escarabajo de las flores / Cetonia","sci":"Cetonia aurata","fam":"Scarabaeidae (Cetoniinae)","freq":"media","key":"Élitros verde metálico brillante con iridiscencia dorada — absolutamente espectacular","mnem":"El 'escarabajo de joya verde': tan verde y brillante como una esmeralda — el insecto más metálico de los campos en flor","etym":"Cetonia (gr.) = nombre antiguo del escarabajo · aurata (lat.) = 'dorada'","notes":"El verde metálico iridiscente es absolutamente diagnóstico. Muy fácil de recoger sobre flores de cardo o rosa. También Scarabaeidae.","hab":"Prados en flor, jardines, bordes de bosque; zonas soleadas","catf":"invertebrados","subf":"insecto","base":"Cetoniaaurata"},{"id":"CRU-001","cat":"Invertebrados","sub":"Crustáceo","name":"Cangrejo de río autóctono","sci":"Austropotamobius pallipes","fam":"Astacidae","freq":"muy_alta","key":"Quelas (pinzas) con cara interna blanquecina o pálida — diagnóstico de especie","mnem":"El 'cangrejo de manos blancas': las quelas blancas por dentro son la clave — el autóctono ibérico que solo vive en agua limpia y fría","etym":"Austropotamobius (lat.) = austro (sur) + potamos (río) + bios (vida) · pallipes = 'patas pálidas'","notes":"CONFIRMADO: Astacidae en etiquetas de exámenes reales. PAR OBLIGATORIO con el cangrejo americano (Cambaridae). La cara interna blanca de las quelas es el rasgo diferencial más importante. Especie en peligro crítico de extinción en España.","hab":"Ríos y arroyos de montaña con agua limpia, fría y bien oxigenada","catf":"invertebrados","subf":"crustáceo","base":"Austropotamobiuspallipes"},{"id":"CRU-002","cat":"Invertebrados","sub":"Crustáceo","name":"Cangrejo rojo americano","sci":"Procambarus clarkii","fam":"Cambaridae","freq":"muy_alta","key":"Color rojo brillante con tubérculos rojos en quelas y caparazón","mnem":"El 'cangrejo rojo invasor': rojo brillante uniforme con tubérculos — si el cangrejo del río es completamente rojo, es el americano invasor","etym":"Procambarus (lat.) = pro (adelante) + Cambarus (género americano) · clarkii = del zoólogo F. Clark","notes":"CONFIRMADO: Cambaridae en etiquetas de exámenes reales. PAR OBLIGATORIO con A. pallipes (autóctono). El color rojo uniforme + tubérculos son diagnósticos. El par autóctono/invasor es uno de los temas más evaluados en Madrid.","hab":"Ríos, arroyos, arrozales, zonas húmedas; muy adaptable y tolerante","catf":"invertebrados","subf":"crustáceo","base":"Procambarusclarkii"},{"id":"CRU-003","cat":"Invertebrados","sub":"Crustáceo","name":"Galera / Gallineta","sci":"Squilla mantis","fam":"Squillidae","freq":"alta","key":"Cuerpo alargado con telson en abanico con espinas muy llamativas","mnem":"La 'mantis del mar': patas raptoras como la mantis religiosa + telson con abanico de espinas — la galera del mercado","etym":"Squilla (lat.) = 'crustáceo marino' · mantis (gr.) = 'mantis': por las patas raptoras","notes":"Según testimonios de opositores madrileños, la galera (Squilla mantis) aparece muy frecuentemente como muestra de pez/crustáceo de mercado. El telson en abanico espinoso es diagnóstico.","hab":"Fondos arenosos y fangosos del Mediterráneo y Atlántico; 10-150 m","catf":"invertebrados","subf":"crustáceo","base":"Squillamantis"},{"id":"CRU-004","cat":"Invertebrados","sub":"Crustáceo","name":"Percebes","sci":"Pollicipes pollicipes","fam":"Pollicipedidae","freq":"media","key":"Pedúnculo carnoso musculoso cubierto de escamas córneas; placas calcáreas en el capitulo","mnem":"El 'marisco con cuello de cuero': el pedúnculo negro y rugoso + las placas grises en la punta — el percebe del norte","etym":"Pollicipes (lat.) = pollex (pulgar) + pes (pie): 'pie con pulgar' · pollicipes = referencia al pedúnculo","notes":"Cirripedia son crustáceos muy atípicos (sésiles, hermafroditas). El percebe invertido bota sus cirros al filtrar. Contrasta morfológicamente con todos los demás crustáceos.","hab":"Rocas expuestas al oleaje en zonas intermareales del Atlántico norte","catf":"invertebrados","subf":"crustáceo","base":"Pollicipespollicipes"},{"id":"CRU-005","cat":"Invertebrados","sub":"Crustáceo","name":"Cochinilla de la humedad","sci":"Armadillidium vulgare","fam":"Armadillidiidae","freq":"media","key":"Crustáceo terrestre: el único grupo de crustáceos plenamente adaptado a la vida en tierra","mnem":"La 'bolita de la humedad': el único crustáceo terrestre que se hace bola perfecta — un crustáceo que vive en la tierra sin morir","etym":"Armadillidium (lat.) = diminutivo de 'armadillo' · vulgare = 'común'","notes":"Isopoda terrestres = única clase de crustáceos completamente terrestres (respiran por branquias adaptadas). La bola perfecta es diagnóstica de Armadillidium vs. Oniscus (no se enrolla).","hab":"Suelos húmedos, bajo piedras y troncos; jardines, bosques","catf":"invertebrados","subf":"crustáceo","base":"Armadillidiumvulgare"},{"id":"EQU-001","cat":"Invertebrados","sub":"Equinodermo","name":"Erizo de mar","sci":"Paracentrotus lividus","fam":"Parechinidae","freq":"alta","key":"Caparazón esférico con 5 ambulacros y 5 interambulacros (simetría pentámera)","mnem":"El 'cactus del mar morado': esfera con pinchos morados o verdes que se alimenta por debajo y tiene el 'coral' naranja comestible","etym":"Paracentrotus (gr.) = para (junto a) + kentron (punta): 'con puntas' · lividus (lat.) = 'lívido, violáceo'","notes":"La simetría pentámera (5 ambulacros) es el carácter diagnóstico de Echinodermata. Los ambulacros con pies con ventosas son únicos del filo. Especie gastronómica.","hab":"Fondos rocosos intermareales e infralitorales; Mediterráneo y Atlántico","catf":"invertebrados","subf":"equinodermo","base":"Paracentrotuslividus"},{"id":"EQU-002","cat":"Invertebrados","sub":"Equinodermo","name":"Estrella de mar","sci":"Asterias rubens","fam":"Asteriidae","freq":"alta","key":"5 brazos radiantes desde un disco central; cara oral hacia abajo","mnem":"La 'estrella de mar del Atlántico': naranja-rojiza, 5 brazos simétricos — el equinodermo más reconocible e icónico","etym":"Asterias (gr.) = aster (estrella): 'estrellada' · rubens (lat.) = 'rojiza'","notes":"Los 5 brazos + simetría pentámera son diagnósticos. La capacidad de regeneración y la digestión externa (extroversión del estómago) son temas evaluables.","hab":"Fondos rocosos intermareales y sublitorales; atlántico","catf":"invertebrados","subf":"equinodermo","base":"Asteriasrubens"},{"id":"EQU-003","cat":"Invertebrados","sub":"Equinodermo","name":"Pepino de mar / Holoturia","sci":"Holothuria tubulosa","fam":"Holothuriidae","freq":"media","key":"Cuerpo cilíndrico blando, alargado como un pepino o salchicha","mnem":"La 'salchicha espinosa del mar': cilíndrica, blanda, con tubérculos oscuros — y si la coges fuerte, te lanza las tripas","etym":"Holothuria (gr.) = holos (completo) + thuris (olfato): 'completamente olorosa' · tubulosa = 'tubulosa'","notes":"La forma cilíndrica + evisceracion defensiva son absolutamente diagnósticos. Los holotúridos muestran que la simetría pentámera de Echinodermata puede ser secundaria a bilateral.","hab":"Fondos arenosos y rocosos litorales y sublitorales; mediterráneo","catf":"invertebrados","subf":"equinodermo","base":"Holothuriatubulosa"},{"id":"EQU-004","cat":"Invertebrados","sub":"Equinodermo","name":"Crinoide / Lirio de mar","sci":"Antedon mediterranea","fam":"Antedonidae","freq":"media","key":"5 pares de brazos plumosos que irradian desde el centro (como una flor)","mnem":"La 'flor plumosa del mar': parece una flor submarina de pétalos plumosos — los crinoideosestan 'al revés' (la boca hacia arriba, al contrario que otros equinodermos)","etym":"Antedon (gr.) = 'flor anterior': por el aspecto de la parte oral · mediterranea = 'mediterránea'","notes":"La boca hacia arriba (al revés que la mayoría de equinodermos) es un carácter diagnóstico de clase. Los brazos plumosos filtran el plancton.","hab":"Fondos rocosos mediterráneos; 0-200 m","catf":"invertebrados","subf":"equinodermo","base":"Antedonmediterranea"},{"id":"HEM-001","cat":"Invertebrados","sub":"Insecto","name":"Chinche escudo verde","sci":"Palomena prasina","fam":"Pentatomidae","freq":"muy_alta","key":"Cuerpo en forma de escudo pentagonal (5 ángulos) — nombre de la familia","mnem":"La 'chinche del escudo verde que apesta': forma de escudo + verde brillante + olor horrible al cogerla","etym":"Palomena (gr.) = 'que vaga' · prasina (gr.) = 'verde puerro, verde intenso'","notes":"CONFIRMADO: Pentatomidae en etiquetas de exámenes reales de Madrid — además aparece recurrentemente en las etiquetas del blog. La forma pentagonal del cuerpo da nombre a la familia y es diagnóstica.","hab":"Vegetación variada; árboles, arbustos, plantas herbáceas","catf":"invertebrados","subf":"insecto","base":"Palomenaprasina"},{"id":"HEM-002","cat":"Invertebrados","sub":"Insecto","name":"Chinche del grano / Eurydema","sci":"Eurydema ornata","fam":"Pentatomidae","freq":"alta","key":"Patrón de colores muy llamativo: rojo/naranja y negro en mosaico","mnem":"La 'chinche del carnaval': roja con puntos negros como un disfraz de lunares — Pentatomidae con colores aposemáticos","etym":"Eurydema (gr.) = eury (ancho) + dema (cuerpo): 'cuerpo ancho' · ornata = 'adornada'","notes":"Pentatomidae confirmada. El patrón rojo-negro aposemático es diagnóstico. Plaga de Brassicaceae — relación agricultura-insecto evaluable.","hab":"Campos de cultivo de crucíferas (Brassicaceae); bordes de camino","catf":"invertebrados","subf":"insecto","base":"Eurydemaornata"},{"id":"HEM-003","cat":"Invertebrados","sub":"Insecto","name":"Chinche del agua / Gerris","sci":"Gerris lacustris","fam":"Gerridae","freq":"media","key":"Camina sobre la superficie del agua (tensión superficial en las patas hidrofóbicas)","mnem":"El 'insecto patinador del agua': el único que camina sobre el agua sin hundirse — las patas largas sobre la película de agua son inconfundibles","etym":"Gerris (lat.) = 'escudo de mimbre' (forma del cuerpo) · lacustris = 'de los lagos'","notes":"El caminar sobre el agua es absolutamente diagnóstico y relaciona con tensión superficial (física). Muy usado didácticamente.","hab":"Superficie de ríos, arroyos, lagos y charcos tranquilos","catf":"invertebrados","subf":"insecto","base":"Gerrislacustris"},{"id":"HEM-004","cat":"Invertebrados","sub":"Insecto","name":"Cigarra / Chicharra","sci":"Cicada orni","fam":"Cicadidae","freq":"media","key":"Alas membranosas transparentes de gran tamaño; cuerpo pardo-verdoso grande","mnem":"La 'cantante del verano': el insecto que llena el verano mediterráneo de sonido — las alas transparentes y el voluminoso abdomen son su firma","etym":"Cicada (lat.) = 'cigarra' (onomatopéyico del canto) · orni = 'del fresno'","notes":"El canto como sistema de comunicación (tímbales) es un tema frecuente. Solo los machos cantan. Metamorfosis hemimetábola con larvas subterráneas (hasta 17 años en algunas especies).","hab":"Bosques mediterráneos; zonas soleadas con árboles","catf":"invertebrados","subf":"insecto","base":"Cicadaorni"},{"id":"LEP-001","cat":"Invertebrados","sub":"Insecto","name":"Mariposa rey / Danaide monarca","sci":"Danaus plexippus","fam":"Nymphalidae (Danainae)","freq":"media","key":"Alas naranja-rojizo intenso con venas negras gruesas y borde negro con puntos blancos","mnem":"La 'mariposa naranja de las monarquías': naranja intenso con venas negras tan gruesas que parecen las divisiones de un vitral","etym":"Danaus (gr.) = de Danao (personaje mitológico) · plexippus (gr.) = jinete, conductor","notes":"Importante como especie invasora y como ejemplo de aposematismo + mimetismo mülleriano. Nymphalidae = cuatro patas funcionales (las anteriores reducidas).","hab":"Zonas con Asclepias; migradora (migración de miles de km)","catf":"invertebrados","subf":"insecto","base":"Danausplexippus"},{"id":"LEP-002","cat":"Invertebrados","sub":"Insecto","name":"Mariposa de la col","sci":"Pieris brassicae","fam":"Pieridae","freq":"alta","key":"Alas blancas con punta alar negra en las anteriores; ♀ con 2 puntos negros adicionales","mnem":"La 'mariposa blanca de la huerta': blanca con puntas negras — siempre revoloteando en los huertos de coles","etym":"Pieris (gr.) = 'musa, piéride' · brassicae (lat.) = 'de la col (Brassica)'","notes":"La mariposa más común y reconocible. Importante como plaga agrícola (larvas devoran crucíferas). Dimorfismo sexual: ♀ con 2 manchas negras en las alas anteriores.","hab":"Huertos, jardines, campos de crucíferas; ubicua","catf":"invertebrados","subf":"insecto","base":"Pierisbrassicae"},{"id":"LEP-003","cat":"Invertebrados","sub":"Insecto","name":"Mariposa isabelina / Parnassius","sci":"Parnassius apollo","fam":"Papilionidae","freq":"alta","key":"Alas blancas semitranslúcidas con manchas rojas oceladas en las posteriores (ocelos = ojo)","mnem":"La 'mariposa luna de la sierra': blanca translúcida con manchas rojas como ojos — la más espectacular de la sierra","etym":"Parnassius = del monte Parnaso (Grecia) · apollo = dios Apolo","notes":"Especie protegida en España (especie en peligro en muchas regiones). Los ocelos rojos en las alas posteriores son absolutamente diagnósticos. Presente en Guadarrama.","hab":"Alta montaña (800-2500 m); prados alpinos con Sedum y Sempervivum (plantas huésped)","catf":"invertebrados","subf":"insecto","base":"Parnassiusapollo"},{"id":"LEP-004","cat":"Invertebrados","sub":"Insecto","name":"Esfinge de la calavera","sci":"Acherontia atropos","fam":"Sphingidae","freq":"media","key":"Tórax con patrón que imita una calavera humana — absolutamente inconfundible","mnem":"La 'mariposa calavera': el patrón del tórax es una calavera tan reconocible que no necesita descripción adicional","etym":"Acherontia (gr.) = Aqueronte (río del inframundo) · atropos (gr.) = Átropos (Parca que corta el hilo de la vida)","notes":"La imagen de la calavera en el tórax es absolutamente diagnóstica y muy impactante. Aparece en el famoso cartel de 'El silencio de los corderos'. Roba miel de colmenas.","hab":"Zonas mediterráneas con Solanaceae; migradora","catf":"invertebrados","subf":"insecto","base":"Acherontiaatropos"},{"id":"LEP-005","cat":"Invertebrados","sub":"Insecto","name":"Oso del rosal / Arctia","sci":"Arctia caja","fam":"Erebidae (Arctiinae)","freq":"alta","key":"Alas anteriores: marrón con manchas blancas irregulares (patrón tipo camuflaje)","mnem":"La 'polilla sorpresa': en reposo parece ramas secas (camuflaje), pero al abrir las alas muestra el rojo-naranja de alarma — ¡sorpresa!","etym":"Arctia (gr.) = arktos (oso): por las orugas peludas · caja = nombre antiguo latino","notes":"CONFIRMADO: Erebidae en etiquetas de exámenes reales. El contraste camuflaje/aposematismo es un ejemplo clásico de estrategia defensiva dual. Muy vistosa para examen.","hab":"Bordes de bosque, jardines, praderas; nocturna","catf":"invertebrados","subf":"insecto","base":"Arctiacaja"},{"id":"MIR-001","cat":"Invertebrados","sub":"Miriápodo","name":"Escolopendra","sci":"Scolopendra cingulata","fam":"Scolopendridae","freq":"alta","key":"Cuerpo aplanado dorso-ventralmente con 21-23 pares de patas (1 par por segmento)","mnem":"El 'ciempiés con veneno en la cabeza': el primer par de patas son garfios venenosos — la 'mordedura' de la escolopendra","etym":"Scolopendra (gr.) = nombre griego del ciempiés · cingulata (lat.) = 'ceñida, con bandas'","notes":"CONFIRMADO: Scolopendridae en etiquetas de exámenes reales. Las forcípulas (1er par de patas modificadas en veneno) son el carácter diagnóstico de Chilopoda. Diferencia vs. Diplopoda: Chilopoda = 1 par de patas/segmento; Diplopoda = 2 pares/segmento.","hab":"Zonas mediterráneas secas; bajo piedras y corteza","catf":"invertebrados","subf":"miriápodo","base":"Scolopendracingulata"},{"id":"MIR-002","cat":"Invertebrados","sub":"Miriápodo","name":"Milpiés / Diplópodo","sci":"Iulus sp.","fam":"Julidae","freq":"media","key":"Cuerpo cilíndrico (no aplanado) con 2 pares de patas por segmento","mnem":"El 'milpiés bola': se enrolla en espiral como un muelle cuando se asusta — eso + el movimiento lento es lo opuesto a la escolopendra","etym":"Iulus (gr.) = 'catkin, amento': por la forma alargada","notes":"El par de patas por segmento (2 en milpiés vs. 1 en ciempiés) es la clave diferencial obligatoria. El enrollamiento defensivo es muy llamativo.","hab":"Suelos húmedos con hojarasca; bosques y jardines","catf":"invertebrados","subf":"miriápodo","base":"Iulussp."},{"id":"MIR-003","cat":"Invertebrados","sub":"Miriápodo","name":"Quilópodo litobiomorfo","sci":"Lithobius forficatus","fam":"Lithobiidae","freq":"media","key":"15 pares de patas; cuerpo plano y marrón-rojizo brillante","mnem":"El 'ciempiés naranja de debajo de las macetas': marrón-naranja brillante, pequeño y rápido — el ciempiés típico de los jardines","etym":"Lithobius (gr.) = lithos (piedra) + bios (vida): 'el que vive bajo las piedras' · forficatus = 'con tijeras'","notes":"El más común en las colecciones de IES. 15 pares de patas + color naranja-castaño + tamaño pequeño son diagnósticos.","hab":"Bajo piedras, corteza, macetas; jardines y bosques","catf":"invertebrados","subf":"miriápodo","base":"Lithobiusforficatus"},{"id":"MOL-001","cat":"Invertebrados","sub":"Molusco","name":"Caracol de jardín","sci":"Helix aspersa (Cornu aspersum)","fam":"Helicidae","freq":"alta","key":"Concha dextrógira (gira a la derecha) globosa con 4-5 vueltas","mnem":"El 'caracol de la paella': concha parda con bandas y boca blanca — el caracol de jardín más común y reconocible de España","etym":"Helix (gr.) = 'espiral' · aspersa (lat.) = 'moteada, salpicada'","notes":"La espiral dextrógira (hacia la derecha al mirar desde arriba) es un carácter genético. Gasterópodo hermafrodita. Muy fácil de recoger como muestra.","hab":"Jardines, bordes de camino, matorrales; zonas húmedas","catf":"invertebrados","subf":"molusco","base":"Helixaspersa"},{"id":"MOL-002","cat":"Invertebrados","sub":"Molusco","name":"Mejillón","sci":"Mytilus galloprovincialis","fam":"Mytilidae","freq":"alta","key":"Concha azul-negruzca, alargada en forma de cuña; interior nacarado violáceo","mnem":"El 'bivalvo azul de las rocas': azul oscuro brillante con el nacarado violeta por dentro — el mejillón del mercado","etym":"Mytilus (gr.) = 'mejillón' · galloprovincialis = 'de la Galia provincial (sur de Francia)'","notes":"Las valvas simétricas (dos iguales) son diagnósticas de Bivalvia. Diferencia de braquiópodos (valvas asimétricas). El biso es una adaptación ecológica muy evaluable.","hab":"Zona intermareal rocosa; cultivo en bateas","catf":"invertebrados","subf":"molusco","base":"Mytilusgalloprovincialis"},{"id":"MOL-003","cat":"Invertebrados","sub":"Molusco","name":"Vieira / Concha de peregrino","sci":"Pecten maximus","fam":"Pectinidae","freq":"alta","key":"Concha semicircular con costillas radiales bien marcadas y orejas simétricas en el umbo","mnem":"La 'concha de Santiago': la concha más reconocible del Camino de Santiago — semicircular con costillas radiales perfectas. El único bivalvo que nada","etym":"Pecten (lat.) = 'peine': por las costillas radiales · maximus = 'el mayor'","notes":"CONFIRMADO: Pectinidae (Bivalvia) en etiquetas de exámenes reales. Las costillas radiales + orejas del umbo son diagnósticos. El símbolo del Camino de Santiago.","hab":"Fondos arenosos y de grava; sublitoral (5-200 m)","catf":"invertebrados","subf":"molusco","base":"Pectenmaximus"},{"id":"MOL-004","cat":"Invertebrados","sub":"Molusco","name":"Pulpo común","sci":"Octopus vulgaris","fam":"Octopodidae","freq":"alta","key":"8 brazos con ventosas en doble fila; sin aletas ni concha externa","mnem":"El 'maestro del disfraz de 8 brazos': 8 brazos + cambia de color en un segundo + escupe tinta. El cerebro de los invertebrados","etym":"Octopus (gr.) = octo (ocho) + pous (pie): 'ocho pies' · vulgaris = 'común'","notes":"El cefalópodo más importante del visu. Los 8 brazos con ventosas son diagnósticos. Diferenciar de calamar (Loligo: 10 brazos + aletas + concha interna).","hab":"Fondos rocosos litorales; esconde en oquedades","catf":"invertebrados","subf":"molusco","base":"Octopusvulgaris"},{"id":"MOL-005","cat":"Invertebrados","sub":"Molusco","name":"Sepia / Jibia","sci":"Sepia officinalis","fam":"Sepiidae","freq":"alta","key":"10 brazos (8 cortos + 2 largos retráctiles con ventosas en pala)","mnem":"La 'jibia del hueso blanco oval': la concha blanca oval que venden en las pajarerías (para los pájaros) — solo la jibia la tiene así","etym":"Sepia (gr.) = nombre griego del animal · officinalis = 'medicinal, de botica'","notes":"La concha interna oval (jibión) es absolutamente diagnóstica. Diferencia de pulpo (sin concha) y calamar (gladius córneo). 10 brazos = diagnóstico de Decabrachia.","hab":"Fondos arenosos y de algas; litoral y sublitoral","catf":"invertebrados","subf":"molusco","base":"Sepiaofficinalis"},{"id":"MOL-006","cat":"Invertebrados","sub":"Molusco","name":"Babosa leopardo","sci":"Limax maximus","fam":"Limacidae","freq":"media","key":"Gasterópodo sin concha externa (concha reducida interna bajo el manto)","mnem":"La 'babosa jirafa gigante': enorme, con manchas oscuras como un leopardo y sin concha — la babosa del horror de los horticultores","etym":"Limax (lat.) = 'babosa' · maximus = 'la mayor'","notes":"Sin concha externa es el carácter diagnóstico de babosa. El patrón de manchas leopardo + tamaño enorme son diagnósticos de L. maximus. Plaga agrícola.","hab":"Bosques húmedos, jardines, sótanos; nocturna","catf":"invertebrados","subf":"molusco","base":"Limaxmaximus"},{"id":"MOL-007","cat":"Invertebrados","sub":"Molusco","name":"Navaja","sci":"Ensis ensis","fam":"Pharidae","freq":"media","key":"Concha muy alargada y estrecha, curvada en forma de sable o navaja de afeitar","mnem":"La 'concha cuchillo': tan larga y estrecha que parece una navaja de afeitar — el único bivalvo con esa forma","etym":"Ensis (lat.) = 'espada, sable': por la forma de la concha","notes":"La forma de navaja (alargada y estrecha) es absolutamente diagnóstica. El pie musculoso para enterrarse verticalmente es una adaptación muy evaluable.","hab":"Fondos arenosos intermareales e infralitorales","catf":"invertebrados","subf":"molusco","base":"Ensisensis"},{"id":"OTR-001","cat":"Invertebrados","sub":"Insecto","name":"Avispa común","sci":"Vespula germanica","fam":"Vespidae","freq":"muy_alta","key":"Abdomen amarillo con bandas negras; 3 puntos negros en el clípeo (escudo facial) — diagnóstico","mnem":"La 'avispa de los 3 puntos': busca los 3 puntos negros en la cara amarilla — si ves 3 puntos negros en el clípeo, es Vespula germanica","etym":"Vespula (lat.) = 'avispita' (diminutivo de Vespa) · germanica = 'germánica'","notes":"CONFIRMADO: Vespidae en etiquetas de exámenes reales. Los 3 puntos negros en el clípeo son diagnósticos de la especie. Saber diferenciar de Apis mellifera (abeja) por el abdomen más estilizado y sin pelillo.","hab":"Ubicua; nidos en suelo, huecos de árboles, tejados","catf":"invertebrados","subf":"insecto","base":"Vespulagermanica"},{"id":"OTR-002","cat":"Invertebrados","sub":"Insecto","name":"Abeja melífera","sci":"Apis mellifera","fam":"Apidae","freq":"alta","key":"Cuerpo piloso dorado-pardo con bandas abdominales oscuras; talle menos marcado que la avispa","mnem":"La 'peluda con cestillo': más gorda y peluda que la avispa + si tiene una bolita amarilla en las patas traseras, lleva el cestillo de polen","etym":"Apis (lat.) = 'abeja' · mellifera (lat.) = 'portadora de miel'","notes":"Importantísima ecológica y económicamente. Diferenciar de avispa: abeja = peluda, cestillo de polen, abdomen más corto; avispa = lisa, brillante, talle muy marcado.","hab":"Ubicua; colmenas en huecos de árboles y colmenas artificiales","catf":"invertebrados","subf":"insecto","base":"Apismellifera"},{"id":"OTR-003","cat":"Invertebrados","sub":"Insecto","name":"Libélula / Cordulegáster","sci":"Cordulegaster boltonii","fam":"Cordulegastridae","freq":"alta","key":"Cuerpo negro con anillos amarillos; uno de los odónatos más grandes de Europa (7-8 cm)","mnem":"La 'libélula cebra de montaña': negro con anillos amarillos, enorme, patrullando riachuelos de montaña — la libélula bicolor más grande","etym":"Cordulegaster (lat.) = cordule (cuerda, hilo) + gaster (vientre): 'vientre en cuerda' · boltonii = del naturalista J. Bolton","notes":"CONFIRMADO: Cordulegastridae en etiquetas de exámenes reales. Los anillos amarillos + tamaño grande + hábitat de riachuelo de montaña son diagnósticos. Presente en Guadarrama.","hab":"Riachuelos de montaña, ríos oligotróficos limpios; 400-1800 m","catf":"invertebrados","subf":"insecto","base":"Cordulegasterboltonii"},{"id":"OTR-004","cat":"Invertebrados","sub":"Insecto","name":"Mantis religiosa","sci":"Mantis religiosa","fam":"Mantidae","freq":"alta","key":"Patas anteriores raptoras (prensiles): con espinas para capturar presas","mnem":"El 'insecto que reza': patas levantadas en posición de oración + cabeza giratoria de 180° — el único insecto que 'mira por encima del hombro'","etym":"Mantis (gr.) = 'adivino, profeta': por su postura de 'rezo' · religiosa = 'religiosa'","notes":"Las patas raptoras + postura orante son absolutamente diagnósticas. Dimorfismo sexual: la hembra a veces devora al macho durante la cópula (canibalismo sexual).","hab":"Matorral, praderas, zonas soleadas con vegetación; mediterráneo","catf":"invertebrados","subf":"insecto","base":"Mantisreligiosa"},{"id":"OTR-005","cat":"Invertebrados","sub":"Insecto","name":"Cigarra-saltamontes / Ortóptero","sci":"Locusta migratoria","fam":"Acrididae","freq":"media","key":"Patas posteriores muy desarrolladas para el salto; fémur posterior con quillas longitudinales","mnem":"La 'langosta de dos caras': verde e invisible cuando sola, amarilla y gregaria cuando forma nubes de millones — dos fases del mismo insecto","etym":"Locusta (lat.) = 'langosta' · migratoria = 'migradora'","notes":"Importante por el fenómeno de gregarismo (cambio de fase solitaria a gregaria). Las patas posteriores saltadoras son diagnósticas del orden Orthoptera.","hab":"Pastizales, campos de cultivo, zonas áridas","catf":"invertebrados","subf":"insecto","base":"Locustamigratoria"},{"id":"POR-001","cat":"Invertebrados","sub":"Porífero","name":"Esponja de baño","sci":"Spongia officinalis","fam":"Spongiidae","freq":"media","key":"Sin simetría; sin órganos ni tejidos verdaderos (nivel celular de organización)","mnem":"La 'esponja de baño viva': la esponja que usamos en el baño es el esqueleto seco de este animal — sin cabeza, sin movimiento, sin tejidos","etym":"Spongia (gr.) = 'esponja' · officinalis = 'medicinal, de botica'","notes":"Porifera = el filo animal más primitivo. Sin tejidos verdaderos (nivel celular). El sistema aquífero (ostiolos → coanocitos → ósculo) es el tema más evaluable.","hab":"Fondos rocosos mediterráneos; sublitoral; aguas cálidas","catf":"invertebrados","subf":"porífero","base":"Spongiaofficinalis"},{"id":"ANF-001","cat":"Vertebrados","sub":"Anfibio","name":"Salamandra común","sci":"Salamandra salamandra","fam":"Salamandridae","freq":"muy_alta","key":"Negro brillante con manchas amarillas vivas irregulares — absolutamente inconfundible","mnem":"El 'lagarto de los superhéroes negro y amarillo': el patrón negro-amarillo grita '¡soy venenosa!' — el único anfibio europeo con ese diseño","etym":"Salamandra (gr./lat.) = nombre antiguo del animal","notes":"Probablemente el anfibio más frecuente en colecciones de IES madrileñas. El patrón negro-amarillo es absolutamente diagnóstico. Las glándulas parotoideas con samandarina son evaluables.","hab":"Bosques húmedos de montaña con arroyos; nocturna y crepuscular","catf":"vertebrados","subf":"anfibio","base":"Salamandrasalamandra"},{"id":"ANF-002","cat":"Vertebrados","sub":"Anfibio","name":"Tritón jaspeado","sci":"Triturus marmoratus","fam":"Salamandridae","freq":"alta","key":"Verde brillante marmolado con manchas negras y franja vertebral naranja-roja","mnem":"El 'tritón mármol verde': el verde marmolado con franja naranja dorsal es único entre los tritones europeos — el más vistoso","etym":"Triturus (lat.) = 'tritón' (de Tritón, dios marino) · marmoratus = 'marmolado'","notes":"Endemismo ibérico muy característico. El marmolado verde + franja naranja son absolutamente diagnósticos. La cresta del macho en celo es muy evaluable (dimorfismo sexual estacional).","hab":"Bosques húmedos y zonas de agua tranquila; altitud media","catf":"vertebrados","subf":"anfibio","base":"Triturusmarmoratus"},{"id":"ANF-003","cat":"Vertebrados","sub":"Anfibio","name":"Sapo común","sci":"Bufo spinosus","fam":"Bufonidae","freq":"alta","key":"Cuerpo rechoncho y verrugoso; piel seca y parda-grisácea","mnem":"El 'sapo con hombreras': las parotoides son tan grandes que parecen hombreras. Verrugoso y torpe — todo lo opuesto a la rana","etym":"Bufo (lat.) = 'sapo' · spinosus = 'espinoso': por las verrugas","notes":"Las glándulas parotoideas prominentes son diagnósticas de Bufonidae. Diferenciar de rana: sapo = piel seca verrugosa, sin membrana interdigital, anda; rana = piel lisa húmeda, membrana interdigital, salta.","hab":"Muy adaptable; jardines, bosques, campos; cerca de agua para reproducirse","catf":"vertebrados","subf":"anfibio","base":"Bufospinosus"},{"id":"ANF-004","cat":"Vertebrados","sub":"Anfibio","name":"Rana verde común","sci":"Pelophylax perezi","fam":"Ranidae","freq":"alta","key":"Verde brillante con manchas oscuras y línea vertebral amarilla-verde","mnem":"La 'rana verde del estanque': verde brillante + salta y se tira al agua al primer susto — la rana verde de España","etym":"Pelophylax (gr.) = pelos (barro) + phylax (guardián) · perezi = del herpetólogo J. Pérez","notes":"La rana más común de España. La piel lisa húmeda + verde + membranas interdigitales son diagnósticas. Endemismo ibérico. Par de estudio con el sapo.","hab":"Orillas de ríos, estanques, humedales; semi-acuática","catf":"vertebrados","subf":"anfibio","base":"Pelophylaxperezi"},{"id":"ANF-005","cat":"Vertebrados","sub":"Anfibio","name":"Sapo partero común","sci":"Alytes obstetricans","fam":"Alytidae","freq":"media","key":"Pequeño (3-5 cm); gris-pardo con pequeñas verrugas oscuras","mnem":"El 'sapo papá con pañales': el macho lleva los huevos en las patas traseras como un paquete — el único padre anfibio con ese comportamiento","etym":"Alytes (gr.) = 'el que transporta' · obstetricans (lat.) = 'comadrona': por el macho que cuida los huevos","notes":"El comportamiento del macho portador de huevos es absolutamente único y muy evaluable. La pupila vertical distingue a Alytes de todos los demás anuros ibéricos.","hab":"Zonas rocosas y matorral seco; puede vivir lejos del agua permanente","catf":"vertebrados","subf":"anfibio","base":"Alytesobstetricans"},{"id":"ANF-006","cat":"Vertebrados","sub":"Anfibio","name":"Gallipato","sci":"Pleurodeles waltl","fam":"Salamandridae","freq":"media","key":"El mayor anfibio de Europa occidental (hasta 30 cm)","mnem":"El 'tritón que usa sus propios huesos como armas': las manchas naranjas marcan donde las costillas salen por la piel — el único vertebrado con ese mecanismo","etym":"Pleurodeles (gr.) = pleura (costado) + delos (visible): 'con los costados visibles' · waltl = del zoólogo Waltl","notes":"El mecanismo defensivo de las costillas perforantes es absolutamente único en vertebrados. El mayor anfibio ibérico. Endemismo ibérico-marroquí.","hab":"Charcas, zanjas y aguas estancadas; muy tolerante a la contaminación","catf":"vertebrados","subf":"anfibio","base":"Pleurodeleswaltl"},{"id":"ANF-007","cat":"Vertebrados","sub":"Anfibio","name":"Ranita de San Antonio","sci":"Hyla arborea","fam":"Hylidae","freq":"media","key":"Verde brillante uniforme en el dorso; banda lateral oscura desde el ojo hasta las patas","mnem":"La 'ranita verde trepadora': pequeña, verde brillante y con ventositas en los dedos para pegarse a las hojas","etym":"Hyla (gr.) = 'bosque, madera' · arborea = 'arborícola'","notes":"Los discos adhesivos en los dedos son diagnósticos de Hylidae. La banda lateral oscura + verde uniforme son diagnósticos de especie.","hab":"Zonas húmedas con vegetación arbustiva","catf":"vertebrados","subf":"anfibio","base":"Hylaarborea"},{"id":"AVE-001","cat":"Vertebrados","sub":"Ave","name":"Águila imperial ibérica","sci":"Aquila adalberti","fam":"Accipitridae","freq":"muy_alta","key":"Manchas blancas únicas en hombros (escapulares blancos)","mnem":"Las únicas 'charreteras blancas' del cielo ibérico","etym":"Aquila (lat.) = 'águila' · adalberti = en honor al príncipe Adalberto de Baviera (1828-1875)","notes":"La más amenazada de las águilas europeas. Las manchas blancas en las escapulares son diagnósticas absolutas. Se reproduce en Madrid (Guadarrama)","hab":"Bosques mediterráneos de encina y alcornoque; dehesas con árboles viejos","catf":"vertebrados","subf":"ave","base":"Aquilaadalberti"},{"id":"AVE-002","cat":"Vertebrados","sub":"Ave","name":"Quebrantahuesos","sci":"Gypaetus barbatus","fam":"Accipitridae","freq":"alta","key":"Cola cuneiforme (en cuña) — única entre buitres europeos","mnem":"El único buitre con cola en rombo que se pinta de naranja voluntariamente","etym":"Gypaetus (gr.) = gyps ('buitre') + aetos ('águila') · barbatus (lat.) = 'barbudo': por el mechón de plumas bajo el pico","notes":"Especialista en huesos (osteofagia): los deja caer desde altura para romperlos. El único ave que se 'pinta' voluntariamente con óxido de hierro para tener el color naranja","hab":"Macizos montañosos con acantilados; Pirineos, Picos de Europa, Sierra Nevada","catf":"vertebrados","subf":"ave","base":"Gypaetusbarbatus"},{"id":"AVE-003","cat":"Vertebrados","sub":"Ave","name":"Buitre leonado","sci":"Gyps fulvus","fam":"Accipitridae","freq":"alta","key":"Cuello desnudo largo con collar de plumón blanco","mnem":"El buitre del 'collar de Zorro'","etym":"Gyps (gr.) = 'buitre' · fulvus (lat.) = 'leonado, ocre-amarillento': por el plumaje","notes":"El buitre más abundante de Europa. La colonia de la sierra de Guadarrama (Patones) es una de las mayores de Madrid. Las colonias de cría son en cortados rocosos","hab":"Sierras con cortados rocosos; dehesas y pastizales para alimentarse","catf":"vertebrados","subf":"ave","base":"Gypsfulvus"},{"id":"AVE-004","cat":"Vertebrados","sub":"Ave","name":"Buitre negro","sci":"Aegypius monachus","fam":"Accipitridae","freq":"alta","key":"El mayor rapaz de Europa; pardo-oscuro uniforme","mnem":"El 'monje negro' — más oscuro y masivo que el leonado","etym":"Aegypius (gr.) = 'buitre egipcio' · monachus (lat.) = 'monje': por el aspecto oscuro y recogido","notes":"El mayor rapaz europeo. Nidifica en árboles (diferencia de buitre leonado que lo hace en cortados). Colonias en el Sistema Central son las más importantes de Europa","hab":"Bosques mediterráneos con árboles viejos (encinas, pinos) para anidar; dehesas","catf":"vertebrados","subf":"ave","base":"Aegypiusmonachus"},{"id":"AVE-005","cat":"Vertebrados","sub":"Ave","name":"Milano real","sci":"Milvus milvus","fam":"Accipitridae","freq":"alta","key":"Cola ahorquillada muy pronunciada — rasgo definitorio en vuelo","mnem":"La 'cola de golondrina' entre los grandes rapaces","etym":"Milvus (lat.) = 'milano' · milvus = misma raíz: el nombre latino duplicado enfatiza la especie tipo","notes":"España tiene el 90% de la población mundial invernal. La cola ahorquillada en vuelo es diagnóstica a distancia. Muy frecuente en Madrid en invierno","hab":"Áreas agropecuarias, dehesas, bosques mixtos; evita grandes bosques cerrados","catf":"vertebrados","subf":"ave","base":"Milvusmilvus"},{"id":"AVE-006","cat":"Vertebrados","sub":"Ave","name":"Águila real","sci":"Aquila chrysaetos","fam":"Accipitridae","freq":"alta","key":"Nuca y cuello posterior dorado-amarillento (adulto)","mnem":"La 'corona dorada' en la nuca","etym":"Aquila (lat.) = 'águila' · chrysaetos (gr.) = 'águila de oro'","notes":"La nuca dorada es diagnóstica en adultos. Juveniles con cola blanca con banda terminal oscura. Frecuente en sierras de Madrid","hab":"Macizos montañosos con acantilados y zonas abiertas de caza","catf":"vertebrados","subf":"ave","base":"Aquilachrysaetos"},{"id":"AVE-007","cat":"Vertebrados","sub":"Ave","name":"Halcón peregrino","sci":"Falco peregrinus","fam":"Falconidae","freq":"alta","key":"Bigote negro muy marcado sobre mejillas blancas","mnem":"El 'bigote' sobre cara blanca — el animal más rápido del planeta","etym":"Falco (lat.) = de falx ('hoz'): alas en forma de hoz en vuelo · peregrinus = 'viajero, forastero'","notes":"El animal más rápido del planeta (390 km/h en picado). Nidifica en Madrid en edificios y cortados. El bigote negro es diagnóstico","hab":"Cortados rocosos, edificios altos en ciudad, acantilados costeros","catf":"vertebrados","subf":"ave","base":"Falcoperegrinus"},{"id":"AVE-008","cat":"Vertebrados","sub":"Ave","name":"Cernícalo vulgar","sci":"Falco tinnunculus","fam":"Falconidae","freq":"alta","key":"Cernido estático en el aire (hovering) — único entre rapaces medianas","mnem":"El 'helicóptero' de las rapaces","etym":"Falco (lat.) = 'halcón' · tinnunculus (lat.) = 'que tintinea': por el canto","notes":"El rapaz más común en España. El hovering (cernido estático) es diagnóstico absoluto. Muy frecuente en Madrid ciudad y sierra","hab":"Hábitats abiertos: campos, ciudades, bordes de carretera, cortados","catf":"vertebrados","subf":"ave","base":"Falcotinnunculus"},{"id":"AVE-009","cat":"Vertebrados","sub":"Ave","name":"Búho real","sci":"Bubo bubo","fam":"Strigidae","freq":"alta","key":"Grandes penachos ('orejas') erectos; ojos naranja intenso","mnem":"Las 'orejas de diablo' y los ojos naranja como brasas","etym":"Bubo (lat.) = 'búho real' (onomatopéyico del canto) · bubo = misma raíz duplicada","notes":"El mayor búho europeo. Los penachos y ojos naranja son diagnósticos. Nidifica en cortados de la sierra de Madrid","hab":"Cortados rocosos, bosques mediterráneos, zonas semiáridas con roquedos","catf":"vertebrados","subf":"ave","base":"Bubobubo"},{"id":"AVE-010","cat":"Vertebrados","sub":"Ave","name":"Lechuza común","sci":"Tyto alba","fam":"Tytonidae","freq":"alta","key":"Disco facial en forma de corazón blanco puro","mnem":"La 'cara de corazón blanco'","etym":"Tyto (gr.) = 'lechuza' (onomatopéyico) · alba (lat.) = 'blanca'","notes":"El disco facial en corazón es diagnóstico absoluto. El canto es un chirrido espeluznante. La lechuza de los campanarios y edificios viejos","hab":"Zonas agrícolas, pueblos, campanarios, ruinas; evita bosques densos","catf":"vertebrados","subf":"ave","base":"Tytoalba"},{"id":"AVE-011","cat":"Vertebrados","sub":"Ave","name":"Cigüeña blanca","sci":"Ciconia ciconia","fam":"Ciconiidae","freq":"muy_alta","key":"Blanca con rémiges negras; pico y patas rojos; cuello recto en vuelo","mnem":"Blanca y negra con accesorios rojos — cuello recto en vuelo","etym":"Ciconia (lat.) = 'cigüeña' (onomatopéyico del crotoreo del pico) · ciconia = repetición","notes":"Nidifica en Madrid (campanarios, postes) desde hace siglos. El cuello recto en vuelo la distingue de la garza. Migra a África subsahariana","hab":"Campos agrícolas, prados, humedales para alimentarse; campanarios y postes para nidificar","catf":"vertebrados","subf":"ave","base":"Ciconiaciconia"},{"id":"AVE-012","cat":"Vertebrados","sub":"Ave","name":"Garza real","sci":"Ardea cinerea","fam":"Ardeidae","freq":"alta","key":"Gris con franja negra; cuello plegado en S en vuelo","mnem":"La 'estatua gris' de los ríos — vuela con el cuello plegado","etym":"Ardea (lat.) = 'garza' · cinerea (lat.) = 'gris ceniza': por el plumaje","notes":"El cuello plegado en S en vuelo la distingue de la cigüeña. Colonias en ríos de Madrid (Jarama, Manzanares). La 'estatua gris' de los ríos","hab":"Orillas de ríos, embalses, humedales; también campos agrícolas inundados","catf":"vertebrados","subf":"ave","base":"Ardeacinerea"},{"id":"AVE-013","cat":"Vertebrados","sub":"Ave","name":"Flamenco común","sci":"Phoenicopterus roseus","fam":"Phoenicopteridae","freq":"alta","key":"Pico doblado hacia abajo con la punta negra; cuello y patas larguísimas","mnem":"El único pájaro con el pico 'roto' hacia abajo","etym":"Phoenicopterus (gr.) = 'ala de color púrpura' · roseus (lat.) = 'rosado'","notes":"El pico doblado hacia abajo (filtrador) es único en aves europeas. Presente en lagunas de Madrid (El Soto) como invernante y de paso","hab":"Lagunas salinas, marismas, estuarios; aguas someras con algas y crustáceos","catf":"vertebrados","subf":"ave","base":"Phoenicopterusroseus"},{"id":"AVE-014","cat":"Vertebrados","sub":"Ave","name":"Espátula común","sci":"Platalea leucorodia","fam":"Threskiornithidae","freq":"alta","key":"Pico largo aplanado en forma de espátula; blanca","mnem":"El pico 'de paleta de pintor' — lo mueve de lado","etym":"Platalea (lat.) = 'espátula' (de platus = 'plano') · leucorodia (gr.) = 'garza blanca'","notes":"El pico en espátula que mueve de lado en el agua es diagnóstico absoluto. Nidifica en marismas; invernante en Madrid","hab":"Marismas, lagunas litorales, ríos lentos con vegetación palustre","catf":"vertebrados","subf":"ave","base":"Platalealeucorodia"},{"id":"AVE-015","cat":"Vertebrados","sub":"Ave","name":"Malvasía cabeciblanca","sci":"Oxyura leucocephala","fam":"Anatidae","freq":"muy_alta","key":"♂ Cabeza blanca con pico azul muy hinchado; EN peligro","mnem":"El pato de la 'cabeza de billar'","etym":"Oxyura (gr.) = 'cola puntiaguda': las rectrices centrales son largas y puntiagudas en el macho · leucocephala (gr.) = 'cabeza blanca'","notes":"Una de las aves más amenazadas de Europa. La reintroducción del cangrejo americano (que come patos) fue catastrófica para esta especie. Tablas de Daimiel y lagunas manchegas","hab":"Lagunas con vegetación palustre densa; agua dulce o salobre","catf":"vertebrados","subf":"ave","base":"Oxyuraleucocephala"},{"id":"AVE-016","cat":"Vertebrados","sub":"Ave","name":"Ánade real","sci":"Anas platyrhynchos","fam":"Anatidae","freq":"muy_alta","key":"♂ Cabeza verde botella brillante; ♀ parda moteada; espejo alar azul-violeta","mnem":"El pato del parque — ♂ 'cabeza verde brillante'","etym":"Anas (lat.) = 'pato' · platyrhynchos (gr.) = 'pico ancho' (platys = ancho + rhynchos = pico)","notes":"El pato más abundante de Europa. El ♂ tiene la voz ronca; la ♀ el 'cuac' típico. El espejo alar azul-violeta es diagnóstico en ambos sexos","hab":"Todo tipo de humedales: ríos, embalses, parques urbanos, lagunas","catf":"vertebrados","subf":"ave","base":"Anasplatyrhynchos"},{"id":"AVE-017","cat":"Vertebrados","sub":"Ave","name":"Avutarda común","sci":"Otis tarda","fam":"Otididae","freq":"alta","key":"♂ hasta 18 kg (mayor volador del mundo); ♀ mucho más pequeña","mnem":"El 'bizonte de los cereales'","etym":"Otis (gr.) = 'avutarda' · tarda (lat.) = 'lenta, pesada': por su movimiento pausado en tierra","notes":"El mayor volador del mundo (macho hasta 18 kg). España tiene el 60% de la población mundial. Las pseudoplumas blancas del macho en celo son espectaculares. Campos de cereal de Madrid","hab":"Estepas cerealistas, barbechos, pastizales naturales; llanuras abiertas","catf":"vertebrados","subf":"ave","base":"Otistarda"},{"id":"AVE-018","cat":"Vertebrados","sub":"Ave","name":"Mirlo común","sci":"Turdus merula","fam":"Turdidae","freq":"muy_alta","key":"♂ negro uniforme con pico y anillo periocular amarillo-naranja brillante","mnem":"El único pájaro europeo completamente negro con pico naranja","etym":"Turdus (lat.) = 'tordo, mirlo' · merula (lat.) = nombre romano del mirlo (del celta 'merlo')","notes":"El único pájaro europeo completamente negro con pico naranja (el ♂). La ♀ es parda con pecho moteado. El canto es el más complejo y musical de la avifauna ibérica","hab":"Bosques, jardines, parques urbanos, setos; muy adaptado al medio urbano","catf":"vertebrados","subf":"ave","base":"Turdusmerula"},{"id":"AVE-019","cat":"Vertebrados","sub":"Ave","name":"Petirrojo","sci":"Erithacus rubecula","fam":"Muscicapidae","freq":"muy_alta","key":"Pecho y cara naranja-rojizo vivo — rasgo único y definitorio","mnem":"El 'jersey naranja' — imposible confundirlo","etym":"Erithacus (gr.) = 'petirrojo' (nombre griego directo) · rubecula (lat.) = 'rojiza': por el pecho","notes":"El pájaro favorito de los británicos. Territorial y audaz. El pecho naranja-rojo lo hace inconfundible. Canta en invierno (único pájaro que canta en diciembre en Madrid)","hab":"Bosques, jardines, parques; muy común en el sotobosque","catf":"vertebrados","subf":"ave","base":"Erithacusrubecula"},{"id":"AVE-020","cat":"Vertebrados","sub":"Ave","name":"Abubilla","sci":"Upupa epops","fam":"Upupidae","freq":"muy_alta","key":"Penacho en abanico negro y canela espectacular; pico largo y curvado","mnem":"La 'corona de jefe indio' — absolutamente inconfundible","etym":"Upupa (lat.) = onomatopeya del canto ('u-pu-pu') · epops (gr.) = 'abubilla' (también onomatopéyico)","notes":"El penacho en abanico y el vuelo de mariposa son inconfundibles. Canta 'pu-pu-pu'. Migra a África subsahariana. Muy frecuente en Madrid en primavera","hab":"Zonas arboladas abiertas, jardines, olivares, dehesas; busca el suelo para alimentarse","catf":"vertebrados","subf":"ave","base":"Upupaepops"},{"id":"AVE-021","cat":"Vertebrados","sub":"Ave","name":"Abejaruco europeo","sci":"Merops apiaster","fam":"Meropidae","freq":"alta","key":"El ave más colorida de Europa: amarillo, azul, castaño, verde y rojo","mnem":"La paleta de un pintor hecha pájaro","etym":"Merops (gr.) = 'abejaruco' · apiaster (lat.) = 'que come abejas' (apis = abeja + -aster)","notes":"El ave más colorida de Europa. Come abejas y avispas (inmune al veneno tras frotar el aguijón). Nidifica en colonias en taludes de tierra. Llegada en mayo = señal de verano","hab":"Zonas abiertas con taludes de tierra para nidificar; cerca de agua con insectos","catf":"vertebrados","subf":"ave","base":"Meropsapiaster"},{"id":"AVE-022","cat":"Vertebrados","sub":"Ave","name":"Martín pescador","sci":"Alcedo atthis","fam":"Alcedinidae","freq":"alta","key":"Azul eléctrico iridiscente por encima; naranja por debajo; muy pequeño","mnem":"La 'flecha azul' de los ríos","etym":"Alcedo (lat.) = 'martín pescador' (del gr. alkyon, el mito del halcyon) · atthis = nombre de una sacerdotisa griega","notes":"El destello de azul eléctrico rasando el agua es inconfundible. Muy sensible a la calidad del agua — su presencia indica río limpio. Frecuente en ríos de la sierra de Madrid","hab":"Orillas de ríos y arroyos limpios con agua transparente; embalses","catf":"vertebrados","subf":"ave","base":"Alcedoatthis"},{"id":"AVE-023","cat":"Vertebrados","sub":"Ave","name":"Perdiz roja","sci":"Alectoris rufa","fam":"Phasianidae","freq":"alta","key":"Pico y patas de color rojo coral brillante; collar negro","mnem":"La perdiz del 'collar de perlas' con pico y patas rojo coral","etym":"Alectoris (gr.) = 'perdiz' · rufa (lat.) = 'roja, rubia': por el pico y las patas rojo coral","notes":"La especie cinegética más cazada de España. El collar negro y las rayas laterales anaranjadas son diagnósticos. Frecuente en zonas agrícolas de Madrid","hab":"Zonas agrícolas, matorral abierto, monte bajo; evita bosques densos","catf":"vertebrados","subf":"ave","base":"Alectorisrufa"},{"id":"AVE-024","cat":"Vertebrados","sub":"Ave","name":"Urraca","sci":"Pica pica","fam":"Corvidae","freq":"muy_alta","key":"Blanca y negra con larga cola iridiscente verde-azulada","mnem":"El 'esmoquin con cola de frac'","etym":"Pica (lat.) = 'urraca' (onomatopéyico del canto) · pica = misma raíz repetida","notes":"Una de las pocas aves que superan el test del espejo (reconocimiento propio). Muy inteligente. Cola iridiscente verde-azulada. Muy frecuente en Madrid ciudad","hab":"Zonas agrícolas, jardines, parques urbanos, bordes de bosque","catf":"vertebrados","subf":"ave","base":"Picapica"},{"id":"AVE-025","cat":"Vertebrados","sub":"Ave","name":"Cigüeñuela común","sci":"Himantopus himantopus","fam":"Recurvirostridae","freq":"alta","key":"Patas rosado-coral extremadamente largas — las más largas en proporción de Europa","mnem":"La 'modelo' de las aves — patas rosas kilométricas","etym":"Himantopus (gr.) = 'pata de correa' (himanto = correa + pous = pie): por las patas largas y rojas","notes":"Las patas más largas en proporción al cuerpo de todas las aves europeas. Muy vocal y agresivo en la nidificación. Lagunas y arrozales de Madrid","hab":"Lagunas someras, arrozales, charcas, balsas de agua; zonas abiertas con agua","catf":"vertebrados","subf":"ave","base":"Himantopushimantopus"},{"id":"AVE-026","cat":"Vertebrados","sub":"Ave","name":"Avoceta común","sci":"Recurvirostra avosetta","fam":"Recurvirostridae","freq":"alta","key":"Pico largo curvado hacia arriba — único entre aves europeas","mnem":"El pico 'en sonrisa' — curvado hacia arriba","etym":"Recurvirostra (lat.) = recurva (curvado hacia arriba) + rostrum (pico): 'pico curvado hacia arriba' · avosetta = nombre italiano de la especie","notes":"El pico curvado hacia arriba es absolutamente único entre aves europeas. Lo mueve de lado en el agua para filtrar. Recuperada en España tras protección","hab":"Lagunas salinas y someras, marismas, estuarios","catf":"vertebrados","subf":"ave","base":"Recurvirostraavosetta"},{"id":"AVE-027","cat":"Vertebrados","sub":"Ave","name":"Cigüeña negra","sci":"Ciconia nigra","fam":"Ciconiidae","freq":"alta","key":"Negro con brillo metálico; vientre blanco; pico y patas rojos","mnem":"La cigüeña del 'esmoquin': negra con pechera blanca","etym":"Ciconia (lat.) = 'cigüeña' · nigra (lat.) = 'negra'","notes":"Mucho más esquiva que la blanca, no nidifica en edificios sino en árboles viejos o cortados de ríos. Presencia en Madrid en pasos migratorios","hab":"Bosques maduros con ríos limpios; cortados fluviales para nidificar","catf":"vertebrados","subf":"ave","base":"Ciconianigra"},{"id":"AVE-028","cat":"Vertebrados","sub":"Ave","name":"Cárabo común","sci":"Strix aluco","fam":"Strigidae","freq":"alta","key":"Disco facial redondo con borde oscuro; sin penachos; ojos negros muy grandes","mnem":"El '¡buuu!' del bosque — el más común con los grandes ojos negros","etym":"Strix (gr./lat.) = 'búho' · aluco = nombre antiguo del cárabo (posiblemente onomatopéyico del canto)","notes":"El búho más común y familiar de España. El '¡buuu-buuuu!' de las noches es el cárabo. Los ojos negros grandes sin penachos son diagnósticos vs. búho real (ojos naranjas + penachos)","hab":"Bosques maduros de todo tipo, jardines arbolados, parques urbanos","catf":"vertebrados","subf":"ave","base":"Strixaluco"},{"id":"AVE-029","cat":"Vertebrados","sub":"Ave","name":"Mochuelo europeo","sci":"Athene noctua","fam":"Strigidae","freq":"alta","key":"El menor búho ibérico; cabeza aplanada con cejas blancas prominentes","mnem":"El búho de Atenea — pequeño y con cara de 'enfadado permanente'","etym":"Athene (gr.) = diosa Atenea (cuya ave sagrada era la lechuza) · noctua (lat.) = 'nocturna'","notes":"Activo también de día (única especie de búho ibérico diurna). La expresión 'enfadada' y las cejas blancas prominentes son diagnósticas. El búho de los olivares de Madrid","hab":"Zonas agrícolas, olivares, pedrizas, bordes de pueblo; busca huecos para anidar","catf":"vertebrados","subf":"ave","base":"Athenenoctua"},{"id":"AVE-030","cat":"Vertebrados","sub":"Ave","name":"Sisón común","sci":"Tetrax tetrax","fam":"Otididae","freq":"alta","key":"♂ cuello negro con doble collar blanco en V; ♀ críptica","mnem":"El 'collar de corbatín' del macho","etym":"Tetrax (gr.) = nombre antiguo de un ave similar · tetrax = repetición (especie tipo)","notes":"El macho en celo hace un vuelo nupcial espectacular. Especie en declive por la intensificación agrícola. Los campos de cereal de Madrid son clave para su conservación","hab":"Estepas cerealistas, barbechos, pastizales; llanuras abiertas","catf":"vertebrados","subf":"ave","base":"Tetraxtetrax"},{"id":"MAM-001","cat":"Vertebrados","sub":"Mamífero","name":"Lobo ibérico","sci":"Canis lupus signatus","fam":"Canidae","freq":"alta","key":"Cánido grande (25-40 kg); pelaje gris-pardo","mnem":"El 'perro salvaje con medias negras': las manchas oscuras en los carpos + cola siempre recta lo distinguen del perro doméstico","etym":"Canis (lat.) = 'perro' · lupus = 'lobo' · signatus = 'marcado': por las marcas negras","notes":"CONFIRMADO: Canidae en etiquetas de exámenes reales. Las marcas negras en los carpos son la clave diagnóstica de la subespecie ibérica.","hab":"Bosques y zonas de matorral con ungulados; norte peninsular","catf":"vertebrados","subf":"mamífero","base":"Canislupus"},{"id":"MAM-002","cat":"Vertebrados","sub":"Mamífero","name":"Zorro rojo","sci":"Vulpes vulpes","fam":"Canidae","freq":"alta","key":"Pelaje rojizo brillante; vientre y punta de la cola blancos; patas y orejas negras","mnem":"El 'cánido de las tres zonas de color': rojo en el dorso + blanco en el vientre y cola + negro en patas y orejas. Inconfundible","etym":"Vulpes (lat.) = 'zorro' · vulpes = repetición","notes":"Canidae confirmada. El patrón tricolor rojo/blanco/negro + la cola espesa son diagnósticos. El cánido más adaptable y ubicuo de España.","hab":"Ubiquista: bosques, campos, matorral, zonas periurbanas","catf":"vertebrados","subf":"mamífero","base":"Vulpesvulpes"},{"id":"MAM-003","cat":"Vertebrados","sub":"Mamífero","name":"Tejón europeo","sci":"Meles meles","fam":"Mustelidae","freq":"alta","key":"Cabeza blanca con dos anchas bandas negras laterales (nariz → orejas) — absolutamente diagnóstico","mnem":"El 'mapache europeo con rayas en la cabeza': la cabeza blanca con dos rayas negras es tan llamativa que no necesita más descripción","etym":"Meles (lat.) = 'tejón' · meles = repetición","notes":"CONFIRMADO: Mustelidae en etiquetas de exámenes reales. Las rayas negras en la cabeza blanca son absolutamente diagnósticas. El mayor mustelido terrestre de Europa.","hab":"Bosques y matorral con suelos blandos para excavar","catf":"vertebrados","subf":"mamífero","base":"Melesmeles"},{"id":"MAM-004","cat":"Vertebrados","sub":"Mamífero","name":"Nutria euroasiática","sci":"Lutra lutra","fam":"Mustelidae","freq":"alta","key":"Cuerpo alargado y fusiforme; patas cortas con membranas interdigitales","mnem":"La 'comadreja del río': alargada, marrón, con membranas en las patas y cola de timón — el mustelido acuático por excelencia","etym":"Lutra (lat.) = 'nutria' · lutra = repetición","notes":"Mustelidae confirmada. El cuerpo fusiforme + membranas interdigitales + garganta blanquecina son diagnósticos. Bioindicadora de calidad del agua — muy evaluable.","hab":"Ríos, embalses y costas con agua limpia y riberas arboladas","catf":"vertebrados","subf":"mamífero","base":"Lutralutra"},{"id":"MAM-005","cat":"Vertebrados","sub":"Mamífero","name":"Lince ibérico","sci":"Lynx pardinus","fam":"Felidae","freq":"alta","key":"Orejas con mechones de pelos negros en las puntas — diagnóstico de género Lynx","mnem":"El 'gato de orejas con cuernos y cola cortada': los mechones auriculares + la cola corta con punta negra son únicos entre los félidos ibéricos","etym":"Lynx (gr.) = 'lince' · pardinus = 'parecido al leopardo'","notes":"El felino más amenazado del mundo. Los mechones auriculares + cola corta son diagnósticos de Lynx. La recuperación (de ~94 individuos en 2002 a +1000 en 2023) es un caso de éxito evaluable.","hab":"Matorral mediterráneo con alta densidad de conejo; Sierra Morena, Doñana","catf":"vertebrados","subf":"mamífero","base":"Lynxpardinus"},{"id":"MAM-006","cat":"Vertebrados","sub":"Mamífero","name":"Ciervo rojo","sci":"Cervus elaphus","fam":"Cervidae","freq":"alta","key":"Macho: astas ramificadas de hueso que se renuevan anualmente — diagnóstico de clase","mnem":"El 'ciervo de los cuernos de árbol': las astas ramificadas como un árbol que se renuevan cada año — el ungulado más majestuoso","etym":"Cervus (lat.) = 'ciervo' · elaphus (gr.) = 'ciervo'","notes":"Las astas (hueso caducifolio) son el carácter más evaluable. Diferencia astas (Cervidae) vs. cuernos (Bovidae): astas = hueso macizo caducifolio; cuernos = queratina perenne.","hab":"Bosques mixtos, pastizales de montaña; Montes de Toledo, Sistema Central","catf":"vertebrados","subf":"mamífero","base":"Cervuselaphus"},{"id":"MAM-007","cat":"Vertebrados","sub":"Mamífero","name":"Jabalí","sci":"Sus scrofa","fam":"Suidae","freq":"alta","key":"Cuerpo robusto con cabeza grande y hocico alargado (jeta); cuello muy grueso","mnem":"El 'cerdo salvaje armado': el hocico de cerdo + colmillos curvados del macho + rayaditos de los jabatos — el abuelo del cerdo de granja","etym":"Sus (lat.) = 'cerdo' · scrofa = 'cerda': el ancestro silvestre del cerdo","notes":"El artiodáctilo más frecuente en exámenes. Los colmillos del macho y las rayas de los jabatos son diagnósticos. El vínculo con el cerdo doméstico es muy evaluable.","hab":"Bosques, matorral, campos; muy adaptable; en expansión","catf":"vertebrados","subf":"mamífero","base":"Susscrofa"},{"id":"MAM-008","cat":"Vertebrados","sub":"Mamífero","name":"Murciélago ratonero grande","sci":"Myotis myotis","fam":"Vespertilionidae","freq":"media","key":"El mayor murciélago de Europa central (envergadura 35-43 cm)","mnem":"El 'ratón volador con orejas gigantes': el mayor murciélago europeo con orejas desproporcionadas para la ecolocalización","etym":"Myotis (gr.) = mys (ratón) + otis (oreja): 'oreja de ratón' · myotis = repetición","notes":"Chiroptera = el segundo orden de mamíferos más diverso. La membrana alar (patagio) + ecolocalización son los temas más evaluables.","hab":"Bosques y zonas agrícolas; colonias en cuevas y edificios","catf":"vertebrados","subf":"mamífero","base":"Myotismyotis"},{"id":"MAM-009","cat":"Vertebrados","sub":"Mamífero","name":"Erizo europeo","sci":"Erinaceus europaeus","fam":"Erinaceidae","freq":"media","key":"Dorso cubierto de púas (espinas modificadas) de 2-3 cm","mnem":"El 'cactus con patas': la única bola con púas que camina — se enrolla mostrando todas las espinas","etym":"Erinaceus (lat.) = 'erizo' · europaeus = 'europeo'","notes":"El enrollamiento defensivo + espinas son diagnósticos. Resistente al veneno de serpientes (mecanismo no del todo conocido).","hab":"Bordes de bosque, jardines, setos; muy adaptable","catf":"vertebrados","subf":"mamífero","base":"Erinaceuseuropaeus"},{"id":"MAM-010","cat":"Vertebrados","sub":"Mamífero","name":"Conejo europeo","sci":"Oryctolagus cuniculus","fam":"Leporidae","freq":"alta","key":"Orejas largas; cola corta y esponjosa blanca por debajo","mnem":"El 'excavador con orejas del que depende el lince': el conejo del que depende el lince, el águila imperial y otros 40 depredadores españoles. Endémico ibérico","etym":"Oryctolagus (gr.) = oryktes (excavador) + lagos (liebre) · cuniculus = 'conejo, galería'","notes":"Lagomorpha ≠ Rodentia. Los conejos tienen 4 incisivos superiores (2 grandes + 2 pequeños detrás). Especie clave del ecosistema mediterráneo ibérico.","hab":"Matorral, pastizales, olivares, campos; suelos blandos para excavar","catf":"vertebrados","subf":"mamífero","base":"Oryctolaguscuniculus"},{"id":"MAM-011","cat":"Vertebrados","sub":"Mamífero","name":"Garduña","sci":"Martes foina","fam":"Mustelidae","freq":"media","key":"Mancha BLANCA en la garganta y pecho bifurcada hacia las patas delanteras — diagnóstica","mnem":"La 'mustelid con pechera blanca bifurcada': la mancha blanca en Y en la garganta es la diferencia clave vs. marta (amarilla). La garduña lleva corbata blanca; la marta lleva pañuelo amarillo","etym":"Martes (lat.) = 'marta' · foina = 'garduña'","notes":"Mustelidae confirmada. La mancha gular BLANCA bifurcada vs. marta (AMARILLA no bifurcada) es un par de estudio muy evaluable.","hab":"Bosques, matorral, zonas rurales con construcciones","catf":"vertebrados","subf":"mamífero","base":"Martesfoina"},{"id":"MAM-012","cat":"Vertebrados","sub":"Mamífero","name":"Cabra montés ibérica","sci":"Capra pyrenaica","fam":"Bovidae","freq":"media","key":"Cuernos grandes y espirales en el macho (hasta 75 cm); hembra con cuernos más cortos","mnem":"La 'cabra escaladora con cuernos en sacacorchos': los cuernos en espiral del macho y sus pezuñas especiales para el roquedo son únicos en España","etym":"Capra (lat.) = 'cabra' · pyrenaica = 'pirenaica'","notes":"Los cuernos en espiral + hábitat rupícola son diagnósticos. Los cuernos son permanentes y de queratina (Bovidae), a diferencia de las astas de Cervidae.","hab":"Roquedos y zonas de alta montaña; 400-3500 m","catf":"vertebrados","subf":"mamífero","base":"Caprapyrenaica"},{"id":"PEC-001","cat":"Vertebrados","sub":"Pez cartilaginoso","name":"Pintarroja","sci":"Scyliorhinus canicula","fam":"Scyliorhinidae","freq":"muy_alta","key":"Tiburón pequeño (hasta 1 m); cuerpo con manchas pardas sobre fondo beige","mnem":"El 'tiburón con lunares que pone huevos en bolsa': manchas pardas + cápsulas de huevo con flecos — el tiburón del mercado","etym":"Scyliorhinus (gr.) = skylos (perro) + rhinos (nariz): 'nariz de perro' · canicula = 'perrita'","notes":"CONFIRMADO: Scyliorhinidae en etiquetas de exámenes reales. Las cápsulas de huevo ('bolsa de sirena') son muy frecuentes como muestra. El pez cartilaginoso más fácil de conseguir en pescaderías.","hab":"Fondos arenosos y rocosos; 0-400 m","catf":"vertebrados","subf":"pez cartilaginoso","base":"Scyliorhinuscanicula"},{"id":"PEC-002","cat":"Vertebrados","sub":"Pez cartilaginoso","name":"Raya común","sci":"Raja clavata","fam":"Rajidae","freq":"alta","key":"Cuerpo aplanado dorso-ventralmente en forma de rombo — absolutamente diagnóstico","mnem":"El 'tiburón aplastado en rombo': cuerpo en rombo plano con cola de látigo — como si un tiburón hubiera pasado por una prensa hidráulica","etym":"Raja (lat.) = 'raya' · clavata = 'con clavos': por las espinas dorsales","notes":"CONFIRMADO: Rajidae en etiquetas reales. La forma de rombo aplastado es diagnóstica de Batoidea. Diferenciar de peces planos óseos (lenguado): la raya tiene 5 hendiduras branquiales ventrales; el lenguado tiene opérculo lateral.","hab":"Fondos arenosos y de grava; 10-300 m","catf":"vertebrados","subf":"pez cartilaginoso","base":"Rajaclavata"},{"id":"PEC-003","cat":"Vertebrados","sub":"Pez cartilaginoso","name":"Tiburón azul","sci":"Prionace glauca","fam":"Carcharhinidae","freq":"media","key":"Azul intenso en el dorso con vientre blanco níveo; cuerpo muy hidrodinámico","mnem":"El 'tiburón del Índigo': azul intenso con barriga blanca y aleta pectoral larguísima — el más elegante de los océanos","etym":"Prionace (gr.) = prion (sierra) + akis (punta) · glauca = 'azul-grisáceo'","notes":"El azul + aleta pectoral larga son diagnósticos. Migrador de largas distancias. El contrasombreado (azul arriba / blanco abajo) es un camuflaje evaluable.","hab":"Mar abierto (pelágico oceánico); migratorio","catf":"vertebrados","subf":"pez cartilaginoso","base":"Prionaceglauca"},{"id":"PEC-004","cat":"Vertebrados","sub":"Pez cartilaginoso","name":"Tiburón martillo","sci":"Sphyrna zygaena","fam":"Sphyrnidae","freq":"media","key":"Cabeza expandida lateralmente en forma de martillo o T (cefalofólio) — absolutamente único","mnem":"El 'tiburón T': la cabeza en martillo es inconfundible — los ojos están tan separados que ven hacia atrás sin girar la cabeza","etym":"Sphyrna (gr.) = 'martillo': por la forma de la cabeza · zygaena = 'yugo' (la forma en T)","notes":"La forma de la cabeza es absolutamente diagnóstica. Los ojos en los extremos del martillo amplían el campo visual binocular frontal. El cefalofólio también mejora la detección electromagnética de rayas enterradas.","hab":"Aguas costeras y pelágicas; migratorio","catf":"vertebrados","subf":"pez cartilaginoso","base":"Sphyrnazygaena"},{"id":"PEO-001","cat":"Vertebrados","sub":"Pez óseo","name":"Gallineta del norte","sci":"Helicolenus dactylopterus","fam":"Sebastidae","freq":"muy_alta","key":"Color rojo-anaranjado brillante con manchas o bandas más oscuras","mnem":"El 'pez rojo con boca azul': rojo por fuera, azul-negro por dentro de la boca — absolutamente único. La gallineta de los tribunales de Madrid","etym":"Helicolenus (gr.) = heliko (espiral) + lenos (vaso) · dactylopterus = 'con dedos en las aletas'","notes":"CONFIRMADO explícitamente en tribunales 3 y 7 del examen Madrid 2021. La boca interior azul-negro + color rojo exterior son diagnósticos absolutos. Especie muy frecuente en pescaderías madrileñas.","hab":"Fondos rocosos; 50-1000 m","catf":"vertebrados","subf":"pez óseo","base":"Helicolenusdactylopterus"},{"id":"PEO-002","cat":"Vertebrados","sub":"Pez óseo","name":"Trucha común","sci":"Salmo trutta","fam":"Salmonidae","freq":"alta","key":"Manchas rojas con halo azulado en los flancos — diagnóstico de especie","mnem":"El 'pez de las manchas con halo azul': las manchas rojas rodeadas de anillo azulado son únicas. La aleta adiposa 'extra' es el sello de familia Salmonidae","etym":"Salmo (lat.) = 'salmón' · trutta = 'trucha' (del gr. troktes = 'roedor')","notes":"La aleta adiposa (característica definitoria de Salmonidae, sin radios óseos) es el rasgo más evaluado. Las manchas rojas con halo azul son el diagnóstico de especie. Bioindicador de agua fría y limpia.","hab":"Ríos de montaña fríos y bien oxigenados","catf":"vertebrados","subf":"pez óseo","base":"Salmotrutta"},{"id":"PEO-003","cat":"Vertebrados","sub":"Pez óseo","name":"Barbo común","sci":"Luciobarbus bocagei","fam":"Cyprinidae","freq":"alta","key":"4 barbillas (2 en ángulos de la boca + 2 más largas en el labio superior) — diagnósticas","mnem":"El 'pez de los 4 bigotes': las 4 barbillas son absolutamente diagnósticas — el único pez ibérico de río con 4 antenas en la boca","etym":"Luciobarbus = género endémico ibérico · bocagei = del zoólogo portugués Bocage","notes":"Las 4 barbillas son diagnósticas de barbo. Muy frecuente en ríos de Madrid (Jarama, Manzanares). Cyprinidae = la familia de peces dulceacuícolas más diversa de la Península.","hab":"Ríos de corriente media a lenta; aguas mesotrofas","catf":"vertebrados","subf":"pez óseo","base":"Luciobarbusbocagei"},{"id":"PEO-004","cat":"Vertebrados","sub":"Pez óseo","name":"Anguila","sci":"Anguilla anguilla","fam":"Anguillidae","freq":"alta","key":"Cuerpo muy alargado y serpentiforme; aletas dorsal, caudal y anal fusionadas","mnem":"La 'serpiente del río que nace en el Caribe': la única especie que nace en el Mar de los Sargazos, llega a los ríos europeos y vuelve allí a morir","etym":"Anguilla (lat.) = 'anguilita' (diminutivo de anguris = serpiente de agua)","notes":"El ciclo vital catádromo (río → Sargazos → río) es un tema evaluable clásico. La aleta continua (dorsal+caudal+anal) y el cuerpo serpentiforme son diagnósticos. En Peligro Crítico de Extinción.","hab":"Ríos, estuarios y zonas costeras; migratoria","catf":"vertebrados","subf":"pez óseo","base":"Anguillaanguilla"},{"id":"PEO-005","cat":"Vertebrados","sub":"Pez óseo","name":"Lenguado","sci":"Solea solea","fam":"Soleidae","freq":"media","key":"Cuerpo oval muy aplanado lateralmente; ambos ojos en el lado derecho","mnem":"El 'pez-suela de zapato': plano como una suela, con los dos ojos en el mismo lado — el único pez que te mira con dos ojos del mismo lado","etym":"Solea (lat.) = 'sandalia, suela del zapato': por la forma del cuerpo","notes":"La migración del ojo izquierdo hacia el derecho durante la metamorfosis es un proceso del desarrollo muy evaluable. Pleuronectiformes = peces planos con ambos ojos en el mismo lado.","hab":"Fondos arenosos intermareales y sublitorales; 0-200 m","catf":"vertebrados","subf":"pez óseo","base":"Soleasolea"},{"id":"PEO-006","cat":"Vertebrados","sub":"Pez óseo","name":"Lamprea de río","sci":"Petromyzon marinus","fam":"Petromyzontidae","freq":"alta","key":"Sin mandíbulas (Agnatha): boca en ventosa circular con dientes córneos","mnem":"El 'vampiro del río sin mandíbulas': ventosa con dientes en círculo, 7 agujeritos por lado — el vertebrado más primitivo que puedes ver","etym":"Petromyzon (gr.) = petra (piedra) + myzon (que succiona): 'que succiona piedras' · marinus = 'marino'","notes":"Agnatha (sin mandíbulas) = el grupo más primitivo de vertebrados. La boca en ventosa + 7 aberturas branquiales + sin aletas pares son absolutamente diagnósticos. Anádroma.","hab":"Anádroma: adultos en mar; larvas (ammocetes) en ríos durante 4-7 años","catf":"vertebrados","subf":"pez óseo","base":"Petromyzonmarinus"},{"id":"PEO-007","cat":"Vertebrados","sub":"Pez óseo","name":"Caballito de mar","sci":"Hippocampus guttulatus","fam":"Syngnathidae","freq":"media","key":"Postura vertical única entre peces; cola prensil que se enrolla en algas","mnem":"El 'pez vertical que el macho queda embarazado': el único pez que nada de pie y en el que el padre lleva y pare los crías","etym":"Hippocampus (gr.) = hippos (caballo) + kampos (monstruo marino) · guttulatus = 'con gotitas'","notes":"La postura vertical + cola prensil + el macho que incuba son temas muy evaluables. El exoesqueleto de placas óseas lo diferencia de todos los demás peces.","hab":"Praderas de Posidonia, algas; 1-50 m","catf":"vertebrados","subf":"pez óseo","base":"Hippocampusguttulatus"},{"id":"PEO-008","cat":"Vertebrados","sub":"Pez óseo","name":"Pez espada","sci":"Xiphias gladius","fam":"Xiphiidae","freq":"media","key":"Rostro superior muy alargado, aplanado y afilado (la 'espada') — diagnóstico absoluto","mnem":"El 'karateka del océano': el único pez con ese espadón plano en la cabeza — lo usa para aturdir peces, no para ensartarlos","etym":"Xiphias (gr.) = 'espada' · gladius (lat.) = 'espada': 'espada' en dos idiomas","notes":"La espada (rostro alargado y APLANADO) es absolutamente diagnóstica. Diferencia con el marlín: el marlín tiene la espada circular en sección; el pez espada la tiene plana.","hab":"Océano abierto (pelágico); migratorio","catf":"vertebrados","subf":"pez óseo","base":"Xiphiasgladius"},{"id":"REP-001","cat":"Vertebrados","sub":"Reptil","name":"Lagarto ocelado","sci":"Timon lepidus","fam":"Lacertidae","freq":"muy_alta","key":"El mayor lagarto de Europa (hasta 60-90 cm); robusto y de aspecto imponente","mnem":"El 'dragón verde con lunares azules': el mayor lagarto europeo, verde brillante con manchas azules llamativas — imposible confundirlo","etym":"Timon (gr.) = 'el que gobierna' · lepidus (lat.) = 'elegante, adornado'","notes":"CONFIRMADO: Lacertidae en etiquetas de exámenes reales. El mayor lagarto europeo + los ocelos azules son diagnósticos absolutos. Muy frecuente como muestra de Lacertidae.","hab":"Matorral mediterráneo, olivares, bordes de bosque","catf":"vertebrados","subf":"reptil","base":"Timonlepidus"},{"id":"REP-002","cat":"Vertebrados","sub":"Reptil","name":"Lagartija ibérica","sci":"Podarcis hispanicus","fam":"Lacertidae","freq":"alta","key":"Lagartija pequeña y ágil (12-20 cm); cabeza aplastada para grietas","mnem":"La 'lagartija del muro': pequeña, parda y velocísima en las paredes — si ves algo pequeño pardo disparándose por un muro, es Podarcis","etym":"Podarcis (gr.) = pous (pie) + arkys (rapidez): 'pies rápidos' · hispanicus = 'hispánico'","notes":"Lacertidae confirmada. La lagartija más frecuente en Madrid. La cabeza aplastada + agilidad en muros son diagnósticos ecológicos.","hab":"Muros, roquedos, jardines urbanos; heliófila","catf":"vertebrados","subf":"reptil","base":"Podarcishispanicus"},{"id":"REP-003","cat":"Vertebrados","sub":"Reptil","name":"Víbora hocicuda","sci":"Vipera latastei","fam":"Viperidae","freq":"alta","key":"Hocico con apéndice nasal levantado — diagnóstico absoluto de especie","mnem":"La 'víbora con nariz respingona': el apéndice nasal levantado + cabeza triangular + zig-zag dorsal. La única víbora con nariz hacia arriba","etym":"Vipera (lat.) = 'víbora' (de vivipara = que pare vivos) · latastei = del herpetólogo Lataste","notes":"El apéndice nasal es absolutamente diagnóstico de V. latastei. La pupila vertical + cabeza triangular son diagnósticos de familia Viperidae. La única víbora presente en la Comunidad de Madrid.","hab":"Matorral mediterráneo seco, roquedos, bordes de bosque","catf":"vertebrados","subf":"reptil","base":"Viperalatastei"},{"id":"REP-004","cat":"Vertebrados","sub":"Reptil","name":"Culebra de collar","sci":"Natrix natrix","fam":"Colubridae","freq":"alta","key":"Collar amarillo o blanco-crema seguido de negro detrás de la cabeza — diagnóstico absoluto","mnem":"La 'culebra del collar amarillo': el collar bicolor (amarillo + negro) detrás de la cabeza es tan llamativo que parece accesorio — la única con collar","etym":"Natrix (lat.) = 'nadadora' · natrix = mismo nombre (denominación antigua)","notes":"El collar bicolor es absolutamente diagnóstico. Muy frecuente cerca del agua en Madrid. La tanatosis es un comportamiento evaluable.","hab":"Zonas húmedas: orillas de ríos, prados húmedos","catf":"vertebrados","subf":"reptil","base":"Natrixnatrix"},{"id":"REP-005","cat":"Vertebrados","sub":"Reptil","name":"Tortuga mora","sci":"Testudo graeca","fam":"Testudinidae","freq":"alta","key":"Caparazón alto y cupuliforme, pardo-amarillento con manchas oscuras","mnem":"La 'tortuga con espuelas en los muslos': los tubérculos córneos en cada muslo son el diagnóstico definitivo — la única tortuga terrestre nativa de España","etym":"Testudo (lat.) = 'tortuga' · graeca = 'griega': nombre histórico","notes":"Los espolones en los muslos son el diagnóstico de especie. Diferencia de T. hermanni: T. graeca = espolón en muslo; T. hermanni = sin espolón + 2 escamas supracaudales divididas.","hab":"Matorral mediterráneo seco; sur y este peninsular","catf":"vertebrados","subf":"reptil","base":"Testudograeca"},{"id":"REP-006","cat":"Vertebrados","sub":"Reptil","name":"Camaleón común","sci":"Chamaeleo chamaeleon","fam":"Chamaeleonidae","freq":"alta","key":"Cuerpo comprimido lateralmente; ojos independientes con movimiento 360°","mnem":"El 'reptil con ojos de giroscópio': cada ojo gira independientemente — nadie más en el reino animal tiene eso","etym":"Chamaeleo (gr.) = chamai (en tierra) + leon (león): 'pequeño león de tierra'","notes":"Los ojos
