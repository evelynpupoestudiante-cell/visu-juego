riego 'kata' (hacia abajo) + 'klasis' (rotura): 'rotura hacia abajo' — fragmentación de la roca por fallamiento","notes":"La brecha de falla marca el plano de la falla frágil. A diferencia de la milonita (dúctil, profunda), la brecha de falla se forma cerca de la superficie. Diferencia de brecha sedimentaria: los clastos son angulosos y todos de la misma roca. PRUEBAS: (1) Fragmentos ANGULOSOS del encajante cementados. (2) Asociada a planos de falla. (3) Gradación desde brecha (frágil, superficial) a milonita (dúctil, profunda). CONFUSIÓN CON: Milonita — bandeado muy fino, dúctil, sin fragmentos angulosos. Brecha sedimentaria — no asociada a falla, clastos más variados. Conglomerado — clastos redondeados, no angulosos.","hab":"","catf":"geología","subf":"roca","base":"BrechaFalla"},{"id":"ROC-050","cat":"Geología","sub":"Roca","name":"Flysch","sci":"Flysch","fam":"Roca sedimentaria turbidítica","freq":"baja","key":"Alternancia monótona de areniscas y margas/arcillas en capas de pocos centímetros a metros","mnem":"La 'baraja de naipes de roca': alternancia monótona de arenisca (la cara) y marga (el dorso) repetida miles de veces. Si parece un apilado de barajas, es flysch","etym":"Del suizo-alemán 'flysch' (deslizarse fácilmente): por la facilidad con que los flysch del norte de Suiza favorecen los deslizamientos","notes":"El flysch es la secuencia de turbiditas más famosa de Europa — el flysch del Cretácico del País Vasco es uno de los más conocidos del mundo. La alternancia arenisca/marga en capas regulares es diagnóstica. PRUEBAS: (1) Alternancia monótona regular de areniscas y lutitas. (2) Capas de pocos cm a metros. (3) Base de las capas arenosas erosiva sobre las pelíticas. (4) Megasecuencias. CONFUSIÓN CON: Turbidita — el flysch ES una secuencia de turbiditas. Alternancia de calizas-margas — efervescencia al HCl. Ritmita lacustre — escala menor, origen diferente.","hab":"","catf":"geología","subf":"roca","base":"Flysch"},{"id":"ROC-051","cat":"Geología","sub":"Roca","name":"Marga","sci":"Marga","fam":"Sedimentaria detrítico-carbonatada","freq":"alta","key":"Roca intermedia entre caliza y arcilla: 35-65% de carbonato cálcico y el resto arcilla. Aspecto terroso o compacto, color gris, blanquecino, amarillento o azulado. Reacciona al HCl pero deja un residuo arcilloso terroso. Se deshace parcialmente en agua. Tacto ligeramente untuoso. Estratificación fina bien marcada.","mnem":"La caliza sucia: reacciona al HCl pero deja barro. Ni caliza pura ni arcilla pura — la roca de en medio.","etym":"Del latín marga, término de origen celta que designaba una tierra caliza usada como fertilizante en la agricultura antigua.","notes":"Muy abundante en la Comunidad de Madrid: es una de las tres rocas sedimentarias cretácicas de la Sierra de Guadarrama junto con calizas y dolomías, y también aparece en los rellenos terciarios de la Cuenca de Madrid. Su presencia indica ambiente marino somero con aporte terrígeno o ambiente lacustre. Interés económico: materia prima fundamental para la fabricación de cemento (mezcla natural de caliza y arcilla). PRUEBAS: (1) Aplicar HCl: efervescencia moderada, MENOS viva que la caliza pura. (2) Tras la reacción queda un residuo terroso/arcilloso visible (la caliza pura no deja residuo). (3) Frotar con el dedo humedecido: mancha ligeramente y da tacto untuoso. (4) Sumergir un fragmento en agua: se disgrega parcialmente (la caliza no). CONFUSIÓN CON: Caliza — efervescencia MUY viva y sin residuo arcilloso; más dura y compacta. Arcilla/lutita — NO reacciona al HCl; totalmente plástica al mojarse. Dolomía — no reacciona al HCl en frío. Calcarenita — granos de carbonato visibles a simple vista.","hab":"Cuencas sedimentarias marinas someras y lacustres. En Madrid: facies cretácicas de la Sierra de Guadarrama y rellenos miocenos de la Cuenca de Madrid (facies de transición entre las calizas del páramo y las arcillas de la cuenca).","catf":"geología","subf":"roca","base":"Marga"},{"id":"ALG-001","cat":"Botánica","sub":"Alga","name":"Lechuga de mar","sci":"Ulva lactuca","fam":"Ulvaceae","freq":"alta","key":"Talo laminar, brillante, verde intenso, muy delgado (2 células de espesor)","mnem":"La 'lechuga del mar': verde brillante, finísima y ondulada — la alga verde por excelencia","etym":"Ulva (lat.) = 'planta acuática' · lactuca = 'lechuga'","notes":"La alga verde más frecuente en exámenes. Verde intenso + lámina fina son rasgos suficientes.","hab":"Zona intermareal y submareal somera; aguas enriquecidas en nutrientes","catf":"botánica","subf":"alga","base":"Ulvalactuca"},{"id":"ALG-002","cat":"Botánica","sub":"Alga","name":"Fucus (sargazo vesiculoso)","sci":"Fucus vesiculosus","fam":"Fucaceae","freq":"alta","key":"Talo dicotómico con nervio central evidente; color pardo-oliváceo","mnem":"El 'alga de los globos': las bolsitas de aire a lo largo del talo hacen 'pop' al apretar — inconfundible","etym":"Fucus (lat.) = 'alga, tinte' · vesiculosus = 'con vesículas de aire'","notes":"Las vesículas aéreas son el rasgo diagnóstico inmediato. Muy frecuente en exámenes de costa atlántica. Fucaceae confirmada en exámenes reales.","hab":"Zona intermareal rocosa atlántica","catf":"botánica","subf":"alga","base":"Fucusvesiculosus"},{"id":"ALG-003","cat":"Botánica","sub":"Alga","name":"Coral de mar (alga coralina)","sci":"Corallina officinalis","fam":"Corallinaceae","freq":"alta","key":"Talo articulado, erecto y calcificado (duro al tacto como hueso o coral)","mnem":"El 'alga roja que parece coral': articulada, calcificada y rígida — la única alga que suena al golpearla porque tiene cal dentro","etym":"Corallina (lat.) = 'parecida al coral' · officinalis = 'medicinal, de botica'","notes":"CONFIRMADO: Corallinaceae en etiquetas de exámenes reales. La textura calcificada + articulación + color violeta son absolutamente diagnósticos. Es la única alga dura.","hab":"Zona intermareal e infralitoral rocosa atlántica y mediterránea","catf":"botánica","subf":"alga","base":"Corallinaofficinalis"},{"id":"ALG-004","cat":"Botánica","sub":"Alga","name":"Laminaria (kelp)","sci":"Laminaria hyperborea","fam":"Laminariaceae","freq":"media","key":"Talo diferenciado en estipe (tallo), rizoide (raíz) y lámina (hoja) — máxima organización en algas","mnem":"El 'árbol del mar': diferenciada en 'raíz', 'tronco' y 'hoja' pero sin ser planta. La más grande y organizada","etym":"Laminaria (lat.) = 'de láminas' · hyperborea = 'del extremo norte'","notes":"La diferenciación morfológica (estipe + rizoide + lámina) es clave didáctica en evolución de algas.","hab":"Sublitoral rocoso atlántico frío","catf":"botánica","subf":"alga","base":"Laminariahyperborea"},{"id":"ALG-005","cat":"Botánica","sub":"Alga","name":"Posidonia","sci":"Posidonia oceanica","fam":"Posidoniaceae","freq":"media","key":"Hojas acintadas largas (hasta 1 m), verde brillante con nervación paralela — es una planta con flores","mnem":"La 'hierba del Mediterráneo': hojas verdes acintadas en el fondo del mar — parece un alga pero es una planta con flores de verdad","etym":"Posidonia = de Poseidón (dios griego del mar) · oceanica = 'del océano'","notes":"Importante diferenciarlo de las algas: es una angiosperma. Las praderas de Posidonia son hábitat Natura 2000.","hab":"Fondos arenosos del Mediterráneo (1-35 m)","catf":"botánica","subf":"alga","base":"Posidoniaoceanica"},{"id":"AMP-001","cat":"Botánica","sub":"Árbol","name":"Pino resinero / Pino marítimo","sci":"Pinus pinaster","fam":"Pinaceae","freq":"alta","key":"Acículas muy largas (10-25 cm), en parejas, rígidas y torcidas — las más largas de los pinos ibéricos","mnem":"El 'pino de las agujas largas': las acículas son las más largas y rígidas de los pinos ibéricos — si las acículas son más largas que tu mano, es pinaster","etym":"Pinus = 'pino' · pinaster (lat.) = 'pino silvestre inferior, pino bastardo'","notes":"Frecuente en repoblaciones de la Meseta y en montes atlánticos. Diferencia de pino silvestre: corteza roja también abajo + acículas más largas. Diferencia de piñonero: copa no en paraguas.","hab":"Montes silíceos, repoblaciones, zona atlántica y mediterránea","catf":"botánica","subf":"árbol","base":"Pinuspinaster"},{"id":"AMP-002","cat":"Botánica","sub":"Árbol","name":"Ciprés común","sci":"Cupressus sempervirens","fam":"Cupressaceae","freq":"alta","key":"Porte columnar o piramidal muy estrecho y erecto — silueta inconfundible en el paisaje","mnem":"El 'lápiz verde del Mediterráneo': la silueta columnar perfectamente vertical es inconfundible en el horizonte — ningún otro árbol español tiene esa forma de cohete","etym":"Cupressus (lat.) = del griego 'kyparissos' · sempervirens (lat.) = 'siempre verde, perennifolio'","notes":"La silueta columnar es diagnóstica al 100% incluso a distancia. Muy plantado en cementerios, jardines y cortinas cortavientos en Madrid.","hab":"Cultivado; nativo del Mediterráneo oriental","catf":"botánica","subf":"árbol","base":"Cupressussempervirens"},{"id":"AMP-003","cat":"Botánica","sub":"Árbol","name":"Roble pedunculado / Carballo","sci":"Quercus robur","fam":"Fagaceae","freq":"alta","key":"Hojas con base auriculada (con orejillas) y peciolo muy corto (casi sésiles)","mnem":"El 'roble de las bellotas en palito largo': las bellotas cuelgan en un pedúnculo larguísimo — si las bellotas cuelgan en una vara larga, es Quercus robur","etym":"Quercus = 'roble' · robur (lat.) = 'roble fuerte, dureza' — el 'roble duro'","notes":"Par obligatorio con Q. pyrenaica (melojo). Diferencia clave: robur = envés liso + bellotas en pedúnculo largo; pyrenaica = envés tomentoso (peludo) + bellotas en pedúnculo corto.","hab":"Bosques atlánticos húmedos; vaguadas con suelos profundos y frescos","catf":"botánica","subf":"árbol","base":"Quercusrobur"},{"id":"AMP-004","cat":"Botánica","sub":"Arbusto","name":"Acebo","sci":"Ilex aquifolium","fam":"Aquifoliaceae","freq":"muy_alta","key":"Hojas coriáceas perennes con margen muy espinoso ondulado — inconfundible","mnem":"El 'árbol de Navidad con pinchos y bolitas rojas': hojas con espinas + bayas rojas brillantes en invierno — el símbolo navideño hecho árbol real","etym":"Ilex (lat.) = nombre del acebo · aquifolium (lat.) = aqua (agudo) + folium (hoja): 'hoja aguda'","notes":"Las hojas espinosas + bayas rojas en invierno son diagnósticos absolutos. El acebo es especie protegida en España (prohibida su corta). Muy frecuente en colecciones de IES madrileñas.","hab":"Bosques mixtos atlánticos, hayedos, robledales; umbría y suelos frescos","catf":"botánica","subf":"arbusto","base":"Ilexaquifolium"},{"id":"AMP-005","cat":"Botánica","sub":"Arbusto","name":"Endrino / Espino negro","sci":"Prunus spinosa","fam":"Rosaceae","freq":"alta","key":"Ramillas muy espinosas (las espinas son ramas modificadas, no aguijones)","mnem":"El 'espino que florece en invierno antes de tener hojas': flores blancas en enero sobre ramas desnudas con espinas — el primero en florecer del matorral","etym":"Prunus = 'ciruelo, frutal con hueso' · spinosa (lat.) = 'espinosa'","notes":"La floración invernal (sin hojas) + las espinas + los frutos pruinosos son diagnósticos. Familia Rosaceae — importante reconocerla por la flor con 5 pétalos y el fruto en drupa.","hab":"Setos, bordes de bosque, riberas; suelos variados","catf":"botánica","subf":"arbusto","base":"Prunusspinosa"},{"id":"AMP-006","cat":"Botánica","sub":"Arbusto","name":"Rosal silvestre / Rosal canino","sci":"Rosa canina","fam":"Rosaceae","freq":"alta","key":"Aguijones curvados en forma de gancho (diferencia de otras Rosa: aguijones rectos)","mnem":"El 'rosal con bolitas rojas en invierno': el escaramujo rojo brillante colgando de las ramas desnudas en invierno es inconfundible — fuente de vitamina C","etym":"Rosa (lat.) = 'rosal' · canina (lat.) = 'del perro, silvestre, basto'","notes":"Los escaramujos (frutos) en invierno son los más llamativos y diagnósticos. La forma de gancho de los aguijones distingue a R. canina de otras rosas. Familia Rosaceae = flor con 5 pétalos + fruto carnoso.","hab":"Setos, bordes de bosque, riberas, bordes de camino","catf":"botánica","subf":"arbusto","base":"Rosacanina"},{"id":"AMP-007","cat":"Botánica","sub":"Árbol","name":"Majuelo / Espino albar","sci":"Crataegus monogyna","fam":"Rosaceae","freq":"alta","key":"Hojas con 3-7 lóbulos profundos (más recortadas que otras Crataegus)","mnem":"El 'espino blanco de las majuelas': flores blancas en primavera → bolitas rojo oscuro en otoño, parecidas a moras pequeñas. La crema de la Rosaceae del seto","etym":"Crataegus (gr.) = kratos (fuerza) + akis (punta) · monogyna = 'con un solo pistilo'","notes":"Muy frecuente en setos de Madrid. Diferencia de Prunus spinosa: Crataegus = flores CON hojas (simultáneas); Prunus = flores SIN hojas (antes). Rosaceae = 5 pétalos siempre.","hab":"Setos, bordes de bosque, riberas; suelos variados y calizos","catf":"botánica","subf":"árbol","base":"Crataegusmonogyna"},{"id":"AMP-008","cat":"Botánica","sub":"Árbol","name":"Mostajo","sci":"Sorbus aria","fam":"Rosaceae","freq":"media","key":"Hojas ovales con borde doblemente dentado; haz verde oscuro, envés BLANCO algodonoso y denso","mnem":"El 'árbol con el envés de las hojas como papel blanco': el contraste entre el haz verde oscuro y el envés algodonoso blanco lo hace inconfundible al viento — parece que las hojas parpadean en blanco","etym":"Sorbus (lat.) = 'serbal' · aria = nombre antiguo de la especie","notes":"El envés blanco algodonoso es la clave. Frecuente en las sierras calcáreas de Madrid. Diferencia de Sorbus aucuparia (serbal de cazadores): este tiene hojas SIMPLES (no pinnadas).","hab":"Bosques de montaña, roquedos calcáreos; 600-2000 m","catf":"botánica","subf":"árbol","base":"Sorbusaria"},{"id":"AMP-009","cat":"Botánica","sub":"Árbol","name":"Aliso","sci":"Alnus glutinosa","fam":"Betulaceae","freq":"alta","key":"Hojas orbiculares con ápice truncado o emarginado (redondeado o con escotadura en el extremo)","mnem":"El 'árbol del agua con piñas de madera': junto a los ríos, con esas pequeñas 'piñas' leñosas que cuelgan en invierno — el único árbol ripario con frutos leñosos en racimo","etym":"Alnus (lat.) = 'aliso' · glutinosa (lat.) = 'pegajosa': por las ramillas y hojas jóvenes","notes":"Los estróbilos leñosos persistentes son absolutamente diagnósticos en invierno. El aliso es el único árbol caducifolio del bosque de galería con nódulos fijadores de N₂ (Frankia = bacteria actinomiceto).","hab":"Orillas de ríos y arroyos; suelos hidromorfos","catf":"botánica","subf":"árbol","base":"Alnusglutinosa"},{"id":"AMP-010","cat":"Botánica","sub":"Arbusto","name":"Saúco","sci":"Sambucus nigra","fam":"Adoxaceae","freq":"alta","key":"Hojas compuestas pinnadas con 5-7 folíolos lanceolados serrados; olor desagradable al frotar","mnem":"El 'árbol con médula de corcho y moras negras': corta una rama joven y la médula blanca blanda es el sello inconfundible. Las bayas negras en paraguas son el otro rasgo","etym":"Sambucus (lat.) = 'saúco' (instrumento musical hecho con su madera hueca) · nigra = 'negro': por los frutos","notes":"La médula blanca esponjosa es diagnóstica al corte. Muy frecuente en bordes de camino y ruinas. Las flores (para bebidas) y los frutos (para mermelada) tienen uso culinario conocido.","hab":"Bordes de camino, ruinas, bordes de bosque; lugares ruderales y nitrogenados","catf":"botánica","subf":"arbusto","base":"Sambucusnigra"},{"id":"AMP-011","cat":"Botánica","sub":"Árbol","name":"Avellano","sci":"Corylus avellana","fam":"Betulaceae","freq":"media","key":"Hojas redondeadas con base cordada y ápice acuminado; doble dentado; pelosas","mnem":"El 'árbol de los amentos amarillos en enero': los amentos colgantes del avellano en pleno invierno son la primera señal de vida del bosque caducifolio — antes incluso que el almendro","etym":"Corylus (lat.) = 'avellano' · avellana = de 'Avella Vecchia' (Campania, Italia)","notes":"Los amentos en enero son muy llamativos y diagnósticos. La avellana en su cúpula es única. Importante en la dinámica de los bosques: muy rebrotador tras el fuego.","hab":"Bosques caducifolios atlánticos, bordes de hayedos y robledales","catf":"botánica","subf":"árbol","base":"Corylusavellana"},{"id":"AMP-012","cat":"Botánica","sub":"Árbol","name":"Boj","sci":"Buxus sempervirens","fam":"Buxaceae","freq":"alta","key":"Hojas pequeñas, ovales, coriáceas y opuestas; haz verde brillante, envés más pálido","mnem":"El 'arbusto del olor de botica': el olor característico al frotar las hojas es absolutamente inconfundible — intenso y ligeramente desagradable. Las hojitas pequeñas opuestas son su firma visual","etym":"Buxus (lat.) = 'boj' · sempervirens = 'siempre verde'","notes":"El olor + hojas pequeñas opuestas coriáceas son diagnósticos. Muy utilizado en jardinería (setos). En la naturaleza: calcícola, frecuente en las sierras calcáreas de Madrid.","hab":"Bosques y matorrales en suelos calcáreos; umbría","catf":"botánica","subf":"árbol","base":"Buxussempervirens"},{"id":"AMP-013","cat":"Botánica","sub":"Árbol","name":"Higuera","sci":"Ficus carica","fam":"Moraceae","freq":"media","key":"Hojas muy grandes (10-20 cm), palmadas con 3-7 lóbulos; ásperas al tacto; látex lechoso al cortar","mnem":"El 'árbol del látex blanco y hoja de mano': el látex que sale al cortar una ramita joven + las hojas lobuladas enormes + el higo son únicos","etym":"Ficus (lat.) = 'higo, higuera' · carica = 'de Caria' (región de Asia Menor)","notes":"El higo (sicono) es el fruto más atípico del mundo vegetal. El látex lechoso es diagnóstico al campo. Común en ruinas y zonas calizas de Madrid (naturalizada).","hab":"Zonas calizas, ruinas, laderas soleadas; cultivada","catf":"botánica","subf":"árbol","base":"Ficuscarica"},{"id":"AMP-014","cat":"Botánica","sub":"Arbusto","name":"Aulaga / Tojo","sci":"Ulex europaeus","fam":"Fabaceae","freq":"media","key":"Arbusto completamente cubierto de espinas rígidas que son hojas modificadas","mnem":"El 'arbusto erizo amarillo': todo espinas con flores amarillas fragantes a coco — si pinchas + huele a coco + está en el norte o la sierra, es tojo","etym":"Ulex (lat.) = 'aulaga' (nombre latino directo) · europaeus = 'europeo'","notes":"Diferencia de retama (sin espinas, con hojas rudimentarias) vs. aulaga (espinas que son hojas). Muy frecuente en brezales atlánticos. Las flores pueden aparecer cualquier mes del año.","hab":"Brezales atlánticos, suelos ácidos pobres, bordes de bosque","catf":"botánica","subf":"arbusto","base":"Ulexeuropaeus"},{"id":"AMP-015","cat":"Botánica","sub":"Arbusto","name":"Escoba / Retama negra","sci":"Cytisus scoparius","fam":"Fabaceae","freq":"alta","key":"Tallos verdes, pentagonales (en sección: 5 ángulos) y muy ramificados — diagnóstico táctil","mnem":"El 'arbusto escoba con flores amarillas perfectas': los tallos pentagonales verdes + las flores amarillas llamativas lo distinguen de la retama (tallos cilíndricos, flores más pequeñas)","etym":"Cytisus (gr.) = kytisos (nombre griego de un arbusto similar) · scoparius = 'de escoba': tallos usados para hacer escobas","notes":"Los tallos pentagonales (5 ángulos) son el carácter diagnóstico más preciso para distinguirlo de retama (tallos cilíndricos) y de aulaga (espinosa). Muy frecuente en la sierra de Madrid.","hab":"Brezales y matorrales silíceos atlánticos y de montaña; bordes de bosque","catf":"botánica","subf":"arbusto","base":"Cytisusscoparius"},{"id":"AMP-016","cat":"Botánica","sub":"Arbusto","name":"Gayomba / Retama de flor","sci":"Spartium junceum","fam":"Fabaceae","freq":"media","key":"Tallos cilíndricos (no pentagonales como Cytisus) verdes y junquiformes (como juncos)","mnem":"La 'retama de las flores grandes perfumadas': las flores amarillas son el doble de grandes que las de la retama común, y el olor es intensísimo — la más fragante de las retamas","etym":"Spartium (gr.) = sparton (esparto, cuerda): por los tallos usados para trenzar · junceum = 'parecido al junco'","notes":"El tamaño de las flores (muy grandes) + el olor intenso + los tallos cilíndricos la distinguen de las otras retamas y escobas. Frecuente en taludes y bordes de carretera en Madrid.","hab":"Taludes, bordes de carretera, matorral mediterráneo; calcícola o indiferente","catf":"botánica","subf":"arbusto","base":"Spartiumjunceum"},{"id":"AMP-017","cat":"Botánica","sub":"Arbusto","name":"Aladierno / Aladierna","sci":"Rhamnus alaternus","fam":"Rhamnaceae","freq":"media","key":"Hojas perennes, alternas, ovales-lanceoladas, coriáceas, con nervios secundarios arqueados","mnem":"El 'arbusto con bayas en semáforo': los frutos pasan de verde → rojo → negro, así que en el mismo arbusto ves los tres colores a la vez — el semáforo del matorral mediterráneo","etym":"Rhamnus (gr.) = 'rhamno, espino' · alaternus = nombre latino del arbusto","notes":"Los frutos tricolores (verde/rojo/negro simultáneos) son el carácter más llamativo. Las hojas con nervios arqueados son diagnósticas. Forma el sotobosque del encinar.","hab":"Matorral mediterráneo; sotobosque de encinar; suelos calcáreos","catf":"botánica","subf":"arbusto","base":"Rhamnusalaternus"},{"id":"AMP-018","cat":"Botánica","sub":"Arbusto","name":"Viburno / Morrionera","sci":"Viburnum lantana","fam":"Adoxaceae","freq":"media","key":"Hojas grandes, ovales, finamente dentadas; haz arrugado y con pelillos estrellados (estrellado-tomentoso)","mnem":"El 'arbusto lana': hoja arrugada cubierta de pelillos que dan un tacto suave como lana — y el racimo de bayas en semáforo (verde → rojo → negro) igual que el aladierno","etym":"Viburnum (lat.) = nombre latino del arbusto · lantana = 'llantén' (por las hojas anchas)","notes":"El pubescencia estrellada de las hojas (se ve con lupa) es diagnóstica del género. Diferencia de Sambucus: Viburnum tiene hojas simples, no pinnadas.","hab":"Orlas de bosque, setos, bordes de camino; suelos calcáreos","catf":"botánica","subf":"arbusto","base":"Viburnumlantana"},{"id":"AMP-019","cat":"Botánica","sub":"Herbácea","name":"Zanahoria silvestre","sci":"Daucus carota","fam":"Apiaceae (Umbelliferae)","freq":"alta","key":"Umbela blanca con brácteola central oscura (rojiza o purpúrea) en el centro — diagnóstico de especie","mnem":"La 'sombrilla blanca con mancha oscura en el centro': la única umbela que tiene una flor central oscura como un ojo — el truco para ver los polinizadores que ya la visitaron","etym":"Daucus (gr.) = nombre antiguo de la planta · carota (lat.) = nombre de la zanahoria","notes":"La umbela compuesta es el carácter diagnóstico de familia Apiaceae. La brácteola central oscura es el diagnóstico de especie. El aspecto 'en nido' al fructificar es muy llamativo.","hab":"Bordes de camino, pastizales, campos; suelos secos","catf":"botánica","subf":"herbácea","base":"Daucuscarota"},{"id":"AMP-020","cat":"Botánica","sub":"Herbácea","name":"Hinojo","sci":"Foeniculum vulgare","fam":"Apiaceae (Umbelliferae)","freq":"alta","key":"Hojas muy divididas en segmentos filiformes (como hebras finísimas) — inconfundible","mnem":"El 'apiáceo con olor a anís y hojas de pluma': las hojas finísimas como filamentos + el aroma intenso a anís = solo el hinojo. Imposible confundirlo al olfato","etym":"Foeniculum (lat.) = foenum (heno) + -iculum (pequeño): 'el pequeño heno' — por el aspecto de las hojas","notes":"El olor a anís al frotar es diagnóstico absoluto. Las hojas en filamentos son las más divididas de todos los Apiaceae ibéricos comunes. Muy frecuente en bordes de camino de Madrid.","hab":"Bordes de camino, ribazos, suelos secos y removidos","catf":"botánica","subf":"herbácea","base":"Foeniculumvulgare"},{"id":"AMP-021","cat":"Botánica","sub":"Herbácea","name":"Cañaheja","sci":"Ferula communis","fam":"Apiaceae (Umbelliferae)","freq":"media","key":"La umbela de Apiaceae más grande de Europa (hasta 2.5 m de altura)","mnem":"El 'girasol de los Apiaceae': la umbela más grande de la familia, sobre el tallo más alto — si ves una umbelifera que te supera en altura, es una Ferula","etym":"Ferula (lat.) = 'palo, varita' — los tallos se usaban como bastón o antorcha en la antigüedad","notes":"La Ferula es la umbela más grande e impresionante. Frecuente en el Mediterráneo ibérico. Tóxica para el ganado (ferulenol). Heracles llevaba una antorcha de Ferula según la mitología.","hab":"Matorral mediterráneo, garrига, suelos calizos","catf":"botánica","subf":"herbácea","base":"Ferulacommunis"},{"id":"AMP-022","cat":"Botánica","sub":"Herbácea","name":"Orquídea pirámide","sci":"Anacamptis pyramidalis","fam":"Orchidaceae","freq":"alta","key":"Espiga floral densa con forma piramidal (aguda en el ápice) de flores rosado-púrpura","mnem":"La 'orquídea rosa en pirámide': la inflorescencia piramidal rosada es absolutamente inconfundible. La única orquídea ibérica con esa forma de cono terminado en punta","etym":"Anacamptis (gr.) = anakamptein (curvar hacia atrás): por el espolón curvado · pyramidalis = 'piramidal'","notes":"La familia Orchidaceae es una de las más ricas en especies de la flora ibérica. Anacamptis pyramidalis es la más frecuente en praderas calcáreas. El espolón largo = indica polinización por lepidópteros.","hab":"Prados y pastizales calcáreos; bordes de encinar","catf":"botánica","subf":"herbácea","base":"Anacamptispyramidalis"},{"id":"AMP-023","cat":"Botánica","sub":"Herbácea","name":"Ophrys abeja","sci":"Ophrys apifera","fam":"Orchidaceae","freq":"alta","key":"Labelo que imita el abdomen de una abeja (forma, color, textura y olor) — mimetismo sexual","mnem":"La 'orquídea que engaña a las abejas': el labelo imita tan perfectamente a una abeja hembra que los machos intentan copular con la flor — el mayor engaño del reino vegetal","etym":"Ophrys (gr.) = 'ceja': por la forma del labelo que recuerda una ceja · apifera = 'portadora de abeja'","notes":"El mimetismo sexual de Ophrys es uno de los temas más fascinantes de la botánica y es evaluable. La flor engaña a los machos de Eucera (abeja) para que transporten el polen.","hab":"Prados calcáreos, garriga, bordes de encinar","catf":"botánica","subf":"herbácea","base":"Ophrysapifera"},{"id":"AMP-024","cat":"Botánica","sub":"Herbácea","name":"Gamón / Asfódelo","sci":"Asphodelus ramosus","fam":"Asphodelaceae","freq":"alta","key":"Escapo muy alto (hasta 1.5 m) con flores blancas rayadas de pardo; sin hojas en el tallo","mnem":"El 'candelabro blanco del monte': escapo alto con muchas ramas y flores blancas con franja marrón — la planta de los muertos del Hades griego, que crecía en los prados del inframundo","etym":"Asphodelus (gr.) = nombre griego del gamón · ramosus (lat.) = 'ramificado': el escapo tiene ramas","notes":"Muy frecuente en el matorral degradado mediterráneo de Madrid. El escapo alto ramificado con flores blancas rayadas es inconfundible. Indicadora de suelos degradados.","hab":"Matorral mediterráneo degradado; pastizales secos","catf":"botánica","subf":"herbácea","base":"Asphodelusramosus"},{"id":"AMP-025","cat":"Botánica","sub":"Herbácea","name":"Nazarenos / Jacinto de penacho","sci":"Muscari neglectum","fam":"Asparagaceae","freq":"media","key":"Flores en racimo de bolitas azul-violáceas brillantes con borde blanco","mnem":"Las 'bolitas azules en racimo de primavera': el racimo de pequeñas bolas azul-violáceas compactas es una de las flores más reconocibles de la primavera ibérica","etym":"Muscari (lat. / turco) = 'almizcle': por el olor almizclado de algunas especies · neglectum = 'descuidado, olvidado'","notes":"Muscari es la planta con flores azul-violáceas más frecuente de la primavera ibérica. Las flores urceoladas (como botellitas) con borde blanco son diagnósticas del género.","hab":"Prados, olivares, campos; suelos variados","catf":"botánica","subf":"herbácea","base":"Muscarineglectum"},{"id":"AMP-026","cat":"Botánica","sub":"Herbácea","name":"Espárrago triguero / Esparraguera","sci":"Asparagus acutifolius","fam":"Asparagaceae","freq":"media","key":"Cladodios (hojas modificadas): aciculares, muy agudos y rígidos (pinchan) en grupos de 4-12","mnem":"El 'espárrago que pincha': los cladodios rígidos y agudos que pinchan al cogerlo son la diferencia del espárrago silvestre vs. la esparraguera cultivada (blanda). Los turiones primaverales son el espárrago que se come","etym":"Asparagus (gr.) = 'espárrago' · acutifolius = 'de hojas agudas'","notes":"Los cladodios (hojas modificadas) son el carácter diagnóstico de Asparagus. Los turiones primaverales = espárragos trigueros comestibles. Asparagaceae por la estructura floral (6 tépalos).","hab":"Matorral mediterráneo, bordes de encinar y olivar","catf":"botánica","subf":"herbácea","base":"Asparagusacutifolius"},{"id":"AMP-027","cat":"Botánica","sub":"Herbácea","name":"Lechetrezna / Euforbio","sci":"Euphorbia characias","fam":"Euphorbiaceae","freq":"alta","key":"Látex lechoso blanco muy abundante al cortar cualquier parte — diagnóstico absoluto de Euphorbia","mnem":"La 'planta que sangra blanca': si la rompes y sale abundante látex blanco, es Euphorbia — el látex es la firma de toda la familia, tóxico pero inconfundible","etym":"Euphorbia = del médico Euforbo, doctor del rey Juba II · characias = nombre griego de la planta","notes":"El látex blanco es diagnóstico de familia Euphorbiaceae. El ciatio (inflorescencia única del género) es evaluable como estructura floral especializada. Tóxica por diterpenoides.","hab":"Matorral mediterráneo, garrига; suelos secos","catf":"botánica","subf":"herbácea","base":"Euphorbiacharacias"},{"id":"AMP-028","cat":"Botánica","sub":"Herbácea","name":"Clavel silvestre / Clavel de roca","sci":"Dianthus sylvestris","fam":"Caryophyllaceae","freq":"media","key":"5 pétalos rosas con el margen finamente dentado (fleco de peine) — diagnóstico de Dianthus","mnem":"El 'clavel de los roquedos': pétalos rosas con el borde en puntilla (denticulado) + olor a clavel. La flor de Zeus hecha silvestre en las grietas de las rocas","etym":"Dianthus (gr.) = Dios (Zeus/Jupiter) + anthos (flor): 'flor de Zeus' · sylvestris = 'silvestre'","notes":"El borde denticulado de los pétalos es diagnóstico de todo el género Dianthus. La familia Caryophyllaceae: pétalos generalmente escotados o con uña + hojas opuestas + nudos hinchados.","hab":"Roquedos y prados secos de montaña","catf":"botánica","subf":"herbácea","base":"Dianthussylvestris"},{"id":"AMP-029","cat":"Botánica","sub":"Herbácea","name":"Colleja","sci":"Silene vulgaris","fam":"Caryophyllaceae","freq":"alta","key":"Cáliz muy hinchado y globoso, como un globo o vesícula — absolutamente único (cáliz vejigoso)","mnem":"La 'globo blanco del campo': el cáliz hinchado como un globo o pompa de jabón con el pétalo blanco asomando es absolutamente único en la flora ibérica","etym":"Silene = de Sileno (compañero de Baco, siempre hinchado) · vulgaris = 'común'","notes":"El cáliz globoso-vejigoso es diagnóstico absoluto de S. vulgaris. Las collejas tienen usos culinarios (tortilla de collejas). Muy frecuente en bordes de camino de Madrid.","hab":"Bordes de camino, pastizales, campos; suelos variados","catf":"botánica","subf":"herbácea","base":"Silenevulgaris"},{"id":"AMP-030","cat":"Botánica","sub":"Herbácea","name":"Ortiga mayor","sci":"Urtica dioica","fam":"Urticaceae","freq":"alta","key":"Pelos urticantes en tallos y hojas (secretan histamina y acetilcolina al contacto)","mnem":"La 'planta que quema sin fuego': el escozor al tocarla es su firma — la única planta herbácea europea que duele al tocarla simplemente con rozar","etym":"Urtica (lat.) = 'ortiga' (de urere = quemar) · dioica = 'dioica, con sexos separados'","notes":"La sensación de escozor al contacto (sin tocar las hojas directamente) es el carácter más memorable. Indicadora de nitrógeno (planta nitrófila). Fibra textil históricamente usada.","hab":"Bordes de camino, ruinas, suelos ricos en materia orgánica; nitrófila","catf":"botánica","subf":"herbácea","base":"Urticadioica"},{"id":"AMP-031","cat":"Botánica","sub":"Herbácea","name":"Viborera / Borraja del campo","sci":"Echium vulgare","fam":"Boraginaceae","freq":"alta","key":"Flores tubulares azul-violáceas con estambres rojos que sobresalen — diagnóstico del género","mnem":"La 'borraja azul-rojo de los taludes': flores azules con estambres rojos que sobresalen + la inflorescencia que se desenrolla como una cola de escorpión — el más llamativo de los boragináceos","etym":"Echium (gr.) = echis (víbora): por las semillas que recuerdan a una cabeza de víbora · vulgare = 'común'","notes":"La inflorescencia en escorpioide (cincinno) es característica de Boraginaceae. Los estambres rojos salientes son diagnósticos de Echium. Planta muy atractiva para abejorros.","hab":"Bordes de camino, taludes, yermos; suelos secos","catf":"botánica","subf":"herbácea","base":"Echiumvulgare"},{"id":"AMP-032","cat":"Botánica","sub":"Herbácea","name":"Llantén lanceolado","sci":"Plantago lanceolata","fam":"Plantaginaceae","freq":"alta","key":"Hojas lanceoladas en roseta basal con 3-5 nervios paralelos muy marcados","mnem":"La 'espiga con corona de antenas blancas': la cabezuela cilíndrica con las antenas blancas sobresaliendo como una corona es absolutamente diagnóstica. La más frecuente de los llantenes","etym":"Plantago (lat.) = planta (planta del pie) + ago (actuar): 'el que aplana con los pies' · lanceolata = 'lanceolada'","notes":"Las antenas blancas sobresalientes son diagnósticas en flor. La nerviación paralela de las hojas basales es clave para identificar el género. Muy frecuente en prados pisoteados de Madrid.","hab":"Prados, bordes de camino, suelos pisoteados y nitrogenados; ubiquista","catf":"botánica","subf":"herbácea","base":"Plantagolanceolata"},{"id":"AMP-033","cat":"Botánica","sub":"Herbácea","name":"Diente de león","sci":"Taraxacum officinale","fam":"Compositae (Asteraceae)","freq":"alta","key":"Capítulo solitario por escapo; lígulas amarillas en todos los flósculos (solo lígulas, sin flósculos tubulares)","mnem":"La 'bola de hacer deseos': el vilano blanco esférico que se dispersa con el soplo es uno de los símbolos más universales de la naturaleza. Amarillo → blanco esférico","etym":"Taraxacum (árabe/persa) = 'diente de leon' · officinale = 'medicinal, de botica'","notes":"El capítulo con SOLO lígulas (sin flósculos tubulares en el centro) + el vilano plumoso son diagnósticos de Lactuceae (tribu de Compositae). El látex + la roseta lobulada son diagnósticos de Taraxacum.","hab":"Prados, jardines, bordes de camino; ubiquista","catf":"botánica","subf":"herbácea","base":"Taraxacumofficinale"},{"id":"AMP-034","cat":"Botánica","sub":"Herbácea","name":"Cardo borriquero","sci":"Cirsium vulgare","fam":"Compositae (Asteraceae)","freq":"alta","key":"Capítulo grande (2-4 cm) de flores tubulares púrpura-violáceas; sin lígulas","mnem":"El 'cardo con alas de espinas en el tallo': si el tallo tiene alas espinosas que continúan la hoja hacia abajo, es Cirsium vulgare — el más común de los cardos de Madrid","etym":"Cirsium (gr.) = kirsos (vena varicosa): usada para tratar varices · vulgare = 'común'","notes":"Las alas decurrentes espinosas son diagnósticas de especie. La tribu Cardueae = involucro espinoso. Importante como alimento de jilgueros (comedores de semillas de cardo).","hab":"Bordes de camino, pastizales perturbados, cunetas","catf":"botánica","subf":"herbácea","base":"Cirsiumvulgare"},{"id":"AMP-035","cat":"Botánica","sub":"Herbácea","name":"Aciano / Azulejo","sci":"Centaurea cyanus","fam":"Compositae (Asteraceae)","freq":"media","key":"Flores periféricas azul-violáceas intensas muy llamativas, radiantes (más grandes que las centrales)","mnem":"El 'azul eléctrico del campo de trigo': las flores periféricas azul-intenso entre el amarillo del trigo son el color más llamativo del campo castellano en junio","etym":"Centaurea = del centauro Quirón (que usaba la planta para curarse) · cyanus (gr.) = 'azul cielo'","notes":"El azul intenso + las flores periféricas más grandes y estériles son diagnósticos. Planta arvense de campos de cereal. Fue muy común antes del uso de herbicidas.","hab":"Campos de cereal, bordes de camino","catf":"botánica","subf":"herbácea","base":"Centaureacyanus"},{"id":"AMP-036","cat":"Botánica","sub":"Herbácea","name":"Nenúfar blanco","sci":"Nymphaea alba","fam":"Nymphaeaceae","freq":"alta","key":"Hojas flotantes grandes (10-30 cm), redondas o reniformes, con hendidura en V hasta el peciolo","mnem":"La 'flor de loto europea': hojas redondas flotantes + flor blanca enorme abierta sobre el agua — el nenúfar de los cuadros de Monet","etym":"Nymphaea (gr.) = nymphe (ninfa acuática): 'la de las ninfas' · alba = 'blanca'","notes":"La hoja flotante con hendidura en V hasta el centro + la flor blanca grande son diagnósticas. Diferenciar de Nuphar (nenúfar amarillo): Nymphaea = blanca; Nuphar = amarilla y más pequeña.","hab":"Lagos, lagunas y remansos de ríos con aguas tranquilas; profundidad 0.5-3 m","catf":"botánica","subf":"herbácea","base":"Nymphaeaalba"},{"id":"AMP-037","cat":"Botánica","sub":"Herbácea","name":"Lirio amarillo de agua","sci":"Iris pseudacorus","fam":"Iridaceae","freq":"alta","key":"Flores grandes amarillas con 3 sépalos caídos moteados de marrón y 3 pétalos erectos","mnem":"El 'lirio amarillo del pantano con hojas en espada': las flores amarillas con moteado marrón + las hojas en abanico (todas en el mismo plano) son los rasgos diagnósticos del lirio más acuático","etym":"Iris (gr.) = diosa del arco iris (variedad de colores) · pseudacorus = 'pseudo-ácoro' (parecido al Acorus)","notes":"La flor de 6 tépalos diferenciados (3 caídos + 3 erectos) es el diseño típico de Iridaceae. Las hojas equitantes (todas en un plano) son diagnósticas de todo el género Iris.","hab":"Orillas de ríos, arroyos, humedales, zanjas; suelos encharcados","catf":"botánica","subf":"herbácea","base":"Irispseudacorus"},{"id":"AMP-038","cat":"Botánica","sub":"Herbácea","name":"Aguileña / Pajarilla","sci":"Aquilegia vulgaris","fam":"Ranunculaceae","freq":"media","key":"5 pétalos con espolón hueco curvado hacia atrás — absolutamente diagnóstico del género","mnem":"La 'flor de las 5 garras curvas': los 5 espolones curvados hacia atrás como garras de águila son absolutamente únicos — ninguna otra planta tiene esa forma","etym":"Aquilegia (lat.) = aquila (águila): los espolones curvados recuerdan las garras del águila","notes":"Los espolones curvados son diagnósticos absolutos del género. La coevolución con abejorros de trompa larga para acceder al néctar es evaluable. Ranunculaceae = muchos estambres + pétalos libres.","hab":"Bosques de montaña húmedos, prados con sombra; 600-2000 m","catf":"botánica","subf":"herbácea","base":"Aquilegiavulgaris"},{"id":"AMP-039","cat":"Botánica","sub":"Herbácea","name":"Hipérico / Corazoncillo","sci":"Hypericum perforatum","fam":"Hypericaceae","freq":"alta","key":"Hojas con puntos translúcidos (glándulas oleosas) visibles al trasluz — diagnóstico de especie","mnem":"La 'flor amarilla con agujeros de luz': pon la hoja al trasluz y verás los puntitos translúcidos — la única herbácea perenne con ese patrón de 'perforación' de la hoja","etym":"Hypericum (gr.) = hyper (sobre) + eikon (imagen): colgado sobre imágenes religiosas para ahuyentar el demonio · perforatum = 'perforado' — las glándulas translúcidas","notes":"Los puntos translúcidos al trasluz son diagnósticos absolutos de H. perforatum. El tallo bicostado (2 costillas) también es diagnóstico. Importante por su uso como antidepresivo (hipericina).","hab":"Bordes de bosque, prados secos, bordes de camino","catf":"botánica","subf":"herbácea","base":"Hypericumperforatum"},{"id":"AMP-040","cat":"Botánica","sub":"Herbácea","name":"Malva común","sci":"Malva sylvestris","fam":"Malvaceae","freq":"media","key":"Flores rosas a púrpuras con 5 pétalos y venas más oscuras muy llamativas","mnem":"La 'flor con venas oscuras en rayos + quesito de fruto': las venas más oscuras en las flores rosa + el fruto en rueda de gajos son inconfundibles. El tubo de estambres fusionados es la firma de Malvaceae","etym":"Malva (lat.) = nombre latino de la planta (del gr. malakhe = blando, suave) · sylvestris = 'silvestre'","notes":"El tubo estaminal (columna de estambres fusionados) es el carácter diagnóstico de toda la familia Malvaceae (el mismo que en el malvavisco, el hibisco y el algodón). El fruto en 'quesito' es muy llamativo.","hab":"Bordes de camino, suelos removidos; nitrófila","catf":"botánica","subf":"herbácea","base":"Malvasylvestris"},{"id":"AMP-041","cat":"Botánica","sub":"Arbusto","name":"Salvia común","sci":"Salvia officinalis","fam":"Lamiaceae","freq":"media","key":"Hojas oblongas, rugosas-bulladas, gris-verdosas con abundante pelillo glandular","mnem":"La 'flor azul con hojas de terciopelo gris aromático': las hojas arrugadas y grisáceas con aroma medicinal intenso son inconfundibles — el olor a salvia es conocido por cualquiera","etym":"Salvia (lat.) = salvare (salvar, curar): 'la que salva' · officinalis = 'medicinal'","notes":"Lamiaceae: tallo cuadrangular + hojas opuestas + flor bilabiada. El aroma al frotar es la clave de campo más rápida. Diferencia de romero (hojas aciculares) y tomillo (hojas muy pequeñas).","hab":"Cultivada; en la naturaleza: bordes de camino, matorral","catf":"botánica","subf":"arbusto","base":"Salviaofficinalis"},{"id":"AMP-042","cat":"Botánica","sub":"Herbácea","name":"Té de montaña / Sideritis","sci":"Sideritis hyssopifolia","fam":"Lamiaceae","freq":"alta","key":"Brácteas de la inflorescencia amarillas y muy llamativas (más visibles que las flores)","mnem":"El 'té de montaña con brácteas amarillas': las brácteas amarillas que rodean los verticilos florales son más llamativas que las flores mismas — la planta del té de montaña ibérico","etym":"Sideritis (gr.) = sideros (hierro): usada para curar heridas de armas de hierro · hyssopifolia = 'de hojas de hisopo'","notes":"Las brácteas amarillas llamativas son diagnósticas del género. Endemismo ibérico de alta montaña. El té de Sideritis es el más consumido en el centro de España (té de puerto). Muy representativa del piso subalpino del Sistema Central.","hab":"Prados y roquedos subalpinos y alpinos; 1200-2600 m","catf":"botánica","subf":"herbácea","base":"Sideritishyssopifolia"},{"id":"AMP-043","cat":"Botánica","sub":"Herbácea","name":"Festuca / Cañuela","sci":"Festuca ovina","fam":"Gramineae (Poaceae)","freq":"media","key":"Matas densas de hojas muy finas y rígidas (filiformes setáceas), casi como alfileres","mnem":"La 'gramínea de las agujas verdes': las hojas finísimas y rígidas forman una mata como un erizo verde — si el pasto de montaña parece hecho de agujas, es festuca","etym":"Festuca (lat.) = 'brizna, paja' · ovina (lat.) = 'de las ovejas': la gramínea del pasto ovino de montaña","notes":"Las hojas setáceas (en forma de cerdas) son diagnósticas de F. ovina. Forma los pastizales climácicos de alta montaña del Sistema Central (majadales). La familia Gramineae se reconoce por la espiguilla.","hab":"Pastizales de alta montaña, prados subalpinos y alpinos; acidófila","catf":"botánica","subf":"herbácea","base":"Festucaovina"},{"id":"AMP-044","cat":"Botánica","sub":"Herbácea","name":"Ray-grass inglés","sci":"Lolium perenne","fam":"Gramineae (Poaceae)","freq":"media","key":"Espiga solitaria (un solo eje principal sin ramificaciones) con espiguillas alternas en el raquis","mnem":"La 'gramínea del campo de fútbol': la espiga simple con espiguillas alternadas perfectamente en un eje + el brillo de las hojas son los rasgos del césped de jardín y estadio","etym":"Lolium (lat.) = 'ballico, cizaña' · perenne = 'perenne'","notes":"Lolium tiene la espiga más sencilla entre las gramíneas (solo un eje). Las aurículas en la base de la hoja son diagnósticas. La más usada en céspedes deportivos. La cizaña (L. temulentum) es su pariente tóxica.","hab":"Prados, céspedes, bordes de camino; cultivado","catf":"botánica","subf":"herbácea","base":"Loliumperenne"},{"id":"AMP-045","cat":"Botánica","sub":"Herbácea","name":"Aegilops / Egilope","sci":"Aegilops geniculata","fam":"Gramineae (Poaceae)","freq":"media","key":"Espiga compacta con espiguillas anchas y abultadas; aristas muy largas saliendo en todas direcciones","mnem":"La 'mini-espiga erizo con aristas en todas direcciones': la espiga pequeña y abultada con aristas largas saliendo en abanico es inconfundible entre las gramíneas mediterráneas","etym":"Aegilops (gr.) = 'cabra del monte': por la dureza y forma de espinas de la espiga · geniculata = 'con nudos'","notes":"Aegilops es uno de los géneros ancestrales del trigo. Las aristas divergentes + la espiga compacta son diagnósticas. Muy frecuente en terrenos secos de Madrid. Su estudio es clave en genética de cereales.","hab":"Bordes de camino, barbechos, suelos secos y pedregosos; calcícola","catf":"botánica","subf":"herbácea","base":"Aegilopsgeniculata"},{"id":"AMP-046","cat":"Botánica","sub":"Pteridófito","name":"Helecho macho","sci":"Dryopteris filix-mas","fam":"Dryopteridaceae","freq":"alta","key":"Fronde 1-2 veces pinnada con pínnulas con diente apical; en corona desde el rizoma","mnem":"El 'helecho rey de los bosques umbríos': el más grande y elegante de los helechos de sotobosque, con frondas en corona y los soros con tapaderas en forma de riñón","etym":"Dryopteris (gr.) = drys (roble) + pteris (helecho): 'helecho de los robles' · filix-mas = 'helecho macho'","notes":"El indusio riñoniforme es diagnóstico de Dryopteris. El helecho macho es el más frecuente en bosques húmedos del Sistema Central. Diferencia de Pteridium (helecho común): Dryopteris = soros redondeados con indusio; Pteridium = soros lineales marginales.","hab":"Bosques húmedos umbríos, hayedos, robledales; suelos ácidos ricos","catf":"botánica","subf":"pteridófito","base":"Dryopterisfilix-mas"},{"id":"AMP-047","cat":"Botánica","sub":"Pteridófito","name":"Polipodio / Regaliz de palo","sci":"Polypodium vulgare","fam":"Polypodiaceae","freq":"alta","key":"Fronde 1 vez pinnada con segmentos oblongos enteros (no subdividida más) — aspecto 'peine'","mnem":"El 'helecho peine sobre las rocas': fronde en peine (1-pinnado) sobre rocas o troncos, con soros redondos sin tapa visible — el helecho 'desnudo' más común de las rocas del bosque","etym":"Polypodium (gr.) = polys (muchos) + pous (pie): 'el de muchos pies' — por los rizomas ramificados · vulgare = 'común'","notes":"Los soros desnudos (sin indusio) en doble fila son diagnósticos de la familia Polypodiaceae. El rizoma superficial horizontal con olor dulzón (glicirrizina = como el regaliz) es único.","hab":"Sobre rocas, muros, base de árboles; bosques húmedos","catf":"botánica","subf":"pteridófito","base":"Polypodiumvulgare"},{"id":"AMP-048","cat":"Botánica","sub":"Pteridófito","name":"Helecho real / Osmunda","sci":"Osmunda regalis","fam":"Osmundaceae","freq":"media","key":"El mayor helecho ibérico (hasta 2 m); fronde 2 veces pinnada con pínnulas grandes","mnem":"El 'helecho con corona de esporas marrones': la parte superior de la fronde se convierte en un penacho pardo de esporangios — como si el helecho llevara una corona de polvo marrón","etym":"Osmunda (escandinavo) = Osmunder, nombre del dios Thor · regalis (lat.) = 'real, regio'","notes":"La fronde dimórfica (parte fotosintética + parte esporángica parda) es absolutamente diagnóstica y única entre los helechos comunes. El mayor helecho ibérico. Protegido en algunas comunidades.","hab":"Orillas de ríos y arroyos, turberas; suelos ácidos permanentemente húmedos","catf":"botánica","subf":"pteridófito","base":"Osmundaregalis"},{"id":"AMP-049","cat":"Botánica","sub":"Pteridófito","name":"Selaginela","sci":"Selaginella selaginoides","fam":"Selaginellaceae","freq":"media","key":"Aspecto de musgo pero con dos tipos de microfilos (hojas) en rangos: grandes laterales + pequeñas dorsales","mnem":"El 'musgo con dos tipos de hojas': parece un musgo pero sus hojas tienen dos tamaños en la misma planta (grandes + pequeñas) y tiene estructura vascular — más complejo que el musgo","etym":"Selaginella (lat.) = diminutivo de Selago (nombre antiguo de una planta similar) · selaginoides = 'parecida a Selago'","notes":"La heterosporia (dos tipos de esporas: microspora + megaspora) de Selaginella es un hito evolutivo clave — anticipa la semilla. Diferencia esencial de musgos (briófitos) vs. licófitos: Selaginella tiene vasos conductores.","hab":"Lugares húmedos y umbríos de montaña; suelos turbosos","catf":"botánica","subf":"pteridófito","base":"Selaginellaselaginoides"},{"id":"AMP-050","cat":"Botánica","sub":"Alga","name":"Ericaria / Cystoseira (alga parda mediterránea)","sci":"Ericaria amentacea (sin.: Cystoseira stricta, C. amentacea var. stricta)","fam":"Sargassaceae","freq":"media","key":"Talo pardo ramificado densamente con ramitas muy finas y vesículas esféricas diminutas","mnem":"El 'arbusto marino mediterráneo': forma pequeños bosques pardos en el mediterráneo limpio — si hay Ericaria, el agua es de gran calidad","etym":"Ericaria (lat.) = del género Erica (brezo): por el aspecto ramificado similar al brezo · amentacea = 'con amentos, en forma de cadena'","notes":"Nombre actualizado: Ericaria amentacea (nombre válido actual). Sinónimos ampliamente usados en la literatura: Cystoseira stricta y Cystoseira amentacea var. stricta — es importante conocer los tres nombres pues los exámenes pueden usar cualquiera. Bioindicadora de aguas muy limpias en el Mediterráneo; su desaparición indica contaminación. Diferencia de Fucus: Ericaria/Cystoseira es mediterránea; Fucus es atlántica.","hab":"Fondos rocosos mediterráneos intermareales e infralitorales; aguas muy limpias","catf":"botánica","subf":"alga","base":"Ericariaamentacea"},{"id":"AMP-051","cat":"Botánica","sub":"Alga","name":"Codium / Esponja verde","sci":"Codium tomentosum","fam":"Codiaceae","freq":"media","key":"Talo verde oscuro cilíndrico dicotómico (se divide en dos en cada bifurcación) muy regular","mnem":"El 'dedo verde oscuro del mar': cilíndrico, dicotómico y con textura de terciopelo verde oscuro — como un dedo esponjoso verde que se divide en dos en cada nudo","etym":"Codium (gr.) = kodion (piel de borrego): por la textura aterciopelada · tomentosum = 'con pelillos suaves'","notes":"La textura esponjosa-aterciopelada + la ramificación dicotómica cilíndrica son diagnósticas. Alga sifonal (el talo no tiene células individuales, es un sincitio multinucleado).","hab":"Zona intermareal e infralitoral rocosa; atlántica y mediterránea","catf":"botánica","subf":"alga","base":"Codiumtomentosum"},{"id":"AMP-052","cat":"Botánica","sub":"Alga","name":"Zostera / Hierba marina","sci":"Zostera marina","fam":"Zosteraceae","freq":"media","key":"Hojas muy largas y estrechas (acintadas, hasta 1 m) de color verde brillante, en cintas","mnem":"La 'hierba marina del Atlántico': como Posidonia pero en el Atlántico, con hojas mucho más estrechas y largas — la 'anguila vegetal' del Atlántico","etym":"Zostera (gr.) = zoster (cinturón, faja): 'la que lleva cinturones' — por las hojas acintadas","notes":"Zostera (Atlántico) vs. Posidonia (Mediterráneo) es un par de estudio importante. Ambas son angiospermas marinas (no algas) — con flores y frutos verdaderos. Zostera poliniza bajo el agua (hidrofilia).","hab":"Fondos arenosos y fangosos intermareales; costas atlánticas limpias","catf":"botánica","subf":"alga","base":"Zosteramarina"},{"id":"AMP-085","cat":"Botánica","sub":"Alga","name":"Codium bursa (bola de alga)","sci":"Codium bursa","fam":"Codiaceae","freq":"alta","key":"Forma perfectamente esférica o globosa (2-20 cm), verde oscura y de tacto esponjoso-aterciopelado — absolutamente unica entre algas ibericas","mnem":"La 'bola de billar marina verde oscura': ninguna otra alga ibérica tiene forma globular perfecta. Verde oscuro + esférica + esponjosa al tacto = Codium bursa sin ninguna duda","etym":"Codium (gr.) = kodion (piel de borrego): por la textura aterciopelada · bursa (lat.) = 'bolsa, monedero': por la forma globosa","notes":"Ha aparecido en convocatorias recientes. La forma esférica es diagnóstica absoluta — no hay otra alga ibérica con esa morfología. Alga sifonal: el talo no tiene células individuales separadas, es un sincitio multinucleado.","hab":"Fondos rocosos infralitorales mediterraneos y atlanticos; 2-30 m; aguas limpias","catf":"botánica","subf":"alga","base":"Codiumbursa"},{"id":"AMP-086","cat":"Botánica","sub":"Alga","name":"Fucus espiral","sci":"Fucus spiralis","fam":"Fucaceae","freq":"alta","key":"Talo plano y dicotomico SIN vesiculas aerifereas (aerocistes) — diferencia clave de F. vesiculosus que SI tiene vesiculas; margenes ligeramente enrollados; receptaculos apicales ovoides","mnem":"El 'fucus sin globitos': idéntico al Fucus vesiculosus pero sin las vesículas llenas de gas. Si la lámina parda es plana sin 'bollitos' ni burbujas, es F. spiralis — el de zona más alta","etym":"Fucus (lat.) = nombre romano del fucus · spiralis (lat.) = 'en espiral': por los márgenes ligeramente enrollados de los receptáculos","notes":"Par de estudio fundamental: F. vesiculosus (CON aerocistes/vesículas flotadoras) vs F. spiralis (SIN vesículas). Los aerocistes son vesículas llenas de gas que dan flotabilidad — si las ves, es vesiculosus; si no las ves, es spiralis. F. spiralis ocupa zona más alta del intermareal (mayor tolerancia a la desecación).","hab":"Zona intermareal alta rocosa; mas expuesta a desecacion que F. vesiculosus; costas atlanticas","catf":"botánica","subf":"alga","base":"Fucusspiralis"},{"id":"AMP-087","cat":"Botánica","sub":"Alga","name":"Dictyota dichotoma","sci":"Dictyota dichotoma","fam":"Dictyotaceae","freq":"alta","key":"Ramificacion dicotomica perfectamente regular (bifurcacion en Y constante cada 1-2 cm); talo aplanado de 1-2 mm de anchura; color verde-parduzco o azulado iridiscente bajo el agua","mnem":"El 'alga de las bifurcaciones perfectas en Y': cada vez que crece se divide en exactamente dos ramas iguales. El patrón de Y repetido a intervalos regulares es inconfundible — una obra de geometría fractal marina","etym":"Dictyota (gr.) = diktyon (red): por el aspecto reticulado del talo · dichotoma (gr.) = dicha (en dos) + temnein (cortar): 'dividida en dos' — por la ramificación dicotómica","notes":"La ramificación dicotómica estrictamente regular es el carácter diagnóstico absoluto. Diferencia de Padina (abanico con bandas concéntricas) y de Dilophus (talo más ancho). La iridiscencia azulada bajo el agua se debe a la difracción de la luz en la cutícula.","hab":"Fondos rocosos infralitorales mediterraneos y atlanticos; zonas bien iluminadas; 0-30 m","catf":"botánica","subf":"alga","base":"Dictyotadichotoma"},{"id":"AMP-088","cat":"Botánica","sub":"Alga","name":"Padina pavonica (cola de pavo real)","sci":"Padina pavonica","fam":"Dictyotaceae","freq":"muy_alta","key":"Forma de abanico o embudo con bandas concentricas visibles (lineas curvas paralelas al margen) — absolutamente diagnostico; color beige-blanquecino por calcificacion parcial de la superficie","mnem":"La 'alga-abanico con rayas de campo de tiro': la forma de abanico con bandas concéntricas es única en el mundo algal ibérico — como un abanico japonés con líneas dibujadas. El blanquecino se debe a calcificación","etym":"Padina (origen incierto) · pavonica (lat.) = 'de pavo real': por las bandas concéntricas iridiscentes que recuerdan el plumaje del pavo real en celo","notes":"La morfología en abanico con bandas concéntricas es absolutamente inconfundible — la única alga ibérica con esa forma. La calcificación parcial la hace más rígida y blanquecina que otras algas pardas. Muy frecuente en el Mediterráneo ibérico en fondos rocosos someros e iluminados.","hab":"Fondos rocosos infralitorales mediterraneos bien iluminados; pozas intermareales; 0-15 m","catf":"botánica","subf":"alga","base":"Padinapavonica"},{"id":"AMP-089","cat":"Botánica","sub":"Alga","name":"Lithophyllum incrustans (alga calcarea costrosa)","sci":"Lithophyllum incrustans","fam":"Corallinaceae","freq":"alta","key":"Forma de costra dura e incrustante sobre la roca — no tiene estructura tridimensional libre; color rosa-violaceo a gris-blanquecino; superficie lisa; durisima al tacto (calcificada)","mnem":"La 'capa de pintura rosa-violácea sobre la roca': las costras rosas o malvas que cubren las rocas intermareales como una pintura sólida son Lithophyllum. Durísimo al tacto — es calcita biológica pegada a la roca","etym":"Litho (gr.) = lithos (piedra) + phyllon (gr.) = hoja: 'hoja de piedra' · incrustans (lat.) = 'que forma costras, incrustante'","notes":"Importante distinguir de: (1) líquenes epilíticos (en litoral terrestre, zona supralitoral seca; más amarillos/grises/negros), (2) restos minerales (sin el color rosa-violáceo vivo). Lithophyllum es un alga roja calcificada (Corallinaceae) que vive en la zona intermareal media-baja. Su presencia indica aguas limpias y de buena calidad.","hab":"Rocas intermareales y sublitorales; costas mediterraneas y atlanticas limpias; zona media e infralitoral","catf":"botánica","subf":"alga","base":"Lithophyllumincrustans"},{"id":"AMP-090","cat":"Botánica","sub":"Alga","name":"Gelidium sesquipedale (agar-agar)","sci":"Gelidium sesquipedale","fam":"Gelidiaceae","freq":"muy_alta","key":"Talo erectamente ramificado con ramificacion pinnada regular (ramas laterales simetricas a ambos lados del eje); color rojo-vinoso oscuro; cilindrico a algo comprimido","mnem":"El 'alga del agar-agar rojo-vinosa con plumas simétricas': el eje principal con ramitas laterales simétricas como plumas + el color rojo oscuro son diagnósticos. La fuente del gel de los laboratorios de microbiología","etym":"Gelidium (gr.) = gelidus (frío, gelado): por la gelatina (agar) que produce · sesquipedale (lat.) = 'de pie y medio de largo': por su tamaño relativamente grande","notes":"MUY IMPORTANTE: Gelidium sesquipedale es la fuente principal del agar-agar (polisacárido E-406), usado en microbiología (medio de cultivo de bacterias), alimentación (gelificante vegetal) y farmacia. Es el alga roja más explotada comercialmente en la Península ibérica. La ramificación pinnada simétrica es el carácter diagnóstico más fácil de recordar.","hab":"Zona infralitoral rocosa atlantica; corrientes limpias y frias; 0-25 m","catf":"botánica","subf":"alga","base":"Gelidiumsesquipedale"},{"id":"AMP-091","cat":"Botánica","sub":"Alga","name":"Ceramium rubrum (alga filamentosa roja)","sci":"Ceramium rubrum","fam":"Ceramiaceae","freq":"alta","key":"Aspecto filamentoso muy ramificado; color rojizo o rojo-pardo vivo; apices de las ramas con forcipula caracteristica (puntas curvadas hacia adentro como pinzas) — diagnostico de genero","mnem":"El 'alga de los filamentos rojos con pinzas en las puntas': los filamentos rojizos muy ramificados terminan en ápices curvados hacia adentro como pinzas. Eso es diagnóstico de Ceramium entre todos los filamentos rojos ibéricos","etym":"Ceramium (gr.) = keramos (cerámica, alfarería): por los anillos de células corticales que dan aspecto de cerámica en sección · rubrum (lat.) = 'rojo': por el color","notes":"Los ápices forcipados (curvados hacia dentro como pinzas) son el carácter diagnóstico de género Ceramium — visible con lupa de campo. El color rojizo vivo + textura muy ramificada filamentosa son los rasgos macroscópicos. Muy frecuente como epífita sobre algas pardas grandes (fucáceas, laminariáceas).","hab":"Zona intermareal e infralitoral; epifita sobre otras algas y sustratos rocosos; costas atlanticas y mediterraneas","catf":"botánica","subf":"alga","base":"Ceramiumrubrum"},{"id":"AMP-053","cat":"Botánica","sub":"Briófito","name":"Fontinalis / Musgo acuático","sci":"Fontinalis antipyretica","fam":"Fontinalaceae","freq":"media","key":"Tallos muy largos (hasta 1 m) flotantes o adheridos a piedras bajo el agua","mnem":"La 'melena verde bajo el río': largos tallos que ondean en la corriente adheridos a las piedras — el único musgo que vive completamente sumergido en el agua más limpia","etym":"Fontinalis (lat.) = fons (fuente, manantial): 'el de las fuentes' · antipyretica = 'contra el fuego': se usaba para rellenar entre las paredes como aislante","notes":"El único musgo ibérico completamente acuático. Las hojas en 3 filas plegadas son diagnósticas. Bioindicador de agua muy limpia y fría — donde está Fontinalis, el río es de categoría A.","hab":"Ríos y arroyos de agua fría y limpia, pegado a piedras","catf":"botánica","subf":"briófito","base":"Fontinalisantipyretica"},{"id":"AMP-054","cat":"Botánica","sub":"Arbusto","name":"Cantueso","sci":"Lavandula stoechas","fam":"Lamiaceae","freq":"muy_alta","key":"Brácteas apicales grandes, erectas y de color púrpura vivo en el ápice de la espiga — absolutamente diagnósticas (parecen 'orejas' encima de la espiga compacta)","mnem":"La 'lavanda con orejas moradas': las brácteas púrpura que coronan la espiga como orejas de conejo son absolutamente únicas — ninguna otra lavanda las tiene tan grandes y llamativas","etym":"Lavandula (lat.) = lavare (lavar): usada para perfumar la ropa lavada · stoechas = de las Islas Stoechades (Islas de Hyères, Francia, donde fue descrita)","notes":"El cantueso es la Lavandula más frecuente en el matorral silíceo de Madrid y la más fácil de identificar por sus brácteas apicales moradas. Par obligatorio con L. angustifolia (espliego): cantueso = brácteas apicales grandes y vistosas; espliego = sin brácteas apicales llamativas. Indicadora de suelos silíceos ácidos.","hab":"Matorral silíceo mediterráneo; suelos ácidos y arenosos; jara-cantueso","catf":"botánica","subf":"arbusto","base":"Lavandulastoechas"},{"id":"AMP-055","cat":"Botánica","sub":"Arbusto","name":"Espliego / Lavanda","sci":"Lavandula angustifolia","fam":"Lamiaceae","freq":"alta","key":"Espiga floral alargada e interrumpida (con espacio entre flores inferiores y superiores); sin brácteas apicales llamativas","mnem":"La 'lavanda sin orejas con espiga interrumpida': la espiga tiene un 'cuello' visible que interrumpe las flores, y sin las brácteas vistosas del cantueso — más elegante y menos llamativa","etym":"Lavandula (lat.) = lavare (lavar) · angustifolia (lat.) = angustus (estrecho) + folium (hoja): 'de hojas estrechas'","notes":"Par de estudio imprescindible con L. stoechas (cantueso). La diferencia clave: espliego = espiga interrumpida + sin brácteas apicales vistosas; cantueso = espiga compacta + brácteas moradas apicales grandes. El espliego prefiere suelos calizos (calcícola), el cantueso suelos silíceos (silicícola) — dato evaluable.","hab":"Matorrales calcícolas; suelos básicos bien drenados de montaña media","catf":"botánica","subf":"arbusto","base":"Lavandulaangustifolia"},{"id":"AMP-056","cat":"Botánica","sub":"Arbusto","name":"Orégano","sci":"Origanum vulgare","fam":"Lamiaceae","freq":"alta","key":"Brácteas purpúreas o rojizas que envuelven los glomérulos florales — color llamativo incluso sin flores; aroma inequívoco a orégano al frotar","mnem":"El 'arbusto que huele a pizza': el aroma al frotar es absolutamente inconfundible — el mismo de la pizza y los platos mediterráneos. Las brácteas rojas-purpúreas dan color incluso sin flores abiertas","etym":"Origanum (gr.) = oros (montaña) + ganos (alegría, esplendor): 'alegría de la montaña' · vulgare (lat.) = 'común'","notes":"El orégano es una de las Lamiaceae aromáticas más fáciles de identificar por el olfato. Las brácteas coloreadas (purpúreas o rojizas) que rodean los glomérulos florales son el rasgo visual más diagnóstico. Muy frecuente en bordes de bosque y claros de matorral en toda la sierra de Madrid.","hab":"Bordes de bosque, claros de matorral, bordes de camino; suelos variados","catf":"botánica","subf":"arbusto","base":"Origanumvulgare"},{"id":"AMP-057","cat":"Botánica","sub":"Arbusto","name":"Ajedrea de montaña","sci":"Satureja montana","fam":"Lamiaceae","freq":"media","key":"Hojas lineares a lanceoladas, puntiagudas y coriáceas; flores blancas o rosado-liláceas en verticilos; más rígidas y punzantes que el tomillo","mnem":"La 'prima picante del tomillo': hojas más duras y puntiagudas que el tomillo, aroma más picante e intenso — si la aromática de matorral pinchan un poco las hojas y huele a pimienta, es ajedrea","etym":"Satureja (lat.) = nombre latino de la ajedrea · montana (lat.) = 'de montaña'","notes":"Par de estudio con el tomillo (Thymus vulgaris): ajedrea = hojas más grandes, puntiagudas y coriáceas, flores blancas o rosadas en verticilos, calcícola; tomillo = hojas diminutas con borde muy enrollado, flores rosas en espigas densas, indiferente. La ajedrea es más frecuente en suelos calizos de la sierra de Madrid.","hab":"Matorrales calcáreos secos; roquedos; suelos básicos bien drenados; 400-1800 m","catf":"botánica","subf":"arbusto","base":"Saturejamontana"},{"id":"AMP-058","cat":"Botánica","sub":"Arbusto","name":"Jara estepa","sci":"Cistus albidus","fam":"Cistaceae","freq":"alta","key":"Hojas cubiertas de tomento blanquecino denso por ambas caras (las más blancas del género); flores rosadas o purpúreas con 5 pétalos arrugados","mnem":"La 'jara blanca con flores rosas': las hojas tan blancas y afieltradas como si estuvieran cubiertas de lana + las flores rosas son el diagnóstico. La única jara con hojas blancas y flores de color","etym":"Cistus (gr.) = 'cesto' (por los frutos capsulares) · albidus (lat.) = 'blanquecino': por el tomento blanco de las hojas","notes":"Par de estudio imprescindible con Cistus ladanifer. C. albidus = hojas blancas-tomentosas + flores rosas/púrpuras; C. ladanifer = hojas verdes pegajosas (ládano) + flores blancas con mancha oscura. Cistaceae: 5 pétalos libres arrugados + numerosos estambres amarillos.","hab":"Matorral mediterráneo en suelos silíceos o algo básicos; claros de encinar","catf":"botánica","subf":"arbusto","base":"Cistusalbidus"},{"id":"AMP-059","cat":"Botánica","sub":"Arbusto","name":"Lentisco","sci":"Pistacia lentiscus","fam":"Anacardiaceae","freq":"muy_alta","key":"Hoja compuesta paripinnada con raquis ALADO entre los folíolos — diagnóstico único; olor resinoso intenso (almáciga) al frotar","mnem":"El 'arbusto con raquis alado': la hoja compuesta con las alitas entre los folíolos — como si los folíolos estuvieran pegados a un tallo con alas. Ningún otro arbusto ibérico tiene eso","etym":"Pistacia (gr.) = nombre griego del árbol · lentiscus (lat.) = nombre latino del lentisco","notes":"El raquis alado de la hoja compuesta es absolutamente diagnóstico y evaluable directamente. Diferencia de Pistacia terebinthus (cornicabra): terebinthus tiene 1 foliolo terminal (imparipinnada) y pierde las hojas en otoño; lentiscus es paripinnada y perennifolia.","hab":"Maquis, garriga y matorral mediterráneo denso; suelos calizos o silíceos","catf":"botánica","subf":"arbusto","base":"Pistacialentiscus"},{"id":"AMP-060","cat":"Botánica","sub":"Arbusto","name":"Aliaga / Aulaga espinosa","sci":"Genista scorpius","fam":"Fabaceae","freq":"alta","key":"Arbusto muy espinoso con espinas ramificadas (las ramas acaban en espina que se bifurca); flores amarillas papilionáceas pequeñas","mnem":"La 'maraña de espinas ramificadas amarillas': el arbusto más inhóspito del matorral mediterráneo seco — las espinas se ramifican formando una armadura impenetrable que solo el conejo atraviesa","etym":"Genista (lat.) = nombre latino de las retamas espinosas · scorpius (lat.) = 'escorpión': por las ramas espinosas que recuerdan la cola del escorpión","notes":"Muy frecuente en el sureste y zonas bajas de Madrid. Las espinas ramificadas (ramas transformadas en espinas que se bifurcan) distinguen a G. scorpius de Ulex (espinas simples) y de Calicotome (espinas simples terminales). Indicadora de matorrales degradados y tierras de labor abandonadas.","hab":"Matorrales degradados, baldíos, bordes de camino; indiferente al suelo","catf":"botánica","subf":"arbusto","base":"Genistascorpius"},{"id":"AMP-061","cat":"Botánica","sub":"Arbusto","name":"Coscoja","sci":"Quercus coccifera","fam":"Fagaceae","freq":"muy_alta","key":"Hojas coriáceas con dientes espinosos en TODO el margen; verde reluciente por ambas caras — diferencia clave de la encina (envés grisáceo)","mnem":"La 'encina que pincha por todas partes': mientras la encina solo pincha en el ápice de las hojas jóvenes, la coscoja pincha en todo el contorno siempre. Y brilla verde por las dos caras","etym":"Quercus (lat.) = 'roble, encina' · coccifera (lat.) = coccum (cochinilla del kermes) + ferre (llevar): 'la que lleva la cochinilla del kermes' — insecto que vive en ella y produce un tinte rojo","notes":"El diagnóstico diferencial encina (Q. ilex) / coscoja (Q. coccifera) es uno de los más evaluados: coscoja = pincha en todo el margen + brilla verde por ambas caras; encina = pinchos solo en hojas jóvenes + envés grisáceo. Las escamas de la cúpula de la bellota también son diagnósticas (rígidas y patentes en coscoja).","hab":"Matorrales calcáreos y coscojar; sustituye al encinar en suelos pobres degradados","catf":"botánica","subf":"arbusto","base":"Quercuscoccifera"},{"id":"AMP-062","cat":"Botánica","sub":"Arbusto","name":"Arto / Espino negro","sci":"Rhamnus lycioides","fam":"Rhamnaceae","freq":"media","key":"Arbusto muy intrincado con ramas terminadas en espina rígida; hojas muy pequeñas y estrechas (lineares); drupas negras pequeñas","mnem":"El 'espino con ramas de aguja': las ramas terminan en espina y las hojas son tan estrechas como agujas — el arbusto más espinoso e impenetrable de los suelos calizos áridos del sureste de Madrid","etym":"Rhamnus (gr.) = 'espino' · lycioides (gr.) = 'parecido a Lycium' (cambrón): por el aspecto espinoso e intrincado similar","notes":"Diferencia clave con Rhamnus alaternus (aladierno): aladierno = hojas ovales perennes brillantes, sin espinas terminales, ambientes más húmedos; lycioides = hojas estrechas, espinas terminales, ambientes áridos calcáreos. Muy frecuente en el sureste de Madrid (zona de yesos y calizas).","hab":"Matorrales calcáreos y gipsícolas áridos; suelos degradados calizos y yesosos","catf":"botánica","subf":"arbusto","base":"Rhamnuslycioides"},{"id":"AMP-063","cat":"Botánica","sub":"Arbusto","name":"Efedra / Uva de mar","sci":"Ephedra nebrodensis","fam":"Ephedraceae","freq":"alta","key":"Tallos articulados, verdes y estriados — aspecto de cola de caballo (Equisetum) pero leñosa; hojas reducidas a escamas en los nudos; frutos carnosos rojizos","mnem":"La 'cola de caballo leñosa': tallos articulados y estriados como los de Equisetum pero rígidos, leñosos y con frutillos rojos carnosos. La gimnosperma que parece un helecho articulado","etym":"Ephedra (gr.) = 'sobre el agua o la orilla' · nebrodensis = de los Nebrodi (montes de Sicilia, donde fue descrita)","notes":"La efedra es evaluable por su singularidad taxonómica: es una gimnosperma (con óvulos desnudos) pero no es una conífera. La efedrina (alcaloide vasoconstrictor) que contiene es el origen del fármaco epinefrina. Los tallos articulados + ausencia de hojas verdaderas son diagnósticos.","hab":"Matorrales calcáreos áridos, roquedos, suelos gipsícolas secos","catf":"botánica","subf":"arbusto","base":"Ephedranebrodensis"},{"id":"AMP-064","cat":"Botánica","sub":"Arbusto","name":"Brezo blanco / Brezo arborescente","sci":"Erica arborea","fam":"Ericaceae","freq":"alta","key":"Hojas lineares muy pequeñas (3-5 mm) en verticilos de 3-4; flores acampanadas blancas diminutas; puede alcanzar 5-6 m (el mayor brezo ibérico)","mnem":"El 'brezo blanco gigante': el único brezo que puede llegar a ser árbol pequeño, con flores blancas acampanadas diminutas en racimos. Si el brezo te supera en altura, es Erica arborea","etym":"Erica (gr.) = 'brezo' · arborea (lat.) = 'arborescente, en forma de árbol': el mayor de los brezos ibéricos","notes":"El mayor brezo ibérico — puede confundirse con otros brezos pero su tamaño (hasta 5 m), las flores blancas y las hojas en verticilos de 3-4 son diagnósticos. La madera de su raíz es la famosa 'brezo de pipa' para pipas de fumar (muy dura y refractaria al fuego). Indicadora de suelos silíceos ácidos.","hab":"Brezales silíceos, bosques de alcornoque y pino, taludes ácidos húmedos","catf":"botánica","subf":"arbusto","base":"Ericaarborea"},{"id":"AMP-065","cat":"Botánica","sub":"Arbusto","name":"Piorno serrano","sci":"Cytisus oromediterraneus","fam":"Fabaceae","freq":"muy_alta","key":"Arbusto muy denso y redondeado; flores amarillas muy abundantes que inundan de amarillo la sierra en mayo-junio; mata almohadillada adaptada al viento","mnem":"El 'arbusto dorado de la sierra': en mayo la sierra de Guadarrama se tiñe de amarillo intenso por el piorno — el arbusto que coloniza los pinares de altura y el piso oromediterráneo como nadie","etym":"Cytisus (gr.) = kytisos (nombre griego de un arbusto similar) · oromediterraneus (lat.) = oros (montaña) + mediterráneo: 'la retama de la montaña mediterránea'","notes":"El piorno serrano es la especie dominante del piso oromediterráneo de la sierra de Guadarrama. Su abundancia y el espectáculo visual en floración lo hacen muy reconocible. Diferencia de Cytisus scoparius (escoba): oromediterraneus = mata compacta redondeada, hojas pequeñas, alta montaña; scoparius = arbusto erecto, tallos pentagonales, zonas más bajas.","hab":"Pinar albar, brezal-piornalL, claros de pinar de altura; suelos silíceos ácidos","catf":"botánica","subf":"arbusto","base":"Cytisusoromediterraneus"},{"id":"AMP-066","cat":"Botánica","sub":"Arbusto","name":"Cambroño","sci":"Adenocarpus hispanicus","fam":"Fabaceae","freq":"alta","key":"Legumbre con glándulas negras densas en la superficie — absolutamente diagnóstico; flores amarillas papilionáceas en racimo con cáliz glanduloso","mnem":"El 'arbusto con vainas negras punteadas': las legumbres cubiertas de puntitos negros glandulosos son absolutamente únicas — si la vaina parece manchada de brea o salpicada de hollín, es cambroño","etym":"Adenocarpus (gr.) = adenos (glándula) + karpos (fruto): 'fruto glanduloso' — por las legumbres cubiertas de glándulas · hispanicus = 'español, ibérico'","notes":"Las glándulas negras en la legumbre son el carácter más diagnóstico y evaluable. Endemismo ibérico muy típico de la vertiente madrileña del Guadarrama. Diferencia de Cytisus oromediterraneus (piorno): cambroño = flores en racimo terminal + vaina glandulosa; piorno = arbusto compacto + sin glándulas en vaina.","hab":"Orlas de robledal y pinar; brezal-piornalL; suelos silíceos ácidos de montaña","catf":"botánica","subf":"arbusto","base":"Adenocarpushispanicus"},{"id":"AMP-067","cat":"Botánica","sub":"Árbol","name":"Enebro de la miera","sci":"Juniperus oxycedrus","fam":"Cupressaceae","freq":"muy_alta","key":"Agujas con DOS bandas blancas de estomas en el haz — diagnóstico vs. J. communis (solo 1 banda); bayas rojo-anaranjadas más grandes (8-12 mm)","mnem":"El 'enebro de las dos rayas blancas': cada aguja tiene DOS líneas blancas en el haz — cuenta las líneas: dos = oxycedrus; una = communis. Las bayas son más grandes y rojas que las del común","etym":"Juniperus (lat.) = 'enebro' · oxycedrus (gr.) = oxys (agudo, punzante) + kedros (cedro): 'cedro punzante'","notes":"El par J. communis / J. oxycedrus es uno de los más evaluados en coníferas. La clave es contar las bandas de estomas en el haz de la aguja: 1 banda = J. communis (enebro común); 2 bandas = J. oxycedrus (enebro miera). Las bayas también difieren: communis = azul-negro; oxycedrus = rojo-pardo, más grandes.","hab":"Matorral calcáreo y silíceo, pinares, garriga; más termófilo que J. communis","catf":"botánica","subf":"árbol","base":"Juniperusoxycedrus"},{"id":"AMP-068","cat":"Botánica","sub":"Árbol","name":"Taray / Tamariz","sci":"Tamarix gallica","fam":"Tamaricaceae","freq":"alta","key":"Hojas escuamiformes (pequeñas escamas aplicadas al tallo) — aspecto de pluma o cipresillo; flores rosadas muy pequeñas en espigas densas cilíndricas","mnem":"El 'árbol pluma de las orillas salinas': las hojas escamosas y las ramas plumosas le dan un aspecto único — como si estuviera cubierto de plumas verdes grisáceas. Las flores rosas en espiga son su firma","etym":"Tamarix (lat.) = nombre romano del taray, probablemente del río Tamaris (Tàmara, Palencia) · gallica = 'gálico, de la Galia'","notes":"Las hojas escuamiformes (reducidas a escamas, no láminas) son diagnósticas de la familia Tamaricaceae — ningún otro árbol o arbusto ibérico ribereño tiene esa estructura. Muy frecuente en ríos del sur y este de Madrid (Tajo, Jarama) y en ambientes salinos.","hab":"Orillas de ríos y arroyos, ramblas, zonas salinas o con suelos ricos en sales","catf":"botánica","subf":"árbol","base":"Tamarixgallica"},{"id":"AMP-069","cat":"Botánica","sub":"Arbusto","name":"Adelfa","sci":"Nerium oleander","fam":"Apocynaceae","freq":"muy_alta","key":"Hojas en verticilos de 3, lanceoladas muy alargadas, coriáceas y perennes; flores grandes rosas/blancas con corona de apéndices laciniados; látex muy tóxico","mnem":"La 'planta del río que mata': las hojas en verticilos de 3 como dedos apuntando + flores grandes rosas = adelfa. Todo en ella es veneno — ni quemarla (el humo es tóxico), ni usarla de palillo","etym":"Nerium (gr.) = nerion, nombre griego de la adelfa · oleander = nombre latino compuesto de Olea (olivo) + rhododendron (rododendro): 'el que parece olivo y rododendro'","notes":"La adelfa es evaluable tanto por su morfología (hojas verticiladas de 3 + flores con corona) como por su toxicidad (glucósidos cardiotóxicos: oleandrina). Muy plantada en medianeras de autopistas en Madrid. Diferencia de laurel: laurel = hojas alternas aromáticas; adelfa = hojas en verticilos de 3, no aromáticas y muy tóxicas.","hab":"Ramblas, barrancos y ríos mediterráneos estacionales; cultivada en jardines y medianeras","catf":"botánica","subf":"arbusto","base":"Neriumoleander"},{"id":"AMP-070","cat":"Botánica","sub":"Árbol","name":"Sauce ceniciento","sci":"Salix atrocinerea","fam":"Salicaceae","freq":"alta","key":"Hojas elípticas a obovadas, grisáceas y pubescentes en el envés (tomentoso-ceniciento); estípulas grandes y persistentes; el sauce más frecuente en ríos de Madrid","mnem":"El 'sauce gris de las orillas': el envés grisáceo-pubescente de las hojas + las estípulas grandes son la firma. Si el sauce de la orilla tiene las hojas con el reverso gris y peludo, es S. atrocinerea","etym":"Salix (lat.) = 'sauce' · atrocinerea (lat.) = ater (oscuro, negro) + cinerea (gris): 'gris oscuro': por el color grisáceo del envés foliar","notes":"El género Salix se identifica por: hojas alternas, estípulas frecuentes, amentos unisexuales, frutos con vilano. S. atrocinerea es el sauce más común en Madrid. Diferencia de Salix alba (sauce blanco): alba = hojas más estrechas y plateadas, porte más alto; atrocinerea = hojas más anchas y grisáceas, porte más arbustivo.","hab":"Orillas de ríos y arroyos, zonas encharcadas, cunetas húmedas","catf":"botánica","subf":"árbol","base":"Salixatrocinerea"},{"id":"AMP-071","cat":"Botánica","sub":"Árbol","name":"Sauce salvio / Mimbrera","sci":"Salix salviifolia","fam":"Salicaceae","freq":"alta","key":"Hojas lanceoladas a oblanceoladas, ondulado-dentadas, con tomento blanquecino por ambas caras (como las de la salvia); endemismo ibérico","mnem":"El 'sauce con hojas de salvia': hojas blanquecinas, onduladas y con tacto suave y tomentoso como las de la salvia — el sauce endémico ibérico de los ríos del Sistema Central","etym":"Salix (lat.) = 'sauce' · salviifolia (lat.) = Salvia (salvia) + folium (hoja): 'de hojas parecidas a la salvia' — por la textura y forma de las hojas","notes":"Endemismo ibérico — relevante para oposiciones de Madrid por ser la sauceda característica de los ríos del Sistema Central (Manzanares, Lozoya, Jarama alto). La forma ondulada de las hojas (como la salvia) es el carácter diagnóstico. Par de estudio con S. atrocinerea.","hab":"Orillas de ríos y arroyos de agua limpia y fría; preferencia por ríos de montaña","catf":"botánica","subf":"árbol","base":"Salixsalviifolia"},{"id":"AMP-072","cat":"Botánica","sub":"Herbácea","name":"Cardo / Alcachofa silvestre","sci":"Cynara cardunculus","fam":"Compositae (Asteraceae)","freq":"alta","key":"Capítulo enorme (5-15 cm) con brácteas en escudo terminadas en espina rígida; hojas muy grandes pinnadas con espinas; flores tubulares violeta-azu
