ladas","mnem":"El 'cardo gigante morado': el capítulo más grande de todos los cardos ibéricos con brácteas en escudo espinosas y flores azul-violeta. Es literalmente la alcachofa silvestre sin seleccionar","etym":"Cynara (gr.) = nombre griego de la alcachofa · cardunculus (lat.) = 'cardito, cardo pequeño' (relativo al cardo cultivado Cardunculus)","notes":"La alcachofa cultivada (Cynara scolymus) es la misma especie seleccionada para tener receptáculos carnosos. El capítulo enorme + brácteas espinosas rígidas + flores azul-violeta son diagnósticos. Muy frecuente en baldíos y bordes de camino de Madrid.","hab":"Baldíos, bordes de camino, suelos arcillosos nitrificados de zonas bajas de Madrid","catf":"botánica","subf":"herbácea","base":"Cynaracardunculus"},{"id":"AMP-073","cat":"Botánica","sub":"Herbácea","name":"Trébol rojo / Trébol pratense","sci":"Trifolium pratense","fam":"Fabaceae","freq":"alta","key":"Hojas trifoliadas con marca en V blanquecina en los folíolos (en los individuos típicos); capítulo floral ovoide rosado-purpúreo sin pedúnculo visible; estípulas con nervio prominente","mnem":"El 'trébol de los pompones rosas': el capítulo purpúreo-rosado sentado directamente entre dos hojas trifoliadas con V blanca es inconfundible — el trébol más fácil de identificar por su flor","etym":"Trifolium (lat.) = tri (tres) + folium (hoja): 'la de tres hojas' · pratense (lat.) = 'de los prados'","notes":"La V blanquecina en los folíolos + el capítulo purpúreo sentado son diagnósticos. Diferencia de T. repens (trébol blanco): repens = flores blancas + capítulo pedunculado + hojas sin V marcada. Trifolium es el género fijador de N₂ más importante de los prados ibéricos.","hab":"Prados húmedos, pastizales, bordes de camino; suelos frescos y ácidos o neutros","catf":"botánica","subf":"herbácea","base":"Trifoliumpratense"},{"id":"AMP-074","cat":"Botánica","sub":"Árbol","name":"Almendro","sci":"Prunus dulcis","fam":"Rosaceae","freq":"muy_alta","key":"Flores blancas o rosadas de 5 pétalos que aparecen en enero-febrero ANTES que las hojas (la primera floración del año en Madrid); fruto: drupa con mesocarpo coriáceo fibroso y endocarpo duro (el hueso) con semilla comestible","mnem":"El 'árbol de la primera nevada blanca en enero': florece completamente desnudo de hojas en pleno invierno — los almendros en flor son la primera señal de primavera. Flor antes que hoja = siempre almendro","etym":"Prunus (lat.) = 'ciruelo, árbol con hueso' · dulcis (lat.) = 'dulce': por el sabor dulce de la almendra (vs. P. amara, la amarga)","notes":"La floración invernal (sin hojas) + el fruto con mesocarpo seco y fibroso (no carnoso) son diagnósticos. Diferencia de cerezo y ciruelo: ambos también florecen pronto, pero el almendro florece más temprano (enero-febrero) y su fruto es completamente diferente (hueso rugoso, mesocarpo seco).","hab":"Cultivado en zonas cálidas y secas; naturalizado en laderas pedregosas y suelos calcáreos","catf":"botánica","subf":"árbol","base":"Prunusdulcis"},{"id":"AMP-075","cat":"Botánica","sub":"Arbusto","name":"Zarzamora","sci":"Rubus ulmifolius","fam":"Rosaceae","freq":"muy_alta","key":"Tallos arqueados con aguijones curvados (no espinas); hojas compuestas pinnadas con 5 folíolos; fruto: polidrupa negra brillante (la mora); envés de los folíolos blanquecino-tomentoso","mnem":"La 'zarza de las moras negras con envés blanco': los aguijones curvados como garfios + el envés blanco de los folíolos + las moras negras brillantes en otoño son el trío diagnóstico. Los aguijones curvados enganchan — no los ignores","etym":"Rubus (lat.) = 'zarza, zarzamora' · ulmifolius (lat.) = Ulmus (olmo) + folium (hoja): 'de hojas parecidas al olmo'","notes":"La especie de Rubus más frecuente en Madrid. Los aguijones curvados (hacia atrás, como garfios) vs. espinas rectas de Rosa + el envés blanquecino son diagnósticos. La mora (polidrupa = conjunto de drupeolas) es el fruto más reconocible. Muy frecuente en setos y orillas de río.","hab":"Setos, bordes de bosque, orillas de río, zonas húmedas y nitrificadas","catf":"botánica","subf":"arbusto","base":"Rubusulmifolius"},{"id":"AMP-076","cat":"Botánica","sub":"Herbácea","name":"Mostaza silvestre","sci":"Sinapis arvensis","fam":"Brassicaceae (Cruciferae)","freq":"alta","key":"4 pétalos amarillos en cruz (diagnóstico de familia Brassicaceae); silicua (fruto) cilíndrica y terminada en un pico largo rígido; hojas basales lirado-pinnadas con lóbulo terminal grande","mnem":"La 'flor de la cruz amarilla picante de los campos': 4 pétalos amarillos en cruz = Brassicaceae siempre. El pico largo y rígido de la silicua distingue a Sinapis del rábano silvestre (Raphanus, silicua esponjosa) y de la jaramago (Diplotaxis)","etym":"Sinapis (gr.) = 'mostaza' (nombre griego directo) · arvensis (lat.) = 'de los campos cultivados'","notes":"La familia Brassicaceae se identifica por: 4 pétalos en cruz + 6 estambres (4 largos + 2 cortos) + fruto en silicua o silícula. El pico rígido de Sinapis es su carácter de especie. Muy frecuente como mala hierba de cereales en el campo de Madrid.","hab":"Campos de cereales, barbechos, bordes de camino; suelos arcillosos removidos","catf":"botánica","subf":"herbácea","base":"Sinapisarvensis"},{"id":"AMP-077","cat":"Botánica","sub":"Herbácea","name":"Zurrón de pastor","sci":"Capsella bursa-pastoris","fam":"Brassicaceae (Cruciferae)","freq":"alta","key":"Fruto: silícula triangular-cordada (en forma de corazón o bolsita) — absolutamente diagnóstico; flores blancas muy pequeñas de 4 pétalos en cruz; roseta basal de hojas pinnadas","mnem":"La 'plantita con bolsitas de corazón': los frutitos triangulares en forma de corazón colgando del tallo como una colección de bolsitas son absolutamente únicos. Inconfundible en fructificación","etym":"Capsella (lat.) = 'cajita, cofrecillo' · bursa-pastoris (lat.) = bursa (bolsa) + pastor: 'bolsa del pastor' — por la forma del fruto que recuerda la alforja del pastor","notes":"La silícula triangular-cordada (en corazón) es diagnóstica al 100% para esta especie. Una de las plantas más cosmopolitas del mundo. Muy frecuente en jardines, campos y bordes de camino de Madrid durante todo el año.","hab":"Jardines, campos, bordes de camino, suelos removidos y nitrificados; ubiquista","catf":"botánica","subf":"herbácea","base":"Capsellabursa-pastoris"},{"id":"AMP-078","cat":"Botánica","sub":"Herbácea","name":"Cicuta mayor","sci":"Conium maculatum","fam":"Apiaceae (Umbelliferae)","freq":"alta","key":"Tallo hueco con manchas purpúreas irregulares — diagnóstico de especie dentro de Apiaceae; olor desagradable (a ratón) al frotar; umbela compuesta blanca; hojas 2-3 pinnadas muy divididas","mnem":"La 'apiácea de las manchas de sangre y olor a ratón': tallo con manchas púrpuras + olor desagradable = cicuta con seguridad. Sin manchas y con olor agradable = probablemente no es cicuta. Mató a Sócrates (399 a.C.)","etym":"Conium (gr.) = koneion (cicuta): nombre griego directo · maculatum (lat.) = 'manchado': por las manchas purpúreas del tallo","notes":"IMPORTANTE POR SEGURIDAD: la cicuta es la planta más peligrosa de los ambientes húmedos ibéricos. Los dos caracteres diagnósticos de seguridad: (1) manchas purpúreas en el tallo, (2) olor desagradable a ratón. La toxina (coniína) causa parálisis ascendente. Confusión mortal con: perejil, zanahoria silvestre, cicuta acuática.","hab":"Orillas de ríos y arroyos, cunetas húmedas, bordes de camino con humedad; suelos nitrificados","catf":"botánica","subf":"herbácea","base":"Coniummaculatum"},{"id":"AMP-079","cat":"Botánica","sub":"Árbol","name":"Quejigo","sci":"Quercus faginea","fam":"Fagaceae","freq":"muy_alta","key":"Hojas marcescentes (mueren pero no caen en otoño-invierno, quedan secas en el árbol); lobuladas con lóbulos redondeados; envés con pelillos estrellados; intermedio entre encina y roble","mnem":"El 'roble que guarda sus hojas muertas en invierno': las hojas secas color herrumbre que permanecen en el árbol todo el invierno son únicos entre los Quercus ibéricos. Árbol con hojas de muerto que no suelta","etym":"Quercus (lat.) = 'roble, encina' · faginea (lat.) = 'parecida al haya (Fagus)': por el aspecto de las hojas","notes":"La marcescencia (hojas muertas que no caen) es el carácter más diagnóstico y evaluable del quejigo. Es el Quercus más frecuente en las zonas calcáreas de Madrid (cuenca del Tajo). La serie de vegetación del quejigo es la formación climácica de los suelos básicos del sur de Madrid.","hab":"Bosques sobre suelos calcáreos y básicos del piso supramediterráneo de Madrid; quejigar","catf":"botánica","subf":"árbol","base":"Quercusfaginea"},{"id":"AMP-080","cat":"Botánica","sub":"Árbol","name":"Haya","sci":"Fagus sylvatica","fam":"Fagaceae","freq":"muy_alta","key":"Corteza lisa y gris uniforme (como piel de elefante) — diagnóstica en campo; hojas ovadas con margen ondulado-dentado y nervios marcados; yemas alargadas y puntiagudas de color canela","mnem":"El 'árbol de la piel de elefante y el bosque dorado de otoño': la corteza lisa gris uniforme es única entre árboles ibéricos de gran porte. En otoño el hayedo es el espectáculo cromático más bello de la Península","etym":"Fagus (lat.) = 'haya' (del gr. phagos, 'el que da fruto comestible') · sylvatica (lat.) = 'de los bosques'","notes":"La corteza lisa gris + las yemas puntiagudas son diagnósticos en invierno. El haya no es frecuente en la sierra de Madrid (solo en el norte de la Comunidad) pero es muy evaluable en el visu. El hayedo es el bosque caducifolio climácico europeo.","hab":"Laderas umbrías con suelos frescos y profundos; zonas con niebla frecuente y precipitación alta","catf":"botánica","subf":"árbol","base":"Fagussylvatica"},{"id":"AMP-081","cat":"Botánica","sub":"Árbol","name":"Pino carrasco","sci":"Pinus halepensis","fam":"Pinaceae","freq":"muy_alta","key":"Acículas cortas (6-10 cm) en parejas, finas y flexibles (se doblan sin romperse); piñas asimétricas que persisten varios años en el árbol abiertas; corteza gris-rojiza en ramas altas","mnem":"El 'pino de las piñas torcidas que no caen': las piñas asimétricas con el pedúnculo curvado que se quedan abiertas años en el árbol son diagnósticas. El pino gris del Mediterráneo seco que aguanta la sequía más severa","etym":"Pinus (lat.) = 'pino' · halepensis (lat.) = 'de Alep' (Aleppo, Siria, ciudad donde fue descrito)","notes":"El pino más frecuente en las repoblaciones del sur y este de Madrid. Las piñas persistentes y asimétricas son diagnósticas. Diferencia de P. pinea (piñonero): halepensis = piñas pequeñas asimétricas persistentes; pinea = piñas grandes globosas con piñones grandes. El más adaptado a la sequía.","hab":"Matorral mediterráneo árido, suelos calizos y yesosos, repoblaciones del sureste de Madrid","catf":"botánica","subf":"árbol","base":"Pinushalepensis"},{"id":"AMP-082","cat":"Botánica","sub":"Árbol","name":"Sabina albar","sci":"Juniperus thurifera","fam":"Cupressaceae","freq":"muy_alta","key":"Hojas en dos tipos: juveniles aciculares y adultas escuamiformes en el mismo árbol (dimorfia foliar); porte arbóreo con copa irregular; bayas pruinosas azul-grisáceas; olor a incienso al quemar","mnem":"La 'sabina con dos tipos de hojas y olor a incienso': en el mismo árbol hay agujas (hojas jóvenes) y escamas (hojas adultas) — ninguna otra cupresácea ibérica tiene esa mezcla. La más longeva de España","etym":"Juniperus (lat.) = 'enebro' · thurifera (lat.) = thus/thuris (incienso) + ferre (llevar): 'la que lleva incienso' — por el olor al quemar","notes":"La dimorfia foliar (agujas + escamas en el mismo árbol) es absolutamente diagnóstica. La sabina albar es el árbol más longevo de la flora española (ejemplares de >1000 años en Guadalajara). Diferencia de Juniperus communis: communis = solo hojas aciculares; thurifera = ambos tipos en el mismo árbol.","hab":"Sabinar continental en suelos yesosos y calizos, clima extremadamente continental","catf":"botánica","subf":"árbol","base":"Juniperusthurifera"},{"id":"AMP-083","cat":"Botánica","sub":"Árbol","name":"Cornicabra / Terebinto","sci":"Pistacia terebinthus","fam":"Anacardiaceae","freq":"muy_alta","key":"Hoja compuesta imparipinnada (con foliolo terminal) con 5-9 folíolos; olor a trementina al frotar (diagnóstico); caducifolio; produce agallas (cuernos de cabra) por Pemphigus — su nombre","mnem":"El 'árbol que huele a trementina con cuernos de cabra': el olor intenso a trementina al frotar la hoja es inconfundible. Las agallas rojas en forma de cuerno (que le dan el nombre 'cornicabra') son un espectáculo en primavera","etym":"Pistacia (gr.) = nombre griego del árbol · terebinthus (gr.) = nombre griego del terebinto, fuente de la trementina","notes":"Par de estudio imprescindible con P. lentiscus: lentiscus = paripinnada (sin foliolo terminal) + perennifolia + sin olor tan intenso; terebinthus = imparipinnada (con foliolo terminal) + caducifolio + olor a trementina. Las agallas 'cuernos de cabra' son muy llamativas y evaluables.","hab":"Matorral mediterráneo calcícola, coscojar, garriga; suelos calizos bien drenados","catf":"botánica","subf":"árbol","base":"Pistaciaterebinthus"},{"id":"AMP-084","cat":"Botánica","sub":"Herbácea","name":"Cebada de ratón / Cola de rata","sci":"Hordeum murinum","fam":"Gramineae (Poaceae)","freq":"alta","key":"Espiga densa con aristas largas (2-5 cm) que se dispersan en abanico; espiguillas laterales con largas aristas; muy frecuente en suelos pisoteados, bordes de camino y suelos nitrogenados","mnem":"La 'gramínea con bigotes de gato que se pega a la ropa': las aristas largas se enganchan en la ropa y el pelo de los perros con gran facilidad — la gramínea más pegajosa y abundante de los suelos pisoteados de Madrid","etym":"Hordeum (lat.) = 'cebada' · murinum (lat.) = 'de los ratones': 'la cebada de los ratones' — grano pequeño como para ratones","notes":"Una de las gramíneas más frecuentes en Madrid (aceras, parques, bordes de camino). Las aristas largas que se pegan a la ropa son diagnósticas. La espiga densa con aristas en abanico la distingue fácilmente de otras gramíneas de la ciudad.","hab":"Suelos pisoteados, bordes de camino, aceras, suelos nitrificados y removidos; ubiquista urbana","catf":"botánica","subf":"herbácea","base":"Hordeummurinum"},{"id":"BRY-001","cat":"Botánica","sub":"Briófito","name":"Esfagno común (musgo de turbera)","sci":"Sphagnum palustre","fam":"Sphagnaceae","freq":"media","key":"Ramas en fascículos: 2-3 erectas + 2-3 colgantes por nudo; color verde-amarillento pálido; células hialinas absorbentes sin rizoides","mnem":"La 'esponja vegetal verde-amarillenta': la más común de los esfagnos ibéricos — si lo estrujas suelta agua a chorros. El color verde-amarillento pálido + las turberas bajas son su hábitat típico","etym":"Sphagnum (gr.) = 'musgo de turbera' · palustre (lat.) = 'de los pantanos, palustre'","notes":"S. palustre es la especie de Sphagnum más frecuente en turberas bajas del norte ibérico. El género Sphagnum puede aparecer sin especificar especie en el visu — lo diagnóstico es el género: ramas en fascículos + ausencia de rizoides + células hialinas absorbentes. Diferenciar de S. capillifolium (ver BRY-006): palustre = verde-amarillento, turberas bajas; capillifolium = rojo-rosado, turberas ácidas de montaña.","hab":"Turberas bajas, brezales húmedos, bordes de laguna; suelos ácidos saturados","catf":"botánica","subf":"briófito","base":"Sphagnumpalustre"},{"id":"BRY-006","cat":"Botánica","sub":"Briófito","name":"Esfagno rojo (musgo de turbera ácida)","sci":"Sphagnum capillifolium","fam":"Sphagnaceae","freq":"media","key":"Color rojo-rosado a pardo-rojizo intenso — el único esfagno claramente rojo; hojas de rama muy pequeñas; capitulum compacto","mnem":"El 'esfagno rojo de montaña': el único musgo de turbera claramente rojo o rosado — imposible confundirlo con S. palustre (verde-amarillento). Rojo = capillifolium, turbera ácida de montaña","etym":"Sphagnum (gr.) = 'musgo de turbera' · capillifolium (lat.) = capillus (cabello) + folium (hoja): 'de hojas como cabellos'","notes":"Par de estudio obligatorio con S. palustre. La diferencia clave: COLOR — palustre = verde-amarillento (turberas bajas); capillifolium = rojo-rosado (turberas ácidas de montaña). En oposiciones puede aparecer cualquier Sphagnum; identificar el color es suficiente para llegar a especie. Las turberas ombrotróficas (solo lluvia, sin aporte de agua subterránea) son el hábitat exclusivo de capillifolium.","hab":"Turberas ombrotróficas ácidas de alta montaña; brezales con Calluna; 800-2000 m","catf":"botánica","subf":"briófito","base":"Sphagnumcapillifolium"},{"id":"AMP-092","cat":"Botánica","sub":"Briófito","name":"Porella (hepática foliosa)","sci":"Porella platyphylla","fam":"Porellaceae","freq":"media","key":"Hojas dispuestas en DOS filas laterales perfectamente visibles + una fila ventral de anfigastrios (hojas pequeñas en la cara inferior del tallo) — diagnóstico del grupo; aspecto de musgo pero con hojas en filas, no en espiral","mnem":"La 'hepática con tres filas de hojitas': DOS filas de hojas grandes a los lados + una fila de hojitas pequeñas en el vientre. Parece un musgo pero sus hojas están perfectamente alineadas en filas — no en espiral","etym":"Porella (lat.) = por (a través) + ella (diminutivo): por los poros de su talo ancestral · platyphylla (gr.) = platys (ancho) + phyllon (hoja): de hojas anchas","notes":"Las hepáticas foliosas se distinguen de los musgos por: (1) hojas en 2-3 filas simétricas (no en espiral), (2) hojas sin nervio central (los musgos tienen costa/nervio), (3) anfigastrios (hojitas ventrales). Porella es la más frecuente en troncos y rocas húmedas de la sierra de Madrid","hab":"Troncos húmedos de árboles (especialmente hayas, robles y arces), rocas umbrías en bosques frescos de la sierra","catf":"botánica","subf":"briófito","base":"Porellaplatyphylla"},{"id":"BRY-003","cat":"Botánica","sub":"Briófito","name":"Polytrichum (musgo erizo / musgo de los bosques)","sci":"Polytrichum commune","fam":"Polytrichaceae","freq":"alta","key":"Tallos erectos rígidos de 5-30 cm (los más altos entre los musgos) que crecen en penachos verticales densos; hojas lanceoladas con lámelas fotosintéticas longitudinales en el haz (visibles con lupa); esporofito apical con urna cuadrangular y caliptra pelosa","mnem":"El 'musgo erizo de los bosques': los tallos erectos rígidos formando un penacho verde oscuro + la caliptra pelosa dorada del esporofito son diagnósticos. El musgo acrocárpico más grande e inconfundible de los bosques ácidos","etym":"Polytrichum (gr.) = polys (muchos) + thrix (pelo, trichos): por la caliptra densamente cubierta de pelos · commune (lat.) = común, general","notes":"Polytrichum commune es el musgo acrocárpico más frecuente y llamativo de los bosques ácidos de la sierra de Madrid. ACROCÁRPICO = el esporofito sale en el ÁPICE del tallo principal (acro = extremo, karpos = fruto). Diferencia de Sphagnum: Polytrichum tiene tallos rígidos erectos sin fascículos de ramas; Sphagnum tiene ramas en fascículos y es cespitoso esponjoso","hab":"Turberas y brezales ácidos, bordes de arroyos de montaña, suelos silíceos húmedos y umbríos","catf":"botánica","subf":"briófito","base":"Polytrichumcommune"},{"id":"BRY-004","cat":"Botánica","sub":"Briófito","name":"Funaria hygrometrica (musgo de las hogueras)","sci":"Funaria hygrometrica","fam":"Funariaceae","freq":"alta","key":"Tallos cortos (1-3 cm) en cojines densos de color verde brillante a amarillo-verdoso; esporofito MUY llamativo: seta larga curvada rematada en una urna piriforme (en forma de pera) asimétrica y abombada — diagnóstico absoluto; aparece masivamente en suelos quemados y perturbados","mnem":"El 'musgo de las cenizas con sombrillitas de pera torcida': los esporofitos con su seta curvada y la urna en forma de pera asimétrica son absolutamente inconfundibles — como pequeñas farolas colgantes. El musgo que aparece el primero después de un incendio","etym":"Funaria (lat.) = funis (cuerda): por la seta del esporofito que se retuerce como una cuerda al secarse · hygrometrica (gr.) = hygros (húmedo) + metron (medida): porque la seta se tuerce y destuerze con la humedad (higroscópica)","notes":"Funaria hygrometrica es el musgo más común en suelos quemados, cenizas, macetas y suelos removidos. La seta higroscópica (se tuerce con el cambio de humedad) es el carácter más evaluable: el musgo se comporta como un higrómetro natural. ACROCÁRPICO: esporofito en el ápice del tallo","hab":"Suelos quemados (post-incendio), cenizas, macetas, suelos removidos y perturbados; pionero en suelos desnudos","catf":"botánica","subf":"briófito","base":"Funariahygrometrica"},{"id":"BRY-005","cat":"Botánica","sub":"Briófito","name":"Hypnum cupressiforme (musgo de tapiz)","sci":"Hypnum cupressiforme","fam":"Hypnaceae","freq":"alta","key":"Tallos rastreros que forman tapices horizontales densos; hojas fuertemente curvadas hacia un lado (falcadas o curvado-secundas) — diagnóstico del género; color verde-amarillento brillante; esporofitos en posición LATERAL (no apical)","mnem":"El 'musgo-alfombra de hojas curvadas a un lado': el tapiz rastrero verde-amarillento con las hojitas curvadas todas hacia el mismo lado como un peinado es diagnóstico. El musgo pleurocárpico más frecuente de Europa — está en casi todos los bosques de la sierra de Madrid","etym":"Hypnum (gr.) = hypnos (sueño, Hipnos el dios del sueño): según Plinio se usaba como somnífero · cupressiforme (lat.) = cupressus (ciprés) + forma: de aspecto similar al ciprés — por las ramitas curvadas","notes":"PLEUROCÁRPICO = el esporofito sale de los LATERALES del tallo (pleuros = lado, karpos = fruto), no del ápice. Hypnum forma tapices horizontales (no penachos verticales como los acrocárpicos). Las hojas falcadas (curvadas hacia un lado) son el carácter diagnóstico del género. El musgo pleurocárpico más frecuente e importante de identificar","hab":"Suelos forestales ácidos, troncos y ramas, rocas umbrías; bosques de coníferas y caducifolios de la sierra","catf":"botánica","subf":"briófito","base":"Hypnumcupressiforme"},{"id":"BRY-002","cat":"Botánica","sub":"Briófito","name":"Marchantia (hepática talosa)","sci":"Marchantia polymorpha","fam":"Marchantiaceae","freq":"media","key":"Talo laminar plano verde brillante sin diferenciación en tallo-hoja","mnem":"La 'hoja de hígado verde con paragüitas': talo plano, con paragüitas en la superficie","etym":"Marchantia = del botánico francés N. Marchant · polymorpha = 'de muchas formas'","notes":"Clásica de prácticas de laboratorio. Los receptáculos con 'paragüitas' estrellados (♀) y planos (♂) son diagnósticos.","hab":"Suelos húmedos, orillas de ríos, zonas umbrias","catf":"botánica","subf":"briófito","base":"Marchantiapolymorpha"},{"id":"FRO-001","cat":"Botánica","sub":"Árbol","name":"Plátano de sombra","sci":"Platanus × hispanica","fam":"Platanaceae","freq":"muy_alta","key":"Corteza que se pela en placas irregulares dejando manchas verde-amarillas, grises y beige (camuflaje de soldado)","mnem":"El 'árbol camuflaje': corteza que se cae en parches como piel de serpiente, dejando un jaspeado de colores. Inconfundible","etym":"Platanus (gr.) = 'plátano' (de platys = ancho, por las hojas grandes) · hispanica = 'hispánico'","notes":"CONFIRMADO: Platanaceae en etiquetas de exámenes reales. Es el árbol de alineación más común en Madrid. Corteza característica absolutamente diagnóstica. Las bolas espinosas en invierno son muy llamativas.","hab":"Avenidas, parques, riberas; cultivado","catf":"botánica","subf":"árbol","base":"Platanus×"},{"id":"FRO-002","cat":"Botánica","sub":"Árbol","name":"Roble melojo (rebollo)","sci":"Quercus pyrenaica","fam":"Fagaceae","freq":"muy_alta","key":"Hojas grandes (10-20 cm) con lóbulos profundos y base auriculada; peciolo corto","mnem":"El 'roble de pelusilla': si pasas el dedo por el envés de la hoja y notas una felpa grisácea, es melojo","etym":"Quercus (lat.) = 'roble' · pyrenaica = 'de los Pirineos'","notes":"El roble característico de la Sierra de Guadarrama y del contexto de Madrid. El envés tomentoso es el rasgo más usado en examen.","hab":"Pisos supramediterráneo y mesomediterráneo, suelos silíceos","catf":"botánica","subf":"árbol","base":"Quercuspyrenaica"},{"id":"FRO-003","cat":"Botánica","sub":"Árbol","name":"Encina","sci":"Quercus ilex","fam":"Fagaceae","freq":"muy_alta","key":"Hojas coriáceas perennes, ovales a lanceoladas; haz verde oscuro brillante; envés blanquecino-tomentoso","mnem":"La 'reina verde oscura': la copa más oscura del paisaje mediterráneo, con hojitas duras de doble cara (verde/gris)","etym":"Quercus = 'roble/encina' · ilex = nombre latino de la encina","notes":"La especie más importante del bosque mediterráneo ibérico. Imprescindible.","hab":"Bosque mediterráneo; clima seco, suelos variados","catf":"botánica","subf":"árbol","base":"Quercusilex"},{"id":"FRO-004","cat":"Botánica","sub":"Árbol","name":"Alcornoque","sci":"Quercus suber","fam":"Fagaceae","freq":"alta","key":"Corteza suberosa (corcho) muy gruesa, corchosa y profundamente fisurada: ÚNICA entre árboles ibéricos","mnem":"El 'árbol de los tapones': corteza de corcho tan gruesa que parece una esponja. Imposible confundirlo","etym":"Quercus = 'roble' · suber (lat.) = 'corcho'","notes":"La corteza suberosa es absolutamente diagnóstica. La muestra de corteza extraída (roja-naranja) también puede aparecer.","hab":"Clima mediterráneo atlántico; suelos silíceos","catf":"botánica","subf":"árbol","base":"Quercussuber"},{"id":"FRO-005","cat":"Botánica","sub":"Árbol","name":"Fresno de hoja estrecha","sci":"Fraxinus angustifolia","fam":"Oleaceae","freq":"alta","key":"Hojas compuestas pinnadas con 7-13 folíolos lanceolados y dentados","mnem":"El 'árbol de las llaves colgantes': las sámaras parecen llavecitas que quedan colgando en invierno","etym":"Fraxinus (lat.) = 'fresno' · angustifolia = 'de hojas estrechas'","notes":"Árbol de ribera típico de Madrid (río Manzanares, Jarama). Las sámaras en invierno son el rasgo más visual.","hab":"Bosques de ribera mediterráneos; suelos frescos junto a ríos","catf":"botánica","subf":"árbol","base":"Fraxinusangustifolia"},{"id":"FRO-006","cat":"Botánica","sub":"Árbol","name":"Olivo","sci":"Olea europaea","fam":"Oleaceae","freq":"alta","key":"Hojas lanceoladas perennes: haz verde grisáceo, envés blanquecino-plateado","mnem":"El 'árbol de Atenea': hojas bicolores (verde/plata) + aceitunas globosas. Inconfundible","etym":"Olea (lat.) = 'aceite, olivo' · europaea = 'europeo'","notes":"Las hojas bicolores (verde/plata) + fruto globoso son rasgos inmediatos. Familia Oleaceae — mismo familia que el fresno.","hab":"Clima mediterráneo seco; suelos bien drenados","catf":"botánica","subf":"árbol","base":"Oleaeuropaea"},{"id":"FRO-007","cat":"Botánica","sub":"Árbol","name":"Abedul","sci":"Betula pendula","fam":"Betulaceae","freq":"media","key":"Corteza blanca-plateada que se exfolia en láminas horizontales finas — absolutamente única","mnem":"El 'árbol de papel blanco': corteza blanca que se despega en tiras. Si la corteza parece papel de impresora, abedul","etym":"Betula (lat.) = 'abedul' (raíz celta) · pendula = 'péndula': por las ramas colgantes","notes":"La corteza blanca exfoliante es diagnóstica al 100%. Presente en zonas de montaña húmeda.","hab":"Bosques atlánticos, bordes de hayedos, montaña húmeda","catf":"botánica","subf":"árbol","base":"Betulapendula"},{"id":"FRO-008","cat":"Botánica","sub":"Arbusto","name":"Madroño","sci":"Arbutus unedo","fam":"Ericaceae","freq":"muy_alta","key":"Hojas coriáceas perennes, ovales, de margen dentado; verde oscuro brillante","mnem":"El 'árbol del oso de Madrid': símbolo del escudo de Madrid. Las bolitas rojas granulosas son inconfundibles","etym":"Arbutus (lat.) = 'madroño' · unedo = 'se come de uno en uno'","notes":"El símbolo de Madrid hace su aparición especialmente probable. Las bolitas rojas son diagnósticas.","hab":"Bosque mediterráneo; suelos ácidos o silíceos","catf":"botánica","subf":"arbusto","base":"Arbutusunedo"},{"id":"FRO-009","cat":"Botánica","sub":"Arbusto","name":"Jara pringosa","sci":"Cistus ladanifer","fam":"Cistaceae","freq":"alta","key":"Hojas pegajosas con resina brillante (ladan) — inconfundible al tacto y olfato","mnem":"La 'jara del pegamento': tócala y te quedan los dedos brillantes de resina. Las flores con 'ojo' marrón son únicas","etym":"Cistus (gr.) = 'canastillo' · ladanifer = 'que produce ladan (resina)'","notes":"Muy frecuente en muestras de matorral madrileño. El tacto pegajoso + flores con mancha son los rasgos más usados.","hab":"Matorral mediterráneo silíceo; post-incendio","catf":"botánica","subf":"arbusto","base":"Cistusladanifer"},{"id":"FRO-010","cat":"Botánica","sub":"Arbusto","name":"Romero","sci":"Salvia rosmarinus","fam":"Lamiaceae","freq":"alta","key":"Hojas muy estrechas (aciculares), enrolladas en el margen, verdes por arriba y blancas por abajo","mnem":"La 'aguja aromática azul': hojas tan estrechas como agujas de pino pero blandas, y aroma inconfundible","etym":"Rosmarinus (lat.) = ros (rocío) + marinus (marino): 'rocío del mar'","notes":"Planta aromática muy típica del matorral madrileño. El aroma al frotar es el rasgo más rápido.","hab":"Matorral mediterráneo seco","catf":"botánica","subf":"arbusto","base":"Salviarosmarinus"},{"id":"FRO-011","cat":"Botánica","sub":"Arbusto","name":"Tomillo","sci":"Thymus vulgaris","fam":"Lamiaceae","freq":"alta","key":"Subarbusto enano (<30 cm) con hojas diminutas ovales a lanceoladas, bordes enrollados","mnem":"El 'enano aromático': el arbusto más pequeño del matorral, casi una alfombra, con ese olor a pizzería","etym":"Thymus (gr.) = 'tomillo'","notes":"Junto a la jara y el romero, el arbusto más probable del matorral madrileño.","hab":"Matorral seco soleado; suelos pobres","catf":"botánica","subf":"arbusto","base":"Thymusvulgaris"},{"id":"FRO-012","cat":"Botánica","sub":"Arbusto","name":"Retama","sci":"Retama sphaerocarpa","fam":"Fabaceae","freq":"alta","key":"Tallos verdes clorofílicos (sin apenas hojas): realiza la fotosíntesis con los tallos","mnem":"El 'arbusto sin hojas': ramas verdes con florecitas amarillas — si el arbusto parece sólo palos verdes con flores, es retama","etym":"Retama (árabe 'ratam') · sphaerocarpa = 'fruto esférico'","notes":"Muy abundante en la Meseta madrileña. Los tallos verdes sin hojas son el rasgo más llamativo.","hab":"Matorral continental; suelos pobres y secos","catf":"botánica","subf":"arbusto","base":"Retamasphaerocarpa"},{"id":"GIM-001","cat":"Botánica","sub":"Árbol","name":"Pino silvestre","sci":"Pinus sylvestris","fam":"Pinaceae","freq":"muy_alta","key":"Corteza superior del tronco rojiza-anaranjada característica (única entre pinos ibéricos)","mnem":"El único pino con la 'corona del tronco roja': la corteza anaranjada en la parte alta es inconfundible","etym":"Pinus (lat.) = 'pino' · sylvestris = 'de los bosques, silvestre'","notes":"El pino de la Sierra de Guadarrama. Imprescindible. Identificar por: corteza roja arriba + acículas en par cortas.","hab":"Montaña media (900-2000 m), suelos silíceos","catf":"botánica","subf":"árbol","base":"Pinussylvestris"},{"id":"GIM-002","cat":"Botánica","sub":"Árbol","name":"Pino piñonero","sci":"Pinus pinea","fam":"Pinaceae","freq":"alta","key":"Copa en paraguas perfectamente plana y redondeada — silueta inconfundible","mnem":"El 'pino sombrilla': copa plana como un parasol y piña redonda grande con piñones gordos","etym":"Pinus = 'pino' · pinea = 'relativo a la piña'","notes":"La silueta en paraguas y la piña grande son diagnósticos inmediatos.","hab":"Dunas costeras, llanos arenosos, repoblaciones","catf":"botánica","subf":"árbol","base":"Pinuspinea"},{"id":"GIM-003","cat":"Botánica","sub":"Árbol","name":"Enebro común","sci":"Juniperus communis","fam":"Cupressaceae","freq":"alta","key":"Hojas aciculares en verticilos de 3, con banda glauca blanca en el haz","mnem":"El 'tío de la ginebra': sus bayas azules dan sabor a la ginebra (gin). Acículas en tríos que pinchan","etym":"Juniperus (lat.) = 'enebro' · communis = 'común, extendido'","notes":"Diferencia clave vs. sabina: enebro = hojas aciculares que pinchan; sabina = hojas escuamiformes que no pinchan.","hab":"Montaña, matorrales secos, bordes de bosque","catf":"botánica","subf":"árbol","base":"Juniperuscommunis"},{"id":"GIM-004","cat":"Botánica","sub":"Árbol","name":"Tejo","sci":"Taxus baccata","fam":"Taxaceae","freq":"muy_alta","key":"Hojas lineares planas (no aciculares) dispuestas en dos filas en el ramillo — diagnósticas","mnem":"El 'árbol de la muerte con bola roja': hojas en dos filas como una cremallera y la 'baya' roja es la única parte no mortal","etym":"Taxus (lat.) = 'tejo' · baccata (lat.) = 'con bayas': por el arilo rojo","notes":"CONFIRMADO como especie frecuente en Madrid. Las hojas planas en dos filas + arilo rojo son absolutamente diagnósticos. Taxaceae es una familia confirmada en etiquetas de exámenes reales.","hab":"Bosques umbríos de montaña; suelos variados; relicto glacial","catf":"botánica","subf":"árbol","base":"Taxusbaccata"},{"id":"GIM-005","cat":"Botánica","sub":"Árbol","name":"Ginkgo","sci":"Ginkgo biloba","fam":"Ginkgoaceae","freq":"alta","key":"Hojas en abanico bífidas (con escotadura en el centro) absolutamente únicas en el reino vegetal","mnem":"La 'hoja de abanico partido': absolutamente única en toda la flora — no hay otra hoja así en ninguna planta del planeta","etym":"Ginkgo (japonés) = 'yin guo' (fruto de plata) · biloba (lat.) = 'de dos lóbulos'","notes":"CONFIRMADO: Ginkgoaceae en etiquetas de exámenes reales. Muy plantado en jardines y parques de Madrid — alta probabilidad de aparecer como muestra. La hoja en abanico bífida es diagnóstica al 100%.","hab":"Cultivado en parques y jardines (extinto en estado silvestre excepto China)","catf":"botánica","subf":"árbol","base":"Ginkgobiloba"},{"id":"GRA-001","cat":"Botánica","sub":"Herbácea","name":"Esparto","sci":"Stipa tenacissima","fam":"Gramineae (Poaceae)","freq":"alta","key":"Mata en forma de mata densa (cojín) con hojas muy largas, estrechas y enrolladas (filiformes)","mnem":"El 'puercoespín vegetal': mata de pelo largo y seco, con aristas que se clavan en el calcetín al pasear por el campo","etym":"Stipa (gr.) = 'estopa, fibra' · tenacissima = 'muy resistente, tenaz'","notes":"CONFIRMADO: Gramineae en etiquetas de exámenes reales de Madrid. Las aristas largas y retorcidas + las hojas filiformes son diagnósticos de Stipa.","hab":"Espartales en Meseta sur; suelos secos calcáreos o yesíferos","catf":"botánica","subf":"herbácea","base":"Stipatenacissima"},{"id":"GRA-002","cat":"Botánica","sub":"Herbácea","name":"Poa / Bromo (gramínea de prado)","sci":"Brachypodium retusum","fam":"Gramineae (Poaceae)","freq":"media","key":"Espiguillas en espiga unilateral compacta con aristas cortas; hojas enrolladas en la base","mnem":"La 'espiga compacta del matorral': espigas robustas con aristas cortas, muy rígida al tacto — la gramínea del matorral degradado","etym":"Brachypodium (gr.) = brachys (corto) + pous (pie): espiguillas con pedúnculos cortos · retusum = 'obtuso, romo'","notes":"Gramineae confirmada en exámenes. Importante saber identificar la estructura de la espiguilla: glumas, lemas, aristas, lígula.","hab":"Matorrales degradados mediterráneos; suelos calcáreos y silíceos","catf":"botánica","subf":"herbácea","base":"Brachypodiumretusum"},{"id":"GRA-003","cat":"Botánica","sub":"Herbácea","name":"Carrizo","sci":"Phragmites australis","fam":"Gramineae (Poaceae)","freq":"alta","key":"La gramínea más alta de Europa: hasta 4 m","mnem":"El 'bambú de los ríos': la más alta de las gramíneas europeas, con su panoja plumosa parda que ondea al viento junto al agua","etym":"Phragmites (gr.) = 'el que crece en setos/cercas': planta que forma barreras · australis = 'del sur'","notes":"Gramineae confirmada. La panoja plumosa en otoño-invierno es absolutamente diagnóstica. Muy presente en orillas del Manzanares y Jarama.","hab":"Bordes de ríos, lagunas, zonas encharcadas","catf":"botánica","subf":"herbácea","base":"Phragmitesaustralis"},{"id":"GRA-004","cat":"Botánica","sub":"Herbácea","name":"Trigo / Cereal (familia)","sci":"Triticum aestivum","fam":"Gramineae (Poaceae)","freq":"media","key":"Espiga cilíndrica con espiguillas alternas bien visibles en dos filas; aristas largas o cortas según variedad","mnem":"La 'espiga de pan': la espiga más famosa del mundo — la estructura de espiguillas alternas es la morfología tipo de las Gramineae","etym":"Triticum (lat.) = 'trigo' (de terere = machacar) · aestivum = 'de verano'","notes":"Importante para estudiar la morfología floral de Gramineae: glumas, lemas, paleas, lódiculas, aristas. El trigo es el ejemplo tipo.","hab":"Cultivo extensivo en Meseta","catf":"botánica","subf":"herbácea","base":"Triticumaestivum"},{"id":"GRA-005","cat":"Botánica","sub":"Herbácea","name":"Avena silvestre","sci":"Avena fatua","fam":"Gramineae (Poaceae)","freq":"media","key":"Panícula abierta y laxa (no espiga compacta) con espiguillas colgantes","mnem":"La 'avena que baila': las aristas geniculadas se estiran y se encogen con la humedad, haciendo que las espiguillas se muevan solas","etym":"Avena (lat.) = 'avena' · fatua = 'insípida, sin valor': la 'avena boba'","notes":"Gramineae arvense muy frecuente. Las aristas geniculadas (con codo) y la panícula laxa la distinguen del trigo.","hab":"Campos de cereal, barbechos, bordes de camino","catf":"botánica","subf":"herbácea","base":"Avenafatua"},{"id":"HER-001","cat":"Botánica","sub":"Herbácea","name":"Dedalera (digital)","sci":"Digitalis purpurea","fam":"Plantaginaceae (antes Scrophulariaceae)","freq":"alta","key":"Flores tubulares acampanadas grandes, púrpura-rosadas con manchas internas blancas en la cara inferior","mnem":"La 'campanita morada con manchas': racimo de dedales morados manchados — la planta que salva corazones pero en exceso los para","etym":"Digitalis (lat.) = 'del dedo': flores con forma de dedal · purpurea = 'púrpura'","notes":"CONFIRMADO: Scrophulariaceae (=Plantaginaceae actual) en etiquetas de exámenes reales de Madrid. Muy reconocible e importante toxicológicamente.","hab":"Bordes de robledales, zonas umbrías, claros de bosque atlántico","catf":"botánica","subf":"herbácea","base":"Digitalispurpurea"},{"id":"HER-002","cat":"Botánica","sub":"Herbácea","name":"Gordolobo","sci":"Verbascum thapsus","fam":"Scrophulariaceae","freq":"media","key":"Planta muy alta (hasta 2 m) con un solo tallo erecto cubierto de una densa lanilla blanca","mnem":"El 'candelabro de terciopelo blanco': planta alta y derecha como una vela, completamente cubierta de pelo blanco suave al tacto","etym":"Verbascum (lat.) = 'gordolobo' (origen incierto) · thapsus = de Thasos (isla griega)","notes":"Scrophulariaceae confirmada en exámenes. El indumento lanoso blanco + espiga alta son diagnósticos muy visuales.","hab":"Bordes de caminos, suelos removidos, cunetas","catf":"botánica","subf":"herbácea","base":"Verbascumthapsus"},{"id":"HER-003","cat":"Botánica","sub":"Herbácea","name":"Girasol","sci":"Helianthus annuus","fam":"Compositae (Asteraceae)","freq":"alta","key":"Capítulo muy grande (hasta 30 cm) con lígulas amarillas periféricas y flósculos centrales marrón-oscuro","mnem":"La 'flor del sol': el capítulo enorme amarillo que sigue al sol — la cabeza de flores más grande y reconocible de la flora ibérica","etym":"Helianthus (gr.) = helios (sol) + anthos (flor) · annuus = 'anual'","notes":"CONFIRMADO: Compositae en etiquetas de exámenes reales. Importante saber que el 'pétalo' es una lígula y el centro son flósculos — estructura típica de Compositae.","hab":"Cultivada; suelos bien drenados y cálidos","catf":"botánica","subf":"herbácea","base":"Helianthusannuus"},{"id":"HER-004","cat":"Botánica","sub":"Herbácea","name":"Margarita común","sci":"Bellis perennis","fam":"Compositae (Asteraceae)","freq":"media","key":"Capítulo pequeño (1-3 cm) con lígulas blancas (a veces rosadas en el dorso) y disco central amarillo","mnem":"La 'margarita del parque': la florecita blanca y amarilla más pequeña y común de los prados","etym":"Bellis (lat.) = 'bella' · perennis = 'perenne': la 'hierba bella que no muere'","notes":"Compositae confirmada. La estructura de capítulo (lígulas + flósculos) es clave para identificar la familia.","hab":"Prados, césped, zonas pisoteadas","catf":"botánica","subf":"herbácea","base":"Bellisperennis"},{"id":"HER-005","cat":"Botánica","sub":"Herbácea","name":"Artemisa","sci":"Artemisia vulgaris","fam":"Compositae (Asteraceae)","freq":"media","key":"Hojas muy divididas (pinnatipartidas), verde oscuro en el haz, blanquecinas y lanosas en el envés","mnem":"La 'planta blanca por debajo con olor a campo': envés blanco + aroma intenso al frotar. La que hace el vermú","etym":"Artemisia = de Artemisia II de Caria o de Artemisa (diosa griega) · vulgaris = 'común'","notes":"Muy abundante en Madrid. El envés blanco + aroma a alcanfor + capítulos minúsculos son diagnósticos.","hab":"Bordes de camino, suelos removidos, riberas","catf":"botánica","subf":"herbácea","base":"Artemisiavulgaris"},{"id":"HER-006","cat":"Botánica","sub":"Herbácea","name":"Amapola","sci":"Papaver rhoeas","fam":"Papaveraceae","freq":"alta","key":"4 pétalos rojos delicados, arrugados antes de abrirse; mancha negra-purpúrea en la base","mnem":"La 'flor de papel rojo': pétalos como papel crepé rojo arrugado. El látex blanco al romper el tallo es inconfundible","etym":"Papaver (lat.) = 'adormidera' · rhoeas = nombre griego de la amapola","notes":"Planta arvense muy común. Puede aparecer en contexto de flora segetal o como herbácea de prado.","hab":"Campos de cultivo, márgenes de caminos","catf":"botánica","subf":"herbácea","base":"Papaverrhoeas"},{"id":"HER-007","cat":"Botánica","sub":"Herbácea","name":"Clemátide (vilorta)","sci":"Clematis vitalba","fam":"Ranunculaceae","freq":"alta","key":"Frutos en cabezuela con estilos plumosos largos plateados muy vistosos (como cabellera blanca)","mnem":"El 'anciano del seto': en invierno las cabezuelas con pelos plateados hacen que el seto parezca cubierto de canas","etym":"Clematis (gr.) = 'clematita' (planta trepadora) · vitalba (lat.) = 'vid blanca'","notes":"CONFIRMADO: Ranunculaceae en etiquetas de exámenes reales. Los frutos plumosos en invierno son absolutamente diagnósticos y muy fáciles de incluir en muestras.","hab":"Bordes de bosque, setos, márgenes de ríos; suelos calcáreos","catf":"botánica","subf":"herbácea","base":"Clematisvitalba"},{"id":"HER-008","cat":"Botánica","sub":"Herbácea","name":"Ranúnculo (botón de oro)","sci":"Ranunculus bulbosus","fam":"Ranunculaceae","freq":"media","key":"5 pétalos amarillos brillantes (lustrosos) muy llamativos; reflexos hacia atrás al florecer (sépalos reflexos = clave)","mnem":"El 'botón amarillo brillante de prado': pétalos lacados en amarillo intenso con sépalos que se doblan hacia abajo","etym":"Ranunculus (lat.) = 'ranita' (de rana): plantas que crecen en lugares húmedos como las ranas · bulbosus = 'con bulbo'","notes":"Ranunculaceae confirmada. Los sépalos reflexos (doblados hacia abajo) son la clave diagnóstica de esta especie vs. otras del género.","hab":"Prados, bordes de camino, zonas soleadas algo húmedas","catf":"botánica","subf":"herbácea","base":"Ranunculusbulbosus"},{"id":"HER-009","cat":"Botánica","sub":"Herbácea","name":"Estramonio (manzana del diablo)","sci":"Datura stramonium","fam":"Solanaceae","freq":"media","key":"Flores tubulares grandes (6-10 cm), blancas o violáceas, con 5 dientes apicales","mnem":"La 'manzana del diablo con pinchos': el fruto erizado como un erizo de mar con espinas + flores de trompeta blanca = estramonio","etym":"Datura (árabe 'tattura') · stramonium (lat.) = nombre medieval de la planta","notes":"CONFIRMADO: Solanaceae en etiquetas de exámenes. El fruto espinoso es absolutamente diagnóstico. Muy frecuente en cunetas de Madrid.","hab":"Bordes de camino, suelos removidos, escombros; planta nitrófila","catf":"botánica","subf":"herbácea","base":"Daturastramonium"},{"id":"HER-010","cat":"Botánica","sub":"Herbácea","name":"Espadaña / Enea","sci":"Typha latifolia","fam":"Typhaceae","freq":"alta","key":"Inflorescencia en maza cilíndrica parda y esponjosa — absolutamente inconfundible","mnem":"La 'salchicha de los pantanos': la maza cilíndrica parda parece una salchicha — absolutamente única","etym":"Typha (gr.) = 'marisma' · latifolia = 'de hoja ancha'","notes":"La inflorescencia en maza es diagnóstica al 100%. Muy usada en exámenes de flora hidrófita.","hab":"Orillas de ríos, lagunas, zonas encharcadas","catf":"botánica","subf":"herbácea","base":"Typhalatifolia"},{"id":"PTR-001","cat":"Botánica","sub":"Pteridófito","name":"Helecho común","sci":"Pteridium aquilinum","fam":"Dennstaedtiaceae","freq":"muy_alta","key":"Fronde grande (hasta 2 m), triangular en conjunto, 2-3 veces pinnada","mnem":"El 'helecho del águila': corta el rizoma y verás la forma de un águila bicéfala. El más abundante y grande","etym":"Pteridium (gr.) = 'pequeño helecho' · aquilinum = 'del águila': el corte del rizoma muestra una 'A'","notes":"El más frecuente en muestras de campo madrileño. El truco del rizoma en 'A' es un clásico de examen.","hab":"Bordes de robledales, brezales, suelos silíceos ácidos","catf":"botánica","subf":"pteridófito","base":"Pteridiumaquilinum"},{"id":"PTR-002","cat":"Botánica","sub":"Pteridófito","name":"Lengua de ciervo","sci":"Asplenium scolopendrium","fam":"Aspleniaceae","freq":"muy_alta","key":"Fronde simple, entera, lanceolada (sin dividir en pínnulas) — absolutamente atípica entre helechos","mnem":"El 'helecho sin cortes': única fronde entera y brillante entre los helechos — si el helecho no tiene cortes ni divisiones, es lengua de ciervo","etym":"Asplenium (gr.) = 'sin bazo' (medicinal antiguo) · scolopendrium = 'ciempiés' (por los soros paralelos)","notes":"CONFIRMADO: Aspleniaceae en etiquetas de exámenes reales de Madrid. La fronde simple (sin dividir) es absolutamente única entre los helechos — diagnóstica al 100%.","hab":"Grietas de muros, paredes umbrías y húmedas, bosques calcáreos","catf":"botánica","subf":"pteridófito","base":"Aspleniumscolopendrium"},{"id":"PTR-003","cat":"Botánica","sub":"Pteridófito","name":"Culantrillo de pozo","sci":"Adiantum capillus-veneris","fam":"Pteridaceae","freq":"media","key":"Pínnulas en forma de abanico o cuña, con el soro en el margen superior doblado hacia abajo","mnem":"El 'cabello de Venus': pecíolo negro brillante como el cabello, pínnulas en abanico, crece donde el agua chorrea","etym":"Adiantum (gr.) = 'que no se moja' · capillus-veneris = 'cabello de Venus'","notes":"Reconocible por el pecíolo negro brillante y las pínnulas en abanico. Hábitat muy concreto (paredones húmedos).","hab":"Grietas de rocas húmedas, fuentes, paredones rezumantes calcáreos","catf":"botánica","subf":"pteridófito","base":"Adiantumcapillus-veneris"},{"id":"PTR-004","cat":"Botánica","sub":"Pteridófito","name":"Doradilla (ruda de muros)","sci":"Asplenium ceterach","fam":"Aspleniaceae","freq":"alta","key":"Fronde pinnada pequeña con pinnulas redondeadas; envés completamente cubierto de escamas oxidadas (color herrumbre)","mnem":"El 'helecho de herrumbre': el envés anaranjado-oxidado de escamas es inconfundible — parece una hoja cubierta de óxido","etym":"Asplenium = ver anterior · ceterach = nombre árabe-medieval del helecho","notes":"Aspleniaceae confirmada. El envés anaranjado-escamoso es absolutamente diagnóstico. Muy frecuente en muros y roquedos de Madrid.","hab":"Grietas de muros y roquedos soleados y secos; calcícola","catf":"botánica","subf":"pteridófito","base":"Aspleniumceterach"},{"id":"PTR-005","cat":"Botánica","sub":"Pteridófito","name":"Cola de caballo","sci":"Equisetum arvense","fam":"Equisetaceae","freq":"alta","key":"Tallos articulados con nudos y verticilos de ramitas en cada nudo (estructura única en plantas vasculares)","mnem":"El 'árbol de Navidad articulado': verticilos de ramas en cada nudo — pero articulado y herbáceo","etym":"Equisetum (lat.) = equus (caballo) + saeta (crin) · arvense = 'de los campos'","notes":"Los nudos articulados con verticilos son absolutamente diagnósticos. Las muestras de cola de caballo son muy frecuentes.","hab":"Campos cultivados, bordes de ríos, suelos húmedos","catf":"botánica","subf":"pteridófito","base":"Equisetumarvense"},{"id":"ASC-001","cat":"Hongos","sub":"Hongo ascomiceto","name":"Colmenilla / Morchela","sci":"Morchella esculenta","fam":"Morchellaceae","freq":"alta","key":"Sombrero con alvéolos poligonales (como un panal de abejas) de color pardo-ocre","mnem":"El 'hongo panal de abeja': el sombrero es una esponja de agujeros poligonales marrones — y completamente hueco por dentro","etym":"Morchella = del alemán 'morchel' (nombre del hongo) · esculenta = 'comestible'","notes":"Los alvéolos del sombrero (como un panal) son absolutamente diagnósticos. Ascomiceto — a diferencia de todos los anteriores (Basidiomicetos). TÓXICA EN CRUDO.","hab":"Bordes de camino, suelos removidos, huertos, zonas riparias; primavera","catf":"hongos","subf":"hongo ascomiceto","base":"Morchellaesculenta"},{"id":"ASC-002","cat":"Hongos","sub":"Hongo ascomiceto","name":"Trufa negra","sci":"Tuber melanosporum","fam":"Tuberaceae","freq":"media","key":"Cuerpo subterráneo (hipogeo): nunca emerge al exterior","mnem":"El 'diamante negro de la cocina': hongo subterráneo negro y verrugoso con interior marmoreado — el más caro del mundo por kg","etym":"Tuber (lat.) = 'bulto, tubérculo' · melanosporum (gr.) = 'de esporas negras'","notes":"Importante como ejemplo de ascomiceto hipogeo y de simbiosis micorrícica con encina y roble. La textura interior marmolada es diagnóstica.","hab":"Suelos calcáreos bajo encinas (Quercus ilex) y robles; micorrícico","catf":"hongos","subf":"hongo ascomiceto","base":"Tubermelanosporum"},{"id":"ASC-003","cat":"Hongos","sub":"Hongo ascomiceto","name":"Corneta del diablo / Copa escarlata","sci":"Sarcoscypha coccinea","fam":"Sarcoscyphaceae","freq":"media","key":"Copa o platillo rojo escarlata brillante — absolutamente inconfundible","mnem":"La 'cuchara roja de invierno': pequeña taza rojo brillante en el suelo del bosque en pleno invierno — imposible confundirla","etym":"Sarcoscypha (gr.) = sarcos (carne) + skyphos (copa): 'copa de carne' · coccinea = 'escarlata'","notes":"El rojo escarlata en pleno invierno es absolutamente diagnóstico. Muy llamativa visualmente — fácil de incluir como muestra.","hab":"Sobre ramas caídas enterradas en bosques húmedos; invierno-primavera","catf":"hongos","subf":"hongo ascomiceto","base":"Sarcoscyphacoccinea"},{"id":"ASC-004","cat":"Hongos","sub":"Hongo ascomiceto","name":"Ergot / Cornezuelo del centeno","sci":"Claviceps purpurea","fam":"Clavicipitaceae","freq":"media","key":"Esclerocios negros y alargados en forma de cuerno que reemplazan los granos del cereal","mnem":"Los 'cuernos negros del cereal': granos negros y curvados entre los granos normales del centeno — parece que la espiga tiene garras","etym":"Claviceps (lat.) = clava (clavo) + ceps (cabeza): 'cabeza en clavo' · purpurea = 'púrpura'","notes":"Importante toxicológica e históricamente (ergotismo = fuego de San Antonio). Fuente del LSD. El esclerocio negro en espiga de cereal es diagnóstico.","hab":"Parásito de espigas de Secale cereale, Triticum y otras gramíneas","catf":"hongos","subf":"hongo ascomiceto","base":"Clavicepspurpurea"},{"id":"ASC-005","cat":"Hongos","sub":"Hongo ascomiceto","name":"Xylaria / Dedo de hombre muerto","sci":"Xylaria polymorpha","fam":"Xylariaceae","freq":"baja","key":"Cuerpo cilíndrico negro, erecto, con textura leñosa; forma de dedo o maza","mnem":"Los 'dedos negros del muerto': mazas negras y leñosas que salen del suelo junto a tocones — como si los muertos extendieran los dedos","etym":"Xylaria (gr.) = xylon (madera): 'del bosque' · polymorpha = 'de muchas formas'","notes":"La forma de dedo negro y leñoso es absolutamente diagnóstica. Visualmente muy llamativo y fácil de recordar.","hab":"Tocones y madera muerta de frondosas; saprotrófico","catf":"hongos","subf":"hongo ascomiceto","base":"Xylariapolymorpha"},{"id":"ASC-006","cat":"Hongos","sub":"Hongo ascomiceto","name":"Liquenomyces / hongo liquenizado","sci":"Diplocystis wrightii (Diplocystidiaceae)","fam":"Diplocystidiaceae","freq":"media","key":"Ascomiceto liquenizado: vive en simbiosis con alga (no confundir con seta)","mnem":"Ver bloque de líquenes para la identificación visual","etym":"Diplocystidiaceae = familia de ascomicetos liquenizados","notes":"CONFIRMADO: Diplocystidiaceae en etiquetas de exámenes reales de Madrid. Estudiar junto al bloque de líquenes.","hab":"Variable según especie; ver líquenes","catf":"hongos","subf":"hongo ascomiceto","base":"Diplocystiswrightii"},{"id":"HON-001","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Níscalo / Rovellón","sci":"Lactarius deliciosus","fam":"Russulaceae","freq":"alta","key":"Látex (leche) anaranjado-zanahoria que exuda al cortar la carne — diagnóstico definitivo","mnem":"El 'hongo de la leche naranja': córtalo y sangra naranja. El único con látex color zanahoria","etym":"Lactarius (lat.) = 'que produce leche' · deliciosus = 'delicioso'","notes":"Muy reconocible por el látex anaranjado. Muy frecuente en pinares del Sistema Central (Guadarrama). Especie muy valorada culinariamente en España.","hab":"Pinares (micorrícico con Pinus sylvestris y P. pinaster); 900-1800 m","catf":"hongos","subf":"hongo basidiomiceto","base":"Lactariusdeliciosus"},{"id":"HON-002","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Amanita de los césares / Oronja","sci":"Amanita caesarea","fam":"Amanitaceae","freq":"alta","key":"Sombrero rojo-anaranjado brillante; láminas amarillas (no blancas como en otras Amanitas)","mnem":"El 'hongo de los emperadores': rojo-naranja brillante con láminas AMARILLAS (no blancas) y volva blanca. El amarillo de las láminas es la clave vs. otras Amanitas","etym":"Amanita = del gr. 'Amanon' (montaña donde crecía) · caesarea = 'de los césares': el hongo de los emperadores romanos","notes":"Par de estudio OBLIGATORIO con Amanita phalloides (letal). Diferencia crítica: A. caesarea = láminas AMARILLAS; A. phalloides = láminas BLANCAS.","hab":"Bosques mixtos mediterráneos; encinar, robledal; suelos ácidos","catf":"hongos","subf":"hongo basidiomiceto","base":"Amanitacaesarea"},{"id":"HON-003","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Oronja verde / Cicuta verde","sci":"Amanita phalloides","fam":"Amanitaceae","freq":"muy_alta","key":"Sombrero verde-oliva a gris-verdoso; láminas BLANCAS — diferencia clave de la caesarea","mnem":"La 'asesina verde': verde-oliva con láminas BLANCAS y volva blanca — la seta más mortal del mundo. El color verde + láminas blancas = peligro máximo","etym":"Amanita = ver anterior · phalloides = 'con forma de falo': por la forma del pie saliendo de la volva","notes":"LA seta más importante del visu por su mortalidad. Saber: amatoxinas (inhiben ARN polimerasa II); síntomas tardíos (6-24h); fallo hepático; sin antídoto. Par obligatorio con A. caesarea.","hab":"Bosques caducifolios y mixtos; robledales, encinares, hayedos","catf":"hongos","subf":"hongo basidiomiceto","base":"Amanitaphalloides"},{"id":"HON-004","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Falsa oronja / Amanita muscaria","sci":"Amanita muscaria","fam":"Amanitaceae","freq":"alta","key":"Sombrero rojo brillante con verrugas blancas (restos del velo universal)","mnem":"La 'seta de los gnomos de cuento': roja con puntos blancos — la seta del Sombrero de Mascle. Inconfundible. Tóxica (no mortal)","etym":"Amanita = ver anterior · muscaria = 'de las moscas': se usaba como insecticida (disuelto en leche)","notes":"La más reconocida visualmente. Importante distinguirla de A. caesarea (esta tiene láminas AMARILLAS). Tóxica por muscimol/ácido iboténico — alucinógena, no mortal en dosis normales.","hab":"Bosques de coníferas y abedules; micorrícico","catf":"hongos","subf":"hongo basidiomiceto","base":"Amanitamuscaria"},{"id":"HON-005","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Boleto comestible / Porcini","sci":"Boletus edulis","fam":"Boletaceae","freq":"alta","key":"Himenio en tubos y poros (no en láminas): cara inferior esponjosa de color blanco a verde-amarillento","mnem":"El 'hongo con esponja debajo': en vez de láminas tiene tubitos como una esponja — si la cara inferior es una esponja blanca-amarilla, es boleto","etym":"Boletus (lat.) = 'hongo' (de bôlos gr. = bola) · edulis = 'comestible'","notes":"Muy importante identificar el himenio tubular (no laminar) como carácter diagnóstico del orden Boletales. El retículo en el pie es muy específico de B. edulis.","hab":"Bosques mixtos de coníferas y caducifolias; micorrícico","catf":"hongos","subf":"hongo basidiomiceto","base":"Boletusedulis"},{"id":"HON-006","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Trompeta de los muertos","sci":"Craterellus cornucopioides","fam":"Cantharellaceae","freq":"media","key":"Forma de trompeta o embudo hueco de color negro o gris muy oscuro","mnem":"La 'trompeta del infierno': embudo negro vacío que desaparece entre la hojarasca oscura — si ves nada negro con forma de trompeta, es este","etym":"Craterellus (lat.) = 'pequeña crátera (vaso)' · cornucopioides = 'con forma de cuerno de la abundancia'","notes":"Visualmente muy llamativo por su forma y color negro. Fácil de identificar como muestra. Comestible excelente.","hab":"Bosques caducifolios (hayedos, robledales); suelos ricos en humus","catf":"hongos","subf":"hongo basidiomiceto","base":"Craterelluscornucopioides"},{"id":"HON-007","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Pie azul / Lepista","sci":"Lepista nuda","fam":"Tricholomataceae","freq":"media","key":"Sombrero violeta-lila a pardo-lila; láminas violetas o lila (único hongo con láminas tan violetas)","mnem":"El 'hongo morado': láminas violetas — el único hongo con ese color tan intenso. Si ves algo lila en el bosque, es pie azul","etym":"Lepista (lat.) = 'copa grande' · nuda = 'desnuda': sin velo parcial","notes":"El color violeta es absolutamente diagnóstico. Puede confundirse con Cortinarius (también violeta) pero Cortinarius tiene cortina (velo en tela de araña).","hab":"Bordes de bosque, jardines, compostaje; saprotrófico","catf":"hongos","subf":"hongo basidiomiceto","base":"Lepistanuda"},{"id":"HON-008","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Champiñón silvestre","sci":"Agaricus campestris","fam":"Agaricaceae","freq":"alta","key":"Láminas rosadas en jóvenes → pardo-oscuras al madurar (las esporas son marrones)","mnem":"El 'champiñón del campo': láminas rosadas que se vuelven marrones + sin volva en la base. El wild mushroom de los prados","etym":"Agaricus (gr.) = 'de Agaria' (región del Sármata) · campestris = 'de los campos'","notes":"Par de estudio con Agaricus xanthodermus (tóxico). Diferencia: A. campestris no vira a amarillo al frotar la base; A. xanthodermus sí (reacción xantoderma) y huele a tinta.","hab":"Prados, pastizales, bordes de camino; suelos ricos en materia orgánica","catf":"hongos","subf":"hongo basidiomiceto","base":"Agaricuscampestris"},{"id":"HON-009","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Seta de cardo","sci":"Pleurotus eryngii","fam":"Pleurotaceae","freq":"media","key":"Sombrero pardo-grisáceo; láminas muy decurrentes (bajan por el pie)","mnem":"La 'seta del cardo': el pie lateral + las láminas que bajan por el pie + su asociación con el cardo la hacen única","etym":"Pleurotus (gr.) = 'de lado' (pie lateral) · eryngii = 'del Eryngium (cardo)'","notes":"El pie excéntrico y las láminas decurrentes son diagnósticos. La asociación con Eryngium (cardo) es una relación muy evaluable.","hab":"Prados y estepas; asociada a raíces de Eryngium campestre","catf":"hongos","subf":"hongo basidiomiceto","base":"Pleurotuseryngii"},{"id":"HON-010","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Cuesco de lobo / Pedo de lobo","sci":"Calvatia gigantea","fam":"Agaricaceae","freq":"media","key":"Forma globosa perfecta, blanca cuando joven; puede alcanzar 50-80 cm de diámetro","mnem":"La 'pelota de fútbol del bosque': esfera blanca enorme en el suelo — si hay una bola blanca sin láminas ni pie, es cuesco de lobo gigante","etym":"Calvatia (lat.) = 'cabeza calva' · gigantea = 'gigante'","notes":"La forma globosa sin láminas ni pie es absolutamente diagnóstica. Los Gasteromycetes (hongos gasteroides) tienen forma muy diferente a los agaricales.","hab":"Prados, bordes de bosque, áreas abiertas","catf":"hongos","subf":"hongo basidiomiceto","base":"Calvatiagigantea"},{"id":"HON-011","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Seta de ostra / Gírgola","sci":"Pleurotus ostreatus","fam":"Pleurotaceae","freq":"media","key":"Sombrero en forma de concha de ostra, gris-azulado a pardo","mnem":"La 'seta-repisa del árbol': crece en abanicos solapados sobre el tronco como un tejado de tejas — sombrero gris en forma de concha","etym":"Pleurotus = 'de lado' · ostreatus = 'en forma de ostra': por la forma del sombrero","notes":"El crecimiento en repisas sobre madera muerta es absolutamente diagnóstico. Muy cultivada comercialmente.","hab":"Troncos muertos de frondosas (álamos, olmos, hayas); saprotrófico","catf":"hongos","subf":"hongo basidiomiceto","base":"Pleurotusostreatus"},{"id":"HON-012","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Seta de los caballeros","sci":"Tricholoma equestre","fam":"Tricholomataceae","freq":"media","key":"Sombrero amarillo-verdoso a amarillo dorado con centro más oscuro","mnem":"La 'seta amarilla del pinar': todo amarillo-verdoso con láminas amarillas brillantes — en pinar seco en otoño","etym":"Tricholoma (gr.) = 'de pelos en los bordes' · equestre = 'de los caballeros': seta de alto valor","notes":"Anteriormente considerada comestible excelente, hoy se desaconseja (miotoxicidad en consumos repetidos). El amarillo brillante de láminas y sombrero es diagnóstico.","hab":"Pinares; micorrícico con Pinus","catf":"hongos","subf":"hongo basidiomiceto","base":"Tricholomaequestre"},{"id":"HON-013","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Hygrophorus / Ebúrnea","sci":"Hygrophorus eburneus","fam":"Hygrophoraceae","freq":"baja","key":"Completamente blanca (sombrero, láminas y pie)","mnem":"La 'seta de marfil húmedo': toda blanca y resbaladiza como un jabón — la viscosidad y el blanco total son diagnósticos","etym":"Hygrophorus (gr.) = 'que lleva humedad' · eburneus = 'color marfil'","notes":"Importante para ilustrar las láminas cerosas características de Hygrophoraceae. La superficie mucilaginosa es el rasgo diagnóstico del grupo.","hab":"Bosques caducifolios (hayedos, robledales); micorrícico","catf":"hongos","subf":"hongo basidiomiceto","base":"Hygrophoruseburneus"},{"id":"HON-014","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Seta de San Juan / Agrocybe","sci":"Agrocybe aegerita (Cyclocybe aegerita)","fam":"Strophariaceae","freq":"media","key":"Crece en grupos en tocones y troncos de álamo, chopo y olmo","mnem":"La 'seta del chopo con cinturón': crece en grupos en tocones de álamo con un anillo conspicuo en el pie","etym":"Agrocybe (gr.) = 'cabeza de campo' · aegerita = del latín 'aegirus' (chopo negro)","notes":"Especie muy frecuente en choperas del río Manzanares y Jarama — directamente relevante para Madrid. Fácil de recoger para el examen.","hab":"Tocones y troncos de Populus, Ulmus, Salix; saprotrófico","catf":"hongos","subf":"hongo basidiomiceto","base":"Agrocybeaegerita"},{"id":"HON-015","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Oreja de Judas","sci":"Auricularia auricula-judae","fam":"Auriculariaceae","freq":"media","key":"Forma de oreja humana gelatinosa, marrón-rojiza translúcida","mnem":"La 'oreja gelatinosa del saúco': forma exacta de oreja marrón y translúcida colgando del tronco de saúco — imposible confundirla","etym":"Auricularia (lat.) = 'relativo a la oreja' · auricula-judae = 'oreja de Judas': por la leyenda de que Judas Iscariote se ahorcó en un saúco","notes":"La textura gelatinosa + forma de oreja son absolutamente diagnósticas. Hongo muy diferente morfológicamente de los agaricales — bueno para ilustrar diversidad.","hab":"Sobre madera muerta o enferma de Sambucus (saúco) principalmente","catf":"hongos","subf":"hongo basidiomiceto","base":"Auriculariaauricula-judae"},{"id":"HON-016","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Schizophyllum / Seta de las mil láminas","sci":"Schizophyllum commune","fam":"Schizophyllaceae","freq":"alta","key":"Sombrero pequeño en forma de abanico o concha, blanco-grisáceo con superficie vellosa","mnem":"El 'hongo cremallera': sus láminas se separan en dos mitades al mojarse — el único hongo con láminas que se dividen en dos","etym":"Schizophyllum (gr.) = schizein (dividir) + phyllon (lámina): 'láminas divididas' · commune = 'común'","notes":"CONFIRMADO: Schizophyllaceae en etiquetas de exámenes reales de Madrid. Las láminas bífidas son absolutamente únicas en el reino fungi.","hab":"Sobre madera muerta de casi cualquier árbol; saprotrófico; cosmopolita","catf":"hongos","subf":"hongo basidiomiceto","base":"Schizophyllumcommune"},{"id":"HON-017","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Rebozuelo / Chantarela","sci":"Cantharellus cibarius","fam":"Cantharellaceae","freq":"alta","key":"Color amarillo-yema de huevo uniforme en todo el cuerpo","mnem":"El 'hongo de yema de huevo con pliegues en vez de láminas': amarillo intenso + si miras bien las 'láminas' son pliegues gruesos que se bifurcan","etym":"Cantharellus (lat.) = 'pequeña taza' · cibarius = 'alimenticio'","notes":"Los pliegues venosos (no láminas verdaderas) son el rasgo diagnóstico clave. Olor a albaricoque es muy característico. Muy valorado culinariamente.","hab":"Bosques mixtos de coníferas y frondosas; micorrícico","catf":"hongos","subf":"hongo basidiomiceto","base":"Cantharelluscibarius"},{"id":"HON-018","cat":"Hongos","sub":"Hongo basidiomiceto","name":"Geastrum / Estrella de tierra","sci":"Geastrum triplex","fam":"Geastraceae","freq":"media","key":"Esporocarpo que se abre en estrella: las capas externas se doblan hacia atrás como pétalos","mnem":"La 'seta en forma de estrella': se abre como una flor de 8 pétalos dejando una bolsita de esporas en el centro — imposible confundirla","etym":"Geastrum (gr.) = ge (tierra) + aster (estrella): 'estrella de tierra' · triplex = 'triple': por las tres capas del peridio","notes":"La forma de estrella es absolutamente diagnóstica. Hongo gásteroide muy llamativo visualmente — buena muestra para examen.","hab":"Suelos de bosques caducifolios; saprotrófico","catf":"hongos","subf":"hongo basidiomiceto","base":"Geastrumtriplex"},{"id":"LIQ-001","cat":"Hongos","sub":"Liquen","name":"Xanthoria / Liquen naranja de los tejados","sci":"Xanthoria parietina","fam":"Teloschistaceae","freq":"muy_alta","key":"Color naranja-amarillo brillante, muy llamativo","mnem":"El 'liquen naranja de las tejas': la mancha naranja brillante en los tejados y ramas. Si hay manchas naranjas brillantes en una roca, es Xanthoria","etym":"Xanthoria (gr.) = xanthos (amarillo): 'el amarillo' · parietina = 'de las paredes'","notes":"CONFIRMADO: Teloschistaceae en etiquetas de exámenes reales de Madrid. El color naranja brillante + morfología foliosa es absolutamente diagnóstico. Indicador de ambientes ricos en nitrógeno.","hab":"Tejados, muros, cortezas de árbol, rocas; tolerante a la contaminación","catf":"hongos","subf":"liquen","base":"Xanthoriaparietina"},{"id":"LIQ-002","cat":"Hongos","sub":"Liquen","name":"Caloplaca / Líquen naranja rupícola","sci":"Caloplaca flavescens","fam":"Teloschistaceae","freq":"alta","key":"Morfología crustácea: completamente adherido a la roca, sin lóbulos libres","mnem":"El 'pegamento naranja de la roca caliza': como Xanthoria pero sin lóbulos — tan pegado que parece pintado sobre la piedra","etym":"Caloplaca (gr.) = kalos (bello) + plakos (placa): 'placa bella' · flavescens = 'que se vuelve amarillo'","notes":"Teloschistaceae confirmada. La diferencia folioso (Xanthoria) vs. crustáceo (Caloplaca) es un concepto clave del bloque de líquenes.","hab":"Rocas calizas expuestas; muros y paredes; resistente a la polución","catf":"hongos","subf":"liquen","base":"Caloplacaflavescens"},{"id":"LIQ-003","cat":"Hongos","sub":"Liquen","name":"Umbilicaria / Liquen roca de montaña","sci":"Umbilicaria pustulata","fam":"Umbilicariaceae","freq":"alta","key":"Liquen folioso umbilicado: adherido al sustrato por un único punto central (ombligo)","mnem":"El 'liquen con ombligo': si levantas el borde de este liquen pardo y está unido solo por el centro como una ventosa, es Umbilicaria","etym":"Umbilicaria (lat.) = umbilicus (ombligo): 'del ombligo' — adherida por un punto central · pustulata = 'con pústulas'","notes":"CONFIRMADO: Umbilicariaceae en etiquetas de exámenes reales de Madrid. El punto de fijación único (umbilical) es absolutamente diagnóstico del género. Muy presente en Guadarrama.","hab":"Rocas silíceas verticales en montaña (System Central); acidófilo","catf":"hongos","subf":"liquen","base":"Umbilicariapustulata"},{"id":"LIQ-004","cat":"Hongos","sub":"Liquen","name":"Parmelia / Liquen folioso gris","sci":"Parmelia sulcata","fam":"Parmeliaceae","freq":"alta","key":"Talo folioso gris-verdoso con red de crestas y surcos en la superficie (sulcata = surcada)","mnem":"El 'liquen del escudo gris surcado': superficie gris con red de grietas y 'polvo' sorediado en los bordes — el más común en troncos","etym":"Parmelia (lat.) = parma (escudo pequeño): por la forma del talo · sulcata = 'surcada, con surcos'","notes":"Uno de los líquenes más comunes en la Sierra de Guadarrama. Los seredios (polvo en los bordes) + red de surcos son diagnósticos.","hab":"Corteza de árboles y rocas silíceas; moderadamente tolerante a la polución","catf":"hongos","subf":"liquen","base":"Parmeliasulcata"},{"id":"LIQ-005","cat":"Hongos","sub":"Liquen","name":"Usnea / Barba de viejo","sci":"Usnea barbata","fam":"Parmeliaceae","freq":"alta","key":"Morfología fruticulosa: cuelga de las ramas de los árboles como una barba o mechones","mnem":"La 'barba de árbol con hilo elástico': cuelga como una barba verde-gris y al estirar un trocito notas el hilo central elástico — lo que los musgos NO tienen","etym":"Usnea (árabe 'ushna'): nombre árabe de este liquen · barbata = 'barbado': por el aspecto de barba","notes":"El eje elástico interior (el 'hilo') es la clave diagnóstica definitiva del género Usnea vs. musgos colgantes. Excelente indicador de calidad del aire: su presencia indica aire limpio.","hab":"Ramas de árboles en zonas de aire muy limpio; montaña húmeda","catf":"hongos","subf":"liquen","base":"Usneabarbata"},{"id":"LIQ-006","cat":"Hongos","sub":"Liquen","name":"Cladonia / Liquen de reno","sci":"Cladonia rangiferina","fam":"Cladoniaceae","freq":"media","key":"Morfología fruticulosa: ramificado en 3-4 ramas terminales curvadas hacia el mismo lado","mnem":"El 'coralito gris del suelo': ramificado como un coral pero gris y en el suelo del brezal — las puntas curvan hacia el mismo lado","etym":"Cladonia (gr.) = klados (rama): 'ramificada' · rangiferina = 'del reno (Rangifer)'","notes":"Las ramas terminales curvas hacia el mismo lado son diagnósticas del grupo. El liquen del reno — relación ecológica importante.","hab":"Suelos ácidos de brezales y bosques de coníferas; norte ibérico y alta montaña","catf":"hongos","subf":"liquen","base":"Cladoniarangiferina"},{"id":"LIQ-007","cat":"Hongos","sub":"Liquen","name":"Lecanora / Liquen crustáceo blanco","sci":"Lecanora muralis","fam":"Lecanoraceae","freq":"media","key":"Talo crustáceo gris-verdoso con margen lobulado irregular","mnem":"El 'liquen de las aceras': gris-verdoso aplastado en los muros y suelos urbanos — los huevos fritos diminutos grises son sus apotecios","etym":"Lecanora (gr.) = lekane (vasija, plato): por la forma del apotecio · muralis = 'de los muros'","notes":"El apotecio tipo lecanorina (con reborde del mismo color que el talo) es la clave para identificar el género Lecanora. Bioindicador de ambientes contaminados.","hab":"Muros, rocas, suelos; urbano; muy tolerante a la polución","catf":"hongos","subf":"liquen","base":"Lecanoramuralis"},{"id":"LIQ-008","cat":"Hongos","sub":"Liquen","name":"Evernia prunastri / Liquen de roble","sci":"Evernia prunastri","fam":"Parmeliaceae","freq":"media","key":"Talo fruticuloso ramificado, aplanado; haz verde-grisáceo, envés blanco-harinoso","mnem":"El 'liquen de los perfumes': verde por arriba y blanco harinoso por abajo — diferencia única entre líquenes. La industria de perfumería lo usa como fijador","etym":"Evernia (gr.) = euernés (de buenas ramas): por su ramificación · prunastri = 'del endrino (Prunus spinosa)'","notes":"El haz verde/envés blanco harinoso es diagnóstico de Evernia. Importante relación económica (perfumería).","hab":"Ramas de árboles (robles, frutales) en zonas rurales; aire moderadamente limpio","catf":"hongos","subf":"liquen","base":"Everniaprunastri"},{"id":"LIQ-009","cat":"Hongos","sub":"Liquen","name":"Peltigera / Liquen hepático","sci":"Peltigera canina","fam":"Peltigeraceae","freq":"media","key":"Talo folioso grande y blando (no coriáceo como Parmelia); color gris-parduzco","mnem":"El 'liquen con pelos de perro': el envés gris con venas gruesas y pelos irregulares — el único grande, blando y venadísimo por debajo","etym":"Peltigera (lat.) = peltis (escudo) + gero (llevar) · canina = 'del perro': por las rizinas parecidas a pelo de perro","notes":"Importante por su fotobionte: Peltigera tiene CIANOBACTERIA (Nostoc) como fotobionte, no alga verde — por tanto puede fijar N₂. Diferencia clave respecto a la mayoría de líquenes.","hab":"Suelos húmedos, musgos, base de árboles; bosques húmedos","catf":"hongos","subf":"liquen","base":"Peltigeracanina"},{"id":"LIQ-010","cat":"Hongos","sub":"Liquen","name":"Lobaria / Liquen pulmonaria","sci":"Lobaria pulmonaria","fam":"Lobariaceae","freq":"baja","key":"Talo folioso grande con superficie reticulada que recuerda al tejido pulmonar","mnem":"El 'liquen pulmón': superficie reticulada exactamente igual a un pulmón — cuando está húmedo es verde brillante, seco es gris","etym":"Lobaria (lat.) = lobos (lóbulo): por la forma lobulada · pulmonaria = 'del pulmón': por el parecido con el tejido pulmonar","notes":"Importante como indicador de bosques maduros (hayedos centenarios). La superficie reticulada que imita un pulmón es absolutamente diagnóstica.","hab":"Corteza de árboles viejos en hayedos y bosques atlánticos maduros; aire limpio","catf":"hongos","subf":"liquen","base":"Lobariapulmonaria"},{"id":"ANE-001","cat":"Invertebrados","sub":"Anélido","name":"Lombriz de tierra","sci":"Lumbricus terrestris","fam":"Lumbricidae","freq":"alta","key":"Cuerpo cilíndrico segmentado (metamería) de 100-150 segmentos visibles","mnem":"La 'lombriz de Darwin': cilíndrica, rosada, segmentada y con el clitelo hinchado — 'las plantas intestinos de la tierra' (Darwin la estudió)","etym":"Lumbricus (lat.) = 'lombriz' · terrestris = 'terrestre'","notes":"Los segmentos claramente visibles + clitelo son diagnósticos de Oligochaeta. Darwin dedicó un libro completo a las lombrices y su papel en la fertilidad del suelo.","hab":"Suelos húmedos y ricos en materia orgánica","catf":"invertebrados","subf":"anélido","base":"Lumbricusterrestris"},{"id":"ARA-001","cat":"Invertebrados","sub":"Arácnido","name":"Escorpión amarillo","sci":"Buthus occitanus","fam":"Buthidae","freq":"alta","key":"Telson (aguijón) en el extremo de la cola curvada — diagnóstico del orden","mnem":"El 'alacrán amarillo de las piedras': amarillo con pinzas y cola en U con aguijón — el más común de España","etym":"Buthus (gr.) = 'escorpión del norte de África' · occitanus = 'de Occitania'","notes":"El aguijón en el telson + 8 patas + pinzas son diagnósticos de Scorpiones. Es el escorpión más venenoso de Europa (veneno neurotóxico, raramente mortal en adultos).","hab":"Zonas áridas y semiáridas mediterráneas; bajo piedras y troncos","catf":"invertebrados","subf":"arácnido","base":"Buthusoccitanus"},{"id":"ARA-002","cat":"Invertebrados","sub":"Arácnido","name":"Araña de jardín","sci":"Araneus diadematus","fam":"Araneidae","freq":"alta","key":"Abdomen globoso con patrón de manchas blancas que forman una 'cruz' o 'diadema'","mnem":"La 'araña de la cruz': las manchas blancas en el abdomen forman una cruz clarísima — la araña del jardín otoñal","etym":"Araneus (lat.) = 'araña' · diadematus (lat.) = 'con diadema': por el patrón de manchas en el abdomen","notes":"La 'cruz' de manchas blancas en el abdomen es absolutamente diagnóstica. La telaraña orbicular es el tipo más complejo y bello de tela de araña.","hab":"Jardines, bordes de bosque, matorrales; abundante en otoño","catf":"invertebrados","subf":"arácnido","base":"Araneusdiadematus"},{"id":"ARA-003","cat":"Invertebrados","sub":"Arácnido","name":"Garrapata","sci":"Ixodes ricinus","fam":"Ixodidae","freq":"media","key":"Cuerpo aplastado sin segmentación visible; escudo dorsal quitinoso en el macho","mnem":"La 'semilla de ricino pegajosa': aplastada como una semilla, se clava en la piel y se hincha de sangre — cuando está llena parece una uva","etym":"Ixodes (gr.) = ixos (muérdago, pegajoso): 'pegajoso' · ricinus (lat.) = 'ricino': semilla que recuerda a la garrapata","notes":"Acarina son ácaros — no arañas ni escorpiones, aunque todos son arácnidos. Vector de Borrelia burgdorferi (enfermedad de Lyme) y TBE. Importante en medicina y veterinaria.","hab":"Vegetación alta; bordes de bosque, prados, zonas arbustivas","catf":"invertebrados","subf":"arácnido","base":"Ixodesricinus"},{"id":"ARA-004","cat":"Invertebrados","sub":"Arácnido","name":"Salpuga / Solifugo","sci":"Galeodes arabs","fam":"Galeodidae","freq":"baja","key":"Quelíceros enormes (casi tan grandes como el cefalotórax), con forma de cizalla","mnem":"El 'monstruo corredor de los quelíceros': parece tener dos cabezas — los quelíceros son tan grandes como el cuerpo. Sin veneno pero muerde","etym":"Galeodes (gr.) = 'parecido a una comadreja' · arabs = 'árabe, del desierto'","notes":"Solifugos son arácnidos raros en colecciones. Si aparece, los quelíceros enormes son absolutamente diagnósticos. Frecuente en el sureste árido ibérico.","hab":"Zonas áridas y semiáridas; sureste ibérico","catf":"invertebrados","subf":"arácnido","base":"Galeodesarabs"},{"id":"CNI-001","cat":"Invertebrados","sub":"Cnidario","name":"Anémona de mar","sci":"Actinia equina","fam":"Actiniidae","freq":"alta","key":"Cuerpo cilíndrico con corona de tentáculos en la parte superior (como una flor)","mnem":"La 'flor roja de roca que pica': roja brillante con tentáculos que se retraen al tocarla — la anémona intermareal más común del Atlántico","etym":"Actinia (gr.) = aktis (rayo): por los tentáculos como rayos · equina = 'de caballo' (por la textura robusta)","notes":"CONFIRMADO: Actiniidae en etiquetas de exámenes reales. Los tentáculos con cnidocitos + simetría radial son diagnósticos de Cnidaria. Diferenciar de equinodermos (también simetría radial): cnidarios = diploblásticos, sin mesodermo.","hab":"Zona intermareal rocosa atlántica y mediterránea; entre mareas","catf":"invertebrados","subf":"cnidario","base":"Actiniaequina"},{"id":"CNI-002","cat":"Invertebrados","sub":"Cnidario","name":"Medusa común","sci":"Aurelia aurita","fam":"Ulmaridae","freq":"alta","key":"Forma de platillo o sombrilla translúcida con 4 gónadas visibles en forma de herradura","mnem":"La 'medusa de las 4 lunas': translúcida con 4 círculos o medias lunas visibles por transparencia — las gónadas en forma de luna son su firma","etym":"Aurelia (lat.) = 'dorada' (de aurum = oro): por el brillo al sol · aurita = 'con orejas' (los tentáculos orales)","notes":"Las 4 gónadas en herradura son absolutamente diagnósticas. Scyphozoa = fase medusa dominante (a diferencia de Hydrozoa = pólipo dominante).","hab":"Mar abierto, bahías; pelágica; aparece en playas en verano","catf":"invertebrados","subf":"cnidario","base":"Aureliaaurita"},{"id":"CNI-003","cat":"Invert
