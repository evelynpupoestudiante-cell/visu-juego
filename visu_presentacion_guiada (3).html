independientes + cola prensil + patas zigodáctilas son diagnósticos. El cambio de color es para comunicación (no solo camuflaje). Protegido en España.","hab":"Matorral mediterráneo; sur peninsular","catf":"vertebrados","subf":"reptil","base":"Chamaeleochamaeleon"},{"id":"REP-007","cat":"Vertebrados","sub":"Reptil","name":"Galápago leproso","sci":"Mauremys leprosa","fam":"Geoemydidae","freq":"alta","key":"Caparazón ovalado pardo-oliváceo; plastrón amarillo con manchas oscuras","mnem":"La 'tortuga del río con rayas amarillas en el cuello': acuática, parda, con líneas amarillas en la cabeza — la tortuga de los ríos de Madrid","etym":"Mauremys (gr.) = maur (negro) + emys (tortuga) · leprosa = 'leprosa': por las manchas del cuello en adultos","notes":"El galápago más frecuente en ríos y humedales de Madrid. Las líneas amarillas en cabeza y cuello son diagnósticas. Amenazada por el galápago invasor de Florida.","hab":"Ríos, lagunas y embalses con vegetación acuática","catf":"vertebrados","subf":"reptil","base":"Mauremysleprosa"},{"id":"REP-008","cat":"Vertebrados","sub":"Reptil","name":"Geco común / Salamanquesa","sci":"Tarentola mauritanica","fam":"Phyllodactylidae","freq":"alta","key":"Lamelas adhesivas en los dedos (miles de setas de queratina con fuerzas de Van der Waals)","mnem":"La 'lagartija que desafía la gravedad': camina por el techo usando millones de pelos microscópicos — la nanotecnología de la naturaleza","etym":"Tarentola = de Tarento (ciudad italiana) · mauritanica = 'del norte de África'","notes":"Las lamelas adhesivas (setas de β-queratina con fuerzas de Van der Waals) son el tema científico más evaluable. Los ojos grandes sin párpados son diagnósticos de Gekkota.","hab":"Paredes de edificios, roquedos; mediterráneo; nocturno","catf":"vertebrados","subf":"reptil","base":"Tarentolamauritanica"},{"id":"REP-009","cat":"Vertebrados","sub":"Reptil","name":"Culebra bastarda","sci":"Malpolon monspessulanus","fam":"Colubridae","freq":"alta","key":"La serpiente más larga de la Península (hasta 2 m); muy ágil y veloz","mnem":"La 'serpiente con cara de enfadada': los arcos supraorbitarios pronunciados le dan expresión ceñuda — la más grande y rápida de España","etym":"Malpolon (fr.) = nombre local · monspessulanus = 'de Montpellier'","notes":"Los arcos supraorbitarios + tamaño grande son diagnósticos. Opistodonta = colmillos traseros (no verdadera víbora). El veneno es para las presas, apenas peligroso para humanos.","hab":"Matorral mediterráneo, campos abiertos; heliófila","catf":"vertebrados","subf":"reptil","base":"Malpolonmonspessulanus"},{"id":"HIS-A-001","cat":"Histología","sub":"Tejido animal","name":"Epitelio plano simple","sci":"Epithelium planum simplex","fam":"Tejido epitelial","freq":"alta","key":"Capa única de células aplanadas (escamosas); núcleo elipsoidal prominente","mnem":"Las 'baldosas con núcleo': células tan planas que se superponen como baldosas con un núcleo oscuro en el centro — el epitelio más fino y transparente","etym":"Epithelium (gr.) = epi (sobre) + thele (tetilla)","notes":"Reconocible por la capa única + células planas. Presente en cortes de vasos (endotelio) y en paredes de alvéolos.","hab":"","catf":"histología","subf":"tejido animal","base":"Epitheliumplanum"},{"id":"HIS-A-002","cat":"Histología","sub":"Tejido animal","name":"Epitelio cilíndrico simple (intestino)","sci":"Epithelium cylindricum simplex (enterocito)","fam":"Tejido epitelial","freq":"muy_alta","key":"Capa única de células altas (cilíndricas); núcleo basal oval","mnem":"El 'velvet intestinal': el ribete estriado apical (microvellosidades) parece una pelusa en la parte superior de cada célula — y entre ellas las copas de moco","etym":"Cylindricum = 'cilíndrico': forma de las células","notes":"El epitelio intestinal es la preparación más evaluada en histología animal. Las microvellosidades + células caliciformes son diagnósticos. Identificar en cortes de intestino delgado (vellosidades + criptas).","hab":"","catf":"histología","subf":"tejido animal","base":"Epitheliumcylindricum"},{"id":"HIS-A-003","cat":"Histología","sub":"Tejido animal","name":"Epidermis (epitelio queratinizado)","sci":"Epidermis (stratum corneum + basale + spinosum + granulosum)","fam":"Tejido epitelial","freq":"muy_alta","key":"Capa córnea (stratum corneum): células muertas SIN NÚCLEO llenas de queratina (rosa)","mnem":"La 'piel en 4 capas sin núcleos en la superficie': de abajo arriba — basal (activa) → espinosa (puentes) → granulosa (gránulos) → córnea (muerta, SIN núcleo). La queratinización avanza hacia arriba","etym":"Epidermis (gr.) = epi + derma: 'sobre la piel'","notes":"Preparación de piel = la más clásica de histología animal. La capa córnea sin núcleos (células muertas) es el diagnóstico del epitelio queratinizado. Diferenciar de epitelio estratificado no queratinizado (esófago = células superficiales CON núcleo).","hab":"","catf":"histología","subf":"tejido animal","base":"Epidermis"},{"id":"HIS-A-004","cat":"Histología","sub":"Tejido animal","name":"Epitelio estratificado plano no queratinizado","sci":"Epithelium stratificatum planum non cornificatum","fam":"Tejido epitelial","freq":"alta","key":"Múltiples capas celulares; células superficiales planas CON NÚCLEO (no queratinizadas)","mnem":"El 'sándwich húmedo de muchas capas': capas de células que se aplanan hacia arriba pero conservan el núcleo — para resistir el roce sin secarse","etym":"Stratificatum = 'en capas' · non cornificatum = 'no queratinizado'","notes":"Diferencia clave vs. epidermis: no queratinizado = células superficiales con núcleo; queratinizado = células superficiales sin núcleo (corneocitos).","hab":"","catf":"histología","subf":"tejido animal","base":"Epitheliumstratificatum"},{"id":"HIS-A-005","cat":"Histología","sub":"Tejido animal","name":"Tejido conjuntivo laxo","sci":"Textus connectivus laxus","fam":"Tejido conjuntivo","freq":"alta","key":"Pocas células dispersas en abundante matriz extracelular (fibras + sustancia fundamental)","mnem":"El 'relleno rosa del cuerpo': rosa claro con células dispersas y fibras entrelazadas sin orden — el tejido que rellena los espacios y envuelve los órganos","etym":"Connectivus = 'que conecta' · laxus = 'laxo, relajado'","notes":"El tejido conjuntivo laxo es el más frecuente en las preparaciones mixtas. Abundante matriz rosa + células dispersas son diagnósticos. Está siempre bajo el epitelio.","hab":"","catf":"histología","subf":"tejido animal","base":"Textusconnectivus"},{"id":"HIS-A-006","cat":"Histología","sub":"Tejido animal","name":"Tejido conjuntivo denso (tendón)","sci":"Textus connectivus densus regularis (tendo)","fam":"Tejido conjuntivo","freq":"alta","key":"Haces de fibras de colágeno paralelas y compactos (rellena casi todo el campo)","mnem":"El 'cable de acero rosa': haces paralelos de colágeno tan apretados que apenas se ven las células entre ellos — la resistencia a la tracción del cuerpo","etym":"Densus = 'denso' · regularis = 'regular, ordenado'","notes":"El tendón es la preparación tipo de tejido conjuntivo denso regular. Las fibras paralelas compactas son diagnósticas. Tricrómico de Masson → campo azul brillante uniforme.","hab":"","catf":"histología","subf":"tejido animal","base":"Textusconnectivus"},{"id":"HIS-A-007","cat":"Histología","sub":"Tejido animal","name":"Cartílago hialino","sci":"Cartilago hyalina","fam":"Tejido conjuntivo especializado","freq":"muy_alta","key":"Condrocitos en lagunas (espacios redondeados) dentro de la matriz homogénea basófila","mnem":"El 'queso con agujeros azules': fondo azul-homogéneo (la matriz) con huecos redondos (lagunas) donde viven los condrocitos — como aceitunas en gelatina azul","etym":"Cartilago (lat.) = 'cartílago' · hyalina (gr.) = 'vítreo, transparente'","notes":"El cartílago hialino es la preparación más frecuente de tejido conjuntivo especializado. Condrocitos en lagunas + matriz basófila azul son diagnósticos absolutos.","hab":"","catf":"histología","subf":"tejido animal","base":"Cartilagohyalina"},{"id":"HIS-A-008","cat":"Histología","sub":"Tejido animal","name":"Tejido óseo compacto (osteona)","sci":"Os compactum (Osteon / Sistema de Havers)","fam":"Tejido conjuntivo especializado","freq":"muy_alta","key":"Osteonas: laminillas concéntricas mineralizadas en torno al canal de Havers central","mnem":"El 'tronco de árbol del hueso': la osteona tiene anillos concéntricos (laminillas) alrededor de un canal central con sangre — como los anillos de un árbol alrededor de la médula","etym":"Osteon (gr.) = 'hueso' · Havers = del anatomista Clopton Havers (s. XVII)","notes":"Las osteonas con canal de Havers + laminillas + osteocitos en lagunas son diagnóstico absoluto de hueso compacto. Preparación de hueso descalcificado (ácido nítrico) + HE.","hab":"","catf":"histología","subf":"tejido animal","base":"Oscompactum"},{"id":"HIS-A-009","cat":"Histología","sub":"Tejido animal","name":"Tejido adiposo (adipocito unilocular)","sci":"Textus adiposus (adipocyte unilocularis)","fam":"Tejido conjuntivo especializado","freq":"alta","key":"Células enormes con una sola vacuola lipídica que ocupa casi todo el volumen","mnem":"El 'tejido de las células vacías con núcleo aplastado': los lípidos se disuelven en la preparación → las células quedan vacías con el núcleo pegado a la pared como un anillo de sello","etym":"Adeps (lat.) = 'grasa' · unilocular = 'con una sola vacuola'","notes":"El aspecto de 'anillo de sello' (vacuola enorme + núcleo periférico) es diagnóstico. Los lípidos se disuelven con alcohol en preparaciones de parafina → vacuoles vacías.","hab":"","catf":"histología","subf":"tejido animal","base":"Textusadiposus"},{"id":"HIS-A-010","cat":"Histología","sub":"Tejido animal","name":"Músculo estriado esquelético","sci":"Musculus striatus skeletalis","fam":"Tejido muscular","freq":"muy_alta","key":"Fibras largas y cilíndricas con múltiples núcleos PERIFÉRICOS","mnem":"El 'tejido de las barras de cebra': fibras largas con rayas transversales (estrías) y muchos núcleos en el BORDE — las barras = alternancia de actina y miosina en sarcómeros","etym":"Musculus (lat.) = 'músculo' (dim. de mus = ratón) · striatus = 'estriado'","notes":"Las estrías transversales + núcleos periféricos múltiples son absolutamente diagnósticos. Diferenciar de cardíaco (discos intercalares, núcleo central) y liso (sin estrías, núcleo central).","hab":"","catf":"histología","subf":"tejido animal","base":"Musculusstriatus"},{"id":"HIS-A-011","cat":"Histología","sub":"Tejido animal","name":"Músculo cardíaco","sci":"Musculus cardiacus","fam":"Tejido muscular","freq":"alta","key":"Fibras ramificadas y anastomosadas (no paralelas como el esquelético)","mnem":"El 'tejido de los discos intercalares': si ves fibras estriadas con rayas oscuras perpendiculares más gruesas y espaciadas (discos), y el núcleo está en el CENTRO — es cardíaco","etym":"Cardiacus (gr.) = kardia (corazón)","notes":"Los discos intercalares son el diagnóstico absoluto de músculo cardíaco. El núcleo central (1-2) diferencia del esquelético (múltiples periféricos).","hab":"","catf":"histología","subf":"tejido animal","base":"Musculuscardiacus"},{"id":"HIS-A-012","cat":"Histología","sub":"Tejido animal","name":"Músculo liso","sci":"Musculus laevis","fam":"Tejido muscular","freq":"alta","key":"Células fusiformes con UN único núcleo CENTRAL alargado","mnem":"El 'tejido sin rayas con un solo núcleo central': sin estrías + UN núcleo en el centro = músculo liso. El del intestino y los vasos sanguíneos","etym":"Laevis (lat.) = 'liso, sin estrías'","notes":"Ausencia de estrías + núcleo central único son los rasgos diagnósticos definitivos. Muy frecuente en preparaciones de pared intestinal (capa muscular de la muscularis mucosae y muscularis propia).","hab":"","catf":"histología","subf":"tejido animal","base":"Musculuslaevis"},{"id":"HIS-A-013","cat":"Histología","sub":"Tejido animal","name":"Neurona y tejido nervioso","sci":"Neuron (soma + axón + dendritas)","fam":"Tejido nervioso","freq":"muy_alta","key":"Soma (cuerpo celular): grande, con núcleo grande, nucléolo prominente y cuerpos de Nissl (RER)","mnem":"La 'estrella con cola larga': el soma neuronal con sus muchas dendritas (estrella) y el axón largo y único (cola) — la célula más especializada del cuerpo","etym":"Neuron (gr.) = 'nervio, fibra nerviosa'","notes":"La neurona es la preparación de tejido nervioso más frecuente. Soma con núcleo grande + nucléolo + cuerpos de Nissl + axón largo son diagnósticos. Saber la diferencia soma/axón/dendrita.","hab":"","catf":"histología","subf":"tejido animal","base":"Neuron"},{"id":"HIS-A-014","cat":"Histología","sub":"Tejido animal","name":"Sangre (frotis sanguíneo)","sci":"Sanguis (eritrocitos + leucocitos + plaquetas)","fam":"Tejido conjuntivo líquido","freq":"alta","key":"Eritrocitos: bicóncavos, sin núcleo, rosa eosinófilos con zona central más clara (los más abundantes)","mnem":"El 'ejército rojo con generales nucleados': mar de eritrocitos rojos bicóncavos con leucocitos dispersos (con núcleo) y plaquetitas diminutas — el frotis periférico","etym":"Sanguis (lat.) = 'sangre'","notes":"Frotis sanguíneo = preparación clásica de laboratorio. Identificar: eritrocitos (sin núcleo), neutrófilos (núcleo multilobulado), linfocitos (núcleo redondo grande), monocitos (núcleo reniforme), eosinófilos (gránulos rosas brillantes), basófilos (gránulos azul-negro), plaquetas.","hab":"","catf":"histología","subf":"tejido animal","base":"Sanguis"},{"id":"HIS-A-015","cat":"Histología","sub":"Tejido animal","name":"Epitelio pseudoestratificado ciliado (tráquea)","sci":"Epithelium pseudostratificatum ciliatum (trachea)","fam":"Tejido epitelial respiratorio","freq":"muy_alta","key":"Parece estratificado (varios núcleos a diferentes alturas) pero TODAS las células tocan la membrana basal","mnem":"El 'epitelio que engaña': parece tener varias capas (núcleos a diferentes alturas) pero si sigues cada célula hasta abajo, todas llegan a la membrana basal — el 'mago' de los epitelios","etym":"Pseudo (gr.) = falso; estratificado = en capas. 'Falso estratificado': parece en capas pero no lo es","notes":"El epitelio respiratorio es la preparación de epitelio más evaluada después del intestinal y la piel. Los cilios + la pseudoestratificación + las células caliciformes son diagnósticos. La función del 'ascensor mucociliar' (moco + cilios barren partículas hacia la faringe) es evaluable.","hab":"","catf":"histología","subf":"tejido animal","base":"Epitheliumpseudostratificatum"},{"id":"HIS-A-016","cat":"Histología","sub":"Tejido animal","name":"Glándula exocrina serosa (páncreas exocrino)","sci":"Pancreas exocrinum (acinos serosos)","fam":"Tejido glandular exocrino","freq":"alta","key":"Acinos serosos: grupos redondeados de células piramidales con núcleo basal y gránulos de zimógeno apicales","mnem":"El 'racimo de células bicolores con célula pequeña en el centro': el acino pancreático tiene la base azul (RER fabricando enzimas) y el ápice rosado (gránulos de enzimas listas). La célula centroacinosa en el centro es única del páncreas","etym":"Acino (lat.) = 'baya de uva': la forma de cada unidad secretora, como una uva dentro del racimo","notes":"El páncreas exocrino es la preparación clásica de glándula exocrina serosa. Las células centroacinosas son absolutamente diagnósticas del páncreas (ninguna otra glándula las tiene). El páncreas endocrino (islotes de Langerhans) también puede estar en la misma preparación.","hab":"","catf":"histología","subf":"tejido animal","base":"Pancreasexocrinum"},{"id":"HIS-A-017","cat":"Histología","sub":"Tejido animal","name":"Riñón — corpúsculo de Malpighi (glomérulo renal)","sci":"Corpusculum renale (Glomerulus + Capsula Bowmani)","fam":"Tejido renal — nefrona","freq":"muy_alta","key":"Corpúsculo renal: estructura circular con dos partes: glomérulo (masa de capilares) + cápsula de Bowman (doble pared que","mnem":"La 'pelota de lana dentro de una copa': el glomérulo (ovillo de capilares) está metido dentro de la cápsula de Bowman (la copa). La filtración ocurre desde la 'pelota' hacia la 'copa'","etym":"Malpighi = del anatomista italiano Marcello Malpighi (1628-1694), descubridor del glomérulo · Bowman = del anatomista inglés William Bowman (1816-1892)","notes":"El riñón es una de las preparaciones histológicas más frecuentes en colecciones de IES. El corpúsculo de Malpighi (glomérulo + cápsula de Bowman) es el componente más llamativo visualmente. El proceso de ultrafiltración glomerular es evaluable.","hab":"","catf":"histología","subf":"tejido animal","base":"Corpusculumrenale"},{"id":"HIS-A-018","cat":"Histología","sub":"Tejido animal","name":"Fibrocartílago (disco intervertebral / menisco)","sci":"Fibrocartilago (meniscus / discus intervertebralis)","fam":"Tejido conjuntivo especializado","freq":"alta","key":"Abundantes haces de fibras de colágeno tipo I visibles entre los condrocitos — diagnóstico diferencial con hialino","mnem":"El 'cartílago con rayas de colágeno': a diferencia del cartílago hialino (fondo azul homogéneo, sin rayas), el fibrocartílago tiene rayas de colágeno tipo I claramente visibles entre los condrocitos. El colágeno lo delata","etym":"Fibro = del latín 'fibra'; cartílago = del latín 'cartilago'. El cartílago más resistente, con fibras de colágeno visibles","notes":"El fibrocartílago es el tipo de cartílago que más aparece en colecciones de prácticas (meniscos, discos intervertebrales). La distinción de los tres tipos de cartílago (hialino/elástico/fibrocartílago) es una pregunta clásica.","hab":"","catf":"histología","subf":"tejido animal","base":"Fibrocartilago"},{"id":"HIS-A-019","cat":"Histología","sub":"Tejido animal","name":"Ganglio linfático (tejido linfoide secundario)","sci":"Nodus lymphaticus","fam":"Tejido linfoide","freq":"alta","key":"Estructura encapsulada (cápsula de tejido conjuntivo) con trabéculas que parten hacia el interior","mnem":"La 'estructura de cebolla con lunares claros': la cápsula exterior + los folículos linfáticos redondos con centro claro (germinal) son como una cebolla con burbujas dentro. Los centros claros = donde los linfocitos B proliferan activamente","etym":"Nodo (lat.) = 'nudo, nódulo' · linfático = del latín 'lympha' (agua limpia): 'nudo del sistema de aguas limpias'","notes":"El ganglio linfático es la preparación clásica de tejido linfoide. Los centros germinales claros dentro de los folículos oscuros son los más diagnósticos. El reconocimiento de las zonas B (folículos) y T (paracorteza) es evaluable.","hab":"","catf":"histología","subf":"tejido animal","base":"Noduslymphaticus"},{"id":"HIS-A-020","cat":"Histología","sub":"Tejido animal","name":"Hígado — lobulillo hepático clásico","sci":"Hepar (lobulus hepaticus classicus)","fam":"Tejido hepático","freq":"muy_alta","key":"Lobulillo hexagonal: vena central en el centro + tríadas portales en los ángulos del hexágono","mnem":"El 'pastel de radios de bicicleta con estrellas en las esquinas': la vena central en el centro, los hepatocitos en radios y las tríadas portales (triplete de tubos) en los 6 ángulos del hexágono — como una rueda de bicicleta vista desde arriba","etym":"Hepar (gr.) = 'hígado' · Lobulillo = unidad funcional del hígado · Tríada portal = por las 3 estructuras vasculares (vena porta, arteria hepática, conducto biliar)","notes":"El hígado es una de las preparaciones más frecuentes en colecciones de IES. El lobulillo con vena central + tríadas portales es la estructura más evaluada. La identificación de las 3 estructuras de la tríada portal es clave.","hab":"","catf":"histología","subf":"tejido animal","base":"Hepar"},{"id":"HIS-V-001","cat":"Histología","sub":"Tejido vegetal","name":"Meristema apical","sci":"Meristema apical primario","fam":"Tejido meristemático","freq":"alta","key":"Células pequeñas e isodiamétricas (cúbicas) con núcleo grande y vacuola muy pequeña","mnem":"Las 'células bebé del vegetal': pequeñas, cúbicas, con el núcleo enorme — y siempre dividiendo","etym":"Meristem (gr.) = merizein (dividir): tejido que se divide","notes":"Preparación clásica de ápice radicular de cebolla (Allium cepa). Las células en mitosis son el rasgo más evaluado. Identificar fases de la mitosis.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Meristemaapical"},{"id":"HIS-V-002","cat":"Histología","sub":"Tejido vegetal","name":"Cambium vascular","sci":"Cambium vascular (meristema lateral)","fam":"Tejido meristemático","freq":"alta","key":"Capa de células en división entre xilema y floema (zona de transición)","mnem":"El 'fabricante de madera y corteza': la fina capa entre la madera y la corteza que produce ambas — la fábrica del engrosamiento del tronco","etym":"Cambium (lat.) = 'cambio, intercambio': tejido que genera cambios","notes":"Visible en cortes de tallo de plantas leñosas. El cambium produce los anillos de crecimiento (1 anillo = 1 año = xilema claro de primavera + xilema oscuro de verano).","hab":"","catf":"histología","subf":"tejido vegetal","base":"Cambiumvascular"},{"id":"HIS-V-003","cat":"Histología","sub":"Tejido vegetal","name":"Parénquima clorofílico (mesófilo)","sci":"Parénquima en empalizada + esponjoso","fam":"Tejido fundamental","freq":"muy_alta","key":"Células vivas con numerosos cloroplastos (verdes)","mnem":"El 'tejido verde de la hoja en dos pisos': empalizada apretada arriba (más luz) + esponjoso con huecos abajo (intercambio gaseoso)","etym":"Parenchyma (gr.) = 'tejido relleno' · clorofílico = 'con clorofila'","notes":"La preparación de corte de hoja es la más frecuente en histología vegetal. Saber diferenciar empalizada (superior, compacta) de esponjoso (inferior, con huecos) en el mismo corte.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Parénquimaen"},{"id":"HIS-V-004","cat":"Histología","sub":"Tejido vegetal","name":"Parénquima de reserva","sci":"Parénquima amilífero (amiloplasto)","fam":"Tejido fundamental","freq":"alta","key":"Células grandes isodiamétricas con vacuola grande; poca o ninguna clorofila","mnem":"El 'tejido despensa': grandes células llenas de almidón — ponle lugol y se pone negro azulado","etym":"Amilífero = 'portador de almidón' (amilum = almidón en latín)","notes":"La reacción con lugol (I₂) es diagnóstica. El parénquima de patata es el material más fácil para demostrar almidón al microscopio.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Parénquimaamilífero"},{"id":"HIS-V-005","cat":"Histología","sub":"Tejido vegetal","name":"Esclerénquima (fibras y esclereidas)","sci":"Sclerenchyma (Fiber + Sclereid)","fam":"Tejido de sostén","freq":"alta","key":"Células muertas con pared muy engrosada y lignificada (dura al corte)","mnem":"El 'hormigón del vegetal': células muertas con pared tan gruesa que el lumen casi desaparece — lo que hace dura la madera","etym":"Sclero (gr.) = 'duro, sólido' + enchyma = tejido: 'tejido duro'","notes":"La tinción roja de la lignina con safranina es el marcador más diagnóstico. Las esclereidas forman las 'arenillas' de la pera. Diferencia clave vs. colénquima: células muertas + lignificadas = inextensibles.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Sclerenchyma"},{"id":"HIS-V-006","cat":"Histología","sub":"Tejido vegetal","name":"Colénquima","sci":"Collenchyma (angular / laminar / lagunar)","fam":"Tejido de sostén","freq":"media","key":"Células vivas con pared celulósica engrosada solo en ángulos (angular) o caras (laminar)","mnem":"El 'sostén flexible del tallo joven': paredes engrosadas en las esquinas pero sin lignina — puede estirarse. Las 'hebras' del apio son colénquima angular","etym":"Kolla (gr.) = 'cola, pegamento': por el aspecto gomoso de las paredes","notes":"El apio es el material clásico para observar colénquima angular. Diferencia clave vs. esclerénquima: células vivas + sin lignina = flexible y extensible.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Collenchyma"},{"id":"HIS-V-007","cat":"Histología","sub":"Tejido vegetal","name":"Epidermis vegetal con estomas","sci":"Epidermis + estomas + tricomas","fam":"Tejido de revestimiento","freq":"muy_alta","key":"Capa única de células compactas y aplanadas sin clorofila; cutícula brillante en el exterior","mnem":"La 'piel transparente de la hoja con válvulas verdes': capa incolora con estomas como labios verdes que se abren y cierran","etym":"Epidermis (gr.) = epi (sobre) + derma (piel): 'sobre la piel de la hoja'","notes":"La preparación de epidermis (peeling de cebolla, tradescantia) es la más clásica. Los estomas son absolutamente diagnósticos. Identificar células guarda vs. células epidérmicas normales.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Epidermis+"},{"id":"HIS-V-008","cat":"Histología","sub":"Tejido vegetal","name":"Xilema (vasos y traqueidas)","sci":"Xylem (Vessel element + Tracheid)","fam":"Tejido conductor","freq":"muy_alta","key":"Células muertas sin protoplasto; pared muy engrosada y lignificada","mnem":"El 'sistema de tuberías de agua roja': tubos muertos con engrosamientos en espiral que se tiñen de rojo — la corriente transpiradora sube por aquí","etym":"Xylon (gr.) = 'madera': el tejido que forma la madera","notes":"El haz vascular (xilema + floema) es la preparación más evaluada en histología vegetal. Safranina roja = xilema. Siempre saber la posición: xilema adaxial (haz superior) en hojas.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Xylem"},{"id":"HIS-V-009","cat":"Histología","sub":"Tejido vegetal","name":"Floema (tubos cribosos y células acompañantes)","sci":"Phloem (Sieve tube + Companion cell)","fam":"Tejido conductor","freq":"alta","key":"Tubos cribosos: células vivas sin núcleo con placa cribosa perforada en los extremos","mnem":"El 'sistema de tuberías de azúcar verde': tubos vivos sin núcleo que llevan los azúcares de las hojas al resto — el contrario del xilema en posición y función","etym":"Phloios (gr.) = 'corteza': tejido que forma la corteza interna","notes":"El floema es más difícil de identificar que el xilema. Clave: tinción verde (fast green) + células vivas con contenido + en posición abaxial.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Phloem"},{"id":"HIS-V-010","cat":"Histología","sub":"Tejido vegetal","name":"Tejido suberoso (corcho / felema)","sci":"Phellema (Felema)","fam":"Tejido de revestimiento secundario","freq":"media","key":"Células muertas en la madurez; paredes impregnadas de suberina (lipídica, impermeable)","mnem":"El 'lego del corcho': células rectangulares apiladas en columnas perfectas, muertas e impermeables — exactamente el tapón de corcho de la botella de vino","etym":"Phellema (gr.) = phellos (corcho) · suberina = de Quercus suber","notes":"Visible en cortes de tallo leñoso. La suberina (Sudán III → rojo) y la disposición en filas radiales son diagnósticos.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Phellema"},{"id":"HIS-V-011","cat":"Histología","sub":"Tejido vegetal","name":"Polen (grano de polen)","sci":"Granum pollinis (grano de polen)","fam":"Tejido reproductor","freq":"media","key":"Estructuras diminutas (10-100 µm) con pared externa resistente (esporodermis)","mnem":"La 'huella dactilar de la planta': cada especie tiene un patrón de ornamentación única de la pared — la palinología identifica especies por el polen fósil","etym":"Pollen (lat.) = 'polvo fino, harina': por el aspecto en masa","notes":"Puede aparecer en preparaciones de anteras. Los tipos de apertura (tricolpado en dicotiledóneas, monoporado en monocotiledóneas) son muy evaluables.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Granumpollinis"},{"id":"HIS-V-012","cat":"Histología","sub":"Tejido vegetal","name":"Tejido secretor (canales resiníferos)","sci":"Tejido secretor (canal resinífero / laticífero)","fam":"Tejido secretor","freq":"media","key":"Canales resiníferos: espacios entre células secretoras con resina (pinos)","mnem":"Los 'mini-fábricas químicas del vegetal': canales rodeados de células que producen resinas o látex — nografía vegetal — tallo","freq":"muy_alta","key":"Haces vasculares colaterales abiertos: xilema (rojo-safranina) hacia el interior + floema (verde-fast green) hacia el ex","mnem":"El 'corte de girasol con los haces en anillo': los puntos de colores (rojo=xilema, verde=floema) organizados en círculo son los haces colaterales. Si están en círculo, es dicotiledónea herbácea","etym":"Haz colateral = xilema y floema en el mismo plano (colateral) · abierto = con cambium entre ambos","notes":"La preparación de tallo de girasol (Helianthus) o alfalfa (Medicago) es la más clásica de las preparaciones vegetales de organografía. Identificar todos los tejidos de fuera a dentro: epidermis → colénquima → parénquima cortical → haces vasculares en anillo → parénquima medular.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Tallode"},{"id":"HIS-V-016","cat":"Histología","sub":"Tejido vegetal","name":"Hoja de maíz — monocotiledónea (corte transversal)","sci":"Zea mays (corte transversal de hoja)","fam":"Organografía vegetal — hoja monocotiledónea","freq":"muy_alta","key":"Haces vasculares cerrados (sin cambium): xilema + floema sin capa generatriz entre ellos","mnem":"La 'hoja con los haces dispersos como confeti': en vez del anillo ordenado del girasol, los haces del maíz están por todas partes sin orden aparente. Sin cambium = sin crecimiento en grosor","etym":"Monocotiledónea = un solo cotiledón en la semilla; haz cerrado = sin cambium (no crece en grosor secundario)","notes":"El par dicotiledónea (haces en anillo, abiertos) / monocotiledónea (haces dispersos, cerrados) es el tema más evaluado de anatomía vegetal. El maíz además tiene anatomía C4 (vaina del haz = ciclo de Hatch-Slack), evaluable en fotosíntesis.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Zeamays"},{"id":"HIS-V-017","cat":"Histología","sub":"Tejido vegetal","name":"Raíz primaria (corte transversal completo)","sci":"Corte transversal de raíz primaria (Ranunculus / Allium)","fam":"Organografía vegetal — raíz","freq":"muy_alta","key":"De fuera a dentro: rizodermis (epidermis con pelos radiculares) → cortex (parénquima) → endodermis (con banda de Caspary","mnem":"La 'estrella de xilema en el centro de la raíz': mientras el tallo tiene los haces en colateral (xilema al lado del floema), la raíz tiene el xilema formando una estrella central con el floema entre los brazos. Tallo = colateral; raíz = alterno","etym":"Rizodermis (gr.) = rhiza (raíz) + derma (piel) · periciclo = peri (alrededor) + cyklos (círculo): capa que rodea el cilindro vascular","notes":"La diferencia tallo/raíz en organización del haz vascular (colateral vs. alterno) es evaluable directamente. El periciclo es el tejido que origina las raíces laterales y el cambium en la transición al crecimiento secundario.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Cortetransversal"},{"id":"HIS-V-018","cat":"Histología","sub":"Tejido vegetal","name":"Tallo leñoso (anillos de crecimiento — madera)","sci":"Corte transversal de tallo leñoso de Pinus / Quercus (secundario)","fam":"Organografía vegetal — tallo leñoso","freq":"alta","key":"Anillos de crecimiento visibles: madera de primavera (vasos grandes, claro) + madera de verano (vasos pequeños, oscuro)","mnem":"El 'tronco en sección: cada anillo = un año': madera clara de primavera (vasos grandes) + madera oscura de verano (vasos pequeños) = un año. Contar anillos = contar años. Los rayos son los radios de la rueda","etym":"Xilema secundario = producido por el cambium vascular durante el crecimiento secundario en grosor","notes":"Los anillos de crecimiento son uno de los temas más conocidos. La dendrocronología (contar e interpretar los anillos) es evaluable. La madera de conífera (con traqueidas, sin vasos reales) difiere de la de frondosa (con vasos = tráqueas reales).","hab":"","catf":"histología","subf":"tejido vegetal","base":"Cortetransversal"},{"id":"HIS-V-019","cat":"Histología","sub":"Tejido vegetal","name":"Óvulo y saco embrionario (tejido reproductor femenino)","sci":"Óvulo de angiosperma (Lilium / Capsella bursa-pastoris)","fam":"Tejido reproductor femenino vegetal","freq":"alta","key":"Óvulo: estructura envuelta por integumentos (capas protectoras) con micrópila visible","mnem":"El 'huevo dentro del huevo dentro del huevo': el óvulo (dentro del carpelo) contiene el saco embrionario (dentro del óvulo) que contiene la oosfera (el verdadero gameto). La muñeca rusa de la reproducción vegetal","etym":"Óvulo (lat.) = 'pequeño huevo' · Saco embrionario = cavidad que contiene el gametofito femenino reducido","notes":"La fecundación doble de las angiospermas (una espermatozoide + oosfera = zigoto; otro espermatozoide + núcleos polares = endosperma 3n) es un tema evaluable. Preparaciones de Lilium (azucena) son el material clásico de IES.","hab":"","catf":"histología","subf":"tejido vegetal","base":"Óvulode"}];

/* ══ COLA DE PETICIONES ══ */
const Q=[];let active=0;
function enq(fn){Q.push(fn);drain();}
function drain(){
  while(active<4&&Q.length){
    const fn=Q.shift();active++;
    fn().finally(()=>{active--;drain();});
  }
}
function getJSON(url,tries){
  tries=tries===undefined?2:tries;
  return fetch(url).then(r=>{
    if(!r.ok)throw new Error(r.status);
    return r.json();
  }).catch(err=>{
    if(tries>0)return new Promise(r=>setTimeout(r,320*(3-tries))).then(()=>getJSON(url,tries-1));
    throw err;
  });
}

/* ══ IMÁGENES ══ */
function probe(c){
  if(variants[c.id]!==undefined)return;
  variants[c.id]='...';
  if(!c.catf||!c.subf||!c.base){variants[c.id]=[];return;}
  const u=SCRIPT+'?probe=1&cat='+encodeURIComponent(c.catf)
    +'&sub='+encodeURIComponent(c.subf)+'&base='+encodeURIComponent(c.base);
  enq(()=>getJSON(u)
    .then(d=>{
      variants[c.id]=d.variants||[];
      if(variants[c.id].length)fetchImg(c,variants[c.id][0]);
      else paint();
    })
    .catch(()=>{variants[c.id]=undefined;paint();}));
}
function fetchImg(c,fn){
  if(!loaded[c.id])loaded[c.id]={};
  if(loaded[c.id][fn]!==undefined)return;
  loaded[c.id][fn]='...';
  const u=SCRIPT+'?img=1&cat='+encodeURIComponent(c.catf)
    +'&sub='+encodeURIComponent(c.subf)+'&file='+encodeURIComponent(fn);
  enq(()=>getJSON(u)
    .then(d=>{loaded[c.id][fn]=d.dataUrl||null;paint();})
    .catch(()=>{delete loaded[c.id][fn];paint();}));
}

/* ══ PARSEO DEL CAMPO notes ══ */
/* El campo notes de minerales y rocas trae bloques PRUEBAS: y CONFUSIÓN CON:
   que son estructura real del dato y merecen tratamiento propio. */
function splitNotes(t){
  if(!t)return{body:'',tests:'',vs:''};
  let body=t,tests='',vs='';
  const iT=t.search(/PRUEBAS:/i);
  const iC=t.search(/CONFUSI[ÓO]N(?:\s+CON)?:/i);
  if(iT>=0&&iC>=0&&iC>iT){
    body=t.slice(0,iT).trim();
    tests=t.slice(iT,iC).replace(/^PRUEBAS:\s*/i,'').trim();
    vs=t.slice(iC).replace(/^CONFUSI[ÓO]N(?:\s+CON)?:\s*/i,'').trim();
  }else if(iT>=0){
    body=t.slice(0,iT).trim();
    tests=t.slice(iT).replace(/^PRUEBAS:\s*/i,'').trim();
  }else if(iC>=0){
    body=t.slice(0,iC).trim();
    vs=t.slice(iC).replace(/^CONFUSI[ÓO]N(?:\s+CON)?:\s*/i,'').trim();
  }
  return{body:body,tests:tests,vs:vs};
}
/* "(1) ... (2) ... (3) ..." → lista ordenada */
function testsHTML(t){
  const parts=t.split(/\((\d+)\)\s*/).filter(s=>s.trim()&&!/^\d+$/.test(s));
  if(parts.length>1)
    return'<ol>'+parts.map(s=>'<li>'+esc(s.trim().replace(/\.$/,''))+'</li>').join('')+'</ol>';
  return'<p>'+esc(t)+'</p>';
}
/* "Nombre — cómo distinguir." → entradas con el nombre destacado */
function vsHTML(t){
  const out=[];
  const re=/([A-ZÁÉÍÓÚÑ][^—.]{2,48}?)\s+—\s+([^]*?)(?=(?:[A-ZÁÉÍÓÚÑ][^—.]{2,48}?\s+—\s+)|$)/g;
  let m;
  while((m=re.exec(t))!==null)
    out.push('<span class="vs"><b>'+esc(m[1].trim())+'</b> — '+esc(m[2].trim())+'</span>');
  return out.length?out.join(''):'<p>'+esc(t)+'</p>';
}

/* ══ SELECTOR ══ */
function drawSelector(){
  const total=CARDS.length;
  const nCat=Object.keys(NAV).length;
  const nSub=Object.values(NAV).reduce((a,o)=>a+Object.keys(o).length,0);
  $('tally').innerHTML=
    '<span><b>'+total+'</b> ejemplares</span>'+
    '<span><b>'+nCat+'</b> categorías</span>'+
    '<span><b>'+nSub+'</b> subcategorías</span>';

  $('cats').innerHTML=Object.keys(NAV).map(cat=>{
    const p=PALETTE[cat],n=Object.values(NAV[cat]).reduce((a,b)=>a+b,0);
    return'<button class="cat" aria-pressed="'+(selCat===cat)+'" '+
      'style="--cc:'+p.c+';--cf:'+p.f+';--ct:'+p.t+'" data-cat="'+esc(cat)+'">'+
      '<span class="cat-n">'+esc(cat)+'</span>'+
      '<span class="cat-c">'+n+' ejemplares</span></button>';
  }).join('');
  $('cats').querySelectorAll('.cat').forEach(b=>
    b.onclick=()=>{selCat=b.dataset.cat;selSub=null;drawSelector();});

  const sw=$('subs');
  if(!selCat){sw.classList.remove('on');}
  else{
    sw.classList.add('on');
    const p=PALETTE[selCat];
    $('subs-h').textContent='Subcategoría';
    $('sub-row').innerHTML=Object.entries(NAV[selCat]).map(([s,n])=>
      '<button class="sub" aria-pressed="'+(selSub===s)+'" style="--cc:'+p.c+'" '+
      'data-sub="'+esc(s)+'">'+esc(s)+'<i>'+n+'</i></button>').join('');
    $('sub-row').querySelectorAll('.sub').forEach(b=>
      b.onclick=()=>{selSub=(selSub===b.dataset.sub?null:b.dataset.sub);drawSelector();});
  }

  const go=$('go'),note=$('go-note');
  go.disabled=!selCat;
  if(selCat){
    const n=selSub?NAV[selCat][selSub]:Object.values(NAV[selCat]).reduce((a,b)=>a+b,0);
    go.style.setProperty('--cc',PALETTE[selCat].c);
    note.textContent=n+' fichas · '+(selSub||selCat);
  }else{
    note.textContent='Elige una categoría para empezar';
  }
}

/* ══ APERTURA ══ */
function open(){
  SET=CARDS.filter(c=>c.cat===selCat&&(!selSub||c.sub===selSub));
  if(!SET.length)return;
  cur=0;
  const p=PALETTE[selCat];
  document.documentElement.style.setProperty('--accent',p.c);
  document.documentElement.style.setProperty('--accent-fill',p.f);
  document.documentElement.style.setProperty('--accent-text',p.t);
  $('selector').style.display='none';
  $('sheet').classList.add('on');
  window.scrollTo(0,0);
  paint();
}
function close(){
  $('sheet').classList.remove('on');
  $('selector').style.display='';
  window.scrollTo(0,0);
}
let step=function(d){
  const n=cur+d;
  if(n<0||n>=SET.length)return;
  cur=n;window.scrollTo({top:0,behavior:'instant'});paint();
};

/* ══ PINTADO DE LA FICHA ══ */
let pending=false;
function paint(){
  if(pending)return;
  pending=true;
  requestAnimationFrame(()=>{pending=false;render();});
}

function render(){
  const c=SET[cur];if(!c)return;
  const p=PALETTE[c.cat];
  document.documentElement.style.setProperty('--cc',p.c);
  document.documentElement.style.setProperty('--cf',p.f);
  document.documentElement.style.setProperty('--ct',p.t);
  ['--accent','--accent-fill','--accent-text'].forEach((v,i)=>
    document.documentElement.style.setProperty(v,[p.c,p.f,p.t][i]));

  /* Barra superior */
  $('trail').innerHTML='<b>'+esc(c.cat)+'</b> · '+esc(c.sub);
  $('pgn').textContent=(cur+1)+' / '+SET.length;
  $('rail').style.width=((cur+1)/SET.length*100)+'%';
  $('rail').style.background=p.c;
  $('pv').disabled=$('fpv').disabled=cur===0;
  $('nx').disabled=$('fnx').disabled=cur===SET.length-1;

  /* Placa */
  probe(c);
  const vs=variants[c.id];
  const idx=shown[c.id]||0;
  let plate='';
  if(vs==='...'||vs===undefined){
    plate='<div class="plate-img"><div class="spin"></div></div>';
  }else if(!vs.length){
    plate='<div class="plate-img"><div class="plate-empty">Sin imágenes en Drive<br>'+
      '<code>'+esc(c.base)+'1.jpg</code></div></div>';
  }else{
    const fn=vs[Math.min(idx,vs.length-1)];
    const du=(loaded[c.id]||{})[fn];
    if(du===undefined){fetchImg(c,fn);}
    let inner;
    if(du&&du!=='...')inner='<img src="'+du+'" alt="'+esc(c.name)+'">';
    else if(du===null)inner='<div class="plate-empty">No se pudo cargar<br><code>'+esc(fn)+'</code></div>';
    else inner='<div class="spin"></div>';
    plate='<div class="plate-img">'+inner+
      (vs.length>1?
        '<button class="plate-nav pv" id="ipv"'+(idx===0?' disabled':'')+'>&#8249;</button>'+
        '<button class="plate-nav nx" id="inx"'+(idx>=vs.length-1?' disabled':'')+'>&#8250;</button>':'')+
      ((du&&du!=='...')?'<button class="plate-expand" id="iexp" aria-label="Ver a pantalla completa">&#9974;</button>':'')+
      '</div>'+
      (vs.length>1?'<div class="plate-dots">'+vs.map((_,i)=>
        '<button class="dot'+(i===idx?' on':'')+'" data-i="'+i+'" aria-label="Imagen '+(i+1)+'"></button>'
      ).join('')+'</div>':'');
  }
  $('plate').innerHTML='<div class="plate-frame">'+plate+'</div>';
  const ip=$('ipv'),inx=$('inx'),iex=$('iexp');
  if(ip)ip.onclick=e=>{e.stopPropagation();shown[c.id]=Math.max(0,idx-1);render();};
  if(inx)inx.onclick=e=>{e.stopPropagation();shown[c.id]=Math.min(vs.length-1,idx+1);render();};
  if(iex)iex.onclick=e=>{e.stopPropagation();openLB();};
  $('plate').querySelectorAll('.dot').forEach(d=>
    d.onclick=()=>{shown[c.id]=+d.dataset.i;render();});
  const pimg=$('plate').querySelector('.plate-img img');
  if(pimg)pimg.onclick=()=>openLB();

  /* Dossier */
  const fq=FREQ[c.freq]||{n:0,l:c.freq};
  const N=splitNotes(c.notes);
  let h='';

  h+='<div class="crest">'+
     '<span class="tag">'+esc(c.sub)+'</span>'+
     '<span class="ref">'+esc(c.id)+'</span></div>';

  h+='<h2 class="common">'+esc(c.name)+'</h2>';
  h+='<p class="binomial">'+esc(c.sci)+'</p>';
  if(c.fam)h+='<p class="taxon">'+esc(c.fam)+'</p>';

  h+='<div class="gauge"><div class="bars">'+
     [0,1,2,3].map(i=>'<span class="bar'+(i<fq.n?' lit':'')+'"></span>').join('')+
     '</div><span><b>'+esc(fq.l)+'</b> en el visu</span></div>';

  if(c.key)h+='<div class="keyline">'+esc(c.key)+'</div>';

  if(c.mnem)h+='<div class="mnem"><div class="mnem-h">Para recordarlo</div>'+esc(c.mnem)+'</div>';

  if(N.tests)
    h+='<div class="probe"><div class="probe-h">'+
       '<span class="mark" style="background:'+p.c+'"></span>Pruebas de identificación</div>'+
       '<div class="probe-b">'+testsHTML(N.tests)+'</div></div>';

  if(N.vs)
    h+='<div class="probe"><div class="probe-h">'+
       '<span class="mark" style="background:#B03060"></span>Se confunde con</div>'+
       '<div class="probe-b">'+vsHTML(N.vs)+'</div></div>';

  if(N.body)
    h+='<div class="blk"><div class="blk-h">Notas de examen</div>'+
       '<div class="blk-b">'+esc(N.body)+'</div></div>';

  if(c.etym)h+='<div class="etym">'+esc(c.etym)+'</div>';

  if(c.hab)h+='<div class="hab"><b>Hábitat.</b> '+esc(c.hab)+'</div>';

  $('dossier').innerHTML=h;

  /* Precarga de la siguiente */
  if(cur+1<SET.length)probe(SET[cur+1]);
}

/* ══ IMAGEN A PANTALLA COMPLETA ══ */
function lbOpen(){return $('lightbox').classList.contains('on');}
function openLB(){
  const c=SET[cur];if(!c)return;
  const vs=variants[c.id];
  if(!vs||vs==='...'||!vs.length)return;
  renderLB();
  $('lightbox').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeLB(){
  $('lightbox').classList.remove('on');
  document.body.style.overflow='';
}
function renderLB(){
  const c=SET[cur];if(!c)return;
  const vs=variants[c.id];if(!vs||vs==='...')return;
  const idx=Math.min(shown[c.id]||0,vs.length-1);
  const fn=vs[idx];
  const du=(loaded[c.id]||{})[fn];
  $('lb-name').textContent=c.name+'  ·  '+(idx+1)+'/'+vs.length;
  $('lb-img').innerHTML=(du&&du!=='...')
    ? '<img src="'+du+'" alt="'+esc(c.name)+'">'
    : '<div class="spin"></div>';
  if(du===undefined)fetchImg(c,fn);
  $('lb-dots').innerHTML=vs.length>1?vs.map((_,i)=>
    '<button class="dot'+(i===idx?' on':'')+'" data-i="'+i+'"></button>').join(''):'';
  $('lb-dots').querySelectorAll('.dot').forEach(d=>
    d.onclick=()=>{shown[c.id]=+d.dataset.i;renderLB();paint();});
}
function lbStep(d){
  const c=SET[cur];const vs=variants[c.id];
  if(!vs||vs==='...'||vs.length<2)return;
  const idx=Math.min(shown[c.id]||0,vs.length-1);
  const n=idx+d;
  if(n<0||n>=vs.length)return;
  shown[c.id]=n;renderLB();paint();
}

/* ══ GESTOS TÁCTILES ══
   Deslizar horizontal sobre la ficha cambia de ejemplar; sobre la imagen
   ampliada cambia de fotografía. Se descarta el gesto si el movimiento es
   principalmente vertical, para no interferir con el scroll. */
function swipe(el,onLeft,onRight){
  let x0=null,y0=null,t0=0,lock=null;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){x0=null;return;}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();lock=null;
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(x0===null||lock==='v')return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(lock===null&&(Math.abs(dx)>10||Math.abs(dy)>10))
      lock=Math.abs(dx)>Math.abs(dy)*1.4?'h':'v';
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0===null||lock!=='h')return;
    const dx=e.changedTouches[0].clientX-x0;
    const dt=Date.now()-t0;
    if(Math.abs(dx)>55&&dt<700){ dx<0?onLeft():onRight(); }
    x0=null;lock=null;
  },{passive:true});
}

/* ══ EVENTOS ══ */
$('go').onclick=open;
$('back').onclick=close;
$('pv').onclick=$('fpv').onclick=()=>step(-1);
$('nx').onclick=$('fnx').onclick=()=>step(1);
$('lb-close').onclick=closeLB;
$('lightbox').onclick=e=>{if(e.target.id==='lightbox'||e.target.id==='lb-img')closeLB();};

swipe($('sheet'),()=>{if(!lbOpen())step(1);},()=>{if(!lbOpen())step(-1);});
swipe($('lightbox'),()=>lbStep(1),()=>lbStep(-1));

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(lbOpen()){
    if(e.key==='Escape'){e.preventDefault();closeLB();}
    if(e.key==='ArrowRight'){e.preventDefault();lbStep(1);}
    if(e.key==='ArrowLeft'){e.preventDefault();lbStep(-1);}
    return;
  }
  if(!$('sheet').classList.contains('on'))return;
  if(e.key==='ArrowRight'){e.preventDefault();step(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
  if(e.key==='Escape')close();
});

/* Al cambiar de ejemplar se cierra la vista ampliada */
const _step=step;
step=function(d){ if(lbOpen())closeLB(); _step(d); };

drawSelector();
</script>
