<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#EDEFEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fichas VISU">
<meta name="mobile-web-app-capable" content="yes">
<title>VISU · Fichas de espécimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EDEFEA;
  --paper:#FFFFFF;
  --ink:#181C19;
  --ink2:#5F6B62;
  --ink3:#8A958D;
  --rule:#D8DDD6;
  --rule2:#E8EBE6;
  --accent:#C8922A;
  --accent-fill:#FDF0E0;
  --accent-text:#8A5A00;
  --serif:'Newsreader',Georgia,serif;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--ground);
  color:var(--ink);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  overscroll-behavior-y:contain;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ══ PANTALLA: SELECTOR ══════════════════════════════════════════════════ */
#selector{max-width:940px;margin:0 auto;padding:clamp(28px,6vw,72px) 20px 80px}
.masthead{margin-bottom:clamp(32px,6vw,56px)}
.masthead h1{
  font-family:var(--serif);
  font-weight:300;
  font-size:clamp(38px,7vw,62px);
  line-height:1.02;
  letter-spacing:-.022em;
}
.masthead h1 em{font-style:italic;font-weight:400}
.masthead p{
  margin-top:12px;
  color:var(--ink2);
  font-size:clamp(14px,2vw,16px);
  max-width:52ch;
}
.tally{
  display:flex;gap:26px;flex-wrap:wrap;
  margin-top:22px;padding-top:18px;
  border-top:1px solid var(--rule);
  font-size:13px;color:var(--ink2);
}
.tally b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

.field-label{
  font-family:var(--serif);
  font-size:19px;font-weight:500;
  margin-bottom:14px;
}
.cats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:10px;margin-bottom:34px;
}
.cat{
  background:var(--paper);
  border:1px solid var(--rule);
  border-left:4px solid var(--cc);
  border-radius:3px;
  padding:15px 16px;
  cursor:pointer;
  text-align:left;
  font-family:inherit;
  transition:border-color .14s,background .14s;
}
.cat:hover{border-color:var(--cc)}
.cat[aria-pressed="true"]{background:var(--cf);border-color:var(--cc)}
.cat-n{
  font-family:var(--serif);font-size:20px;font-weight:500;
  color:var(--ct);line-height:1.2;
}
.cat-c{font-size:12.5px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}

#subs{display:none;margin-bottom:34px}
#subs.on{display:block}
.sub-row{display:flex;flex-wrap:wrap;gap:7px}
.sub{
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:20px;
  padding:6px 14px;
  font-size:13.5px;font-family:inherit;color:var(--ink);
  cursor:pointer;transition:all .13s;
}
.sub:hover{border-color:var(--ink3)}
.sub[aria-pressed="true"]{background:var(--cc);border-color:var(--cc);color:#fff;font-weight:500}
.sub i{font-style:normal;opacity:.55;font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}

.launch{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-top:22px;border-top:1px solid var(--rule);
}
.go{
  background:var(--ink);color:var(--paper);
  border:none;border-radius:3px;
  padding:13px 30px;
  font-family:inherit;font-size:15px;font-weight:500;
  cursor:pointer;transition:background .14s;
}
.go:hover:not(:disabled){background:var(--cc)}
.go:disabled{background:var(--rule);color:var(--ink3);cursor:default}
.go-note{font-size:13.5px;color:var(--ink2)}

/* ══ PANTALLA: FICHA ═════════════════════════════════════════════════════ */
#sheet{display:none;min-height:100vh;flex-direction:column}
#sheet.on{display:flex}

.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.topbar-in{
  max-width:1240px;margin:0 auto;
  padding:9px 18px;
  display:flex;align-items:center;gap:14px;
}
.back{
  background:none;border:none;cursor:pointer;
  color:var(--ink2);font-family:inherit;font-size:14px;
  padding:5px 9px 5px 0;display:flex;align-items:center;gap:6px;
}
.back:hover{color:var(--ink)}
.trail{
  flex:1;min-width:0;
  font-size:13.5px;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.trail b{color:var(--cc);font-weight:600}
.pager{
  display:flex;align-items:center;gap:3px;flex-shrink:0;
}
.pg-btn{
  background:none;border:1px solid var(--rule);border-radius:3px;
  width:30px;height:30px;cursor:pointer;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;line-height:1;
}
.pg-btn:hover:not(:disabled){background:var(--ground);border-color:var(--ink3)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-n{
  font-size:13px;color:var(--ink2);
  font-variant-numeric:tabular-nums;
  padding:0 9px;white-space:nowrap;
}
.rail{height:2px;background:var(--rule2)}
.rail-fill{height:100%;background:var(--cc);transition:width .3s ease}

/* ── Cuerpo de la ficha ── */
.sheet-body{
  flex:1;
  max-width:1240px;width:100%;margin:0 auto;
  padding:22px 18px 90px;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);
  gap:clamp(20px,3.4vw,44px);
  align-items:start;
}
@media(max-width:900px){
  .sheet-body{grid-template-columns:1fr;gap:16px}
}

/* ── Placa fotográfica ── */
.plate{position:sticky;top:62px}
@media(max-width:900px){.plate{position:static}}
.plate-frame{
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:3px;
  overflow:hidden;
}
.plate-img{
  position:relative;
  background:var(--ground);
  min-height:280px;
  display:flex;align-items:center;justify-content:center;
}
@media(max-width:900px){.plate-img{min-height:220px}}
.plate-img img{
  display:block;width:100%;
  max-height:min(58vh,540px);
  object-fit:contain;
}
.plate-empty{
  padding:52px 24px;text-align:center;
  color:var(--ink3);font-size:13.5px;line-height:1.8;
}
.plate-empty code{
  font-family:var(--sans);font-size:12.5px;
  background:var(--rule2);padding:2px 7px;border-radius:2px;
  color:var(--ink2);
}
.spin{
  width:22px;height:22px;
  border:2px solid var(--rule);border-top-color:var(--cc);
  border-radius:50%;animation:sp .75s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2s}}

.plate-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;
  background:rgba(24,28,25,.62);color:#fff;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;line-height:1;
  opacity:0;transition:opacity .16s;
}
.plate-img:hover .plate-nav,.plate-nav:focus-visible{opacity:1}
.plate-nav.pv{left:9px}
.plate-nav.nx{right:9px}
.plate-nav:disabled{display:none}
.plate-dots{
  display:flex;gap:5px;justify-content:center;
  padding:9px;border-top:1px solid var(--rule2);
  background:var(--paper);
}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--rule);border:none;padding:0;cursor:pointer;
  transition:background .14s,transform .14s;
}
.dot:hover{background:var(--ink3)}
.dot.on{background:var(--cc);transform:scale(1.4)}

/* ── Dossier ── */
.dossier{min-width:0}

.crest{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  font-size:12.5px;color:var(--ink2);
  padding-bottom:7px;margin-bottom:11px;
  border-bottom:1px solid var(--rule);
}
.crest .tag{
  color:var(--ct);font-weight:600;
}
.crest .ref{
  margin-left:auto;
  color:var(--ink3);font-variant-numeric:tabular-nums;
}

h2.common{
  font-family:var(--serif);
  font-size:clamp(29px,4.4vw,42px);
  font-weight:400;line-height:1.08;
  letter-spacing:-.016em;
}
p.binomial{
  font-family:var(--serif);
  font-style:italic;
  font-size:clamp(17px,2.3vw,21px);
  font-weight:300;
  color:var(--ink2);
  margin-top:5px;line-height:1.3;
}
p.taxon{
  font-size:13.5px;color:var(--ink2);
  margin-top:9px;line-height:1.5;
}

.gauge{
  display:flex;align-items:center;gap:9px;
  margin-top:15px;padding-top:13px;
  border-top:1px solid var(--rule2);
  font-size:12.5px;color:var(--ink2);
}
.bars{display:flex;gap:2.5px}
.bar{width:16px;height:5px;border-radius:1px;background:var(--rule)}
.bar.lit{background:var(--cc)}
.gauge b{color:var(--ink);font-weight:500}

/* Bloques de contenido */
.blk{margin-top:24px}
.blk-h{
  font-size:11.5px;font-weight:600;
  color:var(--ink3);
  letter-spacing:.02em;
  margin-bottom:6px;
}
.blk-b{font-size:15px;line-height:1.62}

/* La clave es el dato central */
.keyline{
  font-family:var(--serif);
  font-size:clamp(17.5px,2.5vw,20.5px);
  line-height:1.46;font-weight:300;
  padding:17px 19px;
  background:var(--paper);
  border:1px solid var(--rule);
  border-left:4px solid var(--cc);
  border-radius:3px;
  margin-top:20px;
}

/* Mnemónico — nota al margen */
.mnem{
  margin-top:17px;
  padding:14px 17px;
  background:var(--cf);
  border-radius:3px;
  font-size:14.5px;line-height:1.6;
  color:var(--ct);
}
.mnem-h{
  font-size:11.5px;font-weight:600;
  opacity:.75;margin-bottom:4px;
}

/* Pruebas y confusión — estructura real del campo notes */
.probe{
  margin-top:17px;
  border:1px solid var(--rule);
  border-radius:3px;
  overflow:hidden;
  background:var(--paper);
}
.probe-h{
  padding:9px 16px;
  background:var(--ground);
  border-bottom:1px solid var(--rule);
  font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.probe-h .mark{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
}
.probe-b{padding:14px 16px;font-size:14.5px;line-height:1.65}
.probe-b ol{margin:0;padding-left:19px}
.probe-b li{margin-bottom:7px}
.probe-b li:last-child{margin-bottom:0}
.probe-b p{margin-bottom:9px}
.probe-b p:last-child{margin-bottom:0}
.probe-b .vs{
  display:block;
  padding:9px 0 9px 13px;
  border-left:2px solid var(--rule);
  margin-bottom:9px;
}
.probe-b .vs:last-child{margin-bottom:0}
.probe-b .vs b{font-weight:600;font-style:italic}

.etym{
  margin-top:17px;
  font-size:13.5px;line-height:1.6;
  color:var(--ink2);
  padding-left:13px;
  border-left:2px solid var(--rule);
}
.hab{
  margin-top:22px;padding-top:15px;
  border-top:1px solid var(--rule);
  font-size:13.5px;line-height:1.6;color:var(--ink2);
}
.hab b{color:var(--ink);font-weight:500}

/* ── Navegación inferior fija ── */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--paper);
  border-top:1px solid var(--rule);
}
.foot-in{
  max-width:1240px;margin:0 auto;
  padding:9px 18px;
  display:flex;align-items:center;gap:10px;
}
.step{
  flex:1;
  background:var(--paper);
  border:1px solid var(--rule);border-radius:3px;
  padding:10px 16px;
  font-family:inherit;font-size:14.5px;font-weight:500;
  color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:border-color .14s,background .14s;
}
.step:hover:not(:disabled){border-color:var(--cc);background:var(--ground)}
.step:disabled{opacity:.32;cursor:default}
.step.fwd{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.step.fwd:hover:not(:disabled){background:var(--cc);border-color:var(--cc)}
.hint{
  font-size:12px;color:var(--ink3);
  flex-shrink:0;
}
@media(max-width:620px){.hint{display:none}}

/* ══════════════════════════════════════════════════════════════════════════
   MÓVIL — la ficha se maneja con el pulgar: la placa se limita en altura para
   que el nombre y el carácter diagnóstico entren en la primera pantalla, la
   navegación entre ejemplares se hace deslizando, y los controles crecen
   hasta un tamaño pulsable.
   ══════════════════════════════════════════════════════════════════════════ */
@media(max-width:760px){
  body{font-size:15.5px}

  /* ── Selector ── */
  #selector{padding:calc(var(--sat) + 22px) calc(16px + var(--sal)) 64px calc(16px + var(--sar))}
  .masthead{margin-bottom:26px}
  .tally{gap:18px;font-size:12.5px}
  .cats{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:26px}
  .cat{padding:13px 13px;min-height:76px}
  .cat-n{font-size:17px}
  .cat-c{font-size:12px}
  .sub{padding:9px 15px;font-size:14px}
  #subs{margin-bottom:26px}
  .launch{
    position:sticky;bottom:0;
    margin:0 calc(-16px - var(--sal)) calc(-64px - var(--sab));
    padding:14px calc(16px + var(--sal)) calc(14px + var(--sab));
    background:var(--paper);
    border-top:1px solid var(--rule);
    flex-direction:column;align-items:stretch;gap:8px;
  }
  .go{width:100%;padding:15px;font-size:16px}
  .go-note{text-align:center}

  /* ── Barra superior ── */
  .topbar-in{padding:calc(var(--sat) + 7px) calc(12px + var(--sal)) 7px calc(12px + var(--sar));gap:8px}
  .back{font-size:0;padding:8px 10px 8px 0}
  .back::before{content:'\2039';font-size:22px;line-height:1}
  .trail{font-size:12.5px}
  .pg-btn{display:none}
  .pg-n{
    font-size:12.5px;padding:4px 10px;
    background:var(--ground);border-radius:20px;
  }

  /* ── Cuerpo ── */
  .sheet-body{padding:14px calc(15px + var(--sal)) calc(88px + var(--sab)) calc(15px + var(--sar))}

  /* ── Placa: altura limitada, controles siempre visibles ── */
  .plate-img{min-height:0}
  .plate-img img{max-height:36vh}
  .plate-nav{
    opacity:1;
    width:40px;height:40px;font-size:19px;
    background:rgba(24,28,25,.55);
  }
  .plate-nav.pv{left:7px}
  .plate-nav.nx{right:7px}
  .plate-empty{padding:34px 20px;font-size:13px}
  .plate-dots{padding:11px}
  .dot{width:9px;height:9px}
  .plate-expand{display:flex}

  /* ── Dossier ── */
  .crest{font-size:12px}
  h2.common{font-size:27px}
  p.binomial{font-size:16.5px}
  p.taxon{font-size:13px}
  .keyline{
    font-size:17px;padding:15px 16px;
    margin-top:17px;
  }
  .mnem{padding:13px 15px;font-size:14px}
  .probe-h{padding:11px 15px;font-size:12.5px}
  .probe-b{padding:13px 15px;font-size:14px}
  .probe-b ol{padding-left:17px}
  .blk{margin-top:20px}
  .blk-b{font-size:14.5px}
  .etym,.hab{font-size:13px}

  /* ── Pie de navegación ── */
  .foot-in{
    padding:9px calc(12px + var(--sal)) calc(9px + var(--sab)) calc(12px + var(--sar));
    gap:8px;
  }
  .step{padding:14px 12px;font-size:15px;min-height:48px}
}

/* Móvil estrecho */
@media(max-width:380px){
  .cats{grid-template-columns:1fr}
  h2.common{font-size:24.5px}
  .keyline{font-size:16px}
}

/* Apaisado en móvil: recuperar las dos columnas */
@media(max-width:900px) and (orientation:landscape) and (min-width:640px){
  .sheet-body{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px}
  .plate{position:sticky;top:56px}
  .plate-img img{max-height:64vh}
}

/* ── Placa a pantalla completa (toque en la imagen) ── */
.plate-expand{
  display:none;
  position:absolute;right:8px;bottom:8px;
  width:34px;height:34px;border-radius:3px;
  background:rgba(24,28,25,.55);color:#fff;
  border:none;cursor:pointer;
  align-items:center;justify-content:center;
  font-size:15px;line-height:1;
}
#lightbox{
  display:none;
  position:fixed;inset:0;z-index:60;
  background:rgba(16,19,17,.96);
  flex-direction:column;
  padding:calc(var(--sat) + 8px) 8px calc(var(--sab) + 8px);
}
#lightbox.on{display:flex}
#lightbox .lb-top{
  display:flex;align-items:center;justify-content:space-between;
  color:#fff;font-size:13.5px;padding:4px 8px 10px;
}
#lightbox .lb-close{
  background:none;border:none;color:#fff;
  font-size:26px;line-height:1;cursor:pointer;
  width:44px;height:44px;
}
#lightbox .lb-img{
  flex:1;display:flex;align-items:center;justify-content:center;
  min-height:0;
}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain}
#lightbox .lb-dots{display:flex;gap:7px;justify-content:center;padding:12px}
#lightbox .lb-dots .dot{width:9px;height:9px;background:rgba(255,255,255,.3)}
#lightbox .lb-dots .dot.on{background:#fff}

</style>
</head>
<body>

<!-- ════ SELECTOR ════ -->
<main id="selector">
  <header class="masthead">
    <h1>Fichas de <em>espécimen</em></h1>
    <p>Toda la información de cada ejemplar en una sola vista: carácter diagnóstico, pruebas de campo, pares de confusión, etimología y notas de examen.</p>
    <div class="tally" id="tally"></div>
  </header>

  <h2 class="field-label">Categoría</h2>
  <div class="cats" id="cats"></div>

  <div id="subs">
    <h2 class="field-label" id="subs-h"></h2>
    <div class="sub-row" id="sub-row"></div>
  </div>

  <div class="launch">
    <button class="go" id="go" disabled>Abrir fichas</button>
    <span class="go-note" id="go-note">Elige una categoría para empezar</span>
  </div>
</main>

<!-- ════ FICHA ════ -->
<div id="sheet">
  <div class="topbar">
    <div class="topbar-in">
      <button class="back" id="back">&#8249;&nbsp; Categorías</button>
      <div class="trail" id="trail"></div>
      <div class="pager">
        <button class="pg-btn" id="pv">&#8249;</button>
        <span class="pg-n" id="pgn"></span>
        <button class="pg-btn" id="nx">&#8250;</button>
      </div>
    </div>
    <div class="rail"><div class="rail-fill" id="rail"></div></div>
  </div>

  <div class="sheet-body">
    <aside class="plate" id="plate"></aside>
    <section class="dossier" id="dossier"></section>
  </div>

  <div class="foot">
    <div class="foot-in">
      <button class="step" id="fpv">&#8249;&nbsp; Anterior</button>
      <span class="hint">Navega con &#8592; &#8594;</span>
      <button class="step fwd" id="fnx">Siguiente &nbsp;&#8250;</button>
    </div>
  </div>
</div>

<!-- ════ IMAGEN A PANTALLA COMPLETA ════ -->

const SCRIPT='https://script.google.com/macros/s/AKfycbxe6iZALYLb94DiZAk4KoxvXYvDeza_vJuUgOsAQxX4WhGFb4fO0l_Ob5nKyFRZ4s0L8g/exec';
const CARDS=[{"id":"FOS-002","cat":"Geología","sub":"Fósil","name":"Belemnites","sci":"Belemnitida (orden)","fam":"Molusco cefalópodo — fósil guía Mesozoico","freq":"alta","key":"Forma cilíndrica o de bala con punta aguda — único entre cefalópodos fósiles","mnem":"La 'bala de cañón de la prehistoria': cilindro apuntado, pesado y sólido — el ammonites que no se enrolló","etym":"Del griego 'belemnon' (dardo, flecha): por su forma","notes":"Fósil guía del Mesozoico. El rostro (lo que se conserva) es la parte más distal. En corte transversal muestra fibras radiales de calcita.","hab":"","catf":"geología","subf":"fósil","base":"Belemnitida"},{"id":"FOS-003","cat":"Geología","sub":"Fósil","name":"Nummulites","sci":"Nummulites (género)","fam":"Foraminífero — fósil guía Eoceno","freq":"media","key":"Forma de moneda o lenteja: circular y plana con espiral interna visible en corte","mnem":"La 'moneda de piedra del Eoceno': circular, plana y con espiral. Las pirámides de Egipto están hechas de ellos","etym":"Del latín 'nummus' (moneda) + '-ites' (fósil): 'moneda petrificada'","notes":"Fósil guía del Eoceno (Paleógeno). Las pirámides de Guiza están construidas con caliza nummulítica. Si el fósil es redondo, plano y del tamaño de una moneda, es nummulites.","hab":"","catf":"geología","subf":"fósil","base":"Nummulites"},{"id":"FOS-005","cat":"Geología","sub":"Fósil","name":"Graptolites","sci":"Graptolithina (subclase)","fam":"Hemicordado colonial — fósil guía Ordovícico-","freq":"media","key":"Aspecto de 'sierra' o 'peinilla': serie de tazas (tecas) a lo largo de un eje (estipe)","mnem":"Los 'jeroglíficos negros en pizarra': rayas negras finas con dientes de sierra. El número de filas de dientes = el período","etym":"Del griego 'graptos' (escrito) + 'lithos' (piedra): 'escritura en piedra'","notes":"Fósil guía de alta precisión para Ordovícico y Silúrico. 2 estipes = Ordovícico; 1 estipe = Silúrico. La orientación de los estipes también varía entre géneros.","hab":"","catf":"geología","subf":"fósil","base":"Graptolithina"},{"id":"FOS-006","cat":"Geología","sub":"Fósil","name":"Trilobites","sci":"Trilobita (clase)","fam":"Artrópodo marino — fósil guía Paleozoico","freq":"muy_alta","key":"Cuerpo en 3 lóbulos longitudinales: axial (central) + 2 pleurales (laterales)","mnem":"La 'armadura de tres carriles': cabeza + cuerpo segmentado + cola, con la glabela (bulto central) siempre destacada","etym":"Del griego 'tri' (tres) + 'lobos' (lóbulo): por sus tres lóbulos","notes":"Fósil guía del Paleozoico completo. Saber géneros por período es evaluable. La exuvia (muda) es frecuente — no siempre es el animal completo.","hab":"","catf":"geología","subf":"fósil","base":"Trilobita"},{"id":"FOS-007","cat":"Geología","sub":"Fósil","name":"Equínidos fósiles","sci":"Echinoidea (clase)","fam":"Equinodermo — fósil guía","freq":"alta","key":"Caparazón calcáreo con 5 ambulacros en estrella en la cara superior","mnem":"El 'corazón de piedra del Cretácico': Micraster tiene forma inconfundible de corazón con ambulacros en estrella de 5 puntas","etym":"Del griego 'echinos' (erizo) + 'eidos' (forma)","notes":"Micraster = fósil guía del Cretácico superior. Clypeaster = Mioceno (Neógeno). Las espinas de Cidaris aparecen sueltas muy frecuentemente.","hab":"","catf":"geología","subf":"fósil","base":"Echinoidea"},{"id":"FOS-008","cat":"Geología","sub":"Fósil","name":"Crinoides","sci":"Crinoidea (clase)","fam":"Equinodermo — fósil guía","freq":"alta","key":"Discos apilados con orificio central (columnares): lo más frecuente como fósil","mnem":"Los 'botones de estrella de mar': apila discos de 5 puntas perforados — son vértebras de lirio de mar","etym":"Del griego 'krinon' (lirio) + 'eidos' (forma): 'lirio de mar'","notes":"Los discos sueltos son los fósiles de crinoideos más comunes. La simetría 5 y el canal central son los rasgos diagnósticos. Muy frecuentes en calizas paleozoicas. Periodo: Ordovícico-Actualidad (máximo Paleozoico-Mesozoico). Los discos columnares de crinoides son fósiles guía útiles a escala de Era. No son fósiles guía de alta resolución temporal, pero son diagnósticos del Paleozoico marino somero.","hab":"","catf":"geología","subf":"fósil","base":"Crinoidea"},{"id":"FOS-009","cat":"Geología","sub":"Fósil","name":"Rudistas","sci":"Hippuritida (orden)","fam":"Molusco bivalvo — fósil guía Cretácico","freq":"media","key":"Valvas muy asimétricas: una cónica grande (fijada al sustrato) + una opercular plana","mnem":"El 'bivalvo cónico del Cretácico': una valva en cuerno (la grande) + una tapa plana (la pequeña). Constructores de arrecifes del Cretácico","etym":"Del latín 'rudis' (tosco) + '-ites': por la forma basta de sus valvas","notes":"Fósil guía del Cretácico. Las conchas cónicas grandes acumuladas en capas son diagnósticas. Sustituyeron a los corales como constructores de arrecifes en el Cretácico.","hab":"","catf":"geología","subf":"fósil","base":"Hippuritida"},{"id":"FOS-010","cat":"Geología","sub":"Fósil","name":"Corales rugosos","sci":"Rugosa (orden)","fam":"Cnidario — fósil guía Paleozoico","freq":"alta","key":"Forma cónica o cilíndrica con septos internos en disposición 4-radia (vs. 6-radia en modernos)","mnem":"El 'cuerno de coral antiguo': forma de cuerno de vaca con rayas horizontales. Patrón 4-radia en sección = siempre Paleozoico","etym":"Del latín 'rugosus' (arrugado): por la superficie rugosa exterior","notes":"Fósil guía del Paleozoico. Los rugosos se extinguieron en el Pérmico. Patrón 4-radia = Paleozoico (los corales actuales tienen 6-radia).","hab":"","catf":"geología","subf":"fósil","base":"Rugosa"},{"id":"FOS-011","cat":"Geología","sub":"Fósil","name":"Dientes de tiburón","sci":"Chondrichthyes (clase)","fam":"Vertebrado — pez cartilaginoso","freq":"alta","key":"Forma triangular con bordes serrados (denticulados) — diagnóstico inmediato","mnem":"El 'triángulo serrado marino': negro brillante con bordes como sierra — la firma de los tiburones a través de toda la historia geológica","etym":"Del griego 'karcharias' (diente afilado) + 'odous' (diente)","notes":"Muy reconocibles visualmente. El tamaño permite estimar la especie: Otodus megalodon (Mioceno) = hasta 18 cm; Carcharodon carcharias (actual) = 5-7 cm. Periodo: Cretácico-Actualidad (Otodus megalodon: Oligoceno-Plioceno; Carcharodon: Cretácico-Actualidad). No son fósiles guía en sentido estricto por su amplia distribución temporal, pero el tamaño orienta la edad: dientes >10 cm → probablemente Mioceno-Plioceno (Otodus megalodon) DIFERENCIACIÓN Otodus vs Carcharodon: Otodus (Eoceno-Mioceno, ~56-3.6 Ma) — dientes más grandes y triangulares con cúspides laterales ('hombros') bien marcadas a los lados de la raíz; tamaño hasta 18 cm; bordes lisos o finamente serrados. Carcharodon (Cretácico-Actualidad) — dientes triangulares SIN cúspides laterales en adultos; borde finamente serrado en toda la longitud; C. megalodon (Mioceno-Plioceno) hasta 18 cm; C. carcharias actual hasta 6 cm. Regla práctica: ¿tiene 'hombros' laterales? → Otodus. ¿Sin hombros, serrado uniforme? → Carcharodon.","hab":"","catf":"geología","subf":"fósil","base":"Chondrichthyes"},{"id":"FOS-012","cat":"Geología","sub":"Fósil","name":"Bivalvos fósiles","sci":"Bivalvia (clase)","fam":"Molusco — fósil guía Mesozoico","freq":"alta","key":"Dos valvas SIMÉTRICAS entre sí (diferencia clave de braquiópodos que son asimétricas)","mnem":"La 'almeja de piedra con valva en garra': Gryphaea tiene una valva tan curvada que parece una garra — la 'uña del diablo'","etym":"Del latín 'bi' (dos) + 'valva' (hoja de puerta): concha de dos hojas","notes":"Gryphaea ('uña del diablo') muy frecuente en el Jurásico. La simetría de las valvas (iguales entre sí) es lo que distingue a los bivalvos de los braquiópodos. Periodo: Jurásico (Gryphaea: Triásico superior-Cretácico; Exogyra: Cretácico). Gryphaea arcuata es fósil guía del Jurásico inferior (Hettangiense-Sinemuriense). Exogyra es fósil guía del Cretácico. Útiles para datación a escala de Periodo.","hab":"","catf":"geología","subf":"fósil","base":"Bivalvia"},{"id":"FOS-013","cat":"Geología","sub":"Fósil","name":"Gasterópodos fósiles","sci":"Turritella (género)","fam":"Molusco — fósil guía Cenozoico","freq":"alta","key":"Turritella: concha muy alta y estrecha con espira larga puntiaguda — diagnóstica y muy frecuente","mnem":"El 'caracol de piedra puntiagudo': Turritella tiene la espira más alta y estrecha de todos los gasterópodos fósiles — como un cuerno larguísimo","etym":"Del griego 'gaster' (vientre) + 'pous' (pie): 'pie-vientre'","notes":"Turritella es uno de los más frecuentes en exámenes por ser abundantísimo en el Neógeno ibérico y muy reconocible. La espira muy alta y estrecha es inconfundible. Periodo: Cretácico-Actualidad (Turritella: Eoceno-Actualidad, máximo Neógeno). No es fósil guía estricto por su larga duración, pero es muy abundante y diagnóstico del Neógeno ibérico (Mioceno-Plioceno marino).","hab":"","catf":"geología","subf":"fósil","base":"Turritella"},{"id":"FOS-014","cat":"Geología","sub":"Fósil","name":"Corales tabulados","sci":"Tabulata (orden)","fam":"Cnidario colonial — fósil guía Paleozoico","freq":"alta","key":"Favosites: conjunto de pequeños tubos hexagonales (panal de abejas) — diagnóstico absoluto","mnem":"El 'panal de abejas pétreo': hexágonos perfectos como los de las abejas pero en roca del Paleozoico — solo puede ser Favosites","etym":"Del latín 'tabula' (tabla, plano): por las tabulas horizontales internas","notes":"Fósil guía del Paleozoico (Ordovícico-Pérmico). Favosites con su panal es inconfundible. Halysites tiene aspecto de cadena de eslabones.","hab":"","catf":"geología","subf":"fósil","base":"Tabulata"},{"id":"FOS-015","cat":"Geología","sub":"Fósil","name":"Fusulínidos","sci":"Fusulinida (orden)","fam":"Foraminífero — fósil guía Carbonífero-Pérmico","freq":"media","key":"Forma de grano de arroz o huso (fusiforme) con enrollamiento interno complejo","mnem":"El 'grano de arroz de piedra': pequeños, ovalados y con espiral interna — el fósil guía del Pérmico que parece un grano de cereal","etym":"Del latín 'fusus' (huso): por su forma fusiforme","notes":"Excelente fósil guía del Carbonífero-Pérmico. En corte pulido la espiral laberíntica interna es perfectamente visible y diagnóstica.","hab":"","catf":"geología","subf":"fósil","base":"Fusulinida"},{"id":"FOS-016","cat":"Geología","sub":"Fósil","name":"Icnofósiles","sci":"Icnofósil","fam":"Traza fósil — icnofósil","freq":"media","key":"No es el organismo sino su actividad: galerías, madrigueras, huellas, excrementos","mnem":"Los 'garabatos de la prehistoria': formas ramificadas o tubulares en la roca que ningún proceso abiótico produce igual","etym":"Del griego 'ichnos' (huella, rastro): señales de actividad biológica fosilizadas","notes":"Pueden aparecer en cortes de roca. Icnofacies = conjunto de icnofósiles que indica el ambiente de deposición. Importante como herramienta paleoambiental. Periodo: varían según el icnofósil — Cruziana: Cámbrico-Devónico; Ophiomorpha: Cretácico-Actualidad; Chondrites: Ordovícico-Actualidad. Los icnofósiles son mejores indicadores de paleoambiente que de edad. Icnofacies de Cruziana → ambiente marino somero.","hab":"","catf":"geología","subf":"fósil","base":"Icnofósil"},{"id":"FOS-017","cat":"Geología","sub":"Fósil","name":"Madera fósil","sci":"Xilopalo","fam":"Planta fósil","freq":"media","key":"Aspecto de madera pero peso y dureza de la roca (sílice reemplazó a la celulosa)","mnem":"La 'madera de piedra': tiene textura y anillos de árbol perfectamente visibles pero es tan dura y pesada como una roca — la conservación más perfecta de un vegetal","etym":"Del latín 'silicatus' (de sílice): madera convertida en sílice por permineralización","notes":"Los anillos de crecimiento permiten hacer dendrocronología fósil. La textura de madera visible con dureza mineral son los rasgos diagnósticos combinados. Periodo: desde el Devónico (primeros bosques) hasta el Cuaternario. No es fósil guía por su amplísima distribución temporal. Su valor paleontológico está en indicar presencia de vegetación terrestre y reconstrucción de paleoambientes.","hab":"","catf":"geología","subf":"fósil","base":"Xilopalo"},{"id":"FOS-018","cat":"Geología","sub":"Fósil","name":"Nautilus","sci":"Nautiloidea (subclase)","fam":"Molusco cefalópodo — fósil guía Paleozoico-Me","freq":"media","key":"Suturas simples y lisas o ligeramente curvadas (vs. fractales del ammonites)","mnem":"El 'primo simple del ammonites': misma espiral (o recto) pero sus líneas de sutura son curvas suaves, nunca en sierra. Orthoceras = como un colmillo cónico con anillos","etym":"Del griego 'nautilos' (marinero): por su concha flotante","notes":"Orthoceras muy frecuente en mármoles pulidos decorativos (se vende como adorno). Las suturas simples distinguen inequívocamente de los ammonites. Periodo: Nautiloidea: Cámbrico-Actualidad (máximo Paleozoico). Orthoceras: Ordovícico-Devónico. Orthoceras es un buen fósil guía del Paleozoico medio (Ordovícico-Devónico) por su corta duración. Las suturas simples (ortocónicas, sin lóbulos) son diagnósticas.","hab":"","catf":"geología","subf":"fósil","base":"Nautiloidea"},{"id":"FOS-019","cat":"Geología","sub":"Fósil","name":"Ammonites jurásico","sci":"Dactylioceras (género)","fam":"Ammonites — fósil guía Jurásico inferior (Toa","freq":"alta","key":"Concha enrollada con costillas rectas y robustas que se bifurcan en la mitad del flanco","mnem":"El 'ammonites de los dedos': costillas que se bifurcan a la mitad del flanco como los dedos de una mano — el ammonites más reconocible del Jurásico inferior","etym":"Dactylioceras (gr.) = daktylos (dedo) + keras (cuerno): 'cuerno con dedos' — por la bifurcación de las costillas","notes":"Dactylioceras es el ammonites más fácil de identificar a nivel de género. La bifurcación de costillas + ausencia de quilla son inconfundibles. Muy frecuente en colecciones de IES. Periodo: Jurásico inferior (Toarciense, ~182-174 Ma). Dactylioceras communis es excelente fósil guía del Toarciense (Jurásico inferior), con distribución cosmopolita y ampliamente usado en bioestratigrafía. Alta resolución temporal → fósil guía de primer orden.","hab":"","catf":"geología","subf":"fósil","base":"Dactylioceras"},{"id":"FOS-020","cat":"Geología","sub":"Fósil","name":"Ammonites triásico","sci":"Ceratites (género)","fam":"Ammonites ceratítico — fósil guía Triásico me","freq":"alta","key":"Sutura ceratítica: lóbulos redondeados (simples) y sillas dentadas en zigzag simple","mnem":"El 'ammonites del zigzag medio': la sutura con dientes simples (ni fractal ni totalmente lisa) es el estadio intermedio — Triásico siempre","etym":"Ceratites (gr.) = keras (cuerno): 'con forma de cuerno' + el sufijo '-ites' (fósil)","notes":"Herramienta de identificación perfecta: sutura ceratítica = inmediatamente Triásico. Aprender las 3 tipos de sutura (goniatítica/ceratítica/ammonítica) es un must del visu de geología. Ceratites nodosus es fósil guía del Triásico Medio (Anisiense-Ladiniense, ~247-237 Ma) con distribución en el Tethys. La sutura ceratítica (lóbulos subdivididos, sillas simples) es el carácter diagnóstico más útil para identificar el Triásico.","hab":"","catf":"geología","subf":"fósil","base":"Ceratites"},{"id":"FOS-022","cat":"Geología","sub":"Fósil","name":"Braquiópodo alado","sci":"Spirifer (género)","fam":"Braquiópodo espiriférido — fósil guía Devónic","freq":"alta","key":"Forma característica con 'alas' laterales muy pronunciadas — diagnóstico inmediato","mnem":"El 'braquiópodo con alas de mariposa': las dos extensiones laterales (alas) son únicas en el reino fósil — si tiene alas y es bivalvo asimétrico, es Spirifer","etym":"Spirifer (lat.) = spira (espiral) + ferre (llevar): 'el que lleva espiral' — braquioforos en espiral internos","notes":"El más fácil de reconocer entre los braquiópodos. Las 'alas' laterales son tan llamativas que lo identifican al instante. Fósil guía del Devónico y Carbonífero inferior.","hab":"","catf":"geología","subf":"fósil","base":"Spirifer"},{"id":"FOS-024","cat":"Geología","sub":"Fósil","name":"Braquiópodo mesozoico","sci":"Terebratula (género)","fam":"Braquiópodo terebratúlido — fósil guía Mesozo","freq":"alta","key":"Forma oval o globosa lisa (sin costillas o con costillas suaves solamente)","mnem":"El 'braquiópodo con agujero redondo': el orificio circular perfectamente visible en el pico lo distingue de todos los demás. El braquiópodo del Mesozoico por excelencia","etym":"Terebratula (lat.) = terebra (taladro) + -ula (pequeño): 'pequeño taladro' — por el foramen circular","notes":"Terebratula es el braquiópodo más frecuente en el Jurásico y Cretácico. El foramen circular en el umbo es absolutamente diagnóstico del grupo. Pygope tiene una muesca adicional en la comisura. Periodo: Terebratula: Devónico-Actualidad, máximo en Jurásico-Cretácico. Los terebratúlidos son fósiles guía a escala de Periodo (géneros específicos de corta duración). Terebratula del Jurásico ibérico permite dataciones bioestratigráficas.","hab":"","catf":"geología","subf":"fósil","base":"Terebratula"},{"id":"FOS-025","cat":"Geología","sub":"Fósil","name":"Bivalvo cretácico","sci":"Inoceramus (género)","fam":"Molusco bivalvo — fósil guía Cretácico","freq":"alta","key":"Concha grande, con costillas concéntricas muy pronunciadas y regulares","mnem":"El 'bivalvo con costillas de acordeón': las costillas concéntricas muy marcadas + el interior prismático son inconfundibles. El bivalvo gigante del Cretácico","etym":"Inoceramus (gr.) = is (tendón, fuerza) + keramos (cerámica, concha): 'concha fuerte'","notes":"Fósil guía excelente del Cretácico. Los prismas de calcita (estructura nacarada) se conservan bien y son identificables. Muy utilizado en colecciones de IES.","hab":"","catf":"geología","subf":"fósil","base":"Inoceramus"},{"id":"FOS-027","cat":"Geología","sub":"Fósil","name":"Pectínido fósil","sci":"Pectinida (orden)","fam":"Molusco bivalvo — fósil guía Neógeno","freq":"alta","key":"Concha semicircular con costillas radiales regulares y 'orejas' simétricas en el umbo","mnem":"La 'vieira de piedra': la forma semicircular con costillas radiales perfectas + orejas del umbo son exactamente la concha del Santiago — fósil y actual son casi idénticos","etym":"Pecten (lat.) = 'peine': por las costillas radiales que recuerdan las púas de un peine","notes":"El pectínido fósil es muy frecuente en colecciones por ser abundante en el Mioceno mediterráneo. La forma de 'concha de Santiago' es inmediatamente reconocible. Periodo: Triásico-Actualidad (Pecten: Mioceno-Actualidad; Chlamys: Eoceno-Actualidad). No son fósiles guía de alta resolución, pero Pecten jacobaeus en el Plioceno mediterráneo sí tiene valor bioestratigráfico. Muy abundantes en el Neógeno ibérico.","hab":"","catf":"geología","subf":"fósil","base":"Pectinida"},{"id":"FOS-030","cat":"Geología","sub":"Fósil","name":"Erizo protuberante","sci":"Clypeaster (género)","fam":"Equinodermo irregular — fósil guía Neógeno","freq":"alta","key":"Forma de galleta o pastel aplanado: circular a oval con cara dorsal ligeramente convexa","mnem":"El 'erizo galleta': plano y redondo como una galleta, con 5 pétalos en la cara dorsal. Si lo agitas y suena, tiene los pilaritos calcáreos dentro","etym":"Clypeaster (lat.) = clypeus (escudo) + aster (estrella): 'estrella-escudo'","notes":"Muy frecuente en el Mioceno mediterráneo ibérico. Aparece frecuentemente en costas y afloramientos de margas miocenas. La forma de galleta + pétalos son diagnósticos. Periodo: Eoceno-Actualidad (máximo abundancia en Mioceno mediterráneo). Clypeaster altus es fósil guía del Mioceno mediterráneo. Muy útil para datar afloramientos neógenos ibéricos. Fósil guía de resolución media (Mioceno).","hab":"","catf":"geología","subf":"fósil","base":"Clypeaster"},{"id":"FOS-031","cat":"Geología","sub":"Fósil","name":"Erizo regular","sci":"Cidaroida (orden)","fam":"Equinodermo regular — fósil guía Triásico-Act","freq":"alta","key":"Tubérculos primarios muy grandes y prominentes en el caparazón (para insertar las espinas)","mnem":"El 'erizo con espinas de bastón': las espinas sueltas de Cidaris son como bastoncitos cilíndricos con cuello — aparecen solas con mucha frecuencia en la roca","etym":"Cidaris (gr./lat.) = 'tiara, corona': por el aspecto del caparazón con tubérculos coroniformes","notes":"Las espinas sueltas son el fósil de Cidaris más frecuente (el caparazón se desintegra, pero las espinas aisladas se conservan bien). Reconocer una espina de Cidaris como tal es evaluable. Periodo: Triásico-Actualidad (Cidaroida). No son fósiles guía de alta resolución por su larga duración evolutiva. Sin embargo, los géneros específicos del Jurásico (Rhabdocidaris) y Cretácico (Cidaris) tienen valor bioestratigráfico a nivel de Periodo.","hab":"","catf":"geología","subf":"fósil","base":"Cidaroida"},{"id":"FOS-032","cat":"Geología","sub":"Fósil","name":"Rastro de trilobites","sci":"Cruziana (género)","fam":"Traza fósil — icnofósil Paleozoico","freq":"media","key":"Surco bilobado alargado con estriaciones en V simétricas a ambos lados","mnem":"La 'huella de trilobites en el barro': el surco bilobado con marcas en V simétricas es exactamente lo que un trilobites deja al excavar el sedimento","etym":"Cruziana = del explorador Andrés de Santa Cruz (Bolivia); descrita por d'Orbigny en 1842","notes":"Cruziana es el icnofósil más famoso del Paleozoico. La icnofacies de Cruziana indica ambiente submareal somero (aguas tranquilas). Siempre en Paleozoico inferior.","hab":"","catf":"geología","subf":"fósil","base":"Cruziana"},{"id":"FOS-034","cat":"Geología","sub":"Fósil","name":"Helecho fósil","sci":"Neuropteris (género)","fam":"Pteridosperma — flora fósil Carbonífero","freq":"alta","key":"Fronde pinnada con pínnulas ovales a redondeadas de bordes enteros","mnem":"El 'helecho gordo de nervios curvados': pínnulas ovales con nervio central prominente y nervios curvados — las más redondeadas de la flora carbonífera","etym":"Neuropteris (gr.) = neuron (nervio) + pteris (helecho): 'helecho de nervios' — por la nervación prominente","notes":"Neuropteris es la planta fósil del Carbonífero más frecuente en colecciones. Técnicamente es una pteridosperma (helecho con semillas) no un helecho verdadero. La nervación pinnada con nervio central es diagnóstica.","hab":"","catf":"geología","subf":"fósil","base":"Neuropteris"},{"id":"FOS-036","cat":"Geología","sub":"Fósil","name":"Equiseto arborescente","sci":"Calamites (género)","fam":"Equisetopsida arborescente — flora fósil Carb","freq":"alta","key":"Molde del interior del tallo: cilíndrico con nudos transversales y surcos longitudinales regulares","mnem":"El 'bambú gigante de piedra del Carbonífero': molde cilíndrico con costillas y nudos — el pariente gigante de la cola de caballo actual","etym":"Calamites (gr.) = calamos (caña, calambre): 'gran caña fósil'","notes":"Los moldes de Calamites son muy frecuentes en el Carbonífero. La comparación con Equisetum (cola de caballo actual) es didácticamente muy útil y evaluable: misma estructura pero escala completamente diferente.","hab":"","catf":"geología","subf":"fósil","base":"Calamites"},{"id":"FOS-037","cat":"Geología","sub":"Fósil","name":"Licopodio arbóreo","sci":"Lepidodendron (género)","fam":"Licopodio arborescente — flora fósil Carboníf","freq":"muy_alta","key":"Corteza con cicatrices en forma de rombo (diamante) dispuestas en espiral — diagnóstico absoluto","mnem":"El 'árbol con piel de serpiente de rombos': el tronco cubierto de marcas romboidales perfectamente ordenadas en espiral es absolutamente único en el registro fósil","etym":"Lepidodendron (gr.) = lepis (escama) + dendron (árbol): 'árbol escamoso' — por las cicatrices romboidales","notes":"Las cicatrices romboidales son el fósil vegetal más fácil de identificar. Imprescindible. Pariente del Lycopodium actual pero a escala de árbol. El 'árbol escamoso' del Carbonífero.","hab":"","catf":"geología","subf":"fósil","base":"Lepidodendron"},{"id":"FOS-038","cat":"Geología","sub":"Fósil","name":"Licopodio con surcos","sci":"Sigillaria (género)","fam":"Licopodio arborescente — flora fósil Carboníf","freq":"alta","key":"Cicatrices foliares en surcos verticales paralelos (vs. espirales en Lepidodendron)","mnem":"El 'árbol con sellos en columnas': cicatrices en filas verticales perfectas (como sellos en un rollo) — diferencia clave de Lepidodendron (cicatrices en espiral)","etym":"Sigillaria (lat.) = sigillum (sello, estampilla): 'árbol sello' — por las cicatrices que parecen sellos","notes":"Par de estudio obligatorio con Lepidodendron. La diferencia es la organización de las cicatrices: Lepidodendron = espiral diagonal; Sigillaria = columnas verticales. Ambas son licopodios arbóreos del Carbonífero.","hab":"","catf":"geología","subf":"fósil","base":"Sigillaria"},{"id":"FOS-043","cat":"Geología","sub":"Fósil","name":"Vértebra de ictiosaurio","sci":"Ichthyosauria (orden)","fam":"Reptil marino — fósil guía Triásico-Cretácico","freq":"alta","key":"Vértebra bicóncava (anficélica): ambas caras planas cóncavas — diagnóstico de ictiosaurio","mnem":"La 'vértebra de moneda bicóncava': circular, plana, con dos caras cóncavas — como dos cucharas enfrentadas. Si la vértebra de reptil es bicóncava, es ictiosaurio","etym":"Ichthyosaurus (gr.) = ichthys (pez) + sauros (lagarto): 'lagarto-pez' — por su aspecto convergente con los peces","notes":"Las vértebras bicóncavas de ictiosaurios son muy frecuentes en colecciones del Jurásico inferior (Toarciense). El carácter bicóncavo (anficélico) es la clave diagnóstica.","hab":"","catf":"geología","subf":"fósil","base":"Ichthyosauria"},{"id":"FOS-046","cat":"Geología","sub":"Fósil","name":"Caballo primitivo","sci":"Hipparion (género)","fam":"Mamífero ungulado — fósil guía Mioceno ibéric","freq":"alta","key":"Dientes hipsodontos (de corona alta) con patrón esmaltado en lazo complejo","mnem":"El 'caballo de tres dedos': si el fósil tiene dientes de caballo pero el hueso de la pata muestra 3 dedos (no 1 como los caballos actuales), es Hipparion — el caballo del Mioceno ibérico","etym":"Hipparion (gr.) = hippos (caballo) + -arion (pequeño): 'caballito'","notes":"MUY RELEVANTE para Madrid: Hipparion es el mamífero más característico del Mioceno de la cuenca del Tajo (donde está Madrid). Su aparición en Europa marca el inicio del Vallesiense (9-11 Ma). Los dientes hipsodontos + 3 dedos son diagnósticos.","hab":"","catf":"geología","subf":"fósil","base":"Hipparion"},{"id":"FOS-047","cat":"Geología","sub":"Fósil","name":"Molar de mastodonte","sci":"Proboscidea (orden)","fam":"Mamífero proboscídeo — fósil guía Neógeno-Cua","freq":"alta","key":"Molar de gran tamaño con crestas transversales (lophodontia) o colinas en mamut","mnem":"El 'molar de lavadora del Pleistoceno': las laminillas paralelas del mamut parecen las ondas de una lavadora de perfil — inconfundibles por su tamaño y patrón","etym":"Proboscidea (gr.) = proboskis (trompa): 'los de la trompa'","notes":"Los molares de mamut (Mammuthus) son muy frecuentes en colecciones del Pleistoceno. Las laminillas de esmalte paralelas de Mammuthus vs. las colinas de Gomphotherium son la diferencia diagnóstica clave. Periodo: Mammuthus (mamut): Plioceno-Pleistoceno (~5 Ma-10.000 años). Gomphotherium (mastodonte): Mioceno. Excelentes fósiles guía del Cenozoico: Gomphotherium → Mioceno; Mammuthus → Pleistoceno. Muy importantes para la Cuenca de Madrid (Mioceno continental).","hab":"","catf":"geología","subf":"fósil","base":"Proboscidea"},{"id":"FOS-056","cat":"Geología","sub":"Fósil","name":"Estromatolito","sci":"Estromatolito","fam":"Bioherma microbiano — el registro de vida más","freq":"alta","key":"Estructura laminada en capas convexas concéntricas (como una col cortada)","mnem":"La 'col de piedra de 3.500 millones de años': sección con capas concéntricas como una col o una cebolla — el registro de vida más antiguo del planeta","etym":"Stromatolite (gr.) = stroma (cama, tapete) + lithos (piedra): 'piedra tapete'","notes":"Los estromatolitos son el registro fósil más antiguo (Archaean, 3.500 Ma). Son construidos por comunidades de cianobacterias. El hecho de que produjeron el O₂ de la atmósfera es enormemente evaluable. Periodo: Precámbrico (3.500 Ma) hasta Actualidad. Son el registro biológico más antiguo conocido. No son fósiles guía en sentido clásico por su duración de 3.500 Ma, pero su abundancia marca el Precámbrico (especialmente el Arqueano y Proterozoico). Estromatolitos del Proterozoico son diagnósticos de ese Eón.","hab":"","catf":"geología","subf":"fósil","base":"Estromatolito"},{"id":"GEO-001","cat":"Geología","sub":"Geomorfología","name":"Karst / Lapiaz","sci":"Lapiaz (karren)","fam":"Relieve kárstico","freq":"alta","key":"Surcos y acanaladuras en superficie calcárea por disolución","mnem":"El 'queso gruyer de roca': agujeros, canales y surcos en caliza — el agua ácida esculpe la piedra calcárea","etym":"Del esloveno 'Kras' (región de Eslovenia): paisaje calcáreo de referencia","notes":"En Madrid el tribunal puede incluir fotografías de paisajes. Karst es uno de los más evaluados. Saber identificar: lapiaz, dolina, cueva, polje, surgencia.","hab":"","catf":"geología","subf":"geomorfología","base":"Karst"},{"id":"GEO-002","cat":"Geología","sub":"Geomorfología","name":"Meandro","sci":"Meandro fluvial","fam":"Relieve fluvial","freq":"alta","key":"Curva muy pronunciada de un río sobre llanura de inundación","mnem":"La 'serpiente de río': curvas pronunciadas que forman S y dejan lagunas en herradura al cortarse","etym":"Del griego 'Maiandros' (río Meandro, actual Büyük Menderes, Turquía)","notes":"Muy frecuente en fotografías de geomorfología del visu de Madrid. Saber identificar: meandro, llanura de inundación, oxbow lake, meandro encajado.","hab":"","catf":"geología","subf":"geomorfología","base":"Meandro"},{"id":"GEO-003","cat":"Geología","sub":"Geomorfología","name":"Glaciar / Circo glaciar","sci":"Circo glaciar (cwm)","fam":"Relieve glaciar","freq":"alta","key":"Depresión semicircular con paredes verticales en cabecera de valle glaciar","mnem":"El 'cuenco de montaña': depresión semicircular tallada por el hielo con paredes verticales y frecuentemente un lago azul en el fondo","etym":"Del latín 'circus' (círculo): por la forma redondeada","notes":"Muy evaluado en visu de geomorfología de Madrid. Formas glaciares frecuentes: circo, arista, horn (cuerno), valle en U, morrenas.","hab":"","catf":"geología","subf":"geomorfología","base":"Glaciar"},{"id":"GEO-004","cat":"Geología","sub":"Geomorfología","name":"Duna","sci":"Duna eólica (erg)","fam":"Relieve eólico","freq":"media","key":"Acumulación de arena modelada por el viento con perfil asimétrico","mnem":"La 'ola de arena congelada': perfil asimétrico — suave por donde entra el viento, escarpado por donde sale","etym":"Del holandés 'duin' (colina de arena)","notes":"Puede aparecer en fotografías. Saber diferenciar: barcán (medialuna, viento unidireccional), duna longitudinal, duna transversal.","hab":"","catf":"geología","subf":"geomorfología","base":"Duna"},{"id":"GEO-005","cat":"Geología","sub":"Geomorfología","name":"Delta fluvial","sci":"Delta fluvial","fam":"Relieve costero-fluvial","freq":"media","key":"Depósito sedimentario triangular a la desembocadura de un río","mnem":"La 'boca de río que gana terreno al mar': triángulo de sedimento que el río construye en el mar","etym":"De 'Delta' (Δ): letra griega de forma triangular, como los deltas del Nilo","notes":"Puede aparecer en fotografías satelitales. El delta del Ebro es el más reconocible de España.","hab":"","catf":"geología","subf":"geomorfología","base":"Delta"},{"id":"GEO-006","cat":"Geología","sub":"Geomorfología","name":"Rañas / Pedrera","sci":"Raña (glacis de acumulación)","fam":"Relieve periglaciar / Piedemonte","freq":"alta","key":"Superficie plana de piedemonte cubierta de cantos redondeados rojizos (cuarcitas)","mnem":"La 'moqueta roja de la sierra': superficie plana de piedras rojizas que alfombra el pie de la sierra — son rañas","etym":"Del español 'raña': zona pedregosa de piedemonte (término geomorfológico ibérico)","notes":"MUY ESPECÍFICO DE MADRID. Las rañas son características del piedemonte del Sistema Central (Comunidad de Madrid). Un tribunal madrileño puede incluir una foto de raña en el visu.","hab":"","catf":"geología","subf":"geomorfología","base":"Ranas"},{"id":"GEO-007","cat":"Geología","sub":"Geomorfología","name":"Escarpe de falla","sci":"Escarpe de falla / Falla normal","fam":"Relieve tectónico","freq":"media","key":"Pared o escalón abrupto en el paisaje causado por un movimiento de falla","mnem":"El 'escalón de la sierra': el contacto vertical entre la sierra elevada y la llanura es una falla — la naturaleza tiene escalones","etym":"Del francés 'escarpement' (talud, declive abrupto)","notes":"El Sistema Central es un horst elevado por fallas normales — contexto geológico directo de Madrid. Puede aparecer en fotografías de geomorfología.","hab":"","catf":"geología","subf":"geomorfología","base":"Escarpe"},{"id":"GEO-008","cat":"Geología","sub":"Geomorfología","name":"Cárcavas / Badlands","sci":"Cárcava (gully erosion)","fam":"Relieve de erosión hídrica","freq":"media","key":"Red de barrancos y surcos muy pronunciados en terrenos blandos (arcillas, margas)","mnem":"El 'laberinto de barro': red de barranquitos en terreno blando — el agua lluvia 'lame' la arcilla hasta crear un laberinto","etym":"Del español 'cárcava' (barranco pequeño) y del inglés 'badlands' (tierras malas)","notes":"Frecuentes en la cuenca del Tajo (arcillas y margas miocenas). Pueden aparecer en fotografías del visu de Madrid.","hab":"","catf":"geología","subf":"geomorfología","base":"Carcavas"},{"id":"MIN-001","cat":"Geología","sub":"Mineral","name":"Cuarzo","sci":"Cuarzo (SiO₂)","fam":"Tectosílicato","freq":"muy_alta","key":"Brillo vítreo muy característico; fractura concoidea (como el vidrio roto)","mnem":"El mineral más abundante de la corteza: si brilla como vidrio y no lo raya la navaja, es cuarzo","etym":"Del alemán antiguo 'Quarz' (origen incierto, posiblemente eslavo 'tvrdý' = duro)","notes":"Sale en prácticamente todos los exámenes. Identificar variedad: hialino, lechoso, ahumado, rosa, amatista (violeta), citrino (amarillo). Puede aparecer también como componente en granito o cuarcita. PRUEBAS: (1) Raya la uña y el vidrio (dur.7). (2) Fractura concoidea al golpear — como vidrio roto. (3) Brillo vítreo intenso. (4) Sin reacción al HCl. CONFUSIÓN CON: Feldespato (ortosa/plagioclasa) — el cuarzo NO tiene clivaje, fractura concoidea; el feldespato sí tiene clivaje en dos direcciones. Vidrio artificial — el vidrio tiene el mismo brillo pero no tiene estructura cristalina. Calcita incolora — reacciona al HCl (cuarzo no).","hab":"","catf":"geología","subf":"mineral","base":"Cuarzo"},{"id":"MIN-002","cat":"Geología","sub":"Mineral","name":"Ortosa","sci":"Ortosa (KAlSi₃O₈)","fam":"Tectosílicato","freq":"muy_alta","key":"Color rosado-salmón o blanco cremoso muy característico","mnem":"La piedra 'salmón con espejos': color rosado y dos caras planas brillantes perpendiculares","etym":"Del griego 'orthos' (recto) + 'klasis' (fractura): fractura recta — dos clivajes a 90°","notes":"CONFIRMADO: aparece en 2 de cada 3 convocatorias de Madrid documentadas. Es el feldespato por excelencia del examen. Clave: color rosado + dos clivajes a 90°. Siempre pedir el grupo mineralógico: tectosílicato. PRUEBAS: (1) Color rosado-salmón característico. (2) Clivaje perfecto en 2 direcciones a ~90°. (3) Dureza 6: raya el vidrio pero no el cuarzo. (4) Extinción oblicua bajo microscopio (campo). CONFUSIÓN CON: Plagioclasa — la ortosa carece de estriación polisintética; color más rosado/salmón vs. blanco-grisáceo. Cuarzo rosado — el cuarzo NO tiene clivaje; la ortosa sí. Halita — sabor salado y dureza 2 (uña la raya) vs. dureza 6 de la ortosa.","hab":"","catf":"geología","subf":"mineral","base":"Ortosa"},{"id":"MIN-003","cat":"Geología","sub":"Mineral","name":"Plagioclasa","sci":"Plagioclasa (NaAlSi₃O₈ – CaAl₂Si₂O₈)","fam":"Tectosílicato","freq":"alta","key":"Color blanco-grisáceo o verdoso, menos rosado que la ortosa","mnem":"La feldespato 'rayado': las finas estrías paralelas en su cara brillante son únicas entre los feldespatos","etym":"Del griego 'plagios' (oblicuo) + 'klasis' (fractura): clivaje oblicuo","notes":"Puede confundirse con ortosa. La estriación polisintética (rayas paralelas bajo la lupa) es la clave diagnóstica. En colecciones de IES muy presente en gabros y basaltos. PRUEBAS: (1) Buscar estriación polisintética con lupa (rayitas paralelas en la superficie de clivaje): diagnóstico definitivo. (2) Color blanco-grisáceo o con tinte verdoso. (3) Clivaje a ~90°. CONFUSIÓN CON: Ortosa — la ortosa NO tiene estriación polisintética y es más rosada. Cuarzo blanco — sin clivaje, fractura concoidea. Wollastonita — también blanca y acicular pero en contexto metamórfico.","hab":"","catf":"geología","subf":"mineral","base":"Plagioclasa"},{"id":"MIN-004","cat":"Geología","sub":"Mineral","name":"Moscovita","sci":"Moscovita (KAl₂(AlSi₃)O₁₀(OH)₂)","fam":"Filosilicato","freq":"muy_alta","key":"Láminas flexibles y elásticas muy finas (exfoliación perfecta en una dirección)","mnem":"El mineral 'hoja de libro': se separa en láminas plateadas infinitamente delgadas","etym":"De 'Moscovia' (nombre antiguo de Rusia), donde se usaba como vidrio en ventanas","notes":"Uno de los más frecuentes. Muy habitual en colecciones de IES. Siempre diferenciar de biotita (oscura). Ambas pueden aparecer en el mismo examen. PRUEBAS: (1) Doblar una lámina: si es flexible y elástica (vuelve a su posición) = moscovita. (2) Color plateado o dorado muy pálido. (3) Transparente en láminas delgadas. (4) Exfoliación perfecta en UNA dirección. CONFUSIÓN CON: Biotita — misma forma pero color negro a marrón oscuro (biotita contiene Fe/Mg). Talco — similar al tacto pero no da láminas elásticas; más graso. Clorita — verde intenso; las láminas de clorita son menos elásticas.","hab":"","catf":"geología","subf":"mineral","base":"Moscovita"},{"id":"MIN-005","cat":"Geología","sub":"Mineral","name":"Biotita","sci":"Biotita (K(Mg,Fe)₃(AlSi₃)O₁₀(OH)₂)","fam":"Filosilicato","freq":"muy_alta","key":"Igual que moscovita pero color negro a marrón oscuro (por el hierro y magnesio)","mnem":"La mica 'negra': mismo comportamiento que la moscovita pero completamente oscura","etym":"Del físico francés Jean-Baptiste Biot (1774-1862), que estudió las propiedades ópticas de las micas","notes":"Par obligatorio con moscovita. Muy frecuente en granitos del Sistema Central — directamente relevante para Madrid. PRUEBAS: (1) Color negro a marrón oscuro + láminas flexibles y elásticas = biotita (no moscovita). (2) Exfoliación perfecta en una dirección. (3) Brillo submetálico en láminas. CONFUSIÓN CON: Moscovita — mismo hábito laminar pero incolora/plateada (sin Fe/Mg). Hornblenda — también negra pero sin exfoliación laminar; prismas con clivaje a 120°. Grafito — laminar y negro pero no elástico; mancha los dedos.","hab":"","catf":"geología","subf":"mineral","base":"Biotita"},{"id":"MIN-006","cat":"Geología","sub":"Mineral","name":"Calcita","sci":"Calcita (CaCO₃)","fam":"Carbonato","freq":"muy_alta","key":"Reacciona vivamente con HCl diluido (efervescencia — CO₂): prueba diagnóstica definitiva","mnem":"El mineral del 'vinagre': pon una gota de ácido y verás burbujas. El único que 'bulle' sin calor","etym":"Del latín 'calx' (cal): la cal viva se obtiene calcinando calcita","notes":"Siempre hay ácido disponible en el examen. Si hace burbujas + romboedros perfectos = calcita. Diferenciar de dolomita (reacción lenta o nula en frío). PRUEBAS: (1) Aplicar HCl diluido en frío: EFERVESCENCIA VIVA inmediata = calcita (definitivo). (2) Romboedros perfectos (clivaje en 3 dir. a 75°). (3) Dureza 3: raya el yeso, no raya el vidrio. CONFUSIÓN CON: Dolomita — misma reacción pero SOLO en polvo o con HCl caliente, no en frío. Aragonito — igual composición, reacciona al HCl pero cristales prismáticos (no romboedros). Yeso — no reacciona al HCl; dureza 2 (uña lo raya).","hab":"","catf":"geología","subf":"mineral","base":"Calcita"},{"id":"MIN-007","cat":"Geología","sub":"Mineral","name":"Dolomita","sci":"Dolomita (CaMg(CO₃)₂)","fam":"Carbonato","freq":"media","key":"Similar a la calcita pero reacciona solo en polvo o con HCl caliente","mnem":"La 'calcita remolona': misma forma pero el ácido en frío no burbujea casi nada","etym":"Del geólogo francés Déodat de Dolomieu (1750-1801)","notes":"La prueba del HCl en frío es la clave diferencial vs. calcita. A menudo en muestras de rocas dolomíticas. PRUEBAS: (1) HCl frío → NO burbujea (o muy débilmente). (2) Raspar en polvo y aplicar HCl → burbujea. (3) Cristales en silla de montar (curvados). (4) A menudo con tinte rosado o blanco cremoso. CONFUSIÓN CON: Calcita — la calcita burbujea vivamente al HCl en frío; la dolomita no. Aragonito — reacciona al HCl pero cristales prismáticos. Siderita — marrón-parda, tampoco reacciona al HCl frío pero sin cristales en silla de montar.","hab":"","catf":"geología","subf":"mineral","base":"Dolomita"},{"id":"MIN-008","cat":"Geología","sub":"Mineral","name":"Yeso","sci":"Yeso (CaSO₄·2H₂O)","fam":"Sulfato","freq":"alta","key":"Dureza 2: único mineral común que raya con la uña","mnem":"El único mineral que raya tu uña. Si lo rasca la yema del dedo, es yeso","etym":"Del árabe 'jibs' → latín 'gypsum'","notes":"La prueba de la uña es diagnóstica e inmediata. Muy abundante en el Mioceno de la cuenca del Tajo — directamente relevante para Madrid. PRUEBAS: (1) Rayar con la uña: si marca con facilidad = yeso (dur.2, única opción común). (2) Comprobar que NO reacciona al HCl (diferencia de calcita). (3) Variedades: selenita (transparente laminada), alabastro (masivo blanco), fibra de yeso (fibroso). CONFUSIÓN CON: Calcita — reacciona al HCl (el yeso no). Talco — también dur.1 pero aspecto graso/jabonoso y no laminar. Anhidrita — no la raya la uña (dur.3-3.5), mismo color pero más dura. Halita — forma cúbica y sabor salado.","hab":"","catf":"geología","subf":"mineral","base":"Yeso"},{"id":"MIN-009","cat":"Geología","sub":"Mineral","name":"Halita (sal gema)","sci":"Halita (NaCl)","fam":"Haluro","freq":"media","key":"Sabor salado inconfundible — si te dejan probarlo","mnem":"La 'piedra de sal': cubos perfectos y sabor salado. Si te dicen que no la chupes, ya sabes que es halita","etym":"Del griego 'hals' (sal) + 'lithos' (piedra)","notes":"Reconocible por su forma cúbica. Si no permiten probarla, la forma cúbica del clivaje es suficiente. PRUEBAS: (1) Si se puede: probar — sabor SALADO inconfundible. (2) Clivaje cúbico perfecto en 3 dir. a 90°: fragmentos siempre cúbicos. (3) Dureza 2.5: uña casi lo raya. (4) Transparente a translúcido. CONFUSIÓN CON: Silvita — misma forma cúbica pero sabor AMARGO/PICANTE (no salado). Fluorita — también cúbica pero mucho más dura (dur.4) y colores variados. Calcita incolora — clivaje romboédrico (no cúbico); reacciona al HCl.","hab":"","catf":"geología","subf":"mineral","base":"Halita"},{"id":"MIN-010","cat":"Geología","sub":"Mineral","name":"Pirita","sci":"Pirita (FeS₂)","fam":"Sulfuro","freq":"alta","key":"Color amarillo dorado metálico muy brillante — 'oro de tontos'","mnem":"El 'oro de los tontos': brilla como el oro pero es mucho más duro y sus caras tienen estrías cruzadas","etym":"Del griego 'pyr' (fuego): al golpearla produce chispas","notes":"Sale con frecuencia. Clave diferencial vs. oro: pirita = dura + cubos estriados. Colecciones de IES casi siempre la tienen. PRUEBAS: (1) Color amarillo dorado metálico brillante. (2) Dureza 6-6.5: raya el vidrio. (3) Raya negra o negra-verdosa (NO amarilla). (4) Cristales cúbicos o pentagonododecaédricos, a menudo estriados. CONFUSIÓN CON: Oro nativo — el oro es MALEABLE (se dobla con navaja), muy pesado (dens.19), raya amarilla. La pirita es dura y frágil. Calcopirita — más amarilla y verdosa, iridiscente, más blanda (dur.3.5-4). Marcasita — misma composición que pirita pero cristales tabulares.","hab":"","catf":"geología","subf":"mineral","base":"Pirita"},{"id":"MIN-011","cat":"Geología","sub":"Mineral","name":"Galena","sci":"Galena (PbS)","fam":"Sulfuro","freq":"media","key":"Gris metálico muy brillante con clivaje cúbico perfecto en 3 direcciones","mnem":"El mineral 'cubo de plomo': muy pesado, gris metálico y se parte en cubos perfectos","etym":"Del latín 'galena' (mineral de plomo), nombre ya usado por Plinio el Viejo","notes":"La densidad es la clave: si el ejemplar parece sorprendentemente pesado y es gris metálico, galena. Común en colecciones. PRUEBAS: (1) Gris metálico plomizo muy pesado (dens.7.6: sorprendente al coger). (2) Clivaje cúbico perfecto en 3 dir. (3) Raya gris-plomiza. (4) Dureza 2.5: uña casi lo raya. CONFUSIÓN CON: Molibdenita — también gris metálica pero laminar, muy blanda y mancha los dedos. Grafito — menos pesado, laminar, mancha. Arsenopirita — plateada más brillante, olor a ajo al rayar. Antimonio nativo — similar pero más raro.","hab":"","catf":"geología","subf":"mineral","base":"Galena"},{"id":"MIN-012","cat":"Geología","sub":"Mineral","name":"Cinabrio","sci":"Cinabrio (HgS)","fam":"Sulfuro","freq":"muy_alta","key":"Rojo vivo a rojo bermellón — el mineral rojo más llamativo de todos","mnem":"El 'rubí del diablo': rojo intenso y sorprendentemente pesado — si es rojo brillante y pesa mucho, cinabrio","etym":"Del griego 'kinnabari'. Principal mineral del mercurio","notes":"CONFIRMADO como el mineral más repetido en Madrid: aparece en 3 de cada 5 convocatorias documentadas. Inconfundible por su rojo intenso. Siempre indicar: sulfuro de mercurio (HgS). PRUEBAS: (1) Color rojo bermellón intenso: el rojo más vivo de todos los minerales comunes. (2) Raya roja brillante (confirma vs. hematites que da raya rojo-ladrillo). (3) Muy pesado (dens.8.1). (4) Dureza 2-2.5. CONFUSIÓN CON: Hematites — raya rojo-ladrillo (más oscura) vs. rojo bermellón del cinabrio. Color más negro o metálico en hematites. Realgar — también rojo-naranja pero más anaranjado. Crocoíta — rojo-naranja pero cristales prismáticos aciculares.","hab":"","catf":"geología","subf":"mineral","base":"Cinabrio"},{"id":"MIN-013","cat":"Geología","sub":"Mineral","name":"Magnetita","sci":"Magnetita (Fe₃O₄)","fam":"Óxido","freq":"media","key":"Negro metálico con raya negra","mnem":"El único mineral común que atrae un imán: negro y magnético = magnetita","etym":"De 'Magnesia', región de Tesalia (Grecia) donde se encontró por primera vez","notes":"La prueba del imán es diagnóstica. A veces acompaña a rocas máficas o aparece como arena negra magnética. PRUEBAS: (1) Acercar un imán: si es atraído = magnetita (diagnóstico definitivo). (2) Color negro metálico. (3) Raya negra. (4) Cristales octaédricos o masivo. CONFUSIÓN CON: Hematites — NO magnética (o débilmente); raya rojo-ladrillo. Cromita — también negra y pesada pero no magnética; en contexto de peridotitas. Ilmenita — no magnética; contexto ígneo máfico. Pirolusita — negra, mancha mucho los dedos.","hab":"","catf":"geología","subf":"mineral","base":"Magnetita"},{"id":"MIN-014","cat":"Geología","sub":"Mineral","name":"Hematites","sci":"Hematites (Fe₂O₃)","fam":"Óxido","freq":"media","key":"Raya rojo-bermellón inconfundible (aunque el mineral sea negro o gris metálico)","mnem":"El mineral que 'sangra' al rayar: por fuera puede ser negro pero su polvo siempre es rojo sangre","etym":"Del griego 'haima' (sangre): por el color rojo de su raya","notes":"La raya roja es la clave absoluta. Siempre se raya en el material de laboratorio. Diferenciar de magnetita por ausencia de magnetismo. PRUEBAS: (1) Rayar en placa de porcelana sin vidriar: raya ROJO-BERMELLÓN siempre, aunque el mineral sea negro o gris metálico. (2) Varios hábitos: especular (metálico), terroso (rojo), oolítico. CONFUSIÓN CON: Magnetita — magnetita es magnética y tiene raya NEGRA. Ilmenita — raya negra o gris oscura. Cinabrio — raya roja pero mucho más brillante y rojo-bermellón más vivo; muy pesado (dens.8.1).","hab":"","catf":"geología","subf":"mineral","base":"Hematites"},{"id":"MIN-015","cat":"Geología","sub":"Mineral","name":"Olivino","sci":"Olivino ((Mg,Fe)₂SiO₄)","fam":"Nesosílicato","freq":"media","key":"Color verde oliva característico (de ahí su nombre)","mnem":"Los 'guisantes verdes' del basalto: granos redondos de color oliva incrustados en roca oscura","etym":"Del latín 'oliva' (aceituna): por su color verde-amarillento","notes":"Casi siempre en contexto de basaltos o peridotitas. El color verde en roca oscura es la señal. PRUEBAS: (1) Color verde oliva a amarillo-verdoso. (2) Cristales granulares o masivo. (3) Dureza 6.5-7. (4) Contexto: en basaltos (vidriado o en xenolitos) o en peridotitas. CONFUSIÓN CON: Epidota — verde pero más amarillento y en contexto metamórfico; cristales prismáticos. Clorita — verde más oscuro, laminar y mucho más blando. Fluorita verde — cúbica, más blanda (dur.4). Diopsido (piroxeno verde) — similar pero clivaje a 90°.","hab":"","catf":"geología","subf":"mineral","base":"Olivino"},{"id":"MIN-016","cat":"Geología","sub":"Mineral","name":"Hornblenda (anfíbol)","sci":"Hornblenda (Ca₂(Mg,Fe,Al)₅(Al,Si)₈O₂₂(OH)₂)","fam":"Inosílicato (anfíbol)","freq":"media","key":"Negro a verde oscuro con dos clivajes a 120°/60° (ángulo diagnóstico)","mnem":"El '120 grados': si los clivajes forman un rombo (60/120°), es anfíbol","etym":"Del alemán 'Horn' (cuerno) + 'blende' (engañador)","notes":"La distinción anfíbol/piroxeno por ángulo de clivaje es un clásico de examen y puede preguntarse explícitamente. PRUEBAS: (1) Medir ángulo de clivaje: si los dos clivajes forman ~120° y ~60° = anfíbol. (2) Color negro a verde oscuro. (3) Cristales prismáticos alargados con sección hexagonal o romboidal. CONFUSIÓN CON: Augita (piroxeno) — también negra pero clivaje a 90° (ángulo recto). Biotita — laminar, sin clivaje a 120°. Turmalina — también prismática y negra pero sin clivaje; sección triangular.","hab":"","catf":"geología","subf":"mineral","base":"Hornblenda"},{"id":"MIN-017","cat":"Geología","sub":"Mineral","name":"Augita (piroxeno)","sci":"Augita (Ca(Mg,Fe,Al)(Al,Si)₂O₆)","fam":"Inosílicato (piroxeno)","freq":"media","key":"Negro a verde muy oscuro con dos clivajes a 90° (ángulo diagnóstico)","mnem":"El '90 grados': clivaje en ángulo recto — si los planos forman una cruz, es piroxeno (augita)","etym":"Del griego 'augé' (brillo): por su brillo vítreo","notes":"Par obligatorio con hornblenda. La regla del ángulo de clivaje es el recurso más evaluado en geología de minerales. PRUEBAS: (1) Medir ángulo de clivaje: si forman ~90° = piroxeno (augita). (2) Color negro a verde muy oscuro. (3) Cristales más cortos y compactos que la hornblenda. CONFUSIÓN CON: Hornblenda (anfíbol) — clivaje a 120° (no 90°); cristales más alargados. Biotita — laminar, elástica. Magnetita — no tiene clivaje; magnética. Turmalina — sección triangular; sin clivaje.","hab":"","catf":"geología","subf":"mineral","base":"Augita"},{"id":"MIN-018","cat":"Geología","sub":"Mineral","name":"Granada (almandino)","sci":"Granada (Fe₃Al₂(SiO₄)₃)","fam":"Nesosílicato","freq":"alta","key":"Cristales dodecaédricos perfectos (12 caras romboidales) muy característicos","mnem":"La 'semilla de granada' perfecta: cristales rojos en 12 caras, como si la naturaleza los hubiera tallado","etym":"Del latín 'granatum' (semilla de granada): por el parecido de sus cristales con las semillas del fruto","notes":"En examen suele aparecer en esquistos y gneis del Sistema Central. La forma dodecaédrica es inconfundible. Relevante para Madrid por la presencia de metamórficas en Guadarrama. PRUEBAS: (1) Buscar la forma dodecaédrica o icositetraédrica característica. (2) Color rojo, marrón o anaranjado (almandino). (3) Dureza 6.5-7.5. (4) Sin clivaje (fractura subconcoidea). CONFUSIÓN CON: Rubí (corindón rojo) — hexagonal; mayor dureza (9). Espinela roja — octaédrica. Granate espesartina — naranja-amarillo, misma forma. Almandino/piropo (otros granates) — diferencia solo en química.","hab":"","catf":"geología","subf":"mineral","base":"Granada"},{"id":"MIN-019","cat":"Geología","sub":"Mineral","name":"Talco","sci":"Talco (Mg₃Si₄O₁₀(OH)₂)","fam":"Filosilicato","freq":"media","key":"Dureza 1: el mineral más blando conocido (se raya con la uña SIN ESFUERZO)","mnem":"El mineral 'jabonoso': si lo tocas y parece que tienes jabón en los dedos, es talco","etym":"Del árabe 'talq': mineral brillante","notes":"La escala de Mohs comienza con él (dureza 1). La sensación grasa al tacto + dureza 1 son diagnósticos absolutos. PRUEBAS: (1) Rayar con la uña: dureza 1, la uña deja surco fácilmente. (2) Sensación grasa/jabonosa al tacto (diagnóstico). (3) Color blanco-verdoso o plateado. (4) Hojas no elásticas (a diferencia de moscovita). CONFUSIÓN CON: Moscovita — elástica y mucho más dura (dur.2-2.5). Yeso (selenita) — también muy blando pero sin sensación grasa; láminas elásticas. Caolinita — también blanca y blanda pero aspecto terroso, sin brillo nacarado.","hab":"","catf":"geología","subf":"mineral","base":"Talco"},{"id":"MIN-020","cat":"Geología","sub":"Mineral","name":"Fluorita","sci":"Fluorita (CaF₂)","fam":"Haluro","freq":"alta","key":"Colores muy variados: violeta, verde, azul, amarillo, incoloro (policromática)","mnem":"El mineral 'arcoíris con octaedros': si es colorida, se parte en octaedros y tiene dureza 4, fluorita","etym":"Del latín 'fluere' (fluir): fundente en metalurgia","notes":"Los clivajes octaédricos y la variedad de colores la hacen reconocible. Muy común en colecciones de IES (fácil de obtener y llamativa). PRUEBAS: (1) Dureza 4: no lo raya la uña (dur.2.5) ni una moneda de cobre (dur.3) pero sí una navaja (dur.5.5). (2) Clivaje octaédrico perfecto (fragmentos forman octaedros). (3) Colores muy variados. CONFUSIÓN CON: Calcita — clivaje romboédrico (no octaédrico); reacciona al HCl. Halita — cúbica, sabor salado, dur.2.5. Apatito — verde o azulado, hexagonal, dur.5. Baritina — blanca, muy pesada, sin clivaje octaédrico.","hab":"","catf":"geología","subf":"mineral","base":"Fluorita"},{"id":"MIN-021","cat":"Geología","sub":"Mineral","name":"Apatito","sci":"Apatito (Ca₅(PO₄)₃(F,Cl,OH))","fam":"Fosfato","freq":"baja","key":"Dureza 5 (referencia en escala de Mohs: no lo raya la navaja pero sí el vidrio)","mnem":"El 'engañabobos' geológico: el mineral de los huesos y dientes. Dureza 5 = navaja no lo raya, vidrio sí","etym":"Del griego 'apatao' (engañar): se confundía con otras gemas","notes":"Puede aparecer. Su importancia como referencia de la escala de Mohs (posición 5) puede ser evaluada teóricamente. PRUEBAS: (1) Dureza exactamente 5: no lo raya el vidrio corriente (dur.5.5) pero sí un cristal de cuarzo (dur.7). La navaja (dur.5.5) lo raya con dificultad. (2) Cristales hexagonales o en masas granulares. (3) Verde, azul o incoloro. CONFUSIÓN CON: Fluorita — dur.4 (la moneda lo raya). Berilo (esmeralda/aguamarina) — hexagonal pero dur.7.5-8. Epidota — contexto metamórfico; amarillo-verdoso. Topacio — dur.8; exfoliación basal.","hab":"","catf":"geología","subf":"mineral","base":"Apatito"},{"id":"MIN-022","cat":"Geología","sub":"Mineral","name":"Azufre nativo","sci":"Azufre (S)","fam":"Elemento nativo","freq":"media","key":"Amarillo brillante a amarillo-verdoso muy llamativo","mnem":"El 'mineral del infierno': amarillo brillante, ligero y huele a cerillas. No hay otro así","etym":"Del sánscrito 'sulvere' → latín 'sulfur'. Conocido desde la antigüedad","notes":"Color amarillo azufre inconfundible. Aparece en zonas volcánicas y evaporíticas. PRUEBAS: (1) Color amarillo azufre inconfundible (brillante, no el amarillo verdoso de la pirita). (2) Dur.1.5-2.5: la uña casi lo raya. (3) Ardería con llama azul dando SO₂ (olor a cerillas). (4) Muy ligero. CONFUSIÓN CON: Pirita — metálica, pesada, dura (dur.6). Ópalo de color amarillo — vítreo, sin forma cristalina. Limonita (goethita) — marrón-amarillento, raya amarilla-marrón, no cristalina.","hab":"","catf":"geología","subf":"mineral","base":"Azufre"},{"id":"MIN-023","cat":"Geología","sub":"Mineral","name":"Malaquita","sci":"Malaquita (Cu₂(CO₃)(OH)₂)","fam":"Carbonato","freq":"media","key":"Verde intenso con bandas concéntricas circulares ('ojo' verde) inconfundible","mnem":"El mineral 'camuflaje verde en círculos': bandas verdes concéntricas como anillos de árbol","etym":"Del griego 'malache' (malva): por el color verde de las hojas de malva","notes":"El patrón de bandas verdes es absolutamente diagnóstico. Siempre asociada al cobre. PRUEBAS: (1) Verde intenso con bandas concéntricas o patrón botroidal: absolutamente diagnóstico. (2) Reacciona al HCl (carbonato de cobre). (3) Raya verde clara. (4) Pesada (dens.3.9-4.0). CONFUSIÓN CON: Crisocola — turquesa más azulada, no reacciona al HCl, aspecto más resinoso. Azurita — azul intenso (mismo contexto, cobre oxidado). Epidota — verde amarillento, en contexto metamórfico, no reacciona al HCl.","hab":"","catf":"geología","subf":"mineral","base":"Malaquita"},{"id":"MIN-024","cat":"Geología","sub":"Mineral","name":"Turmalina","sci":"Turmalina (borosilicato complejo)","fam":"Ciclosílicato","freq":"baja","key":"Cristales prismáticos alargados con sección triangular redondeada y estrías longitudinales","mnem":"El 'lápiz negro con estrías': cristales alargados, oscuros y con costillas longitudinales","etym":"Del cingalés 'turmali' (piedra mezclada de colores)","notes":"Puede aparecer en pegmatitas graníticas. La sección triangular estriada es diagnóstica. PRUEBAS: (1) Sección triangular redondeada en cristales prismáticos. (2) Estrías longitudinales a lo largo del prisma. (3) Color muy variable: negro (schorl), verde, azul, rosa. CONFUSIÓN CON: Hornblenda — también prismática y negra pero sección romboidal y clivaje a 120°. Augita — clivaje a 90°, sección cuadrangular. Estaurolita — cruciforme, marrón-rojiza.","hab":"","catf":"geología","subf":"mineral","base":"Turmalina"},{"id":"MIN-025","cat":"Geología","sub":"Mineral","name":"Baritina","sci":"Baritina (BaSO₄)","fam":"Sulfato","freq":"baja","key":"Muy pesada (densidad 4.3-4.6 g/cm³) — sorprendentemente densa para ser blanca","mnem":"El 'plomo blanco': si un mineral blanco pesa como si fuera metálico, es baritina","etym":"Del griego 'barys' (pesado): densidad anormalmente alta para un mineral blanco","notes":"La densidad anómala es el truco. En examen se detecta al cogerla: pesa mucho más de lo esperado. PRUEBAS: (1) Coger el ejemplar: sensación de peso excesivo para ser blanco/incoloro (dens.4.3-4.6). (2) Cristales tabulares aplanados o masivos. (3) Brillo vítreo a resinoso. (4) Sin reacción al HCl. CONFUSIÓN CON: Calcita — reacciona vivamente al HCl; mucho más ligera. Yeso — dur.2 (uña lo raya); la baritina es más dura (dur.3-3.5). Celestina — similar pero azulada y ligeramente menos densa. Anglesita — también pesada pero en contexto de oxidación de galena.","hab":"","catf":"geología","subf":"mineral","base":"Baritina"},{"id":"MIN-026","cat":"Geología","sub":"Mineral","name":"Esfalerita (blenda)","sci":"Esfalerita (ZnS)","fam":"Sulfuro","freq":"baja","key":"Color pardo-amarillento a negro; brillo resinoso o adamantino llamativo","mnem":"La 'galena mentirosa': brilla como metálica pero su raya es blanca o amarilla, nunca negra","etym":"Del griego 'sphaleros' (engañoso): confundida frecuentemente con galena","notes":"La raya clara en mineral de aspecto metálico es la clave. Puede aparecer junto a galena. PRUEBAS: (1) Brillo resinoso o adamantino muy llamativo. (2) Raya blanca o amarillo pálido (a pesar del color oscuro del mineral). (3) Olor a H₂S al golpear. (4) Dur.3.5-4. CONFUSIÓN CON: Galena — metálica, cúbica, mucho más pesada, raya gris. Wolframita — más pesada, negra metálica. Cassiterita — adamantina pero cristales bipiramidales; raya blanca también.","hab":"","catf":"geología","subf":"mineral","base":"Esfalerita"},{"id":"MIN-027","cat":"Geología","sub":"Mineral","name":"Caolinita","sci":"Caolinita (Al₂Si₂O₅(OH)₄)","fam":"Filosilicato (arcilla)","freq":"baja","key":"Blanco t
