erroso mate, aspecto de harina o tiza","mnem":"La 'arcilla blanca de la porcelana': blanca, terrosa y huele a tierra cuando la mojas","etym":"De 'Kaoling' (alta colina), China, donde se extraía para porcelana","notes":"Puede aparecer en muestras de suelo o en contexto de meteorización. El olor al mojarse es diagnóstico. PRUEBAS: (1) Aspecto blanco terroso, mate. (2) Olor a tierra mojada al humedecerse. (3) Adherencia a la lengua (absorbe humedad). (4) Plasticidad al mojarse. CONFUSIÓN CON: Talco — sensación grasa, láminas brillantes nacaradas. Yeso terroso — también blanco pero dur.2 y láminas brillantes. Calcita terrosa (creta) — reacciona al HCl.","hab":"","catf":"geología","subf":"mineral","base":"Caolinita"},{"id":"MIN-028","cat":"Geología","sub":"Mineral","name":"Aragonito","sci":"Aragonito (CaCO₃)","fam":"Carbonato","freq":"baja","key":"Mismo compuesto que la calcita pero cristales prismáticos alargados (no romboédricos)","mnem":"La 'calcita aragonesa': misma fórmula pero cristales prismáticos en vez de romboédricos","etym":"De 'Aragón' (España): descrito por primera vez en Molina de Aragón","notes":"La diferencia con la calcita está en la forma cristalina: prismas (aragonito) vs. romboedros (calcita). PRUEBAS: (1) Reacciona al HCl como la calcita. (2) Cristales PRISMÁTICOS alargados (no romboedros como calcita). (3) Mayor densidad que calcita (dens.2.93 vs. 2.71). (4) Más frecuente en conchas de moluscos y corales modernos. CONFUSIÓN CON: Calcita — misma composición química (CaCO₃) pero cristalografía diferente: calcita = trigonal, romboedros; aragonito = ortorrómbico, prismas. Solo distinguibles por RX o por densidad.","hab":"","catf":"geología","subf":"mineral","base":"Aragonito"},{"id":"MIN-029","cat":"Geología","sub":"Mineral","name":"Crisotilo (asbesto blanco)","sci":"Crisotilo (Mg₃Si₂O₅(OH)₄)","fam":"Filosilicato (serpentina fibrosa)","freq":"baja","key":"Fibras sedosas blancas o verdosas muy largas y flexibles (aspecto de seda mineral)","mnem":"El 'asbesto sedoso': fibras minerales blancas que parecen lana o seda — el amianto más común","etym":"Del griego 'chrysos' (oro) + 'tilos' (fibra): fibra dorada","notes":"Si aparece, es por su importancia histórica (amianto) y toxicológica. Solo observación en examen. PRUEBAS: (1) Fibras largas y sedosas muy flexibles (aspecto de seda mineral). (2) Color blanco a verde pálido. (3) Insoluble en HCl. NOTA: NO MANIPULAR — fibras cancerígenas. CONFUSIÓN CON: Tremolita fibrosa (amianto blanco) — prácticamente indistinguible sin RX. Talco fibroso — menos sedoso, más graso. Yeso fibroso (fibra de yeso) — mucho más blando (dur.2, uña lo raya).","hab":"","catf":"geología","subf":"mineral","base":"Crisotilo"},{"id":"MIN-030","cat":"Geología","sub":"Mineral","name":"Albita","sci":"Albita (NaAlSi₃O₈)","fam":"Tectosílicato","freq":"baja","key":"Blanco muy puro a gris muy pálido (el más blanco de los feldespatos)","mnem":"La 'plagioclasa blanca nieve': el feldespato más blanco, siempre con finas estrías paralelas","etym":"Del latín 'albus' (blanco): por su color blanco característico","notes":"Puede aparecer en pegmatitas. Diferenciar de ortosa por estriación y color más blanco puro. PRUEBAS: (1) Blanco muy puro o gris muy pálido (el más blanco de los feldespatos). (2) Estriación polisintética visible con lupa. (3) Clivaje en 2 dir. a ~90°. (4) Dureza 6. CONFUSIÓN CON: Ortosa — más rosada/salmón; sin estriación polisintética. Calcita blanca — reacciona al HCl; clivaje romboédrico. Cuarzo blanco — sin clivaje; fractura concoidea.","hab":"","catf":"geología","subf":"mineral","base":"Albita"},{"id":"MIN-031","cat":"Geología","sub":"Mineral","name":"Oro nativo","sci":"Au (Oro nativo)","fam":"Elemento nativo","freq":"alta","key":"Color amarillo dorado inalterable (nunca se oxida ni pierde el brillo) — diagnóstico absoluto","mnem":"La 'prueba de la uña y el peso': si es amarillo brillante, se raya con la uña y pesa muchísimo para su tamaño, es oro. La pirita se raya con el acero y tiene caras estriadas","etym":"Au = del latín 'aurum' (oro); Gold del germánico antiguo 'ghelto' (amarillo brillante)","notes":"El diagnóstico diferencial oro/pirita ('oro de tontos') es evaluable. Oro: maleable, pesadísimo, raya amarilla, no estría. Pirita: dura (6), estrías en caras, raya negra, frágil. PRUEBAS: (1) Aplicar navaja: el ORO se dobla o marca (maleable), la pirita se parte/astilla. (2) Densidad excepcional (19.3 g/cm³): más pesado que cualquier otro mineral común. (3) Color amarillo que NO se opaca nunca. CONFUSIÓN CON: Pirita ('oro de tontos') — dura (dur.6), raya negra, se astilla, no maleable. Calcopirita — también amarilla pero iridiscente y más blanda. Chalcopirita en polvo — raya amarilla verdosa. Mica moscovita dorada — muy flexible y ligera.","hab":"","catf":"geología","subf":"mineral","base":"Oro"},{"id":"MIN-032","cat":"Geología","sub":"Mineral","name":"Cobre nativo","sci":"Cu (Cobre nativo)","fam":"Elemento nativo","freq":"media","key":"Color rojo-cobre brillante característico cuando fresco; se oxida a verde (malaquita) o azul (azurita)","mnem":"El 'mineral de los alambres': el único metal rojo que se puede doblar con la mano — la misma materia de los cables eléctricos, pero en roca","etym":"Cu = del latín 'cuprum' (de Chipre, Kypros, famosa por sus minas de cobre en la antigüedad)","notes":"El color rojo-cobre + la maleabilidad + la presencia en zonas de oxidación de sulfuros son diagnósticos. La asociación malaquita (verde)/azurita (azul)/cobre nativo (rojo) en el mismo afloramiento es evaluable. PRUEBAS: (1) Color rojo-cobre metálico cuando fresco. (2) Muy maleable. (3) Oxidación progresiva: rojo → marrón → verde (malaquita). (4) Densidad alta (8.9 g/cm³). CONFUSIÓN CON: Cobre nativo oxidado vs. malaquita — son el mismo elemento en distinto estado. Cuprita — rojo oscuro pero aspecto más terroso. Hematites especular — también metálico rojizo pero mucho más duro y frágil.","hab":"","catf":"geología","subf":"mineral","base":"Cobre"},{"id":"MIN-033","cat":"Geología","sub":"Mineral","name":"Grafito","sci":"C (Grafito — alótropo de carbono)","fam":"Elemento nativo","freq":"alta","key":"Color gris-negro metálico con brillo submetálico o graso; muy suave al tacto (jabonoso)","mnem":"El 'carbono que se usa en los lápices': negro, jabonoso al tacto y tan blando que mancha los dedos. El diamante y el grafito son el mismo elemento con diferente estructura","etym":"Del griego 'graphein' (escribir): el material del lápiz (los 'lápices de plomo' son de grafito)","notes":"El contraste grafito/diamante (mismo elemento C, propiedades opuestas) es un tema clásico de enlace químico y estructura cristalina. El grafito es conductor eléctrico (electrones deslocalizados en la lámina); el diamante es aislante. PRUEBAS: (1) Raya gris sucia en el papel o los dedos: mancha. (2) Sensación grasa/jabonosa. (3) Dur.1-2 (muy blando). (4) Brillo submetálico grisáceo. NO confundir con hulla (carbón) por contexto. CONFUSIÓN CON: Molibdenita — casi idéntico visualmente; solo distinguible por análisis. Hulla (carbón) — también negra y suave pero sin brillo metálico submetálico. Magnetita en polvo — negra pero magnética y sin sensación grasa.","hab":"","catf":"geología","subf":"mineral","base":"Grafito"},{"id":"MIN-034","cat":"Geología","sub":"Mineral","name":"Corindón (rubí / zafiro)","sci":"Al₂O₃ (Corindón)","fam":"Óxido","freq":"alta","key":"Dureza 9 — el segundo mineral más duro tras el diamante (rayado solo por diamante)","mnem":"El 'guardaespaldas del diamante': dureza 9 — solo el diamante (10) puede rayarlo. Si raya todo pero no al diamante, es corindón. El rubí es el corindón rojo; el zafiro es el azul","etym":"Corundum = del tamil 'kurundam' (rubí) · Rubí = del latín 'rubeus' (rojo) · Zafiro = del griego 'sappheiros' (azul)","notes":"La dureza 9 en la escala de Mohs es el carácter diagnóstico más evaluable. La relación entre el color y el elemento traza (Cr=rojo, Fe/Ti=azul) es un tema de química del estado sólido evaluable. PRUEBAS: (1) Intentar rayar con cuarzo (dur.7): el corindón NO se raya. Solo el diamante lo raya. (2) Cristales barriles o tabletas hexagonales. (3) Rubí = rojo; zafiro = azul; corindón = gris-marrón. CONFUSIÓN CON: Espinela roja — dur.8 (se raya con corindón). Granate rojo — dur.6.5-7.5 (se raya con cuarzo). Rubí sintético — indistinguible sin análisis. Topacio — dur.8; exfoliación basal perfecta.","hab":"","catf":"geología","subf":"mineral","base":"Corindon"},{"id":"MIN-035","cat":"Geología","sub":"Mineral","name":"Rutilo","sci":"TiO₂ (Rutilo)","fam":"Óxido","freq":"media","key":"Cristales prismáticos alargados de color rojo-pardo a negro con brillo adamantino","mnem":"El 'cristal aguja rojo en el cuarzo': los cristales alargados rojo-pardos que aparecen como agujas dentro del cuarzo o en maclas de rejilla son inconfundibles","etym":"Del latín 'rutilus' (rojo brillante, destellante): por su color rojizo-cobrizo","notes":"Las maclas en rejilla (sagenita) son diagnósticas y visualmente muy llamativas. El rutilo en cuarzo ('rutilated quartz') es frecuente en colecciones mineralógicas. PRUEBAS: (1) Cristales prismáticos con bipiramidal tetragonal. (2) Brillo adamantino muy intenso. (3) Color rojo-pardo característico. (4) Sagenita: maclas en rejilla de agujas de rutilo dentro de cuarzo. CONFUSIÓN CON: Casiterita — también adamantina y oscura pero cristales diferentes; en pegmatitas. Uraninita — también negra y pesada pero en contexto diferente. Anatasa y brookita — polimorfos del TiO₂, similares pero más raros.","hab":"","catf":"geología","subf":"mineral","base":"Rutilo"},{"id":"MIN-036","cat":"Geología","sub":"Mineral","name":"Casiterita","sci":"SnO₂ (Casiterita)","fam":"Óxido","freq":"media","key":"Color pardo-negro brillante con brillo adamantino intenso — como cristales de chocolate brillante","mnem":"El 'cristal de chocolate que pesa como plomo': brillo adamantino pardo-negro y peso altísimo. Cuando un cristal oscuro pesa el doble de lo esperado, piensa en casiterita","etym":"Del griego 'kassiteros' (estaño): la mena del bronce","notes":"La casiterita de Extremadura y Galicia fue explotada desde el Calcolítico para fabricar bronce (Cu+Sn). El peso elevado + brillo adamantino son diagnósticos. PRUEBAS: (1) Brillo adamantino muy intenso. (2) Color pardo-negro brillante. (3) Pesada (dens.6.8-7.1). (4) Cristales bipiramidales o prismáticos. CONFUSIÓN CON: Wolframita — similar pero más opaca y en contexto de filones de cuarzo; no adamantina. Rutilo — también adamantino pero rojo-pardo y tetragonal bipiramidal. Esfalerita — brillo resinoso, más blanda.","hab":"","catf":"geología","subf":"mineral","base":"Casiterita"},{"id":"MIN-037","cat":"Geología","sub":"Mineral","name":"Calcopirita","sci":"CuFeS₂ (Calcopirita)","fam":"Sulfuro","freq":"alta","key":"Color amarillo dorado con tinte verdoso — más amarillo que la pirita, más verdoso que el oro","mnem":"La 'pirita verde-iridiscente': más verdosa y blanda que la pirita, con arcoíris de colores en la superficie oxidada — si brilla como pirita pero tiene visos verdes y azulados al girarla, es calcopirita","etym":"Del griego 'chalkos' (cobre) + 'pyrites' (fuego): 'piedra de cobre que saca fuego'","notes":"El trio calcopirita/pirita/oro es un par de estudio clásico. La iridiscencia + verdosidad + dureza menor que pirita son diagnósticos. La Faja Pirítica Ibérica (Huelva) = yacimiento más grande de calcopirita de Europa. PRUEBAS: (1) Color amarillo-dorado con tinte VERDE iridiscente — más amarillo que la pirita y más verdoso que el oro. (2) Dur.3.5-4: la navaja la raya fácilmente. (3) Iridiscencia superficial por oxidación. CONFUSIÓN CON: Pirita — más dura (dur.6), no iridiscente, cubos bien formados. Oro nativo — maleable, muy pesado, sin iridiscencia. Calcopirita/marcasita — la marcasita tiene forma tabular diferente.","hab":"","catf":"geología","subf":"mineral","base":"Calcopirita"},{"id":"MIN-038","cat":"Geología","sub":"Mineral","name":"Arsenopirita","sci":"FeAsS (Arsenopirita)","fam":"Sulfosales (arsenosulfuro)","freq":"alta","key":"Color gris-plateado metálico brillante con manchas pardas de oxidación","mnem":"La 'piedra que huele a ajo al golpearla': el único mineral que al golpear con el martillo despide olor a ajo inconfundible. Si huele a ajo, es arsenopirita","etym":"Del griego 'arsenikon' (arsénico, del árabe 'azzernikh') + 'pyrites' (fuego)","notes":"El olor a ajo al golpear es absolutamente diagnóstico y evaluable. La arsenopirita es el indicador más común de filones auríferos (el oro suele asociarse a ella). PRUEBAS: (1) Golpear: olor a ajo intenso e inmediato = arsenopirita (diagnóstico absolutamente definitivo). (2) Color gris-plateado metálico. (3) Cristales rómbicos característicos. (4) Dureza 5.5-6. CONFUSIÓN CON: Pirita arsenical — misma familia pero sin cristales rómbicos tan marcados. Löllingita — similar pero sin olor a ajo tan intenso. Marcasita — forma tabular; sin olor característico.","hab":"","catf":"geología","subf":"mineral","base":"Arsenopirita"},{"id":"MIN-039","cat":"Geología","sub":"Mineral","name":"Estibina (antimonita)","sci":"Sb₂S₃ (Estibina)","fam":"Sulfuro","freq":"media","key":"Cristales alargados y estriados longitudinalmente de color gris-plomo brillante","mnem":"El 'lápiz de plomo metálico': cristales largos y estriados de color plomo brillante que parecen barras de grafito de lápiz pero metálicas. Esos cristales en haz son únicos","etym":"Stibnite del griego 'stimmi' (antimonio, usado como cosmético ocular en la antigüedad) · Estibina = nombre español","notes":"Los cristales alargados estriados son absolutamente diagnósticos. La estibina tiene un punto de fusión bajo (271°C) — es el mineral metálico con menor punto de fusión común. Mena del antimonio. PRUEBAS: (1) Cristales alargados estriados longitudinalmente muy llamativos. (2) Color gris-plomo brillante. (3) Muy blanda (dur.2): la uña la raya. (4) Punto de fusión bajísimo (630°C: se funde fácilmente). CONFUSIÓN CON: Galena — cúbica, muy pesada; sin cristales alargados. Molibdenita — laminar, mancha los dedos. Arsenopirita — más dura, cristales rómbicos, olor a ajo.","hab":"","catf":"geología","subf":"mineral","base":"Estibina"},{"id":"MIN-040","cat":"Geología","sub":"Mineral","name":"Anhidrita","sci":"CaSO₄ (Anhidrita)","fam":"Sulfato","freq":"alta","key":"Blanca a gris-azulada, sin brillo vidrioso fuerte (a diferencia del yeso que es más perláceo)","mnem":"El 'yeso sin agua y más duro': blanco o gris, más duro que el yeso (no lo raya la uña) y con caras perfectamente rectangulares — el yeso deshidratado","etym":"Del griego 'an' (sin) + 'hydor' (agua): 'sulfato de calcio sin agua' — a diferencia del yeso que tiene 2 moléculas de agua","notes":"La diferencia yeso/anhidrita (con/sin H₂O) es evaluable. Dureza: yeso=2 (raya la uña), anhidrita=3-3.5 (no la raya fácilmente). La expansión anhidrita→yeso puede levantar edificios. PRUEBAS: (1) Comprobar dureza: dur.3-3.5 (ni la uña ni la moneda de cobre la rayen, la navaja sí). (2) NO reacciona al HCl. (3) Color blanco-grisáceo a azulado. (4) Clivaje en 3 dir. pero NO romboédrico como la calcita. CONFUSIÓN CON: Yeso — mucho más blando (dur.2, uña lo raya); perláceo. Calcita — reacciona vivamente al HCl; clivaje romboédrico. Baritina — muy pesada para su color blanco.","hab":"","catf":"geología","subf":"mineral","base":"Anhidrita"},{"id":"MIN-041","cat":"Geología","sub":"Mineral","name":"Celestina","sci":"SrSO₄ (Celestina)","fam":"Sulfato","freq":"media","key":"Color azul cielo muy suave a incoloro — el azul más delicado entre los minerales comunes","mnem":"El 'mineral del cielo azul pálido': el azul más suave y delicado que se puede imaginar en un mineral. Y si tienes duda, ponlo en una llama: el estroncio la vuelve roja carmesí","etym":"Del latín 'caelestis' (celestial, del cielo): por su color azul cielo característico","notes":"El color azul cielo suave + la llama carmesí por el estroncio son diagnósticos. La misma reacción de llama (Sr → carmesí) explica el color rojo de los fuegos artificiales. PRUEBAS: (1) Color azul cielo muy suave. (2) Cristales tabulares o masivos. (3) Pesada para ser azulada (dens.3.95-3.97). (4) Llama de gas: tiñe de CARMESÍ/ROJO (estroncio). CONFUSIÓN CON: Baritina — también pesada y blanca-azulada pero llama amarilla (bario). Azurita — azul más intenso; contexto de oxidación de cobre. Angelesita — más pesada, incolora-gris. Fluorita azul — cúbica, dur.4.","hab":"","catf":"geología","subf":"mineral","base":"Celestina"},{"id":"MIN-042","cat":"Geología","sub":"Mineral","name":"Siderita","sci":"FeCO₃ (Siderita)","fam":"Carbonato","freq":"media","key":"Color pardo-amarillento a gris-verdoso; brillo vítreo a perláceo","mnem":"La 'calcita parda que no burbujea en frío': misma forma que la calcita pero marrón-amarillenta y notablemente más pesada. El ácido frío no produce burbujas (solo en polvo)","etym":"Del griego 'sideros' (hierro): el carbonato de hierro","notes":"La diferencia siderita/calcita por la reacción de ácido (calcita burbujea en frío; siderita solo en polvo o caliente) es evaluable. La mayor densidad también es diagnóstica. PRUEBAS: (1) Color pardo-amarillento o gris-verdoso. (2) NO reacciona al HCl en frío (a diferencia de calcita). (3) Romboedros curvados. (4) Pesada para ser marrón (dens.3.9). CONFUSIÓN CON: Calcita — reacciona vivamente al HCl en frío. Dolomita — también no reacciona al HCl frío pero cristales en silla de montar. Rodocrosita — rosa fucsia muy llamativo.","hab":"","catf":"geología","subf":"mineral","base":"Siderita"},{"id":"MIN-043","cat":"Geología","sub":"Mineral","name":"Smithsonita","sci":"ZnCO₃ (Smithsonita)","fam":"Carbonato","freq":"media","key":"Color muy variable: verde-menta, azul, amarillo, rosa, blanco o incoloro","mnem":"El 'carbonato de racimos de uvas': la superficie botroidal con pequeñas bolas redondeadas + los colores pastel (verde-menta o azul) hacen que parezca hecha de caramelos","etym":"En honor al mineralogista y fundador del Smithsonian Institution, James Smithson (1765-1829)","notes":"La superficie botroidal + los colores pastel vivos son diagnósticos visuales. Mena secundaria de zinc. Se asocia a galena oxidada en zonas de cementos. PRUEBAS: (1) Superficie botroidal o nodular. (2) Colores pastel vivos pero variables (verde, azul, rosa, amarillo). (3) Reacciona al HCl (carbonato de zinc). (4) A menudo con eflorescencias. CONFUSIÓN CON: Calcita coloreada — reacciona al HCl igualmente; distinguir por color inusual. Aragonito botroidal — también botroidal pero incoloro o blanco. Hemimorfita — similar contexto pero silicato de zinc.","hab":"","catf":"geología","subf":"mineral","base":"Smithsonita"},{"id":"MIN-044","cat":"Geología","sub":"Mineral","name":"Circón","sci":"ZrSiO₄ (Circón)","fam":"Nesosílicato","freq":"media","key":"Cristales tetragonales bipiramidales cortos; brillo adamantino muy intenso","mnem":"El 'cristal cuadrado más brillante de los sedimentos': los pequeños cristales tetragonales con brillo diamantino que aparecen en las arenas como minúsculos rubíes o diamantes","etym":"Del árabe 'zarqun' (bermellón) o del persa 'zargun' (dorado): por el color de las variedades amarillo-naranjas","notes":"El circón es fundamental en geocronología (datación U-Pb): los circones son las relojes geológicas más precisas. Los más antiguos (Australia, Jack Hills) tienen 4.4 Ga. PRUEBAS: (1) Cristales bipiramidales tetragonales cortos. (2) Brillo adamantino muy intenso. (3) Muy duro (dur.7.5). (4) Resistente: casi indestructible — persiste en arenas de playas. CONFUSIÓN CON: Diamante — también adamantino pero isométrico (octaédrico) y mucho más duro. Rutilo — también tetragonal y adamantino pero rojizo-pardo. Cassiterita — similar pero contexto de pegmatitas.","hab":"","catf":"geología","subf":"mineral","base":"Circon"},{"id":"MIN-045","cat":"Geología","sub":"Mineral","name":"Topacio","sci":"Al₂SiO₄(F,OH)₂","fam":"Nesosílicato","freq":"media","key":"Dureza 8 — el tercero más duro en la escala de Mohs (después de corindón y diamante)","mnem":"El 'cuarzo que se parte en la base': cristales estriados como el cuarzo, pero con una cara de exfoliación perfecta en la base que el cuarzo no tiene — y mucho más duro","etym":"Del griego 'Topazios' (nombre de una isla del Mar Rojo, actual Zabargad/St. John's)","notes":"La dureza 8 + la exfoliación basal perfecta son diagnósticos. Gema preciosa. La escala de Mohs: 1(talco) 2(yeso) 3(calcita) 4(fluorita) 5(apatito) 6(feldespato) 7(cuarzo) 8(topacio) 9(corindón) 10(diamante). PRUEBAS: (1) Exfoliación basal perfecta: se parten en láminas al golpear. (2) Dureza 8: cuarzo no lo raya, corindon sí. (3) Cristales prismáticos con sección ortorrómbica. (4) Incoloro, amarillo o azul. CONFUSIÓN CON: Cuarzo — dur.7, sin exfoliación basal. Corindón — dur.9, hexagonal, sin exfoliación basal tan perfecta. Berilo — hexagonal; dur.7.5-8; sin exfoliación basal.","hab":"","catf":"geología","subf":"mineral","base":"Topacio"},{"id":"MIN-046","cat":"Geología","sub":"Mineral","name":"Andalucita","sci":"Al₂SiO₅ (Andalucita)","fam":"Nesosílicato","freq":"alta","key":"Cristales prismáticos con sección cuadrada; color rosado, pardo o verdoso","mnem":"La 'piedra de la cruz española': la variedad quiastolita tiene una cruz negra perfecta en sección — la cruz es carbono atrapado durante el crecimiento del cristal","etym":"De Andalucía (España), donde fue descrita por primera vez en el siglo XVIII","notes":"Los tres polimorfos de Al₂SiO₅ (andalucita = baja P, distena/cianita = alta P, silimanita = alta T) son indicadores de condiciones metamórficas y son evaluables. La quiastolita es muy llamativa. PRUEBAS: (1) Cristales prismáticos con sección CUADRADA. (2) Color rosado, pardo o grisáceo. (3) La variedad quiastolita tiene inclusión cruciforme negra de grafito en sección. (4) En metamorfitas de bajo grado. CONFUSIÓN CON: Distena (cianita) — laminar, azul, alargada. Silimanita — fibrolita, fibrosa, alta temperatura. Estaurolita — cruciforme, marrón-rojiza. Son los 4 polimorfos de aluminosilicatos: cada uno marca condiciones P-T distintas.","hab":"","catf":"geología","subf":"mineral","base":"Andalucita"},{"id":"MIN-047","cat":"Geología","sub":"Mineral","name":"Tremolita-Actinolita","sci":"Ca₂(Mg,Fe)₅Si₈O₂₂(OH)₂","fam":"Inosílicato (anfíbol)","freq":"media","key":"Cristales aciculares o prismáticos alargados; color blanco (tremolita) a verde oscuro (actinolita)","mnem":"El 'anfíbol del mármol verde': largos cristales verdes o blancos con el ángulo de 120° diagnóstico de anfíbol. Si las fibras son sedosas y largas, es la variedad amianto","etym":"Tremolita = del valle de Tremola (Alpes suizos) · Actinolita del griego 'aktis' (rayo): por el aspecto radiado de los cristales","notes":"La serie tremolita-actinolita en sus variedades fibrosas = amianto verde (crocidolita) o blanco — tema de salud pública y mineralogía evaluable. El ángulo de clivaje 120° es diagnóstico de anfíbol vs. piroxeno (90°). PRUEBAS: (1) Cristales aciculares o prismáticos muy alargados. (2) Blanco (tremolita) → verde oscuro (actinolita) según la proporción de Fe. (3) Clivaje a 120° (como todos los anfíboles). CONFUSIÓN CON: Wollastonita — también acicular y blanca pero en skarn; sin clivaje anfibólico. Epidota — amarillo-verdosa, contexto metamórfico diferente. Diópsido (piroxeno) — clivaje a 90°.","hab":"","catf":"geología","subf":"mineral","base":"Tremolita"},{"id":"MIN-048","cat":"Geología","sub":"Mineral","name":"Clorita","sci":"(Mg,Fe,Al)₆(Si,Al)₄O₁₀(OH)₈","fam":"Filosilicato","freq":"alta","key":"Color verde intenso a verde oscuro — el más verde de los filosilicatos","mnem":"La 'mica verde que no es elástica': láminas verdes parecidas a la biotita pero que no vuelven a su forma al doblarlas — si la lámina verde no rebota, es clorita","etym":"Del griego 'chloros' (verde, cloro): por su color verde característico","notes":"La clorita es el mineral índice de la zona de menor grado metamórfico (facies esquistos verdes). La diferencia clorita/biotita (verde vs. negra; no elástica vs. elástica) es muy evaluable. PRUEBAS: (1) Verde intenso a verde oscuro — el mineral filosilicato más verde. (2) Láminas menos elásticas que micas (se doblan pero no vuelven solas). (3) Brillo perláceo. (4) Asociada a metamorfismo de muy bajo grado. CONFUSIÓN CON: Biotita — también verde-oscura a negra pero elástica. Epidota — más amarillo-verdosa, no laminar. Serpentina — también verde pero sin exfoliación laminar; aceitosa.","hab":"","catf":"geología","subf":"mineral","base":"Clorita"},{"id":"MIN-049","cat":"Geología","sub":"Mineral","name":"Nefelina","sci":"NaAlSiO₄ (Nefelina)","fam":"Tectosílicato","freq":"media","key":"Aspecto graso o resinoso gris-blancuzco; sin caras brillantes visibles (macizo)","mnem":"El 'feldespato sin silicio que no puede estar con el cuarzo': si la roca ígnea tiene aspecto graso y no tiene cuarzo, puede ser nefelina — los feldespatoides huyen del cuarzo","etym":"Del griego 'nephele' (nube): porque al atacarlo con ácido produce gel de sílice que nubla el ácido","notes":"La regla nefelina/cuarzo (incompatibles en la misma roca) es fundamental en petrología ígnea. Rocas con nefelina = sienitanefelínica, fonolita, nefelinita. PRUEBAS: (1) Aspecto graso o resinoso: sin caras brillantes (macizo). (2) Gris-blancuzco. (3) La regla: en la misma roca NO pueden coexistir cuarzo y nefelina. Si ves nefelina = sin cuarzo. (4) Dureza 5.5-6. CONFUSIÓN CON: Ortosa/plagioclasa — tienen clivaje nítido; la nefelina parece más 'grasa' y sin caras brillantes. Leucita — también sin sílice pero con forma dodecaédrica o trapezoédrica.","hab":"","catf":"geología","subf":"mineral","base":"Nefelina"},{"id":"MIN-050","cat":"Geología","sub":"Mineral","name":"Zeolita (estilbita / heulandita)","sci":"Grupo Zeolita (CaAl₂Si₇O₁₈·7H₂O)","fam":"Tectosílicato","freq":"media","key":"Cristales tabulares o estelares blancos a incoloros con brillo perláceo o vítreo","mnem":"La 'piedra que hierve y tiene poros': cristales blancos perláceos que llenan las burbujas del basalto y que al calentarlos liberan vapor de agua visible","etym":"Del griego 'zeo' (hervir) + 'lithos' (piedra): 'piedra que hierve' — liberan agua al calentar","notes":"Las zeolitas industrialmente son tamices moleculares (catalizadores, purificación de agua, suavizantes). La presencia en basaltos amigdaloides = relleno hidrotermal de bajo grado. PRUEBAS: (1) Cristales tabulares (heulandita) o fasces de cristales en abanico (estilbita). (2) Brillo perláceo o vítreo. (3) Incoloro o blanco. (4) Siempre en cavidades y amígdalas de basaltos. CONFUSIÓN CON: Calcita — reacciona al HCl; rombohédrica. Feldespato — sin brillo perláceo tan suave; en masa ígnea. Baritina — muy pesada; sin cavidades de basalto.","hab":"","catf":"geología","subf":"mineral","base":"Zeolita"},{"id":"MIN-051","cat":"Geología","sub":"Mineral","name":"Wollastonita","sci":"CaSiO₃ (Wollastonita)","fam":"Inosílicato (piroxenoide)","freq":"media","key":"Color blanco a gris-blancuzco; cristales aciculares o fibrosos sedosos","mnem":"La 'cal que se convirtió en silicato': cuando una caliza es atravesada por un magma caliente, el CaCO₃ se transforma en wollastonita — el mineral blanco fibroso que marca el contacto","etym":"En honor al mineralogista inglés William Hyde Wollaston (1766-1828), descubridor del paladio y rodio","notes":"La wollastonita es el mineral diagnóstico del metamorfismo de contacto de calizas (skarn). La reacción CaCO₃ + SiO₂ = CaSiO₃ + CO₂ es evaluable en petrología metamórfica. PRUEBAS: (1) Color blanco a gris-blancuzco. (2) Cristales aciculares o fibrosos sedosos. (3) En skarn: contacto caliza-granito. (4) Reacción al HCl muy débil (silicato de calcio, no carbonato). CONFUSIÓN CON: Tremolita — también acicular y blanca pero clivaje anfibólico a 120°. Calcita fibrosa — reacciona vivamente al HCl. Yeso fibroso — dur.2, uña lo raya.","hab":"","catf":"geología","subf":"mineral","base":"Wollastonita"},{"id":"MIN-052","cat":"Geología","sub":"Mineral","name":"Silvita","sci":"KCl (Silvita)","fam":"Haluro","freq":"media","key":"Aspecto idéntico a la halita (sal gema) pero sabor amargo o picante — diagnóstico sensorial clave","mnem":"La 'sal que amarga': idéntica a la sal gema pero al probarla (si te dejan) tiene sabor amargo/picante en vez de salado — el único par de minerales que se diferencia por el sabor","etym":"De Sylvius de le Boë (Franz Sylvius), médico neerlandés del siglo XVII que estudió la química de las sales","notes":"La silvita es la mena del potasio (fertilizante). La diferencia halita/silvita por sabor (salado vs. amargo) es muy evaluable y memorable. Ambas en evaporitas pero silvita más rara. PRUEBAS: (1) Aspecto idéntico a halita (sal gema). (2) PROBAR: sabor AMARGO o picante (NO salado). (3) Si no se puede probar: clivaje cúbico perfecto, translúcido, contexto evaporítico potásico. CONFUSIÓN CON: Halita — sabor salado (no amargo). La confusión silvita/halita es el par diferencial más clásico de los haluros.","hab":"","catf":"geología","subf":"mineral","base":"Silvita"},{"id":"MIN-053","cat":"Geología","sub":"Mineral","name":"Vivianita","sci":"Fe₃(PO₄)₂·8H₂O (Vivianita)","fam":"Fosfato","freq":"baja","key":"Color azul intenso a verde-azulado cuando expuesto al aire (se oxida rápidamente del blanco al azul)","mnem":"El 'mineral que se tiñe de azul al respirar': incoloro recién extraído, se vuelve azul intenso en minutos al oxidarse al contacto con el aire — el fenómeno más espectacular de la mineralogía","etym":"En honor al mineralogista inglés John Henry Vivian (1785-1855)","notes":"El cambio de color al oxidarse al aire es absolutamente único. Muy frecuente en sedimentos ricos en materia orgánica y en viejas conchas de moluscos. PRUEBAS: (1) En muestra fresca: blanco-incoloro. Pero al exponerse al aire: toma COLOR AZUL INTENSO progresivamente. (2) En sedimentos orgánicos (fosforítico). (3) Dur.1.5-2. CONFUSIÓN CON: Azurita — también azul pero en zonas oxidadas de sulfuros de cobre; no cambia de color. Crisocola — turquesa, masiva. La vivianita recién extraída puede confundirse con cualquier mineral incoloro.","hab":"","catf":"geología","subf":"mineral","base":"Vivianita"},{"id":"MIN-054","cat":"Geología","sub":"Mineral","name":"Azurita","sci":"Cu₃(CO₃)₂(OH)₂ (Azurita)","fam":"Carbonato de cobre","freq":"alta","key":"Azul intenso-cielo brillante — el azul más intenso de todos los minerales comunes","mnem":"La 'compañera verde-azul del cobre': si ves azul intenso brillante junto a verde brillante en la misma muestra, es azurita+malaquita. Juntas siempre delatan un yacimiento de cobre","etym":"Del árabe 'lazaward' (lapislázuli, azul intenso): por su color azul profundo","notes":"El par azurita (azul)/malaquita (verde) como zona de oxidación de sulfuros de cobre es un tema clásico. La transformación azurita→malaquita es evaluable. Pigmento histórico del Renacimiento. PRUEBAS: (1) Azul intenso: el azul más vivo entre los minerales de cobre. (2) Efervescencia con HCl (carbonato de cobre). (3) Raya azul claro. (4) Siempre asociada a zonas oxidadas de yacimientos de cobre. CONFUSIÓN CON: Malaquita — verde intensa (mismo contexto), también reacciona al HCl. Crisocola — turquesa, no reacciona al HCl. Lazurita (lapislázuli) — azul pero en rocas metamórficas, no en zonas de oxidación de cobre.","hab":"","catf":"geología","subf":"mineral","base":"Azurita"},{"id":"MIN-055","cat":"Geología","sub":"Mineral","name":"Crisocola","sci":"Cu₂H₂Si₂O₅(OH)₄ (Crisocola)","fam":"Filosilicato de cobre (silicato)","freq":"media","key":"Color azul-verde brillante a turquesa; aspecto masivo, resinoso o botroidal","mnem":"El 'turquesa de la zona de oxidación del cobre': aspecto de plástico turquesa sin caras cristalinas — como esmalte azul-verde pintado en la roca","etym":"Del griego 'chrysos' (oro) + 'kolla' (cola): usada en la antigüedad para soldar el oro","notes":"El trío azurita (azul)/malaquita (verde)/crisocola (turquesa) marca las tres fases de oxidación del cobre. La ausencia de caras cristalinas (siempre masiva) es diagnóstica. PRUEBAS: (1) Color azul-verde brillante a turquesa. (2) Aspecto masivo, resinoso o botroidal. (3) NO reacciona al HCl (silicato de cobre, no carbonato). (4) Contexto: zona de oxidación de cobre. CONFUSIÓN CON: Azurita — azul más intenso, SÍ reacciona al HCl. Malaquita — verde intensa, SÍ reacciona al HCl. Turquesa — muy similar pero en contexto diferente (zona árida, fosfato de aluminio-cobre).","hab":"","catf":"geología","subf":"mineral","base":"Crisocola"},{"id":"ROC-001","cat":"Geología","sub":"Roca","name":"Granito","sci":"Granito","fam":"Ígnea plutónica (ácida)","freq":"muy_alta","key":"Textura granular gruesa visible a simple vista: cuarzo gris + feldespato rosado + micas negras/plateadas","mnem":"El 'pastel de tres colores': cuarzo gris + feldespato rosado + micas negras. Si ves los tres, granito","etym":"Del latín 'granum' (grano): por su textura granular","notes":"IMPRESCINDIBLE. La Sierra de Guadarrama es plutónica granítica — directamente en el contexto geológico de Madrid. Identificar variedad: leucogranito (claro), granodiorita (más oscura). También puede aparecer como muestra de roca para clasificar como ígnea plutónica ácida. PRUEBAS: (1) Textura granuda gruesa: cuarzo gris + feldespato rosado + micas visibles a simple vista. (2) NO reacciona al HCl. (3) Muy duro (cuarzo). (4) Rayas de los minerales visibles. CONFUSIÓN CON: Granodiorita — más oscura, más plagioclasa que ortosa, más hornblenda y biotita. Gneiss granítico — tiene foliación (bandas); el granito es masivo. Diorita — sin cuarzo visible; color 'sal y pimienta'.","hab":"","catf":"geología","subf":"roca","base":"Granito"},{"id":"ROC-002","cat":"Geología","sub":"Roca","name":"Basalto","sci":"Basalto","fam":"Ígnea volcánica (básica)","freq":"alta","key":"Negro o gris muy oscuro; textura afanítica (grano tan fino que no se ven los minerales)","mnem":"La 'piedra negra de los volcanes': oscura, densa, grano fino. Si tiene huecos redondos, es basalto vesicular","etym":"Del latín 'basaltes', del griego 'basanites lithos' (piedra de toque)","notes":"Diferenciar de gabro (mismo origen pero grano grueso) y de obsidiana (sin minerales, vítreo). PRUEBAS: (1) Negro o gris oscuro. (2) Textura afanítica (sin granos visibles). (3) NO reacciona al HCl. (4) Denso y duro. CONFUSIÓN CON: Gabro — mismo color pero grano grueso visible. Obsidiana — brillo vítreo intenso, fractura concoidea perfecta. Andesita — más grisácea, posibles fenocristales blancos. Pizarra — foliación perfecta, se parte en láminas.","hab":"","catf":"geología","subf":"roca","base":"Basalto"},{"id":"ROC-003","cat":"Geología","sub":"Roca","name":"Gabro","sci":"Gabro","fam":"Ígnea plutónica (básica)","freq":"media","key":"Negro a verde muy oscuro con textura granular gruesa (grano visible)","mnem":"El 'granito negro': misma textura granular que el granito pero completamente oscuro y sin cuarzo","etym":"De 'Gabbro', localidad de la Toscana (Italia)","notes":"Par de estudio con basalto. Mismo origen geoquímico pero cristalización lenta = grano grueso. PRUEBAS: (1) Grano grueso visible: olivino verde + piroxeno negro + plagioclasa blanca. (2) Color negro a verde oscuro. (3) Muy denso. CONFUSIÓN CON: Basalto — mismo color pero afanítico (grano no visible). Peridotita — más verde, sin plagioclasa, solo olivino+piroxeno. Anfibolita — foliación metamórfica.","hab":"","catf":"geología","subf":"roca","base":"Gabro"},{"id":"ROC-004","cat":"Geología","sub":"Roca","name":"Obsidiana","sci":"Obsidiana (vidrio volcánico)","fam":"Ígnea volcánica (vítrea, ácida)","freq":"media","key":"Negro brillante con fractura concoidea perfecta (como el vidrio roto)","mnem":"El 'cristal negro de los aztecas': vidrio volcánico negro con bordes tan cortantes como una cuchilla","etym":"Del latín 'obsidianus'","notes":"Inconfundible por su brillo vítreo negro y fractura concoidea. No tiene estructura mineral visible. PRUEBAS: (1) Negro brillante VÍTREO: no tiene ningún grano mineral visible. (2) Fractura concoidea perfecta con bordes extremadamente cortantes. (3) Brillo como vidrio de botella. CONFUSIÓN CON: Basalto — opaco, sin brillo vítreo, fractura irregular. Sílex negro — también fractura concoidea pero opaco/mate y sedimentario. Shungita — también negra vítrea pero más rara y diferente contexto.","hab":"","catf":"geología","subf":"roca","base":"Obsidiana"},{"id":"ROC-005","cat":"Geología","sub":"Roca","name":"Pumita (piedra pómez)","sci":"Pumita","fam":"Ígnea volcánica (piroclástica)","freq":"media","key":"Extraordinariamente ligera: flota en el agua","mnem":"La 'roca que nada': la única roca que flota en el agua gracias a sus miles de burbujitas de gas","etym":"Del latín 'pumex' (pumita, piedra esponjosa)","notes":"Si el ejemplar flota en agua, ya tienes la respuesta. La ligereza extrema es el rasgo diagnóstico. PRUEBAS: (1) Poner en agua: FLOTA (la única roca común que flota). (2) Color blanco o gris pálido. (3) Innumerables poros y cavidades. CONFUSIÓN CON: Diatomita — también muy ligera y blanca, también puede flotar, pero de origen sedimentario; no vítrea. Toba volcánica — también porosa pero más densa y no siempre flota.","hab":"","catf":"geología","subf":"roca","base":"Pumita"},{"id":"ROC-006","cat":"Geología","sub":"Roca","name":"Riolita","sci":"Riolita","fam":"Ígnea volcánica (ácida)","freq":"media","key":"Color claro: rosado, grisáceo o blanquecino","mnem":"El 'granito volcánico': misma composición que el granito pero con grano fino y colores claros","etym":"Del griego 'rhyax' (corriente de lava) + 'lithos' (roca)","notes":"El color claro y la textura fina la distinguen del basalto. PRUEBAS: (1) Color claro: blanco, rosado o grisáceo. (2) Textura afanítica o con fenocristales de cuarzo y feldespato. (3) NO reacciona al HCl. CONFUSIÓN CON: Basalto — negro, no claro. Traquita — sin cuarzo; textura áspera al tacto. Andesita — más grisácea-verdosa. Dacita — entre riolita y andesita.","hab":"","catf":"geología","subf":"roca","base":"Riolita"},{"id":"ROC-007","cat":"Geología","sub":"Roca","name":"Caliza","sci":"Caliza (CaCO₃)","fam":"Sedimentaria carbonatada","freq":"muy_alta","key":"Reacciona vivamente con HCl (efervescencia): prueba diagnóstica definitiva","mnem":"La 'roca del ácido': una gota de HCl y burbujea sin parar. La piedra de las catedrales y los karst","etym":"Del latín 'calcarius' (relativo a la cal)","notes":"Prueba del HCl imprescindible. Muy abundante en la Comunidad de Madrid (Cretácico de la sierra). Diferenciar variedades: caliza compacta, lumaquela (con fósiles), oolítica, travertino. PRUEBAS: (1) Aplicar HCl: EFERVESCENCIA VIVA = caliza (definitivo). (2) Color gris, beige o blanco. (3) Posibles fósiles. (4) Comprobar que NO es dolomía (dolomía no efervesencia o muy débil en frío). CONFUSIÓN CON: Dolomía — NO efervescencia al HCl en frío (o muy débil). Mármol — caliza metamorfizada, sin fósiles, textura sacaroide. Travertino — poroso con huecos de vegetales. Sílex — muy duro, fractura concoidea.","hab":"","catf":"geología","subf":"roca","base":"Caliza"},{"id":"ROC-008","cat":"Geología","sub":"Roca","name":"Arenisca triásica (rodeno)","sci":"Arenisca (rodeno)","fam":"Sedimentaria detrítica","freq":"muy_alta","key":"Textura arenosa visible: granos de cuarzo cementados entre sí","mnem":"La 'lija roja del Triásico': aspereza característica y color rojo-ladrillo inconfundible en la serranía de Madrid","etym":"Arenisca = roca de arena; rodeno = nombre popular de la arenisca triásica roja","notes":"CONFIRMADO como la roca sedimentaria más frecuente en Madrid. El rodeno (arenisca triásica rojo-anaranjada) es muy específico de la geología madrileña. Junto con la cuarcita, la más preguntada. PRUEBAS: (1) Textura arenosa: granos de cuarzo visibles cementados. (2) Color rojo a anaranjado (óxidos de hierro). (3) NO reacciona al HCl (cemento silíceo o ferrugínoso). (4) Granos bien redondeados. CONFUSIÓN CON: Conglomerado — clastos >2mm, redondeados, mayor tamaño. Cuarcita — arenisca muy compacta, fractura a través de los granos (no entre ellos). Limolita — grano más fino (no visible con lupa). Brecha — cantos angulosos.","hab":"","catf":"geología","subf":"roca","base":"Arenisca"},{"id":"ROC-009","cat":"Geología","sub":"Roca","name":"Conglomerado","sci":"Conglomerado","fam":"Sedimentaria detrítica","freq":"alta","key":"Cantos rodados (>2 mm) de diferentes rocas cementados en una matriz arenosa o arcillosa","mnem":"La 'roca mosaico': mezcla de cantos rodados pegados. Como el fondo de un río cementado","etym":"Del latín 'conglomerare' (amontonar)","notes":"Diferenciar de brecha por el redondeo de los clastos. PRUEBAS: (1) Cantos rodados >2mm de diversas litologías cementados. (2) REDONDEADOS (si son angulosos = brecha). (3) Matriz arenosa o arcillosa entre los cantos. CONFUSIÓN CON: Brecha sedimentaria — cantos ANGULOSOS (no redondeados). Conglomerado volcánico — clastos de lava. Tilita — de origen glaciar, clastos sin clasificar.","hab":"","catf":"geología","subf":"roca","base":"Conglomerado"},{"id":"ROC-010","cat":"Geología","sub":"Roca","name":"Arcilla (lutita)","sci":"Lutita / Arcilla compactada","fam":"Sedimentaria detrítica fina","freq":"alta","key":"Grano muy fino (< 0.004 mm): no se distinguen granos a simple vista","mnem":"La 'roca de alfarero': se humedece, huele a tierra y se vuelve blanda. El barro hecho piedra","etym":"Del latín 'argilla' (arcilla blanca para modelar)","notes":"Puede aparecer en contexto de rocas de la cuenca del Tajo (Mioceno de Madrid). PRUEBAS: (1) Grano imperceptible (<0.004mm). (2) Aspecto masivo, sin brillo. (3) Plasticidad cuando húmeda. (4) Olor a tierra al humedecerse. CONFUSIÓN CON: Limolita — grano algo mayor (lupa lo revela); no tan plástica. Pizarra — foliación perfecta en láminas; grano imperceptible igualmente pero más dura. Tiza/creta — también fina pero reacciona al HCl.","hab":"","catf":"geología","subf":"roca","base":"Arcilla"},{"id":"ROC-011","cat":"Geología","sub":"Roca","name":"Yeso (roca evaporítica)","sci":"Roca de yeso","fam":"Sedimentaria evaporítica","freq":"alta","key":"Blanco mate a grisáceo; se raya con la uña (dureza 2)","mnem":"La 'roca del escayolista': blanca, blanda (uña la raya) y sin efervescencia (diferencia de la caliza)","etym":"Ver mineral yeso","notes":"Muy común en la Comunidad de Madrid (cuencas evaporíticas miocenas). La falta de reacción al HCl la diferencia de la caliza. PRUEBAS: (1) Rayar con la uña: si se marca fácilmente = yeso (dur.2). (2) NO reacciona al HCl (diferencia de caliza). (3) Color blanco a gris. (4) Aspecto sacaroide o fibroso. CONFUSIÓN CON: Caliza — reacciona vivamente al HCl. Anhidrita — más dura (dur.3.5), sin poder rayar con uña. Mármol — textura sacaroide pero muy duro, reacciona al HCl.","hab":"","catf":"geología","subf":"roca","base":"Yeso"},{"id":"ROC-012","cat":"Geología","sub":"Roca","name":"Carbón (hulla)","sci":"Hulla (carbón bituminoso)","fam":"Sedimentaria orgánica","freq":"baja","key":"Negro brillante con raya negra; muy ligero","mnem":"La 'roca que arde': negro brillante, ligero y deja raya negra. El carbón de piedra","etym":"De 'hulla': del flamenco 'huile' (aceite): por el color oscuro aceitoso","notes":"Puede aparecer en colecciones. Identificar variedad: turba < lignito < hulla < antracita. PRUEBAS: (1) Negro brillante a submetálico. (2) Raya negra/marrón oscura. (3) Muy ligero. (4) A veces se pueden ver capas o una estructura fibrosa. CONFUSIÓN CON: Grafito — mineral (no roca), metálico, mancha más. Pizarra carbonosa — tiene foliación perfecta. Antracita — más brillante y dura que la hulla. Turba — más ligera y fibrosa.","hab":"","catf":"geología","subf":"roca","base":"Carbon"},{"id":"ROC-013","cat":"Geología","sub":"Roca","name":"Pizarra","sci":"Pizarra","fam":"Metamórfica (grado bajo)","freq":"alta","key":"Exfoliación perfecta en láminas finas (clivaje pizarroso)","mnem":"La 'roca de la pizarra escolar': se parte en láminas perfectas, gris oscura y grano finísimo","etym":"Del latín vulgar 'plastea'","notes":"Muy frecuente. Clave: láminas perfectas + grano imperceptible. Diferencia de esquisto: el esquisto tiene minerales visibles. PRUEBAS: (1) Exfoliación perfecta en láminas finas = clivaje pizarroso (diagnóstico). (2) Grano imperceptible. (3) Color negro, gris o verdoso. (4) Superficies lisas y brillantes. CONFUSIÓN CON: Esquisto — también con foliación pero con minerales VISIBLES alineados (micas, clorita). Filita — brillo sedoso satinado más intenso que la pizarra. Lutita (arcilla) — no foliada, plasticidad cuando mojada.","hab":"","catf":"geología","subf":"roca","base":"Pizarra"},{"id":"ROC-014","cat":"Geología","sub":"Roca","name":"Esquisto","sci":"Esquisto","fam":"Metamórfica (grado medio)","freq":"alta","key":"Foliación bien desarrollada con minerales visibles alineados","mnem":"La 'roca espejo': superficies brillantes de mica con minerales porfidoblásticos — más grueso y brillante que la pizarra","etym":"Del griego 'schistos' (que puede dividirse)","notes":"Muy presente en la Sierra de Guadarrama. Diferenciar de pizarra (grano más fino) y de gneis (bandas de feldespato+cuarzo). PRUEBAS: (1) Foliación con minerales VISIBLES alineados (micas, clorita, granate). (2) Superficie brillante con micas. (3) Puede tener granates dodecaédricos. CONFUSIÓN CON: Pizarra — grano más fino, sin minerales visibles. Gneis — bandas ALTERNAS claras y oscuras (no foliación continua de micas). Filita — intermedia, brillo satinado pero minerales no visibles.","hab":"","catf":"geología","subf":"roca","base":"Esquisto"},{"id":"ROC-015","cat":"Geología","sub":"Roca","name":"Gneis","sci":"Gneis","fam":"Metamórfica (grado alto)","freq":"alta","key":"Bandas alternadas claras (cuarzo + feldespato) y oscuras (micas + anfíboles)","mnem":"El 'granito rayado': bandas claras y oscuras alternadas, como un código de barras en roca","etym":"Del alemán 'Gneis' (chispa): por el brillo de los feldespatos","notes":"Muy frecuente en el Sistema Central (Guadarrama). Las bandas claras/oscuras son el rasgo más llamativo. PRUEBAS: (1) Bandas ALTERNAS claras (cuarzo+feldespato) y oscuras (micas+anfíboles). (2) Grano grueso visible. (3) Sin foliación continua (bandeado, no esquistosidad). CONFUSIÓN CON: Granito — masivo, sin bandas. Esquisto — foliación continua de micas, no bandeado. Migmatita — mezcla de material metamórfico y fundido; más irregular. Diorita bandeada — sin metamorfismo.","hab":"","catf":"geología","subf":"roca","base":"Gneis"},{"id":"ROC-016","cat":"Geología","sub":"Roca","name":"Mármol","sci":"Mármol","fam":"Metamórfica (carbonatada)","freq":"alta","key":"Blanco a gris con textura sacaroide (azucarada): cristales de calcita entrelazados","mnem":"La 'caliza brillante': misma reacción al ácido pero textura azucarada cristalina y sin fósiles","etym":"Del griego 'marmaros' (piedra brillante)","notes":"Se distingue de la caliza por la textura sacaroide y la ausencia de fósiles (el metamorfismo los destruye). PRUEBAS: (1) Reacciona al HCl (carbonato de calcio). (2) Textura sacaroide (cristales de calcita interlocking). (3) Sin fósiles (destruidos por el metamorfismo). (4) A menudo con venas de calcita. CONFUSIÓN CON: Caliza — también reacciona al HCl pero tiene fósiles y textura más fina o micrítica. Yeso (roca) — no reacciona al HCl; dur.2. Cuarcita — también textura sacaroide pero no reacciona al HCl.","hab":"","catf":"geología","subf":"roca","base":"Marmol"},{"id":"ROC-017","cat":"Geología","sub":"Roca","name":"Cuarcita","sci":"Cuarcita","fam":"Metamórfica (cuarzosa)","freq":"muy_alta","key":"Muy dura y compacta; fractura concoidea (no se parte por los granos sino a través de ellos)","mnem":"La 'arenisca de acero': parece una arenisca blanquecina pero es durísima y la fractura no respeta los granos","etym":"De 'cuarzo' + '-ita' (roca): roca de cuarzo recristalizado","notes":"CONFIRMADA como la roca metamórfica más frecuente en Madrid. Clave diagnóstica definitiva: muy dura (7) + brillo vítreo + fractura concoidea. La arenisca fractura ENTRE granos (los ves rotos); la cuarcita fractura A TRAVÉS de los granos. PRUEBAS: (1) Muy dura: no se puede rayar con navaja. (2) Fractura CONCOIDEA — pasa A TRAVÉS de los granos, no entre ellos (diferencia de arenisca). (3) Resistente al meteorizado. CONFUSIÓN CON: Arenisca — fractura entre los granos (textura arenosa palpable). Sílex — también durísimo y fractura concoidea pero sedimentario, gris o negro. Corneana (hornfels) — también muy dura pero sin granos de cuarzo visibles.","hab":"","catf":"geología","subf":"roca","base":"Cuarcita"},{"id":"ROC-018","cat":"Geología","sub":"Roca","name":"Filita","sci":"Filita","fam":"Metamórfica (grado bajo-medio)","freq":"baja","key":"Brillo sedoso satinado en las superficies de foliación (más que la pizarra)","mnem":"La 'pizarra satinada': más brillante que la pizarra por sus micas incipientes, más fina que el esquisto","etym":"Del griego 'phyllon' (hoja): por sus superficies foliadas","notes":"Puede aparecer en la serie: lutita → pizarra → filita → esquisto. Su brillo sedoso la distingue de la pizarra. PRUEBAS: (1) Brillo sedoso SATINADO muy llamativo en superficies de foliación. (2) Color gris plateado o verdoso. (3) Grano fino pero algo mayor que pizarra. CONFUSIÓN CON: Pizarra — sin brillo satinado. Esquisto micáceo — con minerales visibles. Talquisita — foliación pero con talco.","hab":"","catf":"geología","subf":"roca","base":"Filita"},{"id":"ROC-019","cat":"Geología","sub":"Roca","name":"Peridotita","sci":"Peridotita","fam":"Ígnea plutónica (ultramáfica)","freq":"baja","key":"Dominantemente verde oscuro a negro por olivino y piroxeno","mnem":"La 'roca del manto': verde oscura, muy pesada y sin cuarzo — viene de las profundidades","etym":"De 'peridoto' (nombre antiguo del olivino) + '-ita' (roca)","notes":"Verde oscura + muy densa son las claves. Menos frecuente pero importante conceptualmente. PRUEBAS: (1) Verde oscuro dominante (olivino). (2) Muy densa. (3) Sin plagioclasa visible (a diferencia del gabro). (4) En xenolitos de volcanes o en ofiolitas. CONFUSIÓN CON: Gabro — también oscuro pero con plagioclasa blanca visible. Serpentinita — verde oscura pero brillo aceitoso y menos densa. Dunita — todo olivino, aún más verde.","hab":"","catf":"geología","subf":"roca","base":"Peridotita"},{"id":"ROC-020","cat":"Geología","sub":"Roca","name":"Diorita","sci":"Diorita","fam":"Ígnea plutónica (intermedia)","freq":"baja","key":"Textura sal-pimienta: plagioclasa blanca + hornblenda negra en proporciones similares","mnem":"El 'granito sal y pimienta': igual de granular que el granito pero sin cuarzo rosado, solo blanco y negro","etym":"Del griego 'diorizein' (distinguir): por sus colores contrastados","notes":"La ausencia de cuarzo y el color 'sal y pimienta' son diagnósticos. PRUEBAS: (1) Textura 'sal y pimienta': plagioclasa BLANCA + hornblenda NEGRA a partes iguales. (2) Sin cuarzo visible. (3) Grano medio-grueso. CONFUSIÓN CON: Granito — tiene cuarzo gris y feldespato rosado. Gabro — más oscuro, más piroxeno, menos plagioclasa blanca. Tonalita — también sal-pimienta pero con cuarzo.","hab":"","catf":"geología","subf":"roca","base":"Diorita"},{"id":"ROC-021","cat":"Geología","sub":"Roca","name":"Andesita","sci":"Andesita","fam":"Ígnea volcánica (intermedia)","freq":"baja","key":"Gris oscura a verdosa; textura afanítica o porfirítica","mnem":"La 'roca de los Andes': gris con manchas blancas de plagioclasa, más clara que el basalto","etym":"De 'Andes': roca volcánica típica de la Cordillera de los Andes","notes":"Equivalente volcánico de la diorita. Puede parecer un basalto grisáceo con fenocristales blancos. PRUEBAS: (1) Textura afanítica o con fenocristales. (2) Gris oscura a verdosa. (3) Fenocristales blancos de plagioclasa o negros de hornblenda. CONFUSIÓN CON: Basalto — más negro, sin fenocristales blancos. Riolita — más clara. Dacita — más clara que andesita.","hab":"","catf":"geología","subf":"roca","base":"Andesita"},{"id":"ROC-022","cat":"Geología","sub":"Roca","name":"BrechaSedimentaria","sci":"Brecha","fam":"Sedimentaria detrítica","freq":"baja","key":"Cantos angulosos (no redondeados) cementados en matriz fina","mnem":"El 'conglomerado roto': misma idea pero fragmentos con aristas, no redondeados","etym":"Del italiano 'breccia' (grava, escombros)","notes":"La angularidad de los clastos es la clave diferencial respecto al conglomerado. PRUEBAS: (1) Clastos ANGULOSOS (no redondeados) cementados en matriz fina. (2) Clastos de una sola litología (brechas monomícticas) o varias (polimícticas). (3) Textura caótica. CONFUSIÓN CON: Conglomerado — clastos REDONDEADOS. Tilita (till glaciar) — mala clasificación pero clastos muy variados. Brecha de falla — clastos del propio encajante en zona de falla.","hab":"","catf":"geología","subf":"roca","base":"BrechaSedimentaria"},{"id":"ROC-023","cat":"Geología","sub":"Roca","name":"Sílex (pedernal)","sci":"Sílex (SiO₂ microcristalino)","fam":"Sedimentaria silícea","freq":"media","key":"Gris, negro o pardo; fractura concoidea perfecta con bordes muy cortantes","mnem":"La 'roca de los cavernícolas': gris, durísima, fractura concoidea con filos cortantes y produce chispas","etym":"Del latín 'silex' (pedernal, roca dura)","notes":"Puede aparecer en contexto de calizas (nódulos de sílex). La fractura concoidea con bordes afilados es clave. PRUEBAS: (1) Fractura concoidea perfecta con bordes muy cortantes. (2) Muy duro (dur.7). (3) Color gris, negro, pardo o beige. (4) Sin efervescencia al HCl. CONFUSIÓN CON: Caliza — reacciona al HCl; fractura no concoidea. Obsidiana — brillo vítreo más intenso; volcánica. Cuarcita — fractura concoidea pero contexto metamórfico.","hab":"","catf":"geología","subf":"roca","base":"Silex"},{"id":"ROC-024","cat":"Geología","sub":"Roca","name":"Dolomía","sci":"Dolomía","fam":"Sedimentaria carbonatada","freq":"alta","key":"Aspecto similar a la caliza: gris a crema","mnem":"La 'caliza reacia al ácido': si el HCl en frío no hace casi nada, es dolomía, no caliza","etym":"De 'dolomita' (ver mineral dolomita)","notes":"La prueba diferencial es el HCl en frío: caliza → efervescencia fuerte; dolomía → efervescencia débil o nula. PRUEBAS: (1) HCl en frío: NO efervescencia (o muy débil). (2) Raspar en polvo + HCl: efervescencia. (3) Color gris a beige, igual que caliza. CONFUSIÓN CON: Caliza — EFERVESCENCIA VIVA al HCl en frío. La dolomía NO. Sin más pruebas son prácticamente indistinguibles visualmente.","hab":"","catf":"geología","subf":"roca","base":"Dolomia"},{"id":"ROC-025","cat":"Geología","sub":"Roca","name":"Travertino","sci":"Travertino","fam":"Sedimentaria carbonatada (química)","freq":"baja","key":"Estructura porosa con huecos redondeados (moldes de vegetales o burbujas)","mnem":"La 'caliza esponjosa de los baños termales': porosa con huecos de plantas y bandas de colores claros","etym":"Del latín 'lapis tiburtinus' (piedra de Tívoli, Italia)","notes":"Los huecos y el bandeado son diagnósticos. Presente en algunas fuentes termales de la Comunidad de Madrid. PRUEBAS: (1) Estructura POROSA con huecos redondeados (moldes de raíces, burbujas de CO₂). (2) Reacciona al HCl. (3) Bandeado paralelo. (4) A menudo depositado por fuentes. CONFUSIÓN CON: Caliza — sin porosidad tan característica. Pumita — también porosa pero vítrea y no reacciona al HCl. Diatomita — porosa pero sin reacción al HCl.","hab":"","catf":"geología","subf":"roca","base":"Travertino"},{"id":"ROC-026","cat":"Geología","sub":"Roca","name":"Granodiorita","sci":"Granodiorita","fam":"Ígnea plutónica (ácida-intermedia)","freq":"alta","key":"Similar al granito pero más oscura: más plagioclasa que ortosa, más biotita+hornblenda","mnem":"El 'granito un poco más oscuro': más minerales oscuros que el granito pero aún con cuarzo visible","etym":"Combinación de 'granito' y 'diorita'","notes":"MUY RELEVANTE para Madrid: es la roca predominante en gran parte de la Sierra de Guadarrama. Puede aparecer etiquetada como 'granito' en sentido popular. PRUEBAS: (1) Similar al granito pero más oscura. (2) Más plagioclasa (blanca-grisácea) que ortosa (rosada). (3) Más hornblenda y biotita que el granito. (4) Cuarzo presente. CONFUSIÓN CON: Granito — más rosado (ortosa), más claro. Diorita — sin cuarzo; más oscura aún. Tonalita — también con plagioclasa dominante pero aún más oscura.","hab":"","catf":"geología","subf":"roca","base":"Granodiorita"},{"id":"ROC-027","cat":"Geología","sub":"Roca","name":"Migmatita","sci":"Migmatita","fam":"Metamórfica (grado muy alto)","freq":"media","key":"Mezcla de material oscuro metamórfico y bandas claras de material fundido (leucosoma)","mnem":"El 'gneis con marmoreo': bandas oscuras de esquisto más venas blancas de cuarzo-feldespato inyectadas","etym":"Del griego 'migma' (mezcla)","notes":"Presente en el basamento del Sistema Central. Indica metamorfismo de altísimo grado. PRUEBAS: (1) Material oscuro metamórfico entremezclado con VENAS o MANCHAS claras de material fundido (leucosoma). (2) Aspecto nebulítico o ptígmático. (3) Grano grueso. CONFUSIÓN CON: Gneis — tiene bandas regulares, no mezcla de fundido. Granito intrusivo — masivo y homogéneo. Esquisto — foliación, sin material fundido.","hab":"","catf":"geología","subf":"roca","base":"Migmatita"},{"id":"ROC-028","cat":"Geología","sub":"Roca","name":"Corneana (hornfels)","sci":"Corneana","fam":"Metamórfica de contacto","freq":"baja","key":"Muy dura y compacta; aspecto córneo o vítreo","mnem":"La 'roca 'hornada' por el magma': dura, compacta, oscura y sin bandas. El mármol del mundo sedimentario","etym":"Del alemán 'Hornfels' (roca córnea): por su dureza y aspecto","notes":"Aparece en zonas de contacto (aureolas de metamorfismo) próximas a intrusiones graníticas — frecuentes en el Sistema Central. PRUEBAS: (1) Aspecto córneo o similar a la porcelana. (2) Muy dura (no se raya con navaja). (3) Fractura irregular a subconcoidea. (4) Siempre en aureolas de contacto alrededor de intrusiones. CONFUSIÓN CON: Cuarcita — también durísima pero con textura arenosa. Basalto — también compacto y duro pero con fractura columnar. Sílex — fractura concoidea perfecta, sedimentario.","hab":"","catf":"geología","subf":"roca","base":"Corneana"},{"id":"ROC-029","cat":"Geología","sub":"Roca","name":"Pegmatita","sci":"Pegmatita","fam":"Roca ígnea plutónica extrema","freq":"muy_alta","key":"Cristales de tamaño gigantesco (centímetros a metros): la roca de mayor tamaño de cristal","mnem":"El 'granito de los gigantes': mismos minerales que el granito pero con cristales tan grandes que se pueden coger con la mano. Si un 'granito' tiene cristales de 10 cm, es pegmatita","etym":"Del griego 'pegma' (cosa unida, ensamblada): por la firmeza de la textura interbloqueada de sus cristales gigantes","notes":"La pegmatita es imprescindible para el visu de petrología. Los cristales gigantes + composición granítica + minerales raros asociados son diagnósticos. El origen en la última fracción magmática explica la concentración de elementos raros. PRUEBAS: (1) Cristales de tamaño centimétrico o mayor — visibles a gran distancia. (2) Composición similar al granito (cuarzo, feldespato, mica). (3) Minerales raros asociados (turmalina, berilo, topacio). CONFUSIÓN CON: Granito de grano grueso — cristales menores de 1 cm. La pegmatita tiene cristales de cm a metros. Aploita — también en diques pero de grano FINO, no grueso.","hab":"","catf":"geología","subf":"roca","base":"Pegmatita"},{"id":"ROC-030","cat":"Geología","sub":"Roca","name":"Sienita","sci":"Sienita","fam":"Roca ígnea plutónica","freq":"alta","key":"Como el granito pero SIN cuarzo visible — el feldespato domina sin acompañante de cuarzo","mnem":"El 'granito sin cuarzo': rosado y de grano visible como el granito pero sin el cuarzo grisáceo entre los feldespatos. La ausencia de cuarzo es la clave","etym":"Del latín 'Syene' (antigua ciudad de Egipto, actual Asuán), donde los romanos la encontraron","notes":"La sienita = granito sin cuarzo. La distinción petrológica cuarzo/sin cuarzo en rocas plutónicas es fundamental. La sienita nefelínica (con nefelina en vez de cuarzo) es la roca del Teide. PRUEBAS: (1) Aspecto de granito pero BUSCANDO cuarzo: si no hay cuarzo gris = sienita. (2) Feldespato domina completamente. (3) Color similar al granito pero más uniforme. CONFUSIÓN CON: Granito — tiene cuarzo gris bien visible. Traquita — equivalente volcánico de la sienita, afanítica. Nefelinita sienítica — con nefelina en lugar de cuarzo.","hab":"","catf":"geología","subf":"roca","base":"Sienita"},{"id":"ROC-031","cat":"Geología","sub":"Roca","name":"Tonalita","sci":"Tonalita","fam":"Roca ígnea plutónica","freq":"media","key":"Color gris claro; dominan las plagioclasas blancas sobre los feldespatos oscuros","mnem":"El 'granito gris sin rosado': blanco-grisáceo uniforme sin los granos rosados de ortosa del granito. La ausencia del rosado del feldespato potásico lo distingue del granito","etym":"Del puerto de Tonale (Alpes italianos), donde fue estudiada por primera vez","notes":"La tonalita junto a la trondhjemita y la granodiorita forman la serie TTG, que es la composición dominante de la corteza continental arcaica. Fundamental en geología de la corteza precámbrica. PRUEBAS: (1) Color gris claro. (2) Plagioclasa blanca DOMINANTE. (3) Cuarzo presente pero sin feldespato potásico rosado. (4) Hornblenda o biotita oscuras. CONFUSIÓN CON: Granodiorita — más cuarzo y algo de ortosa rosada. Diorita — sin cuarzo. Granito — feldespato potásico rosado abundante.","hab":"","catf":"geología","subf":"roca","base":"Tonalita"},{"id":"ROC-032","cat":"Geología","sub":"Roca","name":"Aplita","sci":"Aplita","fam":"Roca ígnea hipabismal","freq":"media","key":"Color blanco a rosado claro; textura azucarada (cristales muy finos iguales entre sí)","mnem":"El 'granito de azúcar blanco': dique blanco-rosado de grano finísimo que corta al granito — como si alguien hubiera rellenado las grietas del granito con azúcar muy fino","etym":"Del griego 'haploos' (simple): por su composición simple (esencialmente cuarzo + feldespato)","notes":"Las aplitas siempre aparecen como diques que cortan al granito del que proceden. La textura 'azucarada' (equigranular muy fina) es diagnóstica y contrasta con la pegmatita (cristales gigantes). PRUEBAS: (1) Grano muy fino uniforme ('azucarado'). (2) Color blanco o rosado claro. (3) En diques cortando al granito huésped. (4) Composición granítica. CONFUSIÓN CON: Pegmatita — grano enorme (lo opuesto). Riolita — volcánica; textura diferente. Caliza de grano fino — reacciona al HCl.","hab":"","catf":"geología","subf":"roca","base":"Aplita"},{"id":"ROC-033","cat":"Geología","sub":"Roca","name":"Toba volcánica / Ignimbrita","sci":"Toba volcánica / Ignimbrita","fam":"Roca piroclástica","freq":"alta","key":"Roca de cenizas volcánicas cementadas; textura porosa-esponjosa o compacta","mnem":"La 'ceniza petrificada': los fragmentos de pómez y ceniza atrapados y cementados forman esta roca ligera y porosa — la huella de una erupción violenta conservada en piedra","etym":"Toba = del italiano 'tufo' (material blando) · Ignimbrita del latín 'ignis' (fuego) + 'imber' (lluvia): 'lluvia de fuego'","notes":"Las tobas y las ignimbritas son los productos sólidos de las erupciones explosivas. Las ignimbritas (con fiamme aplastados) indican erupciones de flujo piroclástico muy peligrosas. Frecuentes en Canarias. PRUEBAS: (1) Textura porosa. (2) A menudo con fragmentos de otros materiales (pómez, lapilli, cristales). (3) Puede tener estructura de flujo (en ignimbritas). (4) Sin efervescencia al HCl. CONFUSIÓN CON: Pumita — también volcánica y porosa pero sin fragmentos; más homogénea. Travertino — poroso pero efervescencia al HCl. Diatomita — porosa y blanca pero sedimentaria.","hab":"","catf":"geología","subf":"roca","base":"Toba"},{"id":"ROC-034","cat":"Geología","sub":"Roca","name":"Traquita","sci":"Traquita","fam":"Roca ígnea volcánica","freq":"media","key":"Color gris claro a blanquecino; superficie áspera al tacto (el nombre significa 'rugoso')","mnem":"La 'basalto sin color y áspera al tacto': gris clara o blanquecina (a diferencia del basalto negro) y con esa textura rugosa que se nota con la yema del dedo — la volcánica de las islas alcalinas","etym":"Del griego 'trachys' (áspero, rugoso): por la textura rugosa de su superficie al tacto","notes":"Traquita = equivalente volcánico de la sienita. La textura fluidal (feldespatos alineados) es diagnóstica en lámina delgada. Frecuente en erupciones de islas oceánicas (Canarias, Azores). PRUEBAS: (1) Superficie áspera al tacto (el nombre viene de 'rugoso'). (2) Feldespatos alineados dando textura fluidal. (3) Color gris claro a blanquecino. (4) Sin cuarzo (diferencia de riolita). CONFUSIÓN CON: Riolita — también clara pero CON cuarzo; superficie menos áspera. Andesita — más oscura. Fonolita — similar pero con nefelina.","hab":"","catf":"geología","subf":"roca","base":"Traquita"},{"id":"ROC-035","cat":"Geología","sub":"Roca","name":"Dacita","sci":"Dacita","fam":"Roca ígnea volcánica","freq":"media","key":"Color gris claro a blanquecino; más clara que el basalto, más oscura que la riolita","mnem":"La 'andesita con cuarzo': si la roca volcánica grisácea tiene fenocristales de cuarzo redondeados en la matriz oscura, es dacita — el cuarzo en una roca volcánica andesítica es diagnóstico","etym":"De la provincia romana de Dacia (actual Rumanía), donde fue estudiada por primera vez","notes":"La dacita es la roca del monte Santa Helena (1980) y el Pinatubo (1991). La presencia de cuarzo + plagioclasa en fenocristales es diagnóstica vs. andesita (sin cuarzo). PRUEBAS: (1) Color gris claro a blanquecino. (2) Fenocristales de cuarzo + plagioclasa ± hornblenda. (3) Más oscura que riolita, más clara que andesita. CONFUSIÓN CON: Riolita — más clara, más feldespato potásico. Andesita — más oscura, sin cuarzo. Granodiorita — equivalente plutónico.","hab":"","catf":"geología","subf":"roca","base":"Dacita"},{"id":"ROC-036","cat":"Geología","sub":"Roca","name":"Calcarenita","sci":"Calcarenita","fam":"Roca sedimentaria carbonatada","freq":"alta","key":"Caliza de grano visible (tamaño arena): oolitos, bioclastos o peloides visibles sin lupa","mnem":"La 'caliza de grano que se ve sin lupa': al contrario que la caliza microcristalina (afanítica), la calcarenita tiene granos visibles — oolitos como pequeñas perlas o trocitos de conchas","etym":"Del latín 'calcarius' (calizo) + 'arena': 'caliza de arena'","notes":"La distinción caliza micrítica (grano fino, opaca) / calcarenita (grano visible) es fundamental en petrología carbonatada. Los oolitos (concentraciones concéntricas de calcita) son diagnósticos. PRUEBAS: (1) Granos de carbonato VISIBLES a simple vista o con lupa (oolitos, bioclastos, peloides). (2) Efervescencia al HCl. (3) Textura más gruesa que la caliza micrítica. CONFUSIÓN CON: Caliza micrítica — fina y opaca, sin granos visibles. Arenisca calcárea — granos de cuarzo visibles, no carbonato. Lumaquela — todo conchas y bioclastos.","hab":"","catf":"geología","subf":"roca","base":"Calcarenita"},{"id":"ROC-037","cat":"Geología","sub":"Roca","name":"Lumaquela","sci":"Lumaquela","fam":"Roca sedimentaria bioclástica","freq":"alta","key":"Roca formada casi exclusivamente por fragmentos de conchas acumulados — visible a simple vista","mnem":"La 'roca que parece un cubo de conchas pegadas': las conchas completas o rotas visibles son el 100% de la roca — como si hubiera vaciado un cubo de mejillones y lo hubiera fosilizado","etym":"Del italiano 'lumaca' (caracol): 'roca de caracoles'","notes":"La lumaquela es ideal para el visu por ser un ejemplo muy visual y claro de roca biogénica. Permite trabajar directamente con los fósiles de los que está compuesta. PRUEBAS: (1) Acúmulo de conchas y fragmentos bioclásticos visible a simple vista. (2) Efervescencia al HCl. (3) Textura muy porosa entre las conchas. CONFUSIÓN CON: Calcarenita — también bioclastos pero más fragmentados, menos conchas enteras. Caliza arrecifal — bioconstruida in situ, sin acúmulo alóctono. Coquina — similar término anglosajón.","hab":"","catf":"geología","subf":"roca","base":"Lumaquela"},{"id":"ROC-038","cat":"Geología","sub":"Roca","name":"Turbidita","sci":"Turbidita","fam":"Roca sedimentaria detrítica","freq":"baja","key":"Alternancia regular de capas arenosas más gruesas (base) y pelíticas más finas (techo)","mnem":"La 'roca de la avalancha submarina': cada capa empieza con arena gruesa (la avalancha) y acaba con fango fino (cuando la corriente se calma) — las rayas alternas muestran cada avalancha","etym":"Del latín 'turbidus' (turbio, revuelto): depósito de corrientes de agua cargadas de sedimento","notes":"Las turbiditas forman enormes abanicos submarinos (como el del Nilo o el del Indo). La secuencia de Bouma (Ta-Tb-Tc-Td-Te) es evaluable. Muy frecuentes en el flysch del Cretácico ibérico. PRUEBAS: (1) Alternancia regular de capas arenosas (base, más gruesas) y pelíticas (techo, más finas). (2) Secuencia de Bouma visible. (3) Base erosiva de las capas arenosas. CONFUSIÓN CON: Flysch — la turbidita ES el flysch o lo forma. Alternancia de calizas-margas — efervescencia al HCl en la caliza. Ritmita — también alternante pero sin secuencia de Bouma.","hab":"","catf":"geología","subf":"roca","base":"Turbidita"},{"id":"ROC-039","cat":"Geología","sub":"Roca","name":"Radiolarita","sci":"Radiolarita","fam":"Roca sedimentaria silícea","freq":"baja","key":"Roca de sílice (SiO₂) biogénica: acumulación de caparazones de radiolarios","mnem":"El 'sílex rojo de los fondos profundos': dura y brillante como el pedernal pero con tonos rojizos, verdes o negros — el sílex del fondo del océano hecho de esqueletos microscópicos","etym":"De 'Radiolaria' (los microorganismos cuyo esqueleto la forma) + '-ita' (roca)","notes":"La radiolarita es el equivalente biogénico del sílex (pedernal). Su color rojizo se debe al óxido de hierro, el verde a la clorita. Marcadora de entornos oceánicos profundos (por debajo de la CCD). PRUEBAS: (1) Color rojizo a verde. (2) Muy dura (dur.7, SiO₂). (3) No efervescencia al HCl. (4) Fractura concoidea. (5) Al microscopio: caparazones de radiolarios. CONFUSIÓN CON: Caliza — efervescencia al HCl; más blanda. Sílex — mismo SiO₂ pero origen diagenético, no biogénico estricto; más gris. Pizarra roja — foliación; más blanda.","hab":"","catf":"geología","subf":"roca","base":"Radiolarita"},{"id":"ROC-040","cat":"Geología","sub":"Roca","name":"Diatomita","sci":"Diatomita","fam":"Roca sedimentaria silícea","freq":"baja","key":"Roca muy ligera (flota en agua), blanca y suave: literalmente polvo de caparazones de diatomeas","mnem":"La 'tiza que pega a la lengua y no hace burbujas': blanca y suave como la caliza pero no reacciona con el ácido (sílice, no calcita). Y si la tocas con la lengua, la succiona","etym":"De 'diatom' (diatomea, del griego 'diatomos' = dividida en dos) + '-ite' (roca)","notes":"La prueba de la lengua (adherencia) + la no efervescencia con HCl distinguen la diatomita de la caliza. La diatomita es el producto de Tierra de Diatomeas (insecticida, filtros, aislante). PRUEBAS: (1) Extraordinariamente ligera. (2) Color blanco. (3) Se adhiere a la lengua (absorbe humedad). (4) NO efervescencia al HCl (SiO₂, no CaCO₃). (5) Aspecto terroso. CONFUSIÓN CON: Caliza cretácea (tiza) — también blanca y suave pero EFERVESCENCIA al HCl. Talco en masa — también blanco y suave pero más graso. Pumita — también muy ligera pero vítrea, volcánica.","hab":"","catf":"geología","subf":"roca","base":"Diatomita"},{"id":"ROC-041","cat":"Geología","sub":"Roca","name":"Sal gema / Halitita","sci":"Roca de sal (Halitita)","fam":"Roca sedimentaria evaporítica","freq":"alta","key":"Sabor salado inconfundible — el diagnóstico más directo de todo el visu","mnem":"La 'roca que sabe a sal': el único caso donde el sabor da el diagnóstico al instante. Si te dejan probarla (siempre con precaución), la sal gema tiene sabor salado puro y limpio","etym":"Sal = del latín 'sal' · Gema = del latín 'gemma' (piedra preciosa): sal cristalina pura y brillante","notes":"La sal gema se distingue de la halita (mineral) solo en escala: sal gema = la roca formada por halita. El sabor + la solubilidad en agua son diagnósticos. Los diapiros de sal son estructuras tectónicas evaluables. PRUEBAS: (1) PROBAR: sabor salado inmediato = diagnóstico definitivo. (2) Clivaje cúbico en todos los fragmentos. (3) Traslúcida a transparente. CONFUSIÓN CON: Yeso (roca) — no sabe a nada; dur.2; láminas. Silvitita — sabor amargo/picante (no salado). Anhidrita — sin sabor; más dura.","hab":"","catf":"geología","subf":"roca","base":"Sal"},{"id":"ROC-042","cat":"Geología","sub":"Roca","name":"Anfibolita","sci":"Anfibolita","fam":"Roca metamórfica de alto grado","freq":"alta","key":"Color negro a verde oscuro; aspecto brillante por los anfíboles (hornblenda)","mnem":"El 'esquisto negro y verde sin brillo de micas': negro y brillante por la hornblenda pero sin las láminas plateadas de las micas del esquisto — compacto y oscuro","etym":"Del griego 'amphi' (ambos lados) + 'bolein' (arrojar): 'el que tiene minerales a ambos lados' — anfíbol + plagioclasa en el nombre","notes":"La anfibolita es el producto de metamorfismo de basalto en la facies anfibolítica. El par hornblenda (negro) + plagioclasa (blanco) en bandas alternantes es diagnóstico. PRUEBAS: (1) Negro a verde oscuro con brillo por anfíboles (hornblenda). (2) Foliación metamórfica. (3) Grano medio. (4) Sin cuarzo. CONFUSIÓN CON: Basalto — sin foliación; afanítico. Gabro — sin foliación; plutónico. Esquisto con hornblenda — puede ser similar; la anfibolita tiene >50% anfíbol.","hab":"","catf":"geología","subf":"roca","base":"Anfibolita"},{"id":"ROC-043","cat":"Geología","sub":"Roca","name":"Granulita","sci":"Granulita","fam":"Roca metamórfica de muy alto grado","freq":"media","key":"Textura granoblástica: granos equidimensionales sin foliación (aspecto de granito pero metamórfica)","mnem":"El 'metamórfico que ha olvidado que es metamórfico': no tiene foliación ni micas — los granos son todos iguales como en una roca ígnea. El metamorfismo fue tan intenso que borró toda la estructura","etym":"Del latín 'granulum' (granito pequeño): por la textura granular equidimensional","notes":"Las granulitas representan el metamorfismo más profundo de la corteza continental. La ausencia de anfíboles + presencia de piroxenos + textura granoblástica son diagnósticos. PRUEBAS: (1) Granos equidimensionales sin foliación (aspecto de granito pero de origen metamórfico). (2) Puede tener granate. (3) Sin anfíboles (piroxenos en su lugar). (4) Metamorfismo de muy alto grado. CONFUSIÓN CON: Granito — de origen ígneo, no metamórfico; mismo aspecto pero diferente historia. Gneis — tiene foliación y bandas. Cuarcita — también granulítica pero solo cuarzo.","hab":"","catf":"geología","subf":"roca","base":"Granulita"},{"id":"ROC-044","cat":"Geología","sub":"Roca","name":"Eclogita","sci":"Eclogita","fam":"Roca metamórfica de alta presión","freq":"baja","key":"Color verde y rojo: piroxeno verde (onfacita) + granate rojo o rosado — absolutamente diagnóstico","mnem":"La 'roca verde y roja de las profundidades': solo hay una roca con ese patrón de verde intenso + rojo intenso en los mismos granos. El verde es piroxeno sódico, el rojo es granate — los 'semáforos de las profundidades'","etym":"Del griego 'ekloge' (selección, elección): 'la elegida' — por su aspecto llamativo y excepcional","notes":"El binomio onfacita (verde) + granate (rojo) en eclogitas es uno de los rasgos diagnósticos más espectaculares de la petrología. Las eclogitas son las rocas que suben desde la zona de subducción. PRUEBAS: (1) Color verde + ROJO/ROSADO juntos: piroxeno verde (onfacita) + granate rojo. (2) Muy densa (3.5-3.6 g/cm³). (3) Sin feldespato. CONFUSIÓN CON: Serpentinita — solo verde, sin granate rojo. Peridotita — verde más uniforme, olivino sin granate rojo. La eclogita es reconocible precisamente por el contraste bicolor verde-rojo.","hab":"","catf":"geología","subf":"roca","base":"Eclogita"},{"id":"ROC-045","cat":"Geología","sub":"Roca","name":"Serpentinita","sci":"Serpentinita","fam":"Roca metamórfica hidrotermal","freq":"baja","key":"Color verde oscuro a negro-verdoso con aspecto aceitoso y brillante","mnem":"La 'peridotita que se convirtió en serpiente': verde oscura con venas sinuosas en red — el manto oceánico que ha absorbido agua y se ha transformado. El 'mosaico verde' de la litosfera oceánica","etym":"De 'serpentina' (el mineral que la compone, del latín 'serpens' = serpiente): por las venas verdes sinuosas que recuerdan una serpiente","notes":"La serpentinita marca los bordes de placas y zonas de subducción donde el manto oceánico ha interactuado con el agua. La textura en red es diagnóstica. La serpentinización libera hidrógeno (fuente de energía para comunidades quimiolitotróficas). PRUEBAS: (1) Verde oscuro a negro-verdoso con aspecto aceitoso o brillante. (2) Textura fibrosa o masiva. (3) Puede tener venas blancas de crisotilo (amianto). (4) Asociada a ofiolitas. CONFUSIÓN CON: Peridotita — menos brillante, sin aspecto aceitoso. Basalto — negro sin brillo verde aceitoso. Clorita-esquisto — foliación, láminas de clorita visibles.","hab":"","catf":"geología","subf":"roca","base":"Serpentinita"},{"id":"ROC-046","cat":"Geología","sub":"Roca","name":"Skarn","sci":"Skarn (roca calcosilicatada)","fam":"Roca metamórfica de contacto","freq":"alta","key":"Colores muy vivos: verde, amarillo, marrón, rojo — el metamorfismo de contacto más llamativo","mnem":"La 'joyería del contacto entre el granito y la caliza': colores vivísimos (verde, amarillo, rojo) en la zona de mezcla. Si la roca parece un arcoíris metálico en el contacto de dos rocas muy diferentes, es skarn","etym":"Del sueco 'skarv' (ganga, rocas de desecho): nombre minero sueco para estas rocas del contacto","notes":"El skarn es el resultado de la reacción entre fluidos silíceos del granito y la caliza (CaCO₃ + SiO₂ → silicatos cálcicos). Es una mena importante de Cu, Fe, Zn. Los granates de grosularia son diagnósticos. PRUEBAS: (1) Colores MUY VIVOS: verde (epidota, actinolita), rojo (granate), amarillo (vesuvianita). (2) Contacto entre granito y caliza. (3) Minerales de contacto reconocibles. CONFUSIÓN CON: Gneis — bandas regulares sin colores tan llamativos. Mármol — también de contacto pero todo carbonato blanco. Corneana — también de contacto pero más homogénea y oscura.","hab":"","catf":"geología","subf":"roca","base":"Skarn"},{"id":"ROC-047","cat":"Geología","sub":"Roca","name":"Milonita","sci":"Milonita","fam":"Roca de falla (tectonita)","freq":"media","key":"Bandeado muy fino, casi como papel: láminas alternadas extremadamente delgadas","mnem":"La 'roca estirada como chicle': las bandas son tan finas y los minerales tan alargados que parece que alguien estiró la roca como si fuera chicle. El resultado de millones de años de cizallamiento","etym":"Del griego 'mylos' (molino): 'la roca que ha sido molida' por el movimiento tectónico","notes":"Las milonitas se forman en zonas de falla dúctil profundas (fallas de corteza media). La estructura S-C permite deducir el sentido del movimiento de la falla. Importante en tectónica. PRUEBAS: (1) Bandeado extremadamente fino (mm). (2) Superficies lisas brillantes. (3) Asociada a zonas de falla dúctil. (4) Sin fragmentos angulosos (a diferencia de la brecha de falla). CONFUSIÓN CON: Brecha de falla/cataclasita — fragmentos angulosos visibles; falla frágil (superficial). Pizarra — clivaje pizarroso pero sin bandeado tan fino. Esquisto — minerales visibles.","hab":"","catf":"geología","subf":"roca","base":"Milonita"},{"id":"ROC-048","cat":"Geología","sub":"Roca","name":"BrechaFalla","sci":"Brecha de falla / Cataclasita","fam":"Roca de falla (tectonita frágil)","freq":"media","key":"Fragmentos angulosos de la roca encajante cementados por una matriz muy fina","mnem":"La 'roca triturada de la falla': fragmentos angulosos de la propia roca cementados en matriz. Como la brecha sedimentaria pero todos los fragmentos son de la misma roca y están in situ","etym":"Del g
