 diagnósticos de Oligochaeta. Darwin dedicó un libro completo a las lombrices y su papel en la fertilidad del suelo.","hab":"Suelos húmedos y ricos en materia orgánica","q1":"¿Cómo usarías el mnemónico de Lombriz de tierra para no olvidarlo en el examen?","t1":["cilíndrica","segmentada","lombriz","intestinos","darwin"],"q2":"¿Qué rasgo de Lombriz de tierra es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["cilíndrico","segmentado","segmentos","cuerpo","visibles"],"catf":"invertebrados","subf":"anélido"},{"id":"ARA-001","cat":"Invertebrados","sub":"Arácnido","name":"Escorpión amarillo","sci":"Buthus occitanus","fam":"Buthidae","freq":"alta","key":"Telson (aguijón) en el extremo de la cola curvada — diagnóstico del orden","mnem":"El 'alacrán amarillo de las piedras': amarillo con pinzas y cola en U con aguijón — el más común de España","etym":"Buthus (gr.) = 'escorpión del norte de África' · occitanus = 'de Occitania'","notes":"El aguijón en el telson + 8 patas + pinzas son diagnósticos de Scorpiones. Es el escorpión más venenoso de Europa (veneno neurotóxico, raramente mortal en adultos).","hab":"Zonas áridas y semiáridas mediterráneas; bajo piedras y troncos","q1":"¿Qué imagen mental evoca el mnemónico de Escorpión amarillo? Descríbelo con tus palabras.","t1":["amarillo","alacrán","piedras","pinzas","aguijón"],"q2":"¿Cuál es el rasgo más diagnóstico de Escorpión amarillo? Incluye al menos un término clave.","t2":["diagnóstico","extremo","telson","curvada","cola"],"catf":"invertebrados","subf":"arácnido"},{"id":"ARA-002","cat":"Invertebrados","sub":"Arácnido","name":"Araña de jardín","sci":"Araneus diadematus","fam":"Araneidae","freq":"alta","key":"Abdomen globoso con patrón de manchas blancas que forman una 'cruz' o 'diadema'","mnem":"La 'araña de la cruz': las manchas blancas en el abdomen forman una cruz clarísima — la araña del jardín otoñal","etym":"Araneus (lat.) = 'araña' · diadematus (lat.) = 'con diadema': por el patrón de manchas en el abdomen","notes":"La 'cruz' de manchas blancas en el abdomen es absolutamente diagnóstica. La telaraña orbicular es el tipo más complejo y bello de tela de araña.","hab":"Jardines, bordes de bosque, matorrales; abundante en otoño","q1":"Explica el mnemónico de Araña de jardín y qué rasgos te ayuda a recordar.","t1":["manchas","blancas","clarísima","araña","abdomen"],"q2":"Describe el carácter principal que identifica a Araña de jardín a primera vista.","t2":["abdomen","globoso","manchas","patrón","blancas"],"catf":"invertebrados","subf":"arácnido"},{"id":"ARA-003","cat":"Invertebrados","sub":"Arácnido","name":"Garrapata","sci":"Ixodes ricinus","fam":"Ixodidae","freq":"media","key":"Cuerpo aplastado sin segmentación visible; escudo dorsal quitinoso en el macho","mnem":"La 'semilla de ricino pegajosa': aplastada como una semilla, se clava en la piel y se hincha de sangre — cuando está llena parece una uva","etym":"Ixodes (gr.) = ixos (muérdago, pegajoso): 'pegajoso' · ricinus (lat.) = 'ricino': semilla que recuerda a la garrapata","notes":"Acarina son ácaros — no arañas ni escorpiones, aunque todos son arácnidos. Vector de Borrelia burgdorferi (enfermedad de Lyme) y TBE. Importante en medicina y veterinaria.","hab":"Vegetación alta; bordes de bosque, prados, zonas arbustivas","q1":"¿Cómo usarías el mnemónico de Garrapata para no olvidarlo en el examen?","t1":["aplastada","semilla","pegajosa","ricino","clava"],"q2":"¿Qué rasgo de Garrapata es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["segmentación","aplastado","cuerpo","quitinoso","visible"],"catf":"invertebrados","subf":"arácnido"},{"id":"ARA-004","cat":"Invertebrados","sub":"Arácnido","name":"Salpuga / Solifugo","sci":"Galeodes arabs","fam":"Galeodidae","freq":"baja","key":"Quelíceros enormes (casi tan grandes como el cefalotórax), con forma de cizalla","mnem":"El 'monstruo corredor de los quelíceros': parece tener dos cabezas — los quelíceros son tan grandes como el cuerpo. Sin veneno pero muerde","etym":"Galeodes (gr.) = 'parecido a una comadreja' · arabs = 'árabe, del desierto'","notes":"Solifugos son arácnidos raros en colecciones. Si aparece, los quelíceros enormes son absolutamente diagnósticos. Frecuente en el sureste árido ibérico.","hab":"Zonas áridas y semiáridas; sureste ibérico","q1":"¿Qué imagen mental evoca el mnemónico de Salpuga / Solifugo? Descríbelo con tus palabras.","t1":["quelíceros","monstruo","corredor","parece","cabezas"],"q2":"¿Cuál es el rasgo más diagnóstico de Salpuga / Solifugo? Incluye al menos un término clave.","t2":["quelíceros","enormes","cizalla","forma"],"catf":"invertebrados","subf":"arácnido"},{"id":"CNI-001","cat":"Invertebrados","sub":"Cnidario","name":"Anémona de mar","sci":"Actinia equina","fam":"Actiniidae","freq":"alta","key":"Cuerpo cilíndrico con corona de tentáculos en la parte superior (como una flor)","mnem":"La 'flor roja de roca que pica': roja brillante con tentáculos que se retraen al tocarla — la anémona intermareal más común del Atlántico","etym":"Actinia (gr.) = aktis (rayo): por los tentáculos como rayos · equina = 'de caballo' (por la textura robusta)","notes":"CONFIRMADO: Actiniidae en etiquetas de exámenes reales. Los tentáculos con cnidocitos + simetría radial son diagnósticos de Cnidaria. Diferenciar de equinodermos (también simetría radial): cnidarios = diploblásticos, sin mesodermo.","hab":"Zona intermareal rocosa atlántica y mediterránea; entre mareas","q1":"Explica el mnemónico de Anémona de mar y qué rasgos te ayuda a recordar.","t1":["tentáculos","brillante","intermareal","flor","roja"],"q2":"Describe el carácter principal que identifica a Anémona de mar a primera vista.","t2":["cilíndrico","tentáculos","cuerpo","superior","corona"],"catf":"invertebrados","subf":"cnidario"},{"id":"CNI-002","cat":"Invertebrados","sub":"Cnidario","name":"Medusa común","sci":"Aurelia aurita","fam":"Ulmaridae","freq":"alta","key":"Forma de platillo o sombrilla translúcida con 4 gónadas visibles en forma de herradura","mnem":"La 'medusa de las 4 lunas': translúcida con 4 círculos o medias lunas visibles por transparencia — las gónadas en forma de luna son su firma","etym":"Aurelia (lat.) = 'dorada' (de aurum = oro): por el brillo al sol · aurita = 'con orejas' (los tentáculos orales)","notes":"Las 4 gónadas en herradura son absolutamente diagnósticas. Scyphozoa = fase medusa dominante (a diferencia de Hydrozoa = pólipo dominante).","hab":"Mar abierto, bahías; pelágica; aparece en playas en verano","q1":"¿Cómo usarías el mnemónico de Medusa común para no olvidarlo en el examen?","t1":["translúcida","transparencia","círculos","medusa","visibles"],"q2":"¿Qué rasgo de Medusa común es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["translúcida","sombrilla","platillo","visibles","herradura"],"catf":"invertebrados","subf":"cnidario"},{"id":"CNI-003","cat":"Invertebrados","sub":"Cnidario","name":"Coral rojo","sci":"Corallium rubrum","fam":"Coralliidae","freq":"media","key":"Esqueleto axial calcáreo rojo brillante ramificado (el 'coral' de joyería)","mnem":"El 'árbol rojo del Mediterráneo': ramas rojas calcáreas con bolitas blancas (pólipos) — el coral de los collares italianos","etym":"Corallium (gr.) = 'coral' · rubrum (lat.) = 'rojo'","notes":"El esqueleto rojo es el producto de joyería. La colonia = muchos pólipos sobre esqueleto calcáreo. Especie protegida (CITES Apéndice III).","hab":"Fondos rocosos mediterráneos; 10-300 m; zonas oscuras","q1":"¿Qué imagen mental evoca el mnemónico de Coral rojo? Descríbelo con tus palabras.","t1":["mediterráneo","calcáreas","árbol","bolitas","italianos"],"q2":"¿Cuál es el rasgo más diagnóstico de Coral rojo? Incluye al menos un término clave.","t2":["esqueleto","ramificado","calcáreo","brillante","axial"],"catf":"invertebrados","subf":"cnidario"},{"id":"COL-001","cat":"Invertebrados","sub":"Insecto","name":"Escarabajo pelotero","sci":"Scarabaeus sacer","fam":"Scarabaeidae","freq":"alta","key":"Negro brillante; cabeza con dientes/quillas radiales en el borde frontal (6 dientes)","mnem":"El 'dios egipcio escarabajo': negro con los dientes en la cabeza y patas largas para empujar la bola de estiércol — el símbolo del sol para los egipcios","etym":"Scarabaeus (lat.) = 'escarabajo' · sacer (lat.) = 'sagrado': el escarabajo sagrado del Antiguo Egipto","notes":"CONFIRMADO: Scarabaeidae en etiquetas de exámenes reales. La cabeza dentada + patas anteriores planas son diagnósticos. Relacionar con el comportamiento de rodado de bolas (coprofagia).","hab":"Zonas áridas y semiáridas con ganado; caminos y pastizales","q1":"Explica el mnemónico de Escarabajo pelotero y qué rasgos te ayuda a recordar.","t1":["escarabajo","egipcio","dientes","dios","estiércol"],"q2":"Describe el carácter principal que identifica a Escarabajo pelotero a primera vista.","t2":["brillante","dientes","radiales","negro","cabeza"],"catf":"invertebrados","subf":"insecto"},{"id":"COL-002","cat":"Invertebrados","sub":"Insecto","name":"Escarabajo rinoceronte","sci":"Oryctes nasicornis","fam":"Dynastidae (Scarabaeidae)","freq":"alta","key":"Macho: cuerno frontal curvo prominente en la cabeza — absolutamente diagnóstico","mnem":"El 'rinoceronte insecto': el cuerno del macho es inconfundible — el único escarabajo europeo con un cuerno tan llamativo","etym":"Oryctes (gr.) = 'excavador' · nasicornis (lat.) = nasus (nariz) + cornis (cuerno): 'cuerno en la nariz'","notes":"CONFIRMADO: Dynastidae en etiquetas de exámenes reales. El cuerno del macho es absolutamente diagnóstico. Dimorfismo sexual muy marcado.","hab":"Bosques caducifolios; las larvas en madera podrida y compost","q1":"¿Cómo usarías el mnemónico de Escarabajo rinoceronte para no olvidarlo en el examen?","t1":["rinoceronte","inconfundible","escarabajo","insecto","cuerno"],"q2":"¿Qué rasgo de Escarabajo rinoceronte es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["absolutamente","prominente","diagnóstico","frontal","cuerno"],"catf":"invertebrados","subf":"insecto"},{"id":"COL-003","cat":"Invertebrados","sub":"Insecto","name":"Mariquita de 7 puntos","sci":"Coccinella septempunctata","fam":"Coccinellidae","freq":"media","key":"Élitros rojo brillante con exactamente 7 puntos negros (3+3 + 1 compartido)","mnem":"La 'mariquita clásica de cuento': roja con 7 puntos negros — contar los puntos es la forma más rápida de identificar la especie","etym":"Coccinella (lat.) = 'pequeño escarlata' (de coccum = grana roja) · septempunctata = 'de siete puntos'","notes":"La coloración aposemática (rojo+negro = 'soy tóxico') es didácticamente importante. Saber que las larvas también son depredadoras de pulgones.","hab":"Vegetación variada; jardines, campos, bordes de bosque","q1":"¿Qué imagen mental evoca el mnemónico de Mariquita de 7 puntos? Descríbelo con tus palabras.","t1":["mariquita","clásica","identificar","cuento","puntos"],"q2":"¿Cuál es el rasgo más diagnóstico de Mariquita de 7 puntos? Incluye al menos un término clave.","t2":["exactamente","brillante","élitros","puntos","rojo"],"catf":"invertebrados","subf":"insecto"},{"id":"COL-004","cat":"Invertebrados","sub":"Insecto","name":"Crisomélido / Chrysomela","sci":"Chrysomela populi","fam":"Chrysomelidae","freq":"alta","key":"Élitros rojo-naranja brillante; cabeza y pronoto azul-metálico iridiscente","mnem":"El 'escarabajo bicolor del chopo': rojo brillante arriba + azul metálico abajo — los colores del equipo de fútbol más iridiscente de los insectos","etym":"Chrysomela (gr.) = chrysos (oro) + melos (extremidad): 'patas doradas' · populi = 'del álamo (Populus)'","notes":"CONFIRMADO: Chrysomelidae en etiquetas de exámenes reales. El contraste rojo/azul metálico es absolutamente diagnóstico. Asociación con chopos — relevante en Madrid (choperas del Jarama).","hab":"Bosques de ribera con chopos y álamos; orillas de ríos","q1":"Explica el mnemónico de Crisomélido / Chrysomela y qué rasgos te ayuda a recordar.","t1":["escarabajo","brillante","bicolor","iridiscente","metálico"],"q2":"Describe el carácter principal que identifica a Crisomélido / Chrysomela a primera vista.","t2":["brillante","élitros","iridiscente","naranja","pronoto"],"catf":"invertebrados","subf":"insecto"},{"id":"COL-005","cat":"Invertebrados","sub":"Insecto","name":"Escarabajo de la patata","sci":"Leptinotarsa decemlineata","fam":"Chrysomelidae","freq":"media","key":"Élitros amarillos con 10 rayas negras longitudinales — absolutamente diagnóstico","mnem":"El 'rayas del Tour de Francia': amarillo con 10 rayas negras exactas — si ves eso en una planta de patata, es él","etym":"Leptinotarsa (gr.) = leptinos (delgado) + tarsus (tarso) · decemlineata = 'de diez rayas'","notes":"Chrysomelidae confirmada. Las 10 rayas negras son absolutamente diagnósticas. Especie invasora procedente de América del Norte — importante como ejemplo de plaga invasora.","hab":"Campos de cultivo de Solanaceae (patata, tomate, berenjena)","q1":"¿Cómo usarías el mnemónico de Escarabajo de la patata para no olvidarlo en el examen?","t1":["amarillo","francia","rayas","exactas","tour"],"q2":"¿Qué rasgo de Escarabajo de la patata es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["longitudinales","absolutamente","amarillos","diagnóstico","élitros"],"catf":"invertebrados","subf":"insecto"},{"id":"COL-006","cat":"Invertebrados","sub":"Insecto","name":"Ciervo volante","sci":"Lucanus cervus","fam":"Lucanidae","freq":"alta","key":"Macho: mandíbulas enormes ramificadas como cuernos de ciervo — absolutamente diagnóstico","mnem":"El 'ciervo volador': mandíbulas del macho como cuernos de ciervo — el insecto con las 'astas' más espectaculares de Europa","etym":"Lucanus (lat.) = 'de Lucania' (región italiana) · cervus (lat.) = 'ciervo': por las mandíbulas en cuerna","notes":"Las mandíbulas del macho son absolutamente diagnósticas. Dimorfismo sexual extremo. Especie protegida en muchos países (Directiva Hábitats).","hab":"Bosques de roble y otros caducifolios; las larvas en madera muerta","q1":"¿Qué imagen mental evoca el mnemónico de Ciervo volante? Descríbelo con tus palabras.","t1":["espectaculares","mandíbulas","volador","ciervo","cuernos"],"q2":"¿Cuál es el rasgo más diagnóstico de Ciervo volante? Incluye al menos un término clave.","t2":["absolutamente","mandíbulas","ramificadas","diagnóstico","enormes"],"catf":"invertebrados","subf":"insecto"},{"id":"COL-007","cat":"Invertebrados","sub":"Insecto","name":"Carábido / Escarabajo predador","sci":"Carabus violaceus","fam":"Carabidae","freq":"media","key":"Cuerpo alargado y aplanado con iridiscencia violácea en los márgenes de los élitros","mnem":"El 'escarabajo negro con borde morado': corredor nocturno con destellos violetas en el borde — el depredador nocturno de babosas","etym":"Carabus (gr.) = 'cangrejo de río o escarabajo' · violaceus = 'violáceo'","notes":"Carabidae = familia de escarabajos depredadores corredores. Los élitros soldados (no vuela) son diagnósticos del grupo.","hab":"Bordes de bosque, jardines, zonas húmedas; nocturno","q1":"Explica el mnemónico de Carábido / Escarabajo predador y qué rasgos te ayuda a recordar.","t1":["escarabajo","corredor","destellos","nocturno","depredador"],"q2":"Describe el carácter principal que identifica a Carábido / Escarabajo predador a primera vista.","t2":["iridiscencia","alargado","aplanado","cuerpo","violácea"],"catf":"invertebrados","subf":"insecto"},{"id":"COL-008","cat":"Invertebrados","sub":"Insecto","name":"Escarabajo de las flores / Cetonia","sci":"Cetonia aurata","fam":"Scarabaeidae (Cetoniinae)","freq":"media","key":"Élitros verde metálico brillante con iridiscencia dorada — absolutamente espectacular","mnem":"El 'escarabajo de joya verde': tan verde y brillante como una esmeralda — el insecto más metálico de los campos en flor","etym":"Cetonia (gr.) = nombre antiguo del escarabajo · aurata (lat.) = 'dorada'","notes":"El verde metálico iridiscente es absolutamente diagnóstico. Muy fácil de recoger sobre flores de cardo o rosa. También Scarabaeidae.","hab":"Prados en flor, jardines, bordes de bosque; zonas soleadas","q1":"¿Cómo usarías el mnemónico de Escarabajo de las flores / Cetonia para no olvidarlo en el examen?","t1":["escarabajo","brillante","esmeralda","metálico","verde"],"q2":"¿Qué rasgo de Escarabajo de las flores / Cetonia es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["iridiscencia","absolutamente","espectacular","brillante","élitros"],"catf":"invertebrados","subf":"insecto"},{"id":"CRU-001","cat":"Invertebrados","sub":"Crustáceo","name":"Cangrejo de río autóctono","sci":"Austropotamobius pallipes","fam":"Astacidae","freq":"muy_alta","key":"Quelas (pinzas) con cara interna blanquecina o pálida — diagnóstico de especie","mnem":"El 'cangrejo de manos blancas': las quelas blancas por dentro son la clave — el autóctono ibérico que solo vive en agua limpia y fría","etym":"Austropotamobius (lat.) = austro (sur) + potamos (río) + bios (vida) · pallipes = 'patas pálidas'","notes":"CONFIRMADO: Astacidae en etiquetas de exámenes reales. PAR OBLIGATORIO con el cangrejo americano (Cambaridae). La cara interna blanca de las quelas es el rasgo diferencial más importante. Especie en peligro crítico de extinción en España.","hab":"Ríos y arroyos de montaña con agua limpia, fría y bien oxigenada","q1":"¿Qué imagen mental evoca el mnemónico de Cangrejo de río autóctono? Descríbelo con tus palabras.","t1":["cangrejo","blancas","autóctono","manos","quelas"],"q2":"¿Cuál es el rasgo más diagnóstico de Cangrejo de río autóctono? Incluye al menos un término clave.","t2":["blanquecina","diagnóstico","quelas","interna","pálida"],"catf":"invertebrados","subf":"crustáceo"},{"id":"CRU-002","cat":"Invertebrados","sub":"Crustáceo","name":"Cangrejo rojo americano","sci":"Procambarus clarkii","fam":"Cambaridae","freq":"muy_alta","key":"Color rojo brillante con tubérculos rojos en quelas y caparazón","mnem":"El 'cangrejo rojo invasor': rojo brillante uniforme con tubérculos — si el cangrejo del río es completamente rojo, es el americano invasor","etym":"Procambarus (lat.) = pro (adelante) + Cambarus (género americano) · clarkii = del zoólogo F. Clark","notes":"CONFIRMADO: Cambaridae en etiquetas de exámenes reales. PAR OBLIGATORIO con A. pallipes (autóctono). El color rojo uniforme + tubérculos son diagnósticos. El par autóctono/invasor es uno de los temas más evaluados en Madrid.","hab":"Ríos, arroyos, arrozales, zonas húmedas; muy adaptable y tolerante","q1":"Explica el mnemónico de Cangrejo rojo americano y qué rasgos te ayuda a recordar.","t1":["completamente","cangrejo","brillante","tubérculos","invasor"],"q2":"Describe el carácter principal que identifica a Cangrejo rojo americano a primera vista.","t2":["tubérculos","brillante","caparazón","color","rojo"],"catf":"invertebrados","subf":"crustáceo"},{"id":"CRU-003","cat":"Invertebrados","sub":"Crustáceo","name":"Galera / Gallineta","sci":"Squilla mantis","fam":"Squillidae","freq":"alta","key":"Cuerpo alargado con telson en abanico con espinas muy llamativas","mnem":"La 'mantis del mar': patas raptoras como la mantis religiosa + telson con abanico de espinas — la galera del mercado","etym":"Squilla (lat.) = 'crustáceo marino' · mantis (gr.) = 'mantis': por las patas raptoras","notes":"Según testimonios de opositores madrileños, la galera (Squilla mantis) aparece muy frecuentemente como muestra de pez/crustáceo de mercado. El telson en abanico espinoso es diagnóstico.","hab":"Fondos arenosos y fangosos del Mediterráneo y Atlántico; 10-150 m","q1":"¿Cómo usarías el mnemónico de Galera / Gallineta para no olvidarlo en el examen?","t1":["raptoras","religiosa","mantis","patas","abanico"],"q2":"¿Qué rasgo de Galera / Gallineta es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["alargado","llamativas","cuerpo","abanico","telson"],"catf":"invertebrados","subf":"crustáceo"},{"id":"CRU-004","cat":"Invertebrados","sub":"Crustáceo","name":"Percebes","sci":"Pollicipes pollicipes","fam":"Pollicipedidae","freq":"media","key":"Pedúnculo carnoso musculoso cubierto de escamas córneas; placas calcáreas en el capitulo","mnem":"El 'marisco con cuello de cuero': el pedúnculo negro y rugoso + las placas grises en la punta — el percebe del norte","etym":"Pollicipes (lat.) = pollex (pulgar) + pes (pie): 'pie con pulgar' · pollicipes = referencia al pedúnculo","notes":"Cirripedia son crustáceos muy atípicos (sésiles, hermafroditas). El percebe invertido bota sus cirros al filtrar. Contrasta morfológicamente con todos los demás crustáceos.","hab":"Rocas expuestas al oleaje en zonas intermareales del Atlántico norte","q1":"¿Qué imagen mental evoca el mnemónico de Percebes? Descríbelo con tus palabras.","t1":["pedúnculo","marisco","cuello","cuero","rugoso"],"q2":"¿Cuál es el rasgo más diagnóstico de Percebes? Incluye al menos un término clave.","t2":["pedúnculo","musculoso","carnoso","cubierto","calcáreas"],"catf":"invertebrados","subf":"crustáceo"},{"id":"CRU-005","cat":"Invertebrados","sub":"Crustáceo","name":"Cochinilla de la humedad","sci":"Armadillidium vulgare","fam":"Armadillidiidae","freq":"media","key":"Crustáceo terrestre: el único grupo de crustáceos plenamente adaptado a la vida en tierra","mnem":"La 'bolita de la humedad': el único crustáceo terrestre que se hace bola perfecta — un crustáceo que vive en la tierra sin morir","etym":"Armadillidium (lat.) = diminutivo de 'armadillo' · vulgare = 'común'","notes":"Isopoda terrestres = única clase de crustáceos completamente terrestres (respiran por branquias adaptadas). La bola perfecta es diagnóstica de Armadillidium vs. Oniscus (no se enrolla).","hab":"Suelos húmedos, bajo piedras y troncos; jardines, bosques","q1":"Explica el mnemónico de Cochinilla de la humedad y qué rasgos te ayuda a recordar.","t1":["crustáceo","terrestre","humedad","bolita","perfecta"],"q2":"Describe el carácter principal que identifica a Cochinilla de la humedad a primera vista.","t2":["crustáceo","terrestre","crustáceos","plenamente","adaptado"],"catf":"invertebrados","subf":"crustáceo"},{"id":"EQU-001","cat":"Invertebrados","sub":"Equinodermo","name":"Erizo de mar","sci":"Paracentrotus lividus","fam":"Parechinidae","freq":"alta","key":"Caparazón esférico con 5 ambulacros y 5 interambulacros (simetría pentámera)","mnem":"El 'cactus del mar morado': esfera con pinchos morados o verdes que se alimenta por debajo y tiene el 'coral' naranja comestible","etym":"Paracentrotus (gr.) = para (junto a) + kentron (punta): 'con puntas' · lividus (lat.) = 'lívido, violáceo'","notes":"La simetría pentámera (5 ambulacros) es el carácter diagnóstico de Echinodermata. Los ambulacros con pies con ventosas son únicos del filo. Especie gastronómica.","hab":"Fondos rocosos intermareales e infralitorales; Mediterráneo y Atlántico","q1":"¿Cómo usarías el mnemónico de Erizo de mar para no olvidarlo en el examen?","t1":["cactus","morado","pinchos","esfera","morados"],"q2":"¿Qué rasgo de Erizo de mar es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["interambulacros","caparazón","ambulacros","esférico"],"catf":"invertebrados","subf":"equinodermo"},{"id":"EQU-002","cat":"Invertebrados","sub":"Equinodermo","name":"Estrella de mar","sci":"Asterias rubens","fam":"Asteriidae","freq":"alta","key":"5 brazos radiantes desde un disco central; cara oral hacia abajo","mnem":"La 'estrella de mar del Atlántico': naranja-rojiza, 5 brazos simétricos — el equinodermo más reconocible e icónico","etym":"Asterias (gr.) = aster (estrella): 'estrellada' · rubens (lat.) = 'rojiza'","notes":"Los 5 brazos + simetría pentámera son diagnósticos. La capacidad de regeneración y la digestión externa (extroversión del estómago) son temas evaluables.","hab":"Fondos rocosos intermareales y sublitorales; atlántico","q1":"¿Qué imagen mental evoca el mnemónico de Estrella de mar? Descríbelo con tus palabras.","t1":["atlántico","estrella","equinodermo","simétricos","reconocible"],"q2":"¿Cuál es el rasgo más diagnóstico de Estrella de mar? Incluye al menos un término clave.","t2":["radiantes","brazos","central","disco","cara"],"catf":"invertebrados","subf":"equinodermo"},{"id":"EQU-003","cat":"Invertebrados","sub":"Equinodermo","name":"Pepino de mar / Holoturia","sci":"Holothuria tubulosa","fam":"Holothuriidae","freq":"media","key":"Cuerpo cilíndrico blando, alargado como un pepino o salchicha","mnem":"La 'salchicha espinosa del mar': cilíndrica, blanda, con tubérculos oscuros — y si la coges fuerte, te lanza las tripas","etym":"Holothuria (gr.) = holos (completo) + thuris (olfato): 'completamente olorosa' · tubulosa = 'tubulosa'","notes":"La forma cilíndrica + evisceracion defensiva son absolutamente diagnósticos. Los holotúridos muestran que la simetría pentámera de Echinodermata puede ser secundaria a bilateral.","hab":"Fondos arenosos y rocosos litorales y sublitorales; mediterráneo","q1":"Explica el mnemónico de Pepino de mar / Holoturia y qué rasgos te ayuda a recordar.","t1":["salchicha","cilíndrica","tubérculos","espinosa","blanda"],"q2":"Describe el carácter principal que identifica a Pepino de mar / Holoturia a primera vista.","t2":["cilíndrico","alargado","salchicha","cuerpo","blando"],"catf":"invertebrados","subf":"equinodermo"},{"id":"EQU-004","cat":"Invertebrados","sub":"Equinodermo","name":"Crinoide / Lirio de mar","sci":"Antedon mediterranea","fam":"Antedonidae","freq":"media","key":"5 pares de brazos plumosos que irradian desde el centro (como una flor)","mnem":"La 'flor plumosa del mar': parece una flor submarina de pétalos plumosos — los crinoideosestan 'al revés' (la boca hacia arriba, al contrario que otros equinodermos)","etym":"Antedon (gr.) = 'flor anterior': por el aspecto de la parte oral · mediterranea = 'mediterránea'","notes":"La boca hacia arriba (al revés que la mayoría de equinodermos) es un carácter diagnóstico de clase. Los brazos plumosos filtran el plancton.","hab":"Fondos rocosos mediterráneos; 0-200 m","q1":"¿Cómo usarías el mnemónico de Crinoide / Lirio de mar para no olvidarlo en el examen?","t1":["crinoideosestan","submarina","plumosa","parece","plumosos"],"q2":"¿Qué rasgo de Crinoide / Lirio de mar es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["plumosos","irradian","brazos","pares","centro"],"catf":"invertebrados","subf":"equinodermo"},{"id":"HEM-001","cat":"Invertebrados","sub":"Insecto","name":"Chinche escudo verde","sci":"Palomena prasina","fam":"Pentatomidae","freq":"muy_alta","key":"Cuerpo en forma de escudo pentagonal (5 ángulos) — nombre de la familia","mnem":"La 'chinche del escudo verde que apesta': forma de escudo + verde brillante + olor horrible al cogerla","etym":"Palomena (gr.) = 'que vaga' · prasina (gr.) = 'verde puerro, verde intenso'","notes":"CONFIRMADO: Pentatomidae en etiquetas de exámenes reales de Madrid — además aparece recurrentemente en las etiquetas del blog. La forma pentagonal del cuerpo da nombre a la familia y es diagnóstica.","hab":"Vegetación variada; árboles, arbustos, plantas herbáceas","q1":"¿Qué imagen mental evoca el mnemónico de Chinche escudo verde? Descríbelo con tus palabras.","t1":["chinche","escudo","brillante","apesta","verde"],"q2":"¿Cuál es el rasgo más diagnóstico de Chinche escudo verde? Incluye al menos un término clave.","t2":["pentagonal","cuerpo","escudo","forma","familia"],"catf":"invertebrados","subf":"insecto"},{"id":"HEM-002","cat":"Invertebrados","sub":"Insecto","name":"Chinche del grano / Eurydema","sci":"Eurydema ornata","fam":"Pentatomidae","freq":"alta","key":"Patrón de colores muy llamativo: rojo/naranja y negro en mosaico","mnem":"La 'chinche del carnaval': roja con puntos negros como un disfraz de lunares — Pentatomidae con colores aposemáticos","etym":"Eurydema (gr.) = eury (ancho) + dema (cuerpo): 'cuerpo ancho' · ornata = 'adornada'","notes":"Pentatomidae confirmada. El patrón rojo-negro aposemático es diagnóstico. Plaga de Brassicaceae — relación agricultura-insecto evaluable.","hab":"Campos de cultivo de crucíferas (Brassicaceae); bordes de camino","q1":"Explica el mnemónico de Chinche del grano / Eurydema y qué rasgos te ayuda a recordar.","t1":["pentatomidae","carnaval","aposemáticos","chinche","puntos"],"q2":"Describe el carácter principal que identifica a Chinche del grano / Eurydema a primera vista.","t2":["llamativo","colores","patrón","naranja","mosaico"],"catf":"invertebrados","subf":"insecto"},{"id":"HEM-003","cat":"Invertebrados","sub":"Insecto","name":"Chinche del agua / Gerris","sci":"Gerris lacustris","fam":"Gerridae","freq":"media","key":"Camina sobre la superficie del agua (tensión superficial en las patas hidrofóbicas)","mnem":"El 'insecto patinador del agua': el único que camina sobre el agua sin hundirse — las patas largas sobre la película de agua son inconfundibles","etym":"Gerris (lat.) = 'escudo de mimbre' (forma del cuerpo) · lacustris = 'de los lagos'","notes":"El caminar sobre el agua es absolutamente diagnóstico y relaciona con tensión superficial (física). Muy usado didácticamente.","hab":"Superficie de ríos, arroyos, lagos y charcos tranquilos","q1":"¿Cómo usarías el mnemónico de Chinche del agua / Gerris para no olvidarlo en el examen?","t1":["patinador","inconfundibles","insecto","hundirse","camina"],"q2":"¿Qué rasgo de Chinche del agua / Gerris es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["superficie","camina","agua"],"catf":"invertebrados","subf":"insecto"},{"id":"HEM-004","cat":"Invertebrados","sub":"Insecto","name":"Cigarra / Chicharra","sci":"Cicada orni","fam":"Cicadidae","freq":"media","key":"Alas membranosas transparentes de gran tamaño; cuerpo pardo-verdoso grande","mnem":"La 'cantante del verano': el insecto que llena el verano mediterráneo de sonido — las alas transparentes y el voluminoso abdomen son su firma","etym":"Cicada (lat.) = 'cigarra' (onomatopéyico del canto) · orni = 'del fresno'","notes":"El canto como sistema de comunicación (tímbales) es un tema frecuente. Solo los machos cantan. Metamorfosis hemimetábola con larvas subterráneas (hasta 17 años en algunas especies).","hab":"Bosques mediterráneos; zonas soleadas con árboles","q1":"¿Qué imagen mental evoca el mnemónico de Cigarra / Chicharra? Descríbelo con tus palabras.","t1":["mediterráneo","transparentes","cantante","insecto","verano"],"q2":"¿Cuál es el rasgo más diagnóstico de Cigarra / Chicharra? Incluye al menos un término clave.","t2":["transparentes","membranosas","tamaño","alas","cuerpo"],"catf":"invertebrados","subf":"insecto"},{"id":"LEP-001","cat":"Invertebrados","sub":"Insecto","name":"Mariposa rey / Danaide monarca","sci":"Danaus plexippus","fam":"Nymphalidae (Danainae)","freq":"media","key":"Alas naranja-rojizo intenso con venas negras gruesas y borde negro con puntos blancos","mnem":"La 'mariposa naranja de las monarquías': naranja intenso con venas negras tan gruesas que parecen las divisiones de un vitral","etym":"Danaus (gr.) = de Danao (personaje mitológico) · plexippus (gr.) = jinete, conductor","notes":"Importante como especie invasora y como ejemplo de aposematismo + mimetismo mülleriano. Nymphalidae = cuatro patas funcionales (las anteriores reducidas).","hab":"Zonas con Asclepias; migradora (migración de miles de km)","q1":"Explica el mnemónico de Mariposa rey / Danaide monarca y qué rasgos te ayuda a recordar.","t1":["monarquías","mariposa","naranja","divisiones","intenso"],"q2":"Describe el carácter principal que identifica a Mariposa rey / Danaide monarca a primera vista.","t2":["naranja","intenso","rojizo","alas","gruesas"],"catf":"invertebrados","subf":"insecto"},{"id":"LEP-002","cat":"Invertebrados","sub":"Insecto","name":"Mariposa de la col","sci":"Pieris brassicae","fam":"Pieridae","freq":"alta","key":"Alas blancas con punta alar negra en las anteriores; ♀ con 2 puntos negros adicionales","mnem":"La 'mariposa blanca de la huerta': blanca con puntas negras — siempre revoloteando en los huertos de coles","etym":"Pieris (gr.) = 'musa, piéride' · brassicae (lat.) = 'de la col (Brassica)'","notes":"La mariposa más común y reconocible. Importante como plaga agrícola (larvas devoran crucíferas). Dimorfismo sexual: ♀ con 2 manchas negras en las alas anteriores.","hab":"Huertos, jardines, campos de crucíferas; ubicua","q1":"¿Cómo usarías el mnemónico de Mariposa de la col para no olvidarlo en el examen?","t1":["revoloteando","mariposa","blanca","huerta","puntas"],"q2":"¿Qué rasgo de Mariposa de la col es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["anteriores","adicionales","blancas","alas","punta"],"catf":"invertebrados","subf":"insecto"},{"id":"LEP-003","cat":"Invertebrados","sub":"Insecto","name":"Mariposa isabelina / Parnassius","sci":"Parnassius apollo","fam":"Papilionidae","freq":"alta","key":"Alas blancas semitranslúcidas con manchas rojas oceladas en las posteriores (ocelos = ojo)","mnem":"La 'mariposa luna de la sierra': blanca translúcida con manchas rojas como ojos — la más espectacular de la sierra","etym":"Parnassius = del monte Parnaso (Grecia) · apollo = dios Apolo","notes":"Especie protegida en España (especie en peligro en muchas regiones). Los ocelos rojos en las alas posteriores son absolutamente diagnósticos. Presente en Guadarrama.","hab":"Alta montaña (800-2500 m); prados alpinos con Sedum y Sempervivum (plantas huésped)","q1":"¿Qué imagen mental evoca el mnemónico de Mariposa isabelina / Parnassius? Descríbelo con tus palabras.","t1":["translúcida","mariposa","espectacular","sierra","blanca"],"q2":"¿Cuál es el rasgo más diagnóstico de Mariposa isabelina / Parnassius? Incluye al menos un término clave.","t2":["semitranslúcidas","posteriores","blancas","manchas","oceladas"],"catf":"invertebrados","subf":"insecto"},{"id":"LEP-004","cat":"Invertebrados","sub":"Insecto","name":"Esfinge de la calavera","sci":"Acherontia atropos","fam":"Sphingidae","freq":"media","key":"Tórax con patrón que imita una calavera humana — absolutamente inconfundible","mnem":"La 'mariposa calavera': el patrón del tórax es una calavera tan reconocible que no necesita descripción adicional","etym":"Acherontia (gr.) = Aqueronte (río del inframundo) · atropos (gr.) = Átropos (Parca que corta el hilo de la vida)","notes":"La imagen de la calavera en el tórax es absolutamente diagnóstica y muy impactante. Aparece en el famoso cartel de 'El silencio de los corderos'. Roba miel de colmenas.","hab":"Zonas mediterráneas con Solanaceae; migradora","q1":"Explica el mnemónico de Esfinge de la calavera y qué rasgos te ayuda a recordar.","t1":["reconocible","mariposa","calavera","descripción","patrón"],"q2":"Describe el carácter principal que identifica a Esfinge de la calavera a primera vista.","t2":["absolutamente","inconfundible","calavera","patrón","tórax"],"catf":"invertebrados","subf":"insecto"},{"id":"LEP-005","cat":"Invertebrados","sub":"Insecto","name":"Oso del rosal / Arctia","sci":"Arctia caja","fam":"Erebidae (Arctiinae)","freq":"alta","key":"Alas anteriores: marrón con manchas blancas irregulares (patrón tipo camuflaje)","mnem":"La 'polilla sorpresa': en reposo parece ramas secas (camuflaje), pero al abrir las alas muestra el rojo-naranja de alarma — ¡sorpresa!","etym":"Arctia (gr.) = arktos (oso): por las orugas peludas · caja = nombre antiguo latino","notes":"CONFIRMADO: Erebidae en etiquetas de exámenes reales. El contraste camuflaje/aposematismo es un ejemplo clásico de estrategia defensiva dual. Muy vistosa para examen.","hab":"Bordes de bosque, jardines, praderas; nocturna","q1":"¿Cómo usarías el mnemónico de Oso del rosal / Arctia para no olvidarlo en el examen?","t1":["sorpresa","polilla","reposo","parece","ramas"],"q2":"¿Qué rasgo de Oso del rosal / Arctia es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["anteriores","irregulares","manchas","marrón","blancas"],"catf":"invertebrados","subf":"insecto"},{"id":"MIR-001","cat":"Invertebrados","sub":"Miriápodo","name":"Escolopendra","sci":"Scolopendra cingulata","fam":"Scolopendridae","freq":"alta","key":"Cuerpo aplanado dorso-ventralmente con 21-23 pares de patas (1 par por segmento)","mnem":"El 'ciempiés con veneno en la cabeza': el primer par de patas son garfios venenosos — la 'mordedura' de la escolopendra","etym":"Scolopendra (gr.) = nombre griego del ciempiés · cingulata (lat.) = 'ceñida, con bandas'","notes":"CONFIRMADO: Scolopendridae en etiquetas de exámenes reales. Las forcípulas (1er par de patas modificadas en veneno) son el carácter diagnóstico de Chilopoda. Diferencia vs. Diplopoda: Chilopoda = 1 par de patas/segmento; Diplopoda = 2 pares/segmento.","hab":"Zonas mediterráneas secas; bajo piedras y corteza","q1":"¿Qué imagen mental evoca el mnemónico de Escolopendra? Descríbelo con tus palabras.","t1":["ciempiés","escolopendra","venenosos","veneno","mordedura"],"q2":"¿Cuál es el rasgo más diagnóstico de Escolopendra? Incluye al menos un término clave.","t2":["ventralmente","aplanado","cuerpo","dorso","pares"],"catf":"invertebrados","subf":"miriápodo"},{"id":"MIR-002","cat":"Invertebrados","sub":"Miriápodo","name":"Milpiés / Diplópodo","sci":"Iulus sp.","fam":"Julidae","freq":"media","key":"Cuerpo cilíndrico (no aplanado) con 2 pares de patas por segmento","mnem":"El 'milpiés bola': se enrolla en espiral como un muelle cuando se asusta — eso + el movimiento lento es lo opuesto a la escolopendra","etym":"Iulus (gr.) = 'catkin, amento': por la forma alargada","notes":"El par de patas por segmento (2 en milpiés vs. 1 en ciempiés) es la clave diferencial obligatoria. El enrollamiento defensivo es muy llamativo.","hab":"Suelos húmedos con hojarasca; bosques y jardines","q1":"Explica el mnemónico de Milpiés / Diplópodo y qué rasgos te ayuda a recordar.","t1":["milpiés","escolopendra","movimiento","enrolla","espiral"],"q2":"Describe el carácter principal que identifica a Milpiés / Diplópodo a primera vista.","t2":["cilíndrico","cuerpo","segmento","pares","patas"],"catf":"invertebrados","subf":"miriápodo"},{"id":"MIR-003","cat":"Invertebrados","sub":"Miriápodo","name":"Quilópodo litobiomorfo","sci":"Lithobius forficatus","fam":"Lithobiidae","freq":"media","key":"15 pares de patas; cuerpo plano y marrón-rojizo brillante","mnem":"El 'ciempiés naranja de debajo de las macetas': marrón-naranja brillante, pequeño y rápido — el ciempiés típico de los jardines","etym":"Lithobius (gr.) = lithos (piedra) + bios (vida): 'el que vive bajo las piedras' · forficatus = 'con tijeras'","notes":"El más común en las colecciones de IES. 15 pares de patas + color naranja-castaño + tamaño pequeño son diagnósticos.","hab":"Bajo piedras, corteza, macetas; jardines y bosques","q1":"¿Cómo usarías el mnemónico de Quilópodo litobiomorfo para no olvidarlo en el examen?","t1":["ciempiés","naranja","brillante","macetas","debajo"],"q2":"¿Qué rasgo de Quilópodo litobiomorfo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["brillante","pares","cuerpo","patas","marrón"],"catf":"invertebrados","subf":"miriápodo"},{"id":"MOL-001","cat":"Invertebrados","sub":"Molusco","name":"Caracol de jardín","sci":"Helix aspersa (Cornu aspersum)","fam":"Helicidae","freq":"alta","key":"Concha dextrógira (gira a la derecha) globosa con 4-5 vueltas","mnem":"El 'caracol de la paella': concha parda con bandas y boca blanca — el caracol de jardín más común y reconocible de España","etym":"Helix (gr.) = 'espiral' · aspersa (lat.) = 'moteada, salpicada'","notes":"La espiral dextrógira (hacia la derecha al mirar desde arriba) es un carácter genético. Gasterópodo hermafrodita. Muy fácil de recoger como muestra.","hab":"Jardines, bordes de camino, matorrales; zonas húmedas","q1":"¿Qué imagen mental evoca el mnemónico de Caracol de jardín? Descríbelo con tus palabras.","t1":["caracol","reconocible","paella","concha","bandas"],"q2":"¿Cuál es el rasgo más diagnóstico de Caracol de jardín? Incluye al menos un término clave.","t2":["dextrógira","concha","globosa","vueltas"],"catf":"invertebrados","subf":"molusco"},{"id":"MOL-002","cat":"Invertebrados","sub":"Molusco","name":"Mejillón","sci":"Mytilus galloprovincialis","fam":"Mytilidae","freq":"alta","key":"Concha azul-negruzca, alargada en forma de cuña; interior nacarado violáceo","mnem":"El 'bivalvo azul de las rocas': azul oscuro brillante con el nacarado violeta por dentro — el mejillón del mercado","etym":"Mytilus (gr.) = 'mejillón' · galloprovincialis = 'de la Galia provincial (sur de Francia)'","notes":"Las valvas simétricas (dos iguales) son diagnósticas de Bivalvia. Diferencia de braquiópodos (valvas asimétricas). El biso es una adaptación ecológica muy evaluable.","hab":"Zona intermareal rocosa; cultivo en bateas","q1":"Explica el mnemónico de Mejillón y qué rasgos te ayuda a recordar.","t1":["bivalvo","brillante","nacarado","rocas","oscuro"],"q2":"Describe el carácter principal que identifica a Mejillón a primera vista.","t2":["negruzca","alargada","concha","interior","nacarado"],"catf":"invertebrados","subf":"molusco"},{"id":"MOL-003","cat":"Invertebrados","sub":"Molusco","name":"Vieira / Concha de peregrino","sci":"Pecten maximus","fam":"Pectinidae","freq":"alta","key":"Concha semicircular con costillas radiales bien marcadas y orejas simétricas en el umbo","mnem":"La 'concha de Santiago': la concha más reconocible del Camino de Santiago — semicircular con costillas radiales perfectas. El único bivalvo que nada","etym":"Pecten (lat.) = 'peine': por las costillas radiales · maximus = 'el mayor'","notes":"CONFIRMADO: Pectinidae (Bivalvia) en etiquetas de exámenes reales. Las costillas radiales + orejas del umbo son diagnósticos. El símbolo del Camino de Santiago.","hab":"Fondos arenosos y de grava; sublitoral (5-200 m)","q1":"¿Cómo usarías el mnemónico de Vieira / Concha de peregrino para no olvidarlo en el examen?","t1":["reconocible","semicircular","santiago","concha","costillas"],"q2":"¿Qué rasgo de Vieira / Concha de peregrino es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["semicircular","costillas","simétricas","radiales","concha"],"catf":"invertebrados","subf":"molusco"},{"id":"MOL-004","cat":"Invertebrados","sub":"Molusco","name":"Pulpo común","sci":"Octopus vulgaris","fam":"Octopodidae","freq":"alta","key":"8 brazos con ventosas en doble fila; sin aletas ni concha externa","mnem":"El 'maestro del disfraz de 8 brazos': 8 brazos + cambia de color en un segundo + escupe tinta. El cerebro de los invertebrados","etym":"Octopus (gr.) = octo (ocho) + pous (pie): 'ocho pies' · vulgaris = 'común'","notes":"El cefalópodo más importante del visu. Los 8 brazos con ventosas son diagnósticos. Diferenciar de calamar (Loligo: 10 brazos + aletas + concha interna).","hab":"Fondos rocosos litorales; esconde en oquedades","q1":"¿Qué imagen mental evoca el mnemónico de Pulpo común? Descríbelo con tus palabras.","t1":["invertebrados","maestro","disfraz","brazos","cambia"],"q2":"¿Cuál es el rasgo más diagnóstico de Pulpo común? Incluye al menos un término clave.","t2":["ventosas","brazos","doble","aletas","externa"],"catf":"invertebrados","subf":"molusco"},{"id":"MOL-005","cat":"Invertebrados","sub":"Molusco","name":"Sepia / Jibia","sci":"Sepia officinalis","fam":"Sepiidae","freq":"alta","key":"10 brazos (8 cortos + 2 largos retráctiles con ventosas en pala)","mnem":"La 'jibia del hueso blanco oval': la concha blanca oval que venden en las pajarerías (para los pájaros) — solo la jibia la tiene así","etym":"Sepia (gr.) = nombre griego del animal · officinalis = 'medicinal, de botica'","notes":"La concha interna oval (jibión) es absolutamente diagnóstica. Diferencia de pulpo (sin concha) y calamar (gladius córneo). 10 brazos = diagnóstico de Decabrachia.","hab":"Fondos arenosos y de algas; litoral y sublitoral","q1":"Explica el mnemónico de Sepia / Jibia y qué rasgos te ayuda a recordar.","t1":["pajarerías","jibia","blanco","hueso","concha"],"q2":"Describe el carácter principal que identifica a Sepia / Jibia a primera vista.","t2":["brazos"],"catf":"invertebrados","subf":"molusco"},{"id":"MOL-006","cat":"Invertebrados","sub":"Molusco","name":"Babosa leopardo","sci":"Limax maximus","fam":"Limacidae","freq":"media","key":"Gasterópodo sin concha externa (concha reducida interna bajo el manto)","mnem":"La 'babosa jirafa gigante': enorme, con manchas oscuras como un leopardo y sin concha — la babosa del horror de los horticultores","etym":"Limax (lat.) = 'babosa' · maximus = 'la mayor'","notes":"Sin concha externa es el carácter diagnóstico de babosa. El patrón de manchas leopardo + tamaño enorme son diagnósticos de L. maximus. Plaga agrícola.","hab":"Bosques húmedos, jardines, sótanos; nocturna","q1":"¿Cómo usarías el mnemónico de Babosa leopardo para no olvidarlo en el examen?","t1":["horticultores","babosa","gigante","jirafa","manchas"],"q2":"¿Qué rasgo de Babosa leopardo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["gasterópodo","externa","concha"],"catf":"invertebrados","subf":"molusco"},{"id":"MOL-007","cat":"Invertebrados","sub":"Molusco","name":"Navaja","sci":"Ensis ensis","fam":"Pharidae","freq":"media","key":"Concha muy alargada y estrecha, curvada en forma de sable o navaja de afeitar","mnem":"La 'concha cuchillo': tan larga y estrecha que parece una navaja de afeitar — el único bivalvo con esa forma","etym":"Ensis (lat.) = 'espada, sable': por la forma de la concha","notes":"La forma de navaja (alargada y estrecha) es absolutamente diagnóstica. El pie musculoso para enterrarse verticalmente es una adaptación muy evaluable.","hab":"Fondos arenosos intermareales e infralitorales","q1":"¿Qué imagen mental evoca el mnemónico de Navaja? Descríbelo con tus palabras.","t1":["cuchillo","estrecha","concha","larga","parece"],"q2":"¿Cuál es el rasgo más diagnóstico de Navaja? Incluye al menos un término clave.","t2":["alargada","estrecha","concha","curvada","afeitar"],"catf":"invertebrados","subf":"molusco"},{"id":"OTR-001","cat":"Invertebrados","sub":"Insecto","name":"Avispa común","sci":"Vespula germanica","fam":"Vespidae","freq":"muy_alta","key":"Abdomen amarillo con bandas negras; 3 puntos negros en el clípeo (escudo facial) — diagnóstico","mnem":"La 'avispa de los 3 puntos': busca los 3 puntos negros en la cara amarilla — si ves 3 puntos negros en el clípeo, es Vespula germanica","etym":"Vespula (lat.) = 'avispita' (diminutivo de Vespa) · germanica = 'germánica'","notes":"CONFIRMADO: Vespidae en etiquetas de exámenes reales. Los 3 puntos negros en el clípeo son diagnósticos de la especie. Saber diferenciar de Apis mellifera (abeja) por el abdomen más estilizado y sin pelillo.","hab":"Ubicua; nidos en suelo, huecos de árboles, tejados","q1":"Explica el mnemónico de Avispa común y qué rasgos te ayuda a recordar.","t1":["avispa","puntos","amarilla","busca","negros"],"q2":"Describe el carácter principal que identifica a Avispa común a primera vista.","t2":["amarillo","diagnóstico","abdomen","bandas","negras"],"catf":"invertebrados","subf":"insecto"},{"id":"OTR-002","cat":"Invertebrados","sub":"Insecto","name":"Abeja melífera","sci":"Apis mellifera","fam":"Apidae","freq":"alta","key":"Cuerpo piloso dorado-pardo con bandas abdominales oscuras; talle menos marcado que la avispa","mnem":"La 'peluda con cestillo': más gorda y peluda que la avispa + si tiene una bolita amarilla en las patas traseras, lleva el cestillo de polen","etym":"Apis (lat.) = 'abeja' · mellifera (lat.) = 'portadora de miel'","notes":"Importantísima ecológica y económicamente. Diferenciar de avispa: abeja = peluda, cestillo de polen, abdomen más corto; avispa = lisa, brillante, talle muy marcado.","hab":"Ubicua; colmenas en huecos de árboles y colmenas artificiales","q1":"¿Cómo usarías el mnemónico de Abeja melífera para no olvidarlo en el examen?","t1":["cestillo","peluda","amarilla","gorda","avispa"],"q2":"¿Qué rasgo de Abeja melífera es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["abdominales","cuerpo","piloso","dorado","bandas"],"catf":"invertebrados","subf":"insecto"},{"id":"OTR-003","cat":"Invertebrados","sub":"Insecto","name":"Libélula / Cordulegáster","sci":"Cordulegaster boltonii","fam":"Cordulegastridae","freq":"alta","key":"Cuerpo negro con anillos amarillos; uno de los odónatos más grandes de Europa (7-8 cm)","mnem":"La 'libélula cebra de montaña': negro con anillos amarillos, enorme, patrullando riachuelos de montaña — la libélula bicolor más grande","etym":"Cordulegaster (lat.) = cordule (cuerda, hilo) + gaster (vientre): 'vientre en cuerda' · boltonii = del naturalista J. Bolton","notes":"CONFIRMADO: Cordulegastridae en etiquetas de exámenes reales. Los anillos amarillos + tamaño grande + hábitat de riachuelo de montaña son diagnósticos. Presente en Guadarrama.","hab":"Riachuelos de montaña, ríos oligotróficos limpios; 400-1800 m","q1":"¿Qué imagen mental evoca el mnemónico de Libélula / Cordulegáster? Descríbelo con tus palabras.","t1":["libélula","patrullando","amarillos","montaña","riachuelos"],"q2":"¿Cuál es el rasgo más diagnóstico de Libélula / Cordulegáster? Incluye al menos un término clave.","t2":["amarillos","cuerpo","anillos","odónatos","negro"],"catf":"invertebrados","subf":"insecto"},{"id":"OTR-004","cat":"Invertebrados","sub":"Insecto","name":"Mantis religiosa","sci":"Mantis religiosa","fam":"Mantidae","freq":"alta","key":"Patas anteriores raptoras (prensiles): con espinas para capturar presas","mnem":"El 'insecto que reza': patas levantadas en posición de oración + cabeza giratoria de 180° — el único insecto que 'mira por encima del hombro'","etym":"Mantis (gr.) = 'adivino, profeta': por su postura de 'rezo' · religiosa = 'religiosa'","notes":"Las patas raptoras + postura orante son absolutamente diagnósticas. Dimorfismo sexual: la hembra a veces devora al macho durante la cópula (canibalismo sexual).","hab":"Matorral, praderas, zonas soleadas con vegetación; mediterráneo","q1":"Explica el mnemónico de Mantis religiosa y qué rasgos te ayuda a recordar.","t1":["levantadas","insecto","posición","giratoria","oración"],"q2":"Describe el carácter principal que identifica a Ma ","subf":"ave"},{"id":"AVE-024","cat":"Vertebrados","sub":"Ave","name":"Urraca","sci":"Pica pica","fam":"Corvidae","freq":"muy_alta","key":"Blanca y negra con larga cola iridiscente verde-azulada","mnem":"El 'esmoquin con cola de frac'","etym":"Pica (lat.) = 'urraca' (onomatopéyico del canto) · pica = misma raíz repetida","notes":"Una de las pocas aves que superan el test del espejo (reconocimiento propio). Muy inteligente. Cola iridiscente verde-azulada. Muy frecuente en Madrid ciudad","hab":"Zonas agrícolas, jardines, parques urbanos, bordes de bosque","bio":"Todos los pisos (0-2000 m); zonas abiertas con árboles dispersos","q1":"Explica el mnemónico de Urraca y qué rasgos te ayuda a recordar.","t1":["esmoquin","cola","frac"],"q2":"Describe el carácter principal que identifica a Urraca a primera vista.","t2":["iridiscente","blanca","negra","larga","azulada"],"catf":"vertebrados","subf":"ave"},{"id":"AVE-025","cat":"Vertebrados","sub":"Ave","name":"Cigüeñuela común","sci":"Himantopus himantopus","fam":"Recurvirostridae","freq":"alta","key":"Patas rosado-coral extremadamente largas — las más largas en proporción de Europa","mnem":"La 'modelo' de las aves — patas rosas kilométricas","etym":"Himantopus (gr.) = 'pata de correa' (himanto = correa + pous = pie): por las patas largas y rojas","notes":"Las patas más largas en proporción al cuerpo de todas las aves europeas. Muy vocal y agresivo en la nidificación. Lagunas y arrozales de Madrid","hab":"Lagunas someras, arrozales, charcas, balsas de agua; zonas abiertas con agua","bio":"Piso mesomediterráneo (0-800 m); lagunas y zonas húmedas someras","q1":"¿Cómo usarías el mnemónico de Cigüeñuela común para no olvidarlo en el examen?","t1":["kilométricas","modelo","patas","aves","rosas"],"q2":"¿Qué rasgo de Cigüeñuela común es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["extremadamente","proporción","rosado","patas","coral"],"catf":"vertebrados","subf":"ave"},{"id":"AVE-026","cat":"Vertebrados","sub
