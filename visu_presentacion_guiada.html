diagnóstico de Augita (piroxeno)? Incluye al menos un término clave.","t2":["clivajes","negro","oscuro","verde"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-018","cat":"Geología","sub":"Mineral","name":"Granada (almandino)","sci":"Granada (Fe₃Al₂(SiO₄)₃)","fam":"Nesosílicato","freq":"alta","key":"Cristales dodecaédricos perfectos (12 caras romboidales) muy característicos","mnem":"La 'semilla de granada' perfecta: cristales rojos en 12 caras, como si la naturaleza los hubiera tallado","etym":"Del latín 'granatum' (semilla de granada): por el parecido de sus cristales con las semillas del fruto","notes":"En examen suele aparecer en esquistos y gneis del Sistema Central. La forma dodecaédrica es inconfundible. Relevante para Madrid por la presencia de metamórficas en Guadarrama. PRUEBAS: (1) Buscar la forma dodecaédrica o icositetraédrica característica. (2) Color rojo, marrón o anaranjado (almandino). (3) Dureza 6.5-7.5. (4) Sin clivaje (fractura subconcoidea). CONFUSIÓN CON: Rubí (corindón rojo) — hexagonal; mayor dureza (9). Espinela roja — octaédrica. Granate espesartina — naranja-amarillo, misma forma. Almandino/piropo (otros granates) — diferencia solo en química.","q1":"Explica el mnemónico de Granada (almandino) y qué rasgos te ayuda a recordar.","t1":["cristales","semilla","perfecta","naturaleza","granada"],"q2":"Describe el carácter principal que identifica a Granada (almandino) a primera vista.","t2":["característicos","dodecaédricos","cristales","perfectos"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-019","cat":"Geología","sub":"Mineral","name":"Talco","sci":"Talco (Mg₃Si₄O₁₀(OH)₂)","fam":"Filosilicato","freq":"media","key":"Dureza 1: el mineral más blando conocido (se raya con la uña SIN ESFUERZO)","mnem":"El mineral 'jabonoso': si lo tocas y parece que tienes jabón en los dedos, es talco","etym":"Del árabe 'talq': mineral brillante","notes":"La escala de Mohs comienza con él (dureza 1). La sensación grasa al tacto + dureza 1 son diagnósticos absolutos. PRUEBAS: (1) Rayar con la uña: dureza 1, la uña deja surco fácilmente. (2) Sensación grasa/jabonosa al tacto (diagnóstico). (3) Color blanco-verdoso o plateado. (4) Hojas no elásticas (a diferencia de moscovita). CONFUSIÓN CON: Moscovita — elástica y mucho más dura (dur.2-2.5). Yeso (selenita) — también muy blando pero sin sensación grasa; láminas elásticas. Caolinita — también blanca y blanda pero aspecto terroso, sin brillo nacarado.","q1":"¿Cómo usarías el mnemónico de Talco para no olvidarlo en el examen?","t1":["jabonoso","mineral","parece","tocas","tienes"],"q2":"¿Qué rasgo de Talco es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["mineral","conocido","dureza","blando"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-020","cat":"Geología","sub":"Mineral","name":"Fluorita","sci":"Fluorita (CaF₂)","fam":"Haluro","freq":"alta","key":"Colores muy variados: violeta, verde, azul, amarillo, incoloro (policromática)","mnem":"El mineral 'arcoíris con octaedros': si es colorida, se parte en octaedros y tiene dureza 4, fluorita","etym":"Del latín 'fluere' (fluir): fundente en metalurgia","notes":"Los clivajes octaédricos y la variedad de colores la hacen reconocible. Muy común en colecciones de IES (fácil de obtener y llamativa). PRUEBAS: (1) Dureza 4: no lo raya la uña (dur.2.5) ni una moneda de cobre (dur.3) pero sí una navaja (dur.5.5). (2) Clivaje octaédrico perfecto (fragmentos forman octaedros). (3) Colores muy variados. CONFUSIÓN CON: Calcita — clivaje romboédrico (no octaédrico); reacciona al HCl. Halita — cúbica, sabor salado, dur.2.5. Apatito — verde o azulado, hexagonal, dur.5. Baritina — blanca, muy pesada, sin clivaje octaédrico.","q1":"¿Qué imagen mental evoca el mnemónico de Fluorita? Descríbelo con tus palabras.","t1":["octaedros","arcoíris","mineral","colorida","fluorita"],"q2":"¿Cuál es el rasgo más diagnóstico de Fluorita? Incluye al menos un término clave.","t2":["variados","colores","violeta","amarillo","incoloro"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-021","cat":"Geología","sub":"Mineral","name":"Apatito","sci":"Apatito (Ca₅(PO₄)₃(F,Cl,OH))","fam":"Fosfato","freq":"baja","key":"Dureza 5 (referencia en escala de Mohs: no lo raya la navaja pero sí el vidrio)","mnem":"El 'engañabobos' geológico: el mineral de los huesos y dientes. Dureza 5 = navaja no lo raya, vidrio sí","etym":"Del griego 'apatao' (engañar): se confundía con otras gemas","notes":"Puede aparecer. Su importancia como referencia de la escala de Mohs (posición 5) puede ser evaluada teóricamente. PRUEBAS: (1) Dureza exactamente 5: no lo raya el vidrio corriente (dur.5.5) pero sí un cristal de cuarzo (dur.7). La navaja (dur.5.5) lo raya con dificultad. (2) Cristales hexagonales o en masas granulares. (3) Verde, azul o incoloro. CONFUSIÓN CON: Fluorita — dur.4 (la moneda lo raya). Berilo (esmeralda/aguamarina) — hexagonal pero dur.7.5-8. Epidota — contexto metamórfico; amarillo-verdoso. Topacio — dur.8; exfoliación basal.","q1":"Explica el mnemónico de Apatito y qué rasgos te ayuda a recordar.","t1":["engañabobos","geológico","mineral","dientes","huesos"],"q2":"Describe el carácter principal que identifica a Apatito a primera vista.","t2":["dureza"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-022","cat":"Geología","sub":"Mineral","name":"Azufre nativo","sci":"Azufre (S)","fam":"Elemento nativo","freq":"media","key":"Amarillo brillante a amarillo-verdoso muy llamativo","mnem":"El 'mineral del infierno': amarillo brillante, ligero y huele a cerillas. No hay otro así","etym":"Del sánscrito 'sulvere' → latín 'sulfur'. Conocido desde la antigüedad","notes":"Color amarillo azufre inconfundible. Aparece en zonas volcánicas y evaporíticas. PRUEBAS: (1) Color amarillo azufre inconfundible (brillante, no el amarillo verdoso de la pirita). (2) Dur.1.5-2.5: la uña casi lo raya. (3) Ardería con llama azul dando SO₂ (olor a cerillas). (4) Muy ligero. CONFUSIÓN CON: Pirita — metálica, pesada, dura (dur.6). Ópalo de color amarillo — vítreo, sin forma cristalina. Limonita (goethita) — marrón-amarillento, raya amarilla-marrón, no cristalina.","q1":"¿Cómo usarías el mnemónico de Azufre nativo para no olvidarlo en el examen?","t1":["infierno","brillante","mineral","amarillo","cerillas"],"q2":"¿Qué rasgo de Azufre nativo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["brillante","amarillo","llamativo","verdoso"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-023","cat":"Geología","sub":"Mineral","name":"Malaquita","sci":"Malaquita (Cu₂(CO₃)(OH)₂)","fam":"Carbonato","freq":"media","key":"Verde intenso con bandas concéntricas circulares ('ojo' verde) inconfundible","mnem":"El mineral 'camuflaje verde en círculos': bandas verdes concéntricas como anillos de árbol","etym":"Del griego 'malache' (malva): por el color verde de las hojas de malva","notes":"El patrón de bandas verdes es absolutamente diagnóstico. Siempre asociada al cobre. PRUEBAS: (1) Verde intenso con bandas concéntricas o patrón botroidal: absolutamente diagnóstico. (2) Reacciona al HCl (carbonato de cobre). (3) Raya verde clara. (4) Pesada (dens.3.9-4.0). CONFUSIÓN CON: Crisocola — turquesa más azulada, no reacciona al HCl, aspecto más resinoso. Azurita — azul intenso (mismo contexto, cobre oxidado). Epidota — verde amarillento, en contexto metamórfico, no reacciona al HCl.","q1":"¿Qué imagen mental evoca el mnemónico de Malaquita? Descríbelo con tus palabras.","t1":["concéntricas","camuflaje","mineral","círculos","verde"],"q2":"¿Cuál es el rasgo más diagnóstico de Malaquita? Incluye al menos un término clave.","t2":["concéntricas","inconfundible","circulares","intenso","verde"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-024","cat":"Geología","sub":"Mineral","name":"Turmalina","sci":"Turmalina (borosilicato complejo)","fam":"Ciclosílicato","freq":"baja","key":"Cristales prismáticos alargados con sección triangular redondeada y estrías longitudinales","mnem":"El 'lápiz negro con estrías': cristales alargados, oscuros y con costillas longitudinales","etym":"Del cingalés 'turmali' (piedra mezclada de colores)","notes":"Puede aparecer en pegmatitas graníticas. La sección triangular estriada es diagnóstica. PRUEBAS: (1) Sección triangular redondeada en cristales prismáticos. (2) Estrías longitudinales a lo largo del prisma. (3) Color muy variable: negro (schorl), verde, azul, rosa. CONFUSIÓN CON: Hornblenda — también prismática y negra pero sección romboidal y clivaje a 120°. Augita — clivaje a 90°, sección cuadrangular. Estaurolita — cruciforme, marrón-rojiza.","q1":"Explica el mnemónico de Turmalina y qué rasgos te ayuda a recordar.","t1":["longitudinales","cristales","alargados","estrías","costillas"],"q2":"Describe el carácter principal que identifica a Turmalina a primera vista.","t2":["prismáticos","longitudinales","cristales","alargados","triangular"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-025","cat":"Geología","sub":"Mineral","name":"Baritina","sci":"Baritina (BaSO₄)","fam":"Sulfato","freq":"baja","key":"Muy pesada (densidad 4.3-4.6 g/cm³) — sorprendentemente densa para ser blanca","mnem":"El 'plomo blanco': si un mineral blanco pesa como si fuera metálico, es baritina","etym":"Del griego 'barys' (pesado): densidad anormalmente alta para un mineral blanco","notes":"La densidad anómala es el truco. En examen se detecta al cogerla: pesa mucho más de lo esperado. PRUEBAS: (1) Coger el ejemplar: sensación de peso excesivo para ser blanco/incoloro (dens.4.3-4.6). (2) Cristales tabulares aplanados o masivos. (3) Brillo vítreo a resinoso. (4) Sin reacción al HCl. CONFUSIÓN CON: Calcita — reacciona vivamente al HCl; mucho más ligera. Yeso — dur.2 (uña lo raya); la baritina es más dura (dur.3-3.5). Celestina — similar pero azulada y ligeramente menos densa. Anglesita — también pesada pero en contexto de oxidación de galena.","q1":"¿Cómo usarías el mnemónico de Baritina para no olvidarlo en el examen?","t1":["mineral","blanco","plomo","metálico","baritina"],"q2":"¿Qué rasgo de Baritina es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["sorprendentemente","pesada","blanca","densa"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-026","cat":"Geología","sub":"Mineral","name":"Esfalerita (blenda)","sci":"Esfalerita (ZnS)","fam":"Sulfuro","freq":"baja","key":"Color pardo-amarillento a negro; brillo resinoso o adamantino llamativo","mnem":"La 'galena mentirosa': brilla como metálica pero su raya es blanca o amarilla, nunca negra","etym":"Del griego 'sphaleros' (engañoso): confundida frecuentemente con galena","notes":"La raya clara en mineral de aspecto metálico es la clave. Puede aparecer junto a galena. PRUEBAS: (1) Brillo resinoso o adamantino muy llamativo. (2) Raya blanca o amarillo pálido (a pesar del color oscuro del mineral). (3) Olor a H₂S al golpear. (4) Dur.3.5-4. CONFUSIÓN CON: Galena — metálica, cúbica, mucho más pesada, raya gris. Wolframita — más pesada, negra metálica. Cassiterita — adamantina pero cristales bipiramidales; raya blanca también.","q1":"¿Qué imagen mental evoca el mnemónico de Esfalerita (blenda)? Descríbelo con tus palabras.","t1":["mentirosa","metálica","galena","brilla","amarilla"],"q2":"¿Cuál es el rasgo más diagnóstico de Esfalerita (blenda)? Incluye al menos un término clave.","t2":["amarillento","adamantino","resinoso","llamativo","color"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-027","cat":"Geología","sub":"Mineral","name":"Caolinita","sci":"Caolinita (Al₂Si₂O₅(OH)₄)","fam":"Filosilicato (arcilla)","freq":"baja","key":"Blanco terroso mate, aspecto de harina o tiza","mnem":"La 'arcilla blanca de la porcelana': blanca, terrosa y huele a tierra cuando la mojas","etym":"De 'Kaoling' (alta colina), China, donde se extraía para porcelana","notes":"Puede aparecer en muestras de suelo o en contexto de meteorización. El olor al mojarse es diagnóstico. PRUEBAS: (1) Aspecto blanco terroso, mate. (2) Olor a tierra mojada al humedecerse. (3) Adherencia a la lengua (absorbe humedad). (4) Plasticidad al mojarse. CONFUSIÓN CON: Talco — sensación grasa, láminas brillantes nacaradas. Yeso terroso — también blanco pero dur.2 y láminas brillantes. Calcita terrosa (creta) — reacciona al HCl.","q1":"Explica el mnemónico de Caolinita y qué rasgos te ayuda a recordar.","t1":["porcelana","arcilla","blanca","terrosa","tierra"],"q2":"Describe el carácter principal que identifica a Caolinita a primera vista.","t2":["terroso","blanco","aspecto","harina","mate"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-028","cat":"Geología","sub":"Mineral","name":"Aragonito","sci":"Aragonito (CaCO₃)","fam":"Carbonato","freq":"baja","key":"Mismo compuesto que la calcita pero cristales prismáticos alargados (no romboédricos)","mnem":"La 'calcita aragonesa': misma fórmula pero cristales prismáticos en vez de romboédricos","etym":"De 'Aragón' (España): descrito por primera vez en Molina de Aragón","notes":"La diferencia con la calcita está en la forma cristalina: prismas (aragonito) vs. romboedros (calcita). PRUEBAS: (1) Reacciona al HCl como la calcita. (2) Cristales PRISMÁTICOS alargados (no romboedros como calcita). (3) Mayor densidad que calcita (dens.2.93 vs. 2.71). (4) Más frecuente en conchas de moluscos y corales modernos. CONFUSIÓN CON: Calcita — misma composición química (CaCO₃) pero cristalografía diferente: calcita = trigonal, romboedros; aragonito = ortorrómbico, prismas. Solo distinguibles por RX o por densidad.","q1":"¿Cómo usarías el mnemónico de Aragonito para no olvidarlo en el examen?","t1":["romboédricos","prismáticos","aragonesa","cristales","calcita"],"q2":"¿Qué rasgo de Aragonito es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["prismáticos","compuesto","cristales","alargados","calcita"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-029","cat":"Geología","sub":"Mineral","name":"Crisotilo (asbesto blanco)","sci":"Crisotilo (Mg₃Si₂O₅(OH)₄)","fam":"Filosilicato (serpentina fibrosa)","freq":"baja","key":"Fibras sedosas blancas o verdosas muy largas y flexibles (aspecto de seda mineral)","mnem":"El 'asbesto sedoso': fibras minerales blancas que parecen lana o seda — el amianto más común","etym":"Del griego 'chrysos' (oro) + 'tilos' (fibra): fibra dorada","notes":"Si aparece, es por su importancia histórica (amianto) y toxicológica. Solo observación en examen. PRUEBAS: (1) Fibras largas y sedosas muy flexibles (aspecto de seda mineral). (2) Color blanco a verde pálido. (3) Insoluble en HCl. NOTA: NO MANIPULAR — fibras cancerígenas. CONFUSIÓN CON: Tremolita fibrosa (amianto blanco) — prácticamente indistinguible sin RX. Talco fibroso — menos sedoso, más graso. Yeso fibroso (fibra de yeso) — mucho más blando (dur.2, uña lo raya).","q1":"¿Qué imagen mental evoca el mnemónico de Crisotilo (asbesto blanco)? Descríbelo con tus palabras.","t1":["minerales","asbesto","sedoso","fibras","blancas"],"q2":"¿Cuál es el rasgo más diagnóstico de Crisotilo (asbesto blanco)? Incluye al menos un término clave.","t2":["sedosas","verdosas","flexibles","fibras","blancas"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-030","cat":"Geología","sub":"Mineral","name":"Albita","sci":"Albita (NaAlSi₃O₈)","fam":"Tectosílicato","freq":"baja","key":"Blanco muy puro a gris muy pálido (el más blanco de los feldespatos)","mnem":"La 'plagioclasa blanca nieve': el feldespato más blanco, siempre con finas estrías paralelas","etym":"Del latín 'albus' (blanco): por su color blanco característico","notes":"Puede aparecer en pegmatitas. Diferenciar de ortosa por estriación y color más blanco puro. PRUEBAS: (1) Blanco muy puro o gris muy pálido (el más blanco de los feldespatos). (2) Estriación polisintética visible con lupa. (3) Clivaje en 2 dir. a ~90°. (4) Dureza 6. CONFUSIÓN CON: Ortosa — más rosada/salmón; sin estriación polisintética. Calcita blanca — reacciona al HCl; clivaje romboédrico. Cuarzo blanco — sin clivaje; fractura concoidea.","q1":"Explica el mnemónico de Albita y qué rasgos te ayuda a recordar.","t1":["plagioclasa","feldespato","blanca","paralelas","siempre"],"q2":"Describe el carácter principal que identifica a Albita a primera vista.","t2":["blanco","pálido","puro","gris"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-031","cat":"Geología","sub":"Mineral","name":"Oro nativo","sci":"Au (Oro nativo)","fam":"Elemento nativo","freq":"alta","key":"Color amarillo dorado inalterable (nunca se oxida ni pierde el brillo) — diagnóstico absoluto","mnem":"La 'prueba de la uña y el peso': si es amarillo brillante, se raya con la uña y pesa muchísimo para su tamaño, es oro. La pirita se raya con el acero y tiene caras estriadas","etym":"Au = del latín 'aurum' (oro); Gold del germánico antiguo 'ghelto' (amarillo brillante)","notes":"El diagnóstico diferencial oro/pirita ('oro de tontos') es evaluable. Oro: maleable, pesadísimo, raya amarilla, no estría. Pirita: dura (6), estrías en caras, raya negra, frágil. PRUEBAS: (1) Aplicar navaja: el ORO se dobla o marca (maleable), la pirita se parte/astilla. (2) Densidad excepcional (19.3 g/cm³): más pesado que cualquier otro mineral común. (3) Color amarillo que NO se opaca nunca. CONFUSIÓN CON: Pirita ('oro de tontos') — dura (dur.6), raya negra, se astilla, no maleable. Calcopirita — también amarilla pero iridiscente y más blanda. Chalcopirita en polvo — raya amarilla verdosa. Mica moscovita dorada — muy flexible y ligera.","q1":"¿Cómo usarías el mnemónico de Oro nativo para no olvidarlo en el examen?","t1":["brillante","amarillo","prueba","muchísimo","peso"],"q2":"¿Qué rasgo de Oro nativo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["inalterable","diagnóstico","amarillo","absoluto","color"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-032","cat":"Geología","sub":"Mineral","name":"Cobre nativo","sci":"Cu (Cobre nativo)","fam":"Elemento nativo","freq":"media","key":"Color rojo-cobre brillante característico cuando fresco; se oxida a verde (malaquita) o azul (azurita)","mnem":"El 'mineral de los alambres': el único metal rojo que se puede doblar con la mano — la misma materia de los cables eléctricos, pero en roca","etym":"Cu = del latín 'cuprum' (de Chipre, Kypros, famosa por sus minas de cobre en la antigüedad)","notes":"El color rojo-cobre + la maleabilidad + la presencia en zonas de oxidación de sulfuros son diagnósticos. La asociación malaquita (verde)/azurita (azul)/cobre nativo (rojo) en el mismo afloramiento es evaluable. PRUEBAS: (1) Color rojo-cobre metálico cuando fresco. (2) Muy maleable. (3) Oxidación progresiva: rojo → marrón → verde (malaquita). (4) Densidad alta (8.9 g/cm³). CONFUSIÓN CON: Cobre nativo oxidado vs. malaquita — son el mismo elemento en distinto estado. Cuprita — rojo oscuro pero aspecto más terroso. Hematites especular — también metálico rojizo pero mucho más duro y frágil.","q1":"¿Qué imagen mental evoca el mnemónico de Cobre nativo? Descríbelo con tus palabras.","t1":["alambres","mineral","eléctricos","único","metal"],"q2":"¿Cuál es el rasgo más diagnóstico de Cobre nativo? Incluye al menos un término clave.","t2":["característico","brillante","color","cobre","rojo"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-033","cat":"Geología","sub":"Mineral","name":"Grafito","sci":"C (Grafito — alótropo de carbono)","fam":"Elemento nativo","freq":"alta","key":"Color gris-negro metálico con brillo submetálico o graso; muy suave al tacto (jabonoso)","mnem":"El 'carbono que se usa en los lápices': negro, jabonoso al tacto y tan blando que mancha los dedos. El diamante y el grafito son el mismo elemento con diferente estructura","etym":"Del griego 'graphein' (escribir): el material del lápiz (los 'lápices de plomo' son de grafito)","notes":"El contraste grafito/diamante (mismo elemento C, propiedades opuestas) es un tema clásico de enlace químico y estructura cristalina. El grafito es conductor eléctrico (electrones deslocalizados en la lámina); el diamante es aislante. PRUEBAS: (1) Raya gris sucia en el papel o los dedos: mancha. (2) Sensación grasa/jabonosa. (3) Dur.1-2 (muy blando). (4) Brillo submetálico grisáceo. NO confundir con hulla (carbón) por contexto. CONFUSIÓN CON: Molibdenita — casi idéntico visualmente; solo distinguible por análisis. Hulla (carbón) — también negra y suave pero sin brillo metálico submetálico. Magnetita en polvo — negra pero magnética y sin sensación grasa.","q1":"Explica el mnemónico de Grafito y qué rasgos te ayuda a recordar.","t1":["carbono","lápices","jabonoso","negro","diamante"],"q2":"Describe el carácter principal que identifica a Grafito a primera vista.","t2":["submetálico","metálico","color","negro","brillo"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-034","cat":"Geología","sub":"Mineral","name":"Corindón (rubí / zafiro)","sci":"Al₂O₃ (Corindón)","fam":"Óxido","freq":"alta","key":"Dureza 9 — el segundo mineral más duro tras el diamante (rayado solo por diamante)","mnem":"El 'guardaespaldas del diamante': dureza 9 — solo el diamante (10) puede rayarlo. Si raya todo pero no al diamante, es corindón. El rubí es el corindón rojo; el zafiro es el azul","etym":"Corundum = del tamil 'kurundam' (rubí) · Rubí = del latín 'rubeus' (rojo) · Zafiro = del griego 'sappheiros' (azul)","notes":"La dureza 9 en la escala de Mohs es el carácter diagnóstico más evaluable. La relación entre el color y el elemento traza (Cr=rojo, Fe/Ti=azul) es un tema de química del estado sólido evaluable. PRUEBAS: (1) Intentar rayar con cuarzo (dur.7): el corindón NO se raya. Solo el diamante lo raya. (2) Cristales barriles o tabletas hexagonales. (3) Rubí = rojo; zafiro = azul; corindón = gris-marrón. CONFUSIÓN CON: Espinela roja — dur.8 (se raya con corindón). Granate rojo — dur.6.5-7.5 (se raya con cuarzo). Rubí sintético — indistinguible sin análisis. Topacio — dur.8; exfoliación basal perfecta.","q1":"¿Cómo usarías el mnemónico de Corindón (rubí / zafiro) para no olvidarlo en el examen?","t1":["guardaespaldas","diamante","dureza","rayarlo","corindón"],"q2":"¿Qué rasgo de Corindón (rubí / zafiro) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["segundo","dureza","mineral","diamante","duro"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-035","cat":"Geología","sub":"Mineral","name":"Rutilo","sci":"TiO₂ (Rutilo)","fam":"Óxido","freq":"media","key":"Cristales prismáticos alargados de color rojo-pardo a negro con brillo adamantino","mnem":"El 'cristal aguja rojo en el cuarzo': los cristales alargados rojo-pardos que aparecen como agujas dentro del cuarzo o en maclas de rejilla son inconfundibles","etym":"Del latín 'rutilus' (rojo brillante, destellante): por su color rojizo-cobrizo","notes":"Las maclas en rejilla (sagenita) son diagnósticas y visualmente muy llamativas. El rutilo en cuarzo ('rutilated quartz') es frecuente en colecciones mineralógicas. PRUEBAS: (1) Cristales prismáticos con bipiramidal tetragonal. (2) Brillo adamantino muy intenso. (3) Color rojo-pardo característico. (4) Sagenita: maclas en rejilla de agujas de rutilo dentro de cuarzo. CONFUSIÓN CON: Casiterita — también adamantina y oscura pero cristales diferentes; en pegmatitas. Uraninita — también negra y pesada pero en contexto diferente. Anatasa y brookita — polimorfos del TiO₂, similares pero más raros.","q1":"¿Qué imagen mental evoca el mnemónico de Rutilo? Descríbelo con tus palabras.","t1":["inconfundibles","cristal","cristales","alargados","aguja"],"q2":"¿Cuál es el rasgo más diagnóstico de Rutilo? Incluye al menos un término clave.","t2":["prismáticos","cristales","alargados","adamantino","color"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-036","cat":"Geología","sub":"Mineral","name":"Casiterita","sci":"SnO₂ (Casiterita)","fam":"Óxido","freq":"media","key":"Color pardo-negro brillante con brillo adamantino intenso — como cristales de chocolate brillante","mnem":"El 'cristal de chocolate que pesa como plomo': brillo adamantino pardo-negro y peso altísimo. Cuando un cristal oscuro pesa el doble de lo esperado, piensa en casiterita","etym":"Del griego 'kassiteros' (estaño): la mena del bronce","notes":"La casiterita de Extremadura y Galicia fue explotada desde el Calcolítico para fabricar bronce (Cu+Sn). El peso elevado + brillo adamantino son diagnósticos. PRUEBAS: (1) Brillo adamantino muy intenso. (2) Color pardo-negro brillante. (3) Pesada (dens.6.8-7.1). (4) Cristales bipiramidales o prismáticos. CONFUSIÓN CON: Wolframita — similar pero más opaca y en contexto de filones de cuarzo; no adamantina. Rutilo — también adamantino pero rojo-pardo y tetragonal bipiramidal. Esfalerita — brillo resinoso, más blanda.","q1":"Explica el mnemónico de Casiterita y qué rasgos te ayuda a recordar.","t1":["chocolate","adamantino","cristal","brillo","casiterita"],"q2":"Describe el carácter principal que identifica a Casiterita a primera vista.","t2":["brillante","adamantino","cristales","color","chocolate"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-037","cat":"Geología","sub":"Mineral","name":"Calcopirita","sci":"CuFeS₂ (Calcopirita)","fam":"Sulfuro","freq":"alta","key":"Color amarillo dorado con tinte verdoso — más amarillo que la pirita, más verdoso que el oro","mnem":"La 'pirita verde-iridiscente': más verdosa y blanda que la pirita, con arcoíris de colores en la superficie oxidada — si brilla como pirita pero tiene visos verdes y azulados al girarla, es calcopirita","etym":"Del griego 'chalkos' (cobre) + 'pyrites' (fuego): 'piedra de cobre que saca fuego'","notes":"El trio calcopirita/pirita/oro es un par de estudio clásico. La iridiscencia + verdosidad + dureza menor que pirita son diagnósticos. La Faja Pirítica Ibérica (Huelva) = yacimiento más grande de calcopirita de Europa. PRUEBAS: (1) Color amarillo-dorado con tinte VERDE iridiscente — más amarillo que la pirita y más verdoso que el oro. (2) Dur.3.5-4: la navaja la raya fácilmente. (3) Iridiscencia superficial por oxidación. CONFUSIÓN CON: Pirita — más dura (dur.6), no iridiscente, cubos bien formados. Oro nativo — maleable, muy pesado, sin iridiscencia. Calcopirita/marcasita — la marcasita tiene forma tabular diferente.","q1":"¿Cómo usarías el mnemónico de Calcopirita para no olvidarlo en el examen?","t1":["iridiscente","pirita","superficie","verdosa","arcoíris"],"q2":"¿Qué rasgo de Calcopirita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["amarillo","color","dorado","verdoso","tinte"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-038","cat":"Geología","sub":"Mineral","name":"Arsenopirita","sci":"FeAsS (Arsenopirita)","fam":"Sulfosales (arsenosulfuro)","freq":"alta","key":"Color gris-plateado metálico brillante con manchas pardas de oxidación","mnem":"La 'piedra que huele a ajo al golpearla': el único mineral que al golpear con el martillo despide olor a ajo inconfundible. Si huele a ajo, es arsenopirita","etym":"Del griego 'arsenikon' (arsénico, del árabe 'azzernikh') + 'pyrites' (fuego)","notes":"El olor a ajo al golpear es absolutamente diagnóstico y evaluable. La arsenopirita es el indicador más común de filones auríferos (el oro suele asociarse a ella). PRUEBAS: (1) Golpear: olor a ajo intenso e inmediato = arsenopirita (diagnóstico absolutamente definitivo). (2) Color gris-plateado metálico. (3) Cristales rómbicos característicos. (4) Dureza 5.5-6. CONFUSIÓN CON: Pirita arsenical — misma familia pero sin cristales rómbicos tan marcados. Löllingita — similar pero sin olor a ajo tan intenso. Marcasita — forma tabular; sin olor característico.","q1":"¿Qué imagen mental evoca el mnemónico de Arsenopirita? Descríbelo con tus palabras.","t1":["inconfundible","golpearla","arsenopirita","piedra","mineral"],"q2":"¿Cuál es el rasgo más diagnóstico de Arsenopirita? Incluye al menos un término clave.","t2":["plateado","brillante","metálico","oxidación","color"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-039","cat":"Geología","sub":"Mineral","name":"Estibina (antimonita)","sci":"Sb₂S₃ (Estibina)","fam":"Sulfuro","freq":"media","key":"Cristales alargados y estriados longitudinalmente de color gris-plomo brillante","mnem":"El 'lápiz de plomo metálico': cristales largos y estriados de color plomo brillante que parecen barras de grafito de lápiz pero metálicas. Esos cristales en haz son únicos","etym":"Stibnite del griego 'stimmi' (antimonio, usado como cosmético ocular en la antigüedad) · Estibina = nombre español","notes":"Los cristales alargados estriados son absolutamente diagnósticos. La estibina tiene un punto de fusión bajo (271°C) — es el mineral metálico con menor punto de fusión común. Mena del antimonio. PRUEBAS: (1) Cristales alargados estriados longitudinalmente muy llamativos. (2) Color gris-plomo brillante. (3) Muy blanda (dur.2): la uña la raya. (4) Punto de fusión bajísimo (630°C: se funde fácilmente). CONFUSIÓN CON: Galena — cúbica, muy pesada; sin cristales alargados. Molibdenita — laminar, mancha los dedos. Arsenopirita — más dura, cristales rómbicos, olor a ajo.","q1":"Explica el mnemónico de Estibina (antimonita) y qué rasgos te ayuda a recordar.","t1":["cristales","metálico","estriados","lápiz","brillante"],"q2":"Describe el carácter principal que identifica a Estibina (antimonita) a primera vista.","t2":["longitudinalmente","cristales","alargados","estriados","brillante"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-040","cat":"Geología","sub":"Mineral","name":"Anhidrita","sci":"CaSO₄ (Anhidrita)","fam":"Sulfato","freq":"alta","key":"Blanca a gris-azulada, sin brillo vidrioso fuerte (a diferencia del yeso que es más perláceo)","mnem":"El 'yeso sin agua y más duro': blanco o gris, más duro que el yeso (no lo raya la uña) y con caras perfectamente rectangulares — el yeso deshidratado","etym":"Del griego 'an' (sin) + 'hydor' (agua): 'sulfato de calcio sin agua' — a diferencia del yeso que tiene 2 moléculas de agua","notes":"La diferencia yeso/anhidrita (con/sin H₂O) es evaluable. Dureza: yeso=2 (raya la uña), anhidrita=3-3.5 (no la raya fácilmente). La expansión anhidrita→yeso puede levantar edificios. PRUEBAS: (1) Comprobar dureza: dur.3-3.5 (ni la uña ni la moneda de cobre la rayen, la navaja sí). (2) NO reacciona al HCl. (3) Color blanco-grisáceo a azulado. (4) Clivaje en 3 dir. pero NO romboédrico como la calcita. CONFUSIÓN CON: Yeso — mucho más blando (dur.2, uña lo raya); perláceo. Calcita — reacciona vivamente al HCl; clivaje romboédrico. Baritina — muy pesada para su color blanco.","q1":"¿Cómo usarías el mnemónico de Anhidrita para no olvidarlo en el examen?","t1":["perfectamente","rectangulares","deshidratado","blanco","yeso"],"q2":"¿Qué rasgo de Anhidrita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["blanca","azulada","vidrioso","brillo","gris"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-041","cat":"Geología","sub":"Mineral","name":"Celestina","sci":"SrSO₄ (Celestina)","fam":"Sulfato","freq":"media","key":"Color azul cielo muy suave a incoloro — el azul más delicado entre los minerales comunes","mnem":"El 'mineral del cielo azul pálido': el azul más suave y delicado que se puede imaginar en un mineral. Y si tienes duda, ponlo en una llama: el estroncio la vuelve roja carmesí","etym":"Del latín 'caelestis' (celestial, del cielo): por su color azul cielo característico","notes":"El color azul cielo suave + la llama carmesí por el estroncio son diagnósticos. La misma reacción de llama (Sr → carmesí) explica el color rojo de los fuegos artificiales. PRUEBAS: (1) Color azul cielo muy suave. (2) Cristales tabulares o masivos. (3) Pesada para ser azulada (dens.3.95-3.97). (4) Llama de gas: tiñe de CARMESÍ/ROJO (estroncio). CONFUSIÓN CON: Baritina — también pesada y blanca-azulada pero llama amarilla (bario). Azurita — azul más intenso; contexto de oxidación de cobre. Angelesita — más pesada, incolora-gris. Fluorita azul — cúbica, dur.4.","q1":"¿Qué imagen mental evoca el mnemónico de Celestina? Descríbelo con tus palabras.","t1":["mineral","delicado","cielo","pálido","imaginar"],"q2":"¿Cuál es el rasgo más diagnóstico de Celestina? Incluye al menos un término clave.","t2":["incoloro","minerales","color","delicado","cielo"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-042","cat":"Geología","sub":"Mineral","name":"Siderita","sci":"FeCO₃ (Siderita)","fam":"Carbonato","freq":"media","key":"Color pardo-amarillento a gris-verdoso; brillo vítreo a perláceo","mnem":"La 'calcita parda que no burbujea en frío': misma forma que la calcita pero marrón-amarillenta y notablemente más pesada. El ácido frío no produce burbujas (solo en polvo)","etym":"Del griego 'sideros' (hierro): el carbonato de hierro","notes":"La diferencia siderita/calcita por la reacción de ácido (calcita burbujea en frío; siderita solo en polvo o caliente) es evaluable. La mayor densidad también es diagnóstica. PRUEBAS: (1) Color pardo-amarillento o gris-verdoso. (2) NO reacciona al HCl en frío (a diferencia de calcita). (3) Romboedros curvados. (4) Pesada para ser marrón (dens.3.9). CONFUSIÓN CON: Calcita — reacciona vivamente al HCl en frío. Dolomita — también no reacciona al HCl frío pero cristales en silla de montar. Rodocrosita — rosa fucsia muy llamativo.","q1":"Explica el mnemónico de Siderita y qué rasgos te ayuda a recordar.","t1":["notablemente","amarillenta","calcita","burbujea","parda"],"q2":"Describe el carácter principal que identifica a Siderita a primera vista.","t2":["amarillento","color","verdoso","pardo","perláceo"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-043","cat":"Geología","sub":"Mineral","name":"Smithsonita","sci":"ZnCO₃ (Smithsonita)","fam":"Carbonato","freq":"media","key":"Color muy variable: verde-menta, azul, amarillo, rosa, blanco o incoloro","mnem":"El 'carbonato de racimos de uvas': la superficie botroidal con pequeñas bolas redondeadas + los colores pastel (verde-menta o azul) hacen que parezca hecha de caramelos","etym":"En honor al mineralogista y fundador del Smithsonian Institution, James Smithson (1765-1829)","notes":"La superficie botroidal + los colores pastel vivos son diagnósticos visuales. Mena secundaria de zinc. Se asocia a galena oxidada en zonas de cementos. PRUEBAS: (1) Superficie botroidal o nodular. (2) Colores pastel vivos pero variables (verde, azul, rosa, amarillo). (3) Reacciona al HCl (carbonato de zinc). (4) A menudo con eflorescencias. CONFUSIÓN CON: Calcita coloreada — reacciona al HCl igualmente; distinguir por color inusual. Aragonito botroidal — también botroidal pero incoloro o blanco. Hemimorfita — similar contexto pero silicato de zinc.","q1":"¿Cómo usarías el mnemónico de Smithsonita para no olvidarlo en el examen?","t1":["carbonato","superficie","redondeadas","botroidal","racimos"],"q2":"¿Qué rasgo de Smithsonita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["variable","amarillo","color","verde","incoloro"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-044","cat":"Geología","sub":"Mineral","name":"Circón","sci":"ZrSiO₄ (Circón)","fam":"Nesosílicato","freq":"media","key":"Cristales tetragonales bipiramidales cortos; brillo adamantino muy intenso","mnem":"El 'cristal cuadrado más brillante de los sedimentos': los pequeños cristales tetragonales con brillo diamantino que aparecen en las arenas como minúsculos rubíes o diamantes","etym":"Del árabe 'zarqun' (bermellón) o del persa 'zargun' (dorado): por el color de las variedades amarillo-naranjas","notes":"El circón es fundamental en geocronología (datación U-Pb): los circones son las relojes geológicas más precisas. Los más antiguos (Australia, Jack Hills) tienen 4.4 Ga. PRUEBAS: (1) Cristales bipiramidales tetragonales cortos. (2) Brillo adamantino muy intenso. (3) Muy duro (dur.7.5). (4) Resistente: casi indestructible — persiste en arenas de playas. CONFUSIÓN CON: Diamante — también adamantino pero isométrico (octaédrico) y mucho más duro. Rutilo — también tetragonal y adamantino pero rojizo-pardo. Cassiterita — similar pero contexto de pegmatitas.","q1":"¿Qué imagen mental evoca el mnemónico de Circón? Descríbelo con tus palabras.","t1":["tetragonales","sedimentos","brillante","cuadrado","cristal"],"q2":"¿Cuál es el rasgo más diagnóstico de Circón? Incluye al menos un término clave.","t2":["bipiramidales","tetragonales","cristales","adamantino","cortos"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-045","cat":"Geología","sub":"Mineral","name":"Topacio","sci":"Al₂SiO₄(F,OH)₂","fam":"Nesosílicato","freq":"media","key":"Dureza 8 — el tercero más duro en la escala de Mohs (después de corindón y diamante)","mnem":"El 'cuarzo que se parte en la base': cristales estriados como el cuarzo, pero con una cara de exfoliación perfecta en la base que el cuarzo no tiene — y mucho más duro","etym":"Del griego 'Topazios' (nombre de una isla del Mar Rojo, actual Zabargad/St. John's)","notes":"La dureza 8 + la exfoliación basal perfecta son diagnósticos. Gema preciosa. La escala de Mohs: 1(talco) 2(yeso) 3(calcita) 4(fluorita) 5(apatito) 6(feldespato) 7(cuarzo) 8(topacio) 9(corindón) 10(diamante). PRUEBAS: (1) Exfoliación basal perfecta: se parten en láminas al golpear. (2) Dureza 8: cuarzo no lo raya, corindon sí. (3) Cristales prismáticos con sección ortorrómbica. (4) Incoloro, amarillo o azul. CONFUSIÓN CON: Cuarzo — dur.7, sin exfoliación basal. Corindón — dur.9, hexagonal, sin exfoliación basal tan perfecta. Berilo — hexagonal; dur.7.5-8; sin exfoliación basal.","q1":"Explica el mnemónico de Topacio y qué rasgos te ayuda a recordar.","t1":["cristales","exfoliación","estriados","cuarzo","parte"],"q2":"Describe el carácter principal que identifica a Topacio a primera vista.","t2":["tercero","dureza","escala","duro","mohs"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-046","cat":"Geología","sub":"Mineral","name":"Andalucita","sci":"Al₂SiO₅ (Andalucita)","fam":"Nesosílicato","freq":"alta","key":"Cristales prismáticos con sección cuadrada; color rosado, pardo o verdoso","mnem":"La 'piedra de la cruz española': la variedad quiastolita tiene una cruz negra perfecta en sección — la cruz es carbono atrapado durante el crecimiento del cristal","etym":"De Andalucía (España), donde fue descrita por primera vez en el siglo XVIII","notes":"Los tres polimorfos de Al₂SiO₅ (andalucita = baja P, distena/cianita = alta P, silimanita = alta T) son indicadores de condiciones metamórficas y son evaluables. La quiastolita es muy llamativa. PRUEBAS: (1) Cristales prismáticos con sección CUADRADA. (2) Color rosado, pardo o grisáceo. (3) La variedad quiastolita tiene inclusión cruciforme negra de grafito en sección. (4) En metamorfitas de bajo grado. CONFUSIÓN CON: Distena (cianita) — laminar, azul, alargada. Silimanita — fibrolita, fibrosa, alta temperatura. Estaurolita — cruciforme, marrón-rojiza. Son los 4 polimorfos de aluminosilicatos: cada uno marca condiciones P-T distintas.","q1":"¿Cómo usarías el mnemónico de Andalucita para no olvidarlo en el examen?","t1":["quiastolita","española","variedad","piedra","crecimiento"],"q2":"¿Qué rasgo de Andalucita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["prismáticos","cristales","cuadrada","sección","rosado"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-047","cat":"Geología","sub":"Mineral","name":"Tremolita-Actinolita","sci":"Ca₂(Mg,Fe)₅Si₈O₂₂(OH)₂","fam":"Inosílicato (anfíbol)","freq":"media","key":"Cristales aciculares o prismáticos alargados; color blanco (tremolita) a verde oscuro (actinolita)","mnem":"El 'anfíbol del mármol verde': largos cristales verdes o blancos con el ángulo de 120° diagnóstico de anfíbol. Si las fibras son sedosas y largas, es la variedad amianto","etym":"Tremolita = del valle de Tremola (Alpes suizos) · Actinolita del griego 'aktis' (rayo): por el aspecto radiado de los cristales","notes":"La serie tremolita-actinolita en sus variedades fibrosas = amianto verde (crocidolita) o blanco — tema de salud pública y mineralogía evaluable. El ángulo de clivaje 120° es diagnóstico de anfíbol vs. piroxeno (90°). PRUEBAS: (1) Cristales aciculares o prismáticos muy alargados. (2) Blanco (tremolita) → verde oscuro (actinolita) según la proporción de Fe. (3) Clivaje a 120° (como todos los anfíboles). CONFUSIÓN CON: Wollastonita — también acicular y blanca pero en skarn; sin clivaje anfibólico. Epidota — amarillo-verdosa, contexto metamórfico diferente. Diópsido (piroxeno) — clivaje a 90°.","q1":"¿Qué imagen mental evoca el mnemónico de Tremolita-Actinolita? Descríbelo con tus palabras.","t1":["anfíbol","cristales","diagnóstico","mármol","largos"],"q2":"¿Cuál es el rasgo más diagnóstico de Tremolita-Actinolita? Incluye al menos un término clave.","t2":["prismáticos","aciculares","cristales","alargados","blanco"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-048","cat":"Geología","sub":"Mineral","name":"Clorita","sci":"(Mg,Fe,Al)₆(Si,Al)₄O₁₀(OH)₈","fam":"Filosilicato","freq":"alta","key":"Color verde intenso a verde oscuro — el más verde de los filosilicatos","mnem":"La 'mica verde que no es elástica': láminas verdes parecidas a la biotita pero que no vuelven a su forma al doblarlas — si la lámina verde no rebota, es clorita","etym":"Del griego 'chloros' (verde, cloro): por su color verde característico","notes":"La clorita es el mineral índice de la zona de menor grado metamórfico (facies esquistos verdes). La diferencia clorita/biotita (verde vs. negra; no elástica vs. elástica) es muy evaluable. PRUEBAS: (1) Verde intenso a verde oscuro — el mineral filosilicato más verde. (2) Láminas menos elásticas que micas (se doblan pero no vuelven solas). (3) Brillo perláceo. (4) Asociada a metamorfismo de muy bajo grado. CONFUSIÓN CON: Biotita — también verde-oscura a negra pero elástica. Epidota — más amarillo-verdosa, no laminar. Serpentina — también verde pero sin exfoliación laminar; aceitosa.","q1":"Explica el mnemónico de Clorita y qué rasgos te ayuda a recordar.","t1":["elástica","parecidas","láminas","verde","doblarlas"],"q2":"Describe el carácter principal que identifica a Clorita a primera vista.","t2":["filosilicatos","intenso","color","verde","oscuro"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-049","cat":"Geología","sub":"Mineral","name":"Nefelina","sci":"NaAlSiO₄ (Nefelina)","fam":"Tectosílicato","freq":"media","key":"Aspecto graso o resinoso gris-blancuzco; sin caras brillantes visibles (macizo)","mnem":"El 'feldespato sin silicio que no puede estar con el cuarzo': si la roca ígnea tiene aspecto graso y no tiene cuarzo, puede ser nefelina — los feldespatoides huyen del cuarzo","etym":"Del griego 'nephele' (nube): porque al atacarlo con ácido produce gel de sílice que nubla el ácido","notes":"La regla nefelina/cuarzo (incompatibles en la misma roca) es fundamental en petrología ígnea. Rocas con nefelina = sienitanefelínica, fonolita, nefelinita. PRUEBAS: (1) Aspecto graso o resinoso: sin caras brillantes (macizo). (2) Gris-blancuzco. (3) La regla: en la misma roca NO pueden coexistir cuarzo y nefelina. Si ves nefelina = sin cuarzo. (4) Dureza 5.5-6. CONFUSIÓN CON: Ortosa/plagioclasa — tienen clivaje nítido; la nefelina parece más 'grasa' y sin caras brillantes. Leucita — también sin sílice pero con forma dodecaédrica o trapezoédrica.","q1":"¿Cómo usarías el mnemónico de Nefelina para no olvidarlo en el examen?","t1":["feldespato","feldespatoides","silicio","cuarzo","puede"],"q2":"¿Qué rasgo de Nefelina es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["aspecto","resinoso","blancuzco","brillantes","graso"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-050","cat":"Geología","sub":"Mineral","name":"Zeolita (estilbita / heulandita)","sci":"Grupo Zeolita (CaAl₂Si₇O₁₈·7H₂O)","fam":"Tectosílicato","freq":"media","key":"Cristales tabulares o estelares blancos a incoloros con brillo perláceo o vítreo","mnem":"La 'piedra que hierve y tiene poros': cristales blancos perláceos que llenan las burbujas del basalto y que al calentarlos liberan vapor de agua visible","etym":"Del griego 'zeo' (hervir) + 'lithos' (piedra): 'piedra que hierve' — liberan agua al calentar","notes":"Las zeolitas industrialmente son tamices moleculares (catalizadores, purificación de agua, suavizantes). La presencia en basaltos amigdaloides = relleno hidrotermal de bajo grado. PRUEBAS: (1) Cristales tabulares (heulandita) o fasces de cristales en abanico (estilbita). (2) Brillo perláceo o vítreo. (3) Incoloro o blanco. (4) Siempre en cavidades y amígdalas de basaltos. CONFUSIÓN CON: Calcita — reacciona al HCl; rombohédrica. Feldespato — sin brillo perláceo tan suave; en masa ígnea. Baritina — muy pesada; sin cavidades de basalto.","q1":"¿Qué imagen mental evoca el mnemónico de Zeolita (estilbita / heulandita)? Descríbelo con tus palabras.","t1":["cristales","perláceos","calentarlos","piedra","hierve"],"q2":"¿Cuál es el rasgo más diagnóstico de Zeolita (estilbita / heulandita)? Incluye al menos un término clave.","t2":["cristales","tabulares","estelares","incoloros","blancos"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-051","cat":"Geología","sub":"Mineral","name":"Wollastonita","sci":"CaSiO₃ (Wollastonita)","fam":"Inosílicato (piroxenoide)","freq":"media","key":"Color blanco a gris-blancuzco; cristales aciculares o fibrosos sedosos","mnem":"La 'cal que se convirtió en silicato': cuando una caliza es atravesada por un magma caliente, el CaCO₃ se transforma en wollastonita — el mineral blanco fibroso que marca el contacto","etym":"En honor al mineralogista inglés William Hyde Wollaston (1766-1828), descubridor del paladio y rodio","notes":"La wollastonita es el mineral diagnóstico del metamorfismo de contacto de calizas (skarn). La reacción CaCO₃ + SiO₂ = CaSiO₃ + CO₂ es evaluable en petrología metamórfica. PRUEBAS: (1) Color blanco a gris-blancuzco. (2) Cristales aciculares o fibrosos sedosos. (3) En skarn: contacto caliza-granito. (4) Reacción al HCl muy débil (silicato de calcio, no carbonato). CONFUSIÓN CON: Tremolita — también acicular y blanca pero clivaje anfibólico a 120°. Calcita fibrosa — reacciona vivamente al HCl. Yeso fibroso — dur.2, uña lo raya.","q1":"Explica el mnemónico de Wollastonita y qué rasgos te ayuda a recordar.","t1":["convirtió","atravesada","silicato","wollastonita","transforma"],"q2":"Describe el carácter principal que identifica a Wollastonita a primera vista.","t2":["blancuzco","aciculares","cristales","blanco","color"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-052","cat":"Geología","sub":"Mineral","name":"Silvita","sci":"KCl (Silvita)","fam":"Haluro","freq":"media","key":"Aspecto idéntico a la halita (sal gema) pero sabor amargo o picante — diagnóstico sensorial clave","mnem":"La 'sal que amarga': idéntica a la sal gema pero al probarla (si te dejan) tiene sabor amargo/picante en vez de salado — el único par de minerales que se diferencia por el sabor","etym":"De Sylvius de le Boë (Franz Sylvius), médico neerlandés del siglo XVII que estudió la química de las sales","notes":"La silvita es la mena del potasio (fertilizante). La diferencia halita/silvita por sabor (salado vs. amargo) es muy evaluable y memorable. Ambas en evaporitas pero silvita más rara. PRUEBAS: (1) Aspecto idéntico a halita (sal gema). (2) PROBAR: sabor AMARGO o picante (NO salado). (3) Si no se puede probar: clivaje cúbico perfecto, translúcido, contexto evaporítico potásico. CONFUSIÓN CON: Halita — sabor salado (no amargo). La confusión silvita/halita es el par diferencial más clásico de los haluros.","q1":"¿Cómo usarías el mnemónico de Silvita para no olvidarlo en el examen?","t1":["idéntica","probarla","amarga","diferencia","minerales"],"q2":"¿Qué rasgo de Silvita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["diagnóstico","idéntico","aspecto","sensorial","halita"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-053","cat":"Geología","sub":"Mineral","name":"Vivianita","sci":"Fe₃(PO₄)₂·8H₂O (Vivianita)","fam":"Fosfato","freq":"baja","key":"Color azul intenso a verde-azulado cuando expuesto al aire (se oxida rápidamente del blanco al azul)","mnem":"El 'mineral que se tiñe de azul al respirar': incoloro recién extraído, se vuelve azul intenso en minutos al oxidarse al contacto con el aire — el fenómeno más espectacular de la mineralogía","etym":"En honor al mineralogista inglés John Henry Vivian (1785-1855)","notes":"El cambio de color al oxidarse al aire es absolutamente único. Muy frecuente en sedimentos ricos en materia orgánica y en viejas conchas de moluscos. PRUEBAS: (1) En muestra fresca: blanco-incoloro. Pero al exponerse al aire: toma COLOR AZUL INTENSO progresivamente. (2) En sedimentos orgánicos (fosforítico). (3) Dur.1.5-2. CONFUSIÓN CON: Azurita — también azul pero en zonas oxidadas de sulfuros de cobre; no cambia de color. Crisocola — turquesa, masiva. La vivianita recién extraída puede confundirse con cualquier mineral incoloro.","q1":"¿Qué imagen mental evoca el mnemónico de Vivianita? Descríbelo con tus palabras.","t1":["mineral","respirar","incoloro","espectacular","extraído"],"q2":"¿Cuál es el rasgo más diagnóstico de Vivianita? Incluye al menos un término clave.","t2":["intenso","color","azulado","expuesto","azul"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-054","cat":"Geología","sub":"Mineral","name":"Azurita","sci":"Cu₃(CO₃)₂(OH)₂ (Azurita)","fam":"Carbonato de cobre","freq":"alta","key":"Azul intenso-cielo brillante — el azul más intenso de todos los minerales comunes","mnem":"La 'compañera verde-azul del cobre': si ves azul intenso brillante junto a verde brillante en la misma muestra, es azurita+malaquita. Juntas siempre delatan un yacimiento de cobre","etym":"Del árabe 'lazaward' (lapislázuli, azul intenso): por su color azul profundo","notes":"El par azurita (azul)/malaquita (verde) como zona de oxidación de sulfuros de cobre es un tema clásico. La transformación azurita→malaquita es evaluable. Pigmento histórico del Renacimiento. PRUEBAS: (1) Azul intenso: el azul más vivo entre los minerales de cobre. (2) Efervescencia con HCl (carbonato de cobre). (3) Raya azul claro. (4) Siempre asociada a zonas oxidadas de yacimientos de cobre. CONFUSIÓN CON: Malaquita — verde intensa (mismo contexto), también reacciona al HCl. Crisocola — turquesa, no reacciona al HCl. Lazurita (lapislázuli) — azul pero en rocas metamórficas, no en zonas de oxidación de cobre.","q1":"Explica el mnemónico de Azurita y qué rasgos te ayuda a recordar.","t1":["compañera","brillante","verde","intenso","yacimiento"],"q2":"Describe el carácter principal que identifica a Azurita a primera vista.","t2":["brillante","intenso","minerales","azul","cielo"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-055","cat":"Geología","sub":"Mineral","name":"Crisocola","sci":"Cu₂H₂Si₂O₅(OH)₄ (Crisocola)","fam":"Filosilicato de cobre (silicato)","freq":"media","key":"Color azul-verde brillante a turquesa; aspecto masivo, resinoso o botroidal","mnem":"El 'turquesa de la zona de oxidación del cobre': aspecto de plástico turquesa sin caras cristalinas — como esmalte azul-verde pintado en la roca","etym":"Del griego 'chrysos' (oro) + 'kolla' (cola): usada en la antigüedad para soldar el oro","notes":"El trío azurita (azul)/malaquita (verde)/crisocola (turquesa) marca las tres fases de oxidación del cobre. La ausencia de caras cristalinas (siempre masiva) es diagnóstica. PRUEBAS: (1) Color azul-verde brillante a turquesa. (2) Aspecto masivo, resinoso o botroidal. (3) NO reacciona al HCl (silicato de cobre, no carbonato). (4) Contexto: zona de oxidación de cobre. CONFUSIÓN CON: Azurita — azul más intenso, SÍ reacciona al HCl. Malaquita — verde intensa, SÍ reacciona al HCl. Turquesa — muy similar pero en contexto diferente (zona árida, fosfato de aluminio-cobre).","q1":"¿Cómo usarías el mnemónico de Crisocola para no olvidarlo en el examen?","t1":["turquesa","oxidación","cristalinas","plástico","aspecto"],"q2":"¿Qué rasgo de Crisocola es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["brillante","turquesa","color","botroidal","aspecto"],"catf":"geología","subf":"mineral","hab":""},{"id":"ROC-001","cat":"Geología","sub":"Roca","name":"Granito","sci":"Granito","fam":"Ígnea plutónica (ácida)","freq":"muy_alta","key":"Textura granular gruesa visible a simple vista: cuarzo gris + feldespato rosado + micas negras/plateadas","mnem":"El 'pastel de tres colores': cuarzo gris + feldespato rosado + micas negras. Si ves los tres, granito","etym":"Del latín 'granum' (grano): por su textura granular","notes":"IMPRESCINDIBLE. La Sierra de Guadarrama es plutónica granítica — directamente en el contexto geológico de Madrid. Identificar variedad: leucogranito (claro), granodiorita (más oscura). También puede aparecer como muestra de roca para clasificar como ígnea plutónica ácida. PRUEBAS: (1) Textura granuda gruesa: cuarzo gris + feldespato rosado + micas visibles a simple vista. (2) NO reacciona al HCl. (3) Muy duro (cuarzo). (4) Rayas de los minerales visibles. CONFUSIÓN CON: Granodiorita — más oscura, más plagioclasa que ortosa, más hornblenda y biotita. Gneiss granítico — tiene foliación (bandas); el granito es masivo. Diorita — sin cuarzo visible; color 'sal y pimienta'.","q1":"¿Qué imagen mental evoca el mnemónico de Granito? Descríbelo con tus palabras.","t1":["feldespato","colores","pastel","cuarzo","rosado"],"q2":"¿Cuál es el rasgo más diagnóstico de Granito? Incluye al menos un término clave.","t2":["granular","textura","feldespato","visible","gruesa"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-002","cat":"Geología","sub":"Roca","name":"Basalto","sci":"Basalto","fam":"Ígnea volcánica (básica)","freq":"alta","key":"Negro o gris muy oscuro; textura afanítica (grano tan fino que no se ven los minerales)","mnem":"La 'piedra negra de los volcanes': oscura, densa, grano fino. Si tiene huecos redondos, es basalto vesicular","etym":"Del latín 'basaltes', del griego 'basanites lithos' (piedra de toque)","notes":"Diferenciar de gabro (mismo origen pero grano grueso) y de obsidiana (sin minerales, vítreo). PRUEBAS: (1) Negro o gris oscuro. (2) Textura afanítica (sin granos visibles). (3) NO reacciona al HCl. (4) Denso y duro. CONFUSIÓN CON: Gabro — mismo color pero grano grueso visible. Obsidiana — brillo vítreo intenso, fractura concoidea perfecta. Andesita — más grisácea, posibles fenocristales blancos. Pizarra — foliación perfecta, se parte en láminas.","q1":"Explica el mnemónico de Basalto y qué rasgos te ayuda a recordar.","t1":["volcanes","piedra","negra","oscura","redondos"],"q2":"Describe el carácter principal que identifica a Basalto a primera vista.","t2":["afanítica","textura","negro","oscuro","gris"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-003","cat":"Geología","sub":"Roca","name":"Gabro","sci":"Gabro","fam":"Ígnea plutónica (básica)","freq":"media","key":"Negro a verde muy oscuro con textura granular gruesa (grano visible)","mnem":"El 'granito negro': misma textura granular que el granito pero completamente oscuro y sin cuarzo","etym":"De 'Gabbro', localidad de la Toscana (Italia)","notes":"Par de estudio con basalto. Mismo origen geoquímico pero cristalización lenta = grano grueso. PRUEBAS: (1) Grano grueso visible: olivino verde + piroxeno negro + plagioclasa blanca. (2) Color negro a verde oscuro. (3) Muy denso. CONFUSIÓN CON: Basalto — mismo color pero afanítico (grano no visible). Peridotita — más verde, sin plagioclasa, solo olivino+piroxeno. Anfibolita — foliación metamórfica.","q1":"¿Cómo usarías el mnemónico de Gabro para no olvidarlo en el examen?","t1":["completamente","granito","granular","textura","negro"],"q2":"¿Qué rasgo de Gabro es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["granular","textura","negro","oscuro","verde"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-004","cat":"Geología","sub":"Roca","name":"Obsidiana","sci":"Obsidiana (vidrio volcánico)","fam":"Ígnea volcánica (vítrea, ácida)","freq":"media","key":"Negro brillante con fractura concoidea perfecta (como el vidrio roto)","mnem":"El 'cristal negro de los aztecas': vidrio volcánico negro con bordes tan cortantes como una cuchilla","etym":"Del latín 'obsidianus'","notes":"Inconfundible por su brillo vítreo negro y fractura concoidea. No tiene estructura mineral visible. PRUEBAS: (1) Negro brillante VÍTREO: no tiene ningún grano mineral visible. (2) Fractura concoidea perfecta con bordes extremadamente cortantes. (3) Brillo como vidrio de botella. CONFUSIÓN CON: Basalto — opaco, sin brillo vítreo, fractura irregular. Sílex negro — también fractura concoidea pero opaco/mate y sedimentario. Shungita — también negra vítrea pero más rara y diferente contexto.","q1":"¿Qué imagen mental evoca el mnemónico de Obsidiana? Descríbelo con tus palabras.","t1":["cristal","volcánico","aztecas","cortantes","negro"],"q2":"¿Cuál es el rasgo más diagnóstico de Obsidiana? Incluye al menos un término clave.","t2":["brillante","concoidea","fractura","perfecta","negro"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-005","cat":"Geología","sub":"Roca","name":"Pumita (piedra pómez)","sci":"Pumita","fam":"Ígnea volcánica (piroclástica)","freq":"media","key":"Extraordinariamente ligera: flota en el agua","mnem":"La 'roca que nada': la única roca que flota en el agua gracias a sus miles de burbujitas de gas","etym":"Del latín 'pumex' (pumita, piedra esponjosa)","notes":"Si el ejemplar flota en agua, ya tienes la respuesta. La ligereza extrema es el rasgo diagnóstico. PRUEBAS: (1) Poner en agua: FLOTA (la única roca común que flota). (2) Color blanco o gris pálido. (3) Innumerables poros y cavidades. CONFUSIÓN CON: Diatomita — también muy ligera y blanca, también puede flotar, pero de origen sedimentario; no vítrea. Toba volcánica — también porosa pero más densa y no siempre flota.","q1":"Explica el mnemónico de Pumita (piedra pómez) y qué rasgos te ayuda a recordar.","t1":["burbujitas","roca","única","gracias","nada"],"q2":"Describe el carácter principal que identifica a Pumita (piedra pómez) a primera vista.","t2":["extraordinariamente","ligera","flota","agua"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-006","cat":"Geología","sub":"Roca","name":"Riolita","sci":"Riolita","fam":"Ígnea volcánica (ácida)","freq":"media","key":"Color claro: rosado, grisáceo o blanquecino","mnem":"El 'granito volcánico': misma composición que el granito pero con grano fino y colores claros","etym":"Del griego 'rhyax' (corriente de lava) + 'lithos' (roca)","notes":"El color claro y la textura fina la distinguen del basalto. PRUEBAS: (1) Color claro: blanco, rosado o grisáceo. (2) Textura afanítica o con fenocristales de cuarzo y feldespato. (3) NO reacciona al HCl. CONFUSIÓN CON: Basalto — negro, no claro. Traquita — sin cuarzo; textura áspera al tacto. Andesita — más grisácea-verdosa. Dacita — entre riolita y andesita.","q1":"¿Cómo usarías el mnemónico de Riolita para no olvidarlo en el examen?","t1":["composición","volcánico","granito","colores","grano"],"q2":"¿Qué rasgo de Riolita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["blanquecino","grisáceo","color","rosado","claro"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-007","cat":"Geología","sub":"Roca","name":"Caliza","sci":"Caliza (CaCO₃)","fam":"Sedimentaria carbonatada","freq":"muy_alta","key":"Reacciona vivamente con HCl (efervescencia): prueba diagnóstica definitiva","mnem":"La 'roca del ácido': una gota de HCl y burbujea sin parar. La piedra de las catedrales y los karst","etym":"Del latín 'calcarius' (relativo a la cal)","notes":"Prueba del HCl imprescindible. Muy abundante en la Comunidad de Madrid (Cretácico de la sierra). Diferenciar variedades: caliza compacta, lumaquela (con fósiles), oolítica, travertino. PRUEBAS: (1) Aplicar HCl: EFERVESCENCIA VIVA = caliza (definitivo). (2) Color gris, beige o blanco. (3) Posibles fósiles. (4) Comprobar que NO es dolomía (dolomía no efervesencia o muy débil en frío). CONFUSIÓN CON: Dolomía — NO efervescencia al HCl en frío (o muy débil). Mármol — caliza metamorfizada, sin fósiles, textura sacaroide. Travertino — poroso con huecos de vegetales. Sílex — muy duro, fractura concoidea.","q1":"¿Qué imagen mental evoca el mnemónico de Caliza? Descríbelo con tus palabras.","t1":["catedrales","burbujea","ácido","roca","piedra"],"q2":"¿Cuál es el rasgo más diagnóstico de Caliza? Incluye al menos un término clave.","t2":["diagnóstica","reacciona","vivamente","definitiva","prueba"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-008","cat":"Geología","sub":"Roca","name":"Arenisca triásica (rodeno)","sci":"Arenisca (rodeno)","fam":"Sedimentaria detrítica","freq":"muy_alta","key":"Textura arenosa visible: granos de cuarzo cementados entre sí","mnem":"La 'lija roja del Triásico': aspereza característica y color rojo-ladrillo inconfundible en la serranía de Madrid","etym":"Arenisca = roca de arena; rodeno = nombre popular de la arenisca triásica roja","notes":"CONFIRMADO como la roca sedimentaria más frecuente en Madrid. El rodeno (arenisca triásica rojo-anaranjada) es muy específico de la geología madrileña. Junto con la cuarcita, la más preguntada. PRUEBAS: (1) Textura arenosa: granos de cuarzo visibles cementados. (2) Color rojo a anaranjado (óxidos de hierro). (3) NO reacciona al HCl (cemento silíceo o ferrugínoso). (4) Granos bien redondeados. CONFUSIÓN CON: Conglomerado — clastos >2mm, redondeados, mayor tamaño. Cuarcita — arenisca muy compacta, fractura a través de los granos (no entre ellos). Limolita — grano más fino (no visible con lupa). Brecha — cantos angulosos.","q1":"Explica el mnemónico de Arenisca triásica (rodeno) y qué rasgos te ayuda a recordar.","t1":["característica","inconfundible","triásico","aspereza","ladrillo"],"q2":"Describe el carácter principal que identifica a Arenisca triásica (rodeno) a primera vista.","t2":["cementados","textura","arenosa","visible","granos"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-009","cat":"Geología","sub":"Roca","name":"Conglomerado","sci":"Conglomerado","fam":"Sedimentaria detrítica","freq":"alta","key":"Cantos rodados (>2 mm) de diferentes rocas cementados en una matriz arenosa o arcillosa","mnem":"La 'roca mosaico': mezcla de cantos rodados pegados. Como el fondo de un río cementado","etym":"Del latín 'conglomerare' (amontonar)","notes":"Diferenciar de brecha por el redondeo de los clastos. PRUEBAS: (1) Cantos rodados >2mm de diversas litologías cementados. (2) REDONDEADOS (si son angulosos = brecha). (3) Matriz arenosa o arcillosa entre los cantos. CONFUSIÓN CON: Brecha sedimentaria — cantos ANGULOSOS (no redondeados). Conglomerado volcánico — clastos de lava. Tilita — de origen glaciar, clastos sin clasificar.","q1":"¿Cómo usarías el mnemónico de Conglomerado para no olvidarlo en el examen?","t1":["mosaico","cementado","mezcla","rodados","cantos"],"q2":"¿Qué rasgo de Conglomerado es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["diferentes","cementados","rodados","cantos","arcillosa"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-010","cat":"Geología","sub":"Roca","name":"Arcilla (lutita)","sci":"Lutita / Arcilla compactada","fam":"Sedimentaria detrítica fina","freq":"alta","key":"Grano muy fino (< 0.004 mm): no se distinguen granos a simple vista","mnem":"La 'roca de alfarero': se humedece, huele a tierra y se vuelve blanda. El barro hecho piedra","etym":"Del latín 'argilla' (arcilla blanca para modelar)","notes":"Puede aparecer en contexto de rocas de la cuenca del Tajo (Mioceno de Madrid). PRUEBAS: (1) Grano imperceptible (<0.004mm). (2) Aspecto masivo, sin brillo. (3) Plasticidad cuando húmeda. (4) Olor a tierra al humedecerse. CONFUSIÓN CON: Limolita — grano algo mayor (lupa lo revela); no tan plástica. Pizarra — foliación perfecta en láminas; grano imperceptible igualmente pero más dura. Tiza/creta — también fina pero reacciona al HCl.","q1":"¿Qué imagen mental evoca el mnemónico de Arcilla (lutita)? Descríbelo con tus palabras.","t1":["alfarero","humedece","roca","tierra","huele"],"q2":"¿Cuál es el rasgo más diagnóstico de Arcilla (lutita)? Incluye al menos un término clave.","t2":["distinguen","grano","granos","simple","fino"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-011","cat":"Geología","sub":"Roca","name":"Yeso (roca evaporítica)","sci":"Roca de yeso","fam":"Sedimentaria evaporítica","freq":"alta","key":"Blanco mate a grisáceo; se raya con la uña (dureza 2)","mnem":"La 'roca del escayolista': blanca, blanda (uña la raya) y sin efervescencia (diferencia de la caliza)","etym":"Ver mineral yeso","notes":"Muy común en la Comunidad de Madrid (cuencas evaporíticas miocenas). La falta de reacción al HCl la diferencia de la caliza. PRUEBAS: (1) Rayar con la uña: si se marca fácilmente = yeso (dur.2). (2) NO reacciona al HCl (diferencia de caliza). (3) Color blanco a gris. (4) Aspecto sacaroide o fibroso. CONFUSIÓN CON: Caliza — reacciona vivamente al HCl. Anhidrita — más dura (dur.3.5), sin poder rayar con uña. Mármol — textura sacaroide pero muy duro, reacciona al HCl.","q1":"Explica el mnemónico de Yeso (roca evaporítica) y qué rasgos te ayuda a recordar.","t1":["efervescencia","escayolista","blanca","blanda","roca"],"q2":"Describe el carácter principal que identifica a Yeso (roca evaporítica) a primera vista.","t2":["grisáceo","blanco","mate","raya"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-012","cat":"Geología","sub":"Roca","name":"Carbón (hulla)","sci":"Hulla (carbón bituminoso)","fam":"Sedimentaria orgánica","freq":"baja","key":"Negro brillante con raya negra; muy ligero","mnem":"La 'roca que arde': negro brillante, ligero y deja raya negra. El carbón de piedra","etym":"De 'hulla': del flamenco 'huile' (aceite): por el color oscuro aceitoso","notes":"Puede aparecer en colecciones. Identificar variedad: turba < lignito < hulla < antracita. PRUEBAS: (1) Negro brillante a submetálico. (2) Raya negra/marrón oscura. (3) Muy ligero. (4) A veces se pueden ver capas o una estructura fibrosa. CONFUSIÓN CON: Grafito — mineral (no roca), metálico, mancha más. Pizarra carbonosa — tiene foliación perfecta. Antracita — más brillante y dura que la hulla. Turba — más ligera y fibrosa.","q1":"¿Cómo usarías el mnemónico de Carbón (hulla) para no olvidarlo en el examen?","t1":["brillante","roca","negro","ligero","arde"],"q2":"¿Qué rasgo de Carbón (hulla) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["brillante","negro","ligero","negra","raya"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-013","cat":"Geología","sub":"Roca","name":"Pizarra","sci":"Pizarra","fam":"Metamórfica (grado bajo)","freq":"alta","key":"Exfoliación perfecta en láminas finas (clivaje pizarroso)","mnem":"La 'roca de la pizarra escolar': se parte en láminas perfectas, gris oscura y grano finísimo","etym":"Del latín vulgar 'plastea'","notes":"Muy frecuente. Clave: láminas perfectas + grano imperceptible. Diferencia de esquisto: el esquisto tiene minerales visibles. PRUEBAS: (1) Exfoliación perfecta en láminas finas = clivaje pizarroso (diagnóstico). (2) Grano imperceptible. (3) Color negro, gris o verdoso. (4) Superficies lisas y brillantes. CONFUSIÓN CON: Esquisto — también con foliación pero con minerales VISIBLES alineados (micas, clorita). Filita — brillo sedoso satinado más intenso que la pizarra. Lutita (arcilla) — no foliada, plasticidad cuando mojada.","q1":"¿Qué imagen mental evoca el mnemónico de Pizarra? Descríbelo con tus palabras.","t1":["pizarra","perfectas","escolar","láminas","roca"],"q2":"¿Cuál es el rasgo más diagnóstico de Pizarra? Incluye al menos un término clave.","t2":["exfoliación","perfecta","láminas","finas"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-014","cat":"Geología","sub":"Roca","name":"Esquisto","sci":"Esquisto","fam":"Metamórfica (grado medio)","freq":"alta","key":"Foliación bien desarrollada con minerales visibles alineados","mnem":"La 'roca espejo': superficies brillantes de mica con minerales porfidoblásticos — más grueso y brillante que la pizarra","etym":"Del griego 'schistos' (que puede dividirse)","notes":"Muy presente en la Sierra de Guadarrama. Diferenciar de pizarra (grano más fino) y de gneis (bandas de feldespato+cuarzo). PRUEBAS: (1) Foliación con minerales VISIBLES alineados (micas, clorita, granate). (2) Superficie brillante con micas. (3) Puede tener granates dodecaédricos. CONFUSIÓN CON: Pizarra — grano más fino, sin minerales visibles. Gneis — bandas ALTERNAS claras y oscuras (no foliación continua de micas). Filita — intermedia, brillo satinado pero minerales no visibles.","q1":"Explica el mnemónico de Esquisto y qué rasgos te ayuda a recordar.","t1":["porfidoblásticos","superficies","brillantes","minerales","espejo"],"q2":"Describe el carácter principal que identifica a Esquisto a primera vista.","t2":["desarrollada","foliación","minerales","alineados","visibles"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-015","cat":"Geología","sub":"Roca","name":"Gneis","sci":"Gneis","fam":"Metamórfica (grado alto)","freq":"alta","key":"Bandas alternadas claras (cuarzo + feldespato) y oscuras (micas + anfíboles)","mnem":"El 'granito rayado': bandas claras y oscuras alternadas, como un código de barras en roca","etym":"Del alemán 'Gneis' (chispa): por el brillo de los feldespatos","notes":"Muy frecuente en el Sistema Central (Guadarrama). Las bandas claras/oscuras son el rasgo más llamativo. PRUEBAS: (1) Bandas ALTERNAS claras (cuarzo+feldespato) y oscuras (micas+anfíboles). (2) Grano grueso visible. (3) Sin foliación continua (bandeado, no esquistosidad). CONFUSIÓN CON: Granito — masivo, sin bandas. Esquisto — foliación continua de micas, no bandeado. Migmatita — mezcla de material metamórfico y fundido; más irregular. Diorita bandeada — sin metamorfismo.","q1":"¿Cómo usarías el mnemónico de Gneis para no olvidarlo en el examen?","t1":["alternadas","granito","rayado","bandas","oscuras"],"q2":"¿Qué rasgo de Gneis es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["alternadas","bandas","oscuras","claras"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-016","cat":"Geología","sub":"Roca","name":"Mármol","sci":"Mármol","fam":"Metamórfica (carbonatada)","freq":"alta","key":"Blanco a gris con textura sacaroide (azucarada): cristales de calcita entrelazados","mnem":"La 'caliza brillante': misma reacción al ácido pero textura azucarada cristalina y sin fósiles","etym":"Del griego 'marmaros' (piedra brillante)","notes":"Se distingue de la caliza por la textura sacaroide y la ausencia de fósiles (el metamorfismo los destruye). PRUEBAS: (1) Reacciona al HCl (carbonato de calcio). (2) Textura sacaroide (cristales de calcita interlocking). (3) Sin fósiles (destruidos por el metamorfismo). (4) A menudo con venas de calcita. CONFUSIÓN CON: Caliza — también reacciona al HCl pero tiene fósiles y textura más fina o micrítica. Yeso (roca) — no reacciona al HCl; dur.2. Cuarcita — también textura sacaroide pero no reacciona al HCl.","q1":"¿Qué imagen mental evoca el mnemónico de Mármol? Descríbelo con tus palabras.","t1":["brillante","reacción","cristalina","azucarada","caliza"],"q2":"¿Cuál es el rasgo más diagnóstico de Mármol? Incluye al menos un término clave.","t2":["entrelazados","sacaroide","cristales","blanco","textura"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-017","cat":"Geología","sub":"Roca","name":"Cuarcita","sci":"Cuarcita","fam":"Metamórfica (cuarzosa)","freq":"muy_alta","key":"Muy dura y compacta; fractura concoidea (no se parte por los granos sino a través de ellos)","mnem":"La 'arenisca de acero': parece una arenisca blanquecina pero es durísima y la fractura no respeta los granos","etym":"De 'cuarzo' + '-ita' (roca): roca de cuarzo recristalizado","notes":"CONFIRMADA como la roca metamórfica más frecuente en Madrid. Clave diagnóstica definitiva: muy dura (7) + brillo vítreo + fractura concoidea. La arenisca fractura ENTRE granos (los ves rotos); la cuarcita fractura A TRAVÉS de los granos. PRUEBAS: (1) Muy dura: no se puede rayar con navaja. (2) Fractura CONCOIDEA — pasa A TRAVÉS de los granos, no entre ellos (diferencia de arenisca). (3) Resistente al meteorizado. CONFUSIÓN CON: Arenisca — fractura entre los granos (textura arenosa palpable). Sílex — también durísimo y fractura concoidea pero sedimentario, gris o negro. Corneana (hornfels) — también muy dura pero sin granos de cuarzo visibles.","q1":"Explica el mnemónico de Cuarcita y qué rasgos te ayuda a recordar.","t1":["blanquecina","arenisca","durísima","parece","fractura"],"q2":"Describe el carácter principal que identifica a Cuarcita a primera vista.","t2":["compacta","concoidea","fractura","dura"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-018","cat":"Geología","sub":"Roca","name":"Filita","sci":"Filita","fam":"Metamórfica (grado bajo-medio)","freq":"baja","key":"Brillo sedoso satinado en las superficies de foliación (más que la pizarra)","mnem":"La 'pizarra satinada': más brillante que la pizarra por sus micas incipientes, más fina que el esquisto","etym":"Del griego 'phyllon' (hoja): por sus superficies foliadas","notes":"Puede aparecer en la serie: lutita → pizarra → filita → esquisto. Su brillo sedoso la distingue de la pizarra. PRUEBAS: (1) Brillo sedoso SATINADO muy llamativo en superficies de foliación. (2) Color gris plateado o verdoso. (3) Grano fino pero algo mayor que pizarra. CONFUSIÓN CON: Pizarra — sin brillo satinado. Esquisto micáceo — con minerales visibles. Talquisita — foliación pero con talco.","q1":"¿Cómo usarías el mnemónico de Filita para no olvidarlo en el examen?","t1":["incipientes","brillante","satinada","pizarra","esquisto"],"q2":"¿Qué rasgo de Filita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["superficies","satinado","foliación","brillo","sedoso"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-019","cat":"Geología","sub":"Roca","name":"Peridotita","sci":"Peridotita","fam":"Ígnea plutónica (ultramáfica)","freq":"baja","key":"Dominantemente verde oscuro a negro por olivino y piroxeno","mnem":"La 'roca del manto': verde oscura, muy pesada y sin cuarzo — viene de las profundidades","etym":"De 'peridoto' (nombre antiguo del olivino) + '-ita' (roca)","notes":"Verde oscura + muy densa son las claves. Menos frecuente pero importante conceptualmente. PRUEBAS: (1) Verde oscuro dominante (olivino). (2) Muy densa. (3) Sin plagioclasa visible (a diferencia del gabro). (4) En xenolitos de volcanes o en ofiolitas. CONFUSIÓN CON: Gabro — también oscuro pero con plagioclasa blanca visible. Serpentinita — verde oscura pero brillo aceitoso y menos densa. Dunita — todo olivino, aún más verde.","q1":"¿Qué imagen mental evoca el mnemónico de Peridotita? Descríbelo con tus palabras.","t1":["profundidades","manto","oscura","roca","verde"],"q2":"¿Cuál es el rasgo más diagnóstico de Peridotita? Incluye al menos un término clave.","t2":["dominantemente","piroxeno","oscuro","olivino","verde"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-020","cat":"Geología","sub":"Roca","name":"Diorita","sci":"Diorita","fam":"Ígnea plutónica (intermedia)","freq":"baja","key":"Textura sal-pimienta: plagioclasa blanca + hornblenda negra en proporciones similares","mnem":"El 'granito sal y pimienta': igual de granular que el granito pero sin cuarzo rosado, solo blanco y negro","etym":"Del griego 'diorizein' (distinguir): por sus colores contrastados","notes":"La ausencia de cuarzo y el color 'sal y pimienta' son diagnósticos. PRUEBAS: (1) Textura 'sal y pimienta': plagioclasa BLANCA + hornblenda NEGRA a partes iguales. (2) Sin cuarzo visible. (3) Grano medio-grueso. CONFUSIÓN CON: Granito — tiene cuarzo gris y feldespato rosado. Gabro — más oscuro, más piroxeno, menos plagioclasa blanca. Tonalita — también sal-pimienta pero con cuarzo.","q1":"Explica el mnemónico de Diorita y qué rasgos te ayuda a recordar.","t1":["pimienta","granito","granular","igual","cuarzo"],"q2":"Describe el carácter principal que identifica a Diorita a primera vista.","t2":["plagioclasa","proporciones","hornblenda","pimienta","textura"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-021","cat":"Geología","sub":"Roca","name":"Andesita","sci":"Andesita","fam":"Ígnea volcánica (intermedia)","freq":"baja","key":"Gris oscura a verdosa; textura afanítica o porfirítica","mnem":"La 'roca de los Andes': gris con manchas blancas de plagioclasa, más clara que el basalto","etym":"De 'Andes': roca volcánica típica de la Cordillera de los Andes","notes":"Equivalente volcánico de la diorita. Puede parecer un basalto grisáceo con fenocristales blancos. PRUEBAS: (1) Textura afanítica o con fenocristales. (2) Gris oscura a verdosa. (3) Fenocristales blancos de plagioclasa o negros de hornblenda. CONFUSIÓN CON: Basalto — más negro, sin fenocristales blancos. Riolita — más clara. Dacita — más clara que andesita.","q1":"¿Cómo usarías el mnemónico de Andesita para no olvidarlo en el examen?","t1":["plagioclasa","manchas","blancas","andes","roca"],"q2":"¿Qué rasgo de Andesita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["porfirítica","afanítica","verdosa","oscura","textura"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-022","cat":"Geología","sub":"Roca","name":"BrechaSedimentaria","sci":"Brecha","fam":"Sedimentaria detrítica","freq":"baja","key":"Cantos angulosos (no redondeados) cementados en matriz fina","mnem":"El 'conglomerado roto': misma idea pero fragmentos con aristas, no redondeados","etym":"Del italiano 'breccia' (grava, escombros)","notes":"La angularidad de los clastos es la clave diferencial respecto al conglomerado. PRUEBAS: (1) Clastos ANGULOSOS (no redondeados) cementados en matriz fina. (2) Clastos de una sola litología (brechas monomícticas) o varias (polimícticas). (3) Textura caótica. CONFUSIÓN CON: Conglomerado — clastos REDONDEADOS. Tilita (till glaciar) — mala clasificación pero clastos muy variados. Brecha de falla — clastos del propio encajante en zona de falla.","q1":"¿Qué imagen mental evoca el mnemónico de Brecha sedimentaria? Descríbelo con tus palabras.","t1":["conglomerado","fragmentos","redondeados","aristas","roto"],"q2":"¿Cuál es el rasgo más diagnóstico de Brecha sedimentaria? Incluye al menos un término clave.","t2":["cementados","angulosos","cantos","matriz","fina"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-023","cat":"Geología","sub":"Roca","name":"Sílex (pedernal)","sci":"Sílex (SiO₂ microcristalino)","fam":"Sedimentaria silícea","freq":"media","key":"Gris, negro o pardo; fractura concoidea perfecta con bordes muy cortantes","mnem":"La 'roca de los cavernícolas': gris, durísima, fractura concoidea con filos cortantes y produce chispas","etym":"Del latín 'silex' (pedernal, roca dura)","notes":"Puede aparecer en contexto de calizas (nódulos de sílex). La fractura concoidea con bordes afilados es clave. PRUEBAS: (1) Fractura concoidea perfecta con bordes muy cortantes. (2) Muy duro (dur.7). (3) Color gris, negro, pardo o beige. (4) Sin efervescencia al HCl. CONFUSIÓN CON: Caliza — reacciona al HCl; fractura no concoidea. Obsidiana — brillo vítreo más intenso; volcánica. Cuarcita — fractura concoidea pero contexto metamórfico.","q1":"Explica el mnemónico de Sílex (pedernal) y qué rasgos te ayuda a recordar.","t1":["cavernícolas","durísima","concoidea","fractura","cortantes"],"q2":"Describe el carácter principal que identifica a Sílex (pedernal) a primera vista.","t2":["concoidea","fractura","perfecta","cortantes","negro"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-024","cat":"Geología","sub":"Roca","name":"Dolomía","sci":"Dolomía","fam":"Sedimentaria carbonatada","freq":"alta","key":"Aspecto similar a la caliza: gris a crema","mnem":"La 'caliza reacia al ácido': si el HCl en frío no hace casi nada, es dolomía, no caliza","etym":"De 'dolomita' (ver mineral do
