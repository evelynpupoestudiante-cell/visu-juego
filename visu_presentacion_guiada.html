les son diagnósticos. Planta arvense de campos de cereal. Fue muy común antes del uso de herbicidas.","hab":"Campos de cereal, bordes de camino","q1":"¿Cómo usarías el mnemónico de Aciano / Azulejo para no olvidarlo en el examen?","t1":["eléctrico","periféricas","azul","campo","flores"],"q2":"¿Qué rasgo de Aciano / Azulejo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["periféricas","violáceas","llamativas","flores","intensas"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-036","cat":"Botánica","sub":"Herbácea","name":"Nenúfar blanco","sci":"Nymphaea alba","fam":"Nymphaeaceae","freq":"alta","key":"Hojas flotantes grandes (10-30 cm), redondas o reniformes, con hendidura en V hasta el peciolo","mnem":"La 'flor de loto europea': hojas redondas flotantes + flor blanca enorme abierta sobre el agua — el nenúfar de los cuadros de Monet","etym":"Nymphaea (gr.) = nymphe (ninfa acuática): 'la de las ninfas' · alba = 'blanca'","notes":"La hoja flotante con hendidura en V hasta el centro + la flor blanca grande son diagnósticas. Diferenciar de Nuphar (nenúfar amarillo): Nymphaea = blanca; Nuphar = amarilla y más pequeña.","hab":"Lagos, lagunas y remansos de ríos con aguas tranquilas; profundidad 0.5-3 m","q1":"¿Qué imagen mental evoca el mnemónico de Nenúfar blanco? Descríbelo con tus palabras.","t1":["flotantes","europea","redondas","flor","loto"],"q2":"¿Cuál es el rasgo más diagnóstico de Nenúfar blanco? Incluye al menos un término clave.","t2":["flotantes","reniformes","redondas","hendidura","grandes"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-037","cat":"Botánica","sub":"Herbácea","name":"Lirio amarillo de agua","sci":"Iris pseudacorus","fam":"Iridaceae","freq":"alta","key":"Flores grandes amarillas con 3 sépalos caídos moteados de marrón y 3 pétalos erectos","mnem":"El 'lirio amarillo del pantano con hojas en espada': las flores amarillas con moteado marrón + las hojas en abanico (todas en el mismo plano) son los rasgos diagnósticos del lirio más acuático","etym":"Iris (gr.) = diosa del arco iris (variedad de colores) · pseudacorus = 'pseudo-ácoro' (parecido al Acorus)","notes":"La flor de 6 tépalos diferenciados (3 caídos + 3 erectos) es el diseño típico de Iridaceae. Las hojas equitantes (todas en un plano) son diagnósticas de todo el género Iris.","hab":"Orillas de ríos, arroyos, humedales, zanjas; suelos encharcados","q1":"Explica el mnemónico de Lirio amarillo de agua y qué rasgos te ayuda a recordar.","t1":["amarillo","pantano","amarillas","diagnósticos","lirio"],"q2":"Describe el carácter principal que identifica a Lirio amarillo de agua a primera vista.","t2":["amarillas","grandes","flores","sépalos","moteados"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-038","cat":"Botánica","sub":"Herbácea","name":"Aguileña / Pajarilla","sci":"Aquilegia vulgaris","fam":"Ranunculaceae","freq":"media","key":"5 pétalos con espolón hueco curvado hacia atrás — absolutamente diagnóstico del género","mnem":"La 'flor de las 5 garras curvas': los 5 espolones curvados hacia atrás como garras de águila son absolutamente únicos — ninguna otra planta tiene esa forma","etym":"Aquilegia (lat.) = aquila (águila): los espolones curvados recuerdan las garras del águila","notes":"Los espolones curvados son diagnósticos absolutos del género. La coevolución con abejorros de trompa larga para acceder al néctar es evaluable. Ranunculaceae = muchos estambres + pétalos libres.","hab":"Bosques de montaña húmedos, prados con sombra; 600-2000 m","q1":"¿Cómo usarías el mnemónico de Aguileña / Pajarilla para no olvidarlo en el examen?","t1":["absolutamente","espolones","curvados","garras","curvas"],"q2":"¿Qué rasgo de Aguileña / Pajarilla es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["absolutamente","diagnóstico","pétalos","espolón","curvado"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-039","cat":"Botánica","sub":"Herbácea","name":"Hipérico / Corazoncillo","sci":"Hypericum perforatum","fam":"Hypericaceae","freq":"alta","key":"Hojas con puntos translúcidos (glándulas oleosas) visibles al trasluz — diagnóstico de especie","mnem":"La 'flor amarilla con agujeros de luz': pon la hoja al trasluz y verás los puntitos translúcidos — la única herbácea perenne con ese patrón de 'perforación' de la hoja","etym":"Hypericum (gr.) = hyper (sobre) + eikon (imagen): colgado sobre imágenes religiosas para ahuyentar el demonio · perforatum = 'perforado' — las glándulas translúcidas","notes":"Los puntos translúcidos al trasluz son diagnósticos absolutos de H. perforatum. El tallo bicostado (2 costillas) también es diagnóstico. Importante por su uso como antidepresivo (hipericina).","hab":"Bordes de bosque, prados secos, bordes de camino","q1":"¿Qué imagen mental evoca el mnemónico de Hipérico / Corazoncillo? Descríbelo con tus palabras.","t1":["translúcidos","amarilla","agujeros","trasluz","puntitos"],"q2":"¿Cuál es el rasgo más diagnóstico de Hipérico / Corazoncillo? Incluye al menos un término clave.","t2":["translúcidos","diagnóstico","visibles","puntos","hojas"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-040","cat":"Botánica","sub":"Herbácea","name":"Malva común","sci":"Malva sylvestris","fam":"Malvaceae","freq":"media","key":"Flores rosas a púrpuras con 5 pétalos y venas más oscuras muy llamativas","mnem":"La 'flor con venas oscuras en rayos + quesito de fruto': las venas más oscuras en las flores rosa + el fruto en rueda de gajos son inconfundibles. El tubo de estambres fusionados es la firma de Malvaceae","etym":"Malva (lat.) = nombre latino de la planta (del gr. malakhe = blando, suave) · sylvestris = 'silvestre'","notes":"El tubo estaminal (columna de estambres fusionados) es el carácter diagnóstico de toda la familia Malvaceae (el mismo que en el malvavisco, el hibisco y el algodón). El fruto en 'quesito' es muy llamativo.","hab":"Bordes de camino, suelos removidos; nitrófila","q1":"Explica el mnemónico de Malva común y qué rasgos te ayuda a recordar.","t1":["inconfundibles","oscuras","quesito","venas","flor"],"q2":"Describe el carácter principal que identifica a Malva común a primera vista.","t2":["púrpuras","llamativas","flores","pétalos","rosas"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-041","cat":"Botánica","sub":"Arbusto","name":"Salvia común","sci":"Salvia officinalis","fam":"Lamiaceae","freq":"media","key":"Hojas oblongas, rugosas-bulladas, gris-verdosas con abundante pelillo glandular","mnem":"La 'flor azul con hojas de terciopelo gris aromático': las hojas arrugadas y grisáceas con aroma medicinal intenso son inconfundibles — el olor a salvia es conocido por cualquiera","etym":"Salvia (lat.) = salvare (salvar, curar): 'la que salva' · officinalis = 'medicinal'","notes":"Lamiaceae: tallo cuadrangular + hojas opuestas + flor bilabiada. El aroma al frotar es la clave de campo más rápida. Diferencia de romero (hojas aciculares) y tomillo (hojas muy pequeñas).","hab":"Cultivada; en la naturaleza: bordes de camino, matorral","q1":"¿Cómo usarías el mnemónico de Salvia común para no olvidarlo en el examen?","t1":["terciopelo","inconfundibles","aromático","arrugadas","grisáceas"],"q2":"¿Qué rasgo de Salvia común es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["oblongas","bulladas","rugosas","abundante","verdosas"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-042","cat":"Botánica","sub":"Herbácea","name":"Té de montaña / Sideritis","sci":"Sideritis hyssopifolia","fam":"Lamiaceae","freq":"alta","key":"Brácteas de la inflorescencia amarillas y muy llamativas (más visibles que las flores)","mnem":"El 'té de montaña con brácteas amarillas': las brácteas amarillas que rodean los verticilos florales son más llamativas que las flores mismas — la planta del té de montaña ibérico","etym":"Sideritis (gr.) = sideros (hierro): usada para curar heridas de armas de hierro · hyssopifolia = 'de hojas de hisopo'","notes":"Las brácteas amarillas llamativas son diagnósticas del género. Endemismo ibérico de alta montaña. El té de Sideritis es el más consumido en el centro de España (té de puerto). Muy representativa del piso subalpino del Sistema Central.","hab":"Prados y roquedos subalpinos y alpinos; 1200-2600 m","q1":"¿Qué imagen mental evoca el mnemónico de Té de montaña / Sideritis? Descríbelo con tus palabras.","t1":["amarillas","brácteas","montaña","verticilos","llamativas"],"q2":"¿Cuál es el rasgo más diagnóstico de Té de montaña / Sideritis? Incluye al menos un término clave.","t2":["inflorescencia","llamativas","brácteas","amarillas"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-043","cat":"Botánica","sub":"Herbácea","name":"Festuca / Cañuela","sci":"Festuca ovina","fam":"Gramineae (Poaceae)","freq":"media","key":"Matas densas de hojas muy finas y rígidas (filiformes setáceas), casi como alfileres","mnem":"La 'gramínea de las agujas verdes': las hojas finísimas y rígidas forman una mata como un erizo verde — si el pasto de montaña parece hecho de agujas, es festuca","etym":"Festuca (lat.) = 'brizna, paja' · ovina (lat.) = 'de las ovejas': la gramínea del pasto ovino de montaña","notes":"Las hojas setáceas (en forma de cerdas) son diagnósticas de F. ovina. Forma los pastizales climácicos de alta montaña del Sistema Central (majadales). La familia Gramineae se reconoce por la espiguilla.","hab":"Pastizales de alta montaña, prados subalpinos y alpinos; acidófila","q1":"Explica el mnemónico de Festuca / Cañuela y qué rasgos te ayuda a recordar.","t1":["gramínea","finísimas","agujas","verdes","rígidas"],"q2":"Describe el carácter principal que identifica a Festuca / Cañuela a primera vista.","t2":["alfileres","densas","matas","rígidas","hojas"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-044","cat":"Botánica","sub":"Herbácea","name":"Ray-grass inglés","sci":"Lolium perenne","fam":"Gramineae (Poaceae)","freq":"media","key":"Espiga solitaria (un solo eje principal sin ramificaciones) con espiguillas alternas en el raquis","mnem":"La 'gramínea del campo de fútbol': la espiga simple con espiguillas alternadas perfectamente en un eje + el brillo de las hojas son los rasgos del césped de jardín y estadio","etym":"Lolium (lat.) = 'ballico, cizaña' · perenne = 'perenne'","notes":"Lolium tiene la espiga más sencilla entre las gramíneas (solo un eje). Las aurículas en la base de la hoja son diagnósticas. La más usada en céspedes deportivos. La cizaña (L. temulentum) es su pariente tóxica.","hab":"Prados, céspedes, bordes de camino; cultivado","q1":"¿Cómo usarías el mnemónico de Ray-grass inglés para no olvidarlo en el examen?","t1":["perfectamente","espiguillas","gramínea","alternadas","fútbol"],"q2":"¿Qué rasgo de Ray-grass inglés es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["espiguillas","solitaria","alternas","espiga","raquis"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-045","cat":"Botánica","sub":"Herbácea","name":"Aegilops / Egilope","sci":"Aegilops geniculata","fam":"Gramineae (Poaceae)","freq":"media","key":"Espiga compacta con espiguillas anchas y abultadas; aristas muy largas saliendo en todas direcciones","mnem":"La 'mini-espiga erizo con aristas en todas direcciones': la espiga pequeña y abultada con aristas largas saliendo en abanico es inconfundible entre las gramíneas mediterráneas","etym":"Aegilops (gr.) = 'cabra del monte': por la dureza y forma de espinas de la espiga · geniculata = 'con nudos'","notes":"Aegilops es uno de los géneros ancestrales del trigo. Las aristas divergentes + la espiga compacta son diagnósticas. Muy frecuente en terrenos secos de Madrid. Su estudio es clave en genética de cereales.","hab":"Bordes de camino, barbechos, suelos secos y pedregosos; calcícola","q1":"¿Qué imagen mental evoca el mnemónico de Aegilops / Egilope? Descríbelo con tus palabras.","t1":["direcciones","inconfundible","mediterráneas","espiga","aristas"],"q2":"¿Cuál es el rasgo más diagnóstico de Aegilops / Egilope? Incluye al menos un término clave.","t2":["espiguillas","compacta","abultadas","direcciones","espiga"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-046","cat":"Botánica","sub":"Pteridófito","name":"Helecho macho","sci":"Dryopteris filix-mas","fam":"Dryopteridaceae","freq":"alta","key":"Fronde 1-2 veces pinnada con pínnulas con diente apical; en corona desde el rizoma","mnem":"El 'helecho rey de los bosques umbríos': el más grande y elegante de los helechos de sotobosque, con frondas en corona y los soros con tapaderas en forma de riñón","etym":"Dryopteris (gr.) = drys (roble) + pteris (helecho): 'helecho de los robles' · filix-mas = 'helecho macho'","notes":"El indusio riñoniforme es diagnóstico de Dryopteris. El helecho macho es el más frecuente en bosques húmedos del Sistema Central. Diferencia de Pteridium (helecho común): Dryopteris = soros redondeados con indusio; Pteridium = soros lineales marginales.","hab":"Bosques húmedos umbríos, hayedos, robledales; suelos ácidos ricos","q1":"Explica el mnemónico de Helecho macho y qué rasgos te ayuda a recordar.","t1":["helecho","sotobosque","bosques","umbríos","elegante"],"q2":"Describe el carácter principal que identifica a Helecho macho a primera vista.","t2":["pínnulas","fronde","pinnada","veces","diente"],"catf":"botánica","subf":"pteridófito"},{"id":"AMP-047","cat":"Botánica","sub":"Pteridófito","name":"Polipodio / Regaliz de palo","sci":"Polypodium vulgare","fam":"Polypodiaceae","freq":"alta","key":"Fronde 1 vez pinnada con segmentos oblongos enteros (no subdividida más) — aspecto 'peine'","mnem":"El 'helecho peine sobre las rocas': fronde en peine (1-pinnado) sobre rocas o troncos, con soros redondos sin tapa visible — el helecho 'desnudo' más común de las rocas del bosque","etym":"Polypodium (gr.) = polys (muchos) + pous (pie): 'el de muchos pies' — por los rizomas ramificados · vulgare = 'común'","notes":"Los soros desnudos (sin indusio) en doble fila son diagnósticos de la familia Polypodiaceae. El rizoma superficial horizontal con olor dulzón (glicirrizina = como el regaliz) es único.","hab":"Sobre rocas, muros, base de árboles; bosques húmedos","q1":"¿Cómo usarías el mnemónico de Polipodio / Regaliz de palo para no olvidarlo en el examen?","t1":["helecho","peine","fronde","rocas","troncos"],"q2":"¿Qué rasgo de Polipodio / Regaliz de palo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["segmentos","pinnada","oblongos","fronde","enteros"],"catf":"botánica","subf":"pteridófito"},{"id":"AMP-048","cat":"Botánica","sub":"Pteridófito","name":"Helecho real / Osmunda","sci":"Osmunda regalis","fam":"Osmundaceae","freq":"media","key":"El mayor helecho ibérico (hasta 2 m); fronde 2 veces pinnada con pínnulas grandes","mnem":"El 'helecho con corona de esporas marrones': la parte superior de la fronde se convierte en un penacho pardo de esporangios — como si el helecho llevara una corona de polvo marrón","etym":"Osmunda (escandinavo) = Osmunder, nombre del dios Thor · regalis (lat.) = 'real, regio'","notes":"La fronde dimórfica (parte fotosintética + parte esporángica parda) es absolutamente diagnóstica y única entre los helechos comunes. El mayor helecho ibérico. Protegido en algunas comunidades.","hab":"Orillas de ríos y arroyos, turberas; suelos ácidos permanentemente húmedos","q1":"¿Qué imagen mental evoca el mnemónico de Helecho real / Osmunda? Descríbelo con tus palabras.","t1":["helecho","marrones","esporas","esporangios","corona"],"q2":"¿Cuál es el rasgo más diagnóstico de Helecho real / Osmunda? Incluye al menos un término clave.","t2":["helecho","ibérico","mayor","pínnulas","fronde"],"catf":"botánica","subf":"pteridófito"},{"id":"AMP-049","cat":"Botánica","sub":"Pteridófito","name":"Selaginela","sci":"Selaginella selaginoides","fam":"Selaginellaceae","freq":"media","key":"Aspecto de musgo pero con dos tipos de microfilos (hojas) en rangos: grandes laterales + pequeñas dorsales","mnem":"El 'musgo con dos tipos de hojas': parece un musgo pero sus hojas tienen dos tamaños en la misma planta (grandes + pequeñas) y tiene estructura vascular — más complejo que el musgo","etym":"Selaginella (lat.) = diminutivo de Selago (nombre antiguo de una planta similar) · selaginoides = 'parecida a Selago'","notes":"La heterosporia (dos tipos de esporas: microspora + megaspora) de Selaginella es un hito evolutivo clave — anticipa la semilla. Diferencia esencial de musgos (briófitos) vs. licófitos: Selaginella tiene vasos conductores.","hab":"Lugares húmedos y umbríos de montaña; suelos turbosos","q1":"Explica el mnemónico de Selaginela y qué rasgos te ayuda a recordar.","t1":["estructura","musgo","tipos","parece","hojas"],"q2":"Describe el carácter principal que identifica a Selaginela a primera vista.","t2":["microfilos","aspecto","laterales","musgo","grandes"],"catf":"botánica","subf":"pteridófito"},{"id":"AMP-050","cat":"Botánica","sub":"Alga","name":"Ericaria / Cystoseira (alga parda mediterránea)","sci":"Ericaria amentacea (sin.: Cystoseira stricta, C. amentacea var. stricta)","fam":"Sargassaceae","freq":"media","key":"Talo pardo ramificado densamente con ramitas muy finas y vesículas esféricas diminutas","mnem":"El 'arbusto marino mediterráneo': forma pequeños bosques pardos en el mediterráneo limpio — si hay Ericaria, el agua es de gran calidad","etym":"Ericaria (lat.) = del género Erica (brezo): por el aspecto ramificado similar al brezo · amentacea = 'con amentos, en forma de cadena'","notes":"Nombre actualizado: Ericaria amentacea (nombre válido actual). Sinónimos ampliamente usados en la literatura: Cystoseira stricta y Cystoseira amentacea var. stricta — es importante conocer los tres nombres pues los exámenes pueden usar cualquiera. Bioindicadora de aguas muy limpias en el Mediterráneo; su desaparición indica contaminación. Diferencia de Fucus: Ericaria/Cystoseira es mediterránea; Fucus es atlántica.","hab":"Fondos rocosos mediterráneos intermareales e infralitorales; aguas muy limpias","q1":"¿Cómo usarías el mnemónico de Ericaria / Cystoseira (alga parda mediterránea) para no olvidarlo en el examen?","t1":["mediterráneo","arbusto","pequeños","marino","bosques"],"q2":"¿Qué rasgo de Ericaria / Cystoseira (alga parda mediterránea) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["ramificado","densamente","vesículas","esféricas","ramitas"],"catf":"botánica","subf":"alga"},{"id":"AMP-051","cat":"Botánica","sub":"Alga","name":"Codium / Esponja verde","sci":"Codium tomentosum","fam":"Codiaceae","freq":"media","key":"Talo verde oscuro cilíndrico dicotómico (se divide en dos en cada bifurcación) muy regular","mnem":"El 'dedo verde oscuro del mar': cilíndrico, dicotómico y con textura de terciopelo verde oscuro — como un dedo esponjoso verde que se divide en dos en cada nudo","etym":"Codium (gr.) = kodion (piel de borrego): por la textura aterciopelada · tomentosum = 'con pelillos suaves'","notes":"La textura esponjosa-aterciopelada + la ramificación dicotómica cilíndrica son diagnósticas. Alga sifonal (el talo no tiene células individuales, es un sincitio multinucleado).","hab":"Zona intermareal e infralitoral rocosa; atlántica y mediterránea","q1":"¿Qué imagen mental evoca el mnemónico de Codium / Esponja verde? Descríbelo con tus palabras.","t1":["cilíndrico","dicotómico","terciopelo","oscuro","verde"],"q2":"¿Cuál es el rasgo más diagnóstico de Codium / Esponja verde? Incluye al menos un término clave.","t2":["cilíndrico","dicotómico","oscuro","verde","regular"],"catf":"botánica","subf":"alga"},{"id":"AMP-052","cat":"Botánica","sub":"Alga / Fanerógama marina","name":"Zostera / Hierba marina","sci":"Zostera marina","fam":"Zosteraceae","freq":"media","key":"Hojas muy largas y estrechas (acintadas, hasta 1 m) de color verde brillante, en cintas","mnem":"La 'hierba marina del Atlántico': como Posidonia pero en el Atlántico, con hojas mucho más estrechas y largas — la 'anguila vegetal' del Atlántico","etym":"Zostera (gr.) = zoster (cinturón, faja): 'la que lleva cinturones' — por las hojas acintadas","notes":"Zostera (Atlántico) vs. Posidonia (Mediterráneo) es un par de estudio importante. Ambas son angiospermas marinas (no algas) — con flores y frutos verdaderos. Zostera poliniza bajo el agua (hidrofilia).","hab":"Fondos arenosos y fangosos intermareales; costas atlánticas limpias","q1":"Explica el mnemónico de Zostera / Hierba marina y qué rasgos te ayuda a recordar.","t1":["atlántico","posidonia","hierba","marina","estrechas"],"q2":"Describe el carácter principal que identifica a Zostera / Hierba marina a primera vista.","t2":["estrechas","brillante","largas","hojas","color"],"catf":"botánica","subf":"alga"},{"id":"AMP-085","cat":"Botánica","sub":"Alga","name":"Codium bursa (bola de alga)","sci":"Codium bursa","fam":"Codiaceae","freq":"alta","key":"Forma perfectamente esférica o globosa (2-20 cm), verde oscura y de tacto esponjoso-aterciopelado — absolutamente unica entre algas ibericas","mnem":"La 'bola de billar marina verde oscura': ninguna otra alga ibérica tiene forma globular perfecta. Verde oscuro + esférica + esponjosa al tacto = Codium bursa sin ninguna duda","etym":"Codium (gr.) = kodion (piel de borrego): por la textura aterciopelada · bursa (lat.) = 'bolsa, monedero': por la forma globosa","notes":"Ha aparecido en convocatorias recientes. La forma esférica es diagnóstica absoluta — no hay otra alga ibérica con esa morfología. Alga sifonal: el talo no tiene células individuales separadas, es un sincitio multinucleado.","hab":"Fondos rocosos infralitorales mediterraneos y atlanticos; 2-30 m; aguas limpias","bio":"Piso infralitoral (0-30 m); fondos rocosos mediterraneos y atlanticos","q1":"¿Cómo usarías el mnemónico de Codium bursa (bola de alga) para no olvidarlo en el examen?","t1":["billar","marina","ninguna","bola","oscura"],"q2":"¿Qué rasgo de Codium bursa (bola de alga) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["perfectamente","aterciopelado","absolutamente","esférica","globosa"],"catf":"botánica","subf":"alga"},{"id":"AMP-086","cat":"Botánica","sub":"Alga","name":"Fucus espiral","sci":"Fucus spiralis","fam":"Fucaceae","freq":"alta","key":"Talo plano y dicotomico SIN vesiculas aerifereas (aerocistes) — diferencia clave de F. vesiculosus que SI tiene vesiculas; margenes ligeramente enrollados; receptaculos apicales ovoides","mnem":"El 'fucus sin globitos': idéntico al Fucus vesiculosus pero sin las vesículas llenas de gas. Si la lámina parda es plana sin 'bollitos' ni burbujas, es F. spiralis — el de zona más alta","etym":"Fucus (lat.) = nombre romano del fucus · spiralis (lat.) = 'en espiral': por los márgenes ligeramente enrollados de los receptáculos","notes":"Par de estudio fundamental: F. vesiculosus (CON aerocistes/vesículas flotadoras) vs F. spiralis (SIN vesículas). Los aerocistes son vesículas llenas de gas que dan flotabilidad — si las ves, es vesiculosus; si no las ves, es spiralis. F. spiralis ocupa zona más alta del intermareal (mayor tolerancia a la desecación).","hab":"Zona intermareal alta rocosa; mas expuesta a desecacion que F. vesiculosus; costas atlanticas","bio":"Zona intermareal alta (MHWS a MLWS); por encima de F. vesiculosus en la zonacion litoral","q1":"¿Qué imagen mental evoca el mnemónico de Fucus espiral? Descríbelo con tus palabras.","t1":["vesiculosus","globitos","idéntico","vesículas","fucus"],"q2":"¿Cuál es el rasgo más diagnóstico de Fucus espiral? Incluye al menos un término clave.","t2":["dicotomico","aerifereas","vesiculas","diferencia","vesiculosus"],"catf":"botánica","subf":"alga"},{"id":"AMP-087","cat":"Botánica","sub":"Alga","name":"Dictyota dichotoma","sci":"Dictyota dichotoma","fam":"Dictyotaceae","freq":"alta","key":"Ramificacion dicotomica perfectamente regular (bifurcacion en Y constante cada 1-2 cm); talo aplanado de 1-2 mm de anchura; color verde-parduzco o azulado iridiscente bajo el agua","mnem":"El 'alga de las bifurcaciones perfectas en Y': cada vez que crece se divide en exactamente dos ramas iguales. El patrón de Y repetido a intervalos regulares es inconfundible — una obra de geometría fractal marina","etym":"Dictyota (gr.) = diktyon (red): por el aspecto reticulado del talo · dichotoma (gr.) = dicha (en dos) + temnein (cortar): 'dividida en dos' — por la ramificación dicotómica","notes":"La ramificación dicotómica estrictamente regular es el carácter diagnóstico absoluto. Diferencia de Padina (abanico con bandas concéntricas) y de Dilophus (talo más ancho). La iridiscencia azulada bajo el agua se debe a la difracción de la luz en la cutícula.","hab":"Fondos rocosos infralitorales mediterraneos y atlanticos; zonas bien iluminadas; 0-30 m","bio":"Piso intermareal inferior e infralitoral (0-20 m); costas mediterraneas y atlanticas","q1":"Explica el mnemónico de Dictyota dichotoma y qué rasgos te ayuda a recordar.","t1":["bifurcaciones","exactamente","perfectas","inconfundible","intervalos"],"q2":"Describe el carácter principal que identifica a Dictyota dichotoma a primera vista.","t2":["ramificacion","perfectamente","dicotomica","regular","aplanado"],"catf":"botánica","subf":"alga"},{"id":"AMP-088","cat":"Botánica","sub":"Alga","name":"Padina pavonica (cola de pavo real)","sci":"Padina pavonica","fam":"Dictyotaceae","freq":"muy_alta","key":"Forma de abanico o embudo con bandas concentricas visibles (lineas curvas paralelas al margen) — absolutamente diagnostico; color beige-blanquecino por calcificacion parcial de la superficie","mnem":"La 'alga-abanico con rayas de campo de tiro': la forma de abanico con bandas concéntricas es única en el mundo algal ibérico — como un abanico japonés con líneas dibujadas. El blanquecino se debe a calcificación","etym":"Padina (origen incierto) · pavonica (lat.) = 'de pavo real': por las bandas concéntricas iridiscentes que recuerdan el plumaje del pavo real en celo","notes":"La morfología en abanico con bandas concéntricas es absolutamente inconfundible — la única alga ibérica con esa forma. La calcificación parcial la hace más rígida y blanquecina que otras algas pardas. Muy frecuente en el Mediterráneo ibérico en fondos rocosos someros e iluminados.","hab":"Fondos rocosos infralitorales mediterraneos bien iluminados; pozas intermareales; 0-15 m","bio":"Piso intermareal inferior e infralitoral (0-15 m); costas mediterraneas soleadas","q1":"¿Cómo usarías el mnemónico de Padina pavonica (cola de pavo real) para no olvidarlo en el examen?","t1":["concéntricas","calcificación","abanico","blanquecino","alga"],"q2":"¿Qué rasgo de Padina pavonica (cola de pavo real) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["concentricas","absolutamente","diagnostico","calcificacion","abanico"],"catf":"botánica","subf":"alga"},{"id":"AMP-089","cat":"Botánica","sub":"Alga","name":"Lithophyllum incrustans (alga calcarea costrosa)","sci":"Lithophyllum incrustans","fam":"Corallinaceae","freq":"alta","key":"Forma de costra dura e incrustante sobre la roca — no tiene estructura tridimensional libre; color rosa-violaceo a gris-blanquecino; superficie lisa; durisima al tacto (calcificada)","mnem":"La 'capa de pintura rosa-violácea sobre la roca': las costras rosas o malvas que cubren las rocas intermareales como una pintura sólida son Lithophyllum. Durísimo al tacto — es calcita biológica pegada a la roca","etym":"Litho (gr.) = lithos (piedra) + phyllon (gr.) = hoja: 'hoja de piedra' · incrustans (lat.) = 'que forma costras, incrustante'","notes":"Importante distinguir de: (1) líquenes epilíticos (en litoral terrestre, zona supralitoral seca; más amarillos/grises/negros), (2) restos minerales (sin el color rosa-violáceo vivo). Lithophyllum es un alga roja calcificada (Corallinaceae) que vive en la zona intermareal media-baja. Su presencia indica aguas limpias y de buena calidad.","hab":"Rocas intermareales y sublitorales; costas mediterraneas y atlanticas limpias; zona media e infralitoral","bio":"Piso intermareal medio e infralitoral (0-20 m); superficies rocosas de costas limpias","q1":"¿Qué imagen mental evoca el mnemónico de Lithophyllum incrustans (alga calcarea costrosa)? Descríbelo con tus palabras.","t1":["intermareales","pintura","violácea","lithophyllum","costras"],"q2":"¿Cuál es el rasgo más diagnóstico de Lithophyllum incrustans (alga calcarea costrosa)? Incluye al menos un término clave.","t2":["tridimensional","incrustante","estructura","costra","forma"],"catf":"botánica","subf":"alga"},{"id":"AMP-090","cat":"Botánica","sub":"Alga","name":"Gelidium sesquipedale (agar-agar)","sci":"Gelidium sesquipedale","fam":"Gelidiaceae","freq":"muy_alta","key":"Talo erectamente ramificado con ramificacion pinnada regular (ramas laterales simetricas a ambos lados del eje); color rojo-vinoso oscuro; cilindrico a algo comprimido","mnem":"El 'alga del agar-agar rojo-vinosa con plumas simétricas': el eje principal con ramitas laterales simétricas como plumas + el color rojo oscuro son diagnósticos. La fuente del gel de los laboratorios de microbiología","etym":"Gelidium (gr.) = gelidus (frío, gelado): por la gelatina (agar) que produce · sesquipedale (lat.) = 'de pie y medio de largo': por su tamaño relativamente grande","notes":"MUY IMPORTANTE: Gelidium sesquipedale es la fuente principal del agar-agar (polisacárido E-406), usado en microbiología (medio de cultivo de bacterias), alimentación (gelificante vegetal) y farmacia. Es el alga roja más explotada comercialmente en la Península ibérica. La ramificación pinnada simétrica es el carácter diagnóstico más fácil de recordar.","hab":"Zona infralitoral rocosa atlantica; corrientes limpias y frias; 0-25 m","bio":"Piso infralitoral (0-25 m); costas atlanticas rocosas con corrientes limpias y frias","q1":"Explica el mnemónico de Gelidium sesquipedale (agar-agar) y qué rasgos te ayuda a recordar.","t1":["simétricas","microbiología","diagnósticos","laboratorios","principal"],"q2":"Describe el carácter principal que identifica a Gelidium sesquipedale (agar-agar) a primera vista.","t2":["erectamente","ramificacion","ramificado","pinnada","cilindrico"],"catf":"botánica","subf":"alga"},{"id":"AMP-091","cat":"Botánica","sub":"Alga","name":"Ceramium rubrum (alga filamentosa roja)","sci":"Ceramium rubrum","fam":"Ceramiaceae","freq":"alta","key":"Aspecto filamentoso muy ramificado; color rojizo o rojo-pardo vivo; apices de las ramas con forcipula caracteristica (puntas curvadas hacia adentro como pinzas) — diagnostico de genero","mnem":"El 'alga de los filamentos rojos con pinzas en las puntas': los filamentos rojizos muy ramificados terminan en ápices curvados hacia adentro como pinzas. Eso es diagnóstico de Ceramium entre todos los filamentos rojos ibéricos","etym":"Ceramium (gr.) = keramos (cerámica, alfarería): por los anillos de células corticales que dan aspecto de cerámica en sección · rubrum (lat.) = 'rojo': por el color","notes":"Los ápices forcipados (curvados hacia dentro como pinzas) son el carácter diagnóstico de género Ceramium — visible con lupa de campo. El color rojizo vivo + textura muy ramificada filamentosa son los rasgos macroscópicos. Muy frecuente como epífita sobre algas pardas grandes (fucáceas, laminariáceas).","hab":"Zona intermareal e infralitoral; epifita sobre otras algas y sustratos rocosos; costas atlanticas y mediterraneas","bio":"Piso intermareal e infralitoral (0-20 m); epifita y saxicola; costas limpias","q1":"¿Cómo usarías el mnemónico de Ceramium rubrum (alga filamentosa roja) para no olvidarlo en el examen?","t1":["filamentos","ramificados","diagnóstico","pinzas","alga"],"q2":"¿Qué rasgo de Ceramium rubrum (alga filamentosa roja) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["filamentoso","ramificado","caracteristica","aspecto","diagnostico"],"catf":"botánica","subf":"alga"},{"id":"AMP-053","cat":"Botánica","sub":"Briófito","name":"Fontinalis / Musgo acuático","sci":"Fontinalis antipyretica","fam":"Fontinalaceae","freq":"media","key":"Tallos muy largos (hasta 1 m) flotantes o adheridos a piedras bajo el agua","mnem":"La 'melena verde bajo el río': largos tallos que ondean en la corriente adheridos a las piedras — el único musgo que vive completamente sumergido en el agua más limpia","etym":"Fontinalis (lat.) = fons (fuente, manantial): 'el de las fuentes' · antipyretica = 'contra el fuego': se usaba para rellenar entre las paredes como aislante","notes":"El único musgo ibérico completamente acuático. Las hojas en 3 filas plegadas son diagnósticas. Bioindicador de agua muy limpia y fría — donde está Fontinalis, el río es de categoría A.","hab":"Ríos y arroyos de agua fría y limpia, pegado a piedras","q1":"¿Qué imagen mental evoca el mnemónico de Fontinalis / Musgo acuático? Descríbelo con tus palabras.","t1":["completamente","melena","corriente","adheridos","verde"],"q2":"¿Cuál es el rasgo más diagnóstico de Fontinalis / Musgo acuático? Incluye al menos un término clave.","t2":["flotantes","adheridos","tallos","largos","piedras"],"catf":"botánica","subf":"briófito"},{"id":"AMP-054","cat":"Botánica","sub":"Arbusto","name":"Cantueso","sci":"Lavandula stoechas","fam":"Lamiaceae","freq":"muy_alta","key":"Brácteas apicales grandes, erectas y de color púrpura vivo en el ápice de la espiga — absolutamente diagnósticas (parecen 'orejas' encima de la espiga compacta)","mnem":"La 'lavanda con orejas moradas': las brácteas púrpura que coronan la espiga como orejas de conejo son absolutamente únicas — ninguna otra lavanda las tiene tan grandes y llamativas","etym":"Lavandula (lat.) = lavare (lavar): usada para perfumar la ropa lavada · stoechas = de las Islas Stoechades (Islas de Hyères, Francia, donde fue descrita)","notes":"El cantueso es la Lavandula más frecuente en el matorral silíceo de Madrid y la más fácil de identificar por sus brácteas apicales moradas. Par obligatorio con L. angustifolia (espliego): cantueso = brácteas apicales grandes y vistosas; espliego = sin brácteas apicales llamativas. Indicadora de suelos silíceos ácidos.","hab":"Matorral silíceo mediterráneo; suelos ácidos y arenosos; jara-cantueso","q1":"Explica el mnemónico de Cantueso y qué rasgos te ayuda a recordar.","t1":["absolutamente","lavanda","brácteas","moradas","orejas"],"q2":"Describe el carácter principal que identifica a Cantueso a primera vista.","t2":["absolutamente","brácteas","apicales","diagnósticas","grandes"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-055","cat":"Botánica","sub":"Arbusto","name":"Espliego / Lavanda","sci":"Lavandula angustifolia","fam":"Lamiaceae","freq":"alta","key":"Espiga floral alargada e interrumpida (con espacio entre flores inferiores y superiores); sin brácteas apicales llamativas","mnem":"La 'lavanda sin orejas con espiga interrumpida': la espiga tiene un 'cuello' visible que interrumpe las flores, y sin las brácteas vistosas del cantueso — más elegante y menos llamativa","etym":"Lavandula (lat.) = lavare (lavar) · angustifolia (lat.) = angustus (estrecho) + folium (hoja): 'de hojas estrechas'","notes":"Par de estudio imprescindible con L. stoechas (cantueso). La diferencia clave: espliego = espiga interrumpida + sin brácteas apicales vistosas; cantueso = espiga compacta + brácteas moradas apicales grandes. El espliego prefiere suelos calizos (calcícola), el cantueso suelos silíceos (silicícola) — dato evaluable.","hab":"Matorrales calcícolas; suelos básicos bien drenados de montaña media","q1":"¿Cómo usarías el mnemónico de Espliego / Lavanda para no olvidarlo en el examen?","t1":["interrumpida","lavanda","interrumpe","orejas","espiga"],"q2":"¿Qué rasgo de Espliego / Lavanda es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["interrumpida","alargada","llamativas","espiga","brácteas"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-056","cat":"Botánica","sub":"Arbusto","name":"Orégano","sci":"Origanum vulgare","fam":"Lamiaceae","freq":"alta","key":"Brácteas purpúreas o rojizas que envuelven los glomérulos florales — color llamativo incluso sin flores; aroma inequívoco a orégano al frotar","mnem":"El 'arbusto que huele a pizza': el aroma al frotar es absolutamente inconfundible — el mismo de la pizza y los platos mediterráneos. Las brácteas rojas-purpúreas dan color incluso sin flores abiertas","etym":"Origanum (gr.) = oros (montaña) + ganos (alegría, esplendor): 'alegría de la montaña' · vulgare (lat.) = 'común'","notes":"El orégano es una de las Lamiaceae aromáticas más fáciles de identificar por el olfato. Las brácteas coloreadas (purpúreas o rojizas) que rodean los glomérulos florales son el rasgo visual más diagnóstico. Muy frecuente en bordes de bosque y claros de matorral en toda la sierra de Madrid.","hab":"Bordes de bosque, claros de matorral, bordes de camino; suelos variados","q1":"¿Qué imagen mental evoca el mnemónico de Orégano? Descríbelo con tus palabras.","t1":["absolutamente","inconfundible","mediterráneos","arbusto","huele"],"q2":"¿Cuál es el rasgo más diagnóstico de Orégano? Incluye al menos un término clave.","t2":["purpúreas","brácteas","glomérulos","envuelven","rojizas"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-057","cat":"Botánica","sub":"Arbusto","name":"Ajedrea de montaña","sci":"Satureja montana","fam":"Lamiaceae","freq":"media","key":"Hojas lineares a lanceoladas, puntiagudas y coriáceas; flores blancas o rosado-liláceas en verticilos; más rígidas y punzantes que el tomillo","mnem":"La 'prima picante del tomillo': hojas más duras y puntiagudas que el tomillo, aroma más picante e intenso — si la aromática de matorral pinchan un poco las hojas y huele a pimienta, es ajedrea","etym":"Satureja (lat.) = nombre latino de la ajedrea · montana (lat.) = 'de montaña'","notes":"Par de estudio con el tomillo (Thymus vulgaris): ajedrea = hojas más grandes, puntiagudas y coriáceas, flores blancas o rosadas en verticilos, calcícola; tomillo = hojas diminutas con borde muy enrollado, flores rosas en espigas densas, indiferente. La ajedrea es más frecuente en suelos calizos de la sierra de Madrid.","hab":"Matorrales calcáreos secos; roquedos; suelos básicos bien drenados; 400-1800 m","q1":"Explica el mnemónico de Ajedrea de montaña y qué rasgos te ayuda a recordar.","t1":["puntiagudas","picante","tomillo","prima","aromática"],"q2":"Describe el carácter principal que identifica a Ajedrea de montaña a primera vista.","t2":["lanceoladas","puntiagudas","lineares","coriáceas","verticilos"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-058","cat":"Botánica","sub":"Arbusto","name":"Jara estepa","sci":"Cistus albidus","fam":"Cistaceae","freq":"alta","key":"Hojas cubiertas de tomento blanquecino denso por ambas caras (las más blancas del género); flores rosadas o purpúreas con 5 pétalos arrugados","mnem":"La 'jara blanca con flores rosas': las hojas tan blancas y afieltradas como si estuvieran cubiertas de lana + las flores rosas son el diagnóstico. La única jara con hojas blancas y flores de color","etym":"Cistus (gr.) = 'cesto' (por los frutos capsulares) · albidus (lat.) = 'blanquecino': por el tomento blanco de las hojas","notes":"Par de estudio imprescindible con Cistus ladanifer. C. albidus = hojas blancas-tomentosas + flores rosas/púrpuras; C. ladanifer = hojas verdes pegajosas (ládano) + flores blancas con mancha oscura. Cistaceae: 5 pétalos libres arrugados + numerosos estambres amarillos.","hab":"Matorral mediterráneo en suelos silíceos o algo básicos; claros de encinar","bio":"Piso mesomediterráneo (200-900 m); jarales y matorrales del encinar","q1":"¿Cómo usarías el mnemónico de Jara estepa para no olvidarlo en el examen?","t1":["afieltradas","estuvieran","blanca","flores","cubiertas"],"q2":"¿Qué rasgo de Jara estepa es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["blanquecino","cubiertas","tomento","hojas","purpúreas"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-059","cat":"Botánica","sub":"Arbusto","name":"Lentisco","sci":"Pistacia lentiscus","fam":"Anacardiaceae","freq":"muy_alta","key":"Hoja compuesta paripinnada con raquis ALADO entre los folíolos — diagnóstico único; olor resinoso intenso (almáciga) al frotar","mnem":"El 'arbusto con raquis alado': la hoja compuesta con las alitas entre los folíolos — como si los folíolos estuvieran pegados a un tallo con alas. Ningún otro arbusto ibérico tiene eso","etym":"Pistacia (gr.) = nombre griego del árbol · lentiscus (lat.) = nombre latino del lentisco","notes":"El raquis alado de la hoja compuesta es absolutamente diagnóstico y evaluable directamente. Diferencia de Pistacia terebinthus (cornicabra): terebinthus tiene 1 foliolo terminal (imparipinnada) y pierde las hojas en otoño; lentiscus es paripinnada y perennifolia.","hab":"Maquis, garriga y matorral mediterráneo denso; suelos calizos o silíceos","bio":"Piso termomediterráneo y mesomediterráneo inferior (0-700 m); maquis y coscojar","q1":"¿Qué imagen mental evoca el mnemónico de Lentisco? Descríbelo con tus palabras.","t1":["arbusto","compuesta","estuvieran","raquis","folíolos"],"q2":"¿Cuál es el rasgo más diagnóstico de Lentisco? Incluye al menos un término clave.","t2":["paripinnada","compuesta","diagnóstico","folíolos","raquis"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-060","cat":"Botánica","sub":"Arbusto","name":"Aliaga / Aulaga espinosa","sci":"Genista scorpius","fam":"Fabaceae","freq":"alta","key":"Arbusto muy espinoso con espinas ramificadas (las ramas acaban en espina que se bifurca); flores amarillas papilionáceas pequeñas","mnem":"La 'maraña de espinas ramificadas amarillas': el arbusto más inhóspito del matorral mediterráneo seco — las espinas se ramifican formando una armadura impenetrable que solo el conejo atraviesa","etym":"Genista (lat.) = nombre latino de las retamas espinosas · scorpius (lat.) = 'escorpión': por las ramas espinosas que recuerdan la cola del escorpión","notes":"Muy frecuente en el sureste y zonas bajas de Madrid. Las espinas ramificadas (ramas transformadas en espinas que se bifurcan) distinguen a G. scorpius de Ulex (espinas simples) y de Calicotome (espinas simples terminales). Indicadora de matorrales degradados y tierras de labor abandonadas.","hab":"Matorrales degradados, baldíos, bordes de camino; indiferente al suelo","bio":"Piso mesomediterráneo (200-900 m); matorrales de sustitución del encinar","q1":"Explica el mnemónico de Aliaga / Aulaga espinosa y qué rasgos te ayuda a recordar.","t1":["ramificadas","mediterráneo","amarillas","espinas","inhóspito"],"q2":"Describe el carácter principal que identifica a Aliaga / Aulaga espinosa a primera vista.","t2":["papilionáceas","ramificadas","espinoso","arbusto","amarillas"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-061","cat":"Botánica","sub":"Arbusto","name":"Coscoja","sci":"Quercus coccifera","fam":"Fagaceae","freq":"muy_alta","key":"Hojas coriáceas con dientes espinosos en TODO el margen; verde reluciente por ambas caras — diferencia clave de la encina (envés grisáceo)","mnem":"La 'encina que pincha por todas partes': mientras la encina solo pincha en el ápice de las hojas jóvenes, la coscoja pincha en todo el contorno siempre. Y brilla verde por las dos caras","etym":"Quercus (lat.) = 'roble, encina' · coccifera (lat.) = coccum (cochinilla del kermes) + ferre (llevar): 'la que lleva la cochinilla del kermes' — insecto que vive en ella y produce un tinte rojo","notes":"El diagnóstico diferencial encina (Q. ilex) / coscoja (Q. coccifera) es uno de los más evaluados: coscoja = pincha en todo el margen + brilla verde por ambas caras; encina = pinchos solo en hojas jóvenes + envés grisáceo. Las escamas de la cúpula de la bellota también son diagnósticas (rígidas y patentes en coscoja).","hab":"Matorrales calcáreos y coscojar; sustituye al encinar en suelos pobres degradados","bio":"Piso mesomediterráneo (200-900 m); coscojar calcícola y garriga","q1":"¿Cómo usarías el mnemónico de Coscoja para no olvidarlo en el examen?","t1":["encina","mientras","pincha","partes","todas"],"q2":"¿Qué rasgo de Coscoja es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["coriáceas","espinosos","reluciente","dientes","diferencia"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-062","cat":"Botánica","sub":"Arbusto","name":"Arto / Espino negro","sci":"Rhamnus lycioides","fam":"Rhamnaceae","freq":"media","key":"Arbusto muy intrincado con ramas terminadas en espina rígida; hojas muy pequeñas y estrechas (lineares); drupas negras pequeñas","mnem":"El 'espino con ramas de aguja': las ramas terminan en espina y las hojas son tan estrechas como agujas — el arbusto más espinoso e impenetrable de los suelos calizos áridos del sureste de Madrid","etym":"Rhamnus (gr.) = 'espino' · lycioides (gr.) = 'parecido a Lycium' (cambrón): por el aspecto espinoso e intrincado similar","notes":"Diferencia clave con Rhamnus alaternus (aladierno): aladierno = hojas ovales perennes brillantes, sin espinas terminales, ambientes más húmedos; lycioides = hojas estrechas, espinas terminales, ambientes áridos calcáreos. Muy frecuente en el sureste de Madrid (zona de yesos y calizas).","hab":"Matorrales calcáreos y gipsícolas áridos; suelos degradados calizos y yesosos","bio":"Piso mesomediterráneo inferior (100-700 m); matorrales gipsícolas y calcícolas áridos","q1":"¿Qué imagen mental evoca el mnemónico de Arto / Espino negro? Descríbelo con tus palabras.","t1":["impenetrable","espino","terminan","estrechas","ramas"],"q2":"¿Cuál es el rasgo más diagnóstico de Arto / Espino negro? Incluye al menos un término clave.","t2":["intrincado","terminadas","arbusto","estrechas","pequeñas"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-063","cat":"Botánica","sub":"Arbusto","name":"Efedra / Uva de mar","sci":"Ephedra nebrodensis","fam":"Ephedraceae","freq":"alta","key":"Tallos articulados, verdes y estriados — aspecto de cola de caballo (Equisetum) pero leñosa; hojas reducidas a escamas en los nudos; frutos carnosos rojizos","mnem":"La 'cola de caballo leñosa': tallos articulados y estriados como los de Equisetum pero rígidos, leñosos y con frutillos rojos carnosos. La gimnosperma que parece un helecho articulado","etym":"Ephedra (gr.) = 'sobre el agua o la orilla' · nebrodensis = de los Nebrodi (montes de Sicilia, donde fue descrita)","notes":"La efedra es evaluable por su singularidad taxonómica: es una gimnosperma (con óvulos desnudos) pero no es una conífera. La efedrina (alcaloide vasoconstrictor) que contiene es el origen del fármaco epinefrina. Los tallos articulados + ausencia de hojas verdaderas son diagnósticos.","hab":"Matorrales calcáreos áridos, roquedos, suelos gipsícolas secos","bio":"Piso mesomediterráneo árido (100-700 m); matorrales calcáreos y gipsícolas","q1":"Explica el mnemónico de Efedra / Uva de mar y qué rasgos te ayuda a recordar.","t1":["articulados","caballo","estriados","equisetum","leñosa"],"q2":"Describe el carácter principal que identifica a Efedra / Uva de mar a primera vista.","t2":["articulados","estriados","tallos","verdes","aspecto"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-064","cat":"Botánica","sub":"Arbusto","name":"Brezo blanco / Brezo arborescente","sci":"Erica arborea","fam":"Ericaceae","freq":"alta","key":"Hojas lineares muy pequeñas (3-5 mm) en verticilos de 3-4; flores acampanadas blancas diminutas; puede alcanzar 5-6 m (el mayor brezo ibérico)","mnem":"El 'brezo blanco gigante': el único brezo que puede llegar a ser árbol pequeño, con flores blancas acampanadas diminutas en racimos. Si el brezo te supera en altura, es Erica arborea","etym":"Erica (gr.) = 'brezo' · arborea (lat.) = 'arborescente, en forma de árbol': el mayor de los brezos ibéricos","notes":"El mayor brezo ibérico — puede confundirse con otros brezos pero su tamaño (hasta 5 m), las flores blancas y las hojas en verticilos de 3-4 son diagnósticos. La madera de su raíz es la famosa 'brezo de pipa' para pipas de fumar (muy dura y refractaria al fuego). Indicadora de suelos silíceos ácidos.","hab":"Brezales silíceos, bosques de alcornoque y pino, taludes ácidos húmedos","bio":"Piso supramediterráneo y oromediterráneo inferior (800-1800 m); brezales de robledal y pinar","q1":"¿Cómo usarías el mnemónico de Brezo blanco / Brezo arborescente para no olvidarlo en el examen?","t1":["gigante","blanco","acampanadas","brezo","único"],"q2":"¿Qué rasgo de Brezo blanco / Brezo arborescente es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["verticilos","acampanadas","lineares","pequeñas","diminutas"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-065","cat":"Botánica","sub":"Arbusto","name":"Piorno serrano","sci":"Cytisus oromediterraneus","fam":"Fabaceae","freq":"muy_alta","key":"Arbusto muy denso y redondeado; flores amarillas muy abundantes que inundan de amarillo la sierra en mayo-junio; mata almohadillada adaptada al viento","mnem":"El 'arbusto dorado de la sierra': en mayo la sierra de Guadarrama se tiñe de amarillo intenso por el piorno — el arbusto que coloniza los pinares de altura y el piso oromediterráneo como nadie","etym":"Cytisus (gr.) = kytisos (nombre griego de un arbusto similar) · oromediterraneus (lat.) = oros (montaña) + mediterráneo: 'la retama de la montaña mediterránea'","notes":"El piorno serrano es la especie dominante del piso oromediterráneo de la sierra de Guadarrama. Su abundancia y el espectáculo visual en floración lo hacen muy reconocible. Diferencia de Cytisus scoparius (escoba): oromediterraneus = mata compacta redondeada, hojas pequeñas, alta montaña; scoparius = arbusto erecto, tallos pentagonales, zonas más bajas.","hab":"Pinar albar, brezal-piornalL, claros de pinar de altura; suelos silíceos ácidos","bio":"Piso oromediterráneo (1600-2200 m); piornalL-brezalL de cumbre","q1":"¿Qué imagen mental evoca el mnemónico de Piorno serrano? Descríbelo con tus palabras.","t1":["oromediterráneo","guadarrama","arbusto","dorado","sierra"],"q2":"¿Cuál es el rasgo más diagnóstico de Piorno serrano? Incluye al menos un término clave.","t2":["redondeado","abundantes","arbusto","amarillas","almohadillada"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-066","cat":"Botánica","sub":"Arbusto","name":"Cambroño","sci":"Adenocarpus hispanicus","fam":"Fabaceae","freq":"alta","key":"Legumbre con glándulas negras densas en la superficie — absolutamente diagnóstico; flores amarillas papilionáceas en racimo con cáliz glanduloso","mnem":"El 'arbusto con vainas negras punteadas': las legumbres cubiertas de puntitos negros glandulosos son absolutamente únicas — si la vaina parece manchada de brea o salpicada de hollín, es cambroño","etym":"Adenocarpus (gr.) = adenos (glándula) + karpos (fruto): 'fruto glanduloso' — por las legumbres cubiertas de glándulas · hispanicus = 'español, ibérico'","notes":"Las glándulas negras en la legumbre son el carácter más diagnóstico y evaluable. Endemismo ibérico muy típico de la vertiente madrileña del Guadarrama. Diferencia de Cytisus oromediterraneus (piorno): cambroño = flores en racimo terminal + vaina glandulosa; piorno = arbusto compacto + sin glándulas en vaina.","hab":"Orlas de robledal y pinar; brezal-piornalL; suelos silíceos ácidos de montaña","bio":"Piso supramediterráneo y oromediterráneo inferior (1000-1800 m); orlas de robledal y pinar","q1":"Explica el mnemónico de Cambroño y qué rasgos te ayuda a recordar.","t1":["absolutamente","punteadas","arbusto","legumbres","glandulosos"],"q2":"Describe el carácter principal que identifica a Cambroño a primera vista.","t2":["absolutamente","glándulas","papilionáceas","legumbre","superficie"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-067","cat":"Botánica","sub":"Árbol","name":"Enebro de la miera","sci":"Juniperus oxycedrus","fam":"Cupressaceae","freq":"muy_alta","key":"Agujas con DOS bandas blancas de estomas en el haz — diagnóstico vs. J. communis (solo 1 banda); bayas rojo-anaranjadas más grandes (8-12 mm)","mnem":"El 'enebro de las dos rayas blancas': cada aguja tiene DOS líneas blancas en el haz — cuenta las líneas: dos = oxycedrus; una = communis. Las bayas son más grandes y rojas que las del común","etym":"Juniperus (lat.) = 'enebro' · oxycedrus (gr.) = oxys (agudo, punzante) + kedros (cedro): 'cedro punzante'","notes":"El par J. communis / J. oxycedrus es uno de los más evaluados en coníferas. La clave es contar las bandas de estomas en el haz de la aguja: 1 banda = J. communis (enebro común); 2 bandas = J. oxycedrus (enebro miera). Las bayas también difieren: communis = azul-negro; oxycedrus = rojo-pardo, más grandes.","hab":"Matorral calcáreo y silíceo, pinares, garriga; más termófilo que J. communis","bio":"Piso mesomediterráneo y supramediterráneo inferior (0-1400 m); más termófilo que J. communis","q1":"¿Cómo usarías el mnemónico de Enebro de la miera para no olvidarlo en el examen?","t1":["enebro","blancas","oxycedrus","rayas","líneas"],"q2":"¿Qué rasgo de Enebro de la miera es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["diagnóstico","anaranjadas","agujas","blancas","bandas"],"catf":"botánica","subf":"árbol"},{"id":"AMP-068","cat":"Botánica","sub":"Árbol","name":"Taray / Tamariz","sci":"Tamarix gallica","fam":"Tamaricaceae","freq":"alta","key":"Hojas escuamiformes (pequeñas escamas aplicadas al tallo) — aspecto de pluma o cipresillo; flores rosadas muy pequeñas en espigas densas cilíndricas","mnem":"El 'árbol pluma de las orillas salinas': las hojas escamosas y las ramas plumosas le dan un aspecto único — como si estuviera cubierto de plumas verdes grisáceas. Las flores rosas en espiga son su firma","etym":"Tamarix (lat.) = nombre romano del taray, probablemente del río Tamaris (Tàmara, Palencia) · gallica = 'gálico, de la Galia'","notes":"Las hojas escuamiformes (reducidas a escamas, no láminas) son diagnósticas de la familia Tamaricaceae — ningún otro árbol o arbusto ibérico ribereño tiene esa estructura. Muy frecuente en ríos del sur y este de Madrid (Tajo, Jarama) y en ambientes salinos.","hab":"Orillas de ríos y arroyos, ramblas, zonas salinas o con suelos ricos en sales","bio":"Piso mesomediterráneo ribereño y zonas salobres (0-700 m); ramblas y cursos de agua estacionales","q1":"¿Qué imagen mental evoca el mnemónico de Taray / Tamariz? Descríbelo con tus palabras.","t1":["escamosas","orillas","salinas","árbol","pluma"],"q2":"¿Cuál es el rasgo más diagnóstico de Taray / Tamariz? Incluye al menos un término clave.","t2":["escuamiformes","cipresillo","aspecto","cilíndricas","hojas"],"catf":"botánica","subf":"árbol"},{"id":"AMP-069","cat":"Botánica","sub":"Arbusto","name":"Adelfa","sci":"Nerium oleander","fam":"Apocynaceae","freq":"muy_alta","key":"Hojas en verticilos de 3, lanceoladas muy alargadas, coriáceas y perennes; flores grandes rosas/blancas con corona de apéndices laciniados; látex muy tóxico","mnem":"La 'planta del río que mata': las hojas en verticilos de 3 como dedos apuntando + flores grandes rosas = adelfa. Todo en ella es veneno — ni quemarla (el humo es tóxico), ni usarla de palillo","etym":"Nerium (gr.) = nerion, nombre griego de la adelfa · oleander = nombre latino compuesto de Olea (olivo) + rhododendron (rododendro): 'el que parece olivo y rododendro'","notes":"La adelfa es evaluable tanto por su morfología (hojas verticiladas de 3 + flores con corona) como por su toxicidad (glucósidos cardiotóxicos: oleandrina). Muy plantada en medianeras de autopistas en Madrid. Diferencia de laurel: laurel = hojas alternas aromáticas; adelfa = hojas en verticilos de 3, no aromáticas y muy tóxicas.","hab":"Ramblas, barrancos y ríos mediterráneos estacionales; cultivada en jardines y medianeras","bio":"Piso mesomediterráneo ribereño (0-800 m); ramblas y ríos de régimen mediterráneo","q1":"Explica el mnemónico de Adelfa y qué rasgos te ayuda a recordar.","t1":["verticilos","apuntando","planta","hojas","mata"],"q2":"Describe el carácter principal que identifica a Adelfa a primera vista.","t2":["lanceoladas","verticilos","alargadas","coriáceas","perennes"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-070","cat":"Botánica","sub":"Árbol","name":"Sauce ceniciento","sci":"Salix atrocinerea","fam":"Salicaceae","freq":"alta","key":"Hojas elípticas a obovadas, grisáceas y pubescentes en el envés (tomentoso-ceniciento); estípulas grandes y persistentes; el sauce más frecuente en ríos de Madrid","mnem":"El 'sauce gris de las orillas': el envés grisáceo-pubescente de las hojas + las estípulas grandes son la firma. Si el sauce de la orilla tiene las hojas con el reverso gris y peludo, es S. atrocinerea","etym":"Salix (lat.) = 'sauce' · atrocinerea (lat.) = ater (oscuro, negro) + cinerea (gris): 'gris oscuro': por el color grisáceo del envés foliar","notes":"El género Salix se identifica por: hojas alternas, estípulas frecuentes, amentos unisexuales, frutos con vilano. S. atrocinerea es el sauce más común en Madrid. Diferencia de Salix alba (sauce blanco): alba = hojas más estrechas y plateadas, porte más alto; atrocinerea = hojas más anchas y grisáceas, porte más arbustivo.","hab":"Orillas de ríos y arroyos, zonas encharcadas, cunetas húmedas","bio":"Piso supramediterráneo y mesomediterráneo ribereño (200-1600 m); saucedas y choperas","q1":"¿Cómo usarías el mnemónico de Sauce ceniciento para no olvidarlo en el examen?","t1":["pubescente","orillas","grisáceo","estípulas","sauce"],"q2":"¿Qué rasgo de Sauce ceniciento es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["pubescentes","elípticas","persistentes","grisáceas","obovadas"],"catf":"botánica","subf":"árbol"},{"id":"AMP-071","cat":"Botánica","sub":"Árbol","name":"Sauce salvio / Mimbrera","sci":"Salix salviifolia","fam":"Salicaceae","freq":"alta","key":"Hojas lanceoladas a oblanceoladas, ondulado-dentadas, con tomento blanquecino por ambas caras (como las de la salvia); endemismo ibérico","mnem":"El 'sauce con hojas de salvia': hojas blanquecinas, onduladas y con tacto suave y tomentoso como las de la salvia — el sauce endémico ibérico de los ríos del Sistema Central","etym":"Salix (lat.) = 'sauce' · salviifolia (lat.) = Salvia (salvia) + folium (hoja): 'de hojas parecidas a la salvia' — por la textura y forma de las hojas","notes":"Endemismo ibérico — relevante para oposiciones de Madrid por ser la sauceda característica de los ríos del Sistema Central (Manzanares, Lozoya, Jarama alto). La forma ondulada de las hojas (como la salvia) es el carácter diagnóstico. Par de estudio con S. atrocinerea.","hab":"Orillas de ríos y arroyos de agua limpia y fría; preferencia por ríos de montaña","bio":"Piso supramediterráneo ribereño (600-1600 m); saucedas de ríos de montaña","q1":"¿Qué imagen mental evoca el mnemónico de Sauce salvio / Mimbrera? Descríbelo con tus palabras.","t1":["blanquecinas","onduladas","sauce","salvia","tomentoso"],"q2":"¿Cuál es el rasgo más diagnóstico de Sauce salvio / Mimbrera? Incluye al menos un término clave.","t2":["oblanceoladas","lanceoladas","blanquecino","ondulado","dentadas"],"catf":"botánica","subf":"árbol"},{"id":"AMP-072","cat":"Botánica","sub":"Herbácea","name":"Cardo / Alcachofa silvestre","sci":"Cynara cardunculus","fam":"Compositae (Asteraceae)","freq":"alta","key":"Capítulo enorme (5-15 cm) con brácteas en escudo terminadas en espina rígida; hojas muy grandes pinnadas con espinas; flores tubulares violeta-azuladas","mnem":"El 'cardo gigante morado': el capítulo más grande de todos los cardos ibéricos con brácteas en escudo espinosas y flores azul-violeta. Es literalmente la alcachofa silvestre sin seleccionar","etym":"Cynara (gr.) = nombre griego de la alcachofa · cardunculus (lat.) = 'cardito, cardo pequeño' (relativo al cardo cultivado Cardunculus)","notes":"La alcachofa cultivada (Cynara scolymus) es la misma especie seleccionada para tener receptáculos carnosos. El capítulo enorme + brácteas espinosas rígidas + flores azul-violeta son diagnósticos. Muy frecuente en baldíos y bordes de camino de Madrid.","hab":"Baldíos, bordes de camino, suelos arcillosos nitrificados de zonas bajas de Madrid","bio":"Piso mesomediterráneo (100-800 m); baldíos y suelos nitrificados del encinar degradado","q1":"Explica el mnemónico de Cardo / Alcachofa silvestre y qué rasgos te ayuda a recordar.","t1":["gigante","capítulo","literalmente","cardo","morado"],"q2":"Describe el carácter principal que identifica a Cardo / Alcachofa silvestre a primera vista.","t2":["capítulo","terminadas","brácteas","enorme","escudo"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-073","cat":"Botánica","sub":"Herbácea","name":"Trébol rojo / Trébol pratense","sci":"Trifolium pratense","fam":"Fabaceae","freq":"alta","key":"Hojas trifoliadas con marca en V blanquecina en los folíolos (en los individuos típicos); capítulo floral ovoide rosado-purpúreo sin pedúnculo visible; estípulas con nervio prominente","mnem":"El 'trébol de los pompones rosas': el capítulo purpúreo-rosado sentado directamente entre dos hojas trifoliadas con V blanca es inconfundible — el trébol más fácil de identificar por su flor","etym":"Trifolium (lat.) = tri (tres) + folium (hoja): 'la de tres hojas' · pratense (lat.) = 'de los prados'","notes":"La V blanquecina en los folíolos + el capítulo purpúreo sentado son diagnósticos. Diferencia de T. repens (trébol blanco): repens = flores blancas + capítulo pedunculado + hojas sin V marcada. Trifolium es el género fijador de N₂ más importante de los prados ibéricos.","hab":"Prados húmedos, pastizales, bordes de camino; suelos frescos y ácidos o neutros","bio":"Piso supramediterráneo y mesomediterráneo húmedo (400-1800 m); prados y pastizales frescos","q1":"¿Cómo usarías el mnemónico de Trébol rojo / Trébol pratense para no olvidarlo en el examen?","t1":["directamente","pompones","inconfundible","capítulo","trifoliadas"],"q2":"¿Qué rasgo de Trébol rojo / Trébol pratense es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["trifoliadas","blanquecina","folíolos","capítulo","hojas"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-074","cat":"Botánica","sub":"Árbol","name":"Almendro","sci":"Prunus dulcis","fam":"Rosaceae","freq":"muy_alta","key":"Flores blancas o rosadas de 5 pétalos que aparecen en enero-febrero ANTES que las hojas (la primera floración del año en Madrid); fruto: drupa con mesocarpo coriáceo fibroso y endocarpo duro (el hueso) con semilla comestible","mnem":"El 'árbol de la primera nevada blanca en enero': florece completamente desnudo de hojas en pleno invierno — los almendros en flor son la primera señal de primavera. Flor antes que hoja = siempre almendro","etym":"Prunus (lat.) = 'ciruelo, árbol con hueso' · dulcis (lat.) = 'dulce': por el sabor dulce de la almendra (vs. P. amara, la amarga)","notes":"La floración invernal (sin hojas) + el fruto con mesocarpo seco y fibroso (no carnoso) son diagnósticos. Diferencia de cerezo y ciruelo: ambos también florecen pronto, pero el almendro florece más temprano (enero-febrero) y su fruto es completamente diferente (hueso rugoso, mesocarpo seco).","hab":"Cultivado en zonas cálidas y secas; naturalizado en laderas pedregosas y suelos calcáreos","bio":"Piso mesomediterráneo (100-700 m); laderas secas y soleadas calcáreas","q1":"¿Qué imagen mental evoca el mnemónico de Almendro? Descríbelo con tus palabras.","t1":["completamente","primera","árbol","nevada","blanca"],"q2":"¿Cuál es el rasgo más diagnóstico de Almendro? Incluye al menos un término clave.","t2":["blancas","flores","rosadas","aparecen","pétalos"],"catf":"botánica","subf":"árbol"},{"id":"AMP-075","cat":"Botánica","sub":"Arbusto","name":"Zarzamora","sci":"Rubus ulmifolius","fam":"Rosaceae","freq":"muy_alta","key":"Tallos arqueados con aguijones curvados (no espinas); hojas compuestas pinnadas con 5 folíolos; fruto: polidrupa negra brillante (la mora); envés de los folíolos blanquecino-tomentoso","mnem":"La 'zarza de las moras negras con envés blanco': los aguijones curvados como garfios + el envés blanco de los folíolos + las moras negras brillantes en otoño son el trío diagnóstico. Los aguijones curvados enganchan — no los ignores","etym":"Rubus (lat.) = 'zarza, zarzamora' · ulmifolius (lat.) = Ulmus (olmo) + folium (hoja): 'de hojas parecidas al olmo'","notes":"La especie de Rubus más frecuente en Madrid. Los aguijones curvados (hacia atrás, como garfios) vs. espinas rectas de Rosa + el envés blanquecino son diagnósticos. La mora (polidrupa = conjunto de drupeolas) es el fruto más reconocible. Muy frecuente en setos y orillas de río.","hab":"Setos, bordes de bosque, orillas de río, zonas húmedas y nitrificadas","bio":"Todos los pisos (0-1600 m); orlas forestales, setos y zonas húmedas","q1":"Explica el mnemónico de Zarzamora y qué rasgos te ayuda a recordar.","t1":["aguijones","zarza","negras","curvados","diagnóstico"],"q2":"Describe el carácter principal que identifica a Zarzamora a primera vista.","t2":["arqueados","aguijones","compuestas","curvados","tallos"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-076","cat":"Botánica","sub":"Herbácea","name":"Mostaza silvestre","sci":"Sinapis arvensis","fam":"Brassicaceae (Cruciferae)","freq":"alta","key":"4 pétalos amarillos en cruz (diagnóstico de familia Brassicaceae); silicua (fruto) cilíndrica y terminada en un pico largo rígido; hojas basales lirado-pinnadas con lóbulo terminal grande","mnem":"La 'flor de la cruz amarilla picante de los campos': 4 pétalos amarillos en cruz = Brassicaceae siempre. El pico largo y rígido de la silicua distingue a Sinapis del rábano silvestre (Raphanus, silicua esponjosa) y de la jaramago (Diplotaxis)","etym":"Sinapis (gr.) = 'mostaza' (nombre griego directo) · arvensis (lat.) = 'de los campos cultivados'","notes":"La familia Brassicaceae se identifica por: 4 pétalos en cruz + 6 estambres (4 largos + 2 cortos) + fruto en silicua o silícula. El pico rígido de Sinapis es su carácter de especie. Muy frecuente como mala hierba de cereales en el campo de Madrid.","hab":"Campos de cereales, barbechos, bordes de camino; suelos arcillosos removidos","bio":"Piso mesomediterráneo y supramediterráneo (100-1200 m); campos de cultivo y baldíos","q1":"¿Cómo usarías el mnemónico de Mostaza silvestre para no olvidarlo en el examen?","t1":["brassicaceae","amarilla","amarillos","picante","pétalos"],"q2":"¿Qué rasgo de Mostaza silvestre es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["amarillos","cilíndrica","pétalos","terminada","silicua"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-077","cat":"Botánica","sub":"Herbácea","name":"Zurrón de pastor","sci":"Capsella bursa-pastoris","fam":"Brassicaceae (Cruciferae)","freq":"alta","key":"Fruto: silícula triangular-cordada (en forma de corazón o bolsita) — absolutamente diagnóstico; flores blancas muy pequeñas de 4 pétalos en cruz; roseta basal de hojas pinnadas","mnem":"La 'plantita con bolsitas de corazón': los frutitos triangulares en forma de corazón colgando del tallo como una colección de bolsitas son absolutamente únicos. Inconfundible en fructificación","etym":"Capsella (lat.) = 'cajita, cofrecillo' · bursa-pastoris (lat.) = bursa (bolsa) + pastor: 'bolsa del pastor' — por la forma del fruto que recuerda la alforja del pastor","notes":"La silícula triangular-cordada (en corazón) es diagnóstica al 100% para esta especie. Una de las plantas más cosmopolitas del mundo. Muy frecuente en jardines, campos y bordes de camino de Madrid durante todo el año.","hab":"Jardines, campos, bordes de camino, suelos removidos y nitrificados; ubiquista","bio":"Todos los pisos (0-2000 m); suelos removidos, jardines y campos de cultivo","q1":"¿Qué imagen mental evoca el mnemónico de Zurrón de pastor? Descríbelo con tus palabras.","t1":["triangulares","plantita","fructificación","bolsitas","absolutamente"],"q2":"¿Cuál es el rasgo más diagnóstico de Zurrón de pastor? Incluye al menos un término clave.","t2":["absolutamente","triangular","diagnóstico","silícula","cordada"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-078","cat":"Botánica","sub":"Herbácea","name":"Cicuta mayor","sci":"Conium maculatum","fam":"Apiaceae (Umbelliferae)","freq":"alta","key":"Tallo hueco con manchas purpúreas irregulares — diagnóstico de especie dentro de Apiaceae; olor desagradable (a ratón) al frotar; umbela compuesta blanca; hojas 2-3 pinnadas muy divididas","mnem":"La 'apiácea de las manchas de sangre y olor a ratón': tallo con manchas púrpuras + olor desagradable = cicuta con seguridad. Sin manchas y con olor agradable = probablemente no es cicuta. Mató a Sócrates (399 a.C.)","etym":"Conium (gr.) = koneion (cicuta): nombre griego directo · maculatum (lat.) = 'manchado': por las manchas purpúreas del tallo","notes":"IMPORTANTE POR SEGURIDAD: la cicuta es la planta más peligrosa de los ambientes húmedos ibéricos. Los dos caracteres diagnósticos de seguridad: (1) manchas purpúreas en el tallo, (2) olor desagradable a ratón. La toxina (coniína) causa parálisis ascendente. Confusión mortal con: perejil, zanahoria silvestre, cicuta acuática.","hab":"Orillas de ríos y arroyos, cunetas húmedas, bordes de camino con humedad; suelos nitrificados","bio":"Piso mesomediterráneo ribereño (0-1000 m); orillas de ríos y ambientes húmedos nitrificados","q1":"Explica el mnemónico de Cicuta mayor y qué rasgos te ayuda a recordar.","t1":["desagradable","apiácea","probablemente","manchas","sangre"],"q2":"Describe el carácter principal que identifica a Cicuta mayor a primera vista.","t2":["irregulares","diagnóstico","purpúreas","desagradable","manchas"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-079","cat":"Botánica","sub":"Árbol","name":"Quejigo","sci":"Quercus faginea","fam":"Fagaceae","freq":"muy_alta","key":"Hojas marcescentes (mueren pero no caen en otoño-invierno, quedan secas en el árbol); lobuladas con lóbulos redondeados; envés con pelillos estrellados; intermedio entre encina y roble","mnem":"El 'roble que guarda sus hojas muertas en invierno': las hojas secas color herrumbre que permanecen en el árbol todo el invierno son únicos entre los Quercus ibéricos. Árbol con hojas de muerto que no suelta","etym":"Quercus (lat.) = 'roble, encina' · faginea (lat.) = 'parecida al haya (Fagus)': por el aspecto de las hojas","notes":"La marcescencia (hojas muertas que no caen) es el carácter más diagnóstico y evaluable del quejigo. Es el Quercus más frecuente en las zonas calcáreas de Madrid (cuenca del Tajo). La serie de vegetación del quejigo es la formación climácica de los suelos básicos del sur de Madrid.","hab":"Bosques sobre suelos calcáreos y básicos del piso supramediterráneo de Madrid; quejigar","bio":"Piso supramediterráneo calcícola (600-1400 m); quejigar y melojar calcáreo","q1":"¿Cómo usarías el mnemónico de Quejigo para no olvidarlo en el examen?","t1":["invierno","guarda","muertas","permanecen","roble"],"q2":"¿Qué rasgo de Quejigo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["marcescentes","redondeados","lobuladas","estrellados","intermedio"],"catf":"botánica","subf":"árbol"},{"id":"AMP-080","cat":"Botánica","sub":"Árbol","name":"Haya","sci":"Fagus sylvatica","fam":"Fagaceae","freq":"muy_alta","key":"Corteza lisa y gris uniforme (como piel de elefante) — diagnóstica en campo; hojas ovadas con margen ondulado-dentado y nervios marcados; yemas alargadas y puntiagudas de color canela","mnem":"El 'árbol de la piel de elefante y el bosque dorado de otoño': la corteza lisa gris uniforme es única entre árboles ibéricos de gran porte. En otoño el hayedo es el espectáculo cromático más bello de la Península","etym":"Fagus (lat.) = 'haya' (del gr. phagos, 'el que da fruto comestible') · sylvatica (lat.) = 'de los bosques'","notes":"La corteza lisa gris + las yemas puntiagudas son diagnósticos en invierno. El haya no es frecuente en la sierra de Madrid (solo en el norte de la Comunidad) pero es muy evaluable en el visu. El hayedo es el bosque caducifolio climácico europeo.","hab":"Laderas umbrías con suelos frescos y profundos; zonas con niebla frecuente y precipitación alta","bio":"Piso supramediterráneo húmedo (800-1600 m); hayedo relicto en la vertiente norte del Guadarrama","q1":"¿Qué imagen mental evoca el mnemónico de Haya? Descríbelo con tus palabras.","t1":["elefante","árbol","espectáculo","bosque","dorado"],"q2":"¿Cuál es el rasgo más diagnóstico de Haya? Incluye al menos un término clave.","t2":["diagnóstica","corteza","uniforme","puntiagudas","lisa"],"catf":"botánica","subf":"árbol"},{"id":"AMP-081","cat":"Botánica","sub":"Árbol","name":"Pino carrasco","sci":"Pinus halepensis","fam":"Pinaceae","freq":"muy_alta","key":"Acículas cortas (6-10 cm) en parejas, finas y flexibles (se doblan sin romperse); piñas asimétricas que persisten varios años en el árbol abiertas; corteza gris-rojiza en ramas altas","mnem":"El 'pino de las piñas torcidas que no caen': las piñas asimétricas con el pedúnculo curvado que se quedan abiertas años en el árbol son diagnósticas. El pino gris del Mediterráneo seco que aguanta la sequía más severa","etym":"Pinus (lat.) = 'pino' · halepensis (lat.) = 'de Alep' (Aleppo, Siria, ciudad donde fue descrito)","notes":"El pino más frecuente en las repoblaciones del sur y este de Madrid. Las piñas persistentes y asimétricas son diagnósticas. Diferencia de P. pinea (piñonero): halepensis = piñas pequeñas asimétricas persistentes; pinea = piñas grandes globosas con piñones grandes. El más adaptado a la sequía.","hab":"Matorral mediterráneo árido, suelos calizos y yesosos, repoblaciones del sureste de Madrid","bio":"Piso mesomediterráneo árido (0-1000 m); pinares de repoblación y matorrales calcáreos secos","q1":"Explica el mnemónico de Pino carrasco y qué rasgos te ayuda a recordar.","t1":["asimétricas","torcidas","pedúnculo","diagnósticas","mediterráneo"],"q2":"Describe el carácter principal que identifica a Pino carrasco a primera vista.","t2":["acículas","asimétricas","flexibles","parejas","cortas"],"catf":"botánica","subf":"árbol"},{"id":"AMP-082","cat":"Botánica","sub":"Árbol","name":"Sabina albar","sci":"Juniperus thurifera","fam":"Cupressaceae","freq":"muy_alta","key":"Hojas en dos tipos: juveniles aciculares y adultas escuamiformes en el mismo árbol (dimorfia foliar); porte arbóreo con copa irregular; bayas pruinosas azul-grisáceas; olor a incienso al quemar","mnem":"La 'sabina con dos tipos de hojas y olor a incienso': en el mismo árbol hay agujas (hojas jóvenes) y escamas (hojas adultas) — ninguna otra cupresácea ibérica tiene esa mezcla. La más longeva de España","etym":"Juniperus (lat.) = 'enebro' · thurifera (lat.) = thus/thuris (incienso) + ferre (llevar): 'la que lleva incienso' — por el olor al quemar","notes":"La dimorfia foliar (agujas + escamas en el mismo árbol) es absolutamente diagnóstica. La sabina albar es el árbol más longevo de la flora española (ejemplares de >1000 años en Guadalajara). Diferencia de Juniperus communis: communis = solo hojas aciculares; thurifera = ambos tipos en el mismo árbol.","hab":"Sabinar continental en suelos yesosos y calizos, clima extremadamente continental","bio":"Piso supramediterráneo continental (700-1500 m); sabinares de interior sobre yesos y calizas","q1":"¿Cómo usarías el mnemónico de Sabina albar para no olvidarlo en el examen?","t1":["sabina","incienso","cupresácea","tipos","hojas"],"q2":"¿Qué rasgo de Sabina albar es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["escuamiformes","aciculares","juveniles","hojas","adultas"],"catf":"botánica","subf":"árbol"},{"id":"AMP-083","cat":"Botánica","sub":"Árbol","name":"Cornicabra / Terebinto","sci":"Pistacia terebinthus","fam":"Anacardiaceae","freq":"muy_alta","key":"Hoja compuesta imparipinnada (con foliolo terminal) con 5-9 folíolos; olor a trementina al frotar (diagnóstico); caducifolio; produce agallas (cuernos de cabra) por Pemphigus — su nombre","mnem":"El 'árbol que huele a trementina con cuernos de cabra': el olor intenso a trementina al frotar la hoja es inconfundible. Las agallas rojas en forma de cuerno (que le dan el nombre 'cornicabra') son un espectáculo en primavera","etym":"Pistacia (gr.) = nombre griego del árbol · terebinthus (gr.) = nombre griego del terebinto, fuente de la trementina","notes":"Par de estudio imprescindible con P. lentiscus: lentiscus = paripinnada (sin foliolo terminal) + perennifolia + sin olor tan intenso; terebinthus = imparipinnada (con foliolo terminal) + caducifolio + olor a trementina. Las agallas 'cuernos de cabra' son muy llamativas y evaluables.","hab":"Matorral mediterráneo calcícola, coscojar, garriga; suelos calizos bien drenados","bio":"Piso mesomediterráneo calcícola (100-900 m); coscojar y matorral calizo del sur de Madrid","q1":"¿Qué imagen mental evoca el mnemónico de Cornicabra / Terebinto? Descríbelo con tus palabras.","t1":["trementina","inconfundible","cuernos","árbol","espectáculo"],"q2":"¿Cuál es el rasgo más diagnóstico de Cornicabra / Terebinto? Incluye al menos un término clave.","t2":["imparipinnada","compuesta","trementina","caducifolio","folíolos"],"catf":"botánica","subf":"árbol"},{"id":"AMP-084","cat":"Botánica","sub":"Herbácea","name":"Cebada de ratón / Cola de rata","sci":"Hordeum murinum","fam":"Gramineae (Poaceae)","freq":"alta","key":"Espiga densa con aristas largas (2-5 cm) que se dispersan en abanico; espiguillas laterales con largas aristas; muy frecuente en suelos pisoteados, bordes de camino y suelos nitrogenados","mnem":"La 'gramínea con bigotes de gato que se pega a la ropa': las aristas largas se enganchan en la ropa y el pelo de los perros con gran facilidad — la gramínea más pegajosa y abundante de los suelos pisoteados de Madrid","etym":"Hordeum (lat.) = 'cebada' · murinum (lat.) = 'de los ratones': 'la cebada de los ratones' — grano pequeño como para ratones","notes":"Una de las gramíneas más frecuentes en Madrid (aceras, parques, bordes de camino). Las aristas largas que se pegan a la ropa son diagnósticas. La espiga densa con aristas en abanico la distingue fácilmente de otras gramíneas de la ciudad.","hab":"Suelos pisoteados, bordes de camino, aceras, suelos nitrificados y removidos; ubiquista urbana","bio":"Todos los pisos (0-1500 m); suelos ruderales, bordes de camino y zonas urbanas","q1":"Explica el mnemónico de Cebada de ratón / Cola de rata y qué rasgos te ayuda a recordar.","t1":["gramínea","bigotes","enganchan","aristas","pisoteados"],"q2":"Describe el carácter principal que identifica a Cebada de ratón / Cola de rata a primera vista.","t2":["espiguillas","dispersan","espiga","aristas","nitrogenados"],"catf":"botánica","subf":"herbácea"},{"id":"BRY-001","cat":"Botánica","sub":"Briófito","name":"Esfagno común (musgo de turbera)","sci":"Sphagnum palustre","fam":"Sphagnaceae","freq":"media","key":"Ramas en fascículos: 2-3 erectas + 2-3 colgantes por nudo; color verde-amarillento pálido; células hialinas absorbentes sin rizoides","mnem":"La 'esponja vegetal verde-amarillenta': la más común de los esfagnos ibéricos — si lo estrujas suelta agua a chorros. El color verde-amarillento pálido + las turberas bajas son su hábitat típico","etym":"Sphagnum (gr.) = 'musgo de turbera' · palustre (lat.) = 'de los pantanos, palustre'","notes":"S. palustre es la especie de Sphagnum más frecuente en turberas bajas del norte ibérico. El género Sphagnum puede aparecer sin especificar especie en el visu — lo diagnóstico es el género: ramas en fascículos + ausencia de rizoides + células hialinas absorbentes. Diferenciar de S. capillifolium (ver BRY-006): palustre = verde-amarillento, turberas bajas; capillifolium = rojo-rosado, turberas ácidas de montaña.","hab":"Turberas bajas, brezales húmedos, bordes de laguna; suelos ácidos saturados","q1":"¿Cómo usarías el mnemónico de Esfagno común (musgo de turbera) para no olvidarlo en el examen?","t1":["amarillenta","esponja","vegetal","esfagnos","ibéricos"],"q2":"¿Qué rasgo de Esfagno común (musgo de turbera) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["fascículos","colgantes","amarillento","erectas","absorbentes"],"catf":"botánica","subf":"briófito"},{"id":"BRY-006","cat":"Botánica","sub":"Briófito","name":"Esfagno rojo (musgo de turbera ácida)","sci":"Sphagnum capillifolium","fam":"Sphagnaceae","freq":"media","key":"Color rojo-rosado a pardo-rojizo intenso — el único esfagno claramente rojo; hojas de rama muy pequeñas; capitulum comp
