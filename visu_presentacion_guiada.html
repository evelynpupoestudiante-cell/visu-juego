luco","fam":"Strigidae","freq":"alta","key":"Disco facial redondo con borde oscuro; sin penachos; ojos negros muy grandes","mnem":"El '¡buuu!' del bosque — el más común con los grandes ojos negros","etym":"Strix (gr./lat.) = 'búho' · aluco = nombre antiguo del cárabo (posiblemente onomatopéyico del canto)","notes":"El búho más común y familiar de España. El '¡buuu-buuuu!' de las noches es el cárabo. Los ojos negros grandes sin penachos son diagnósticos vs. búho real (ojos naranjas + penachos)","hab":"Bosques maduros de todo tipo, jardines arbolados, parques urbanos","bio":"Todos los pisos (0-2000 m); bosques maduros y parques arbolados","q1":"¿Cómo usarías el mnemónico de Cárabo común para no olvidarlo en el examen?","t1":["bosque","grandes","buuu","común","negros"],"q2":"¿Qué rasgo de Cárabo común es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["redondo","facial","penachos","disco","oscuro"],"catf":"vertebrados","subf":"ave"},{"id":"AVE-029","cat":"Vertebrados","sub":"Ave","name":"Mochuelo europeo","sci":"Athene noctua","fam":"Strigidae","freq":"alta","key":"El menor búho ibérico; cabeza aplanada con cejas blancas prominentes","mnem":"El búho de Atenea — pequeño y con cara de 'enfadado permanente'","etym":"Athene (gr.) = diosa Atenea (cuya ave sagrada era la lechuza) · noctua (lat.) = 'nocturna'","notes":"Activo también de día (única especie de búho ibérico diurna). La expresión 'enfadada' y las cejas blancas prominentes son diagnósticas. El búho de los olivares de Madrid","hab":"Zonas agrícolas, olivares, pedrizas, bordes de pueblo; busca huecos para anidar","bio":"Piso mesomediterráneo (0-1200 m); zonas agrícolas y paisaje agroforestal","q1":"¿Qué imagen mental evoca el mnemónico de Mochuelo europeo? Descríbelo con tus palabras.","t1":["permanente","pequeño","enfadado","atenea","búho"],"q2":"¿Cuál es el rasgo más diagnóstico de Mochuelo europeo? Incluye al menos un término clave.","t2":["prominentes","ibérico","aplanada","menor","cabeza"],"catf":"vertebrados","subf":"ave"},{"id":"AVE-030","cat":"Vertebrados","sub":"Ave","name":"Sisón común","sci":"Tetrax tetrax","fam":"Otididae","freq":"alta","key":"♂ cuello negro con doble collar blanco en V; ♀ críptica","mnem":"El 'collar de corbatín' del macho","etym":"Tetrax (gr.) = nombre antiguo de un ave similar · tetrax = repetición (especie tipo)","notes":"El macho en celo hace un vuelo nupcial espectacular. Especie en declive por la intensificación agrícola. Los campos de cereal de Madrid son clave para su conservación","hab":"Estepas cerealistas, barbechos, pastizales; llanuras abiertas","bio":"Piso mesomediterráneo estepario (400-900 m); estepas cerealistas y barbechos","q1":"Explica el mnemónico de Sisón común y qué rasgos te ayuda a recordar.","t1":["corbatín","collar","macho"],"q2":"Describe el carácter principal que identifica a Sisón común a primera vista.","t2":["cuello","críptica","negro","collar","doble"],"catf":"vertebrados","subf":"ave"},{"id":"MAM-001","cat":"Vertebrados","sub":"Mamífero","name":"Lobo ibérico","sci":"Canis lupus signatus","fam":"Canidae","freq":"alta","key":"Cánido grande (25-40 kg); pelaje gris-pardo","mnem":"El 'perro salvaje con medias negras': las manchas oscuras en los carpos + cola siempre recta lo distinguen del perro doméstico","etym":"Canis (lat.) = 'perro' · lupus = 'lobo' · signatus = 'marcado': por las marcas negras","notes":"CONFIRMADO: Canidae en etiquetas de exámenes reales. Las marcas negras en los carpos son la clave diagnóstica de la subespecie ibérica.","hab":"Bosques y zonas de matorral con ungulados; norte peninsular","q1":"¿Cómo usarías el mnemónico de Lobo ibérico para no olvidarlo en el examen?","t1":["salvaje","perro","medias","manchas","distinguen"],"q2":"¿Qué rasgo de Lobo ibérico es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["cánido","grande","pelaje","pardo","gris"],"catf":"vertebrados","subf":"mamífero"},{"id":"MAM-002","cat":"Vertebrados","sub":"Mamífero","name":"Zorro rojo","sci":"Vulpes vulpes","fam":"Canidae","freq":"alta","key":"Pelaje rojizo brillante; vientre y punta de la cola blancos; patas y orejas negras","mnem":"El 'cánido de las tres zonas de color': rojo en el dorso + blanco en el vientre y cola + negro en patas y orejas. Inconfundible","etym":"Vulpes (lat.) = 'zorro' · vulpes = repetición","notes":"Canidae confirmada. El patrón tricolor rojo/blanco/negro + la cola espesa son diagnósticos. El cánido más adaptable y ubicuo de España.","hab":"Ubiquista: bosques, campos, matorral, zonas periurbanas","q1":"¿Qué imagen mental evoca el mnemónico de Zorro rojo? Descríbelo con tus palabras.","t1":["inconfundible","cánido","zonas","color","vientre"],"q2":"¿Cuál es el rasgo más diagnóstico de Zorro rojo? Incluye al menos un término clave.","t2":["brillante","pelaje","rojizo","vientre","blancos"],"catf":"vertebrados","subf":"mamífero"},{"id":"MAM-003","cat":"Vertebrados","sub":"Mamífero","name":"Tejón europeo","sci":"Meles meles","fam":"Mustelidae","freq":"alta","key":"Cabeza blanca con dos anchas bandas negras laterales (nariz → orejas) — absolutamente diagnóstico","mnem":"El 'mapache europeo con rayas en la cabeza': la cabeza blanca con dos rayas negras es tan llamativa que no necesita más descripción","etym":"Meles (lat.) = 'tejón' · meles = repetición","notes":"CONFIRMADO: Mustelidae en etiquetas de exámenes reales. Las rayas negras en la cabeza blanca son absolutamente diagnósticas. El mayor mustelido terrestre de Europa.","hab":"Bosques y matorral con suelos blandos para excavar","q1":"Explica el mnemónico de Tejón europeo y qué rasgos te ayuda a recordar.","t1":["mapache","europeo","descripción","llamativa","cabeza"],"q2":"Describe el carácter principal que identifica a Tejón europeo a primera vista.","t2":["absolutamente","diagnóstico","laterales","cabeza","blanca"],"catf":"vertebrados","subf":"mamífero"},{"id":"MAM-004","cat":"Vertebrados","sub":"Mamífero","name":"Nutria euroasiática","sci":"Lutra lutra","fam":"Mustelidae","freq":"alta","key":"Cuerpo alargado y fusiforme; patas cortas con membranas interdigitales","mnem":"La 'comadreja del río': alargada, marrón, con membranas en las patas y cola de timón — el mustelido acuático por excelencia","etym":"Lutra (lat.) = 'nutria' · lutra = repetición","notes":"Mustelidae confirmada. El cuerpo fusiforme + membranas interdigitales + garganta blanquecina son diagnósticos. Bioindicadora de calidad del agua — muy evaluable.","hab":"Ríos, embalses y costas con agua limpia y riberas arboladas","q1":"¿Cómo usarías el mnemónico de Nutria euroasiática para no olvidarlo en el examen?","t1":["comadreja","alargada","membranas","mustelido","excelencia"],"q2":"¿Qué rasgo de Nutria euroasiática es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["interdigitales","fusiforme","alargado","membranas","cuerpo"],"catf":"vertebrados","subf":"mamífero"},{"id":"MAM-005","cat":"Vertebrados","sub":"Mamífero","name":"Lince ibérico","sci":"Lynx pardinus","fam":"Felidae","freq":"alta","key":"Orejas con mechones de pelos negros en las puntas — diagnóstico de género Lynx","mnem":"El 'gato de orejas con cuernos y cola cortada': los mechones auriculares + la cola corta con punta negra son únicos entre los félidos ibéricos","etym":"Lynx (gr.) = 'lince' · pardinus = 'parecido al leopardo'","notes":"El felino más amenazado del mundo. Los mechones auriculares + cola corta son diagnósticos de Lynx. La recuperación (de ~94 individuos en 2002 a +1000 en 2023) es un caso de éxito evaluable.","hab":"Matorral mediterráneo con alta densidad de conejo; Sierra Morena, Doñana","q1":"¿Qué imagen mental evoca el mnemónico de Lince ibérico? Descríbelo con tus palabras.","t1":["auriculares","cuernos","orejas","mechones","cortada"],"q2":"¿Cuál es el rasgo más diagnóstico de Lince ibérico? Incluye al menos un término clave.","t2":["diagnóstico","mechones","orejas","negros","pelos"],"catf":"vertebrados","subf":"mamífero"},{"id":"MAM-006","cat":"Vertebrados","sub":"Mamífero","name":"Ciervo rojo","sci":"Cervus elaphus","fam":"Cervidae","freq":"alta","key":"Macho: astas ramificadas de hueso que se renuevan anualmente — diagnóstico de clase","mnem":"El 'ciervo de los cuernos de árbol': las astas ramificadas como un árbol que se renuevan cada año — el ungulado más majestuoso","etym":"Cervus (lat.) = 'ciervo' · elaphus (gr.) = 'ciervo'","notes":"Las astas (hueso caducifolio) son el carácter más evaluable. Diferencia astas (Cervidae) vs. cuernos (Bovidae): astas = hueso macizo caducifolio; cuernos = queratina perenne.","hab":"Bosques mixtos, pastizales de montaña; Montes de Toledo, Sistema Central","q1":"Explica el mnemónico de Ciervo rojo y qué rasgos te ayuda a recordar.","t1":["ramificadas","cuernos","ciervo","majestuoso","renuevan"],"q2":"Describe el carácter principal que identifica a Ciervo rojo a primera vista.","t2":["ramificadas","diagnóstico","anualmente","renuevan","macho"],"catf":"vertebrados","subf":"mamífero"},{"id":"MAM-007","cat":"Vertebrados","sub":"Mamífero","name":"Jabalí","sci":"Sus scrofa","fam":"Suidae","freq":"alta","key":"Cuerpo robusto con cabeza grande y hocico alargado (jeta); cuello muy grueso","mnem":"El 'cerdo salvaje armado': el hocico de cerdo + colmillos curvados del macho + rayaditos de los jabatos — el abuelo del cerdo de granja","etym":"Sus (lat.) = 'cerdo' · scrofa = 'cerda': el ancestro silvestre del cerdo","notes":"El artiodáctilo más frecuente en exámenes. Los colmillos del macho y las rayas de los jabatos son diagnósticos. El vínculo con el cerdo doméstico es muy evaluable.","hab":"Bosques, matorral, campos; muy adaptable; en expansión","q1":"¿Cómo usarías el mnemónico de Jabalí para no olvidarlo en el examen?","t1":["salvaje","colmillos","cerdo","armado","curvados"],"q2":"¿Qué rasgo de Jabalí es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["robusto","cuerpo","alargado","cabeza","grande"],"catf":"vertebrados","subf":"mamífero"},{"id":"MAM-008","cat":"Vertebrados","sub":"Mamífero","name":"Murciélago ratonero grande","sci":"Myotis myotis","fam":"Vespertilionidae","freq":"media","key":"El mayor murciélago de Europa central (envergadura 35-43 cm)","mnem":"El 'ratón volador con orejas gigantes': el mayor murciélago europeo con orejas desproporcionadas para la ecolocalización","etym":"Myotis (gr.) = mys (ratón) + otis (oreja): 'oreja de ratón' · myotis = repetición","notes":"Chiroptera = el segundo orden de mamíferos más diverso. La membrana alar (patagio) + ecolocalización son los temas más evaluables.","hab":"Bosques y zonas agrícolas; colonias en cuevas y edificios","q1":"¿Qué imagen mental evoca el mnemónico de Murciélago ratonero grande? Descríbelo con tus palabras.","t1":["desproporcionadas","ecolocalización","murciélago","volador","gigantes"],"q2":"¿Cuál es el rasgo más diagnóstico de Murciélago ratonero grande? Incluye al menos un término clave.","t2":["murciélago","central","mayor","europa"],"catf":"vertebrados","subf":"mamífero"},{"id":"MAM-009","cat":"Vertebrados","sub":"Mamífero","name":"Erizo europeo","sci":"Erinaceus europaeus","fam":"Erinaceidae","freq":"media","key":"Dorso cubierto de púas (espinas modificadas) de 2-3 cm","mnem":"El 'cactus con patas': la única bola con púas que camina — se enrolla mostrando todas las espinas","etym":"Erinaceus (lat.) = 'erizo' · europaeus = 'europeo'","notes":"El enrollamiento defensivo + espinas son diagnósticos. Resistente al veneno de serpientes (mecanismo no del todo conocido).","hab":"Bordes de bosque, jardines, setos; muy adaptable","q1":"Explica el mnemónico de Erizo europeo y qué rasgos te ayuda a recordar.","t1":["cactus","mostrando","patas","única","enrolla"],"q2":"Describe el carácter principal que identifica a Erizo europeo a primera vista.","t2":["cubierto","dorso","púas"],"catf":"vertebrados","subf":"mamífero"},{"id":"MAM-010","cat":"Vertebrados","sub":"Mamífero","name":"Conejo europeo","sci":"Oryctolagus cuniculus","fam":"Leporidae","freq":"alta","key":"Orejas largas; cola corta y esponjosa blanca por debajo","mnem":"El 'excavador con orejas del que depende el lince': el conejo del que depende el lince, el águila imperial y otros 40 depredadores españoles. Endémico ibérico","etym":"Oryctolagus (gr.) = oryktes (excavador) + lagos (liebre) · cuniculus = 'conejo, galería'","notes":"Lagomorpha ≠ Rodentia. Los conejos tienen 4 incisivos superiores (2 grandes + 2 pequeños detrás). Especie clave del ecosistema mediterráneo ibérico.","hab":"Matorral, pastizales, olivares, campos; suelos blandos para excavar","q1":"¿Cómo usarías el mnemónico de Conejo europeo para no olvidarlo en el examen?","t1":["excavador","depredadores","depende","orejas","conejo"],"q2":"¿Qué rasgo de Conejo europeo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["esponjosa","orejas","largas","corta","blanca"],"catf":"vertebrados","subf":"mamífero"},{"id":"MAM-011","cat":"Vertebrados","sub":"Mamífero","name":"Garduña","sci":"Martes foina","fam":"Mustelidae","freq":"media","key":"Mancha BLANCA en la garganta y pecho bifurcada hacia las patas delanteras — diagnóstica","mnem":"La 'mustelid con pechera blanca bifurcada': la mancha blanca en Y en la garganta es la diferencia clave vs. marta (amarilla). La garduña lleva corbata blanca; la marta lleva pañuelo amarillo","etym":"Martes (lat.) = 'marta' · foina = 'garduña'","notes":"Mustelidae confirmada. La mancha gular BLANCA bifurcada vs. marta (AMARILLA no bifurcada) es un par de estudio muy evaluable.","hab":"Bosques, matorral, zonas rurales con construcciones","q1":"¿Qué imagen mental evoca el mnemónico de Garduña? Descríbelo con tus palabras.","t1":["mustelid","bifurcada","pechera","diferencia","blanca"],"q2":"¿Cuál es el rasgo más diagnóstico de Garduña? Incluye al menos un término clave.","t2":["diagnóstica","garganta","bifurcada","delanteras","mancha"],"catf":"vertebrados","subf":"mamífero"},{"id":"MAM-012","cat":"Vertebrados","sub":"Mamífero","name":"Cabra montés ibérica","sci":"Capra pyrenaica","fam":"Bovidae","freq":"media","key":"Cuernos grandes y espirales en el macho (hasta 75 cm); hembra con cuernos más cortos","mnem":"La 'cabra escaladora con cuernos en sacacorchos': los cuernos en espiral del macho y sus pezuñas especiales para el roquedo son únicos en España","etym":"Capra (lat.) = 'cabra' · pyrenaica = 'pirenaica'","notes":"Los cuernos en espiral + hábitat rupícola son diagnósticos. Los cuernos son permanentes y de queratina (Bovidae), a diferencia de las astas de Cervidae.","hab":"Roquedos y zonas de alta montaña; 400-3500 m","q1":"Explica el mnemónico de Cabra montés ibérica y qué rasgos te ayuda a recordar.","t1":["escaladora","sacacorchos","cuernos","especiales","cabra"],"q2":"Describe el carácter principal que identifica a Cabra montés ibérica a primera vista.","t2":["espirales","cuernos","grandes","hembra","macho"],"catf":"vertebrados","subf":"mamífero"},{"id":"PEC-001","cat":"Vertebrados","sub":"Pez cartilaginoso","name":"Pintarroja","sci":"Scyliorhinus canicula","fam":"Scyliorhinidae","freq":"muy_alta","key":"Tiburón pequeño (hasta 1 m); cuerpo con manchas pardas sobre fondo beige","mnem":"El 'tiburón con lunares que pone huevos en bolsa': manchas pardas + cápsulas de huevo con flecos — el tiburón del mercado","etym":"Scyliorhinus (gr.) = skylos (perro) + rhinos (nariz): 'nariz de perro' · canicula = 'perrita'","notes":"CONFIRMADO: Scyliorhinidae en etiquetas de exámenes reales. Las cápsulas de huevo ('bolsa de sirena') son muy frecuentes como muestra. El pez cartilaginoso más fácil de conseguir en pescaderías.","hab":"Fondos arenosos y rocosos; 0-400 m","q1":"¿Cómo usarías el mnemónico de Pintarroja para no olvidarlo en el examen?","t1":["tiburón","lunares","huevos","manchas","cápsulas"],"q2":"¿Qué rasgo de Pintarroja es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["tiburón","pequeño","manchas","cuerpo","pardas"],"catf":"vertebrados","subf":"pez cartilaginoso"},{"id":"PEC-002","cat":"Vertebrados","sub":"Pez cartilaginoso","name":"Raya común","sci":"Raja clavata","fam":"Rajidae","freq":"alta","key":"Cuerpo aplanado dorso-ventralmente en forma de rombo — absolutamente diagnóstico","mnem":"El 'tiburón aplastado en rombo': cuerpo en rombo plano con cola de látigo — como si un tiburón hubiera pasado por una prensa hidráulica","etym":"Raja (lat.) = 'raya' · clavata = 'con clavos': por las espinas dorsales","notes":"CONFIRMADO: Rajidae en etiquetas reales. La forma de rombo aplastado es diagnóstica de Batoidea. Diferenciar de peces planos óseos (lenguado): la raya tiene 5 hendiduras branquiales ventrales; el lenguado tiene opérculo lateral.","hab":"Fondos arenosos y de grava; 10-300 m","q1":"¿Qué imagen mental evoca el mnemónico de Raya común? Descríbelo con tus palabras.","t1":["aplastado","tiburón","cuerpo","rombo","hidráulica"],"q2":"¿Cuál es el rasgo más diagnóstico de Raya común? Incluye al menos un término clave.","t2":["ventralmente","absolutamente","aplanado","diagnóstico","cuerpo"],"catf":"vertebrados","subf":"pez cartilaginoso"},{"id":"PEC-003","cat":"Vertebrados","sub":"Pez cartilaginoso","name":"Tiburón azul","sci":"Prionace glauca","fam":"Carcharhinidae","freq":"media","key":"Azul intenso en el dorso con vientre blanco níveo; cuerpo muy hidrodinámico","mnem":"El 'tiburón del Índigo': azul intenso con barriga blanca y aleta pectoral larguísima — el más elegante de los océanos","etym":"Prionace (gr.) = prion (sierra) + akis (punta) · glauca = 'azul-grisáceo'","notes":"El azul + aleta pectoral larga son diagnósticos. Migrador de largas distancias. El contrasombreado (azul arriba / blanco abajo) es un camuflaje evaluable.","hab":"Mar abierto (pelágico oceánico); migratorio","q1":"Explica el mnemónico de Tiburón azul y qué rasgos te ayuda a recordar.","t1":["tiburón","larguísima","índigo","intenso","barriga"],"q2":"Describe el carácter principal que identifica a Tiburón azul a primera vista.","t2":["hidrodinámico","intenso","vientre","azul","dorso"],"catf":"vertebrados","subf":"pez cartilaginoso"},{"id":"PEC-004","cat":"Vertebrados","sub":"Pez cartilaginoso","name":"Tiburón martillo","sci":"Sphyrna zygaena","fam":"Sphyrnidae","freq":"media","key":"Cabeza expandida lateralmente en forma de martillo o T (cefalofólio) — absolutamente único","mnem":"El 'tiburón T': la cabeza en martillo es inconfundible — los ojos están tan separados que ven hacia atrás sin girar la cabeza","etym":"Sphyrna (gr.) = 'martillo': por la forma de la cabeza · zygaena = 'yugo' (la forma en T)","notes":"La forma de la cabeza es absolutamente diagnóstica. Los ojos en los extremos del martillo amplían el campo visual binocular frontal. El cefalofólio también mejora la detección electromagnética de rayas enterradas.","hab":"Aguas costeras y pelágicas; migratorio","q1":"¿Cómo usarías el mnemónico de Tiburón martillo para no olvidarlo en el examen?","t1":["inconfundible","tiburón","martillo","separados","cabeza"],"q2":"¿Qué rasgo de Tiburón martillo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["lateralmente","absolutamente","expandida","cabeza","martillo"],"catf":"vertebrados","subf":"pez cartilaginoso"},{"id":"PEO-001","cat":"Vertebrados","sub":"Pez óseo","name":"Gallineta del norte","sci":"Helicolenus dactylopterus","fam":"Sebastidae","freq":"muy_alta","key":"Color rojo-anaranjado brillante con manchas o bandas más oscuras","mnem":"El 'pez rojo con boca azul': rojo por fuera, azul-negro por dentro de la boca — absolutamente único. La gallineta de los tribunales de Madrid","etym":"Helicolenus (gr.) = heliko (espiral) + lenos (vaso) · dactylopterus = 'con dedos en las aletas'","notes":"CONFIRMADO explícitamente en tribunales 3 y 7 del examen Madrid 2021. La boca interior azul-negro + color rojo exterior son diagnósticos absolutos. Especie muy frecuente en pescaderías madrileñas.","hab":"Fondos rocosos; 50-1000 m","q1":"¿Qué imagen mental evoca el mnemónico de Gallineta del norte? Descríbelo con tus palabras.","t1":["absolutamente","rojo","tribunales","boca","gallineta"],"q2":"¿Cuál es el rasgo más diagnóstico de Gallineta del norte? Incluye al menos un término clave.","t2":["anaranjado","brillante","color","manchas","oscuras"],"catf":"vertebrados","subf":"pez óseo"},{"id":"PEO-002","cat":"Vertebrados","sub":"Pez óseo","name":"Trucha común","sci":"Salmo trutta","fam":"Salmonidae","freq":"alta","key":"Manchas rojas con halo azulado en los flancos — diagnóstico de especie","mnem":"El 'pez de las manchas con halo azul': las manchas rojas rodeadas de anillo azulado son únicas. La aleta adiposa 'extra' es el sello de familia Salmonidae","etym":"Salmo (lat.) = 'salmón' · trutta = 'trucha' (del gr. troktes = 'roedor')","notes":"La aleta adiposa (característica definitoria de Salmonidae, sin radios óseos) es el rasgo más evaluado. Las manchas rojas con halo azul son el diagnóstico de especie. Bioindicador de agua fría y limpia.","hab":"Ríos de montaña fríos y bien oxigenados","q1":"Explica el mnemónico de Trucha común y qué rasgos te ayuda a recordar.","t1":["manchas","rodeadas","salmonidae","halo","azulado"],"q2":"Describe el carácter principal que identifica a Trucha común a primera vista.","t2":["diagnóstico","manchas","azulado","flancos","rojas"],"catf":"vertebrados","subf":"pez óseo"},{"id":"PEO-003","cat":"Vertebrados","sub":"Pez óseo","name":"Barbo común","sci":"Luciobarbus bocagei","fam":"Cyprinidae","freq":"alta","key":"4 barbillas (2 en ángulos de la boca + 2 más largas en el labio superior) — diagnósticas","mnem":"El 'pez de los 4 bigotes': las 4 barbillas son absolutamente diagnósticas — el único pez ibérico de río con 4 antenas en la boca","etym":"Luciobarbus = género endémico ibérico · bocagei = del zoólogo portugués Bocage","notes":"Las 4 barbillas son diagnósticas de barbo. Muy frecuente en ríos de Madrid (Jarama, Manzanares). Cyprinidae = la familia de peces dulceacuícolas más diversa de la Península.","hab":"Ríos de corriente media a lenta; aguas mesotrofas","q1":"¿Cómo usarías el mnemónico de Barbo común para no olvidarlo en el examen?","t1":["absolutamente","diagnósticas","barbillas","bigotes","ibérico"],"q2":"¿Qué rasgo de Barbo común es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["diagnósticas","barbillas"],"catf":"vertebrados","subf":"pez óseo"},{"id":"PEO-004","cat":"Vertebrados","sub":"Pez óseo","name":"Anguila","sci":"Anguilla anguilla","fam":"Anguillidae","freq":"alta","key":"Cuerpo muy alargado y serpentiforme; aletas dorsal, caudal y anal fusionadas","mnem":"La 'serpiente del río que nace en el Caribe': la única especie que nace en el Mar de los Sargazos, llega a los ríos europeos y vuelve allí a morir","etym":"Anguilla (lat.) = 'anguilita' (diminutivo de anguris = serpiente de agua)","notes":"El ciclo vital catádromo (río → Sargazos → río) es un tema evaluable clásico. La aleta continua (dorsal+caudal+anal) y el cuerpo serpentiforme son diagnósticos. En Peligro Crítico de Extinción.","hab":"Ríos, estuarios y zonas costeras; migratoria","q1":"¿Qué imagen mental evoca el mnemónico de Anguila? Descríbelo con tus palabras.","t1":["serpiente","caribe","especie","sargazos","nace"],"q2":"¿Cuál es el rasgo más diagnóstico de Anguila? Incluye al menos un término clave.","t2":["serpentiforme","alargado","fusionadas","cuerpo","aletas"],"catf":"vertebrados","subf":"pez óseo"},{"id":"PEO-005","cat":"Vertebrados","sub":"Pez óseo","name":"Lenguado","sci":"Solea solea","fam":"Soleidae","freq":"media","key":"Cuerpo oval muy aplanado lateralmente; ambos ojos en el lado derecho","mnem":"El 'pez-suela de zapato': plano como una suela, con los dos ojos en el mismo lado — el único pez que te mira con dos ojos del mismo lado","etym":"Solea (lat.) = 'sandalia, suela del zapato': por la forma del cuerpo","notes":"La migración del ojo izquierdo hacia el derecho durante la metamorfosis es un proceso del desarrollo muy evaluable. Pleuronectiformes = peces planos con ambos ojos en el mismo lado.","hab":"Fondos arenosos intermareales y sublitorales; 0-200 m","q1":"Explica el mnemónico de Lenguado y qué rasgos te ayuda a recordar.","t1":["zapato","suela","plano","ojos","único"],"q2":"Describe el carácter principal que identifica a Lenguado a primera vista.","t2":["lateralmente","aplanado","cuerpo","oval","derecho"],"catf":"vertebrados","subf":"pez óseo"},{"id":"PEO-006","cat":"Vertebrados","sub":"Pez óseo","name":"Lamprea de río","sci":"Petromyzon marinus","fam":"Petromyzontidae","freq":"alta","key":"Sin mandíbulas (Agnatha): boca en ventosa circular con dientes córneos","mnem":"El 'vampiro del río sin mandíbulas': ventosa con dientes en círculo, 7 agujeritos por lado — el vertebrado más primitivo que puedes ver","etym":"Petromyzon (gr.) = petra (piedra) + myzon (que succiona): 'que succiona piedras' · marinus = 'marino'","notes":"Agnatha (sin mandíbulas) = el grupo más primitivo de vertebrados. La boca en ventosa + 7 aberturas branquiales + sin aletas pares son absolutamente diagnósticos. Anádroma.","hab":"Anádroma: adultos en mar; larvas (ammocetes) en ríos durante 4-7 años","q1":"¿Cómo usarías el mnemónico de Lamprea de río para no olvidarlo en el examen?","t1":["mandíbulas","agujeritos","vampiro","vertebrado","ventosa"],"q2":"¿Qué rasgo de Lamprea de río es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["mandíbulas","circular","ventosa","dientes","córneos"],"catf":"vertebrados","subf":"pez óseo"},{"id":"PEO-007","cat":"Vertebrados","sub":"Pez óseo","name":"Caballito de mar","sci":"Hippocampus guttulatus","fam":"Syngnathidae","freq":"media","key":"Postura vertical única entre peces; cola prensil que se enrolla en algas","mnem":"El 'pez vertical que el macho queda embarazado': el único pez que nada de pie y en el que el padre lleva y pare los crías","etym":"Hippocampus (gr.) = hippos (caballo) + kampos (monstruo marino) · guttulatus = 'con gotitas'","notes":"La postura vertical + cola prensil + el macho que incuba son temas muy evaluables. El exoesqueleto de placas óseas lo diferencia de todos los demás peces.","hab":"Praderas de Posidonia, algas; 1-50 m","q1":"¿Qué imagen mental evoca el mnemónico de Caballito de mar? Descríbelo con tus palabras.","t1":["embarazado","vertical","macho","queda","único"],"q2":"¿Cuál es el rasgo más diagnóstico de Caballito de mar? Incluye al menos un término clave.","t2":["vertical","postura","prensil","única","enrolla"],"catf":"vertebrados","subf":"pez óseo"},{"id":"PEO-008","cat":"Vertebrados","sub":"Pez óseo","name":"Pez espada","sci":"Xiphias gladius","fam":"Xiphiidae","freq":"media","key":"Rostro superior muy alargado, aplanado y afilado (la 'espada') — diagnóstico absoluto","mnem":"El 'karateka del océano': el único pez con ese espadón plano en la cabeza — lo usa para aturdir peces, no para ensartarlos","etym":"Xiphias (gr.) = 'espada' · gladius (lat.) = 'espada': 'espada' en dos idiomas","notes":"La espada (rostro alargado y APLANADO) es absolutamente diagnóstica. Diferencia con el marlín: el marlín tiene la espada circular en sección; el pez espada la tiene plana.","hab":"Océano abierto (pelágico); migratorio","q1":"Explica el mnemónico de Pez espada y qué rasgos te ayuda a recordar.","t1":["karateka","ensartarlos","océano","espadón","único"],"q2":"Describe el carácter principal que identifica a Pez espada a primera vista.","t2":["diagnóstico","superior","alargado","aplanado","rostro"],"catf":"vertebrados","subf":"pez óseo"},{"id":"REP-001","cat":"Vertebrados","sub":"Reptil","name":"Lagarto ocelado","sci":"Timon lepidus","fam":"Lacertidae","freq":"muy_alta","key":"El mayor lagarto de Europa (hasta 60-90 cm); robusto y de aspecto imponente","mnem":"El 'dragón verde con lunares azules': el mayor lagarto europeo, verde brillante con manchas azules llamativas — imposible confundirlo","etym":"Timon (gr.) = 'el que gobierna' · lepidus (lat.) = 'elegante, adornado'","notes":"CONFIRMADO: Lacertidae en etiquetas de exámenes reales. El mayor lagarto europeo + los ocelos azules son diagnósticos absolutos. Muy frecuente como muestra de Lacertidae.","hab":"Matorral mediterráneo, olivares, bordes de bosque","q1":"¿Cómo usarías el mnemónico de Lagarto ocelado para no olvidarlo en el examen?","t1":["dragón","lunares","brillante","confundirlo","verde"],"q2":"¿Qué rasgo de Lagarto ocelado es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["lagarto","imponente","robusto","mayor","europa"],"catf":"vertebrados","subf":"reptil"},{"id":"REP-002","cat":"Vertebrados","sub":"Reptil","name":"Lagartija ibérica","sci":"Podarcis hispanicus","fam":"Lacertidae","freq":"alta","key":"Lagartija pequeña y ágil (12-20 cm); cabeza aplastada para grietas","mnem":"La 'lagartija del muro': pequeña, parda y velocísima en las paredes — si ves algo pequeño pardo disparándose por un muro, es Podarcis","etym":"Podarcis (gr.) = pous (pie) + arkys (rapidez): 'pies rápidos' · hispanicus = 'hispánico'","notes":"Lacertidae confirmada. La lagartija más frecuente en Madrid. La cabeza aplastada + agilidad en muros son diagnósticos ecológicos.","hab":"Muros, roquedos, jardines urbanos; heliófila","q1":"¿Qué imagen mental evoca el mnemónico de Lagartija ibérica? Descríbelo con tus palabras.","t1":["lagartija","velocísima","disparándose","pequeña","paredes"],"q2":"¿Cuál es el rasgo más diagnóstico de Lagartija ibérica? Incluye al menos un término clave.","t2":["lagartija","aplastada","pequeña","cabeza","grietas"],"catf":"vertebrados","subf":"reptil"},{"id":"REP-003","cat":"Vertebrados","sub":"Reptil","name":"Víbora hocicuda","sci":"Vipera latastei","fam":"Viperidae","freq":"alta","key":"Hocico con apéndice nasal levantado — diagnóstico absoluto de especie","mnem":"La 'víbora con nariz respingona': el apéndice nasal levantado + cabeza triangular + zig-zag dorsal. La única víbora con nariz hacia arriba","etym":"Vipera (lat.) = 'víbora' (de vivipara = que pare vivos) · latastei = del herpetólogo Lataste","notes":"El apéndice nasal es absolutamente diagnóstico de V. latastei. La pupila vertical + cabeza triangular son diagnósticos de familia Viperidae. La única víbora presente en la Comunidad de Madrid.","hab":"Matorral mediterráneo seco, roquedos, bordes de bosque","q1":"Explica el mnemónico de Víbora hocicuda y qué rasgos te ayuda a recordar.","t1":["respingona","apéndice","levantado","triangular","víbora"],"q2":"Describe el carácter principal que identifica a Víbora hocicuda a primera vista.","t2":["diagnóstico","apéndice","levantado","hocico","absoluto"],"catf":"vertebrados","subf":"reptil"},{"id":"REP-004","cat":"Vertebrados","sub":"Reptil","name":"Culebra de collar","sci":"Natrix natrix","fam":"Colubridae","freq":"alta","key":"Collar amarillo o blanco-crema seguido de negro detrás de la cabeza — diagnóstico absoluto","mnem":"La 'culebra del collar amarillo': el collar bicolor (amarillo + negro) detrás de la cabeza es tan llamativo que parece accesorio — la única con collar","etym":"Natrix (lat.) = 'nadadora' · natrix = mismo nombre (denominación antigua)","notes":"El collar bicolor es absolutamente diagnóstico. Muy frecuente cerca del agua en Madrid. La tanatosis es un comportamiento evaluable.","hab":"Zonas húmedas: orillas de ríos, prados húmedos","q1":"¿Cómo usarías el mnemónico de Culebra de collar para no olvidarlo en el examen?","t1":["culebra","amarillo","collar","llamativo","bicolor"],"q2":"¿Qué rasgo de Culebra de collar es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["amarillo","diagnóstico","collar","blanco","seguido"],"catf":"vertebrados","subf":"reptil"},{"id":"REP-005","cat":"Vertebrados","sub":"Reptil","name":"Tortuga mora","sci":"Testudo graeca","fam":"Testudinidae","freq":"alta","key":"Caparazón alto y cupuliforme, pardo-amarillento con manchas oscuras","mnem":"La 'tortuga con espuelas en los muslos': los tubérculos córneos en cada muslo son el diagnóstico definitivo — la única tortuga terrestre nativa de España","etym":"Testudo (lat.) = 'tortuga' · graeca = 'griega': nombre histórico","notes":"Los espolones en los muslos son el diagnóstico de especie. Diferencia de T. hermanni: T. graeca = espolón en muslo; T. hermanni = sin espolón + 2 escamas supracaudales divididas.","hab":"Matorral mediterráneo seco; sur y este peninsular","q1":"¿Qué imagen mental evoca el mnemónico de Tortuga mora? Descríbelo con tus palabras.","t1":["tubérculos","diagnóstico","espuelas","tortuga","definitivo"],"q2":"¿Cuál es el rasgo más diagnóstico de Tortuga mora? Incluye al menos un término clave.","t2":["cupuliforme","caparazón","amarillento","manchas","oscuras"],"catf":"vertebrados","subf":"reptil"},{"id":"REP-006","cat":"Vertebrados","sub":"Reptil","name":"Camaleón común","sci":"Chamaeleo chamaeleon","fam":"Chamaeleonidae","freq":"alta","key":"Cuerpo comprimido lateralmente; ojos independientes con movimiento 360°","mnem":"El 'reptil con ojos de giroscópio': cada ojo gira independientemente — nadie más en el reino animal tiene eso","etym":"Chamaeleo (gr.) = chamai (en tierra) + leon (león): 'pequeño león de tierra'","notes":"Los ojos independientes + cola prensil + patas zigodáctilas son diagnósticos. El cambio de color es para comunicación (no solo camuflaje). Protegido en España.","hab":"Matorral mediterráneo; sur peninsular","q1":"Explica el mnemónico de Camaleón común y qué rasgos te ayuda a recordar.","t1":["independientemente","giroscópio","reptil","ojos","gira"],"q2":"Describe el carácter principal que identifica a Camaleón común a primera vista.","t2":["independientes","lateralmente","comprimido","movimiento","cuerpo"],"catf":"vertebrados","subf":"reptil"},{"id":"REP-007","cat":"Vertebrados","sub":"Reptil","name":"Galápago leproso","sci":"Mauremys leprosa","fam":"Geoemydidae","freq":"alta","key":"Caparazón ovalado pardo-oliváceo; plastrón amarillo con manchas oscuras","mnem":"La 'tortuga del río con rayas amarillas en el cuello': acuática, parda, con líneas amarillas en la cabeza — la tortuga de los ríos de Madrid","etym":"Mauremys (gr.) = maur (negro) + emys (tortuga) · leprosa = 'leprosa': por las manchas del cuello en adultos","notes":"El galápago más frecuente en ríos y humedales de Madrid. Las líneas amarillas en cabeza y cuello son diagnósticas. Amenazada por el galápago invasor de Florida.","hab":"Ríos, lagunas y embalses con vegetación acuática","q1":"¿Cómo usarías el mnemónico de Galápago leproso para no olvidarlo en el examen?","t1":["amarillas","tortuga","acuática","rayas","cuello"],"q2":"¿Qué rasgo de Galápago leproso es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["caparazón","ovalado","oliváceo","plastrón","amarillo"],"catf":"vertebrados","subf":"reptil"},{"id":"REP-008","cat":"Vertebrados","sub":"Reptil","name":"Geco común / Salamanquesa","sci":"Tarentola mauritanica","fam":"Phyllodactylidae","freq":"alta","key":"Lamelas adhesivas en los dedos (miles de setas de queratina con fuerzas de Van der Waals)","mnem":"La 'lagartija que desafía la gravedad': camina por el techo usando millones de pelos microscópicos — la nanotecnología de la naturaleza","etym":"Tarentola = de Tarento (ciudad italiana) · mauritanica = 'del norte de África'","notes":"Las lamelas adhesivas (setas de β-queratina con fuerzas de Van der Waals) son el tema científico más evaluable. Los ojos grandes sin párpados son diagnósticos de Gekkota.","hab":"Paredes de edificios, roquedos; mediterráneo; nocturno","q1":"¿Qué imagen mental evoca el mnemónico de Geco común / Salamanquesa? Descríbelo con tus palabras.","t1":["nanotecnología","lagartija","microscópicos","gravedad","desafía"],"q2":"¿Cuál es el rasgo más diagnóstico de Geco común / Salamanquesa? Incluye al menos un término clave.","t2":["adhesivas","lamelas","dedos"],"catf":"vertebrados","subf":"reptil"},{"id":"REP-009","cat":"Vertebrados","sub":"Reptil","name":"Culebra bastarda","sci":"Malpolon monspessulanus","fam":"Colubridae","freq":"alta","key":"La serpiente más larga de la Península (hasta 2 m); muy ágil y veloz","mnem":"La 'serpiente con cara de enfadada': los arcos supraorbitarios pronunciados le dan expresión ceñuda — la más grande y rápida de España","etym":"Malpolon (fr.) = nombre local · monspessulanus = 'de Montpellier'","notes":"Los arcos supraorbitarios + tamaño grande son diagnósticos. Opistodonta = colmillos traseros (no verdadera víbora). El veneno es para las presas, apenas peligroso para humanos.","hab":"Matorral mediterráneo, campos abiertos; heliófila","q1":"Explica el mnemónico de Culebra bastarda y qué rasgos te ayuda a recordar.","t1":["supraorbitarios","pronunciados","serpiente","enfadada","expresión"],"q2":"Describe el carácter principal que identifica a Culebra bastarda a primera vista.","t2":["serpiente","península","larga","veloz","ágil"],"catf":"vertebrados","subf":"reptil"},{"id":"HIS-A-001","cat":"Histología","sub":"Tejido animal","name":"Epitelio plano simple","sci":"Epithelium planum simplex","fam":"Tejido epitelial","freq":"alta","key":"Capa única de células aplanadas (escamosas); núcleo elipsoidal prominente","mnem":"Las 'baldosas con núcleo': células tan planas que se superponen como baldosas con un núcleo oscuro en el centro — el epitelio más fino y transparente","etym":"Epithelium (gr.) = epi (sobre) + thele (tetilla)","notes":"Reconocible por la capa única + células planas. Presente en cortes de vasos (endotelio) y en paredes de alvéolos.","q1":"¿Cómo usarías el mnemónico de Epitelio plano simple para no olvidarlo en el examen?","t1":["baldosas","superponen","transparente","células","núcleo"],"q2":"¿Qué rasgo de Epitelio plano simple es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["aplanadas","elipsoidal","prominente","células","única"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-002","cat":"Histología","sub":"Tejido animal","name":"Epitelio cilíndrico simple (intestino)","sci":"Epithelium cylindricum simplex (enterocito)","fam":"Tejido epitelial","freq":"muy_alta","key":"Capa única de células altas (cilíndricas); núcleo basal oval","mnem":"El 'velvet intestinal': el ribete estriado apical (microvellosidades) parece una pelusa en la parte superior de cada célula — y entre ellas las copas de moco","etym":"Cylindricum = 'cilíndrico': forma de las células","notes":"El epitelio intestinal es la preparación más evaluada en histología animal. Las microvellosidades + células caliciformes son diagnósticos. Identificar en cortes de intestino delgado (vellosidades + criptas).","q1":"¿Qué imagen mental evoca el mnemónico de Epitelio cilíndrico simple (intestino)? Descríbelo con tus palabras.","t1":["intestinal","estriado","velvet","ribete","apical"],"q2":"¿Cuál es el rasgo más diagnóstico de Epitelio cilíndrico simple (intestino)? Incluye al menos un término clave.","t2":["células","única","capa","núcleo","altas"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-003","cat":"Histología","sub":"Tejido animal","name":"Epidermis (epitelio queratinizado)","sci":"Epidermis (stratum corneum + basale + spinosum + granulosum)","fam":"Tejido epitelial","freq":"muy_alta","key":"Capa córnea (stratum corneum): células muertas SIN NÚCLEO llenas de queratina (rosa)","mnem":"La 'piel en 4 capas sin núcleos en la superficie': de abajo arriba — basal (activa) → espinosa (puentes) → granulosa (gránulos) → córnea (muerta, SIN núcleo). La queratinización avanza hacia arriba","etym":"Epidermis (gr.) = epi + derma: 'sobre la piel'","notes":"Preparación de piel = la más clásica de histología animal. La capa córnea sin núcleos (células muertas) es el diagnóstico del epitelio queratinizado. Diferenciar de epitelio estratificado no queratinizado (esófago = células superficiales CON núcleo).","q1":"Explica el mnemónico de Epidermis (epitelio queratinizado) y qué rasgos te ayuda a recordar.","t1":["queratinización","superficie","núcleos","granulosa","capas"],"q2":"Describe el carácter principal que identifica a Epidermis (epitelio queratinizado) a primera vista.","t2":["células","queratina","córnea","muertas","capa"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-004","cat":"Histología","sub":"Tejido animal","name":"Epitelio estratificado plano no queratinizado","sci":"Epithelium stratificatum planum non cornificatum","fam":"Tejido epitelial","freq":"alta","key":"Múltiples capas celulares; células superficiales planas CON NÚCLEO (no queratinizadas)","mnem":"El 'sándwich húmedo de muchas capas': capas de células que se aplanan hacia arriba pero conservan el núcleo — para resistir el roce sin secarse","etym":"Stratificatum = 'en capas' · non cornificatum = 'no queratinizado'","notes":"Diferencia clave vs. epidermis: no queratinizado = células superficiales con núcleo; queratinizado = células superficiales sin núcleo (corneocitos).","q1":"¿Cómo usarías el mnemónico de Epitelio estratificado plano no queratinizado para no olvidarlo en el examen?","t1":["sándwich","húmedo","muchas","conservan","células"],"q2":"¿Qué rasgo de Epitelio estratificado plano no queratinizado es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["superficiales","múltiples","celulares","células","capas"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-005","cat":"Histología","sub":"Tejido animal","name":"Tejido conjuntivo laxo","sci":"Textus connectivus laxus","fam":"Tejido conjuntivo","freq":"alta","key":"Pocas células dispersas en abundante matriz extracelular (fibras + sustancia fundamental)","mnem":"El 'relleno rosa del cuerpo': rosa claro con células dispersas y fibras entrelazadas sin orden — el tejido que rellena los espacios y envuelve los órganos","etym":"Connectivus = 'que conecta' · laxus = 'laxo, relajado'","notes":"El tejido conjuntivo laxo es el más frecuente en las preparaciones mixtas. Abundante matriz rosa + células dispersas son diagnósticos. Está siempre bajo el epitelio.","q1":"¿Qué imagen mental evoca el mnemónico de Tejido conjuntivo laxo? Descríbelo con tus palabras.","t1":["entrelazadas","relleno","dispersas","cuerpo","células"],"q2":"¿Cuál es el rasgo más diagnóstico de Tejido conjuntivo laxo? Incluye al menos un término clave.","t2":["extracelular","dispersas","abundante","células","pocas"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-006","cat":"Histología","sub":"Tejido animal","name":"Tejido conjuntivo denso (tendón)","sci":"Textus connectivus densus regularis (tendo)","fam":"Tejido conjuntivo","freq":"alta","key":"Haces de fibras de colágeno paralelas y compactos (rellena casi todo el campo)","mnem":"El 'cable de acero rosa': haces paralelos de colágeno tan apretados que apenas se ven las células entre ellos — la resistencia a la tracción del cuerpo","etym":"Densus = 'denso' · regularis = 'regular, ordenado'","notes":"El tendón es la preparación tipo de tejido conjuntivo denso regular. Las fibras paralelas compactas son diagnósticas. Tricrómico de Masson → campo azul brillante uniforme.","q1":"Explica el mnemónico de Tejido conjuntivo denso (tendón) y qué rasgos te ayuda a recordar.","t1":["paralelos","apretados","resistencia","colágeno","cable"],"q2":"Describe el carácter principal que identifica a Tejido conjuntivo denso (tendón) a primera vista.","t2":["paralelas","colágeno","compactos","fibras","haces"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-007","cat":"Histología","sub":"Tejido animal","name":"Cartílago hialino","sci":"Cartilago hyalina","fam":"Tejido conjuntivo especializado","freq":"muy_alta","key":"Condrocitos en lagunas (espacios redondeados) dentro de la matriz homogénea basófila","mnem":"El 'queso con agujeros azules': fondo azul-homogéneo (la matriz) con huecos redondos (lagunas) donde viven los condrocitos — como aceitunas en gelatina azul","etym":"Cartilago (lat.) = 'cartílago' · hyalina (gr.) = 'vítreo, transparente'","notes":"El cartílago hialino es la preparación más frecuente de tejido conjuntivo especializado. Condrocitos en lagunas + matriz basófila azul son diagnósticos absolutos.","q1":"¿Cómo usarías el mnemónico de Cartílago hialino para no olvidarlo en el examen?","t1":["agujeros","homogéneo","condrocitos","queso","azules"],"q2":"¿Qué rasgo de Cartílago hialino es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["condrocitos","homogénea","lagunas","basófila","dentro"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-008","cat":"Histología","sub":"Tejido animal","name":"Tejido óseo compacto (osteona)","sci":"Os compactum (Osteon / Sistema de Havers)","fam":"Tejido conjuntivo especializado","freq":"muy_alta","key":"Osteonas: laminillas concéntricas mineralizadas en torno al canal de Havers central","mnem":"El 'tronco de árbol del hueso': la osteona tiene anillos concéntricos (laminillas) alrededor de un canal central con sangre — como los anillos de un árbol alrededor de la médula","etym":"Osteon (gr.) = 'hueso' · Havers = del anatomista Clopton Havers (s. XVII)","notes":"Las osteonas con canal de Havers + laminillas + osteocitos en lagunas son diagnóstico absoluto de hueso compacto. Preparación de hueso descalcificado (ácido nítrico) + HE.","q1":"¿Qué imagen mental evoca el mnemónico de Tejido óseo compacto (osteona)? Descríbelo con tus palabras.","t1":["concéntricos","tronco","alrededor","osteona","anillos"],"q2":"¿Cuál es el rasgo más diagnóstico de Tejido óseo compacto (osteona)? Incluye al menos un término clave.","t2":["mineralizadas","concéntricas","laminillas","osteonas","central"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-009","cat":"Histología","sub":"Tejido animal","name":"Tejido adiposo (adipocito unilocular)","sci":"Textus adiposus (adipocyte unilocularis)","fam":"Tejido conjuntivo especializado","freq":"alta","key":"Células enormes con una sola vacuola lipídica que ocupa casi todo el volumen","mnem":"El 'tejido de las células vacías con núcleo aplastado': los lípidos se disuelven en la preparación → las células quedan vacías con el núcleo pegado a la pared como un anillo de sello","etym":"Adeps (lat.) = 'grasa' · unilocular = 'con una sola vacuola'","notes":"El aspecto de 'anillo de sello' (vacuola enorme + núcleo periférico) es diagnóstico. Los lípidos se disuelven con alcohol en preparaciones de parafina → vacuoles vacías.","q1":"Explica el mnemónico de Tejido adiposo (adipocito unilocular) y qué rasgos te ayuda a recordar.","t1":["preparación","aplastado","células","tejido","disuelven"],"q2":"Describe el carácter principal que identifica a Tejido adiposo (adipocito unilocular) a primera vista.","t2":["células","enormes","lipídica","vacuola","volumen"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-010","cat":"Histología","sub":"Tejido animal","name":"Músculo estriado esquelético","sci":"Musculus striatus skeletalis","fam":"Tejido muscular","freq":"muy_alta","key":"Fibras largas y cilíndricas con múltiples núcleos PERIFÉRICOS","mnem":"El 'tejido de las barras de cebra': fibras largas con rayas transversales (estrías) y muchos núcleos en el BORDE — las barras = alternancia de actina y miosina en sarcómeros","etym":"Musculus (lat.) = 'músculo' (dim. de mus = ratón) · striatus = 'estriado'","notes":"Las estrías transversales + núcleos periféricos múltiples son absolutamente diagnósticos. Diferenciar de cardíaco (discos intercalares, núcleo central) y liso (sin estrías, núcleo central).","q1":"¿Cómo usarías el mnemónico de Músculo estriado esquelético para no olvidarlo en el examen?","t1":["transversales","tejido","barras","alternancia","fibras"],"q2":"¿Qué rasgo de Músculo estriado esquelético es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["cilíndricas","periféricos","múltiples","fibras","largas"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-011","cat":"Histología","sub":"Tejido animal","name":"Músculo cardíaco","sci":"Musculus cardiacus","fam":"Tejido muscular","freq":"alta","key":"Fibras ramificadas y anastomosadas (no paralelas como el esquelético)","mnem":"El 'tejido de los discos intercalares': si ves fibras estriadas con rayas oscuras perpendiculares más gruesas y espaciadas (discos), y el núcleo está en el CENTRO — es cardíaco","etym":"Cardiacus (gr.) = kardia (corazón)","notes":"Los discos intercalares son el diagnóstico absoluto de músculo cardíaco. El núcleo central (1-2) diferencia del esquelético (múltiples periféricos).","q1":"¿Qué imagen mental evoca el mnemónico de Músculo cardíaco? Descríbelo con tus palabras.","t1":["perpendiculares","intercalares","estriadas","tejido","discos"],"q2":"¿Cuál es el rasgo más diagnóstico de Músculo cardíaco? Incluye al menos un término clave.","t2":["anastomosadas","ramificadas","fibras"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-012","cat":"Histología","sub":"Tejido animal","name":"Músculo liso","sci":"Musculus laevis","fam":"Tejido muscular","freq":"alta","key":"Células fusiformes con UN único núcleo CENTRAL alargado","mnem":"El 'tejido sin rayas con un solo núcleo central': sin estrías + UN núcleo en el centro = músculo liso. El del intestino y los vasos sanguíneos","etym":"Laevis (lat.) = 'liso, sin estrías'","notes":"Ausencia de estrías + núcleo central único son los rasgos diagnósticos definitivos. Muy frecuente en preparaciones de pared intestinal (capa muscular de la muscularis mucosae y muscularis propia).","q1":"Explica el mnemónico de Músculo liso y qué rasgos te ayuda a recordar.","t1":["tejido","central","núcleo","estrías","rayas"],"q2":"Describe el carácter principal que identifica a Músculo liso a primera vista.","t2":["fusiformes","células","alargado","central","núcleo"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-013","cat":"Histología","sub":"Tejido animal","name":"Neurona y tejido nervioso","sci":"Neuron (soma + axón + dendritas)","fam":"Tejido nervioso","freq":"muy_alta","key":"Soma (cuerpo celular): grande, con núcleo grande, nucléolo prominente y cuerpos de Nissl (RER)","mnem":"La 'estrella con cola larga': el soma neuronal con sus muchas dendritas (estrella) y el axón largo y único (cola) — la célula más especializada del cuerpo","etym":"Neuron (gr.) = 'nervio, fibra nerviosa'","notes":"La neurona es la preparación de tejido nervioso más frecuente. Soma con núcleo grande + nucléolo + cuerpos de Nissl + axón largo son diagnósticos. Saber la diferencia soma/axón/dendrita.","q1":"¿Cómo usarías el mnemónico de Neurona y tejido nervioso para no olvidarlo en el examen?","t1":["estrella","especializada","neuronal","dendritas","larga"],"q2":"¿Qué rasgo de Neurona y tejido nervioso es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["prominente","nucléolo","grande","núcleo","soma"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-014","cat":"Histología","sub":"Tejido animal","name":"Sangre (frotis sanguíneo)","sci":"Sanguis (eritrocitos + leucocitos + plaquetas)","fam":"Tejido conjuntivo líquido","freq":"alta","key":"Eritrocitos: bicóncavos, sin núcleo, rosa eosinófilos con zona central más clara (los más abundantes)","mnem":"El 'ejército rojo con generales nucleados': mar de eritrocitos rojos bicóncavos con leucocitos dispersos (con núcleo) y plaquetitas diminutas — el frotis periférico","etym":"Sanguis (lat.) = 'sangre'","notes":"Frotis sanguíneo = preparación clásica de laboratorio. Identificar: eritrocitos (sin núcleo), neutrófilos (núcleo multilobulado), linfocitos (núcleo redondo grande), monocitos (núcleo reniforme), eosinófilos (gránulos rosas brillantes), basófilos (gránulos azul-negro), plaquetas.","q1":"¿Qué imagen mental evoca el mnemónico de Sangre (frotis sanguíneo)? Descríbelo con tus palabras.","t1":["eritrocitos","ejército","generales","nucleados","bicóncavos"],"q2":"¿Cuál es el rasgo más diagnóstico de Sangre (frotis sanguíneo)? Incluye al menos un término clave.","t2":["eritrocitos","bicóncavos","eosinófilos","núcleo","central"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-015","cat":"Histología","sub":"Tejido animal","name":"Epitelio pseudoestratificado ciliado (tráquea)","sci":"Epithelium pseudostratificatum ciliatum (trachea)","fam":"Tejido epitelial respiratorio","freq":"muy_alta","key":"Parece estratificado (varios núcleos a diferentes alturas) pero TODAS las células tocan la membrana basal","mnem":"El 'epitelio que engaña': parece tener varias capas (núcleos a diferentes alturas) pero si sigues cada célula hasta abajo, todas llegan a la membrana basal — el 'mago' de los epitelios","etym":"Pseudo (gr.) = falso; estratificado = en capas. 'Falso estratificado': parece en capas pero no lo es","notes":"El epitelio respiratorio es la preparación de epitelio más evaluada después del intestinal y la piel. Los cilios + la pseudoestratificación + las células caliciformes son diagnósticos. La función del 'ascensor mucociliar' (moco + cilios barren partículas hacia la faringe) es evaluable.","q1":"Explica el mnemónico de Epitelio pseudoestratificado ciliado (tráquea) y qué rasgos te ayuda a recordar.","t1":["epitelio","engaña","parece","varias","tener"],"q2":"Describe el carácter principal que identifica a Epitelio pseudoestratificado ciliado (tráquea) a primera vista.","t2":["estratificado","parece","células","membrana","todas"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-016","cat":"Histología","sub":"Tejido animal","name":"Glándula exocrina serosa (páncreas exocrino)","sci":"Pancreas exocrinum (acinos serosos)","fam":"Tejido glandular exocrino","freq":"alta","key":"Acinos serosos: grupos redondeados de células piramidales con núcleo basal y gránulos de zimógeno apicales","mnem":"El 'racimo de células bicolores con célula pequeña en el centro': el acino pancreático tiene la base azul (RER fabricando enzimas) y el ápice rosado (gránulos de enzimas listas). La célula centroacinosa en el centro es única del páncreas","etym":"Acino (lat.) = 'baya de uva': la forma de cada unidad secretora, como una uva dentro del racimo","notes":"El páncreas exocrino es la preparación clásica de glándula exocrina serosa. Las células centroacinosas son absolutamente diagnósticas del páncreas (ninguna otra glándula las tiene). El páncreas endocrino (islotes de Langerhans) también puede estar en la misma preparación.","q1":"¿Cómo usarías el mnemónico de Glándula exocrina serosa (páncreas exocrino) para no olvidarlo en el examen?","t1":["bicolores","pancreático","centroacinosa","células","racimo"],"q2":"¿Qué rasgo de Glándula exocrina serosa (páncreas exocrino) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["redondeados","piramidales","serosos","acinos","grupos"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-017","cat":"Histología","sub":"Tejido animal","name":"Riñón — corpúsculo de Malpighi (glomérulo renal)","sci":"Corpusculum renale (Glomerulus + Capsula Bowmani)","fam":"Tejido renal — nefrona","freq":"muy_alta","key":"Corpúsculo renal: estructura circular con dos partes: glomérulo (masa de capilares) + cápsula de Bowman (doble pared que","mnem":"La 'pelota de lana dentro de una copa': el glomérulo (ovillo de capilares) está metido dentro de la cápsula de Bowman (la copa). La filtración ocurre desde la 'pelota' hacia la 'copa'","etym":"Malpighi = del anatomista italiano Marcello Malpighi (1628-1694), descubridor del glomérulo · Bowman = del anatomista inglés William Bowman (1816-1892)","notes":"El riñón es una de las preparaciones histológicas más frecuentes en colecciones de IES. El corpúsculo de Malpighi (glomérulo + cápsula de Bowman) es el componente más llamativo visualmente. El proceso de ultrafiltración glomerular es evaluable.","q1":"¿Qué imagen mental evoca el mnemónico de Riñón — corpúsculo de Malpighi (glomérulo renal)? Descríbelo con tus palabras.","t1":["glomérulo","pelota","dentro","filtración","lana"],"q2":"¿Cuál es el rasgo más diagnóstico de Riñón — corpúsculo de Malpighi (glomérulo renal)? Incluye al menos un término clave.","t2":["corpúsculo","estructura","circular","glomérulo","renal"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-018","cat":"Histología","sub":"Tejido animal","name":"Fibrocartílago (disco intervertebral / menisco)","sci":"Fibrocartilago (meniscus / discus intervertebralis)","fam":"Tejido conjuntivo especializado","freq":"alta","key":"Abundantes haces de fibras de colágeno tipo I visibles entre los condrocitos — diagnóstico diferencial con hialino","mnem":"El 'cartílago con rayas de colágeno': a diferencia del cartílago hialino (fondo azul homogéneo, sin rayas), el fibrocartílago tiene rayas de colágeno tipo I claramente visibles entre los condrocitos. El colágeno lo delata","etym":"Fibro = del latín 'fibra'; cartílago = del latín 'cartilago'. El cartílago más resistente, con fibras de colágeno visibles","notes":"El fibrocartílago es el tipo de cartílago que más aparece en colecciones de prácticas (meniscos, discos intervertebrales). La distinción de los tres tipos de cartílago (hialino/elástico/fibrocartílago) es una pregunta clásica.","q1":"Explica el mnemónico de Fibrocartílago (disco intervertebral / menisco) y qué rasgos te ayuda a recordar.","t1":["fibrocartílago","cartílago","diferencia","colágeno","claramente"],"q2":"Describe el carácter principal que identifica a Fibrocartílago (disco intervertebral / menisco) a primera vista.","t2":["abundantes","condrocitos","diagnóstico","diferencial","colágeno"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-019","cat":"Histología","sub":"Tejido animal","name":"Ganglio linfático (tejido linfoide secundario)","sci":"Nodus lymphaticus","fam":"Tejido linfoide","freq":"alta","key":"Estructura encapsulada (cápsula de tejido conjuntivo) con trabéculas que parten hacia el interior","mnem":"La 'estructura de cebolla con lunares claros': la cápsula exterior + los folículos linfáticos redondos con centro claro (germinal) son como una cebolla con burbujas dentro. Los centros claros = donde los linfocitos B proliferan activamente","etym":"Nodo (lat.) = 'nudo, nódulo' · linfático = del latín 'lympha' (agua limpia): 'nudo del sistema de aguas limpias'","notes":"El ganglio linfático es la preparación clásica de tejido linfoide. Los centros germinales claros dentro de los folículos oscuros son los más diagnósticos. El reconocimiento de las zonas B (folículos) y T (paracorteza) es evaluable.","q1":"¿Cómo usarías el mnemónico de Ganglio linfático (tejido linfoide secundario) para no olvidarlo en el examen?","t1":["estructura","cebolla","linfáticos","lunares","folículos"],"q2":"¿Qué rasgo de Ganglio linfático (tejido linfoide secundario) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["encapsulada","estructura","trabéculas","interior","parten"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-A-020","cat":"Histología","sub":"Tejido animal","name":"Hígado — lobulillo hepático clásico","sci":"Hepar (lobulus hepaticus classicus)","fam":"Tejido hepático","freq":"muy_alta","key":"Lobulillo hexagonal: vena central en el centro + tríadas portales en los ángulos del hexágono","mnem":"El 'pastel de radios de bicicleta con estrellas en las esquinas': la vena central en el centro, los hepatocitos en radios y las tríadas portales (triplete de tubos) en los 6 ángulos del hexágono — como una rueda de bicicleta vista desde arriba","etym":"Hepar (gr.) = 'hígado' · Lobulillo = unidad funcional del hígado · Tríada portal = por las 3 estructuras vasculares (vena porta, arteria hepática, conducto biliar)","notes":"El hígado es una de las preparaciones más frecuentes en colecciones de IES. El lobulillo con vena central + tríadas portales es la estructura más evaluada. La identificación de las 3 estructuras de la tríada portal es clave.","q1":"¿Qué imagen mental evoca el mnemónico de Hígado — lobulillo hepático clásico? Descríbelo con tus palabras.","t1":["bicicleta","estrellas","hepatocitos","pastel","esquinas"],"q2":"¿Cuál es el rasgo más diagnóstico de Hígado — lobulillo hepático clásico? Incluye al menos un término clave.","t2":["lobulillo","hexagonal","central","portales","tríadas"],"catf":"histología","subf":"tejido animal","hab":""},{"id":"HIS-V-001","cat":"Histología","sub":"Tejido vegetal","name":"Meristema apical","sci":"Meristema apical primario","fam":"Tejido meristemático","freq":"alta","key":"Células pequeñas e isodiamétricas (cúbicas) con núcleo grande y vacuola muy pequeña","mnem":"Las 'células bebé del vegetal': pequeñas, cúbicas, con el núcleo enorme — y siempre dividiendo","etym":"Meristem (gr.) = merizein (dividir): tejido que se divide","notes":"Preparación clásica de ápice radicular de cebolla (Allium cepa). Las células en mitosis son el rasgo más evaluado. Identificar fases de la mitosis.","q1":"Explica el mnemónico de Meristema apical y qué rasgos te ayuda a recordar.","t1":["células","pequeñas","vegetal","dividiendo","cúbicas"],"q2":"Describe el carácter principal que identifica a Meristema apical a primera vista.","t2":["isodiamétricas","pequeñas","células","núcleo","vacuola"],"catf":"histología","subf":"tejido vegetal","hab":""},{"id":"HIS-V-002","cat":"Histología","sub":"Tejido vegetal","name":"Cambium vascular","sci":"Cambium vascular (meristema lateral)","fam":"Tejido meristemático","freq":"alta","key":"Capa de células en división entre xilema y floema (zona de transición)","mnem":"El 'fabricante de madera y corteza': la fina capa entre la madera y la corteza que produce ambas — la fábrica del engrosamiento del tronco","etym":"Cambium (lat.) = 'cambio, intercambio': tejido que genera cambios","notes":"Visible en cortes de tallo de plantas leñosas. El cambium produce los anillos de crecimiento (1 anillo = 1 año = xilema claro de primavera + xilema oscuro de verano).","q1":"¿Cómo usarías el mnemónico de Cambium vascular para no olvidarlo en el examen?","t1":["fabricante","engrosamiento","corteza","madera","produce"],"q2":"¿Qué rasgo de Cambium vascular es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["división","células","xilema","capa","floema"],"catf":"histología","subf":"tejido vegetal","hab":""},{"id":"HIS-V-003","cat":"Histología","sub":"Tejido vegetal","name":"Parénquima clorofílico (mesófilo)","sci":"Parénquima en empalizada + esponjoso","fam":"Tejido fundamental","freq":"muy_alta","key":"Células vivas con numerosos cloroplastos (verdes)","mnem":"El 'tejido verde de la hoja en dos pisos': empalizada apretada arriba (más luz) + esponjoso con huecos abajo (intercambio gaseoso)","etym":"Parenchyma (gr.) = 'tejido relleno' · clorofílico = 'con clorofila'","notes":"La preparación de corte de hoja es la más frecuente en histología vegetal. Saber diferenciar empalizada (superior, compacta) de esponjoso (inferior, con huecos) en el mismo corte.","q1":"¿Qué imagen mental evoca el mnemónico de Parénquima clorofílico (mesófilo)? Descríbelo con tus palabras.","t1":["empalizada","tejido","apretada","esponjoso","verde"],"q2":"¿Cuál es el rasgo más diagnóstico de Parénquima clorofílico (mesófilo)? Incluye al menos un término clave.","t2":["cloroplastos","numerosos","células","vivas"],"catf":"histología","subf":"tejido vegetal","hab":""},{"id":"HIS-V-004","cat":"Histología","sub":"Tejido vegetal","name":"Parénquima de reserva","sci":"Parénquima amilífero (amiloplasto)","fam":"Tejido fundamental","freq":"alta","key":"Células grandes isodiamétricas con vacuola grande; poca o ninguna clorofila","mnem":"El 'tejido despensa': grandes células llenas de almidón — ponle lugol y se pone negro azulado","etym":"Amilífero = 'portador de almidón' (amilum = almidón en latín)","notes":"La reacción con lugol (I₂) es diagnóstica. El parénquima de patata es el material más fácil para demostrar almidón al microscopio.","q1":"Explica el mnemónico de Parénquima de reserva y qué rasgos te ayuda a recordar.","t1":["despensa","tejido","grandes","células","almidón"],"q2":"Describe el carácter principal que identifica a Parénquima de reserva a primera vista.","t2":["isodiamétricas","células","grandes","vacuola","clorofila"],"catf":"histología","subf":"tejido vegetal","hab":""},{"id":"HIS-V-005","cat":"Histología","sub":"Tejido vegetal","name":"Esclerénquima (fibras y esclereidas)","sci":"Sclerenchyma (Fiber + Sclereid)","fam":"Tejido de sostén","freq":"alta","key":"Células muertas con pared muy engrosada y lignificada (dura al corte)","mnem":"El 'hormigón del vegetal': células muertas con pared tan gruesa que el lumen casi desaparece — lo que hace dura la madera","etym":"Sclero (gr.) = 'duro, sólido' + enchyma = tejido: 'tejido duro'","notes":"La tinción roja de la lignina con safranina es el marcador más diagnóstico. Las esclereidas forman las 'arenillas' de la pera. Diferencia clave vs. colénquima: células muertas + lignificadas = inextensibles.","q1":"¿Cómo usarías el mnemónico de Esclerénquima (fibras y esclereidas) para no olvidarlo en el examen?","t1":["hormigón","vegetal","células","desaparece","muertas"],"q2":"¿Qué rasgo de Esclerénquima (fibras y esclereidas) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["lignificada","engrosada","células","muertas","pared"],"catf":"histología","subf":"tejido vegetal","hab":""},{"id":"HIS-V-006","cat":"Histología","sub":"Tejido vegetal","name":"Colénquima","sci":"Collenchyma (angular / laminar / lagunar)","fam":"Tejido de sostén","freq":"media","key":"Células vivas con pared celulósica engrosada solo en ángulos (angular) o caras (laminar)","mnem":"El 'sostén flexible del tallo joven': paredes engrosadas en las esquinas pero sin lignina — puede estirarse. Las 'hebras' del apio son colénquima angular","etym":"Kolla (gr.) = 'cola, pegamento': por el aspecto gomoso de las paredes","notes":"El apio es el material clásico para observar colénquima angular. Diferencia clave vs. esclerénquima: células vivas + sin lignina = flexible y extensible.","q1":"¿Qué imagen mental evoca el mnemónico de Colénquima? Descríbelo con tus palabras.","t1":["flexible","engrosadas","sostén","paredes","esquinas"],"q2":"¿Cuál es el rasgo más diagnóstico de Colénquima? Incluye al menos un término clave.","t2":["celulósica","células","engrosada","vivas","ángulos"],"catf":"histología","subf":"tejido vegetal","hab":""},{"id":"HIS-V-007","cat":"Histología","sub":"Tejido vegetal","name":"Epidermis vegetal con estomas","sci":"Epidermis + estomas + tricomas","fam":"Tejido de revestimiento","freq":"muy_alta","key":"Capa única de células compactas y aplanadas sin clorofila; cutícula brillante en el exterior","mnem":"La 'piel transparente de la hoja con válvulas verdes': capa incolora con estomas como labios verdes que se abren y cierran","etym":"Epidermis (gr.) = epi (sobre) + derma (piel): 'sobre la piel de la hoja'","notes":"La preparación de epidermis (peeling de cebolla, tradescantia) es la más clásica. Los estomas son absolutamente diagnósticos. Identificar células guarda vs. células epidérmicas normales.","q1":"Explica el mnemónico de Epidermis vegetal con estomas y qué rasgos te ayuda a recordar.","t1":["transparente","válvulas","incolora","piel","verdes"],"q2":"Describe el carácter principal que identifica a Epidermis vegetal con estomas a primera vista.","t2":["compactas","aplanadas","clorofila","células","brillante"],"catf":"histología","subf":"tejido vegetal","hab":""},{"id":"HIS-V-008","cat":"Histología","sub":"Tejido vegetal","name":"Xilema (vasos y traqueidas)","sci":"Xylem (Vessel element + Tracheid)","fam":"Tejido conductor","freq":"muy_alta","key":"Células muertas sin protoplasto; pared muy engrosada y lignificada","mnem":"El 'sistema de tuberías de agua roja': tubos muertos con engrosamientos en espiral que se tiñen de rojo — la corriente transpiradora sube por aquí","etym":"Xylon (gr.) = 'madera': el tejido que forma la madera","notes":"El haz vascular (xilema + floema) es la preparación más evaluada en histología vegetal. Safranina roja = xilema. Siempre saber la posición: xilema adaxial (haz superior) en hojas.","q1":"¿Cómo usarías el mnemónico de Xilema (vasos y traqueidas) para no olvidarlo en el examen?","t1":["engrosamientos","tuberías","transpiradora","sistema","muertos"],"q2":"¿Qué rasgo de Xilema (vasos y traqueidas) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["protoplasto","lignificada","células","engrosada","muertas"],"catf":"histología","subf":"tejido vegetal","hab":""},{"id":"HIS-V-009","cat":"Histología","sub":"Tejido vegetal","name":"Floema (tubos cribosos y células acompañantes)","sci":"Phloem (Sieve tube + Companion cell)","fam":"Tejido conductor","freq":"alta","key":"Tubos cribosos: células vivas sin núcleo con placa cribosa perforada en los extremos","mnem":"El 'sistema de tuberías de azúcar verde': tubos vivos sin núcleo que llevan los azúcares de las hojas al resto — el contrario del xilema en posición y función","etym":"Phloios (gr.) = 'corteza': tejido que forma la corteza interna","notes":"El floema es más difícil de identificar que el xilema. Clave: tinción verde (fast green) + células vivas con contenido + en posición abaxial.","q1":"¿Qué imagen mental evoca el mnemónico de Floema (tubos cribosos y células acompañantes)? Descríbelo con tus palabras.","t1":["tuberías","sistema","azúcar","azúcares","verde"],"q2":"¿Cuál es el rasgo más diagnóstico de Floema (tubos cribosos y células acompañantes)? Incluye al menos un término clave.","t2":["cribosos","células","perforada","tubos","núcleo"],"catf":"histología","subf":"tejido vegetal","hab":""},{"id":"HIS-V-010","cat":"Histología","sub":"Tejido vegetal","name":"Tejido suberoso (corcho / felema)","sci":"Phellema (Felema)","fam":"Tejido de revestimiento secundario","freq":"media","key":"Células muertas en la madurez; paredes impregnadas de suberina (lipídica, impermeable)","mnem":"El 'lego del corcho': células rectangulares apiladas en columnas perfectas, muertas e impermeables — exactamente el tapón de corcho de la botella de vino","etym":"Phellema (gr.) = phellos (corcho) · suberina = de Quercus suber","notes":"Visible en cortes de tallo leñoso. La suberina (Sudán III → rojo) y la disposición en filas radiales son diagnósticos.","q1":"Explica el mnemónico de Tejido suberoso (corcho / felema) y qué rasgos te ayuda a recordar.","t1":["rectangulares","impermeables","exactamente","células","apiladas"],"q2":"Describe el carácter principal que identifica a Tejido suberoso (corcho / felema) a primera vista.","t2":["impregnadas","células","muertas","madurez","paredes"],"catf":"histología","subf":"tejido vegetal","hab":""},{"id":"HIS-V-011","cat":"Histología","sub":"Tejido vegetal","name":"Polen (grano de polen)","sci":"Granum pollinis (grano de polen)","fam":"Tejido reproductor","freq":"media","key":"Estructuras diminutas (10-100 µm) con pared externa resistente (esporodermis)","mnem":"La 'huella dactilar de la planta': cada especie tiene un patrón de ornamentación única de la pared — la palinología identifica especies por el polen fósil","etym":"Pollen (lat.) = 'polvo fino, harina': por el aspecto en masa","notes":"Puede aparecer en preparaciones de anteras. Los tipos de apertura (tricolpado en dicotiledóneas, monoporado en monocotiledóneas) son muy evaluables.","q1":"¿Cómo usarías el mnemónico de Polen (grano de polen) para no olvidarlo en el examen?","t1":["ornamentación","dactilar","palinología","huella","especie"],"q2":"¿Qué rasgo de Polen (grano de polen) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["estructuras","diminutas","resistente","externa","pared"],"catf":"histología","subf":"tejido vegetal","hab":""},{"id":"HIS-V-012","cat":"Histología","sub":"Tejido vegetal","name":"Tejido secretor (canales resiníferos)","sci":"Tejido secretor (canal resinífero / laticífero)","fam":"Tejido secretor","freq":"media","key":"Canales resiníferos: espacios entre células secretoras con resina (pinos)","mnem":"Los 'mini-fábricas químicas del vegetal': canales rodeados de células que producen resinas o látex — la defensa química de la planta","etym":"Secretor = de 'secretar' (lat. secretum = separado, segregado)","notes":"Los canales resiníferos de pinos son visibles en c
