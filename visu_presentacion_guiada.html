lomita)","notes":"La prueba diferencial es el HCl en frío: caliza → efervescencia fuerte; dolomía → efervescencia débil o nula. PRUEBAS: (1) HCl en frío: NO efervescencia (o muy débil). (2) Raspar en polvo + HCl: efervescencia. (3) Color gris a beige, igual que caliza. CONFUSIÓN CON: Caliza — EFERVESCENCIA VIVA al HCl en frío. La dolomía NO. Sin más pruebas son prácticamente indistinguibles visualmente.","q1":"¿Cómo usarías el mnemónico de Dolomía para no olvidarlo en el examen?","t1":["caliza","reacia","ácido","dolomía","frío"],"q2":"¿Qué rasgo de Dolomía es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["aspecto","similar","caliza","crema","gris"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-025","cat":"Geología","sub":"Roca","name":"Travertino","sci":"Travertino","fam":"Sedimentaria carbonatada (química)","freq":"baja","key":"Estructura porosa con huecos redondeados (moldes de vegetales o burbujas)","mnem":"La 'caliza esponjosa de los baños termales': porosa con huecos de plantas y bandas de colores claros","etym":"Del latín 'lapis tiburtinus' (piedra de Tívoli, Italia)","notes":"Los huecos y el bandeado son diagnósticos. Presente en algunas fuentes termales de la Comunidad de Madrid. PRUEBAS: (1) Estructura POROSA con huecos redondeados (moldes de raíces, burbujas de CO₂). (2) Reacciona al HCl. (3) Bandeado paralelo. (4) A menudo depositado por fuentes. CONFUSIÓN CON: Caliza — sin porosidad tan característica. Pumita — también porosa pero vítrea y no reacciona al HCl. Diatomita — porosa pero sin reacción al HCl.","q1":"¿Qué imagen mental evoca el mnemónico de Travertino? Descríbelo con tus palabras.","t1":["esponjosa","termales","caliza","baños","porosa"],"q2":"¿Cuál es el rasgo más diagnóstico de Travertino? Incluye al menos un término clave.","t2":["estructura","redondeados","porosa","huecos"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-026","cat":"Geología","sub":"Roca","name":"Granodiorita","sci":"Granodiorita","fam":"Ígnea plutónica (ácida-intermedia)","freq":"alta","key":"Similar al granito pero más oscura: más plagioclasa que ortosa, más biotita+hornblenda","mnem":"El 'granito un poco más oscuro': más minerales oscuros que el granito pero aún con cuarzo visible","etym":"Combinación de 'granito' y 'diorita'","notes":"MUY RELEVANTE para Madrid: es la roca predominante en gran parte de la Sierra de Guadarrama. Puede aparecer etiquetada como 'granito' en sentido popular. PRUEBAS: (1) Similar al granito pero más oscura. (2) Más plagioclasa (blanca-grisácea) que ortosa (rosada). (3) Más hornblenda y biotita que el granito. (4) Cuarzo presente. CONFUSIÓN CON: Granito — más rosado (ortosa), más claro. Diorita — sin cuarzo; más oscura aún. Tonalita — también con plagioclasa dominante pero aún más oscura.","q1":"Explica el mnemónico de Granodiorita y qué rasgos te ayuda a recordar.","t1":["minerales","granito","oscuro","oscuros","poco"],"q2":"Describe el carácter principal que identifica a Granodiorita a primera vista.","t2":["plagioclasa","similar","hornblenda","granito","oscura"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-027","cat":"Geología","sub":"Roca","name":"Migmatita","sci":"Migmatita","fam":"Metamórfica (grado muy alto)","freq":"media","key":"Mezcla de material oscuro metamórfico y bandas claras de material fundido (leucosoma)","mnem":"El 'gneis con marmoreo': bandas oscuras de esquisto más venas blancas de cuarzo-feldespato inyectadas","etym":"Del griego 'migma' (mezcla)","notes":"Presente en el basamento del Sistema Central. Indica metamorfismo de altísimo grado. PRUEBAS: (1) Material oscuro metamórfico entremezclado con VENAS o MANCHAS claras de material fundido (leucosoma). (2) Aspecto nebulítico o ptígmático. (3) Grano grueso. CONFUSIÓN CON: Gneis — tiene bandas regulares, no mezcla de fundido. Granito intrusivo — masivo y homogéneo. Esquisto — foliación, sin material fundido.","q1":"¿Cómo usarías el mnemónico de Migmatita para no olvidarlo en el examen?","t1":["marmoreo","esquisto","feldespato","oscuras","inyectadas"],"q2":"¿Qué rasgo de Migmatita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["metamórfico","material","mezcla","oscuro","bandas"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-028","cat":"Geología","sub":"Roca","name":"Corneana (hornfels)","sci":"Corneana","fam":"Metamórfica de contacto","freq":"baja","key":"Muy dura y compacta; aspecto córneo o vítreo","mnem":"La 'roca 'hornada' por el magma': dura, compacta, oscura y sin bandas. El mármol del mundo sedimentario","etym":"Del alemán 'Hornfels' (roca córnea): por su dureza y aspecto","notes":"Aparece en zonas de contacto (aureolas de metamorfismo) próximas a intrusiones graníticas — frecuentes en el Sistema Central. PRUEBAS: (1) Aspecto córneo o similar a la porcelana. (2) Muy dura (no se raya con navaja). (3) Fractura irregular a subconcoidea. (4) Siempre en aureolas de contacto alrededor de intrusiones. CONFUSIÓN CON: Cuarcita — también durísima pero con textura arenosa. Basalto — también compacto y duro pero con fractura columnar. Sílex — fractura concoidea perfecta, sedimentario.","q1":"¿Qué imagen mental evoca el mnemónico de Corneana (hornfels)? Descríbelo con tus palabras.","t1":["sedimentario","hornada","compacta","roca","magma"],"q2":"¿Cuál es el rasgo más diagnóstico de Corneana (hornfels)? Incluye al menos un término clave.","t2":["compacta","aspecto","córneo","dura","vítreo"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-029","cat":"Geología","sub":"Roca","name":"Pegmatita","sci":"Pegmatita","fam":"Roca ígnea plutónica extrema","freq":"muy_alta","key":"Cristales de tamaño gigantesco (centímetros a metros): la roca de mayor tamaño de cristal","mnem":"El 'granito de los gigantes': mismos minerales que el granito pero con cristales tan grandes que se pueden coger con la mano. Si un 'granito' tiene cristales de 10 cm, es pegmatita","etym":"Del griego 'pegma' (cosa unida, ensamblada): por la firmeza de la textura interbloqueada de sus cristales gigantes","notes":"La pegmatita es imprescindible para el visu de petrología. Los cristales gigantes + composición granítica + minerales raros asociados son diagnósticos. El origen en la última fracción magmática explica la concentración de elementos raros. PRUEBAS: (1) Cristales de tamaño centimétrico o mayor — visibles a gran distancia. (2) Composición similar al granito (cuarzo, feldespato, mica). (3) Minerales raros asociados (turmalina, berilo, topacio). CONFUSIÓN CON: Granito de grano grueso — cristales menores de 1 cm. La pegmatita tiene cristales de cm a metros. Aploita — también en diques pero de grano FINO, no grueso.","q1":"Explica el mnemónico de Pegmatita y qué rasgos te ayuda a recordar.","t1":["gigantes","minerales","granito","cristales","mismos"],"q2":"Describe el carácter principal que identifica a Pegmatita a primera vista.","t2":["cristales","gigantesco","tamaño","cristal","mayor"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-030","cat":"Geología","sub":"Roca","name":"Sienita","sci":"Sienita","fam":"Roca ígnea plutónica","freq":"alta","key":"Como el granito pero SIN cuarzo visible — el feldespato domina sin acompañante de cuarzo","mnem":"El 'granito sin cuarzo': rosado y de grano visible como el granito pero sin el cuarzo grisáceo entre los feldespatos. La ausencia de cuarzo es la clave","etym":"Del latín 'Syene' (antigua ciudad de Egipto, actual Asuán), donde los romanos la encontraron","notes":"La sienita = granito sin cuarzo. La distinción petrológica cuarzo/sin cuarzo en rocas plutónicas es fundamental. La sienita nefelínica (con nefelina en vez de cuarzo) es la roca del Teide. PRUEBAS: (1) Aspecto de granito pero BUSCANDO cuarzo: si no hay cuarzo gris = sienita. (2) Feldespato domina completamente. (3) Color similar al granito pero más uniforme. CONFUSIÓN CON: Granito — tiene cuarzo gris bien visible. Traquita — equivalente volcánico de la sienita, afanítica. Nefelinita sienítica — con nefelina en lugar de cuarzo.","q1":"¿Cómo usarías el mnemónico de Sienita para no olvidarlo en el examen?","t1":["granito","feldespatos","cuarzo","rosado","visible"],"q2":"¿Qué rasgo de Sienita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["feldespato","acompañante","granito","visible","cuarzo"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-031","cat":"Geología","sub":"Roca","name":"Tonalita","sci":"Tonalita","fam":"Roca ígnea plutónica","freq":"media","key":"Color gris claro; dominan las plagioclasas blancas sobre los feldespatos oscuros","mnem":"El 'granito gris sin rosado': blanco-grisáceo uniforme sin los granos rosados de ortosa del granito. La ausencia del rosado del feldespato potásico lo distingue del granito","etym":"Del puerto de Tonale (Alpes italianos), donde fue estudiada por primera vez","notes":"La tonalita junto a la trondhjemita y la granodiorita forman la serie TTG, que es la composición dominante de la corteza continental arcaica. Fundamental en geología de la corteza precámbrica. PRUEBAS: (1) Color gris claro. (2) Plagioclasa blanca DOMINANTE. (3) Cuarzo presente pero sin feldespato potásico rosado. (4) Hornblenda o biotita oscuras. CONFUSIÓN CON: Granodiorita — más cuarzo y algo de ortosa rosada. Diorita — sin cuarzo. Granito — feldespato potásico rosado abundante.","q1":"¿Qué imagen mental evoca el mnemónico de Tonalita? Descríbelo con tus palabras.","t1":["granito","grisáceo","uniforme","rosado","blanco"],"q2":"¿Cuál es el rasgo más diagnóstico de Tonalita? Incluye al menos un término clave.","t2":["plagioclasas","feldespatos","dominan","color","blancas"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-032","cat":"Geología","sub":"Roca","name":"Aplita","sci":"Aplita","fam":"Roca ígnea hipabismal","freq":"media","key":"Color blanco a rosado claro; textura azucarada (cristales muy finos iguales entre sí)","mnem":"El 'granito de azúcar blanco': dique blanco-rosado de grano finísimo que corta al granito — como si alguien hubiera rellenado las grietas del granito con azúcar muy fino","etym":"Del griego 'haploos' (simple): por su composición simple (esencialmente cuarzo + feldespato)","notes":"Las aplitas siempre aparecen como diques que cortan al granito del que proceden. La textura 'azucarada' (equigranular muy fina) es diagnóstica y contrasta con la pegmatita (cristales gigantes). PRUEBAS: (1) Grano muy fino uniforme ('azucarado'). (2) Color blanco o rosado claro. (3) En diques cortando al granito huésped. (4) Composición granítica. CONFUSIÓN CON: Pegmatita — grano enorme (lo opuesto). Riolita — volcánica; textura diferente. Caliza de grano fino — reacciona al HCl.","q1":"Explica el mnemónico de Aplita y qué rasgos te ayuda a recordar.","t1":["granito","azúcar","blanco","finísimo","dique"],"q2":"Describe el carácter principal que identifica a Aplita a primera vista.","t2":["azucarada","blanco","color","rosado","textura"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-033","cat":"Geología","sub":"Roca","name":"Toba volcánica / Ignimbrita","sci":"Toba volcánica / Ignimbrita","fam":"Roca piroclástica","freq":"alta","key":"Roca de cenizas volcánicas cementadas; textura porosa-esponjosa o compacta","mnem":"La 'ceniza petrificada': los fragmentos de pómez y ceniza atrapados y cementados forman esta roca ligera y porosa — la huella de una erupción violenta conservada en piedra","etym":"Toba = del italiano 'tufo' (material blando) · Ignimbrita del latín 'ignis' (fuego) + 'imber' (lluvia): 'lluvia de fuego'","notes":"Las tobas y las ignimbritas son los productos sólidos de las erupciones explosivas. Las ignimbritas (con fiamme aplastados) indican erupciones de flujo piroclástico muy peligrosas. Frecuentes en Canarias. PRUEBAS: (1) Textura porosa. (2) A menudo con fragmentos de otros materiales (pómez, lapilli, cristales). (3) Puede tener estructura de flujo (en ignimbritas). (4) Sin efervescencia al HCl. CONFUSIÓN CON: Pumita — también volcánica y porosa pero sin fragmentos; más homogénea. Travertino — poroso pero efervescencia al HCl. Diatomita — porosa y blanca pero sedimentaria.","q1":"¿Cómo usarías el mnemónico de Toba volcánica / Ignimbrita para no olvidarlo en el examen?","t1":["petrificada","fragmentos","cementados","atrapados","ceniza"],"q2":"¿Qué rasgo de Toba volcánica / Ignimbrita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["volcánicas","cementadas","cenizas","esponjosa","textura"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-034","cat":"Geología","sub":"Roca","name":"Traquita","sci":"Traquita","fam":"Roca ígnea volcánica","freq":"media","key":"Color gris claro a blanquecino; superficie áspera al tacto (el nombre significa 'rugoso')","mnem":"La 'basalto sin color y áspera al tacto': gris clara o blanquecina (a diferencia del basalto negro) y con esa textura rugosa que se nota con la yema del dedo — la volcánica de las islas alcalinas","etym":"Del griego 'trachys' (áspero, rugoso): por la textura rugosa de su superficie al tacto","notes":"Traquita = equivalente volcánico de la sienita. La textura fluidal (feldespatos alineados) es diagnóstica en lámina delgada. Frecuente en erupciones de islas oceánicas (Canarias, Azores). PRUEBAS: (1) Superficie áspera al tacto (el nombre viene de 'rugoso'). (2) Feldespatos alineados dando textura fluidal. (3) Color gris claro a blanquecino. (4) Sin cuarzo (diferencia de riolita). CONFUSIÓN CON: Riolita — también clara pero CON cuarzo; superficie menos áspera. Andesita — más oscura. Fonolita — similar pero con nefelina.","q1":"¿Qué imagen mental evoca el mnemónico de Traquita? Descríbelo con tus palabras.","t1":["blanquecina","basalto","áspera","color","tacto"],"q2":"¿Cuál es el rasgo más diagnóstico de Traquita? Incluye al menos un término clave.","t2":["blanquecino","superficie","color","claro","gris"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-035","cat":"Geología","sub":"Roca","name":"Dacita","sci":"Dacita","fam":"Roca ígnea volcánica","freq":"media","key":"Color gris claro a blanquecino; más clara que el basalto, más oscura que la riolita","mnem":"La 'andesita con cuarzo': si la roca volcánica grisácea tiene fenocristales de cuarzo redondeados en la matriz oscura, es dacita — el cuarzo en una roca volcánica andesítica es diagnóstico","etym":"De la provincia romana de Dacia (actual Rumanía), donde fue estudiada por primera vez","notes":"La dacita es la roca del monte Santa Helena (1980) y el Pinatubo (1991). La presencia de cuarzo + plagioclasa en fenocristales es diagnóstica vs. andesita (sin cuarzo). PRUEBAS: (1) Color gris claro a blanquecino. (2) Fenocristales de cuarzo + plagioclasa ± hornblenda. (3) Más oscura que riolita, más clara que andesita. CONFUSIÓN CON: Riolita — más clara, más feldespato potásico. Andesita — más oscura, sin cuarzo. Granodiorita — equivalente plutónico.","q1":"Explica el mnemónico de Dacita y qué rasgos te ayuda a recordar.","t1":["fenocristales","andesita","volcánica","redondeados","grisácea"],"q2":"Describe el carácter principal que identifica a Dacita a primera vista.","t2":["blanquecino","color","basalto","claro","gris"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-036","cat":"Geología","sub":"Roca","name":"Calcarenita","sci":"Calcarenita","fam":"Roca sedimentaria carbonatada","freq":"alta","key":"Caliza de grano visible (tamaño arena): oolitos, bioclastos o peloides visibles sin lupa","mnem":"La 'caliza de grano que se ve sin lupa': al contrario que la caliza microcristalina (afanítica), la calcarenita tiene granos visibles — oolitos como pequeñas perlas o trocitos de conchas","etym":"Del latín 'calcarius' (calizo) + 'arena': 'caliza de arena'","notes":"La distinción caliza micrítica (grano fino, opaca) / calcarenita (grano visible) es fundamental en petrología carbonatada. Los oolitos (concentraciones concéntricas de calcita) son diagnósticos. PRUEBAS: (1) Granos de carbonato VISIBLES a simple vista o con lupa (oolitos, bioclastos, peloides). (2) Efervescencia al HCl. (3) Textura más gruesa que la caliza micrítica. CONFUSIÓN CON: Caliza micrítica — fina y opaca, sin granos visibles. Arenisca calcárea — granos de cuarzo visibles, no carbonato. Lumaquela — todo conchas y bioclastos.","q1":"¿Cómo usarías el mnemónico de Calcarenita para no olvidarlo en el examen?","t1":["microcristalina","calcarenita","contrario","caliza","grano"],"q2":"¿Qué rasgo de Calcarenita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["bioclastos","caliza","visible","oolitos","peloides"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-037","cat":"Geología","sub":"Roca","name":"Lumaquela","sci":"Lumaquela","fam":"Roca sedimentaria bioclástica","freq":"alta","key":"Roca formada casi exclusivamente por fragmentos de conchas acumulados — visible a simple vista","mnem":"La 'roca que parece un cubo de conchas pegadas': las conchas completas o rotas visibles son el 100% de la roca — como si hubiera vaciado un cubo de mejillones y lo hubiera fosilizado","etym":"Del italiano 'lumaca' (caracol): 'roca de caracoles'","notes":"La lumaquela es ideal para el visu por ser un ejemplo muy visual y claro de roca biogénica. Permite trabajar directamente con los fósiles de los que está compuesta. PRUEBAS: (1) Acúmulo de conchas y fragmentos bioclásticos visible a simple vista. (2) Efervescencia al HCl. (3) Textura muy porosa entre las conchas. CONFUSIÓN CON: Calcarenita — también bioclastos pero más fragmentados, menos conchas enteras. Caliza arrecifal — bioconstruida in situ, sin acúmulo alóctono. Coquina — similar término anglosajón.","q1":"¿Qué imagen mental evoca el mnemónico de Lumaquela? Descríbelo con tus palabras.","t1":["completas","parece","conchas","pegadas","roca"],"q2":"¿Cuál es el rasgo más diagnóstico de Lumaquela? Incluye al menos un término clave.","t2":["exclusivamente","fragmentos","acumulados","formada","conchas"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-038","cat":"Geología","sub":"Roca","name":"Turbidita","sci":"Turbidita","fam":"Roca sedimentaria detrítica","freq":"baja","key":"Alternancia regular de capas arenosas más gruesas (base) y pelíticas más finas (techo)","mnem":"La 'roca de la avalancha submarina': cada capa empieza con arena gruesa (la avalancha) y acaba con fango fino (cuando la corriente se calma) — las rayas alternas muestran cada avalancha","etym":"Del latín 'turbidus' (turbio, revuelto): depósito de corrientes de agua cargadas de sedimento","notes":"Las turbiditas forman enormes abanicos submarinos (como el del Nilo o el del Indo). La secuencia de Bouma (Ta-Tb-Tc-Td-Te) es evaluable. Muy frecuentes en el flysch del Cretácico ibérico. PRUEBAS: (1) Alternancia regular de capas arenosas (base, más gruesas) y pelíticas (techo, más finas). (2) Secuencia de Bouma visible. (3) Base erosiva de las capas arenosas. CONFUSIÓN CON: Flysch — la turbidita ES el flysch o lo forma. Alternancia de calizas-margas — efervescencia al HCl en la caliza. Ritmita — también alternante pero sin secuencia de Bouma.","q1":"Explica el mnemónico de Turbidita y qué rasgos te ayuda a recordar.","t1":["avalancha","submarina","empieza","roca","gruesa"],"q2":"Describe el carácter principal que identifica a Turbidita a primera vista.","t2":["alternancia","regular","arenosas","pelíticas","gruesas"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-039","cat":"Geología","sub":"Roca","name":"Radiolarita","sci":"Radiolarita","fam":"Roca sedimentaria silícea","freq":"baja","key":"Roca de sílice (SiO₂) biogénica: acumulación de caparazones de radiolarios","mnem":"El 'sílex rojo de los fondos profundos': dura y brillante como el pedernal pero con tonos rojizos, verdes o negros — el sílex del fondo del océano hecho de esqueletos microscópicos","etym":"De 'Radiolaria' (los microorganismos cuyo esqueleto la forma) + '-ita' (roca)","notes":"La radiolarita es el equivalente biogénico del sílex (pedernal). Su color rojizo se debe al óxido de hierro, el verde a la clorita. Marcadora de entornos oceánicos profundos (por debajo de la CCD). PRUEBAS: (1) Color rojizo a verde. (2) Muy dura (dur.7, SiO₂). (3) No efervescencia al HCl. (4) Fractura concoidea. (5) Al microscopio: caparazones de radiolarios. CONFUSIÓN CON: Caliza — efervescencia al HCl; más blanda. Sílex — mismo SiO₂ pero origen diagenético, no biogénico estricto; más gris. Pizarra roja — foliación; más blanda.","q1":"¿Cómo usarías el mnemónico de Radiolarita para no olvidarlo en el examen?","t1":["profundos","microscópicos","brillante","sílex","fondos"],"q2":"¿Qué rasgo de Radiolarita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["acumulación","caparazones","radiolarios","biogénica","sílice"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-040","cat":"Geología","sub":"Roca","name":"Diatomita","sci":"Diatomita","fam":"Roca sedimentaria silícea","freq":"baja","key":"Roca muy ligera (flota en agua), blanca y suave: literalmente polvo de caparazones de diatomeas","mnem":"La 'tiza que pega a la lengua y no hace burbujas': blanca y suave como la caliza pero no reacciona con el ácido (sílice, no calcita). Y si la tocas con la lengua, la succiona","etym":"De 'diatom' (diatomea, del griego 'diatomos' = dividida en dos) + '-ite' (roca)","notes":"La prueba de la lengua (adherencia) + la no efervescencia con HCl distinguen la diatomita de la caliza. La diatomita es el producto de Tierra de Diatomeas (insecticida, filtros, aislante). PRUEBAS: (1) Extraordinariamente ligera. (2) Color blanco. (3) Se adhiere a la lengua (absorbe humedad). (4) NO efervescencia al HCl (SiO₂, no CaCO₃). (5) Aspecto terroso. CONFUSIÓN CON: Caliza cretácea (tiza) — también blanca y suave pero EFERVESCENCIA al HCl. Talco en masa — también blanco y suave pero más graso. Pumita — también muy ligera pero vítrea, volcánica.","q1":"¿Qué imagen mental evoca el mnemónico de Diatomita? Descríbelo con tus palabras.","t1":["burbujas","lengua","reacciona","tiza","pega"],"q2":"¿Cuál es el rasgo más diagnóstico de Diatomita? Incluye al menos un término clave.","t2":["literalmente","caparazones","ligera","diatomeas","blanca"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-041","cat":"Geología","sub":"Roca","name":"Sal gema / Halitita","sci":"Roca de sal (Halitita)","fam":"Roca sedimentaria evaporítica","freq":"alta","key":"Sabor salado inconfundible — el diagnóstico más directo de todo el visu","mnem":"La 'roca que sabe a sal': el único caso donde el sabor da el diagnóstico al instante. Si te dejan probarla (siempre con precaución), la sal gema tiene sabor salado puro y limpio","etym":"Sal = del latín 'sal' · Gema = del latín 'gemma' (piedra preciosa): sal cristalina pura y brillante","notes":"La sal gema se distingue de la halita (mineral) solo en escala: sal gema = la roca formada por halita. El sabor + la solubilidad en agua son diagnósticos. Los diapiros de sal son estructuras tectónicas evaluables. PRUEBAS: (1) PROBAR: sabor salado inmediato = diagnóstico definitivo. (2) Clivaje cúbico en todos los fragmentos. (3) Traslúcida a transparente. CONFUSIÓN CON: Yeso (roca) — no sabe a nada; dur.2; láminas. Silvitita — sabor amargo/picante (no salado). Anhidrita — sin sabor; más dura.","q1":"Explica el mnemónico de Sal gema / Halitita y qué rasgos te ayuda a recordar.","t1":["diagnóstico","instante","roca","único","sabe"],"q2":"Describe el carácter principal que identifica a Sal gema / Halitita a primera vista.","t2":["inconfundible","diagnóstico","salado","sabor","directo"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-042","cat":"Geología","sub":"Roca","name":"Anfibolita","sci":"Anfibolita","fam":"Roca metamórfica de alto grado","freq":"alta","key":"Color negro a verde oscuro; aspecto brillante por los anfíboles (hornblenda)","mnem":"El 'esquisto negro y verde sin brillo de micas': negro y brillante por la hornblenda pero sin las láminas plateadas de las micas del esquisto — compacto y oscuro","etym":"Del griego 'amphi' (ambos lados) + 'bolein' (arrojar): 'el que tiene minerales a ambos lados' — anfíbol + plagioclasa en el nombre","notes":"La anfibolita es el producto de metamorfismo de basalto en la facies anfibolítica. El par hornblenda (negro) + plagioclasa (blanco) en bandas alternantes es diagnóstico. PRUEBAS: (1) Negro a verde oscuro con brillo por anfíboles (hornblenda). (2) Foliación metamórfica. (3) Grano medio. (4) Sin cuarzo. CONFUSIÓN CON: Basalto — sin foliación; afanítico. Gabro — sin foliación; plutónico. Esquisto con hornblenda — puede ser similar; la anfibolita tiene >50% anfíbol.","q1":"¿Cómo usarías el mnemónico de Anfibolita para no olvidarlo en el examen?","t1":["esquisto","hornblenda","brillante","negro","brillo"],"q2":"¿Qué rasgo de Anfibolita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["brillante","anfíboles","color","aspecto","negro"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-043","cat":"Geología","sub":"Roca","name":"Granulita","sci":"Granulita","fam":"Roca metamórfica de muy alto grado","freq":"media","key":"Textura granoblástica: granos equidimensionales sin foliación (aspecto de granito pero metamórfica)","mnem":"El 'metamórfico que ha olvidado que es metamórfico': no tiene foliación ni micas — los granos son todos iguales como en una roca ígnea. El metamorfismo fue tan intenso que borró toda la estructura","etym":"Del latín 'granulum' (granito pequeño): por la textura granular equidimensional","notes":"Las granulitas representan el metamorfismo más profundo de la corteza continental. La ausencia de anfíboles + presencia de piroxenos + textura granoblástica son diagnósticos. PRUEBAS: (1) Granos equidimensionales sin foliación (aspecto de granito pero de origen metamórfico). (2) Puede tener granate. (3) Sin anfíboles (piroxenos en su lugar). (4) Metamorfismo de muy alto grado. CONFUSIÓN CON: Granito — de origen ígneo, no metamórfico; mismo aspecto pero diferente historia. Gneis — tiene foliación y bandas. Cuarcita — también granulítica pero solo cuarzo.","q1":"¿Qué imagen mental evoca el mnemónico de Granulita? Descríbelo con tus palabras.","t1":["metamórfico","olvidado","foliación","metamorfismo","iguales"],"q2":"¿Cuál es el rasgo más diagnóstico de Granulita? Incluye al menos un término clave.","t2":["equidimensionales","granoblástica","textura","foliación","granos"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-044","cat":"Geología","sub":"Roca","name":"Eclogita","sci":"Eclogita","fam":"Roca metamórfica de alta presión","freq":"baja","key":"Color verde y rojo: piroxeno verde (onfacita) + granate rojo o rosado — absolutamente diagnóstico","mnem":"La 'roca verde y roja de las profundidades': solo hay una roca con ese patrón de verde intenso + rojo intenso en los mismos granos. El verde es piroxeno sódico, el rojo es granate — los 'semáforos de las profundidades'","etym":"Del griego 'ekloge' (selección, elección): 'la elegida' — por su aspecto llamativo y excepcional","notes":"El binomio onfacita (verde) + granate (rojo) en eclogitas es uno de los rasgos diagnósticos más espectaculares de la petrología. Las eclogitas son las rocas que suben desde la zona de subducción. PRUEBAS: (1) Color verde + ROJO/ROSADO juntos: piroxeno verde (onfacita) + granate rojo. (2) Muy densa (3.5-3.6 g/cm³). (3) Sin feldespato. CONFUSIÓN CON: Serpentinita — solo verde, sin granate rojo. Peridotita — verde más uniforme, olivino sin granate rojo. La eclogita es reconocible precisamente por el contraste bicolor verde-rojo.","q1":"Explica el mnemónico de Eclogita y qué rasgos te ayuda a recordar.","t1":["profundidades","verde","roca","patrón","intenso"],"q2":"Describe el carácter principal que identifica a Eclogita a primera vista.","t2":["absolutamente","piroxeno","diagnóstico","color","verde"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-045","cat":"Geología","sub":"Roca","name":"Serpentinita","sci":"Serpentinita","fam":"Roca metamórfica hidrotermal","freq":"baja","key":"Color verde oscuro a negro-verdoso con aspecto aceitoso y brillante","mnem":"La 'peridotita que se convirtió en serpiente': verde oscura con venas sinuosas en red — el manto oceánico que ha absorbido agua y se ha transformado. El 'mosaico verde' de la litosfera oceánica","etym":"De 'serpentina' (el mineral que la compone, del latín 'serpens' = serpiente): por las venas verdes sinuosas que recuerdan una serpiente","notes":"La serpentinita marca los bordes de placas y zonas de subducción donde el manto oceánico ha interactuado con el agua. La textura en red es diagnóstica. La serpentinización libera hidrógeno (fuente de energía para comunidades quimiolitotróficas). PRUEBAS: (1) Verde oscuro a negro-verdoso con aspecto aceitoso o brillante. (2) Textura fibrosa o masiva. (3) Puede tener venas blancas de crisotilo (amianto). (4) Asociada a ofiolitas. CONFUSIÓN CON: Peridotita — menos brillante, sin aspecto aceitoso. Basalto — negro sin brillo verde aceitoso. Clorita-esquisto — foliación, láminas de clorita visibles.","q1":"¿Cómo usarías el mnemónico de Serpentinita para no olvidarlo en el examen?","t1":["peridotita","convirtió","serpiente","transformado","sinuosas"],"q2":"¿Qué rasgo de Serpentinita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["brillante","color","oscuro","verdoso","aceitoso"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-046","cat":"Geología","sub":"Roca","name":"Skarn","sci":"Skarn (roca calcosilicatada)","fam":"Roca metamórfica de contacto","freq":"alta","key":"Colores muy vivos: verde, amarillo, marrón, rojo — el metamorfismo de contacto más llamativo","mnem":"La 'joyería del contacto entre el granito y la caliza': colores vivísimos (verde, amarillo, rojo) en la zona de mezcla. Si la roca parece un arcoíris metálico en el contacto de dos rocas muy diferentes, es skarn","etym":"Del sueco 'skarv' (ganga, rocas de desecho): nombre minero sueco para estas rocas del contacto","notes":"El skarn es el resultado de la reacción entre fluidos silíceos del granito y la caliza (CaCO₃ + SiO₂ → silicatos cálcicos). Es una mena importante de Cu, Fe, Zn. Los granates de grosularia son diagnósticos. PRUEBAS: (1) Colores MUY VIVOS: verde (epidota, actinolita), rojo (granate), amarillo (vesuvianita). (2) Contacto entre granito y caliza. (3) Minerales de contacto reconocibles. CONFUSIÓN CON: Gneis — bandas regulares sin colores tan llamativos. Mármol — también de contacto pero todo carbonato blanco. Corneana — también de contacto pero más homogénea y oscura.","q1":"¿Qué imagen mental evoca el mnemónico de Skarn? Descríbelo con tus palabras.","t1":["contacto","joyería","vivísimos","granito","colores"],"q2":"¿Cuál es el rasgo más diagnóstico de Skarn? Incluye al menos un término clave.","t2":["metamorfismo","colores","amarillo","llamativo","vivos"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-047","cat":"Geología","sub":"Roca","name":"Milonita","sci":"Milonita","fam":"Roca de falla (tectonita)","freq":"media","key":"Bandeado muy fino, casi como papel: láminas alternadas extremadamente delgadas","mnem":"La 'roca estirada como chicle': las bandas son tan finas y los minerales tan alargados que parece que alguien estiró la roca como si fuera chicle. El resultado de millones de años de cizallamiento","etym":"Del griego 'mylos' (molino): 'la roca que ha sido molida' por el movimiento tectónico","notes":"Las milonitas se forman en zonas de falla dúctil profundas (fallas de corteza media). La estructura S-C permite deducir el sentido del movimiento de la falla. Importante en tectónica. PRUEBAS: (1) Bandeado extremadamente fino (mm). (2) Superficies lisas brillantes. (3) Asociada a zonas de falla dúctil. (4) Sin fragmentos angulosos (a diferencia de la brecha de falla). CONFUSIÓN CON: Brecha de falla/cataclasita — fragmentos angulosos visibles; falla frágil (superficial). Pizarra — clivaje pizarroso pero sin bandeado tan fino. Esquisto — minerales visibles.","q1":"Explica el mnemónico de Milonita y qué rasgos te ayuda a recordar.","t1":["estirada","cizallamiento","minerales","alargados","chicle"],"q2":"Describe el carácter principal que identifica a Milonita a primera vista.","t2":["extremadamente","bandeado","alternadas","láminas","delgadas"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-048","cat":"Geología","sub":"Roca","name":"BrechaFalla","sci":"Brecha de falla / Cataclasita","fam":"Roca de falla (tectonita frágil)","freq":"media","key":"Fragmentos angulosos de la roca encajante cementados por una matriz muy fina","mnem":"La 'roca triturada de la falla': fragmentos angulosos de la propia roca cementados en matriz. Como la brecha sedimentaria pero todos los fragmentos son de la misma roca y están in situ","etym":"Del griego 'kata' (hacia abajo) + 'klasis' (rotura): 'rotura hacia abajo' — fragmentación de la roca por fallamiento","notes":"La brecha de falla marca el plano de la falla frágil. A diferencia de la milonita (dúctil, profunda), la brecha de falla se forma cerca de la superficie. Diferencia de brecha sedimentaria: los clastos son angulosos y todos de la misma roca. PRUEBAS: (1) Fragmentos ANGULOSOS del encajante cementados. (2) Asociada a planos de falla. (3) Gradación desde brecha (frágil, superficial) a milonita (dúctil, profunda). CONFUSIÓN CON: Milonita — bandeado muy fino, dúctil, sin fragmentos angulosos. Brecha sedimentaria — no asociada a falla, clastos más variados. Conglomerado — clastos redondeados, no angulosos.","q1":"¿Cómo usarías el mnemónico de Brecha de falla / Cataclasita para no olvidarlo en el examen?","t1":["triturada","fragmentos","angulosos","sedimentaria","cementados"],"q2":"¿Qué rasgo de Brecha de falla / Cataclasita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["fragmentos","angulosos","cementados","encajante","matriz"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-050","cat":"Geología","sub":"Roca","name":"Flysch","sci":"Flysch","fam":"Roca sedimentaria turbidítica","freq":"baja","key":"Alternancia monótona de areniscas y margas/arcillas en capas de pocos centímetros a metros","mnem":"La 'baraja de naipes de roca': alternancia monótona de arenisca (la cara) y marga (el dorso) repetida miles de veces. Si parece un apilado de barajas, es flysch","etym":"Del suizo-alemán 'flysch' (deslizarse fácilmente): por la facilidad con que los flysch del norte de Suiza favorecen los deslizamientos","notes":"El flysch es la secuencia de turbiditas más famosa de Europa — el flysch del Cretácico del País Vasco es uno de los más conocidos del mundo. La alternancia arenisca/marga en capas regulares es diagnóstica. PRUEBAS: (1) Alternancia monótona regular de areniscas y lutitas. (2) Capas de pocos cm a metros. (3) Base de las capas arenosas erosiva sobre las pelíticas. (4) Megasecuencias. CONFUSIÓN CON: Turbidita — el flysch ES una secuencia de turbiditas. Alternancia de calizas-margas — efervescencia al HCl. Ritmita lacustre — escala menor, origen diferente.","q1":"Explica el mnemónico de Flysch y qué rasgos te ayuda a recordar.","t1":["alternancia","baraja","monótona","naipes","arenisca"],"q2":"Describe el carácter principal que identifica a Flysch a primera vista.","t2":["alternancia","areniscas","monótona","centímetros","arcillas"],"catf":"geología","subf":"roca","hab":""},{"id":"ROC-051","cat":"Geología","sub":"Roca","name":"Marga","sci":"Marga","fam":"Sedimentaria detrítico-carbonatada","freq":"alta","key":"Roca intermedia entre caliza y arcilla: 35-65% de carbonato cálcico y el resto arcilla. Aspecto terroso o compacto, color gris, blanquecino, amarillento o azulado. Reacciona al HCl pero deja un residuo arcilloso terroso. Se deshace parcialmente en agua. Tacto ligeramente untuoso. Estratificación fina bien marcada.","mnem":"La caliza sucia: reacciona al HCl pero deja barro. Ni caliza pura ni arcilla pura — la roca de en medio.","etym":"Del latín marga, término de origen celta que designaba una tierra caliza usada como fertilizante en la agricultura antigua.","notes":"Muy abundante en la Comunidad de Madrid: es una de las tres rocas sedimentarias cretácicas de la Sierra de Guadarrama junto con calizas y dolomías, y también aparece en los rellenos terciarios de la Cuenca de Madrid. Su presencia indica ambiente marino somero con aporte terrígeno o ambiente lacustre. Interés económico: materia prima fundamental para la fabricación de cemento (mezcla natural de caliza y arcilla). PRUEBAS: (1) Aplicar HCl: efervescencia moderada, MENOS viva que la caliza pura. (2) Tras la reacción queda un residuo terroso/arcilloso visible (la caliza pura no deja residuo). (3) Frotar con el dedo humedecido: mancha ligeramente y da tacto untuoso. (4) Sumergir un fragmento en agua: se disgrega parcialmente (la caliza no). CONFUSIÓN CON: Caliza — efervescencia MUY viva y sin residuo arcilloso; más dura y compacta. Arcilla/lutita — NO reacciona al HCl; totalmente plástica al mojarse. Dolomía — no reacciona al HCl en frío. Calcarenita — granos de carbonato visibles a simple vista.","hab":"Cuencas sedimentarias marinas someras y lacustres. En Madrid: facies cretácicas de la Sierra de Guadarrama y rellenos miocenos de la Cuenca de Madrid (facies de transición entre las calizas del páramo y las arcillas de la cuenca)."},{"id":"ALG-001","cat":"Botánica","sub":"Alga","name":"Lechuga de mar","sci":"Ulva lactuca","fam":"Ulvaceae","freq":"alta","key":"Talo laminar, brillante, verde intenso, muy delgado (2 células de espesor)","mnem":"La 'lechuga del mar': verde brillante, finísima y ondulada — la alga verde por excelencia","etym":"Ulva (lat.) = 'planta acuática' · lactuca = 'lechuga'","notes":"La alga verde más frecuente en exámenes. Verde intenso + lámina fina son rasgos suficientes.","hab":"Zona intermareal y submareal somera; aguas enriquecidas en nutrientes","q1":"¿Cómo usarías el mnemónico de Lechuga de mar para no olvidarlo en el examen?","t1":["brillante","lechuga","finísima","excelencia","ondulada"],"q2":"¿Qué rasgo de Lechuga de mar es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["brillante","laminar","intenso","delgado","talo"],"catf":"botánica","subf":"alga"},{"id":"ALG-002","cat":"Botánica","sub":"Alga","name":"Fucus (sargazo vesiculoso)","sci":"Fucus vesiculosus","fam":"Fucaceae","freq":"alta","key":"Talo dicotómico con nervio central evidente; color pardo-oliváceo","mnem":"El 'alga de los globos': las bolsitas de aire a lo largo del talo hacen 'pop' al apretar — inconfundible","etym":"Fucus (lat.) = 'alga, tinte' · vesiculosus = 'con vesículas de aire'","notes":"Las vesículas aéreas son el rasgo diagnóstico inmediato. Muy frecuente en exámenes de costa atlántica. Fucaceae confirmada en exámenes reales.","hab":"Zona intermareal rocosa atlántica","q1":"¿Qué imagen mental evoca el mnemónico de Fucus (sargazo vesiculoso)? Descríbelo con tus palabras.","t1":["inconfundible","bolsitas","globos","alga","apretar"],"q2":"¿Cuál es el rasgo más diagnóstico de Fucus (sargazo vesiculoso)? Incluye al menos un término clave.","t2":["dicotómico","evidente","central","nervio","oliváceo"],"catf":"botánica","subf":"alga"},{"id":"ALG-003","cat":"Botánica","sub":"Alga","name":"Coral de mar (alga coralina)","sci":"Corallina officinalis","fam":"Corallinaceae","freq":"alta","key":"Talo articulado, erecto y calcificado (duro al tacto como hueso o coral)","mnem":"El 'alga roja que parece coral': articulada, calcificada y rígida — la única alga que suena al golpearla porque tiene cal dentro","etym":"Corallina (lat.) = 'parecida al coral' · officinalis = 'medicinal, de botica'","notes":"CONFIRMADO: Corallinaceae en etiquetas de exámenes reales. La textura calcificada + articulación + color violeta son absolutamente diagnósticos. Es la única alga dura.","hab":"Zona intermareal e infralitoral rocosa atlántica y mediterránea","q1":"Explica el mnemónico de Coral de mar (alga coralina) y qué rasgos te ayuda a recordar.","t1":["calcificada","articulada","parece","alga","golpearla"],"q2":"Describe el carácter principal que identifica a Coral de mar (alga coralina) a primera vista.","t2":["articulado","calcificado","erecto","talo"],"catf":"botánica","subf":"alga"},{"id":"ALG-004","cat":"Botánica","sub":"Alga","name":"Laminaria (kelp)","sci":"Laminaria hyperborea","fam":"Laminariaceae","freq":"media","key":"Talo diferenciado en estipe (tallo), rizoide (raíz) y lámina (hoja) — máxima organización en algas","mnem":"El 'árbol del mar': diferenciada en 'raíz', 'tronco' y 'hoja' pero sin ser planta. La más grande y organizada","etym":"Laminaria (lat.) = 'de láminas' · hyperborea = 'del extremo norte'","notes":"La diferenciación morfológica (estipe + rizoide + lámina) es clave didáctica en evolución de algas.","hab":"Sublitoral rocoso atlántico frío","q1":"¿Cómo usarías el mnemónico de Laminaria (kelp) para no olvidarlo en el examen?","t1":["diferenciada","organizada","árbol","tronco","planta"],"q2":"¿Qué rasgo de Laminaria (kelp) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["diferenciado","organización","rizoide","estipe","talo"],"catf":"botánica","subf":"alga"},{"id":"ALG-005","cat":"Botánica","sub":"Alga / Fanerógama marina","name":"Posidonia","sci":"Posidonia oceanica","fam":"Posidoniaceae","freq":"media","key":"Hojas acintadas largas (hasta 1 m), verde brillante con nervación paralela — es una planta con flores","mnem":"La 'hierba del Mediterráneo': hojas verdes acintadas en el fondo del mar — parece un alga pero es una planta con flores de verdad","etym":"Posidonia = de Poseidón (dios griego del mar) · oceanica = 'del océano'","notes":"Importante diferenciarlo de las algas: es una angiosperma. Las praderas de Posidonia son hábitat Natura 2000.","hab":"Fondos arenosos del Mediterráneo (1-35 m)","q1":"¿Qué imagen mental evoca el mnemónico de Posidonia? Descríbelo con tus palabras.","t1":["mediterráneo","acintadas","hierba","verdes","hojas"],"q2":"¿Cuál es el rasgo más diagnóstico de Posidonia? Incluye al menos un término clave.","t2":["acintadas","brillante","nervación","hojas","largas"],"catf":"botánica","subf":"alga"},{"id":"AMP-001","cat":"Botánica","sub":"Árbol","name":"Pino resinero / Pino marítimo","sci":"Pinus pinaster","fam":"Pinaceae","freq":"alta","key":"Acículas muy largas (10-25 cm), en parejas, rígidas y torcidas — las más largas de los pinos ibéricos","mnem":"El 'pino de las agujas largas': las acículas son las más largas y rígidas de los pinos ibéricos — si las acículas son más largas que tu mano, es pinaster","etym":"Pinus = 'pino' · pinaster (lat.) = 'pino silvestre inferior, pino bastardo'","notes":"Frecuente en repoblaciones de la Meseta y en montes atlánticos. Diferencia de pino silvestre: corteza roja también abajo + acículas más largas. Diferencia de piñonero: copa no en paraguas.","hab":"Montes silíceos, repoblaciones, zona atlántica y mediterránea","q1":"Explica el mnemónico de Pino resinero / Pino marítimo y qué rasgos te ayuda a recordar.","t1":["acículas","agujas","largas","rígidas","ibéricos"],"q2":"Describe el carácter principal que identifica a Pino resinero / Pino marítimo a primera vista.","t2":["acículas","parejas","torcidas","largas","rígidas"],"catf":"botánica","subf":"árbol"},{"id":"AMP-002","cat":"Botánica","sub":"Árbol","name":"Ciprés común","sci":"Cupressus sempervirens","fam":"Cupressaceae","freq":"alta","key":"Porte columnar o piramidal muy estrecho y erecto — silueta inconfundible en el paisaje","mnem":"El 'lápiz verde del Mediterráneo': la silueta columnar perfectamente vertical es inconfundible en el horizonte — ningún otro árbol español tiene esa forma de cohete","etym":"Cupressus (lat.) = del griego 'kyparissos' · sempervirens (lat.) = 'siempre verde, perennifolio'","notes":"La silueta columnar es diagnóstica al 100% incluso a distancia. Muy plantado en cementerios, jardines y cortinas cortavientos en Madrid.","hab":"Cultivado; nativo del Mediterráneo oriental","q1":"¿Cómo usarías el mnemónico de Ciprés común para no olvidarlo en el examen?","t1":["mediterráneo","perfectamente","inconfundible","columnar","silueta"],"q2":"¿Qué rasgo de Ciprés común es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["inconfundible","piramidal","columnar","estrecho","porte"],"catf":"botánica","subf":"árbol"},{"id":"AMP-003","cat":"Botánica","sub":"Árbol","name":"Roble pedunculado / Carballo","sci":"Quercus robur","fam":"Fagaceae","freq":"alta","key":"Hojas con base auriculada (con orejillas) y peciolo muy corto (casi sésiles)","mnem":"El 'roble de las bellotas en palito largo': las bellotas cuelgan en un pedúnculo larguísimo — si las bellotas cuelgan en una vara larga, es Quercus robur","etym":"Quercus = 'roble' · robur (lat.) = 'roble fuerte, dureza' — el 'roble duro'","notes":"Par obligatorio con Q. pyrenaica (melojo). Diferencia clave: robur = envés liso + bellotas en pedúnculo largo; pyrenaica = envés tomentoso (peludo) + bellotas en pedúnculo corto.","hab":"Bosques atlánticos húmedos; vaguadas con suelos profundos y frescos","q1":"¿Qué imagen mental evoca el mnemónico de Roble pedunculado / Carballo? Descríbelo con tus palabras.","t1":["bellotas","larguísimo","pedúnculo","roble","palito"],"q2":"¿Cuál es el rasgo más diagnóstico de Roble pedunculado / Carballo? Incluye al menos un término clave.","t2":["auriculada","peciolo","hojas","base","corto"],"catf":"botánica","subf":"árbol"},{"id":"AMP-004","cat":"Botánica","sub":"Arbusto","name":"Acebo","sci":"Ilex aquifolium","fam":"Aquifoliaceae","freq":"muy_alta","key":"Hojas coriáceas perennes con margen muy espinoso ondulado — inconfundible","mnem":"El 'árbol de Navidad con pinchos y bolitas rojas': hojas con espinas + bayas rojas brillantes en invierno — el símbolo navideño hecho árbol real","etym":"Ilex (lat.) = nombre del acebo · aquifolium (lat.) = aqua (agudo) + folium (hoja): 'hoja aguda'","notes":"Las hojas espinosas + bayas rojas en invierno son diagnósticos absolutos. El acebo es especie protegida en España (prohibida su corta). Muy frecuente en colecciones de IES madrileñas.","hab":"Bosques mixtos atlánticos, hayedos, robledales; umbría y suelos frescos","q1":"Explica el mnemónico de Acebo y qué rasgos te ayuda a recordar.","t1":["navidad","pinchos","bolitas","brillantes","árbol"],"q2":"Describe el carácter principal que identifica a Acebo a primera vista.","t2":["inconfundible","coriáceas","perennes","espinoso","ondulado"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-005","cat":"Botánica","sub":"Arbusto","name":"Endrino / Espino negro","sci":"Prunus spinosa","fam":"Rosaceae","freq":"alta","key":"Ramillas muy espinosas (las espinas son ramas modificadas, no aguijones)","mnem":"El 'espino que florece en invierno antes de tener hojas': flores blancas en enero sobre ramas desnudas con espinas — el primero en florecer del matorral","etym":"Prunus = 'ciruelo, frutal con hueso' · spinosa (lat.) = 'espinosa'","notes":"La floración invernal (sin hojas) + las espinas + los frutos pruinosos son diagnósticos. Familia Rosaceae — importante reconocerla por la flor con 5 pétalos y el fruto en drupa.","hab":"Setos, bordes de bosque, riberas; suelos variados","q1":"¿Cómo usarías el mnemónico de Endrino / Espino negro para no olvidarlo en el examen?","t1":["invierno","florece","espino","antes","blancas"],"q2":"¿Qué rasgo de Endrino / Espino negro es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["espinosas","ramillas"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-006","cat":"Botánica","sub":"Arbusto","name":"Rosal silvestre / Rosal canino","sci":"Rosa canina","fam":"Rosaceae","freq":"alta","key":"Aguijones curvados en forma de gancho (diferencia de otras Rosa: aguijones rectos)","mnem":"El 'rosal con bolitas rojas en invierno': el escaramujo rojo brillante colgando de las ramas desnudas en invierno es inconfundible — fuente de vitamina C","etym":"Rosa (lat.) = 'rosal' · canina (lat.) = 'del perro, silvestre, basto'","notes":"Los escaramujos (frutos) en invierno son los más llamativos y diagnósticos. La forma de gancho de los aguijones distingue a R. canina de otras rosas. Familia Rosaceae = flor con 5 pétalos + fruto carnoso.","hab":"Setos, bordes de bosque, riberas, bordes de camino","q1":"¿Qué imagen mental evoca el mnemónico de Rosal silvestre / Rosal canino? Descríbelo con tus palabras.","t1":["escaramujo","inconfundible","bolitas","invierno","brillante"],"q2":"¿Cuál es el rasgo más diagnóstico de Rosal silvestre / Rosal canino? Incluye al menos un término clave.","t2":["aguijones","curvados","gancho","forma"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-007","cat":"Botánica","sub":"Árbol","name":"Majuelo / Espino albar","sci":"Crataegus monogyna","fam":"Rosaceae","freq":"alta","key":"Hojas con 3-7 lóbulos profundos (más recortadas que otras Crataegus)","mnem":"El 'espino blanco de las majuelas': flores blancas en primavera → bolitas rojo oscuro en otoño, parecidas a moras pequeñas. La crema de la Rosaceae del seto","etym":"Crataegus (gr.) = kratos (fuerza) + akis (punta) · monogyna = 'con un solo pistilo'","notes":"Muy frecuente en setos de Madrid. Diferencia de Prunus spinosa: Crataegus = flores CON hojas (simultáneas); Prunus = flores SIN hojas (antes). Rosaceae = 5 pétalos siempre.","hab":"Setos, bordes de bosque, riberas; suelos variados y calizos","q1":"Explica el mnemónico de Majuelo / Espino albar y qué rasgos te ayuda a recordar.","t1":["majuelas","primavera","espino","blanco","blancas"],"q2":"Describe el carácter principal que identifica a Majuelo / Espino albar a primera vista.","t2":["profundos","lóbulos","hojas"],"catf":"botánica","subf":"árbol"},{"id":"AMP-008","cat":"Botánica","sub":"Árbol","name":"Mostajo","sci":"Sorbus aria","fam":"Rosaceae","freq":"media","key":"Hojas ovales con borde doblemente dentado; haz verde oscuro, envés BLANCO algodonoso y denso","mnem":"El 'árbol con el envés de las hojas como papel blanco': el contraste entre el haz verde oscuro y el envés algodonoso blanco lo hace inconfundible al viento — parece que las hojas parpadean en blanco","etym":"Sorbus (lat.) = 'serbal' · aria = nombre antiguo de la especie","notes":"El envés blanco algodonoso es la clave. Frecuente en las sierras calcáreas de Madrid. Diferencia de Sorbus aucuparia (serbal de cazadores): este tiene hojas SIMPLES (no pinnadas).","hab":"Bosques de montaña, roquedos calcáreos; 600-2000 m","q1":"¿Cómo usarías el mnemónico de Mostajo para no olvidarlo en el examen?","t1":["inconfundible","contraste","algodonoso","árbol","envés"],"q2":"¿Qué rasgo de Mostajo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["doblemente","ovales","algodonoso","hojas","dentado"],"catf":"botánica","subf":"árbol"},{"id":"AMP-009","cat":"Botánica","sub":"Árbol","name":"Aliso","sci":"Alnus glutinosa","fam":"Betulaceae","freq":"alta","key":"Hojas orbiculares con ápice truncado o emarginado (redondeado o con escotadura en el extremo)","mnem":"El 'árbol del agua con piñas de madera': junto a los ríos, con esas pequeñas 'piñas' leñosas que cuelgan en invierno — el único árbol ripario con frutos leñosos en racimo","etym":"Alnus (lat.) = 'aliso' · glutinosa (lat.) = 'pegajosa': por las ramillas y hojas jóvenes","notes":"Los estróbilos leñosos persistentes son absolutamente diagnósticos en invierno. El aliso es el único árbol caducifolio del bosque de galería con nódulos fijadores de N₂ (Frankia = bacteria actinomiceto).","hab":"Orillas de ríos y arroyos; suelos hidromorfos","q1":"¿Qué imagen mental evoca el mnemónico de Aliso? Descríbelo con tus palabras.","t1":["árbol","madera","pequeñas","piñas","agua"],"q2":"¿Cuál es el rasgo más diagnóstico de Aliso? Incluye al menos un término clave.","t2":["orbiculares","emarginado","truncado","hojas","ápice"],"catf":"botánica","subf":"árbol"},{"id":"AMP-010","cat":"Botánica","sub":"Arbusto","name":"Saúco","sci":"Sambucus nigra","fam":"Adoxaceae","freq":"alta","key":"Hojas compuestas pinnadas con 5-7 folíolos lanceolados serrados; olor desagradable al frotar","mnem":"El 'árbol con médula de corcho y moras negras': corta una rama joven y la médula blanca blanda es el sello inconfundible. Las bayas negras en paraguas son el otro rasgo","etym":"Sambucus (lat.) = 'saúco' (instrumento musical hecho con su madera hueca) · nigra = 'negro': por los frutos","notes":"La médula blanca esponjosa es diagnóstica al corte. Muy frecuente en bordes de camino y ruinas. Las flores (para bebidas) y los frutos (para mermelada) tienen uso culinario conocido.","hab":"Bordes de camino, ruinas, bordes de bosque; lugares ruderales y nitrogenados","q1":"Explica el mnemónico de Saúco y qué rasgos te ayuda a recordar.","t1":["inconfundible","médula","árbol","corcho","negras"],"q2":"Describe el carácter principal que identifica a Saúco a primera vista.","t2":["compuestas","lanceolados","desagradable","pinnadas","folíolos"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-011","cat":"Botánica","sub":"Árbol","name":"Avellano","sci":"Corylus avellana","fam":"Betulaceae","freq":"media","key":"Hojas redondeadas con base cordada y ápice acuminado; doble dentado; pelosas","mnem":"El 'árbol de los amentos amarillos en enero': los amentos colgantes del avellano en pleno invierno son la primera señal de vida del bosque caducifolio — antes incluso que el almendro","etym":"Corylus (lat.) = 'avellano' · avellana = de 'Avella Vecchia' (Campania, Italia)","notes":"Los amentos en enero son muy llamativos y diagnósticos. La avellana en su cúpula es única. Importante en la dinámica de los bosques: muy rebrotador tras el fuego.","hab":"Bosques caducifolios atlánticos, bordes de hayedos y robledales","q1":"¿Cómo usarías el mnemónico de Avellano para no olvidarlo en el examen?","t1":["amarillos","amentos","colgantes","árbol","avellano"],"q2":"¿Qué rasgo de Avellano es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["redondeadas","acuminado","cordada","hojas","dentado"],"catf":"botánica","subf":"árbol"},{"id":"AMP-012","cat":"Botánica","sub":"Árbol","name":"Boj","sci":"Buxus sempervirens","fam":"Buxaceae","freq":"alta","key":"Hojas pequeñas, ovales, coriáceas y opuestas; haz verde brillante, envés más pálido","mnem":"El 'arbusto del olor de botica': el olor característico al frotar las hojas es absolutamente inconfundible — intenso y ligeramente desagradable. Las hojitas pequeñas opuestas son su firma visual","etym":"Buxus (lat.) = 'boj' · sempervirens = 'siempre verde'","notes":"El olor + hojas pequeñas opuestas coriáceas son diagnósticos. Muy utilizado en jardinería (setos). En la naturaleza: calcícola, frecuente en las sierras calcáreas de Madrid.","hab":"Bosques y matorrales en suelos calcáreos; umbría","q1":"¿Qué imagen mental evoca el mnemónico de Boj? Descríbelo con tus palabras.","t1":["característico","absolutamente","inconfundible","arbusto","desagradable"],"q2":"¿Cuál es el rasgo más diagnóstico de Boj? Incluye al menos un término clave.","t2":["pequeñas","coriáceas","opuestas","brillante","hojas"],"catf":"botánica","subf":"árbol"},{"id":"AMP-013","cat":"Botánica","sub":"Árbol","name":"Higuera","sci":"Ficus carica","fam":"Moraceae","freq":"media","key":"Hojas muy grandes (10-20 cm), palmadas con 3-7 lóbulos; ásperas al tacto; látex lechoso al cortar","mnem":"El 'árbol del látex blanco y hoja de mano': el látex que sale al cortar una ramita joven + las hojas lobuladas enormes + el higo son únicos","etym":"Ficus (lat.) = 'higo, higuera' · carica = 'de Caria' (región de Asia Menor)","notes":"El higo (sicono) es el fruto más atípico del mundo vegetal. El látex lechoso es diagnóstico al campo. Común en ruinas y zonas calizas de Madrid (naturalizada).","hab":"Zonas calizas, ruinas, laderas soleadas; cultivada","q1":"Explica el mnemónico de Higuera y qué rasgos te ayuda a recordar.","t1":["árbol","blanco","látex","lobuladas","hoja"],"q2":"Describe el carácter principal que identifica a Higuera a primera vista.","t2":["palmadas","grandes","lóbulos","hojas","ásperas"],"catf":"botánica","subf":"árbol"},{"id":"AMP-014","cat":"Botánica","sub":"Arbusto","name":"Aulaga / Tojo","sci":"Ulex europaeus","fam":"Fabaceae","freq":"media","key":"Arbusto completamente cubierto de espinas rígidas que son hojas modificadas","mnem":"El 'arbusto erizo amarillo': todo espinas con flores amarillas fragantes a coco — si pinchas + huele a coco + está en el norte o la sierra, es tojo","etym":"Ulex (lat.) = 'aulaga' (nombre latino directo) · europaeus = 'europeo'","notes":"Diferencia de retama (sin espinas, con hojas rudimentarias) vs. aulaga (espinas que son hojas). Muy frecuente en brezales atlánticos. Las flores pueden aparecer cualquier mes del año.","hab":"Brezales atlánticos, suelos ácidos pobres, bordes de bosque","q1":"¿Cómo usarías el mnemónico de Aulaga / Tojo para no olvidarlo en el examen?","t1":["arbusto","amarillo","amarillas","fragantes","espinas"],"q2":"¿Qué rasgo de Aulaga / Tojo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["completamente","modificadas","arbusto","cubierto","espinas"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-015","cat":"Botánica","sub":"Arbusto","name":"Escoba / Retama negra","sci":"Cytisus scoparius","fam":"Fabaceae","freq":"alta","key":"Tallos verdes, pentagonales (en sección: 5 ángulos) y muy ramificados — diagnóstico táctil","mnem":"El 'arbusto escoba con flores amarillas perfectas': los tallos pentagonales verdes + las flores amarillas llamativas lo distinguen de la retama (tallos cilíndricos, flores más pequeñas)","etym":"Cytisus (gr.) = kytisos (nombre griego de un arbusto similar) · scoparius = 'de escoba': tallos usados para hacer escobas","notes":"Los tallos pentagonales (5 ángulos) son el carácter diagnóstico más preciso para distinguirlo de retama (tallos cilíndricos) y de aulaga (espinosa). Muy frecuente en la sierra de Madrid.","hab":"Brezales y matorrales silíceos atlánticos y de montaña; bordes de bosque","q1":"¿Qué imagen mental evoca el mnemónico de Escoba / Retama negra? Descríbelo con tus palabras.","t1":["pentagonales","amarillas","arbusto","perfectas","escoba"],"q2":"¿Cuál es el rasgo más diagnóstico de Escoba / Retama negra? Incluye al menos un término clave.","t2":["pentagonales","ramificados","diagnóstico","tallos","verdes"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-016","cat":"Botánica","sub":"Arbusto","name":"Gayomba / Retama de flor","sci":"Spartium junceum","fam":"Fabaceae","freq":"media","key":"Tallos cilíndricos (no pentagonales como Cytisus) verdes y junquiformes (como juncos)","mnem":"La 'retama de las flores grandes perfumadas': las flores amarillas son el doble de grandes que las de la retama común, y el olor es intensísimo — la más fragante de las retamas","etym":"Spartium (gr.) = sparton (esparto, cuerda): por los tallos usados para trenzar · junceum = 'parecido al junco'","notes":"El tamaño de las flores (muy grandes) + el olor intenso + los tallos cilíndricos la distinguen de las otras retamas y escobas. Frecuente en taludes y bordes de carretera en Madrid.","hab":"Taludes, bordes de carretera, matorral mediterráneo; calcícola o indiferente","q1":"Explica el mnemónico de Gayomba / Retama de flor y qué rasgos te ayuda a recordar.","t1":["perfumadas","amarillas","retama","grandes","flores"],"q2":"Describe el carácter principal que identifica a Gayomba / Retama de flor a primera vista.","t2":["cilíndricos","junquiformes","tallos","verdes"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-017","cat":"Botánica","sub":"Arbusto","name":"Aladierno / Aladierna","sci":"Rhamnus alaternus","fam":"Rhamnaceae","freq":"media","key":"Hojas perennes, alternas, ovales-lanceoladas, coriáceas, con nervios secundarios arqueados","mnem":"El 'arbusto con bayas en semáforo': los frutos pasan de verde → rojo → negro, así que en el mismo arbusto ves los tres colores a la vez — el semáforo del matorral mediterráneo","etym":"Rhamnus (gr.) = 'rhamno, espino' · alaternus = nombre latino del arbusto","notes":"Los frutos tricolores (verde/rojo/negro simultáneos) son el carácter más llamativo. Las hojas con nervios arqueados son diagnósticas. Forma el sotobosque del encinar.","hab":"Matorral mediterráneo; sotobosque de encinar; suelos calcáreos","q1":"¿Cómo usarías el mnemónico de Aladierno / Aladierna para no olvidarlo en el examen?","t1":["arbusto","semáforo","mediterráneo","bayas","frutos"],"q2":"¿Qué rasgo de Aladierno / Aladierna es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["lanceoladas","perennes","secundarios","alternas","coriáceas"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-018","cat":"Botánica","sub":"Arbusto","name":"Viburno / Morrionera","sci":"Viburnum lantana","fam":"Adoxaceae","freq":"media","key":"Hojas grandes, ovales, finamente dentadas; haz arrugado y con pelillos estrellados (estrellado-tomentoso)","mnem":"El 'arbusto lana': hoja arrugada cubierta de pelillos que dan un tacto suave como lana — y el racimo de bayas en semáforo (verde → rojo → negro) igual que el aladierno","etym":"Viburnum (lat.) = nombre latino del arbusto · lantana = 'llantén' (por las hojas anchas)","notes":"El pubescencia estrellada de las hojas (se ve con lupa) es diagnóstica del género. Diferencia de Sambucus: Viburnum tiene hojas simples, no pinnadas.","hab":"Orlas de bosque, setos, bordes de camino; suelos calcáreos","q1":"¿Qué imagen mental evoca el mnemónico de Viburno / Morrionera? Descríbelo con tus palabras.","t1":["arbusto","arrugada","cubierta","pelillos","lana"],"q2":"¿Cuál es el rasgo más diagnóstico de Viburno / Morrionera? Incluye al menos un término clave.","t2":["finamente","estrellados","grandes","dentadas","arrugado"],"catf":"botánica","subf":"arbusto"},{"id":"AMP-019","cat":"Botánica","sub":"Herbácea","name":"Zanahoria silvestre","sci":"Daucus carota","fam":"Apiaceae (Umbelliferae)","freq":"alta","key":"Umbela blanca con brácteola central oscura (rojiza o purpúrea) en el centro — diagnóstico de especie","mnem":"La 'sombrilla blanca con mancha oscura en el centro': la única umbela que tiene una flor central oscura como un ojo — el truco para ver los polinizadores que ya la visitaron","etym":"Daucus (gr.) = nombre antiguo de la planta · carota (lat.) = nombre de la zanahoria","notes":"La umbela compuesta es el carácter diagnóstico de familia Apiaceae. La brácteola central oscura es el diagnóstico de especie. El aspecto 'en nido' al fructificar es muy llamativo.","hab":"Bordes de camino, pastizales, campos; suelos secos","q1":"Explica el mnemónico de Zanahoria silvestre y qué rasgos te ayuda a recordar.","t1":["sombrilla","polinizadores","blanca","mancha","oscura"],"q2":"Describe el carácter principal que identifica a Zanahoria silvestre a primera vista.","t2":["brácteola","diagnóstico","umbela","blanca","central"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-020","cat":"Botánica","sub":"Herbácea","name":"Hinojo","sci":"Foeniculum vulgare","fam":"Apiaceae (Umbelliferae)","freq":"alta","key":"Hojas muy divididas en segmentos filiformes (como hebras finísimas) — inconfundible","mnem":"El 'apiáceo con olor a anís y hojas de pluma': las hojas finísimas como filamentos + el aroma intenso a anís = solo el hinojo. Imposible confundirlo al olfato","etym":"Foeniculum (lat.) = foenum (heno) + -iculum (pequeño): 'el pequeño heno' — por el aspecto de las hojas","notes":"El olor a anís al frotar es diagnóstico absoluto. Las hojas en filamentos son las más divididas de todos los Apiaceae ibéricos comunes. Muy frecuente en bordes de camino de Madrid.","hab":"Bordes de camino, ribazos, suelos secos y removidos","q1":"¿Cómo usarías el mnemónico de Hinojo para no olvidarlo en el examen?","t1":["apiáceo","filamentos","finísimas","confundirlo","olor"],"q2":"¿Qué rasgo de Hinojo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["inconfundible","divididas","filiformes","segmentos","hojas"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-021","cat":"Botánica","sub":"Herbácea","name":"Cañaheja","sci":"Ferula communis","fam":"Apiaceae (Umbelliferae)","freq":"media","key":"La umbela de Apiaceae más grande de Europa (hasta 2.5 m de altura)","mnem":"El 'girasol de los Apiaceae': la umbela más grande de la familia, sobre el tallo más alto — si ves una umbelifera que te supera en altura, es una Ferula","etym":"Ferula (lat.) = 'palo, varita' — los tallos se usaban como bastón o antorcha en la antigüedad","notes":"La Ferula es la umbela más grande e impresionante. Frecuente en el Mediterráneo ibérico. Tóxica para el ganado (ferulenol). Heracles llevaba una antorcha de Ferula según la mitología.","hab":"Matorral mediterráneo, garrига, suelos calizos","q1":"¿Qué imagen mental evoca el mnemónico de Cañaheja? Descríbelo con tus palabras.","t1":["apiaceae","girasol","umbelifera","umbela","familia"],"q2":"¿Cuál es el rasgo más diagnóstico de Cañaheja? Incluye al menos un término clave.","t2":["apiaceae","umbela","grande","europa"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-022","cat":"Botánica","sub":"Herbácea","name":"Orquídea pirámide","sci":"Anacamptis pyramidalis","fam":"Orchidaceae","freq":"alta","key":"Espiga floral densa con forma piramidal (aguda en el ápice) de flores rosado-púrpura","mnem":"La 'orquídea rosa en pirámide': la inflorescencia piramidal rosada es absolutamente inconfundible. La única orquídea ibérica con esa forma de cono terminado en punta","etym":"Anacamptis (gr.) = anakamptein (curvar hacia atrás): por el espolón curvado · pyramidalis = 'piramidal'","notes":"La familia Orchidaceae es una de las más ricas en especies de la flora ibérica. Anacamptis pyramidalis es la más frecuente en praderas calcáreas. El espolón largo = indica polinización por lepidópteros.","hab":"Prados y pastizales calcáreos; bordes de encinar","q1":"Explica el mnemónico de Orquídea pirámide y qué rasgos te ayuda a recordar.","t1":["inflorescencia","absolutamente","inconfundible","orquídea","pirámide"],"q2":"Describe el carácter principal que identifica a Orquídea pirámide a primera vista.","t2":["piramidal","espiga","floral","densa","forma"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-023","cat":"Botánica","sub":"Herbácea","name":"Ophrys abeja","sci":"Ophrys apifera","fam":"Orchidaceae","freq":"alta","key":"Labelo que imita el abdomen de una abeja (forma, color, textura y olor) — mimetismo sexual","mnem":"La 'orquídea que engaña a las abejas': el labelo imita tan perfectamente a una abeja hembra que los machos intentan copular con la flor — el mayor engaño del reino vegetal","etym":"Ophrys (gr.) = 'ceja': por la forma del labelo que recuerda una ceja · apifera = 'portadora de abeja'","notes":"El mimetismo sexual de Ophrys es uno de los temas más fascinantes de la botánica y es evaluable. La flor engaña a los machos de Eucera (abeja) para que transporten el polen.","hab":"Prados calcáreos, garriga, bordes de encinar","q1":"¿Cómo usarías el mnemónico de Ophrys abeja para no olvidarlo en el examen?","t1":["perfectamente","orquídea","engaña","abejas","labelo"],"q2":"¿Qué rasgo de Ophrys abeja es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["mimetismo","labelo","abdomen","imita","abeja"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-024","cat":"Botánica","sub":"Herbácea","name":"Gamón / Asfódelo","sci":"Asphodelus ramosus","fam":"Asphodelaceae","freq":"alta","key":"Escapo muy alto (hasta 1.5 m) con flores blancas rayadas de pardo; sin hojas en el tallo","mnem":"El 'candelabro blanco del monte': escapo alto con muchas ramas y flores blancas con franja marrón — la planta de los muertos del Hades griego, que crecía en los prados del inframundo","etym":"Asphodelus (gr.) = nombre griego del gamón · ramosus (lat.) = 'ramificado': el escapo tiene ramas","notes":"Muy frecuente en el matorral degradado mediterráneo de Madrid. El escapo alto ramificado con flores blancas rayadas es inconfundible. Indicadora de suelos degradados.","hab":"Matorral mediterráneo degradado; pastizales secos","q1":"¿Qué imagen mental evoca el mnemónico de Gamón / Asfódelo? Descríbelo con tus palabras.","t1":["candelabro","blanco","escapo","monte","inframundo"],"q2":"¿Cuál es el rasgo más diagnóstico de Gamón / Asfódelo? Incluye al menos un término clave.","t2":["escapo","blancas","flores","rayadas","alto"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-025","cat":"Botánica","sub":"Herbácea","name":"Nazarenos / Jacinto de penacho","sci":"Muscari neglectum","fam":"Asparagaceae","freq":"media","key":"Flores en racimo de bolitas azul-violáceas brillantes con borde blanco","mnem":"Las 'bolitas azules en racimo de primavera': el racimo de pequeñas bolas azul-violáceas compactas es una de las flores más reconocibles de la primavera ibérica","etym":"Muscari (lat. / turco) = 'almizcle': por el olor almizclado de algunas especies · neglectum = 'descuidado, olvidado'","notes":"Muscari es la planta con flores azul-violáceas más frecuente de la primavera ibérica. Las flores urceoladas (como botellitas) con borde blanco son diagnósticas del género.","hab":"Prados, olivares, campos; suelos variados","q1":"Explica el mnemónico de Nazarenos / Jacinto de penacho y qué rasgos te ayuda a recordar.","t1":["primavera","bolitas","reconocibles","azules","pequeñas"],"q2":"Describe el carácter principal que identifica a Nazarenos / Jacinto de penacho a primera vista.","t2":["brillantes","violáceas","flores","bolitas","racimo"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-026","cat":"Botánica","sub":"Herbácea","name":"Espárrago triguero / Esparraguera","sci":"Asparagus acutifolius","fam":"Asparagaceae","freq":"media","key":"Cladodios (hojas modificadas): aciculares, muy agudos y rígidos (pinchan) en grupos de 4-12","mnem":"El 'espárrago que pincha': los cladodios rígidos y agudos que pinchan al cogerlo son la diferencia del espárrago silvestre vs. la esparraguera cultivada (blanda). Los turiones primaverales son el espárrago que se come","etym":"Asparagus (gr.) = 'espárrago' · acutifolius = 'de hojas agudas'","notes":"Los cladodios (hojas modificadas) son el carácter diagnóstico de Asparagus. Los turiones primaverales = espárragos trigueros comestibles. Asparagaceae por la estructura floral (6 tépalos).","hab":"Matorral mediterráneo, bordes de encinar y olivar","q1":"¿Cómo usarías el mnemónico de Espárrago triguero / Esparraguera para no olvidarlo en el examen?","t1":["espárrago","cladodios","esparraguera","diferencia","primaverales"],"q2":"¿Qué rasgo de Espárrago triguero / Esparraguera es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["aciculares","cladodios","rígidos","agudos","grupos"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-027","cat":"Botánica","sub":"Herbácea","name":"Lechetrezna / Euforbio","sci":"Euphorbia characias","fam":"Euphorbiaceae","freq":"alta","key":"Látex lechoso blanco muy abundante al cortar cualquier parte — diagnóstico absoluto de Euphorbia","mnem":"La 'planta que sangra blanca': si la rompes y sale abundante látex blanco, es Euphorbia — el látex es la firma de toda la familia, tóxico pero inconfundible","etym":"Euphorbia = del médico Euforbo, doctor del rey Juba II · characias = nombre griego de la planta","notes":"El látex blanco es diagnóstico de familia Euphorbiaceae. El ciatio (inflorescencia única del género) es evaluable como estructura floral especializada. Tóxica por diterpenoides.","hab":"Matorral mediterráneo, garrига; suelos secos","q1":"¿Qué imagen mental evoca el mnemónico de Lechetrezna / Euforbio? Descríbelo con tus palabras.","t1":["inconfundible","abundante","planta","sangra","blanca"],"q2":"¿Cuál es el rasgo más diagnóstico de Lechetrezna / Euforbio? Incluye al menos un término clave.","t2":["abundante","diagnóstico","lechoso","cualquier","látex"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-028","cat":"Botánica","sub":"Herbácea","name":"Clavel silvestre / Clavel de roca","sci":"Dianthus sylvestris","fam":"Caryophyllaceae","freq":"media","key":"5 pétalos rosas con el margen finamente dentado (fleco de peine) — diagnóstico de Dianthus","mnem":"El 'clavel de los roquedos': pétalos rosas con el borde en puntilla (denticulado) + olor a clavel. La flor de Zeus hecha silvestre en las grietas de las rocas","etym":"Dianthus (gr.) = Dios (Zeus/Jupiter) + anthos (flor): 'flor de Zeus' · sylvestris = 'silvestre'","notes":"El borde denticulado de los pétalos es diagnóstico de todo el género Dianthus. La familia Caryophyllaceae: pétalos generalmente escotados o con uña + hojas opuestas + nudos hinchados.","hab":"Roquedos y prados secos de montaña","q1":"Explica el mnemónico de Clavel silvestre / Clavel de roca y qué rasgos te ayuda a recordar.","t1":["roquedos","clavel","pétalos","puntilla","rosas"],"q2":"Describe el carácter principal que identifica a Clavel silvestre / Clavel de roca a primera vista.","t2":["diagnóstico","finamente","pétalos","margen","dentado"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-029","cat":"Botánica","sub":"Herbácea","name":"Colleja","sci":"Silene vulgaris","fam":"Caryophyllaceae","freq":"alta","key":"Cáliz muy hinchado y globoso, como un globo o vesícula — absolutamente único (cáliz vejigoso)","mnem":"La 'globo blanco del campo': el cáliz hinchado como un globo o pompa de jabón con el pétalo blanco asomando es absolutamente único en la flora ibérica","etym":"Silene = de Sileno (compañero de Baco, siempre hinchado) · vulgaris = 'común'","notes":"El cáliz globoso-vejigoso es diagnóstico absoluto de S. vulgaris. Las collejas tienen usos culinarios (tortilla de collejas). Muy frecuente en bordes de camino de Madrid.","hab":"Bordes de camino, pastizales, campos; suelos variados","q1":"¿Cómo usarías el mnemónico de Colleja para no olvidarlo en el examen?","t1":["absolutamente","hinchado","blanco","globo","campo"],"q2":"¿Qué rasgo de Colleja es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["absolutamente","hinchado","globoso","vesícula","cáliz"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-030","cat":"Botánica","sub":"Herbácea","name":"Ortiga mayor","sci":"Urtica dioica","fam":"Urticaceae","freq":"alta","key":"Pelos urticantes en tallos y hojas (secretan histamina y acetilcolina al contacto)","mnem":"La 'planta que quema sin fuego': el escozor al tocarla es su firma — la única planta herbácea europea que duele al tocarla simplemente con rozar","etym":"Urtica (lat.) = 'ortiga' (de urere = quemar) · dioica = 'dioica, con sexos separados'","notes":"La sensación de escozor al contacto (sin tocar las hojas directamente) es el carácter más memorable. Indicadora de nitrógeno (planta nitrófila). Fibra textil históricamente usada.","hab":"Bordes de camino, ruinas, suelos ricos en materia orgánica; nitrófila","q1":"¿Qué imagen mental evoca el mnemónico de Ortiga mayor? Descríbelo con tus palabras.","t1":["planta","escozor","tocarla","simplemente","quema"],"q2":"¿Cuál es el rasgo más diagnóstico de Ortiga mayor? Incluye al menos un término clave.","t2":["urticantes","pelos","tallos","hojas"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-031","cat":"Botánica","sub":"Herbácea","name":"Viborera / Borraja del campo","sci":"Echium vulgare","fam":"Boraginaceae","freq":"alta","key":"Flores tubulares azul-violáceas con estambres rojos que sobresalen — diagnóstico del género","mnem":"La 'borraja azul-rojo de los taludes': flores azules con estambres rojos que sobresalen + la inflorescencia que se desenrolla como una cola de escorpión — el más llamativo de los boragináceos","etym":"Echium (gr.) = echis (víbora): por las semillas que recuerdan a una cabeza de víbora · vulgare = 'común'","notes":"La inflorescencia en escorpioide (cincinno) es característica de Boraginaceae. Los estambres rojos salientes son diagnósticos de Echium. Planta muy atractiva para abejorros.","hab":"Bordes de camino, taludes, yermos; suelos secos","q1":"Explica el mnemónico de Viborera / Borraja del campo y qué rasgos te ayuda a recordar.","t1":["inflorescencia","borraja","estambres","sobresalen","boragináceos"],"q2":"Describe el carácter principal que identifica a Viborera / Borraja del campo a primera vista.","t2":["tubulares","violáceas","diagnóstico","estambres","sobresalen"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-032","cat":"Botánica","sub":"Herbácea","name":"Llantén lanceolado","sci":"Plantago lanceolata","fam":"Plantaginaceae","freq":"alta","key":"Hojas lanceoladas en roseta basal con 3-5 nervios paralelos muy marcados","mnem":"La 'espiga con corona de antenas blancas': la cabezuela cilíndrica con las antenas blancas sobresaliendo como una corona es absolutamente diagnóstica. La más frecuente de los llantenes","etym":"Plantago (lat.) = planta (planta del pie) + ago (actuar): 'el que aplana con los pies' · lanceolata = 'lanceolada'","notes":"Las antenas blancas sobresalientes son diagnósticas en flor. La nerviación paralela de las hojas basales es clave para identificar el género. Muy frecuente en prados pisoteados de Madrid.","hab":"Prados, bordes de camino, suelos pisoteados y nitrogenados; ubiquista","q1":"¿Cómo usarías el mnemónico de Llantén lanceolado para no olvidarlo en el examen?","t1":["sobresaliendo","absolutamente","cilíndrica","cabezuela","espiga"],"q2":"¿Qué rasgo de Llantén lanceolado es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["lanceoladas","paralelos","hojas","roseta","nervios"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-033","cat":"Botánica","sub":"Herbácea","name":"Diente de león","sci":"Taraxacum officinale","fam":"Compositae (Asteraceae)","freq":"alta","key":"Capítulo solitario por escapo; lígulas amarillas en todos los flósculos (solo lígulas, sin flósculos tubulares)","mnem":"La 'bola de hacer deseos': el vilano blanco esférico que se dispersa con el soplo es uno de los símbolos más universales de la naturaleza. Amarillo → blanco esférico","etym":"Taraxacum (árabe/persa) = 'diente de leon' · officinale = 'medicinal, de botica'","notes":"El capítulo con SOLO lígulas (sin flósculos tubulares en el centro) + el vilano plumoso son diagnósticos de Lactuceae (tribu de Compositae). El látex + la roseta lobulada son diagnósticos de Taraxacum.","hab":"Prados, jardines, bordes de camino; ubiquista","q1":"¿Qué imagen mental evoca el mnemónico de Diente de león? Descríbelo con tus palabras.","t1":["universales","esférico","deseos","dispersa","naturaleza"],"q2":"¿Cuál es el rasgo más diagnóstico de Diente de león? Incluye al menos un término clave.","t2":["solitario","capítulo","amarillas","flósculos","lígulas"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-034","cat":"Botánica","sub":"Herbácea","name":"Cardo borriquero","sci":"Cirsium vulgare","fam":"Compositae (Asteraceae)","freq":"alta","key":"Capítulo grande (2-4 cm) de flores tubulares púrpura-violáceas; sin lígulas","mnem":"El 'cardo con alas de espinas en el tallo': si el tallo tiene alas espinosas que continúan la hoja hacia abajo, es Cirsium vulgare — el más común de los cardos de Madrid","etym":"Cirsium (gr.) = kirsos (vena varicosa): usada para tratar varices · vulgare = 'común'","notes":"Las alas decurrentes espinosas son diagnósticas de especie. La tribu Cardueae = involucro espinoso. Importante como alimento de jilgueros (comedores de semillas de cardo).","hab":"Bordes de camino, pastizales perturbados, cunetas","q1":"Explica el mnemónico de Cardo borriquero y qué rasgos te ayuda a recordar.","t1":["espinas","espinosas","continúan","cardo","alas"],"q2":"Describe el carácter principal que identifica a Cardo borriquero a primera vista.","t2":["capítulo","tubulares","violáceas","grande","flores"],"catf":"botánica","subf":"herbácea"},{"id":"AMP-035","cat":"Botánica","sub":"Herbácea","name":"Aciano / Azulejo","sci":"Centaurea cyanus","fam":"Compositae (Asteraceae)","freq":"media","key":"Flores periféricas azul-violáceas intensas muy llamativas, radiantes (más grandes que las centrales)","mnem":"El 'azul eléctrico del campo de trigo': las flores periféricas azul-intenso entre el amarillo del trigo son el color más llamativo del campo castellano en junio","etym":"Centaurea = del centauro Quirón (que usaba la planta para curarse) · cyanus (gr.) = 'azul cielo'","notes":"El azul intenso + las flores periféricas más grandes y estéri
