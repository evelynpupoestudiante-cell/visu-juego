<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VISU · Presentación guiada · 506 especies</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:#f2f2ee;color:#1a1a1a;min-height:100vh}

/* ── PANTALLA DE SELECCIÓN ─────────────────────────────── */
#selector{max-width:680px;margin:0 auto;padding:2rem 1rem}
.sel-title{font-size:22px;font-weight:700;margin-bottom:.3rem}
.sel-sub{font-size:13px;color:#666;margin-bottom:1.75rem}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:1.75rem}
.cat-card{border:1px solid;border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s;background:#fff}
.cat-card:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.1)}
.cat-card.selected{box-shadow:0 0 0 2px currentColor}
.cat-name{font-size:15px;font-weight:600;margin-bottom:4px}
.cat-count{font-size:11px;opacity:.7}
.sub-panel{background:#fff;border:1px solid #e0e0d8;border-radius:10px;padding:16px;margin-bottom:1.5rem}
.sub-panel h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:#888;margin-bottom:12px}
.sub-grid{display:flex;flex-wrap:wrap;gap:8px}
.sub-btn{padding:6px 14px;font-size:13px;border:1px solid #ddd;border-radius:20px;background:#fafaf8;cursor:pointer;color:#444;font-family:inherit;transition:all .12s}
.sub-btn:hover{background:#f0f0e8;border-color:#bbb}
.sub-btn.active{font-weight:500}
.start-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.start-btn{padding:11px 28px;font-size:14px;font-weight:600;border:none;border-radius:8px;cursor:pointer;color:#fff;font-family:inherit;transition:opacity .15s}
.start-btn:hover{opacity:.88}
.start-btn:disabled{opacity:.35;cursor:default}
.start-info{font-size:12px;color:#888}

/* ── BARRA TOP ────────────────────────────────────────── */
#session{display:none;max-width:760px;margin:0 auto;padding:1.25rem 1rem}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap}
.back-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;font-size:12px;border:1px solid #ddd;border-radius:7px;background:#fff;cursor:pointer;color:#555;font-family:inherit}
.back-btn:hover{background:#f5f5f0}
.back-btn svg{width:13px;height:13px}
.session-title{font-size:13px;font-weight:600;color:#333}
.session-sub{font-size:11px;color:#888;margin-top:1px}
.pgbar{flex:1;height:3px;background:#e0e0d8;border-radius:2px;min-width:100px}
.pgfil{height:100%;border-radius:2px;transition:width .5s ease}
.pgnum{font-size:11px;color:#888;white-space:nowrap}

/* ── TARJETA ──────────────────────────────────────────── */
.card{background:#fff;border:1px solid #e0e0d8;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ctop{display:grid;grid-template-columns:280px 1fr}
.carousel{width:280px;display:flex;flex-direction:column;border-right:1px solid #e0e0d8;background:#f5f5f0;flex-shrink:0}
.cimgwrap{width:280px;height:240px;overflow:hidden;flex-shrink:0}
.cimg{width:100%;height:100%;object-fit:cover;display:block}
.cph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px;text-align:center;color:#999}
.cph svg{opacity:.35}
.cph small{font-size:10px;font-family:monospace;color:#bbb}
.cnav{display:flex;align-items:center;justify-content:space-between;padding:5px 9px;border-top:1px solid #e0e0d8;background:#f9f9f6}
.cnbtn{background:transparent;border:none;cursor:pointer;color:#777;padding:4px;border-radius:4px;display:flex}
.cnbtn:hover{background:#ebebeb}
.cnbtn:disabled{opacity:.2;cursor:default}
.cnbtn svg{width:15px;height:15px}
.ccount{font-size:11px;color:#aaa}
.infop{padding:1.1rem;display:flex;flex-direction:column;gap:9px}
.grpbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid;width:fit-content}
.sname{font-size:19px;font-weight:700;line-height:1.2}
.ssci{font-size:13px;font-style:italic;color:#555}
.smeta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:#888}
.freq-tag{font-weight:500}
.mnemblock{padding:10px 13px;border-left:3px solid}
.mnlbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:4px}
.mntxt{font-size:14px;font-style:italic;line-height:1.6}

/* ── PREGUNTAS ────────────────────────────────────────── */
.qblock{padding:.85rem 1.1rem;border-top:1px solid #f0f0e8}
.qlbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#888;display:flex;align-items:center;gap:4px;margin-bottom:6px}
.qtxt{font-size:13px;color:#555;margin-bottom:8px;font-style:italic;line-height:1.5}
.qblock textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:7px;background:#fafaf8;color:#1a1a1a;font-family:inherit;font-size:13px;resize:none;height:54px;line-height:1.5;transition:border-color .15s}
.qblock textarea:focus{outline:none;border-color:#888}
.qrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.chkbtn{padding:6px 14px;font-size:12px;border:1px solid #ccc;border-radius:7px;background:#fff;cursor:pointer;color:#444;font-family:inherit;transition:all .12s}
.chkbtn:hover{background:#f5f5f0}
.skpbtn{padding:4px 11px;font-size:11px;border:1px solid #e0b050;border-radius:7px;background:transparent;cursor:pointer;color:#a07010;font-family:inherit}
.skpbtn:hover{background:#fdf5e0}
.fb{margin-top:8px;padding:8px 11px;border-radius:7px;font-size:12px;line-height:1.5}
.fbok{background:#e8f5ee;color:#1a6b38;border:1px solid #90d0a0}
.fbmiss{background:#fdf5e0;color:#8a5e00;border:1px solid #e0c070}
.qdone{display:flex;align-items:center;gap:7px;padding:.65rem 1.1rem;border-top:1px solid #f0f0e8;font-size:12px;color:#666}
.stgbtn{width:100%;padding:11px 1.1rem;display:flex;align-items:center;justify-content:space-between;background:#f9f9f6;border:none;border-top:1px solid #eeeee8;cursor:pointer;font-size:13px;color:#555;font-family:inherit;transition:background .12s}
.stgbtn:hover{background:#efefea}
.stgbtn svg{width:14px;height:14px;flex-shrink:0}
.stgcnt{padding:.9rem 1.1rem;border-top:1px solid #f0f0e8}
.keytxt{font-size:14px;color:#1a1a1a;line-height:1.65}
.dlbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#888;margin-bottom:4px}
.dtxt{font-size:12px;color:#444;line-height:1.6;margin-bottom:10px}
.dtxt:last-child{margin-bottom:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:10px}
.notesblock{border-radius:7px;padding:9px 12px;border:1px solid}
.noteslbl{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.notestxt{font-size:12px;line-height:1.6}
.rzone{padding:.85rem 1.1rem;border-top:1px solid #f0f0e8}
.rq{font-size:12px;color:#888;margin-bottom:7px;text-align:center}
.rbtnrow{display:flex;gap:7px}
.rbtn{flex:1;padding:7px 0;font-size:12px;border:1px solid #ddd;border-radius:7px;background:#fafaf8;cursor:pointer;color:#555;font-family:inherit;transition:all .12s}
.rbtn:hover{background:#f0f0e8}
.rbtn.r0.on{background:#fdeaea;border-color:#e09090;color:#903030}
.rbtn.r1.on{background:#fdf5e0;border-color:#d8c060;color:#806000}
.rbtn.r2.on{background:#e8f5ee;border-color:#80c890;color:#1a6b38}

/* ── NAVEGACIÓN ───────────────────────────────────────── */
.navrow{display:flex;align-items:center;justify-content:space-between;margin-top:1.1rem;gap:10px}
.nvbtn{display:flex;align-items:center;gap:6px;padding:9px 18px;font-size:13px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;color:#444;font-family:inherit;transition:background .12s}
.nvbtn:hover{background:#f5f5f0}
.nvbtn:disabled{opacity:.25;cursor:default}
.nvbtn svg{width:14px;height:14px;flex-shrink:0}
.nctr{font-size:12px;color:#888;text-align:center}

/* ── RESUMEN ──────────────────────────────────────────── */
.sumwrp{text-align:center;padding:2.5rem 1rem}
.sumttl{font-size:22px;font-weight:700;margin-bottom:.5rem}
.sumsub{font-size:13px;color:#666;margin-bottom:1.5rem;line-height:1.6;max-width:380px;margin-left:auto;margin-right:auto}
.sumgrd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto 1.25rem}
.sumcard{background:#f5f5f0;border-radius:8px;padding:12px}
.sumnum{font-size:28px;font-weight:700;margin-bottom:2px}
.sumlbl{font-size:11px;color:#888}
.sumins{background:#f5f5f0;border-radius:8px;padding:12px 16px;text-align:left;max-width:400px;margin:0 auto 1.5rem;font-size:13px;color:#555;line-height:1.6}
.sum-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rstbtn{padding:10px 22px;font-size:13px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;color:#444;font-family:inherit}
.rstbtn:hover{background:#f5f5f0}
.selbtn{padding:10px 22px;font-size:13px;border:none;border-radius:8px;background:#333;cursor:pointer;color:#fff;font-family:inherit}
.selbtn:hover{background:#111}
</style>
</head>
<body>

<!-- ══ PANTALLA DE SELECCIÓN ══ -->
<div id="selector">
  <div class="sel-title">VISU · Presentación guiada</div>
  <div class="sel-sub">506 especies · elige una categoría y subcategoría para empezar</div>
  <div class="cat-grid" id="cat-grid"></div>
  <div class="sub-panel" id="sub-panel" style="display:none">
    <h3 id="sub-panel-title"></h3>
    <div class="sub-grid" id="sub-grid"></div>
  </div>
  <div class="start-row">
    <button class="start-btn" id="start-btn" disabled onclick="startSession()">Empezar sesión</button>
    <span class="start-info" id="start-info">Selecciona una categoría</span>
  </div>
</div>

<!-- ══ SESIÓN DE ESTUDIO ══ -->
<div id="session">
  <div class="topbar">
    <button class="back-btn" onclick="goBack()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 12L6 8l4-4"/></svg>
      Volver
    </button>
    <div style="flex:1">
      <div class="session-title" id="sess-title"></div>
      <div class="session-sub" id="sess-sub"></div>
    </div>
    <div class="pgbar"><div class="pgfil" id="pg"></div></div>
    <div class="pgnum" id="pgnum"></div>
  </div>
  <div id="main"></div>
  <div class="navrow" id="nav">
    <button class="nvbtn" id="pb" onclick="nav(-1)" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 12L6 8l4-4"/></svg>
      Anterior
    </button>
    <div class="nctr" id="ctr"></div>
    <button class="nvbtn" id="nb" onclick="nav(1)">
      Siguiente
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4l4 4-4 4"/></svg>
    </button>
  </div>
</div>

<script>
const SCRIPT='https://script.google.com/macros/s/AKfycbxe6iZALYLb94DiZAk4KoxvXYvDeza_vJuUgOsAQxX4WhGFb4fO0l_Ob5nKyFRZ4s0L8g/exec';
const ALL_CARDS=[{"id":"FOS-002","cat":"Geología","sub":"Fósil","name":"Belemnites","sci":"Belemnitida (orden)","fam":"Molusco cefalópodo — fósil guía Mesozoico","freq":"alta","key":"Forma cilíndrica o de bala con punta aguda — único entre cefalópodos fósiles","mnem":"La 'bala de cañón de la prehistoria': cilindro apuntado, pesado y sólido — el ammonites que no se enrolló","etym":"Del griego 'belemnon' (dardo, flecha): por su forma","notes":"Fósil guía del Mesozoico. El rostro (lo que se conserva) es la parte más distal. En corte transversal muestra fibras radiales de calcita.","q1":"Explica el mnemónico de Belemnites y qué rasgos te ayuda a recordar.","t1":["prehistoria","cilindro","apuntado","ammonites","cañón"],"q2":"Describe el carácter principal que identifica a Belemnites a primera vista.","t2":["cilíndrica","cefalópodos","forma","punta","fósiles"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-003","cat":"Geología","sub":"Fósil","name":"Nummulites","sci":"Nummulites (género)","fam":"Foraminífero — fósil guía Eoceno","freq":"media","key":"Forma de moneda o lenteja: circular y plana con espiral interna visible en corte","mnem":"La 'moneda de piedra del Eoceno': circular, plana y con espiral. Las pirámides de Egipto están hechas de ellos","etym":"Del latín 'nummus' (moneda) + '-ites' (fósil): 'moneda petrificada'","notes":"Fósil guía del Eoceno (Paleógeno). Las pirámides de Guiza están construidas con caliza nummulítica. Si el fósil es redondo, plano y del tamaño de una moneda, es nummulites.","q1":"¿Cómo usarías el mnemónico de Nummulites para no olvidarlo en el examen?","t1":["circular","moneda","pirámides","piedra","eoceno"],"q2":"¿Qué rasgo de Nummulites es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["circular","lenteja","moneda","forma","espiral"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-005","cat":"Geología","sub":"Fósil","name":"Graptolites","sci":"Graptolithina (subclase)","fam":"Hemicordado colonial — fósil guía Ordovícico-","freq":"media","key":"Aspecto de 'sierra' o 'peinilla': serie de tazas (tecas) a lo largo de un eje (estipe)","mnem":"Los 'jeroglíficos negros en pizarra': rayas negras finas con dientes de sierra. El número de filas de dientes = el período","etym":"Del griego 'graptos' (escrito) + 'lithos' (piedra): 'escritura en piedra'","notes":"Fósil guía de alta precisión para Ordovícico y Silúrico. 2 estipes = Ordovícico; 1 estipe = Silúrico. La orientación de los estipes también varía entre géneros.","q1":"Explica el mnemónico de Graptolites y qué rasgos te ayuda a recordar.","t1":["jeroglíficos","pizarra","negros","negras","dientes"],"q2":"Describe el carácter principal que identifica a Graptolites a primera vista.","t2":["aspecto","peinilla","sierra","serie","tazas"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-006","cat":"Geología","sub":"Fósil","name":"Trilobites","sci":"Trilobita (clase)","fam":"Artrópodo marino — fósil guía Paleozoico","freq":"muy_alta","key":"Cuerpo en 3 lóbulos longitudinales: axial (central) + 2 pleurales (laterales)","mnem":"La 'armadura de tres carriles': cabeza + cuerpo segmentado + cola, con la glabela (bulto central) siempre destacada","etym":"Del griego 'tri' (tres) + 'lobos' (lóbulo): por sus tres lóbulos","notes":"Fósil guía del Paleozoico completo. Saber géneros por período es evaluable. La exuvia (muda) es frecuente — no siempre es el animal completo.","q1":"¿Cómo usarías el mnemónico de Trilobites para no olvidarlo en el examen?","t1":["armadura","segmentado","carriles","cabeza","destacada"],"q2":"¿Qué rasgo de Trilobites es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["longitudinales","pleurales","lóbulos","cuerpo","axial"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-007","cat":"Geología","sub":"Fósil","name":"Equínidos fósiles","sci":"Echinoidea (clase)","fam":"Equinodermo — fósil guía","freq":"alta","key":"Caparazón calcáreo con 5 ambulacros en estrella en la cara superior","mnem":"El 'corazón de piedra del Cretácico': Micraster tiene forma inconfundible de corazón con ambulacros en estrella de 5 puntas","etym":"Del griego 'echinos' (erizo) + 'eidos' (forma)","notes":"Micraster = fósil guía del Cretácico superior. Clypeaster = Mioceno (Neógeno). Las espinas de Cidaris aparecen sueltas muy frecuentemente.","q1":"¿Qué imagen mental evoca el mnemónico de Equínidos fósiles (erizos irregulares)? Descríbelo con tus palabras.","t1":["inconfundible","cretácico","micraster","corazón","ambulacros"],"q2":"¿Cuál es el rasgo más diagnóstico de Equínidos fósiles (erizos irregulares)? Incluye al menos un término clave.","t2":["caparazón","ambulacros","calcáreo","estrella","superior"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-008","cat":"Geología","sub":"Fósil","name":"Crinoides","sci":"Crinoidea (clase)","fam":"Equinodermo — fósil guía","freq":"alta","key":"Discos apilados con orificio central (columnares): lo más frecuente como fósil","mnem":"Los 'botones de estrella de mar': apila discos de 5 puntas perforados — son vértebras de lirio de mar","etym":"Del griego 'krinon' (lirio) + 'eidos' (forma): 'lirio de mar'","notes":"Los discos sueltos son los fósiles de crinoideos más comunes. La simetría 5 y el canal central son los rasgos diagnósticos. Muy frecuentes en calizas paleozoicas. Periodo: Ordovícico-Actualidad (máximo Paleozoico-Mesozoico). Los discos columnares de crinoides son fósiles guía útiles a escala de Era. No son fósiles guía de alta resolución temporal, pero son diagnósticos del Paleozoico marino somero.","q1":"Explica el mnemónico de Crinoides (discos columnares) y qué rasgos te ayuda a recordar.","t1":["estrella","perforados","botones","vértebras","discos"],"q2":"Describe el carácter principal que identifica a Crinoides (discos columnares) a primera vista.","t2":["apilados","orificio","frecuente","discos","central"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-009","cat":"Geología","sub":"Fósil","name":"Rudistas","sci":"Hippuritida (orden)","fam":"Molusco bivalvo — fósil guía Cretácico","freq":"media","key":"Valvas muy asimétricas: una cónica grande (fijada al sustrato) + una opercular plana","mnem":"El 'bivalvo cónico del Cretácico': una valva en cuerno (la grande) + una tapa plana (la pequeña). Constructores de arrecifes del Cretácico","etym":"Del latín 'rudis' (tosco) + '-ites': por la forma basta de sus valvas","notes":"Fósil guía del Cretácico. Las conchas cónicas grandes acumuladas en capas son diagnósticas. Sustituyeron a los corales como constructores de arrecifes en el Cretácico.","q1":"¿Cómo usarías el mnemónico de Rudistas para no olvidarlo en el examen?","t1":["constructores","cretácico","bivalvo","cónico","arrecifes"],"q2":"¿Qué rasgo de Rudistas es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["asimétricas","opercular","valvas","cónica","grande"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-010","cat":"Geología","sub":"Fósil","name":"Corales rugosos","sci":"Rugosa (orden)","fam":"Cnidario — fósil guía Paleozoico","freq":"alta","key":"Forma cónica o cilíndrica con septos internos en disposición 4-radia (vs. 6-radia en modernos)","mnem":"El 'cuerno de coral antiguo': forma de cuerno de vaca con rayas horizontales. Patrón 4-radia en sección = siempre Paleozoico","etym":"Del latín 'rugosus' (arrugado): por la superficie rugosa exterior","notes":"Fósil guía del Paleozoico. Los rugosos se extinguieron en el Pérmico. Patrón 4-radia = Paleozoico (los corales actuales tienen 6-radia).","q1":"¿Qué imagen mental evoca el mnemónico de Corales rugosos? Descríbelo con tus palabras.","t1":["horizontales","cuerno","antiguo","coral","paleozoico"],"q2":"¿Cuál es el rasgo más diagnóstico de Corales rugosos? Incluye al menos un término clave.","t2":["cilíndrica","disposición","internos","cónica","forma"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-011","cat":"Geología","sub":"Fósil","name":"Dientes de tiburón","sci":"Chondrichthyes (clase)","fam":"Vertebrado — pez cartilaginoso","freq":"alta","key":"Forma triangular con bordes serrados (denticulados) — diagnóstico inmediato","mnem":"El 'triángulo serrado marino': negro brillante con bordes como sierra — la firma de los tiburones a través de toda la historia geológica","etym":"Del griego 'karcharias' (diente afilado) + 'odous' (diente)","notes":"Muy reconocibles visualmente. El tamaño permite estimar la especie: Otodus megalodon (Mioceno) = hasta 18 cm; Carcharodon carcharias (actual) = 5-7 cm. Periodo: Cretácico-Actualidad (Otodus megalodon: Oligoceno-Plioceno; Carcharodon: Cretácico-Actualidad). No son fósiles guía en sentido estricto por su amplia distribución temporal, pero el tamaño orienta la edad: dientes >10 cm → probablemente Mioceno-Plioceno (Otodus megalodon) DIFERENCIACIÓN Otodus vs Carcharodon: Otodus (Eoceno-Mioceno, ~56-3.6 Ma) — dientes más grandes y triangulares con cúspides laterales ('hombros') bien marcadas a los lados de la raíz; tamaño hasta 18 cm; bordes lisos o finamente serrados. Carcharodon (Cretácico-Actualidad) — dientes triangulares SIN cúspides laterales en adultos; borde finamente serrado en toda la longitud; C. megalodon (Mioceno-Plioceno) hasta 18 cm; C. carcharias actual hasta 6 cm. Regla práctica: ¿tiene 'hombros' laterales? → Otodus. ¿Sin hombros, serrado uniforme? → Carcharodon.","q1":"Explica el mnemónico de Diente de tiburón fósil (Carcharodon/Otodus) y qué rasgos te ayuda a recordar.","t1":["triángulo","brillante","serrado","marino","tiburones"],"q2":"Describe el carácter principal que identifica a Diente de tiburón fósil (Carcharodon/Otodus) a primera vista.","t2":["triangular","diagnóstico","serrados","inmediato","forma"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-012","cat":"Geología","sub":"Fósil","name":"Bivalvos fósiles","sci":"Bivalvia (clase)","fam":"Molusco — fósil guía Mesozoico","freq":"alta","key":"Dos valvas SIMÉTRICAS entre sí (diferencia clave de braquiópodos que son asimétricas)","mnem":"La 'almeja de piedra con valva en garra': Gryphaea tiene una valva tan curvada que parece una garra — la 'uña del diablo'","etym":"Del latín 'bi' (dos) + 'valva' (hoja de puerta): concha de dos hojas","notes":"Gryphaea ('uña del diablo') muy frecuente en el Jurásico. La simetría de las valvas (iguales entre sí) es lo que distingue a los bivalvos de los braquiópodos. Periodo: Jurásico (Gryphaea: Triásico superior-Cretácico; Exogyra: Cretácico). Gryphaea arcuata es fósil guía del Jurásico inferior (Hettangiense-Sinemuriense). Exogyra es fósil guía del Cretácico. Útiles para datación a escala de Periodo.","q1":"¿Cómo usarías el mnemónico de Bivalvo fósil — Gryphaea / Exogyra para no olvidarlo en el examen?","t1":["almeja","gryphaea","piedra","valva","curvada"],"q2":"¿Qué rasgo de Bivalvo fósil — Gryphaea / Exogyra es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["simétricas","valvas"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-013","cat":"Geología","sub":"Fósil","name":"Gasterópodos fósiles","sci":"Turritella (género)","fam":"Molusco — fósil guía Cenozoico","freq":"alta","key":"Turritella: concha muy alta y estrecha con espira larga puntiaguda — diagnóstica y muy frecuente","mnem":"El 'caracol de piedra puntiagudo': Turritella tiene la espira más alta y estrecha de todos los gasterópodos fósiles — como un cuerno larguísimo","etym":"Del griego 'gaster' (vientre) + 'pous' (pie): 'pie-vientre'","notes":"Turritella es uno de los más frecuentes en exámenes por ser abundantísimo en el Neógeno ibérico y muy reconocible. La espira muy alta y estrecha es inconfundible. Periodo: Cretácico-Actualidad (Turritella: Eoceno-Actualidad, máximo Neógeno). No es fósil guía estricto por su larga duración, pero es muy abundante y diagnóstico del Neógeno ibérico (Mioceno-Plioceno marino).","q1":"¿Qué imagen mental evoca el mnemónico de Gasterópodo fósil — Turritella? Descríbelo con tus palabras.","t1":["puntiagudo","turritella","gasterópodos","caracol","piedra"],"q2":"¿Cuál es el rasgo más diagnóstico de Gasterópodo fósil — Turritella? Incluye al menos un término clave.","t2":["turritella","diagnóstica","puntiaguda","estrecha","concha"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-014","cat":"Geología","sub":"Fósil","name":"Corales tabulados","sci":"Tabulata (orden)","fam":"Cnidario colonial — fósil guía Paleozoico","freq":"alta","key":"Favosites: conjunto de pequeños tubos hexagonales (panal de abejas) — diagnóstico absoluto","mnem":"El 'panal de abejas pétreo': hexágonos perfectos como los de las abejas pero en roca del Paleozoico — solo puede ser Favosites","etym":"Del latín 'tabula' (tabla, plano): por las tabulas horizontales internas","notes":"Fósil guía del Paleozoico (Ordovícico-Pérmico). Favosites con su panal es inconfundible. Halysites tiene aspecto de cadena de eslabones.","q1":"Explica el mnemónico de Corales tabulados (Favosites) y qué rasgos te ayuda a recordar.","t1":["hexágonos","perfectos","paleozoico","abejas","panal"],"q2":"Describe el carácter principal que identifica a Corales tabulados (Favosites) a primera vista.","t2":["favosites","hexagonales","diagnóstico","conjunto","pequeños"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-015","cat":"Geología","sub":"Fósil","name":"Fusulínidos","sci":"Fusulinida (orden)","fam":"Foraminífero — fósil guía Carbonífero-Pérmico","freq":"media","key":"Forma de grano de arroz o huso (fusiforme) con enrollamiento interno complejo","mnem":"El 'grano de arroz de piedra': pequeños, ovalados y con espiral interna — el fósil guía del Pérmico que parece un grano de cereal","etym":"Del latín 'fusus' (huso): por su forma fusiforme","notes":"Excelente fósil guía del Carbonífero-Pérmico. En corte pulido la espiral laberíntica interna es perfectamente visible y diagnóstica.","q1":"¿Cómo usarías el mnemónico de Fusulinidos para no olvidarlo en el examen?","t1":["pequeños","ovalados","grano","piedra","arroz"],"q2":"¿Qué rasgo de Fusulinidos es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["enrollamiento","forma","complejo","grano","interno"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-016","cat":"Geología","sub":"Fósil","name":"Icnofósiles","sci":"Icnofósil","fam":"Traza fósil — icnofósil","freq":"media","key":"No es el organismo sino su actividad: galerías, madrigueras, huellas, excrementos","mnem":"Los 'garabatos de la prehistoria': formas ramificadas o tubulares en la roca que ningún proceso abiótico produce igual","etym":"Del griego 'ichnos' (huella, rastro): señales de actividad biológica fosilizadas","notes":"Pueden aparecer en cortes de roca. Icnofacies = conjunto de icnofósiles que indica el ambiente de deposición. Importante como herramienta paleoambiental. Periodo: varían según el icnofósil — Cruziana: Cámbrico-Devónico; Ophiomorpha: Cretácico-Actualidad; Chondrites: Ordovícico-Actualidad. Los icnofósiles son mejores indicadores de paleoambiente que de edad. Icnofacies de Cruziana → ambiente marino somero.","q1":"¿Qué imagen mental evoca el mnemónico de Icnofósiles (Ophiomorpha / Chondrites)? Descríbelo con tus palabras.","t1":["prehistoria","ramificadas","garabatos","tubulares","formas"],"q2":"¿Cuál es el rasgo más diagnóstico de Icnofósiles (Ophiomorpha / Chondrites)? Incluye al menos un término clave.","t2":["organismo","madrigueras","actividad","excrementos","galerías"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-017","cat":"Geología","sub":"Fósil","name":"Madera fósil","sci":"Xilopalo","fam":"Planta fósil","freq":"media","key":"Aspecto de madera pero peso y dureza de la roca (sílice reemplazó a la celulosa)","mnem":"La 'madera de piedra': tiene textura y anillos de árbol perfectamente visibles pero es tan dura y pesada como una roca — la conservación más perfecta de un vegetal","etym":"Del latín 'silicatus' (de sílice): madera convertida en sílice por permineralización","notes":"Los anillos de crecimiento permiten hacer dendrocronología fósil. La textura de madera visible con dureza mineral son los rasgos diagnósticos combinados. Periodo: desde el Devónico (primeros bosques) hasta el Cuaternario. No es fósil guía por su amplísima distribución temporal. Su valor paleontológico está en indicar presencia de vegetación terrestre y reconstrucción de paleoambientes.","q1":"Explica el mnemónico de Madera fósil (leño silicificado) y qué rasgos te ayuda a recordar.","t1":["perfectamente","conservación","madera","textura","piedra"],"q2":"Describe el carácter principal que identifica a Madera fósil (leño silicificado) a primera vista.","t2":["aspecto","madera","dureza","peso","roca"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-018","cat":"Geología","sub":"Fósil","name":"Nautilus","sci":"Nautiloidea (subclase)","fam":"Molusco cefalópodo — fósil guía Paleozoico-Me","freq":"media","key":"Suturas simples y lisas o ligeramente curvadas (vs. fractales del ammonites)","mnem":"El 'primo simple del ammonites': misma espiral (o recto) pero sus líneas de sutura son curvas suaves, nunca en sierra. Orthoceras = como un colmillo cónico con anillos","etym":"Del griego 'nautilos' (marinero): por su concha flotante","notes":"Orthoceras muy frecuente en mármoles pulidos decorativos (se vende como adorno). Las suturas simples distinguen inequívocamente de los ammonites. Periodo: Nautiloidea: Cámbrico-Actualidad (máximo Paleozoico). Orthoceras: Ordovícico-Devónico. Orthoceras es un buen fósil guía del Paleozoico medio (Ordovícico-Devónico) por su corta duración. Las suturas simples (ortocónicas, sin lóbulos) son diagnósticas.","q1":"¿Cómo usarías el mnemónico de Nautilus / Orthoceras para no olvidarlo en el examen?","t1":["ammonites","simple","espiral","primo","orthoceras"],"q2":"¿Qué rasgo de Nautilus / Orthoceras es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["ligeramente","suturas","simples","curvadas","lisas"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-019","cat":"Geología","sub":"Fósil","name":"Ammonites jurásico","sci":"Dactylioceras (género)","fam":"Ammonites — fósil guía Jurásico inferior (Toa","freq":"alta","key":"Concha enrollada con costillas rectas y robustas que se bifurcan en la mitad del flanco","mnem":"El 'ammonites de los dedos': costillas que se bifurcan a la mitad del flanco como los dedos de una mano — el ammonites más reconocible del Jurásico inferior","etym":"Dactylioceras (gr.) = daktylos (dedo) + keras (cuerno): 'cuerno con dedos' — por la bifurcación de las costillas","notes":"Dactylioceras es el ammonites más fácil de identificar a nivel de género. La bifurcación de costillas + ausencia de quilla son inconfundibles. Muy frecuente en colecciones de IES. Periodo: Jurásico inferior (Toarciense, ~182-174 Ma). Dactylioceras communis es excelente fósil guía del Toarciense (Jurásico inferior), con distribución cosmopolita y ampliamente usado en bioestratigrafía. Alta resolución temporal → fósil guía de primer orden.","q1":"¿Qué imagen mental evoca el mnemónico de Dactylioceras (ammonites jurásico)? Descríbelo con tus palabras.","t1":["ammonites","costillas","bifurcan","reconocible","dedos"],"q2":"¿Cuál es el rasgo más diagnóstico de Dactylioceras (ammonites jurásico)? Incluye al menos un término clave.","t2":["enrollada","costillas","concha","robustas","bifurcan"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-020","cat":"Geología","sub":"Fósil","name":"Ammonites triásico","sci":"Ceratites (género)","fam":"Ammonites ceratítico — fósil guía Triásico me","freq":"alta","key":"Sutura ceratítica: lóbulos redondeados (simples) y sillas dentadas en zigzag simple","mnem":"El 'ammonites del zigzag medio': la sutura con dientes simples (ni fractal ni totalmente lisa) es el estadio intermedio — Triásico siempre","etym":"Ceratites (gr.) = keras (cuerno): 'con forma de cuerno' + el sufijo '-ites' (fósil)","notes":"Herramienta de identificación perfecta: sutura ceratítica = inmediatamente Triásico. Aprender las 3 tipos de sutura (goniatítica/ceratítica/ammonítica) es un must del visu de geología. Ceratites nodosus es fósil guía del Triásico Medio (Anisiense-Ladiniense, ~247-237 Ma) con distribución en el Tethys. La sutura ceratítica (lóbulos subdivididos, sillas simples) es el carácter diagnóstico más útil para identificar el Triásico.","q1":"Explica el mnemónico de Ceratites (ammonites triásico) y qué rasgos te ayuda a recordar.","t1":["ammonites","intermedio","zigzag","dientes","sutura"],"q2":"Describe el carácter principal que identifica a Ceratites (ammonites triásico) a primera vista.","t2":["ceratítica","redondeados","sutura","lóbulos","dentadas"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-022","cat":"Geología","sub":"Fósil","name":"Braquiópodo alado","sci":"Spirifer (género)","fam":"Braquiópodo espiriférido — fósil guía Devónic","freq":"alta","key":"Forma característica con 'alas' laterales muy pronunciadas — diagnóstico inmediato","mnem":"El 'braquiópodo con alas de mariposa': las dos extensiones laterales (alas) son únicas en el reino fósil — si tiene alas y es bivalvo asimétrico, es Spirifer","etym":"Spirifer (lat.) = spira (espiral) + ferre (llevar): 'el que lleva espiral' — braquioforos en espiral internos","notes":"El más fácil de reconocer entre los braquiópodos. Las 'alas' laterales son tan llamativas que lo identifican al instante. Fósil guía del Devónico y Carbonífero inferior.","q1":"¿Qué imagen mental evoca el mnemónico de Spirifer (braquiópodo alado)? Descríbelo con tus palabras.","t1":["braquiópodo","extensiones","mariposa","laterales","asimétrico"],"q2":"¿Cuál es el rasgo más diagnóstico de Spirifer (braquiópodo alado)? Incluye al menos un término clave.","t2":["característica","pronunciadas","diagnóstico","laterales","inmediato"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-024","cat":"Geología","sub":"Fósil","name":"Braquiópodo mesozoico","sci":"Terebratula (género)","fam":"Braquiópodo terebratúlido — fósil guía Mesozo","freq":"alta","key":"Forma oval o globosa lisa (sin costillas o con costillas suaves solamente)","mnem":"El 'braquiópodo con agujero redondo': el orificio circular perfectamente visible en el pico lo distingue de todos los demás. El braquiópodo del Mesozoico por excelencia","etym":"Terebratula (lat.) = terebra (taladro) + -ula (pequeño): 'pequeño taladro' — por el foramen circular","notes":"Terebratula es el braquiópodo más frecuente en el Jurásico y Cretácico. El foramen circular en el umbo es absolutamente diagnóstico del grupo. Pygope tiene una muesca adicional en la comisura. Periodo: Terebratula: Devónico-Actualidad, máximo en Jurásico-Cretácico. Los terebratúlidos son fósiles guía a escala de Periodo (géneros específicos de corta duración). Terebratula del Jurásico ibérico permite dataciones bioestratigráficas.","q1":"¿Cómo usarías el mnemónico de Terebratula (braquiópodo mesozoico) para no olvidarlo en el examen?","t1":["braquiópodo","perfectamente","agujero","orificio","redondo"],"q2":"¿Qué rasgo de Terebratula (braquiópodo mesozoico) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["globosa","forma","oval","lisa"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-025","cat":"Geología","sub":"Fósil","name":"Bivalvo cretácico","sci":"Inoceramus (género)","fam":"Molusco bivalvo — fósil guía Cretácico","freq":"alta","key":"Concha grande, con costillas concéntricas muy pronunciadas y regulares","mnem":"El 'bivalvo con costillas de acordeón': las costillas concéntricas muy marcadas + el interior prismático son inconfundibles. El bivalvo gigante del Cretácico","etym":"Inoceramus (gr.) = is (tendón, fuerza) + keramos (cerámica, concha): 'concha fuerte'","notes":"Fósil guía excelente del Cretácico. Los prismas de calcita (estructura nacarada) se conservan bien y son identificables. Muy utilizado en colecciones de IES.","q1":"¿Qué imagen mental evoca el mnemónico de Inoceramus (bivalvo del Cretácico)? Descríbelo con tus palabras.","t1":["concéntricas","inconfundibles","costillas","bivalvo","acordeón"],"q2":"¿Cuál es el rasgo más diagnóstico de Inoceramus (bivalvo del Cretácico)? Incluye al menos un término clave.","t2":["concéntricas","pronunciadas","costillas","regulares","concha"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-027","cat":"Geología","sub":"Fósil","name":"Pectínido fósil","sci":"Pectinida (orden)","fam":"Molusco bivalvo — fósil guía Neógeno","freq":"alta","key":"Concha semicircular con costillas radiales regulares y 'orejas' simétricas en el umbo","mnem":"La 'vieira de piedra': la forma semicircular con costillas radiales perfectas + orejas del umbo son exactamente la concha del Santiago — fósil y actual son casi idénticos","etym":"Pecten (lat.) = 'peine': por las costillas radiales que recuerdan las púas de un peine","notes":"El pectínido fósil es muy frecuente en colecciones por ser abundante en el Mioceno mediterráneo. La forma de 'concha de Santiago' es inmediatamente reconocible. Periodo: Triásico-Actualidad (Pecten: Mioceno-Actualidad; Chlamys: Eoceno-Actualidad). No son fósiles guía de alta resolución, pero Pecten jacobaeus en el Plioceno mediterráneo sí tiene valor bioestratigráfico. Muy abundantes en el Neógeno ibérico.","q1":"¿Cómo usarías el mnemónico de Pecten / Chlamys (pectínido fósil) para no olvidarlo en el examen?","t1":["semicircular","costillas","exactamente","vieira","perfectas"],"q2":"¿Qué rasgo de Pecten / Chlamys (pectínido fósil) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["semicircular","costillas","regulares","simétricas","radiales"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-030","cat":"Geología","sub":"Fósil","name":"Erizo protuberante","sci":"Clypeaster (género)","fam":"Equinodermo irregular — fósil guía Neógeno","freq":"alta","key":"Forma de galleta o pastel aplanado: circular a oval con cara dorsal ligeramente convexa","mnem":"El 'erizo galleta': plano y redondo como una galleta, con 5 pétalos en la cara dorsal. Si lo agitas y suena, tiene los pilaritos calcáreos dentro","etym":"Clypeaster (lat.) = clypeus (escudo) + aster (estrella): 'estrella-escudo'","notes":"Muy frecuente en el Mioceno mediterráneo ibérico. Aparece frecuentemente en costas y afloramientos de margas miocenas. La forma de galleta + pétalos son diagnósticos. Periodo: Eoceno-Actualidad (máximo abundancia en Mioceno mediterráneo). Clypeaster altus es fósil guía del Mioceno mediterráneo. Muy útil para datar afloramientos neógenos ibéricos. Fósil guía de resolución media (Mioceno).","q1":"¿Cómo usarías el mnemónico de Clypeaster (erizo galleta) para no olvidarlo en el examen?","t1":["galleta","redondo","erizo","pétalos","plano"],"q2":"¿Qué rasgo de Clypeaster (erizo galleta) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["ligeramente","galleta","aplanado","circular","forma"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-031","cat":"Geología","sub":"Fósil","name":"Erizo regular","sci":"Cidaroida (orden)","fam":"Equinodermo regular — fósil guía Triásico-Act","freq":"alta","key":"Tubérculos primarios muy grandes y prominentes en el caparazón (para insertar las espinas)","mnem":"El 'erizo con espinas de bastón': las espinas sueltas de Cidaris son como bastoncitos cilíndricos con cuello — aparecen solas con mucha frecuencia en la roca","etym":"Cidaris (gr./lat.) = 'tiara, corona': por el aspecto del caparazón con tubérculos coroniformes","notes":"Las espinas sueltas son el fósil de Cidaris más frecuente (el caparazón se desintegra, pero las espinas aisladas se conservan bien). Reconocer una espina de Cidaris como tal es evaluable. Periodo: Triásico-Actualidad (Cidaroida). No son fósiles guía de alta resolución por su larga duración evolutiva. Sin embargo, los géneros específicos del Jurásico (Rhabdocidaris) y Cretácico (Cidaris) tienen valor bioestratigráfico a nivel de Periodo.","q1":"¿Qué imagen mental evoca el mnemónico de Cidaris y espinas (erizo regular fósil)? Descríbelo con tus palabras.","t1":["bastoncitos","cilíndricos","espinas","erizo","bastón"],"q2":"¿Cuál es el rasgo más diagnóstico de Cidaris y espinas (erizo regular fósil)? Incluye al menos un término clave.","t2":["tubérculos","prominentes","primarios","caparazón","grandes"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-032","cat":"Geología","sub":"Fósil","name":"Rastro de trilobites","sci":"Cruziana (género)","fam":"Traza fósil — icnofósil Paleozoico","freq":"media","key":"Surco bilobado alargado con estriaciones en V simétricas a ambos lados","mnem":"La 'huella de trilobites en el barro': el surco bilobado con marcas en V simétricas es exactamente lo que un trilobites deja al excavar el sedimento","etym":"Cruziana = del explorador Andrés de Santa Cruz (Bolivia); descrita por d'Orbigny en 1842","notes":"Cruziana es el icnofósil más famoso del Paleozoico. La icnofacies de Cruziana indica ambiente submareal somero (aguas tranquilas). Siempre en Paleozoico inferior.","q1":"Explica el mnemónico de Cruziana (rastro de trilobites) y qué rasgos te ayuda a recordar.","t1":["trilobites","exactamente","simétricas","huella","bilobado"],"q2":"Describe el carácter principal que identifica a Cruziana (rastro de trilobites) a primera vista.","t2":["estriaciones","simétricas","bilobado","alargado","surco"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-034","cat":"Geología","sub":"Fósil","name":"Helecho fósil","sci":"Neuropteris (género)","fam":"Pteridosperma — flora fósil Carbonífero","freq":"alta","key":"Fronde pinnada con pínnulas ovales a redondeadas de bordes enteros","mnem":"El 'helecho gordo de nervios curvados': pínnulas ovales con nervio central prominente y nervios curvados — las más redondeadas de la flora carbonífera","etym":"Neuropteris (gr.) = neuron (nervio) + pteris (helecho): 'helecho de nervios' — por la nervación prominente","notes":"Neuropteris es la planta fósil del Carbonífero más frecuente en colecciones. Técnicamente es una pteridosperma (helecho con semillas) no un helecho verdadero. La nervación pinnada con nervio central es diagnóstica.","q1":"¿Qué imagen mental evoca el mnemónico de Neuropteris (helecho con semillas)? Descríbelo con tus palabras.","t1":["helecho","curvados","nervios","pínnulas","prominente"],"q2":"¿Cuál es el rasgo más diagnóstico de Neuropteris (helecho con semillas)? Incluye al menos un término clave.","t2":["redondeadas","pínnulas","pinnada","fronde","ovales"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-036","cat":"Geología","sub":"Fósil","name":"Equiseto arborescente","sci":"Calamites (género)","fam":"Equisetopsida arborescente — flora fósil Carb","freq":"alta","key":"Molde del interior del tallo: cilíndrico con nudos transversales y surcos longitudinales regulares","mnem":"El 'bambú gigante de piedra del Carbonífero': molde cilíndrico con costillas y nudos — el pariente gigante de la cola de caballo actual","etym":"Calamites (gr.) = calamos (caña, calambre): 'gran caña fósil'","notes":"Los moldes de Calamites son muy frecuentes en el Carbonífero. La comparación con Equisetum (cola de caballo actual) es didácticamente muy útil y evaluable: misma estructura pero escala completamente diferente.","q1":"¿Cómo usarías el mnemónico de Calamites (equiseto arborescente) para no olvidarlo en el examen?","t1":["carbonífero","cilíndrico","gigante","costillas","bambú"],"q2":"¿Qué rasgo de Calamites (equiseto arborescente) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["transversales","longitudinales","cilíndrico","interior","molde"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-037","cat":"Geología","sub":"Fósil","name":"Licopodio arbóreo","sci":"Lepidodendron (género)","fam":"Licopodio arborescente — flora fósil Carboníf","freq":"muy_alta","key":"Corteza con cicatrices en forma de rombo (diamante) dispuestas en espiral — diagnóstico absoluto","mnem":"El 'árbol con piel de serpiente de rombos': el tronco cubierto de marcas romboidales perfectamente ordenadas en espiral es absolutamente único en el registro fósil","etym":"Lepidodendron (gr.) = lepis (escama) + dendron (árbol): 'árbol escamoso' — por las cicatrices romboidales","notes":"Las cicatrices romboidales son el fósil vegetal más fácil de identificar. Imprescindible. Pariente del Lycopodium actual pero a escala de árbol. El 'árbol escamoso' del Carbonífero.","q1":"¿Qué imagen mental evoca el mnemónico de Lepidodendron (licopodio arbóreo)? Descríbelo con tus palabras.","t1":["perfectamente","serpiente","romboidales","absolutamente","cubierto"],"q2":"¿Cuál es el rasgo más diagnóstico de Lepidodendron (licopodio arbóreo)? Incluye al menos un término clave.","t2":["cicatrices","dispuestas","diagnóstico","corteza","espiral"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-038","cat":"Geología","sub":"Fósil","name":"Licopodio con surcos","sci":"Sigillaria (género)","fam":"Licopodio arborescente — flora fósil Carboníf","freq":"alta","key":"Cicatrices foliares en surcos verticales paralelos (vs. espirales en Lepidodendron)","mnem":"El 'árbol con sellos en columnas': cicatrices en filas verticales perfectas (como sellos en un rollo) — diferencia clave de Lepidodendron (cicatrices en espiral)","etym":"Sigillaria (lat.) = sigillum (sello, estampilla): 'árbol sello' — por las cicatrices que parecen sellos","notes":"Par de estudio obligatorio con Lepidodendron. La diferencia es la organización de las cicatrices: Lepidodendron = espiral diagonal; Sigillaria = columnas verticales. Ambas son licopodios arbóreos del Carbonífero.","q1":"Explica el mnemónico de Sigillaria (licopodio con cicatrices en surcos) y qué rasgos te ayuda a recordar.","t1":["cicatrices","lepidodendron","verticales","columnas","diferencia"],"q2":"Describe el carácter principal que identifica a Sigillaria (licopodio con cicatrices en surcos) a primera vista.","t2":["cicatrices","verticales","foliares","paralelos","surcos"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-043","cat":"Geología","sub":"Fósil","name":"Vértebra de ictiosaurio","sci":"Ichthyosauria (orden)","fam":"Reptil marino — fósil guía Triásico-Cretácico","freq":"alta","key":"Vértebra bicóncava (anficélica): ambas caras planas cóncavas — diagnóstico de ictiosaurio","mnem":"La 'vértebra de moneda bicóncava': circular, plana, con dos caras cóncavas — como dos cucharas enfrentadas. Si la vértebra de reptil es bicóncava, es ictiosaurio","etym":"Ichthyosaurus (gr.) = ichthys (pez) + sauros (lagarto): 'lagarto-pez' — por su aspecto convergente con los peces","notes":"Las vértebras bicóncavas de ictiosaurios son muy frecuentes en colecciones del Jurásico inferior (Toarciense). El carácter bicóncavo (anficélico) es la clave diagnóstica.","q1":"¿Qué imagen mental evoca el mnemónico de Vértebra de ictiosaurio? Descríbelo con tus palabras.","t1":["vértebra","bicóncava","enfrentadas","circular","moneda"],"q2":"¿Cuál es el rasgo más diagnóstico de Vértebra de ictiosaurio? Incluye al menos un término clave.","t2":["bicóncava","vértebra","diagnóstico","ictiosaurio","cóncavas"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-046","cat":"Geología","sub":"Fósil","name":"Caballo primitivo","sci":"Hipparion (género)","fam":"Mamífero ungulado — fósil guía Mioceno ibéric","freq":"alta","key":"Dientes hipsodontos (de corona alta) con patrón esmaltado en lazo complejo","mnem":"El 'caballo de tres dedos': si el fósil tiene dientes de caballo pero el hueso de la pata muestra 3 dedos (no 1 como los caballos actuales), es Hipparion — el caballo del Mioceno ibérico","etym":"Hipparion (gr.) = hippos (caballo) + -arion (pequeño): 'caballito'","notes":"MUY RELEVANTE para Madrid: Hipparion es el mamífero más característico del Mioceno de la cuenca del Tajo (donde está Madrid). Su aparición en Europa marca el inicio del Vallesiense (9-11 Ma). Los dientes hipsodontos + 3 dedos son diagnósticos.","q1":"¿Qué imagen mental evoca el mnemónico de Hipparion (caballo primitivo)? Descríbelo con tus palabras.","t1":["caballo","dientes","dedos","hipparion","fósil"],"q2":"¿Cuál es el rasgo más diagnóstico de Hipparion (caballo primitivo)? Incluye al menos un término clave.","t2":["hipsodontos","esmaltado","dientes","complejo","patrón"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-047","cat":"Geología","sub":"Fósil","name":"Molar de mastodonte","sci":"Proboscidea (orden)","fam":"Mamífero proboscídeo — fósil guía Neógeno-Cua","freq":"alta","key":"Molar de gran tamaño con crestas transversales (lophodontia) o colinas en mamut","mnem":"El 'molar de lavadora del Pleistoceno': las laminillas paralelas del mamut parecen las ondas de una lavadora de perfil — inconfundibles por su tamaño y patrón","etym":"Proboscidea (gr.) = proboskis (trompa): 'los de la trompa'","notes":"Los molares de mamut (Mammuthus) son muy frecuentes en colecciones del Pleistoceno. Las laminillas de esmalte paralelas de Mammuthus vs. las colinas de Gomphotherium son la diferencia diagnóstica clave. Periodo: Mammuthus (mamut): Plioceno-Pleistoceno (~5 Ma-10.000 años). Gomphotherium (mastodonte): Mioceno. Excelentes fósiles guía del Cenozoico: Gomphotherium → Mioceno; Mammuthus → Pleistoceno. Muy importantes para la Cuenca de Madrid (Mioceno continental).","q1":"Explica el mnemónico de Molar de mastodonte / proboscídeo y qué rasgos te ayuda a recordar.","t1":["pleistoceno","inconfundibles","laminillas","lavadora","paralelas"],"q2":"Describe el carácter principal que identifica a Molar de mastodonte / proboscídeo a primera vista.","t2":["transversales","crestas","tamaño","molar","colinas"],"catf":"geología","subf":"fósil","hab":""},{"id":"FOS-056","cat":"Geología","sub":"Fósil","name":"Estromatolito","sci":"Estromatolito","fam":"Bioherma microbiano — el registro de vida más","freq":"alta","key":"Estructura laminada en capas convexas concéntricas (como una col cortada)","mnem":"La 'col de piedra de 3.500 millones de años': sección con capas concéntricas como una col o una cebolla — el registro de vida más antiguo del planeta","etym":"Stromatolite (gr.) = stroma (cama, tapete) + lithos (piedra): 'piedra tapete'","notes":"Los estromatolitos son el registro fósil más antiguo (Archaean, 3.500 Ma). Son construidos por comunidades de cianobacterias. El hecho de que produjeron el O₂ de la atmósfera es enormemente evaluable. Periodo: Precámbrico (3.500 Ma) hasta Actualidad. Son el registro biológico más antiguo conocido. No son fósiles guía en sentido clásico por su duración de 3.500 Ma, pero su abundancia marca el Precámbrico (especialmente el Arqueano y Proterozoico). Estromatolitos del Proterozoico son diagnósticos de ese Eón.","q1":"Explica el mnemónico de Estromatolito y qué rasgos te ayuda a recordar.","t1":["concéntricas","millones","piedra","sección","registro"],"q2":"Describe el carácter principal que identifica a Estromatolito a primera vista.","t2":["estructura","concéntricas","laminada","convexas","capas"],"catf":"geología","subf":"fósil","hab":""},{"id":"GEO-001","cat":"Geología","sub":"Geomorfología","name":"Karst / Lapiaz","sci":"Lapiaz (karren)","fam":"Relieve kárstico","freq":"alta","key":"Surcos y acanaladuras en superficie calcárea por disolución","mnem":"El 'queso gruyer de roca': agujeros, canales y surcos en caliza — el agua ácida esculpe la piedra calcárea","etym":"Del esloveno 'Kras' (región de Eslovenia): paisaje calcáreo de referencia","notes":"En Madrid el tribunal puede incluir fotografías de paisajes. Karst es uno de los más evaluados. Saber identificar: lapiaz, dolina, cueva, polje, surgencia.","q1":"¿Qué imagen mental evoca el mnemónico de Karst / Lapiaz? Descríbelo con tus palabras.","t1":["agujeros","gruyer","queso","canales","surcos"],"q2":"¿Cuál es el rasgo más diagnóstico de Karst / Lapiaz? Incluye al menos un término clave.","t2":["acanaladuras","superficie","disolución","calcárea","surcos"],"catf":"geología","subf":"geomorfología","hab":""},{"id":"GEO-002","cat":"Geología","sub":"Geomorfología","name":"Meandro","sci":"Meandro fluvial","fam":"Relieve fluvial","freq":"alta","key":"Curva muy pronunciada de un río sobre llanura de inundación","mnem":"La 'serpiente de río': curvas pronunciadas que forman S y dejan lagunas en herradura al cortarse","etym":"Del griego 'Maiandros' (río Meandro, actual Büyük Menderes, Turquía)","notes":"Muy frecuente en fotografías de geomorfología del visu de Madrid. Saber identificar: meandro, llanura de inundación, oxbow lake, meandro encajado.","q1":"Explica el mnemónico de Meandro y qué rasgos te ayuda a recordar.","t1":["pronunciadas","serpiente","herradura","curvas","forman"],"q2":"Describe el carácter principal que identifica a Meandro a primera vista.","t2":["pronunciada","inundación","llanura","curva"],"catf":"geología","subf":"geomorfología","hab":""},{"id":"GEO-003","cat":"Geología","sub":"Geomorfología","name":"Glaciar / Circo glaciar","sci":"Circo glaciar (cwm)","fam":"Relieve glaciar","freq":"alta","key":"Depresión semicircular con paredes verticales en cabecera de valle glaciar","mnem":"El 'cuenco de montaña': depresión semicircular tallada por el hielo con paredes verticales y frecuentemente un lago azul en el fondo","etym":"Del latín 'circus' (círculo): por la forma redondeada","notes":"Muy evaluado en visu de geomorfología de Madrid. Formas glaciares frecuentes: circo, arista, horn (cuerno), valle en U, morrenas.","q1":"¿Cómo usarías el mnemónico de Glaciar / Circo glaciar para no olvidarlo en el examen?","t1":["semicircular","frecuentemente","depresión","montaña","verticales"],"q2":"¿Qué rasgo de Glaciar / Circo glaciar es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["semicircular","depresión","verticales","paredes","cabecera"],"catf":"geología","subf":"geomorfología","hab":""},{"id":"GEO-004","cat":"Geología","sub":"Geomorfología","name":"Duna","sci":"Duna eólica (erg)","fam":"Relieve eólico","freq":"media","key":"Acumulación de arena modelada por el viento con perfil asimétrico","mnem":"La 'ola de arena congelada': perfil asimétrico — suave por donde entra el viento, escarpado por donde sale","etym":"Del holandés 'duin' (colina de arena)","notes":"Puede aparecer en fotografías. Saber diferenciar: barcán (medialuna, viento unidireccional), duna longitudinal, duna transversal.","q1":"¿Qué imagen mental evoca el mnemónico de Duna? Descríbelo con tus palabras.","t1":["congelada","asimétrico","arena","perfil","escarpado"],"q2":"¿Cuál es el rasgo más diagnóstico de Duna? Incluye al menos un término clave.","t2":["acumulación","asimétrico","modelada","arena","viento"],"catf":"geología","subf":"geomorfología","hab":""},{"id":"GEO-005","cat":"Geología","sub":"Geomorfología","name":"Delta fluvial","sci":"Delta fluvial","fam":"Relieve costero-fluvial","freq":"media","key":"Depósito sedimentario triangular a la desembocadura de un río","mnem":"La 'boca de río que gana terreno al mar': triángulo de sedimento que el río construye en el mar","etym":"De 'Delta' (Δ): letra griega de forma triangular, como los deltas del Nilo","notes":"Puede aparecer en fotografías satelitales. El delta del Ebro es el más reconocible de España.","q1":"Explica el mnemónico de Delta fluvial y qué rasgos te ayuda a recordar.","t1":["triángulo","sedimento","construye","terreno","boca"],"q2":"Describe el carácter principal que identifica a Delta fluvial a primera vista.","t2":["sedimentario","desembocadura","triangular","depósito"],"catf":"geología","subf":"geomorfología","hab":""},{"id":"GEO-006","cat":"Geología","sub":"Geomorfología","name":"Rañas / Pedrera","sci":"Raña (glacis de acumulación)","fam":"Relieve periglaciar / Piedemonte","freq":"alta","key":"Superficie plana de piedemonte cubierta de cantos redondeados rojizos (cuarcitas)","mnem":"La 'moqueta roja de la sierra': superficie plana de piedras rojizas que alfombra el pie de la sierra — son rañas","etym":"Del español 'raña': zona pedregosa de piedemonte (término geomorfológico ibérico)","notes":"MUY ESPECÍFICO DE MADRID. Las rañas son características del piedemonte del Sistema Central (Comunidad de Madrid). Un tribunal madrileño puede incluir una foto de raña en el visu.","q1":"¿Cómo usarías el mnemónico de Rañas / Pedrera para no olvidarlo en el examen?","t1":["superficie","moqueta","sierra","piedras","alfombra"],"q2":"¿Qué rasgo de Rañas / Pedrera es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["superficie","piedemonte","redondeados","cubierta","plana"],"catf":"geología","subf":"geomorfología","hab":""},{"id":"GEO-007","cat":"Geología","sub":"Geomorfología","name":"Escarpe de falla","sci":"Escarpe de falla / Falla normal","fam":"Relieve tectónico","freq":"media","key":"Pared o escalón abrupto en el paisaje causado por un movimiento de falla","mnem":"El 'escalón de la sierra': el contacto vertical entre la sierra elevada y la llanura es una falla — la naturaleza tiene escalones","etym":"Del francés 'escarpement' (talud, declive abrupto)","notes":"El Sistema Central es un horst elevado por fallas normales — contexto geológico directo de Madrid. Puede aparecer en fotografías de geomorfología.","q1":"¿Qué imagen mental evoca el mnemónico de Escarpe de falla? Descríbelo con tus palabras.","t1":["escalón","contacto","vertical","naturaleza","sierra"],"q2":"¿Cuál es el rasgo más diagnóstico de Escarpe de falla? Incluye al menos un término clave.","t2":["movimiento","escalón","abrupto","paisaje","pared"],"catf":"geología","subf":"geomorfología","hab":""},{"id":"GEO-008","cat":"Geología","sub":"Geomorfología","name":"Cárcavas / Badlands","sci":"Cárcava (gully erosion)","fam":"Relieve de erosión hídrica","freq":"media","key":"Red de barrancos y surcos muy pronunciados en terrenos blandos (arcillas, margas)","mnem":"El 'laberinto de barro': red de barranquitos en terreno blando — el agua lluvia 'lame' la arcilla hasta crear un laberinto","etym":"Del español 'cárcava' (barranco pequeño) y del inglés 'badlands' (tierras malas)","notes":"Frecuentes en la cuenca del Tajo (arcillas y margas miocenas). Pueden aparecer en fotografías del visu de Madrid.","q1":"Explica el mnemónico de Cárcavas / Badlands y qué rasgos te ayuda a recordar.","t1":["barranquitos","laberinto","terreno","barro","blando"],"q2":"Describe el carácter principal que identifica a Cárcavas / Badlands a primera vista.","t2":["pronunciados","barrancos","terrenos","surcos","blandos"],"catf":"geología","subf":"geomorfología","hab":""},{"id":"MIN-001","cat":"Geología","sub":"Mineral","name":"Cuarzo","sci":"Cuarzo (SiO₂)","fam":"Tectosílicato","freq":"muy_alta","key":"Brillo vítreo muy característico; fractura concoidea (como el vidrio roto)","mnem":"El mineral más abundante de la corteza: si brilla como vidrio y no lo raya la navaja, es cuarzo","etym":"Del alemán antiguo 'Quarz' (origen incierto, posiblemente eslavo 'tvrdý' = duro)","notes":"Sale en prácticamente todos los exámenes. Identificar variedad: hialino, lechoso, ahumado, rosa, amatista (violeta), citrino (amarillo). Puede aparecer también como componente en granito o cuarcita. PRUEBAS: (1) Raya la uña y el vidrio (dur.7). (2) Fractura concoidea al golpear — como vidrio roto. (3) Brillo vítreo intenso. (4) Sin reacción al HCl. CONFUSIÓN CON: Feldespato (ortosa/plagioclasa) — el cuarzo NO tiene clivaje, fractura concoidea; el feldespato sí tiene clivaje en dos direcciones. Vidrio artificial — el vidrio tiene el mismo brillo pero no tiene estructura cristalina. Calcita incolora — reacciona al HCl (cuarzo no).","q1":"¿Cómo usarías el mnemónico de Cuarzo para no olvidarlo en el examen?","t1":["abundante","mineral","corteza","brilla","vidrio"],"q2":"¿Qué rasgo de Cuarzo es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["característico","concoidea","fractura","brillo","vítreo"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-002","cat":"Geología","sub":"Mineral","name":"Ortosa","sci":"Ortosa (KAlSi₃O₈)","fam":"Tectosílicato","freq":"muy_alta","key":"Color rosado-salmón o blanco cremoso muy característico","mnem":"La piedra 'salmón con espejos': color rosado y dos caras planas brillantes perpendiculares","etym":"Del griego 'orthos' (recto) + 'klasis' (fractura): fractura recta — dos clivajes a 90°","notes":"CONFIRMADO: aparece en 2 de cada 3 convocatorias de Madrid documentadas. Es el feldespato por excelencia del examen. Clave: color rosado + dos clivajes a 90°. Siempre pedir el grupo mineralógico: tectosílicato. PRUEBAS: (1) Color rosado-salmón característico. (2) Clivaje perfecto en 2 direcciones a ~90°. (3) Dureza 6: raya el vidrio pero no el cuarzo. (4) Extinción oblicua bajo microscopio (campo). CONFUSIÓN CON: Plagioclasa — la ortosa carece de estriación polisintética; color más rosado/salmón vs. blanco-grisáceo. Cuarzo rosado — el cuarzo NO tiene clivaje; la ortosa sí. Halita — sabor salado y dureza 2 (uña la raya) vs. dureza 6 de la ortosa.","q1":"¿Qué imagen mental evoca el mnemónico de Feldespato ortosa? Descríbelo con tus palabras.","t1":["perpendiculares","brillantes","piedra","espejos","salmón"],"q2":"¿Cuál es el rasgo más diagnóstico de Feldespato ortosa? Incluye al menos un término clave.","t2":["característico","rosado","color","salmón","cremoso"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-003","cat":"Geología","sub":"Mineral","name":"Plagioclasa","sci":"Plagioclasa (NaAlSi₃O₈ – CaAl₂Si₂O₈)","fam":"Tectosílicato","freq":"alta","key":"Color blanco-grisáceo o verdoso, menos rosado que la ortosa","mnem":"La feldespato 'rayado': las finas estrías paralelas en su cara brillante son únicas entre los feldespatos","etym":"Del griego 'plagios' (oblicuo) + 'klasis' (fractura): clivaje oblicuo","notes":"Puede confundirse con ortosa. La estriación polisintética (rayas paralelas bajo la lupa) es la clave diagnóstica. En colecciones de IES muy presente en gabros y basaltos. PRUEBAS: (1) Buscar estriación polisintética con lupa (rayitas paralelas en la superficie de clivaje): diagnóstico definitivo. (2) Color blanco-grisáceo o con tinte verdoso. (3) Clivaje a ~90°. CONFUSIÓN CON: Ortosa — la ortosa NO tiene estriación polisintética y es más rosada. Cuarzo blanco — sin clivaje, fractura concoidea. Wollastonita — también blanca y acicular pero en contexto metamórfico.","q1":"Explica el mnemónico de Plagioclasa y qué rasgos te ayuda a recordar.","t1":["feldespato","paralelas","feldespatos","brillante","rayado"],"q2":"Describe el carácter principal que identifica a Plagioclasa a primera vista.","t2":["grisáceo","blanco","verdoso","color","rosado"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-004","cat":"Geología","sub":"Mineral","name":"Moscovita","sci":"Moscovita (KAl₂(AlSi₃)O₁₀(OH)₂)","fam":"Filosilicato","freq":"muy_alta","key":"Láminas flexibles y elásticas muy finas (exfoliación perfecta en una dirección)","mnem":"El mineral 'hoja de libro': se separa en láminas plateadas infinitamente delgadas","etym":"De 'Moscovia' (nombre antiguo de Rusia), donde se usaba como vidrio en ventanas","notes":"Uno de los más frecuentes. Muy habitual en colecciones de IES. Siempre diferenciar de biotita (oscura). Ambas pueden aparecer en el mismo examen. PRUEBAS: (1) Doblar una lámina: si es flexible y elástica (vuelve a su posición) = moscovita. (2) Color plateado o dorado muy pálido. (3) Transparente en láminas delgadas. (4) Exfoliación perfecta en UNA dirección. CONFUSIÓN CON: Biotita — misma forma pero color negro a marrón oscuro (biotita contiene Fe/Mg). Talco — similar al tacto pero no da láminas elásticas; más graso. Clorita — verde intenso; las láminas de clorita son menos elásticas.","q1":"¿Cómo usarías el mnemónico de Mica moscovita para no olvidarlo en el examen?","t1":["infinitamente","mineral","plateadas","láminas","separa"],"q2":"¿Qué rasgo de Mica moscovita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["flexibles","elásticas","láminas","finas"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-005","cat":"Geología","sub":"Mineral","name":"Biotita","sci":"Biotita (K(Mg,Fe)₃(AlSi₃)O₁₀(OH)₂)","fam":"Filosilicato","freq":"muy_alta","key":"Igual que moscovita pero color negro a marrón oscuro (por el hierro y magnesio)","mnem":"La mica 'negra': mismo comportamiento que la moscovita pero completamente oscura","etym":"Del físico francés Jean-Baptiste Biot (1774-1862), que estudió las propiedades ópticas de las micas","notes":"Par obligatorio con moscovita. Muy frecuente en granitos del Sistema Central — directamente relevante para Madrid. PRUEBAS: (1) Color negro a marrón oscuro + láminas flexibles y elásticas = biotita (no moscovita). (2) Exfoliación perfecta en una dirección. (3) Brillo submetálico en láminas. CONFUSIÓN CON: Moscovita — mismo hábito laminar pero incolora/plateada (sin Fe/Mg). Hornblenda — también negra pero sin exfoliación laminar; prismas con clivaje a 120°. Grafito — laminar y negro pero no elástico; mancha los dedos.","q1":"¿Qué imagen mental evoca el mnemónico de Mica biotita? Descríbelo con tus palabras.","t1":["comportamiento","completamente","moscovita","negra","mica"],"q2":"¿Cuál es el rasgo más diagnóstico de Mica biotita? Incluye al menos un término clave.","t2":["moscovita","igual","color","marrón","negro"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-006","cat":"Geología","sub":"Mineral","name":"Calcita","sci":"Calcita (CaCO₃)","fam":"Carbonato","freq":"muy_alta","key":"Reacciona vivamente con HCl diluido (efervescencia — CO₂): prueba diagnóstica definitiva","mnem":"El mineral del 'vinagre': pon una gota de ácido y verás burbujas. El único que 'bulle' sin calor","etym":"Del latín 'calx' (cal): la cal viva se obtiene calcinando calcita","notes":"Siempre hay ácido disponible en el examen. Si hace burbujas + romboedros perfectos = calcita. Diferenciar de dolomita (reacción lenta o nula en frío). PRUEBAS: (1) Aplicar HCl diluido en frío: EFERVESCENCIA VIVA inmediata = calcita (definitivo). (2) Romboedros perfectos (clivaje en 3 dir. a 75°). (3) Dureza 3: raya el yeso, no raya el vidrio. CONFUSIÓN CON: Dolomita — misma reacción pero SOLO en polvo o con HCl caliente, no en frío. Aragonito — igual composición, reacciona al HCl pero cristales prismáticos (no romboedros). Yeso — no reacciona al HCl; dureza 2 (uña lo raya).","q1":"Explica el mnemónico de Calcita y qué rasgos te ayuda a recordar.","t1":["mineral","vinagre","burbujas","ácido","gota"],"q2":"Describe el carácter principal que identifica a Calcita a primera vista.","t2":["reacciona","diagnóstica","vivamente","definitiva","diluido"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-007","cat":"Geología","sub":"Mineral","name":"Dolomita","sci":"Dolomita (CaMg(CO₃)₂)","fam":"Carbonato","freq":"media","key":"Similar a la calcita pero reacciona solo en polvo o con HCl caliente","mnem":"La 'calcita remolona': misma forma pero el ácido en frío no burbujea casi nada","etym":"Del geólogo francés Déodat de Dolomieu (1750-1801)","notes":"La prueba del HCl en frío es la clave diferencial vs. calcita. A menudo en muestras de rocas dolomíticas. PRUEBAS: (1) HCl frío → NO burbujea (o muy débilmente). (2) Raspar en polvo y aplicar HCl → burbujea. (3) Cristales en silla de montar (curvados). (4) A menudo con tinte rosado o blanco cremoso. CONFUSIÓN CON: Calcita — la calcita burbujea vivamente al HCl en frío; la dolomita no. Aragonito — reacciona al HCl pero cristales prismáticos. Siderita — marrón-parda, tampoco reacciona al HCl frío pero sin cristales en silla de montar.","q1":"¿Cómo usarías el mnemónico de Dolomita para no olvidarlo en el examen?","t1":["remolona","calcita","burbujea","forma","ácido"],"q2":"¿Qué rasgo de Dolomita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["reacciona","similar","calcita","caliente","polvo"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-008","cat":"Geología","sub":"Mineral","name":"Yeso","sci":"Yeso (CaSO₄·2H₂O)","fam":"Sulfato","freq":"alta","key":"Dureza 2: único mineral común que raya con la uña","mnem":"El único mineral que raya tu uña. Si lo rasca la yema del dedo, es yeso","etym":"Del árabe 'jibs' → latín 'gypsum'","notes":"La prueba de la uña es diagnóstica e inmediata. Muy abundante en el Mioceno de la cuenca del Tajo — directamente relevante para Madrid. PRUEBAS: (1) Rayar con la uña: si marca con facilidad = yeso (dur.2, única opción común). (2) Comprobar que NO reacciona al HCl (diferencia de calcita). (3) Variedades: selenita (transparente laminada), alabastro (masivo blanco), fibra de yeso (fibroso). CONFUSIÓN CON: Calcita — reacciona al HCl (el yeso no). Talco — también dur.1 pero aspecto graso/jabonoso y no laminar. Anhidrita — no la raya la uña (dur.3-3.5), mismo color pero más dura. Halita — forma cúbica y sabor salado.","q1":"¿Qué imagen mental evoca el mnemónico de Yeso? Descríbelo con tus palabras.","t1":["mineral","único","rasca","raya","yema"],"q2":"¿Cuál es el rasgo más diagnóstico de Yeso? Incluye al menos un término clave.","t2":["dureza","mineral","único","común","raya"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-009","cat":"Geología","sub":"Mineral","name":"Halita (sal gema)","sci":"Halita (NaCl)","fam":"Haluro","freq":"media","key":"Sabor salado inconfundible — si te dejan probarlo","mnem":"La 'piedra de sal': cubos perfectos y sabor salado. Si te dicen que no la chupes, ya sabes que es halita","etym":"Del griego 'hals' (sal) + 'lithos' (piedra)","notes":"Reconocible por su forma cúbica. Si no permiten probarla, la forma cúbica del clivaje es suficiente. PRUEBAS: (1) Si se puede: probar — sabor SALADO inconfundible. (2) Clivaje cúbico perfecto en 3 dir. a 90°: fragmentos siempre cúbicos. (3) Dureza 2.5: uña casi lo raya. (4) Transparente a translúcido. CONFUSIÓN CON: Silvita — misma forma cúbica pero sabor AMARGO/PICANTE (no salado). Fluorita — también cúbica pero mucho más dura (dur.4) y colores variados. Calcita incolora — clivaje romboédrico (no cúbico); reacciona al HCl.","q1":"Explica el mnemónico de Halita (sal gema) y qué rasgos te ayuda a recordar.","t1":["perfectos","piedra","cubos","salado","sabor"],"q2":"Describe el carácter principal que identifica a Halita (sal gema) a primera vista.","t2":["inconfundible","probarlo","salado","sabor","dejan"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-010","cat":"Geología","sub":"Mineral","name":"Pirita","sci":"Pirita (FeS₂)","fam":"Sulfuro","freq":"alta","key":"Color amarillo dorado metálico muy brillante — 'oro de tontos'","mnem":"El 'oro de los tontos': brilla como el oro pero es mucho más duro y sus caras tienen estrías cruzadas","etym":"Del griego 'pyr' (fuego): al golpearla produce chispas","notes":"Sale con frecuencia. Clave diferencial vs. oro: pirita = dura + cubos estriados. Colecciones de IES casi siempre la tienen. PRUEBAS: (1) Color amarillo dorado metálico brillante. (2) Dureza 6-6.5: raya el vidrio. (3) Raya negra o negra-verdosa (NO amarilla). (4) Cristales cúbicos o pentagonododecaédricos, a menudo estriados. CONFUSIÓN CON: Oro nativo — el oro es MALEABLE (se dobla con navaja), muy pesado (dens.19), raya amarilla. La pirita es dura y frágil. Calcopirita — más amarilla y verdosa, iridiscente, más blanda (dur.3.5-4). Marcasita — misma composición que pirita pero cristales tabulares.","q1":"¿Cómo usarías el mnemónico de Pirita para no olvidarlo en el examen?","t1":["tontos","brilla","cruzadas","mucho","estrías"],"q2":"¿Qué rasgo de Pirita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["amarillo","brillante","metálico","color","dorado"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-011","cat":"Geología","sub":"Mineral","name":"Galena","sci":"Galena (PbS)","fam":"Sulfuro","freq":"media","key":"Gris metálico muy brillante con clivaje cúbico perfecto en 3 direcciones","mnem":"El mineral 'cubo de plomo': muy pesado, gris metálico y se parte en cubos perfectos","etym":"Del latín 'galena' (mineral de plomo), nombre ya usado por Plinio el Viejo","notes":"La densidad es la clave: si el ejemplar parece sorprendentemente pesado y es gris metálico, galena. Común en colecciones. PRUEBAS: (1) Gris metálico plomizo muy pesado (dens.7.6: sorprendente al coger). (2) Clivaje cúbico perfecto en 3 dir. (3) Raya gris-plomiza. (4) Dureza 2.5: uña casi lo raya. CONFUSIÓN CON: Molibdenita — también gris metálica pero laminar, muy blanda y mancha los dedos. Grafito — menos pesado, laminar, mancha. Arsenopirita — plateada más brillante, olor a ajo al rayar. Antimonio nativo — similar pero más raro.","q1":"¿Qué imagen mental evoca el mnemónico de Galena? Descríbelo con tus palabras.","t1":["mineral","metálico","perfectos","pesado","plomo"],"q2":"¿Cuál es el rasgo más diagnóstico de Galena? Incluye al menos un término clave.","t2":["brillante","direcciones","metálico","clivaje","perfecto"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-012","cat":"Geología","sub":"Mineral","name":"Cinabrio","sci":"Cinabrio (HgS)","fam":"Sulfuro","freq":"muy_alta","key":"Rojo vivo a rojo bermellón — el mineral rojo más llamativo de todos","mnem":"El 'rubí del diablo': rojo intenso y sorprendentemente pesado — si es rojo brillante y pesa mucho, cinabrio","etym":"Del griego 'kinnabari'. Principal mineral del mercurio","notes":"CONFIRMADO como el mineral más repetido en Madrid: aparece en 3 de cada 5 convocatorias documentadas. Inconfundible por su rojo intenso. Siempre indicar: sulfuro de mercurio (HgS). PRUEBAS: (1) Color rojo bermellón intenso: el rojo más vivo de todos los minerales comunes. (2) Raya roja brillante (confirma vs. hematites que da raya rojo-ladrillo). (3) Muy pesado (dens.8.1). (4) Dureza 2-2.5. CONFUSIÓN CON: Hematites — raya rojo-ladrillo (más oscura) vs. rojo bermellón del cinabrio. Color más negro o metálico en hematites. Realgar — también rojo-naranja pero más anaranjado. Crocoíta — rojo-naranja pero cristales prismáticos aciculares.","q1":"Explica el mnemónico de Cinabrio y qué rasgos te ayuda a recordar.","t1":["sorprendentemente","diablo","intenso","brillante","rubí"],"q2":"Describe el carácter principal que identifica a Cinabrio a primera vista.","t2":["bermellón","llamativo","mineral","rojo","vivo"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-013","cat":"Geología","sub":"Mineral","name":"Magnetita","sci":"Magnetita (Fe₃O₄)","fam":"Óxido","freq":"media","key":"Negro metálico con raya negra","mnem":"El único mineral común que atrae un imán: negro y magnético = magnetita","etym":"De 'Magnesia', región de Tesalia (Grecia) donde se encontró por primera vez","notes":"La prueba del imán es diagnóstica. A veces acompaña a rocas máficas o aparece como arena negra magnética. PRUEBAS: (1) Acercar un imán: si es atraído = magnetita (diagnóstico definitivo). (2) Color negro metálico. (3) Raya negra. (4) Cristales octaédricos o masivo. CONFUSIÓN CON: Hematites — NO magnética (o débilmente); raya rojo-ladrillo. Cromita — también negra y pesada pero no magnética; en contexto de peridotitas. Ilmenita — no magnética; contexto ígneo máfico. Pirolusita — negra, mancha mucho los dedos.","q1":"¿Cómo usarías el mnemónico de Magnetita para no olvidarlo en el examen?","t1":["mineral","magnético","magnetita","único","común"],"q2":"¿Qué rasgo de Magnetita es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["metálico","negro","negra","raya"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-014","cat":"Geología","sub":"Mineral","name":"Hematites","sci":"Hematites (Fe₂O₃)","fam":"Óxido","freq":"media","key":"Raya rojo-bermellón inconfundible (aunque el mineral sea negro o gris metálico)","mnem":"El mineral que 'sangra' al rayar: por fuera puede ser negro pero su polvo siempre es rojo sangre","etym":"Del griego 'haima' (sangre): por el color rojo de su raya","notes":"La raya roja es la clave absoluta. Siempre se raya en el material de laboratorio. Diferenciar de magnetita por ausencia de magnetismo. PRUEBAS: (1) Rayar en placa de porcelana sin vidriar: raya ROJO-BERMELLÓN siempre, aunque el mineral sea negro o gris metálico. (2) Varios hábitos: especular (metálico), terroso (rojo), oolítico. CONFUSIÓN CON: Magnetita — magnetita es magnética y tiene raya NEGRA. Ilmenita — raya negra o gris oscura. Cinabrio — raya roja pero mucho más brillante y rojo-bermellón más vivo; muy pesado (dens.8.1).","q1":"¿Qué imagen mental evoca el mnemónico de Hematites? Descríbelo con tus palabras.","t1":["mineral","sangra","rayar","fuera","siempre"],"q2":"¿Cuál es el rasgo más diagnóstico de Hematites? Incluye al menos un término clave.","t2":["inconfundible","bermellón","raya","rojo"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-015","cat":"Geología","sub":"Mineral","name":"Olivino","sci":"Olivino ((Mg,Fe)₂SiO₄)","fam":"Nesosílicato","freq":"media","key":"Color verde oliva característico (de ahí su nombre)","mnem":"Los 'guisantes verdes' del basalto: granos redondos de color oliva incrustados en roca oscura","etym":"Del latín 'oliva' (aceituna): por su color verde-amarillento","notes":"Casi siempre en contexto de basaltos o peridotitas. El color verde en roca oscura es la señal. PRUEBAS: (1) Color verde oliva a amarillo-verdoso. (2) Cristales granulares o masivo. (3) Dureza 6.5-7. (4) Contexto: en basaltos (vidriado o en xenolitos) o en peridotitas. CONFUSIÓN CON: Epidota — verde pero más amarillento y en contexto metamórfico; cristales prismáticos. Clorita — verde más oscuro, laminar y mucho más blando. Fluorita verde — cúbica, más blanda (dur.4). Diopsido (piroxeno verde) — similar pero clivaje a 90°.","q1":"Explica el mnemónico de Olivino y qué rasgos te ayuda a recordar.","t1":["guisantes","incrustados","basalto","redondos","verdes"],"q2":"Describe el carácter principal que identifica a Olivino a primera vista.","t2":["característico","color","verde","oliva"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-016","cat":"Geología","sub":"Mineral","name":"Hornblenda (anfíbol)","sci":"Hornblenda (Ca₂(Mg,Fe,Al)₅(Al,Si)₈O₂₂(OH)₂)","fam":"Inosílicato (anfíbol)","freq":"media","key":"Negro a verde oscuro con dos clivajes a 120°/60° (ángulo diagnóstico)","mnem":"El '120 grados': si los clivajes forman un rombo (60/120°), es anfíbol","etym":"Del alemán 'Horn' (cuerno) + 'blende' (engañador)","notes":"La distinción anfíbol/piroxeno por ángulo de clivaje es un clásico de examen y puede preguntarse explícitamente. PRUEBAS: (1) Medir ángulo de clivaje: si los dos clivajes forman ~120° y ~60° = anfíbol. (2) Color negro a verde oscuro. (3) Cristales prismáticos alargados con sección hexagonal o romboidal. CONFUSIÓN CON: Augita (piroxeno) — también negra pero clivaje a 90° (ángulo recto). Biotita — laminar, sin clivaje a 120°. Turmalina — también prismática y negra pero sin clivaje; sección triangular.","q1":"¿Cómo usarías el mnemónico de Hornblenda (anfíbol) para no olvidarlo en el examen?","t1":["clivajes","grados","forman","anfíbol","rombo"],"q2":"¿Qué rasgo de Hornblenda (anfíbol) es inconfundible y difícil de atribuir a otra especie del grupo?","t2":["clivajes","negro","oscuro","verde"],"catf":"geología","subf":"mineral","hab":""},{"id":"MIN-017","cat":"Geología","sub":"Mineral","name":"Augita (piroxeno)","sci":"Augita (Ca(Mg,Fe,Al)(Al,Si)₂O₆)","fam":"Inosílicato (piroxeno)","freq":"media","key":"Negro a verde muy oscuro con dos clivajes a 90° (ángulo diagnóstico)","mnem":"El '90 grados': clivaje en ángulo recto — si los planos forman una cruz, es piroxeno (augita)","etym":"Del griego 'augé' (brillo): por su brillo vítreo","notes":"Par obligatorio con hornblenda. La regla del ángulo de clivaje es el recurso más evaluado en geología de minerales. PRUEBAS: (1) Medir ángulo de clivaje: si forman ~90° = piroxeno (augita). (2) Color negro a verde muy oscuro. (3) Cristales más cortos y compactos que la hornblenda. CONFUSIÓN CON: Hornblenda (anfíbol) — clivaje a 120° (no 90°); cristales más alargados. Biotita — laminar, elástica. Magnetita — no tiene clivaje; magnética. Turmalina — sección triangular; sin clivaje.","q1":"¿Qué imagen mental evoca el mnemónico de Augita (piroxeno)? Descríbelo con tus palabras.","t1":["clivaje","grados","ángulo","piroxeno","planos"],"q2":"¿Cuál es el rasgo más
