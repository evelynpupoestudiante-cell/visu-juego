const NAV={"Geología":{"Fósil":60,"Geomorfología":8,"Mineral":55,"Roca":50},"Botánica":{"Alga":15,"Árbol":31,"Arbusto":30,"Herbácea":47,"Pteridófito":9,"Briófito":8},"Hongos":{"Hongo ascomiceto":6,"Hongo basidiomiceto":18,"Liquen":10},"Invertebrados":{"Anélido":1,"Arácnido":4,"Cnidario":3,"Insecto":22,"Crustáceo":5,"Equinodermo":4,"Miriápodo":3,"Molusco":7,"Porífero":1},"Vertebrados":{"Anfibio":7,"Ave":30,"Mamífero":12,"Pez cartilaginoso":4,"Pez óseo":8,"Reptil":9},"Histología":{"Tejido animal":20,"Tejido vegetal":19}};

const CAT_COLORS={
  'Geología':     {fill:'#FDF0E0',stroke:'#C8922A',text:'#8A5A00',prog:'#C8922A'},
  'Botánica':     {fill:'#EAF3DE',stroke:'#3B6D11',text:'#27500A',prog:'#4A8A1A'},
  'Hongos':       {fill:'#F5EDE0',stroke:'#8B5E3C',text:'#5A3010',prog:'#8B5E3C'},
  'Invertebrados':{fill:'#E0EDF5',stroke:'#2C6E8A',text:'#0C3E58',prog:'#2C6E8A'},
  'Vertebrados':  {fill:'#EDE0F5',stroke:'#6B3FA0',text:'#3A1060',prog:'#6B3FA0'},
  'Histología':   {fill:'#F5E0E8',stroke:'#B03060',text:'#701030',prog:'#B03060'},
};
const FREQ_L={muy_alta:'Muy frecuente',alta:'Frecuente',media:'Aparece',baja:'Rara'};
const FREQ_C={muy_alta:'#c03030',alta:'#c07000',media:'#607030',baja:'#306050'};

/* ── STATE ── */
let selCat=null, selSub=null;
let SESSION=[], cur=0, stg={}, ans={}, rat={}, imgV={}, imgL={}, imgI={};

/* ── UTILS ── */
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function nrm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim()}
function sciBase(s){return(s||'').replace(/\(.*?\)/g,'').trim().split(/\s+/).slice(0,2).join('')}
function chk(txt,terms,req){const n=nrm(txt);const f=terms.filter(t=>n.includes(nrm(t)));return{found:f,miss:terms.filter(t=>!f.includes(t)),ok:f.length>=req}}
function initA(id){if(!ans[id])ans[id]={q1:{txt:'',att:0,ok:false,skp:false,res:null},q2:{txt:'',att:0,ok:false,skp:false,res:null}}}
function svg(d){return`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><path d="${d}"/></svg>`}

/* ── SELECTOR ── */
function renderSelector(){
  const cg=document.getElementById('cat-grid');
  cg.innerHTML=Object.keys(NAV).map(cat=>{
    const g=CAT_COLORS[cat]||{fill:'#eee',stroke:'#888',text:'#444'};
    const n=Object.values(NAV[cat]).reduce((a,b)=>a+b,0);
    const sel=selCat===cat;
    return`<div class="cat-card${sel?' selected':''}" style="border-color:${g.stroke};color:${g.text};background:${sel?g.fill:'#fff'}" onclick="selectCat('${cat}')">
      <div class="cat-name">${esc(cat)}</div>
      <div class="cat-count">${n} especies</div>
    </div>`;
  }).join('');

  const sp=document.getElementById('sub-panel');
  const sg=document.getElementById('sub-grid');
  if(!selCat){sp.style.display='none';}
  else{
    sp.style.display='block';
    document.getElementById('sub-panel-title').textContent=selCat+' — elige subcategoría';
    const g=CAT_COLORS[selCat]||{};
    sg.innerHTML=Object.entries(NAV[selCat]).map(([sub,n])=>{
      const act=selSub===sub;
      return`<button class="sub-btn${act?' active':''}" style="${act?'background:'+g.fill+';border-color:'+g.stroke+';color:'+g.text:''}" onclick="selectSub('${sub}')">${esc(sub)} <span style="opacity:.6;font-size:11px">(${n})</span></button>`;
    }).join('');
  }

  const cnt=selSub?NAV[selCat][selSub]:(selCat?Object.values(NAV[selCat]).reduce((a,b)=>a+b,0):0);
  const sb=document.getElementById('start-btn');
  sb.disabled=!selCat;
  document.getElementById('start-info').textContent=selCat?(selSub?`${cnt} especies — ${selSub}`:`${cnt} especies en ${selCat}`): 'Selecciona una categoría';
  const g=CAT_COLORS[selCat]||{stroke:'#333'};
  sb.style.background=g.stroke;
}

function selectCat(cat){selCat=cat;selSub=null;renderSelector();}
function selectSub(sub){selSub=(selSub===sub?null:sub);renderSelector();}

/* ── SESSION START ── */
function startSession(){
  SESSION=ALL_CARDS.filter(c=>c.cat===selCat&&(!selSub||c.sub===selSub));
  if(!SESSION.length)return;
  cur=0;stg={};ans={};rat={};imgV={};imgL={};imgI={};
  document.getElementById('selector').style.display='none';
  document.getElementById('session').style.display='block';
  const g=CAT_COLORS[selCat]||{};
  document.getElementById('sess-title').textContent=selCat+(selSub?' · '+selSub:'');
  document.getElementById('sess-sub').textContent=SESSION.length+' especies · presentación guiada';
  render();
}

function goBack(){
  document.getElementById('session').style.display='none';
  document.getElementById('selector').style.display='block';
  renderSelector();
}

/* ── IMAGE LOADING ── */
/* Image loading — mirrors exactly visu_tabla.html pattern that is known to work */
function probeImgs(c){
  if(imgV[c.id]!==undefined)return;
  imgV[c.id]='pending';
  if(!c.catf||!c.subf){imgV[c.id]=[];return;}
  const b=sciBase(c.sci);
  if(!b){imgV[c.id]=[];return;}
  const url=SCRIPT+'?probe=1&cat='+encodeURIComponent(c.catf)+'&sub='+encodeURIComponent(c.subf)+'&base='+encodeURIComponent(b);
  fetch(url)
    .then(r=>r.json())
    .then(d=>{imgV[c.id]=d.variants||[];if(imgV[c.id].length)loadImg(c,imgV[c.id][0]);else schedRender();})
    .catch(()=>{imgV[c.id]=[];schedRender();});
}

function loadImg(c,fn){
  if(!imgL[c.id])imgL[c.id]={};
  if(imgL[c.id][fn]!==undefined)return;
  imgL[c.id][fn]='loading';
  fetch(SCRIPT+'?img=1&cat='+encodeURIComponent(c.catf)+'&sub='+encodeURIComponent(c.subf)+'&file='+encodeURIComponent(fn))
    .then(r=>r.json())
    .then(d=>{imgL[c.id][fn]=d.dataUrl||null;schedRender();})
    .catch(()=>{imgL[c.id][fn]=null;schedRender();});
}

let rTimer=null;
function schedRender(){clearTimeout(rTimer);rTimer=setTimeout(render,120);}

/* ── CAROUSEL ── */
function carHTML(c){
  const g=CAT_COLORS[c.cat]||{stroke:'#888',text:'#444'};
  const b=sciBase(c.sci);
  const vars=imgV[c.id];   // undefined=never started, 'pending'=probe in flight, []=no imgs, [...]= found
  const idx=imgI[c.id]||0;
  let img;

  if(vars===undefined){
    // First time: trigger probe and show spinner
    probeImgs(c);
    img=`<div class="cph"><svg viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1" width="28" height="28"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span style="font-size:11px">Buscando...</span></div>`;
  } else if(vars==='pending'){
    // Probe in progress
    img=`<div class="cph"><span style="font-size:11px">Buscando...</span></div>`;
  } else if(!Array.isArray(vars)||!vars.length){
    // Probe done, no images
    img=`<div class="cph"><svg viewBox="0 0 24 24" fill="none" stroke="${g.stroke}" stroke-width="1.2" width="26" height="26"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/><path d="M12 8v4M12 16h.01"/></svg><span style="font-size:11px;color:${g.text}">Añadir imagen:</span><small>${b}1.jpg</small></div>`;
  } else {
    const fn=vars[idx];
    const duRaw=imgL[c.id]&&imgL[c.id][fn];
    // 'loading' means fetch in flight, null means failed, string means dataUrl
    const du=(duRaw&&duRaw!=='loading')?duRaw:null;
    if(!du){
      img=`<div class="cph"><span style="font-size:11px">Cargando imagen...</span></div>`;
      if(duRaw===undefined)loadImg(c,fn);  // trigger fetch only if not started
    } else {
      img=`<img class="cimg" src="${du}" alt="${esc(c.name)}">`;
    }
    // Preload next image
    if(vars[idx+1]){const fn2=vars[idx+1];if(!imgL[c.id]||imgL[c.id][fn2]===undefined)loadImg(c,fn2);}
  }
  const n=vars&&vars.length||0;
  const ctl=n>1?`<div class="cnav">
    <button class="cnbtn" onclick="setImg('${c.id}',${idx-1})" ${idx===0?'disabled':''}>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 12L6 8l4-4"/></svg>
    </button>
    <span class="ccount">${idx+1}&thinsp;/&thinsp;${n}</span>
    <button class="cnbtn" onclick="setImg('${c.id}',${idx+1})" ${idx===n-1?'disabled':''}>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4l4 4-4 4"/></svg>
    </button>
  </div>`:'';
  return`<div class="carousel"><div class="cimgwrap">${img}</div>${ctl}</div>`;
}

/* ── PREGUNTAS ── */
function fbHTML(id,qn){
  initA(id);const a=ans[id]['q'+qn];
  if(!a.res)return'';
  if(a.ok)return`<div class="fb fbok">&#10003; Bien — incluiste: ${a.res.found.map(t=>'<b>'+esc(t)+'</b>').join(', ')}</div>`;
  const found=a.res.found.length?'Has incluido: '+a.res.found.map(t=>'<b>'+esc(t)+'</b>').join(', ')+'. ':'';
  const c=SESSION.find(x=>x.id===id);
  if(a.att>=2){
    const all=(qn===1?c.t1:c.t2).map(t=>'<b>'+esc(t)+'</b>').join(', ');
    return`<div class="fb fbmiss">${found}Términos clave: ${all}<br><button class="skpbtn" style="margin-top:6px" onclick="skipQ('${id}',${qn})">Entendido, continuar &rarr;</button></div>`;
  }
  return`<div class="fb fbmiss">${found}Intenta incluir: ${a.res.miss.slice(0,2).map(t=>'<b>'+esc(t)+'</b>').join(' o ')}.</div>`;
}

function qHTML(c,qn){
  initA(c.id);const a=ans[c.id]['q'+qn];
  if(a.ok||a.skp){
    return`<div class="qdone">${a.ok?'<span style="color:#1a6b38">&#10003;</span>':'<span style="color:#aaa">&#10003;</span>'} ${a.ok?'Reflexión registrada':'Continuado sin completar'}</div>`;
  }
  const q=qn===1?c.q1:c.q2;
  return`<div class="qblock">
    <div class="qlbl">Reflexión activa &mdash; pregunta ${qn} de 2</div>
    <div class="qtxt">${esc(q)}</div>
    <textarea id="q${qn}-${c.id}" oninput="sQ('${c.id}',${qn},this.value)" placeholder="Escribe al menos una frase…">${esc(a.txt)}</textarea>
    <div id="fb-${c.id}-${qn}">${fbHTML(c.id,qn)}</div>
    <div class="qrow">
      <button class="chkbtn" onclick="cQ('${c.id}',${qn})">&#10003; Comprobar</button>
      ${a.att>=2?`<button class="skpbtn" onclick="skipQ('${c.id}',${qn})">Ver términos</button>`:''}
    </div>
  </div>`;
}

/* ── RENDER ── */
function render(){
  if(cur>=SESSION.length){showSum();return;}
  const c=SESSION[cur];
  const g=CAT_COLORS[c.cat]||{fill:'#eee',stroke:'#888',text:'#444',prog:'#888'};
  initA(c.id);
  // probeImgs is called by carHTML when needed
  if(SESSION[cur+1])probeImgs(SESSION[cur+1]);  // preload next card probe

  const s=stg[c.id]||0;
  const a=ans[c.id];
  const q1done=a.q1.ok||a.q1.skp;
  const q2done=a.q2.ok||a.q2.skp;
  const r=rat[c.id];
  const pct=Math.round(cur/SESSION.length*100);

  document.getElementById('pg').style.cssText='width:'+pct+'%;background:'+g.prog;
  document.getElementById('pgnum').textContent=(cur+1)+'/'+SESSION.length;
  document.getElementById('ctr').textContent=c.name+' · '+c.sub;
  document.getElementById('pb').disabled=cur===0;
  const nb=document.getElementById('nb');
  if(cur===SESSION.length-1){
    nb.innerHTML='Ver resultados <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><rect x="2" y="10" width="3" height="4"/><rect x="6.5" y="6" width="3" height="8"/><rect x="11" y="2" width="3" height="12"/></svg>';
    nb.onclick=showSum;
  } else {
    nb.innerHTML='Siguiente <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><path d="M6 4l4 4-4 4"/></svg>';
    nb.onclick=()=>nav(1);
  }

  let h=`<div class="card"><div class="ctop">
    ${carHTML(c)}
    <div class="infop">
      <span class="grpbadge" style="background:${g.fill};color:${g.text};border-color:${g.stroke}">${esc(c.sub)}</span>
      <div>
        <div class="sname">${esc(c.name)}</div>
        <div class="ssci">${esc(c.sci)}</div>
        <div class="smeta">
          <span>${esc(c.fam)}</span>
          <span class="freq-tag" style="color:${FREQ_C[c.freq]||'#666'}">${FREQ_L[c.freq]||c.freq}</span>
        </div>
      </div>
      <div class="mnemblock" style="border-left-color:${g.stroke};background:${g.fill}60">
        <div class="mnlbl" style="color:${g.text}">&#x1F4A1; Mnemónico</div>
        <div class="mntxt" style="color:${g.text}">${esc(c.mnem)}</div>
      </div>
    </div>
  </div>`;

  h+=qHTML(c,1);

  if(q1done&&s===0){
    h+=`<button class="stgbtn" onclick="adv('${c.id}')"><span>&#x1F511; Ver carácter diagnóstico</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><path d="M4 6l4 4 4-4"/></svg></button>`;
  }

  if(s>=1){
    h+=`<div class="stgcnt"><div class="dlbl">Carácter diagnóstico</div><div class="keytxt">${esc(c.key)}</div></div>`;
    h+=qHTML(c,2);
    if(q2done&&s===1){
      h+=`<button class="stgbtn" onclick="adv('${c.id}')"><span>&#x2139;&#xFE0F; Ver etimología, hábitat y notas de examen</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><path d="M4 6l4 4 4-4"/></svg></button>`;
    }
  }

  if(s>=2){
    const nb2=c.notes?`<div class="notesblock" style="background:${g.fill}40;border-color:${g.stroke}50"><div class="noteslbl" style="color:${g.text}">Notas de examen</div><div class="notestxt" style="color:${g.text}">${esc(c.notes)}</div></div>`:'';
    h+=`<div class="stgcnt">
      <div class="g2">
        <div>
          ${c.etym?`<div class="dlbl">Etimología</div><div class="dtxt">${esc(c.etym)}</div>`:''}
          ${c.hab?`<div class="dlbl" style="margin-top:${c.etym?'8px':'0'}">Hábitat en Madrid</div><div class="dtxt">${esc(c.hab)}</div>`:''}
        </div>
        <div>${c.bio?`<div class="dlbl">Piso bioclimático</div><div class="dtxt">${esc(c.bio)}</div>`:''}</div>
      </div>
      ${nb2}
    </div>
    <div class="rzone"><div class="rq">¿Cuánto sabías de esta especie antes de verla?</div>
    <div class="rbtnrow">
      <button class="rbtn r0${r===0?' on':''}" onclick="setR('${c.id}',0)">No la conocía</button>
      <button class="rbtn r1${r===1?' on':''}" onclick="setR('${c.id}',1)">Algo sabía</button>
      <button class="rbtn r2${r===2?' on':''}" onclick="setR('${c.id}',2)">La tenía clara</button>
    </div></div>`;
  }

  h+=`</div>`;
  document.getElementById('main').innerHTML=h;
}

/* ── ACTIONS ── */
function adv(id){stg[id]=(stg[id]||0)+1;render();}
function nav(d){cur=Math.max(0,Math.min(SESSION.length-1,cur+d));render();}
function setImg(id,idx){
  imgI[id]=idx;
  const c=SESSION.find(x=>x.id===id);
  if(c&&imgV[id]&&imgV[id][idx])loadImg(c,imgV[id][idx]);
  render();
}
function setR(id,v){rat[id]=v;render();}
function sQ(id,qn,v){initA(id);ans[id]['q'+qn].txt=v;}
function cQ(id,qn){
  initA(id);
  const c=SESSION.find(x=>x.id===id);
  const a=ans[id]['q'+qn];
  const ta=document.getElementById('q'+qn+'-'+id);
  if(ta)a.txt=ta.value;
  if(!a.txt.trim()||a.txt.trim().length<8){
    document.getElementById('fb-'+id+'-'+qn).innerHTML='<div class="fb fbmiss">Escribe al menos una frase antes de comprobar.</div>';
    return;
  }
  const terms=qn===1?c.t1:c.t2;
  const res=chk(a.txt,terms,2);
  a.att++;a.res=res;
  if(res.ok)a.ok=true;
  render();
  setTimeout(()=>{const ta2=document.getElementById('q'+qn+'-'+id);if(ta2&&!a.ok&&!a.skp)ta2.focus();},60);
}
function skipQ(id,qn){initA(id);ans[id]['q'+qn].skp=true;render();}

/* ── SUMMARY ── */
function showSum(){
  document.getElementById('pg').style.cssText='width:100%;background:#4a8a1a';
  document.getElementById('nav').style.display='none';
  const r0=Object.values(rat).filter(v=>v===0).length;
  const r1=Object.values(rat).filter(v=>v===1).length;
  const r2=Object.values(rat).filter(v=>v===2).length;
  const q1p=Object.values(ans).filter(a=>a.q1.ok).length;
  const q2p=Object.values(ans).filter(a=>a.q2.ok).length;
  let ins='';
  if(r0>SESSION.length/2) ins=`${r0} especies completamente nuevas. En la herramienta completa con SM-2, el algoritmo las reprogramaría para mañana.`;
  else if(r2>SESSION.length/2) ins=`${r2} especies ya dominadas. El algoritmo SM-2 las espaciaría 7-15 días para optimizar el tiempo de estudio.`;
  else ins=`Mezcla de conocidas y nuevas — el perfil ideal para empezar el repaso espaciado.`;

  document.getElementById('main').innerHTML=`<div class="sumwrp">
    <div class="sumttl">&#10003; Sesión completada</div>
    <div class="sumsub">${SESSION.length} especies &middot; ${q1p+q2p} de ${Object.keys(ans).length*2} preguntas respondidas correctamente</div>
    <div class="sumgrd">
      <div class="sumcard"><div class="sumnum" style="color:#903030">${r0}</div><div class="sumlbl">No la conocía</div></div>
      <div class="sumcard"><div class="sumnum" style="color:#806000">${r1}</div><div class="sumlbl">Algo sabía</div></div>
      <div class="sumcard"><div class="sumnum" style="color:#1a6b38">${r2}</div><div class="sumlbl">La tenía clara</div></div>
    </div>
    <div class="sumins">${esc(ins)}</div>
    <div class="sum-btns">
      <button class="rstbtn" onclick="restart()">&#8635; Repetir bloque</button>
      <button class="selbtn" onclick="goBack()">Elegir otro bloque</button>
    </div>
  </div>`;
}

function restart(){
  cur=0;stg={};ans={};rat={};imgI={};
  document.getElementById('nav').style.display='flex';
  render();
}

/* ── INIT ── */
renderSelector();
</script>
</body>
</html>
